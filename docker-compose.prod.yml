version: "3.9"

# Production stack. Assumes a reverse proxy (nginx/Caddy/Traefik) in front of
# this host terminating TLS and routing:
#   app.secritou.com     -> client (port 8080)
#   api.secritou.com     -> server (port 5000)
#   minio.secritou.com   -> minio (port 9000, S3 API)
# The client container (client/Dockerfile + client/nginx.conf) only serves
# static files on :8080 — it does not terminate TLS itself, matching how the
# dev stack already runs it. Do the same for MinIO: proxy minio.secritou.com
# to the minio service's :9000 and let the edge proxy handle certificates.
# The MinIO console (:9001) is intentionally not exposed here; use an SSH
# tunnel or a separately-protected internal route if you need it.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-secritou_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-secritou_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No ports published to the host: reverse proxy should reach this
    # over the compose network (service name "minio", port 9000).

  # SEC-041: RG-015 (module IA auto-hébergé via Ollama) had no Ollama service in this compose —
  # OLLAMA_URL's default (http://localhost:11434) resolved to the server container itself, not a
  # real Ollama instance. server/.env must set OLLAMA_URL=http://ollama:11434 (compose DNS) in
  # this environment.
  #
  # SEC-047: the healthcheck only proves the ollama process answers, not that a model is present
  # — a fresh volume starts with zero models pulled. ollama-pull below does the actual pull as a
  # one-shot job; server's own depends_on stays on ollama's healthcheck only (not ollama-pull), so
  # a server restart never re-waits on a pull that already completed once against the shared
  # volume.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No port published to the host: only the server container needs to reach this, over the
    # compose network (service name "ollama", port 11434).

  # One-shot: pulls OLLAMA_MODEL (default mistral) into the shared ollama_data volume once ollama
  # is up. Idempotent — a no-op if the model is already present (e.g. after a redeploy).
  #
  # SEC-052: OLLAMA_MODEL must come from server/.env (env_file below) — server itself reads
  # OLLAMA_MODEL from the same file. ${OLLAMA_MODEL} written directly in entrypoint/environment
  # is interpolated by Compose at YAML-parse time (host shell / a root .env), before env_file is
  # ever injected into the container — confirmed by testing: it silently ignores server/.env
  # entirely. $$OLLAMA_MODEL (escaped) is left for the container's own shell to expand at
  # runtime, using whatever env_file actually injected.
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    env_file:
      - server/.env
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["sh", "-c", "ollama pull \"$${OLLAMA_MODEL:-mistral}\""]
    restart: "no"

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    restart: unless-stopped
    env_file:
      - server/.env
    environment:
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      ollama:
        condition: service_healthy
    ports:
      - "5000:5000"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  redis_data:
  minio_data:
  ollama_data:
