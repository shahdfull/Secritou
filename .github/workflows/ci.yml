name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

# SEC-023: actions pinned to commit SHA (not a mutable tag) for supply-chain security —
# the trailing comment is the human-readable tag, not what's actually resolved at run time.
# Dependabot (.github/dependabot.yml) keeps these SHAs up-to-date automatically.

jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint --workspace=client
      - run: npm run typecheck --workspace=client
      - run: npm run test:coverage --workspace=client
      - run: npm run build --workspace=client
      - name: Bundle secret scan
        run: |
          if grep -rE "(sk-[A-Za-z0-9]{20,}|AKIA[A-Z0-9]{16}|ghp_[A-Za-z0-9]{36})" client/dist/assets/ 2>/dev/null; then
            echo "::error::Potential secret detected in client bundle"
            exit 1
          fi
          echo "Bundle secret scan passed."

  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: secritou
          POSTGRES_PASSWORD: secritou
          POSTGRES_DB: secritou_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      NODE_ENV: test
      # SEC-212: connect_timeout/pool_timeout raised from Prisma's 5s/10s defaults — the CI
      # runner has been observed dropping a single Prisma connection attempt (SELECT 1 in each
      # test file's before()) even while Postgres answers real queries successfully throughout
      # the rest of the same run, scattered across ~16/77 test files per run. This hardens the
      # connection itself against a transient runner network blip instead of trying to guarantee
      # the service is "ready" before the process starts (already proven insufficient — the
      # skips happen well after Postgres is in active, successful use elsewhere in the run).
      DATABASE_URL: postgresql://secritou:secritou@localhost:5432/secritou_test?connect_timeout=30&pool_timeout=30
      JWT_ACCESS_SECRET: ci-test-access-secret-min-32-chars-long
      JWT_REFRESH_SECRET: ci-test-refresh-secret-min-32-chars
      CACHE_ENABLED: "true"
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      # e19f3e0 made prisma:seed call documentGeneratorService.generateInvoicePDF, which requires
      # a real S3-compatible target — see the identical MinIO setup/comment in the `e2e` job below.
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: secritou-ci
      S3_ACCESS_KEY_ID: secritou-ci
      S3_SECRET_ACCESS_KEY: secritou-ci-secret
      S3_REGION: us-east-1
      S3_PUBLIC_URL: http://localhost:9000/secritou-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Start MinIO
        run: |
          docker run -d --name ci-minio \
            -e MINIO_ROOT_USER=secritou-ci \
            -e MINIO_ROOT_PASSWORD=secritou-ci-secret \
            -p 9000:9000 \
            minio/minio:latest server /data --console-address ":9001"
      - name: Wait for Postgres and Redis to accept real queries
        # SEC-212: the `services:` health-checks (pg_isready / redis-cli ping, run INSIDE each
        # service container) only prove the server process has started accepting TCP connections,
        # not that it can reliably execute a query under runner CPU/network contention at job
        # start — the app-level connectivity checks in server/test/*.test.ts each make exactly one
        # un-retried query and permanently self-skip their whole file on a single transient
        # failure. Looping a real query here, before npm ci/any test file runs, absorbs that
        # transient window instead. Redis is probed with a raw RESP PING over a Node TCP socket
        # rather than `redis-cli`, which is not installed on the runner host (only inside the
        # redis:7-alpine service container) — confirmed by a real CI run where this step's
        # Postgres probe passed on attempt 1 but `redis-cli: command not found` silently looped
        # as a failed PING for all 30 attempts under `2>/dev/null`.
        run: |
          for i in $(seq 1 30); do
            if PGPASSWORD=secritou psql -h localhost -p 5432 -U secritou -d secritou_test -c "SELECT 1" >/dev/null 2>&1; then
              echo "Postgres ready after ${i} attempt(s)."
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::Postgres did not become queryable after 30 attempts."
              exit 1
            fi
            sleep 2
          done
          for i in $(seq 1 30); do
            if node -e "
              const net = require('node:net');
              const sock = net.createConnection({ host: 'localhost', port: 6379 }, () => sock.write('PING\r\n'));
              sock.setTimeout(2000, () => { sock.destroy(); process.exit(1); });
              sock.on('data', (data) => { process.exit(data.toString().includes('PONG') ? 0 : 1); });
              sock.on('error', () => process.exit(1));
            "; then
              echo "Redis ready after ${i} attempt(s)."
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::Redis did not respond to PING after 30 attempts."
              exit 1
            fi
            sleep 2
          done
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live >/dev/null 2>&1; then
              echo "MinIO ready after ${i} attempt(s)."
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::MinIO did not become healthy after 30 attempts."
              exit 1
            fi
            sleep 2
          done
      - run: npm ci
      - run: npm run prisma:validate --workspace=server
      - run: npm run prisma:format:check --workspace=server
      - run: npm run prisma:generate --workspace=server
      - name: Apply migrations
        run: npx prisma migrate deploy
        working-directory: server
      - name: Create shadow database
        run: |
          PGPASSWORD=secritou psql -h localhost -p 5432 -U secritou -d secritou_test \
            -c "CREATE DATABASE secritou_shadow;"
      - name: Schema drift check
        env:
          SHADOW_DATABASE_URL: postgresql://secritou:secritou@localhost:5432/secritou_shadow
        # SEC-193: Invoice.[projectId,invoiceType] and Proposal.leadId are real PARTIAL unique
        # indexes (see comments on those models in schema.prisma) — a form `prisma migrate diff`
        # always reports as "missing" because Prisma's schema DSL cannot express a WHERE clause.
        # SEC-031: ExecutiveKpiSnapshot.[serviceId,monthStart] is the same situation — a
        # COALESCE-based partial index (migration 20260730100000), also inexpressible in
        # schema.prisma. Diffed as text and filtered to ignore only these 3 known lines, not
        # `--exit-code`, so any OTHER drift on any other table still fails this step.
        run: |
          cd server
          DIFF_OUTPUT=$(npx prisma migrate diff --from-migrations ./prisma/migrations --to-schema-datamodel ./prisma/schema.prisma --shadow-database-url "${SHADOW_DATABASE_URL}")
          echo "$DIFF_OUTPUT"
          UNEXPECTED=$(echo "$DIFF_OUTPUT" | grep -E '^\[\+\]|^\[-\]|^\[\*\]' | grep -v 'Added unique index on columns (projectId, invoiceType)' | grep -v 'Added unique index on columns (leadId)' | grep -v 'Added unique index on columns (serviceId, monthStart)' | grep -v "Changed the \`Invoice\` table" | grep -v "Changed the \`Proposal\` table" | grep -v "Changed the \`ExecutiveKpiSnapshot\` table" || true)
          if [ -n "$UNEXPECTED" ]; then
            echo "::error::Unexpected schema drift beyond the known SEC-193 partial indexes:"
            echo "$UNEXPECTED"
            exit 1
          fi
          echo "Schema drift check passed (only the known SEC-193 partial indexes differ)."
      - run: npm run lint --workspace=server
      - run: npm run typecheck --workspace=server
      - name: Create S3 bucket
        # See the identical step/comment in the `e2e` job below.
        run: |
          node -e "
            const { S3Client, CreateBucketCommand } = require('@aws-sdk/client-s3');
            const client = new S3Client({
              region: process.env.S3_REGION,
              endpoint: process.env.S3_ENDPOINT,
              forcePathStyle: true,
              credentials: {
                accessKeyId: process.env.S3_ACCESS_KEY_ID,
                secretAccessKey: process.env.S3_SECRET_ACCESS_KEY,
              },
            });
            client.send(new CreateBucketCommand({ Bucket: process.env.S3_BUCKET }))
              .then(() => console.log('Bucket created:', process.env.S3_BUCKET))
              .catch((e) => { console.error(e); process.exit(1); });
          "
        working-directory: server
      - name: Seed database
        # SEC-212 real root cause: this job migrates secritou_test but never seeded it, so the
        # Service table (and other seed-only reference rows) was always empty here — deterministic
        # across every run, not infra flakiness. At least 18 test files' before() hooks throw when
        # a required seed row is missing (e.g. commissionService.test.ts: `const service = await
        # prisma.service.findFirst(); if (!service) throw new Error("no Service seeded")`), which
        # their catch block reports identically to "no reachable database" — self-skipping the
        # whole file and dragging coverage under the threshold. Confirmed by reproducing locally
        # against fresh, healthy Docker containers (zero CI runner involved): same skips, same
        # coverage percentages to the decimal, while files with a bare `SELECT 1` (no seed
        # dependency) passed cleanly with real DB traffic throughout the same run.
        run: npm run prisma:seed --workspace=server
      - run: npm run test:coverage --workspace=server
      - name: Redis unreachable resilience test (SEC-083/084/085)
        # Deliberately not part of run-all.test.ts: this file points REDIS_HOST/REDIS_PORT/
        # REDIS_URL at a closed port before importing app.js, and env.ts's REDIS_* singleton is
        # shared process-wide by every file in that same run — doing this inside run-all.test.ts
        # would break every other test needing the real Redis service above. Run alone instead.
        run: npx tsx --test test/redisUnreachableEndToEnd.test.ts
        working-directory: server
      - run: npm run build --workspace=server
      - name: Circular dependency check
        run: npx --yes madge --circular --extensions ts src/
        working-directory: server

  restore-smoke-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: secritou
          POSTGRES_PASSWORD: secritou
          POSTGRES_DB: secritou_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://secritou:secritou@localhost:5432/secritou_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate --workspace=server
      - name: Apply migrations
        run: npx prisma migrate deploy
        working-directory: server
      - name: Dump test DB (custom format)
        run: |
          PGPASSWORD=secritou pg_dump \
            --host=localhost --port=5432 --username=secritou \
            --format=custom --no-owner --no-acl \
            secritou_test > /tmp/test.dump
          echo "Dump size: $(du -h /tmp/test.dump | cut -f1)"
      - name: Create restore target DB
        run: |
          PGPASSWORD=secritou psql \
            -h localhost -p 5432 -U secritou -d postgres \
            -c "CREATE DATABASE secritou_restore;"
      - name: Restore dump to new DB
        run: |
          PGPASSWORD=secritou pg_restore \
            --host=localhost --port=5432 --username=secritou \
            --dbname=secritou_restore \
            --no-owner --no-acl --jobs=2 \
            /tmp/test.dump
      - name: Smoke-test restored DB
        run: |
          PGPASSWORD=secritou psql \
            -h localhost -p 5432 -U secritou -d secritou_restore \
            -c "SELECT tablename FROM pg_tables WHERE schemaname='public' ORDER BY tablename;" \
            -c "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public';"
          echo "Restore smoke-test passed."

  i18n-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: node scripts/check-i18n.mjs

  contrast-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: node scripts/check-contrast.mjs

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: secritou
          POSTGRES_PASSWORD: secritou
          POSTGRES_DB: secritou_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      NODE_ENV: development
      # SEC-212: see the identical DATABASE_URL comment in the `server` job.
      DATABASE_URL: postgresql://secritou:secritou@localhost:5432/secritou_test?connect_timeout=30&pool_timeout=30
      JWT_ACCESS_SECRET: ci-test-access-secret-min-32-chars-long
      JWT_REFRESH_SECRET: ci-test-refresh-secret-min-32-chars
      CACHE_ENABLED: "true"
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      FRONTEND_URL: http://localhost:5173
      PLAYWRIGHT_SKIP_WEB_SERVER: "true"
      # e19f3e0 made prisma:seed call documentGeneratorService.generateInvoicePDF, which requires
      # a real S3-compatible target. MinIO can't be declared under `services:` here — its image
      # has no default CMD that starts the server (`minio` alone just prints --help; GitHub
      # Actions service containers only support `env`/`ports`/`options`, none of which can supply
      # the required `server /data` command) — so it's started as a plain background step below
      # instead, same pattern as "Start server" further down this job.
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: secritou-ci
      S3_ACCESS_KEY_ID: secritou-ci
      S3_SECRET_ACCESS_KEY: secritou-ci-secret
      S3_REGION: us-east-1
      S3_PUBLIC_URL: http://localhost:9000/secritou-ci
      # ai-assistant-action-proposal.spec.ts needs a real Ollama to answer — without this, the
      # server falls back to its OLLAMA_URL default (http://localhost:11434), which nothing on
      # this runner is listening on (confirmed via a real CI failure: the test timed out after
      # 3.7min instead of the full 220s wait, consistent with a connection attempt that never
      # resolves rather than a slow-but-answering model).
      OLLAMA_URL: http://localhost:11434
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Start MinIO
        run: |
          docker run -d --name ci-minio \
            -e MINIO_ROOT_USER=secritou-ci \
            -e MINIO_ROOT_PASSWORD=secritou-ci-secret \
            -p 9000:9000 \
            minio/minio:latest server /data --console-address ":9001"
      - name: Start Ollama and pull qwen2.5:3b-instruct
        # ai-assistant-action-proposal.spec.ts talks to a real Ollama (RG-015, no mock), same as
        # docker-compose.prod.yml's ollama + ollama-pull services. Pulling ~2GB adds real minutes
        # to this job — accepted deliberately (2026-08-02 decision) to keep this journey testing
        # against the real LLM rather than a mock that couldn't catch a real tool-calling failure.
        run: |
          docker run -d --name ci-ollama -p 11434:11434 ollama/ollama:latest
          for i in $(seq 1 30); do
            if curl -sf http://localhost:11434/ >/dev/null 2>&1; then
              echo "Ollama ready after ${i} attempt(s)."
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::Ollama did not become ready after 30 attempts."
              exit 1
            fi
            sleep 2
          done
          docker exec ci-ollama ollama pull qwen2.5:3b-instruct
      - name: Wait for Postgres and Redis to accept real queries
        # SEC-212: see the identical step in the `server` job — same runner-contention symptom
        # observed here as the app server's first real request (login) being slow enough to trip
        # Playwright's default 5s expect() timeout while Postgres/Redis are still warming up.
        # Redis is probed with a raw RESP PING over a Node TCP socket rather than `redis-cli`,
        # which is not installed on the runner host (only inside the redis:7-alpine service
        # container) — confirmed by a real CI run of the `server` job where the Postgres probe
        # passed on attempt 1 but `redis-cli: command not found` silently looped as a failed PING
        # for all 30 attempts under `2>/dev/null`.
        run: |
          for i in $(seq 1 30); do
            if PGPASSWORD=secritou psql -h localhost -p 5432 -U secritou -d secritou_test -c "SELECT 1" >/dev/null 2>&1; then
              echo "Postgres ready after ${i} attempt(s)."
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::Postgres did not become queryable after 30 attempts."
              exit 1
            fi
            sleep 2
          done
          for i in $(seq 1 30); do
            if node -e "
              const net = require('node:net');
              const sock = net.createConnection({ host: 'localhost', port: 6379 }, () => sock.write('PING\r\n'));
              sock.setTimeout(2000, () => { sock.destroy(); process.exit(1); });
              sock.on('data', (data) => { process.exit(data.toString().includes('PONG') ? 0 : 1); });
              sock.on('error', () => process.exit(1));
            "; then
              echo "Redis ready after ${i} attempt(s)."
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::Redis did not respond to PING after 30 attempts."
              exit 1
            fi
            sleep 2
          done
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live >/dev/null 2>&1; then
              echo "MinIO ready after ${i} attempt(s)."
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::MinIO did not become healthy after 30 attempts."
              exit 1
            fi
            sleep 2
          done
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run prisma:generate --workspace=server
      - name: Apply migrations
        run: npx prisma migrate deploy
        working-directory: server
      - name: Create S3 bucket
        # MinIO starts with no buckets — create the one the seed script's
        # documentGeneratorService.generateInvoicePDF (e19f3e0) uploads generated invoice PDFs
        # into, using the same AWS SDK client already a dependency of server/ rather than adding
        # a new CLI dependency (aws-cli/mc) to the runner.
        run: |
          node -e "
            const { S3Client, CreateBucketCommand } = require('@aws-sdk/client-s3');
            const client = new S3Client({
              region: process.env.S3_REGION,
              endpoint: process.env.S3_ENDPOINT,
              forcePathStyle: true,
              credentials: {
                accessKeyId: process.env.S3_ACCESS_KEY_ID,
                secretAccessKey: process.env.S3_SECRET_ACCESS_KEY,
              },
            });
            client.send(new CreateBucketCommand({ Bucket: process.env.S3_BUCKET }))
              .then(() => console.log('Bucket created:', process.env.S3_BUCKET))
              .catch((e) => { console.error(e); process.exit(1); });
          "
        working-directory: server
      - name: Seed database
        run: npm run prisma:seed --workspace=server
      - run: npm run build --workspace=client
      - name: Start server
        # SEC-212 follow-up: the e2e suite's sequential writes across specs (proposal/invoice/
        # project mutations) can exceed sensitiveWriteRateLimit (10/min, a real production
        # security control) well before the suite finishes — E2E_RELAXED_RATE_LIMITS raises the
        # ceiling for this server process only (enforced at boot to never be settable in
        # production, see server/src/config/env.ts).
        run: E2E_RELAXED_RATE_LIMITS=true npm run dev --workspace=server > server.log 2>&1 &
      - name: Wait for server
        run: npx wait-on http://localhost:5000/api/v1/health -t 60000
      - name: Start client preview
        # SEC-212: PLAYWRIGHT_SKIP_WEB_SERVER=true (set in this job's env) means Playwright's own
        # `webServer` block in playwright.config.ts — where VITE_E2E=true is set — is never
        # invoked; this manual step is the actual preview process e2e runs against, so VITE_E2E
        # must be set here too. Without it, client/vite.config.ts serves the production CSP
        # (connect-src 'self' https:, no plain http://), which silently blocks every browser API
        # call to http://localhost:5000 — confirmed via a captured CSP violation in a Playwright
        # trace ("Connecting to 'http://localhost:5000/api/v1/auth/login' violates ... connect-src
        # 'self' https:"). Missed on the first attempt at this fix because a local repro against
        # Playwright's built-in webServer (not CI's actual invocation path) passed.
        run: VITE_E2E=true npm run preview --workspace=client > client-preview.log 2>&1 &
      - name: Wait for client
        run: npx wait-on http://localhost:5173 -t 60000
      - run: npx playwright test --reporter=list
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
