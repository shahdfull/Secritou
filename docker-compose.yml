version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: secritou
      POSTGRES_PASSWORD: secritou
      POSTGRES_DB: secritou_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secritou -d secritou_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3-compatible API
      - "9001:9001"   # MinIO Console (web UI)
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: n8n
      POSTGRES_DB: n8n
    volumes:
      - n8n_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 5

  # SEC-041: RG-015 (module IA auto-hébergé via Ollama) was marked IMPLÉMENTÉ verifie:code_direct
  # on the code path alone (llm.client.ts really does call OLLAMA_URL) — but no Ollama service
  # existed in either compose file, so OLLAMA_URL's default (http://localhost:11434) never
  # resolved to a real Ollama once the server itself ran in a container. This service, plus
  # OLLAMA_URL set in server/.env to http://ollama:11434 (compose DNS), closes that gap for dev.
  #
  # SEC-047: the healthcheck only proves the ollama process answers, not that a model is present
  # — a fresh volume starts with zero models pulled, so a naive healthcheck (or one that greps for
  # a model name) would either report healthy on an empty store or block forever waiting on a pull
  # that never runs. ollama-pull below does the actual pull as a one-shot job.
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: pulls OLLAMA_MODEL (default qwen2.5:3b-instruct, see server/.env.example) into the
  # shared ollama_data volume once ollama itself is up. Re-running docker compose up is a no-op
  # once the model is already present (ollama pull is idempotent). Not part of server's own
  # depends_on — server calling Ollama before the pull finishes gets a real "model not found"
  # error from Ollama itself rather than a silently-passing healthcheck masking it.
  #
  # SEC-052: OLLAMA_MODEL must come from server/.env (env_file below), not the host shell/a root
  # .env compose would otherwise resolve ${OLLAMA_MODEL} against — server itself reads
  # OLLAMA_MODEL from server/.env. Without env_file here, changing the model in server/.env alone
  # (which server/.env.example explicitly invites) pulls the fallback below while server requests
  # whatever was actually configured — the exact "model not found" this service exists to prevent.
  #
  # IMPORTANT: ${OLLAMA_MODEL} must NOT be written directly inside entrypoint's shell string, nor
  # under `environment:` as ${OLLAMA_MODEL} — both forms are interpolated by Compose against the
  # host shell / a root .env at YAML-parse time, before env_file is ever injected into the
  # container, so either would silently ignore server/.env entirely (confirmed: adding
  # OLLAMA_MODEL to server/.env alone had zero effect on the resolved command). $$OLLAMA_MODEL
  # (escaped, so Compose leaves it as a literal $OLLAMA_MODEL) is expanded by the container's own
  # shell at runtime instead, using whatever env_file actually injected — falling back to
  # Ollama's own default resolution if server/.env never sets it (no default is hardcoded here on
  # purpose, to avoid re-introducing the same YAML-time interpolation trap).
  # Disk-space guard added on top of the pull itself: ollama_data is a named Docker volume
  # (usually under the Docker data-root on the host disk, e.g. C:\ProgramData\DockerDesktop\vm-data
  # on Windows), so a pull can fail messily (or fill the host disk) if free space is already tight.
  # `df -Pk` reports available KB on the filesystem backing /root/.ollama inside this container,
  # which is the same underlying host disk the volume lives on. 10 Go = 10 * 1024 * 1024 Ko.
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    env_file:
      - server/.env
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint:
      - sh
      - -c
      - |
        set -e
        AVAILABLE_KB=$$(df -Pk /root/.ollama | tail -1 | awk '{print $$4}')
        MIN_KB=$$((10 * 1024 * 1024))
        if [ "$$AVAILABLE_KB" -lt "$$MIN_KB" ]; then
          AVAILABLE_GB=$$((AVAILABLE_KB / 1024 / 1024))
          echo "ollama-pull: espace disque insuffisant pour lancer 'ollama pull' ($${AVAILABLE_GB} Go libres, 10 Go minimum requis sur le volume ollama_data). Libere de l'espace disque puis relance 'docker compose up ollama-pull'." >&2
          exit 1
        fi
        ollama pull "$${OLLAMA_MODEL:-qwen2.5:3b-instruct}"
    restart: "no"

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: n8n
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: Africa/Tunis
      # Secritou's Express API runs on the host (npm run dev), not in this compose file —
      # host.docker.internal lets n8n's HTTP Request nodes reach http://host.docker.internal:5000
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-please-change-this-32-char-key}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      n8n-postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
  n8n_postgres_data:
  n8n_data:
  ollama_data:
