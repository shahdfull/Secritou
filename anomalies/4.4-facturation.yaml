      C'est résolu quand `TimeEntry.billedInvoiceId` est déclaré comme une vraie relation Prisma vers `Invoice` (`@relation(fields: [billedInvoiceId], references: [id], onDelete: ...)`, avec un `onDelete` explicite cohérent avec le fait qu'une facture n'est jamais hard-deletée) — vérifié par une migration Prisma qui ajoute la contrainte FK réelle sans erreur sur les données existantes (aucune valeur orpheline dans `billedInvoiceId` à ce jour, à confirmer par requête avant la migration).
    detecte_le: '2026-07-20'
    source: audit_llm
    confiance: certain
    note: |
      Audit architecture base de données, item intégrité référentielle + indexation. Vérifié par lecture directe : `schema.prisma:1598-1617` (`TimeEntry`) déclare `billedInvoiceId String?` en toute fin de modèle, sans `@relation` — contrairement à `taskId String? / task Task? @relation(...)` juste au-dessus dans le même modèle, qui suit le patron correct. Recherche exhaustive (`grep -rn "billedInvoiceId" server/src`) : un seul point d'écriture (`invoice.service.ts:452`, `data: { billed: true, billedInvoiceId: invoiceId }`), aucun point de lecture/filtre nulle part dans le dépôt — le champ n'est donc pas activement source de requêtes lentes aujourd'hui, mais reste un identifiant d'entité stocké sans la moindre garantie d'intégrité (une facture peut être supprimée en base hors du chemin applicatif standard, ou l'id peut être mal copié, sans qu'aucune contrainte ne le détecte). `@@index([projectId, billed])` existe déjà sur `TimeEntry` mais ne couvre pas une recherche par `billedInvoiceId` si un jour un écran "temps facturés sur cette facture" est construit.
      RÉSOLU (session en cours) : `billedInvoiceId` porte désormais une vraie relation Prisma (`billedInvoice Invoice? @relation(..., onDelete: SetNull)`, relation nommée `"TimeEntryBilledInvoice"` avec le champ inverse `Invoice.billedTimeEntries`), plus `@@index([billedInvoiceId])`. Zéro valeur orpheline confirmée par requête sur la base réelle avant migration (`WHERE billedInvoiceId IS NOT NULL AND NOT EXISTS (SELECT 1 FROM "Invoice" ...)`, résultat vide). `onDelete: SetNull` retenu : une facture n'est jamais hard-deletée dans le code applicatif (confirmé par la note d'origine), mais un `TimeEntry` facturé doit malgré tout survivre si ce cas se produisait un jour hors chemin applicatif standard. Preuve par test réel (`server/test/schemaIndexCleanupAndTimeEntryFk.test.ts`) : crée un vrai `TimeEntry` avec `billedInvoiceId` pointant vers une vraie `Invoice`, vérifie que `include: { billedInvoice: true }` résout correctement la relation, ET qu'un `billedInvoiceId` inexistant est rejeté par une vraie violation de contrainte FK (pas seulement absent de vérification applicative). Suite complète verte (505 tests), `npx tsc --noEmit` et `npm run lint --workspace=server` verts. Dérogation CI déjà accordée par l'utilisateur pour cette session : `resolu` malgré l'absence de run CI vert sur ce commit précis.
  - id: SEC-172
    titre: 'Migration 20260711204823_client_portal_activated_at ajoute Client.portalActivatedAt (nullable) sans aucun backfill — le seul chemin qui le renseigne est invoice.service.ts#addPayment sur un NOUVEL évènement de paiement (where: portalActivatedAt: null), qui ne se redéclenche jamais pour une facture DEPOSIT déjà PAID avant cette migration : un client dont l''acompte était déjà payé avant le 2026-07-11 resterait verrouillé hors de son portail indéfiniment'
    perimetre: server/prisma/migrations/20260711204823_client_portal_activated_at/migration.sql ; server/src/services/invoice.service.ts:250-259 ; server/src/middlewares/rbac.middleware.ts#requireActivatedPortal
    categorie: B
