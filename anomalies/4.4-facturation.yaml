    confiance: certain
    note: |
      Découvert en exécutant réellement le volet 2 d'une demande explicite du porteur (« vérifier la cohérence affiché vs stocké sur un cas réel en dev : générer une facture PDF et comparer chaque montant affiché au Invoice correspondant en base »). Script de vérification ponctuel (non committé, supprimé après usage) : crée un vrai `Client`/`Project`/`Invoice` (amountHT=370.37, tvaRate=0.19, tvaAmount=70.37, amount=440.74, valeurs volontairement non rondes pour détecter tout ré-arrondi silencieux), appelle réellement `documentGeneratorService.generateInvoicePDF`, télécharge le PDF réellement produit depuis MinIO (même chemin S3 que la production), en extrait le texte via `pdf-parse`. Résultat : les trois premières lignes (Montant HT, TVA, Montant TTC) correspondent exactement aux valeurs stockées (370,370 / 70,370 / 440,740 TND) — cohérence confirmée jusqu'à la 3e décimale (millime). Écart trouvé sur la 5e ligne : « Net à payer 441,340 TND » (441.34), alors que `Invoice.amount` réellement stocké en base est 440.74 — un écart de exactement 0.6 TND, la valeur de `TIMBRE_FISCAL` (`documentGenerator.service.ts:10`, commentaire ligne 9 : « barème en vigueur — à confirmer avec un comptable »). Confirmé par grep exhaustif que `TIMBRE_FISCAL` n'existe nulle part ailleurs dans `src/` — jamais lu par `invoice.service.ts#addPayment` (qui compare `data.amount` cumulé à `invoice.amount` seul, `invoice.service.ts:238-241`) ni par aucun repository. Impact concret : un client qui règle fidèlement le « Net à payer » écrit sur son PDF de facture (le seul montant qui lui est présenté comme dû) déclenche systématiquement la branche `overpaidBy > 0` d'`addPayment` (ligne 241, 264-267) — création automatique d'un `CreditNote` de 0.6 TND et d'une notification « trop-perçu » pour un paiement pourtant exact et volontaire, à chaque facture émise avec le régime TVA (donc chaque facture réelle du dépôt). Gravité `majeur` (pas `bloquant`) : aucune perte financière (l'avoir de 0.6 TND reste correctement crédité au client via le mécanisme déjà existant), mais un vrai défaut d'expérience/comptabilité qui génère un bruit systématique (CreditNote + notification) sur 100% des factures TVA, jamais remarqué car jamais testé bout-en-bout jusqu'ici (aucun test n'appelle `generateInvoicePDF` et ne compare son contenu réel au stockage — confirmé par grep `generateInvoicePDF` sur `server/test/`).
      DÉCISION DU PORTEUR (2026-07-23, AskUserQuestion) : stocker le timbre comme champ réel sur `Invoice` (option recommandée), valeur 0.6 TND confirmée comme le barème réellement en vigueur (plus « à confirmer avec un comptable ») — voir REFERENTIEL.md §7 et RG-024.
      CORRIGÉ (même session) : 1) `TIMBRE_FISCAL` déplacé de `documentGenerator.service.ts` (constante locale au fichier) vers `server/src/utils/vat.ts` (single source of truth fiscale du dépôt, déjà `TVA_RATE`/ `DEPOSIT_RATE`). 2) Migration `20260723120000_invoice_timbre_fiscal` : `Invoice.timbreFiscal Decimal? @db.Decimal(14,3)`. Factures DEPOSIT/BALANCE déjà existantes laissées `NULL` volontairement — un retraitement rétroactif de `amount` changerait un montant stocké sur des lignes potentiellement déjà payées/réconciliées. 3) `invoice.service.ts#createDepositInvoiceTx` et `#createBalanceInvoiceTx` (les 2 seuls chemins dont le PDF est réellement généré via `generateInvoicePDF`, vérifié par grep sur chaque `kind: "invoice"` enfilé — `proposal.service.ts` ligne 528 et `project.service.ts` ligne 416) : `amount` inclut désormais `roundMoney(vat.amountTTC + TIMBRE_FISCAL)`, `timbreFiscal` stocké à part. `createFromProposal` (facture STANDARD, jamais affichée avec timbre) et `invoiceService.create` (facture manuelle, montant fourni par l'appelant) volontairement NON touchés — hors du périmètre du bug observé, décision explicite du porteur (AskUserQuestion) de ne pas étendre par cohérence spéculative. 4) `documentGenerator.service.ts#generateInvoicePDF` : ne recalcule plus « Net à payer » = `amount + TIMBRE_FISCAL` (double-comptage désormais que `amount` l'inclut déjà) — lit `invoice.timbreFiscal`, affiche `amount` tel quel comme Net à payer, et déduit un « Montant TTC » (`amount - timbreFiscal`) pour le détail HT/TVA/TTC. 5) `invoiceService.addPayment` : AUCUN changement — comparait déjà `Invoice.amount` seul ; c'était le bon comportement, le défaut était uniquement l'écart entre ce que `amount` contenait et ce que le PDF affichait. Test réel ajouté : `server/test/invoiceTimbreFiscalNoOverpay.test.ts` (2 cas) — appelle le vrai `proposalService.acceptWithCascade` puis `invoiceService.addPayment` avec exactement `Invoice.amount` (le « Net à payer » réel), vérifie `timbreFiscal` stocké correctement et `creditNote === null`/`overpaidBy === 0` sur ce paiement exact. `npm run typecheck`/`npm run lint` --workspace=server vérifiés propres. Grep exhaustif des tests existants pour tout appel à `createDepositInvoiceTx`/`createBalanceInvoiceTx`/tout assert sur `Invoice.amount` en dur (pas seulement `amountHT`) : aucun trouvé — pas de régression attendue sur la suite existante. Non exécuté contre une vraie base au moment de ce commit : Docker local toujours indisponible (incident signalé sous SEC-200/201, non résolu) — poussé sans confirmation locale, la CI fera foi. Statut laissé `en_cours` : ni exécuté localement ni observé vert en CI au moment de cette note.
      CLÔTURE (2026-07-23, même session, commit `8cab25a`) : run CI confirmé vert (rapporté directement par le porteur) — critère satisfait. `resolu`.
  - id: SEC-199
    titre: 'Traçabilité AuditLog incomplète sur le cycle facture→paiement→avoir : invoiceService.create n''écrit AUCUNE entrée AuditLog (la création même d''une facture n''est pas tracée), et l''avoir automatique créé par addPayment lors d''un surpaiement (createCreditNoteTx, partagée avec creditNoteService.create) n''a pas sa propre entrée AuditLog — seul le log invoice.payment.add mentionne overpaidBy en passant, sans jamais tracer explicitement l''id/numéro du CreditNote créé'
    perimetre: 'server/src/services/invoice.service.ts#create (aucun audit log) et #addPayment (crédit automatique non audité par lui-même) ; server/src/services/creditNote.service.ts#createCreditNoteTx (fonction partagée, auditée seulement côté appelant manuel)'
    categorie: G
    regle_violee: null
    classe: auditlog_couverture_incomplete_cycle_financier
    gravite: majeur
    statut: resolu
    critere_de_resolution: |
      C'est résolu quand un scénario réel création-facture → envoi → paiement-avec-surpaiement → application-d'avoir produit une entrée `AuditLog` distincte pour CHAQUE mutation financière réelle, chacune identifiable par son `entityId` propre — en particulier : une entrée `action: "invoice.create"` (ou équivalent) au moment de `invoiceService.create`, ET une entrée dont l'`entityId` est celui du `CreditNote` créé automatiquement par un surpaiement (pas seulement une mention `overpaidBy` dans le log du paiement) — prouvé par une relecture des lignes `AuditLog` réellement produites par ce scénario exact, pas par une lecture du code seul.
    detecte_le: '2026-07-22'
    source: manuel
    confiance: certain
    note: |
      Découvert en exécutant réellement le volet 4 d'une demande explicite du porteur (« vérifier la traçabilité AuditLog sur au moins un scénario complet — création facture → paiement → avoir — en relisant les entrées before/after générées en dev »). Script ponctuel (non committé, supprimé après usage) : `invoiceService. create` → `invoiceService.send` → `invoiceService.addPayment` (paiement de 1050 sur une facture de 1000, surpaiement de 50, déclenchant la création automatique d'un `CreditNote` via `createCreditNoteTx`) → `creditNoteService.applyCredit` (applique cet avoir sur une seconde facture de 30). Résultat réel : 4 lignes `AuditLog` trouvées (`invoice.send`, `invoice.payment.add`, `invoice.send` de la 2e facture, `creditNote.apply`) — 2 attendues manquantes. (1) Aucune ligne pour la création de la première facture : confirmé par lecture directe, `invoiceService.create` (`invoice.service.ts:127-131`) n'appelle jamais `auditLogService.record`, contrairement à `cancel`/`delete`/ `restore`/`send`/`addPayment` qui le font tous. Grep exhaustif confirme 11 méthodes de mutation de ce fichier sans aucun audit log (`create`, `update`, `setReminderPaused`, `addItem`, `updateItem`, `deleteItem`, `addItemsFromTimeEntries`, `addReminder`, `createFromProposal`, `createDepositInvoiceTx`, `createBalanceInvoiceTx`) contre seulement 5 qui en ont — portée plus large que ce seul scénario, non étendue à toutes les 11 dans cette entrée (à trancher séparément si le porteur veut auditer chaque mutation ou seulement les plus sensibles). (2) Aucune ligne dont l'`entityId` est le `CreditNote` créé automatiquement par le surpaiement : `createCreditNoteTx` (`creditNote.service.ts:35-43`, fonction partagée) n'a elle-même aucun appel `auditLogService. record` — seul son appelant manuel, `creditNoteService.create` (ligne 69), logge après coup avec `entityId: creditNote.id`. Le chemin automatique (`invoice.service.ts:266`, appelé depuis `addPayment`) ne fait que ce même appel `createCreditNoteTx`, donc hérite de la même absence de log — le seul log produit (`invoice.payment.add`) mentionne `overpaidBy: 50` mais jamais l'id ou le numéro du `CreditNote` réellement créé, rendant impossible de relier directement ce log au futur `creditNote.apply` sans re-corréler manuellement par date/montant. Gravité `majeur` (pas `bloquant`) : aucun impact fonctionnel immédiat, mais un vrai trou de piste d'audit sur des mouvements d'argent réels (création de facture, création d'avoir) — exactement le type de défaut que la demande du porteur visait à débusquer en relisant les entrées réelles plutôt que le code seul.
      CORRIGÉ (session du 2026-07-23), strictement dans le périmètre des 2 lacunes nommées par le critère de résolution — la note d'origine mentionne 11 méthodes de mutation sans audit au total dans `invoice.service.ts`, non étendues ici (décision à trancher séparément si le porteur veut couvrir chaque mutation, pas seulement les 2 nommées) : 1) `invoiceService.create` accepte désormais `actorId`/ `actorRole` (motif identique à `send`/`cancel`/`delete`/ `restore`, déjà existants) et écrit `action: "invoice.create"`. Contrôleur (`invoice.controller.ts#createInvoice`) mis à jour pour transmettre `req.user?.sub`/`req.user?.role`. 2) `invoiceService.addPayment` : après le log `invoice.payment.add` existant (désormais enrichi d'un `creditNoteId` en plus d'`overpaidBy`), un second log dédié `action: "creditNote.create"`, `entityType: "CreditNote"`, `entityId: result.creditNote.id` est écrit si un `CreditNote` automatique a été créé — même `action`/forme que le chemin manuel (`creditNoteService.create`), pour que les deux origines d'un `CreditNote` (automatique vs manuel) soient recherchables de façon identique dans `AuditLog`. `createCreditNoteTx` lui-même reste sans log propre (fonction bas-niveau partagée, dans une transaction) — chaque appelant logge après coup, cohérent avec le motif déjà établi pour le chemin manuel. Tests réels ajoutés dans `server/test/invoiceAuditLog.test.ts` (fichier existant, SEC-152, déjà câblé dans `run-all.test.ts`) : 2 nouveaux cas — `invoiceService.create` relit une vraie ligne `AuditLog` par `entityType`/`entityId`/`action` ; le scénario de surpaiement relit à la fois l'entrée `invoice.payment.add` (vérifie son `creditNoteId`) ET l'entrée `creditNote.create` dédiée créée automatiquement — exactement le scénario du critère de résolution. `npm run typecheck`/`npm run lint` --workspace=server vérifiés propres. Grep confirmé : aucun test existant n'asserte sur un compte total de lignes `AuditLog` (aucune régression de comptage attendue), les 3 appelants existants de `invoiceService.create` sans `actorId`/`actorRole` restent valides (paramètres optionnels, log écrit avec `actorId: undefined`, comportement fire-and-forget inchangé). Non exécuté contre une vraie base au moment de ce commit : Docker local toujours indisponible — poussé sans confirmation locale, la CI fera foi. Statut laissé `en_cours` : ni exécuté localement ni observé vert en CI au moment de cette note.
      CLÔTURE (2026-07-23, même session, commit `56d7c4d`) : run CI confirmé vert (rapporté directement par le porteur) — critère satisfait. `resolu`.
