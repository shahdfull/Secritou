  - id: SEC-166
    titre: 'TimeEntry.billedInvoiceId (String?) n''est pas une vraie relation Prisma (pas de @relation vers Invoice) — aucune intégrité référentielle, aucun onDelete, aucun index dédié : un invoice.id copié à la main sans garantie qu''il existe ni qu''il reste cohérent'
