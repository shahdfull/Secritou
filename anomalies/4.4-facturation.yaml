# Périmètre : 4.4 Facturation & Paiements
# 16 anomalie(s)

anomalies:
  - id: SEC-014
    titre: 'Relances facture hebdomadaires : paliers calculés sur createdAt au lieu de dueDate'
    perimetre: 4.4 Facturation & Paiements
    categorie: G
    regle_violee: null
    classe: relance_facture_defectueuse
    gravite: majeur
    statut: resolu
    critere_de_resolution: |
      C'est résolu quand checkInvoiceFollowup calcule daysOverdue et sélectionne le palier FIRST/SECOND/FINAL à partir de dueDate (pas createdAt), et qu'un test appelle réellement checkInvoiceFollowup (ou la fonction extraite) pour vérifier qu'une facture dont l'échéance (dueDate) est dépassée de 14 jours reçoit le palier SECOND, y compris quand createdAt est très différent de dueDate (facture éditée puis envoyée tardivement, par exemple).
    detecte_le: '2026-07-17'
    source: audit_llm
    confiance: certain
    note: |
      Lecture directe session 2026-07-17 : ceoAlerts.processor.ts checkInvoiceFollowup (:160-247) calcule daysOverdue via diffDays(inv.createdAt, now), et sélectionne le palier sur cette base. invoiceService.addReminder (:323-340) calcule pourtant daysOverdue depuis dueDate pour l'email envoyé au client — incohérent avec le palier choisi par le job qui l'a appelé. Commentaire du job (« 7/14/30 days overdue ») contredit l'implémentation (createdAt, pas l'échéance). RÉVISÉ session du 2026-07-17 (vérification jobs/** complète) : le critère de résolution initial incluait aussi l'exclusion des factures OVERDUE — séparé en SEC-015, critère de résolution distinct (existence d'un mécanisme de relance après passage OVERDUE, pas seulement un calcul de date).
      CORRECTIF ÉCRIT ET VÉRIFIÉ, session du 2026-07-17 : ceoAlerts.processor.ts, `checkInvoiceFollowup` — `daysOverdue` calculé désormais via `diffDays(inv.dueDate, new Date())`, plus `diffDays(inv.createdAt, ...)`. La requête sélectionne maintenant `dueDate` (absent de l'ancien `select`) et filtre sur `dueDate: { lt: cutoff }` au lieu de `createdAt: { lt: cutoff }` — le filtre de 7 jours porte donc sur la bonne colonne, ce qui aligne son sens avec le seuil du palier FIRST (7 jours). `dueDate` étant nullable côté schéma, une garde `if (!inv.dueDate) continue` protège la boucle (jamais atteinte en pratique : le filtre `lt: cutoff` ne matche jamais `null`), et les deux payloads `notifyN8n` (`invoice.followup`/`invoice.final_notice`) recalculent aussi `daysOverdue` depuis `dueDate`.
      Nouveau test, `server/test/checkInvoiceFollowup.test.ts` (câblé dans `test/run-all.test.ts`), qui importe et appelle réellement `checkInvoiceFollowup` contre une base migrée — pas une réimplémentation de la logique de palier. Cas couvert exactement par le critère de résolution : une facture `createdAt` récente (1 jour) mais `dueDate` vieille de 14 jours reçoit bien le palier SECOND (preuve directe que le calcul porte sur `dueDate`, pas `createdAt` — si le bug était encore présent, ce cas ne recevrait AUCUN palier). Cas complémentaire : `dueDate` à 3 jours (sous le seuil FIRST de 7 jours) ne déclenche aucune relance, confirme l'absence de faux positif. `npm run typecheck --workspace server` vert (0 erreur). `npm run test:unit --workspace server` : 256/256 (contre 252 avant ce fichier), exécuté deux fois de suite.
      Correctif poussé sur origin/main, session du 2026-07-17 (hash à renseigner au commit). `resolu` déclaré SANS confirmation CI — dérogation explicite à la règle commit+CI de CLAUDE.md, cohérente avec la dérogation déjà établie par le porteur du projet dans cette même session (« no make it resolu »). Contrairement à plusieurs entrées précédentes de cette dérogation, celle-ci porte un vrai nouveau test appelant le code réel — le critère textuel exact est satisfait indépendamment de la dérogation CI.
  - id: SEC-015
    titre: Aucune relance échelonnée après passage d'une facture au statut OVERDUE
    perimetre: 4.4 Facturation & Paiements, transverse server/src/jobs/**
    categorie: G
    regle_violee: null
    classe: relance_facture_defectueuse
    gravite: majeur
    statut: resolu
    critere_de_resolution: |
      C'est résolu quand une facture passée au statut OVERDUE continue de recevoir les relances échelonnées FIRST/SECOND/FINAL (ou un mécanisme équivalent dédié aux factures OVERDUE existe et tourne réellement), vérifié par un test qui simule une facture OVERDUE dépassant successivement les seuils de relance et observe qu'elle reçoit bien les notifications/emails attendus — pas seulement la notification unique de transition SENT/PARTIAL → OVERDUE.
    detecte_le: '2026-07-17'
    source: audit_llm
    confiance: certain
    note: |
      Lecture intégrale session du 2026-07-17 des 8 fichiers de server/src/jobs/** (index.ts, jobNames.ts, queues.ts, redisConnection.ts, et les 4 processors) pour répondre spécifiquement à la question : existe-t-il un mécanisme dédié aux factures déjà en retard qui rendrait volontaire l'exclusion d'OVERDUE dans checkInvoiceFollowup (SEC-014) ? Réponse : oui et non. markOverdueInvoices (maintenance.processor.ts:246-315, cron quotidien 4h15, bien enregistré et déclenché — jobs/index.ts:256-260) bascule SENT/PARTIAL → OVERDUE et envoie UNE notification/email au moment de cette transition. Mais aucun job ne relance ensuite une facture déjà OVERDUE : checkInvoiceFollowup (le seul mécanisme de relance échelonnée FIRST/SECOND/FINAL, cron hebdomadaire lundi 9h) filtre `status IN ["SENT","PARTIAL"]` et ne voit donc plus jamais une facture une fois passée OVERDUE. Recherche exhaustive des 21 noms de jobs (jobNames.ts, grep direct) et des 12 fonctions restantes de ceoAlerts.processor.ts (checkTaskDeadlines, checkOverdueTasks, checkMeetingReminders, checkStaleLeads, checkPendingCommissions, checkCustomQuestionSla, checkApprovalSla, weeklyHealthBoardDigest, lues intégralement) : aucune ne touche aux factures. Conséquence concrète : une facture qui devient OVERDUE reçoit une notification unique puis plus aucune relance jamais, quel que soit le nombre de jours de retard supplémentaires accumulés.
      CORRECTIF ÉCRIT ET VÉRIFIÉ, session du 2026-07-17 (même passe que SEC-014, même fonction) : `checkInvoiceFollowup` interroge désormais `status: { in: ["SENT", "PARTIAL", "OVERDUE"] }` — ajout d'OVERDUE au filtre existant. Une facture qui bascule OVERDUE (via `markOverdueInvoices`) redevient donc visible par ce job hebdomadaire et continue de recevoir ses paliers FIRST/SECOND/FINAL, au lieu de disparaître silencieusement de son champ de vision.
      Nouveau test dans `server/test/checkInvoiceFollowup.test.ts` (le même fichier que SEC-014, câblé dans `test/run-all.test.ts`) — cas couvert exactement par le critère de résolution : une facture déjà en statut `OVERDUE`, 35 jours passés sa `dueDate`, reçoit bien un rappel FINAL via un appel réel à `checkInvoiceFollowup` (pas une simulation de sa logique). Cas complémentaire (anti-régression, pas dans le critère d'origine mais nécessaire pour ne pas introduire un nouveau bug en résolvant celui-ci) : une facture OVERDUE ayant déjà reçu le palier FIRST ne reçoit pas de doublon lors d'une nouvelle exécution. `npm run typecheck --workspace server` vert. `npm run test:unit --workspace server` : 256/256, exécuté deux fois de suite.
      Correctif poussé sur origin/main, session du 2026-07-17 (hash à renseigner au commit). `resolu` déclaré SANS confirmation CI — dérogation explicite à la règle commit+CI de CLAUDE.md, cohérente avec la dérogation déjà établie par le porteur du projet dans cette même session (« no make it resolu »). Comme SEC-014, cette entrée porte un vrai nouveau test appelant le code réel — le critère textuel exact est satisfait indépendamment de la dérogation CI.
  - id: SEC-022
    titre: 'creditNoteService.applyCredit : le garde-fou anti-double-application ne se déclenche jamais (P2025 non catché)'
    perimetre: 4.4 Facturation & Paiements — server/src/services/creditNote.service.ts
    categorie: G
    regle_violee: null
    classe: null
    gravite: majeur
    statut: resolu
    critere_de_resolution: |
      C'est résolu quand appliquer un avoir déjà appliqué (ou appartenant à un autre client) via `creditNoteService.applyCredit` lève une `HttpError(409, ..., "CREDIT_ALREADY_APPLIED")` réelle — pas une `PrismaClientKnownRequestError` brute remontant en 500 générique — vérifié par un test qui appelle réellement `applyCredit` et inspecte le type/statusCode/code de l'erreur reçue, pas seulement qu'une erreur quelconque a été levée.
    detecte_le: '2026-07-17'
    source: audit_llm
    confiance: certain
    note: |
      Trouvé en lisant intégralement `creditNoteService` pour confirmer le statut de l'entité 3.12 (§3, `[À CONFIRMER]` → tentative de passage à IMPLÉMENTÉ), session du 2026-07-17 — pas pendant un audit formel du module 4.4, enregistré immédiatement conformément à CLAUDE.md.
      `applyCredit` (creditNote.service.ts:103-155 avant correction) utilisait une mise à jour conditionnelle (`tx.creditNote.update({ where: { id, appliedAt: null, clientId } })`) pour empêcher qu'un avoir soit appliqué deux fois — protection pensée contre une vraie condition de course (deux admins cliquant "appliquer" presque simultanément). Le code supposait que Prisma renvoie `null` si le `where` ne matche rien (`if (!cn) throw new HttpError(409, ..., "CREDIT_ALREADY_APPLIED")`), mais Prisma lève en réalité une `PrismaClientKnownRequestError` (code `P2025`) — jamais catchée. `server/src/middlewares/error.middleware.ts` n'a aucun gestionnaire pour `P2025` (seul `P2002` est traité spécifiquement) : l'erreur tombait dans le bloc générique final, renvoyant un `500 Internal server error` opaque au lieu du `409 CREDIT_ALREADY_APPLIED` clair et actionnable que le code visait explicitement.
      CONFIRMÉ PAR REPRODUCTION RÉELLE (pas seulement lecture de code), avant tout correctif : avoir créé avec `appliedAt` déjà renseigné, appel direct de `creditNoteService.applyCredit` (le vrai service, pas une simulation) → `PrismaClientKnownRequestError`, code `P2025`, `statusCode: undefined` (donc pas une `HttpError`, confirmant que `error.middleware.ts` l'aurait laissée tomber dans le 500 générique).
      CORRECTIF ÉCRIT ET VÉRIFIÉ, même session : l'appel à `tx.creditNote.update(...)` entouré d'un `try/catch` qui détecte spécifiquement `err instanceof Prisma.PrismaClientKnownRequestError && err.code === "P2025"` et lève l'`HttpError(409, ..., "CREDIT_ALREADY_APPLIED")` prévu à l'origine. Le `if (!cn)` restant est mort (Prisma ne renverra jamais `null` ici) mais conservé pour que TypeScript accepte les lectures ultérieures de `cn` — pas supprimé, car son retrait exigerait un cast ou une réécriture du flux de contrôle hors du périmètre de ce correctif ponctuel. Reproduction re-testée après correctif, même scénario : lève bien `HttpError`, `statusCode: 409`, `code: CREDIT_ALREADY_APPLIED`.
      Nouveau test `server/test/creditNoteApply.test.ts` (câblé dans `test/run-all.test.ts`), appelle réellement `applyCredit` contre une base migrée. 2 cas : avoir déjà appliqué → `HttpError` 409 confirmée (type, statusCode, code, pas seulement "une erreur a été levée") ; avoir frais → application réussie, `Invoice.amountPaid` et `Client.creditBalance` vérifiés à leurs valeurs exactes après coup (pas seulement l'absence d'erreur). `npm run typecheck --workspace server` vert. `npm run test:unit --workspace server` : 269/269 (267 + 2 nouveaux), exécuté deux fois de suite, ~15-18s (aucune régression du type SEC-002 — ce fichier ne touche pas le cache Redis, seulement BullMQ déjà fermé par `run-all.test.ts`).
      Correctif poussé sur origin/main, session du 2026-07-17 (hash à renseigner au commit). `resolu` déclaré SANS confirmation CI — dérogation explicite à la règle commit+CI de CLAUDE.md, déjà établie par le porteur du projet dans cette même session (« no make it resolu »). Le critère textuel exact est satisfait indépendamment de la dérogation CI (vrai test appelant le code réel).
  - id: SEC-027
    titre: 'RG-008 (déclenchement de la commission) : affirmation d''exclusivité jamais prouvée par test, seul le chemin nominal était vérifié'
    perimetre: 4.5 Rémunération des associés, 4.4 Facturation — server/src/services/commission.service.ts, server/src/services/invoice.service.ts
    categorie: E
    regle_violee: RG-008
    classe: null
    gravite: majeur
    statut: resolu
    critere_de_resolution: |
      C'est résolu quand un test appelle réellement `invoiceService.addPayment` contre une base réelle et confirme à la fois qu'un paiement effectivement appliqué à une facture crée une `Commission` par partenaire proratisée correctement, ET qu'un paiement sans effet réel sur le solde de la facture (entièrement absorbé par un trop-perçu) n'en crée aucune — pas seulement une lecture du chemin nominal ou un grep.
    detecte_le: '2026-07-17'
    source: manuel
    confiance: certain
    note: |
      Classée sous 4.4 Facturation & Paiements (périmètre principal, égalité de score de classement automatique) — périmètre(s) secondaire(s) également concerné(s) : 4.5 Rémunération des associés (Commissions).

      Trouvé en répondant à la question du porteur du projet « is there something a vérifier dans ce projet » — un audit de lecture (agent general-purpose, sans modification) sur REFERENTIEL.md §5 (RG-001 à RG-021) a identifié 8 règles métier à provenance faible ou négative non testée, aucune trackée dans ANOMALIES.yaml. RG-008 choisie en premier par le porteur du projet (« RG-008 (commission) puis RG-002 (scoping pôle) (Recommandé) ») comme la plus critique côté argent.
      CONSTAT (déjà noté dans REFERENTIEL.md v0.2.1, jamais formalisé en anomalie) : RG-008 affirme qu'une `Commission` est créée « uniquement lorsqu'un paiement est effectivement enregistré » — une exclusivité. Seul le chemin nominal (`computeForPaymentTx` appelé depuis `addPayment`) était vérifié par lecture directe ; aucun test n'assérait qu'aucun autre chemin ne crée de commission hors de ce déclencheur, ni que le déclencheur lui-même est bien conditionné sur un montant réellement appliqué (pas seulement sur l'existence d'un `Payment`).
      VÉRIFICATION RÉELLE effectuée : (1) Grep exhaustif sur `server/src` : un seul point d'écriture `tx.commission.create` dans tout le dépôt (`commission.repository.ts:49`, dans `createManyTx`). Un seul appelant de `computeForPaymentTx` dans tout le dépôt : `invoice.service.ts:268`, à l'intérieur de `addPayment`, conditionné sur `appliedAmount > 0`. (2) `commission.service.ts` lu intégralement (137 lignes) : aucun autre chemin de création de `Commission` n'existe (les autres méthodes du service sont toutes en lecture ou en mutation de statut PENDING→PAID, jamais en création). (3) Contrainte structurelle en renfort : `Commission.paymentId` est `@unique` dans `schema.prisma` — au plus une commission par paiement, garanti par la base elle-même, pas seulement par la logique applicative.
      Nouveau test `server/test/commissionCreationExclusivity.test.ts` (câblé dans `test/run-all.test.ts`), appelle réellement `invoiceService.addPayment` contre une base migrée — pas une réimplémentation : - un paiement réel (400 sur une facture de 1000, split 50%) crée
        exactement 1 `Commission`, `basis` = 400, `amount` = 200 ;
      - un paiement entièrement absorbé par un trop-perçu (facture déjà
        soldée à `amountPaid = amount` mais statut encore `PARTIAL`,
        état atteignable en écrivant directement la ligne de test, jamais
        par `addPayment` lui-même) ne crée aucune `Commission` —
        confirme que le déclencheur porte sur le montant réellement
        appliqué, pas la simple existence du `Payment`.

      Un premier essai du 2e test utilisait une facture `status: PAID` pour simuler un trop-perçu total, mais `addPayment` refuse tout paiement sur une facture déjà `PAID`/hors `SENT`/`PARTIAL`/`OVERDUE` (`HttpError 409 INVOICE_NOT_ACCEPTING_PAYMENTS`) — corrigé en gardant le statut `PARTIAL` avec `amountPaid` déjà égal au montant total, un état qu'`addPayment` lui-même ne produirait jamais mais qui isole correctement la branche `appliedAmount = 0` sans dépendre du guard de statut.
      `npx tsc --noEmit` vert. Suite complète : 276/276 (274 + 2 nouveaux), ~15-18s, aucune régression. `resolu` déclaré SANS confirmation CI — la CI est actuellement désactivée sur `origin/main` (déclenchement automatique retiré à la demande du porteur du projet, `workflow_dispatch` seul) — dérogation déjà établie dans cette session (« no make it resolu »), documentée pour qu'une lecture future ne prenne pas ce `resolu` pour une confirmation CI, qui est actuellement impossible à obtenir par un push normal tant que la CI reste désactivée.
  - id: SEC-031
    titre: POST /invoices acceptait un champ number manuel, contournant totalement le compteur InvoiceCounter et la garantie de numérotation sans trou
    perimetre: 4.4 Facturation — server/src/validators/invoice.validator.ts, server/src/services/invoice.service.ts
    categorie: G
    regle_violee: RG-012
    classe: null
    gravite: majeur
    statut: resolu
    critere_de_resolution: |
      C'est résolu quand `createInvoiceSchema` n'accepte plus de champ `number` du tout (strippé par Zod si fourni), quand `invoiceService.create` ne peut plus recevoir ni utiliser de `number` caller-supplied (retiré du type du paramètre), ET qu'un test appelle réellement `invoiceService.create` contre une base réelle pour confirmer à la fois la continuité de la séquence sur des créations consécutives, et qu'un `number` injecté dans l'entrée brute est systématiquement ignoré au profit du numéro réellement généré.
    detecte_le: '2026-07-18'
    source: manuel
    confiance: certain
    note: |
      Trouvé en vérifiant RG-012 (« factures numérotées séquentiellement par mois, sans trou ») en réponse à la question du porteur du projet « is there something a vérifier dans ce projet », 5e règle traitée après RG-008/RG-002/RG-017/RG-004b.
      CONSTAT : `nextInvoiceNumber` (`invoice.service.ts`) est correctement atomique — `upsert` avec `increment: 1` sur `InvoiceCounter`, toujours exécuté dans la même transaction Prisma que la création de la facture (`$transaction`), donc un échec de la création annule aussi l'incrémentation (rollback SQL complet, pas de trou possible par ce chemin). La suppression de facture est un soft-delete (`deletedAt`), pas une suppression physique, cohérent avec le commentaire du code (« disallowing invoice deletion »).
      MAIS : `invoiceService.create` (le point d'entrée de `POST /invoices`, réservé à `ADMIN`) acceptait un champ `number` optionnel directement dans son type d'entrée — si fourni, la méthode contournait entièrement `createInvoiceWithGeneratedNumber`/ `nextInvoiceNumber`/`InvoiceCounter` et créait la facture avec le numéro fourni tel quel (`invoiceRepository.create(data as any)`). Le validateur `createInvoiceSchema` exposait ce même champ (`number: z.string().min(1).max(100).optional()`), le rendant atteignable depuis l'API HTTP. Seul garde-fou existant : la contrainte `@unique` sur `Invoice.number` (empêche un doublon exact, pas un trou dans la séquence auto-générée du mois, ni une collision future avec un numéro que le compteur générerait plus tard).
      DÉCISION DU PORTEUR DU PROJET (AskUserQuestion, session du 2026-07-18) : « Lacune réelle à corriger : retirer `number` du validateur/endpoint (Recommandé) ».
      CORRECTIF ÉCRIT : `number` retiré de `createInvoiceSchema` (le middleware `validate()` utilise `schema.parse()`, qui strippe par défaut toute clé non déclarée — confirmé par lecture directe de `validate.middleware.ts`, aucune option `.passthrough()` nulle part) ; `number` retiré du type du paramètre de `invoiceService.create`, la méthode appelle désormais inconditionnellement `createInvoiceWithGeneratedNumber(data)`, sans branche de contournement. Aucun test existant ni appelant réel ne dépendait de ce champ (grep confirmé — un seul appelant réel dans tout le dépôt, `invoice.controller.ts#createInvoice`, qui transmet `req.body` tel quel).
      Nouveau test `server/test/invoiceNumberingGapless.test.ts` (câblé dans `test/run-all.test.ts`), appelle réellement `invoiceService.create` contre une base migrée, 2 cas : (1) deux créations consécutives sous le même préfixe mensuel obtiennent des numéros de séquence strictement consécutifs (aucun trou) ; (2) un `number` injecté dans le body brut est strippé par le validateur Zod réel (`createInvoiceSchema.parse`, pas une réimplémentation), et le service génère toujours son propre numéro réel, jamais celui fourni.
      `npx tsc --noEmit` vert. Suite complète : 288/288 (286 + 2 nouveaux), ~34s, aucune régression. `resolu` déclaré SANS confirmation CI : la CI est actuellement désactivée sur `origin/main` sur demande du porteur du projet (workflow_dispatch seul, session du 2026-07-17), dérogation « no make it resolu » déjà établie dans cette session.
  - id: SEC-137
    titre: documentScopeManager.test.ts (SEC-122) prouve le scope MANAGER cross-pôle sur Document mais pas sur Invoice, alors que assertInvoiceInScope existe et est appliqué uniformément dans invoice.service.ts — aucun test n'appelle le vrai service pour le prouver
    perimetre: server/src/services/invoice.service.ts ; server/test/documentScopeManager.test.ts
    categorie: E
    regle_violee: null
    classe: test_scope_methode_non_couverte
    gravite: mineur
    statut: resolu
    critere_de_resolution: |
      C'est résolu quand un test appelle réellement une méthode d'`invoiceService` (ex. `getById`) avec un scope MANAGER hors pôle sur une facture rattachée à un projet d'un autre pôle, sur une base migrée, et vérifie le refus — comme `documentScopeManager.test.ts` le fait déjà pour `Document`.
    detecte_le: '2026-07-20'
    source: audit_llm
    confiance: certain
    note: |
      Repéré en vérifiant un rapport d'audit tiers demandant « manager cannot read cross-pole project documents OR invoices » — la partie documents est déjà couverte par `documentScopeManager.test.ts` (SEC-122, résolu), pas la partie invoices. Vérifié par lecture directe : `invoice.service.ts:31` (`assertInvoiceInScope`), appelée par `getById`, `update`, `send`, `addPayment`, `addReminder`, `addItem`/`updateItem`/`deleteItem`, `addItemsFromTimeEntries` (lignes 118, 133, 149, 182, 211, 340, 360, 375, 391, 408) — couverture uniforme dans le code, comme pour Document. `grep -rln "invoice" server/test/*.test.ts` croisé avec un cas cross-pole MANAGER (`serviceB`/`OUT_OF_SCOPE`) : aucun résultat pertinent. Pas un défaut de code, un trou de test.
      Le reste du rapport source (`proposalAcceptCascade.test.ts` rollback, `project.clientApprove` rollback facture solde, `rbac.test.ts` HTTP, `managerScopeIdorFixes.test.ts` étendu, `clientCompletedTasks.test.ts` setTimeout) est un faux positif au moment de sa rédaction : SEC-134/ SEC-136 couvrent déjà la cascade proposition (via contrainte unique + retry, pas via rollback intra-transaction — propriété différente mais équivalente en résultat), `clientApprove`/facture de solde sont déjà dans le même bloc `$transaction` (project.service.ts:340-369, rollback natif), SEC-124/SEC-125/SEC-127 couvrent déjà respectivement le test HTTP `/proposals/:id/accept`, le scope proposition étendu, et `projectMeetingService.update/delete` cross-pôle, et `clientCompletedTasks.test.ts:39` (`setTimeout(resolve, 2)`) est le pas de polling BORNÉ de SEC-131, pas le délai fixe d'origine qu'il a remplacé. Playwright/e2e est déjà tracé (voir note ANOMALIES.yaml lignes 85-87), pas un nouveau constat.
      RÉSOLU (déjà, avant cette passe) : `server/test/ invoiceScopeManager.test.ts` existe déjà (créé lors du même lot que SEC-124/125/127, commit antérieur non attribuable à cette session) et satisfait exactement le critère de résolution — il appelle réellement `invoiceService.getById` (code réel, pas une réimplémentation) avec un scope MANAGER du pôle A sur une facture rattachée à un projet du pôle B, et vérifie le refus (404) ; un second cas confirme qu'un Manager même pôle lit la facture, un troisième qu'un ADMIN non scopé la lit aussi. Déjà importé dans `run-all.test.ts:96`. Statut corrigé dans cette passe faute d'avoir été mis à jour au moment de la création du fichier. Dérogation CI déjà accordée par l'utilisateur pour cette session : `resolu` malgré l'absence de run CI vert sur ce commit précis.
