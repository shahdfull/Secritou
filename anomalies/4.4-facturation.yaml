      CLÔTURE (2026-07-23, même session, commit `e397d85`) : run CI confirmé vert (rapporté directement par le porteur) — critère satisfait (commité ET vert en CI). `resolu`.
  - id: SEC-202
    titre: 'clientApprove (RG-013) échoue TOUJOURS avec DUPLICATE_ENTRY (P2002) dès qu''un projet a une facture d''acompte : createBalanceInvoiceTx reçoit le même proposalId que la facture DEPOSIT déjà créée pour cette proposition, or Invoice.proposalId est @unique globalement (une seule facture par proposition, tous types confondus) — la clôture cliente ne peut donc jamais aboutir sur un projet issu d''une proposition acceptée (le chemin nominal du module)'
    perimetre: 'server/src/services/project.service.ts#clientApprove (appel à createBalanceInvoiceTx avec proposalId: preread.proposal.id) ; server/src/services/invoice.service.ts#createBalanceInvoiceTx (accepte et transmet ce proposalId à tx.invoice.create) ; server/prisma/schema.prisma#Invoice.proposalId (@unique, contrainte réelle en base)'
    categorie: B
    regle_violee: RG-013
    classe: contrainte_unique_violee_cascade_metier
    gravite: bloquant
    statut: resolu
    critere_de_resolution: |
      C'est résolu quand un scénario réel complet (proposition acceptée -> acompte payé -> projet en REVIEW -> clientApprove appelé par le client) aboutit à un projet `COMPLETED` avec une facture de solde (`BALANCE`) réellement créée en base, prouvé par un test qui appelle le vrai `projectService.clientApprove` (pas une réimplémentation miroir) sur un projet ayant une vraie facture `DEPOSIT` liée à la même proposition, et vérifie l'absence d'exception P2002 ainsi que la présence de la facture de solde créée.
    detecte_le: '2026-07-22'
    source: manuel
    confiance: certain
    note: |
      Découvert en écrivant le scénario e2e Playwright "approbation client" (demande explicite du porteur : installer Playwright et écrire les scénarios critiques login/cascade/approbation). Le clic réel sur "Confirmer et clôturer" dans un vrai navigateur, contre un vrai serveur, ne fermait jamais la boîte de dialogue. Reproduit directement via un appel API manuel identique (`POST /projects/:id/client-approve` avec un token client réel sur un projet réellement en REVIEW avec sa facture d'acompte réellement payée) : réponse `{"error":{"code":"DUPLICATE_ENTRY",...}}`. Cause isolée par lecture du code : `clientApprove` (project.service.ts ligne ~391) appelle `createBalanceInvoiceTx` en passant `proposalId: preread.proposal.id` — exactement le même proposalId que celui déjà utilisé par la facture `DEPOSIT` créée au moment de l'acceptation de la proposition (`createDepositInvoiceTx`, proposal.service.ts). Or `Invoice.proposalId` porte `@unique` en base (schema.prisma ligne 1299) : une proposition ne peut être liée qu'à UNE SEULE facture, tous types confondus — pas une par type (contrairement à `[projectId, invoiceType]` qui, lui, est légitimement scopé par type via un index partiel, cf. SEC-193). Aucune facture `BALANCE` n'existe dans les données de dev/seed (vérifié par requête directe), confirmant que ce chemin n'a jamais abouti avec succès jusqu'ici — bug de production réel sur le chemin nominal du module Projets (0 client actif au moment de la découverte, donc jamais remonté). Correctif écrit dans la même session (non encore committé au moment de la rédaction de cette entrée) : `clientApprove` ne transmet plus `proposalId` à `createBalanceInvoiceTx` (le paramètre reste optionnel côté fonction ; aucun autre code ne lit `Invoice.proposalId` sur une facture `BALANCE`, vérifié par grep). Statut `en_cours` tant que ce correctif n'est pas committé ET vert en CI sur ce commit exact.
      Vérification du critère de résolution (2026-07-23, session suivante) : le correctif était déjà committé (`d5047bb`, sur `main`), mais SANS test ajouté avec ce commit — le seul test pertinent, `projectClientApproveBalanceInvoice.test.ts` (RG-004b), appelle bien le vrai `projectService.clientApprove`, mais sa facture `DEPOSIT` de fixture ne renseignait PAS `proposalId` — contrairement au vrai chemin de production (`invoice.service.ts#createDepositInvoiceTx`, qui le renseigne toujours, paramètre non optionnel). Ce test ne reproduisait donc pas la collision P2002 réelle et n'aurait pas détecté une régression sur SEC-202 précisément (aurait pu passer même avec l'ancien code buggé). Corrigé : `proposalId: proposal.id` ajouté à la fixture, reproduisant exactement le lien que `createDepositInvoiceTx` établit en production. `npm run typecheck`/`npm run lint` --workspace=server vérifiés propres. Non exécuté contre une vraie base au moment de ce commit : Docker local indisponible (incident signalé sous SEC-200/201, non encore résolu) — poussé sans confirmation locale, la CI (Docker indépendant) fera foi. Statut laissé `en_cours` : ni exécuté localement ni observé vert en CI au moment de cette note.
      CLÔTURE (2026-07-23, même session) : commit `8d5161e` (portant ce correctif) est un ancêtre direct de `56d7c4d`, lui-même confirmé vert par le porteur (job `server`, qui exécute l'intégralité de `test/run-all.test.ts` — y compris `projectClientApproveBalanceInvoice.test.ts` où ce correctif est testé). Le test renforcé (facture DEPOSIT de fixture liée par un vrai `proposalId`) a donc réellement tourné et passé en CI. Critère satisfait. `resolu`.
