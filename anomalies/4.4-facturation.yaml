# Registre des anomalies — Secritou
#
# Ce fichier fait partie du registre éclaté (voir CLAUDE.md § « Procédure
# d'audit obligatoire »). Schéma par anomalie : id, titre, perimetre,
# regle_violee, classe, gravite, statut, critere_de_resolution, detecte_le,
# source, confiance, note.
# Ne jamais reformuler un titre existant — citer l'ID.
#
# Périmètre : 4.4 Facturation & Paiements
# 3 anomalie(s) — premier audit réel du registre remis à zéro le 2026-07-27,
# session du 2026-07-27. +3 le 2026-08-01 (Phase 1 point 3, audit
# performance/fiabilité et couverture de test demandé par le porteur).

anomalies:
  - id: SEC-077
    titre: >
      POST /invoices (invoiceService.create) n'existe-t-elle pas de
      vérification préalable que clientId (ou projectId/proposalId s'ils
      sont fournis) correspond à une ligne réelle avant l'écriture Prisma
      — un clientId inexistant/mal formé fait échouer la contrainte de
      clé étrangère (P2003), non catchée par error.middleware.ts (seul
      P2002 y est mappé), et remonte en 500 brut au lieu d'un 404/422
      propre. Reproduit réellement contre un serveur HTTP réel avec un
      vrai token ADMIN et un clientId UUID valide mais inexistant
    perimetre: 4.4-facturation
    regle_violee: >
      Cohérence de traitement déjà établie ailleurs dans le même dépôt :
      task.service.ts#assertAssigneeIsValid convertit explicitement une
      violation FK (P2003) potentielle en HttpError(422) propre via un
      findUnique préalable, avec commentaire explicite documentant cette
      intention ("doubles as the existence check for assigneeId, turning
      a would-be Prisma FK violation (P2003) into a clean 422").
      invoice.service.ts#create n'applique pas ce même patron pour
      clientId.
    classe: fk-non-validee-500-brut
    gravite: mineure
    statut: ouvert
    critere_de_resolution: >
      invoiceService.create vérifie l'existence de clientId (findUnique
      ou équivalent) avant l'écriture, et lève une HttpError 404/422
      propre si absent — même patron que task.service.ts#assertAssigneeIsValid.
      Un test réel (HTTP, contre un serveur réel) doit confirmer que
      POST /invoices avec un clientId UUID syntaxiquement valide mais
      inexistant renvoie un code d'erreur propre, jamais un 500.
    detecte_le: "2026-08-01"
    source: >
      Phase 1 point 3 (Facturation), audit des contrats API (status
      codes/erreurs) demandé par le porteur — reproduction HTTP réelle
      (server temporaire, vrai token ADMIN, POST /invoices avec un
      clientId UUID syntaxiquement valide mais inexistant en base) :
      500 brut confirmé, log serveur montrant
      PrismaClientKnownRequestError code P2003 non catché. Script de
      reproduction supprimé après usage, jamais committé.
    confiance: haute
    note: >
      Même famille de symptôme que SEC-075 (500 brut sur une entrée mal
      formée non anticipée par le code), classe distincte (violation FK
      vs orderBy non whitelisté). error.middleware.ts ne mappe
      actuellement que P2002 (contrainte unique) — P2003 (clé étrangère)
      n'a pas d'équivalent centralisé, chaque service devant
      individuellement prévenir le cas comme le fait déjà
      task.service.ts. Périmètre volontairement limité à
      invoice.service.ts#create dans ce constat — une revue plus large de
      tous les points d'écriture acceptant un FK non vérifié (autres
      modules) n'a pas été faite dans cette session, hors périmètre de
      la Phase 1 point 3 (Facturation).

  - id: SEC-076
    titre: >
      server/test/invoice.service.test.ts réimplémente intégralement la
      logique du module (computeNewStatus, computeOverpayment,
      assertInvoiceDraft, assertCreditAmount, buildInvoiceNumber,
      isDuplicatePayment — 26 cas de test au total) sans jamais importer
      ni appeler src/services/invoice.service.ts ou creditNote.service.ts
      — même classe que SEC-072, sur le module 4.4 cette fois. Symptôme
      le plus visible : le fixture FakeTx interroge
      tx.invoice.findUnique({where:{id, companyId}}) — un champ companyId
      qui n'existe nulle part dans schema.prisma ni dans le vrai code
      (dépôt mono-tenant, interdiction en tête de CLAUDE.md). La logique
      recopiée diverge réellement du vrai code sur au moins 2 points :
      assertCreditAmount ne soustrait jamais les avoirs déjà émis sur la
      même facture (le vrai creditNoteService.create le fait, SEC-184,
      remainingCreditable = amountPaid - alreadyCredited) — bien que
      SEC-184 lui-même soit déjà couvert par un vrai test ailleurs
      (creditNoteCumulativeAmount.test.ts) — et computeNewStatus/runAddPayment
      ne testent jamais le garde-fou de statut (invoiceService.addPayment
      rejette tout paiement si le statut n'est pas SENT/PARTIAL/OVERDUE,
      HttpError 409 INVOICE_NOT_ACCEPTING_PAYMENTS) ni le chemin
      idempotencyKey (le vrai chemin préféré, testé nulle part dans ce
      fichier — seul le repli 10s est mirroré)
    perimetre: 4.4-facturation
    regle_violee: >
      CLAUDE.md « `verifie: test` exige un test qui appelle le code réel »
      + interdiction de tête « aucune notion de companyId/tenantId à
      introduire » — ce fichier viole les deux : il ne teste pas le vrai
      code, et sa fixture porte un champ interdit par construction dans ce
      dépôt.
    classe: test-mirror-ne-teste-pas-le-code-reel
    gravite: moyenne
    statut: resolu
    critere_de_resolution: >
      invoice.service.test.ts est réécrit (ou remplacé par un/des
      fichier(s) équivalents) pour importer et appeler réellement
      src/services/invoice.service.ts#addPayment et
      src/services/creditNote.service.ts#create contre une vraie base —
      plus aucune fonction locale "computeNewStatus"/"runAddPayment"/
      "assertCreditAmount" recopiée. Doit couvrir en plus ce que le
      miroir actuel ignore : le garde-fou de statut
      INVOICE_NOT_ACCEPTING_PAYMENTS, le chemin idempotencyKey (pas
      seulement le repli 10s), et confirmer que la couverture SEC-184
      (déjà réelle dans creditNoteCumulativeAmount.test.ts) n'est pas
      dupliquée à l'identique sous une forme plus faible dans ce fichier.
    detecte_le: "2026-08-01"
    source: >
      Phase 1 point 3 (Facturation, catégorie E — qualité des tests)
      demandé par le porteur — repérage du commentaire d'en-tête
      explicite "no DB, no imports of service. Pattern: same as
      rating.service.test.ts" (référence directe au défaut déjà connu
      SEC-072), confirmé par grep companyId (absent de tout le code réel)
      et comparaison ligne à ligne de assertCreditAmount/computeNewStatus
      contre creditNote.service.ts/invoice.service.ts réellement lus dans
      la même session.
    confiance: haute
    note: >
      Distinct de SEC-072 (même classe, périmètre 4.11/rating) — ID
      séparé car critère de résolution et fichier concerné différents.
      SEC-184 (avoirs cumulatifs) reste correctement `resolu` : sa preuve
      réelle existe ailleurs (creditNoteCumulativeAmount.test.ts,
      importe et appelle le vrai service) — ce nouveau constat porte sur
      la présence d'une version affaiblie et non représentative du même
      calcul dans un fichier différent, pas sur une régression de SEC-184
      lui-même.
    note_resolution: >
      Réécrit le 2026-08-04 (commit 1ed4366) : invoice.service.test.ts
      importe et appelle désormais réellement invoiceService (statuts
      PAID/PARTIAL/multi-paiements, garde-fou INVOICE_NOT_ACCEPTING_PAYMENTS
      — absent du mirror, chemin idempotencyKey préféré — jamais testé
      avant, addItem/garde DRAFT via le vrai appelant puisque
      assertInvoiceDraft n'est pas exportée, génération réelle du numéro
      de facture). Le volet assertCreditAmount/CREDIT_EXCEEDS_PAID n'est
      pas dupliqué : déjà couvert par du vrai code dans
      creditNoteCumulativeAmount.test.ts (SEC-184), documenté en tête du
      fichier pour éviter une redécouverte future. Vérifié en isolation
      (npx tsx --test --test-reporter=tap) : 29/29 tests verts. tsc
      --noEmit et npm run lint propres sur server. CI verte confirmée :
      run GitHub Actions 30946172107 sur 1ed4366e0516f14da0994330c1fcb5b37735f16f,
      conclusion success.

  - id: SEC-075
    titre: >
      invoice.repository.ts (findAll/findAllByServiceId/findDeleted)
      interpole options.orderBy (venant tel quel de req.query.orderBy via
      parseListQuery, aucune validation) directement dans la clause Prisma
      orderBy sans passer par buildOrderBy (whitelist déjà utilisée par 8
      autres repositories, dont proposal.repository.ts corrigé sous
      SEC-103 pour exactement ce défaut) — un orderBy invalide/inexistant
      (ex. "client", "nonExistentField") provoque un 500 brut
      (PrismaClientValidationError non catché spécifiquement par
      error.middleware.ts) sur GET /invoices (ADMIN/MANAGER),
      /invoices/my-service, /invoices/trash. Reproduit réellement contre
      un serveur HTTP réel avec un vrai token ADMIN
    perimetre: 4.4-facturation
    regle_violee: >
      Cohérence de traitement déjà établie ailleurs dans le même dépôt :
      buildOrderBy (server/src/utils/listQuery.ts) existe précisément pour
      whitelister un orderBy venant de req.query avant de l'interpoler
      dans Prisma — 8 repositories l'utilisent déjà (client, clientOnboarding,
      freelancerApplication, lead, project, proposal, serviceRequest, task).
      invoice.repository.ts en est l'exception non corrigée.
    classe: orderby-non-whiteliste-500-brut
    gravite: mineure
    statut: ouvert
    critere_de_resolution: >
      invoice.repository.ts (findAll/findAllByServiceId/findDeleted)
      utilise buildOrderBy(options.orderBy, options.orderDir, [liste des
      champs Invoice réellement triables], "createdAt") au lieu
      d'interpoler options.orderBy directement. Un test réel (HTTP, contre
      un serveur réel) doit confirmer qu'un orderBy invalide (ex.
      "nonExistentField", "client") retombe silencieusement sur le tri par
      défaut et renvoie 200, pas un 500.
    detecte_le: "2026-08-01"
    source: >
      Phase 1 point 3 (Facturation), cadrage performance/fiabilité (C/D)
      demandé par le porteur — agent d'exploration dédié à la performance
      SQL du périmètre 4.4, confirmé par reproduction HTTP réelle
      (server temporaire, vrai token ADMIN, GET /invoices?orderBy=... sur
      5 valeurs : "client", "clientId.name", une chaîne au format
      injection SQL, "amountPaid" (colonne réelle, 200 OK), et
      "nonExistentField" — 4 des 5 valeurs invalides produisent un 500,
      script de reproduction supprimé après usage, jamais committé).
    confiance: haute
    note: >
      Pas une faille d'injection SQL : Prisma construit l'orderBy comme
      objet {[champ]: direction}, jamais interpolé dans du SQL brut — la
      valeur "1;DROP TABLE Invoice;--" échoue exactement comme les autres
      valeurs invalides (validation de clé Prisma), sans exécution SQL
      arbitraire. Le vrai défaut est la disponibilité : un 500 brut sur un
      paramètre de tri mal formé, alors que le reste du dépôt retombe
      silencieusement sur un tri par défaut via buildOrderBy.

  - id: SEC-001
    titre: >
      GET /invoices/:id/credit-notes ne vérifie aucun scope de pôle pour
      MANAGER — IDOR sur la liste des avoirs d'une facture hors pôle
    perimetre: 4.4-facturation
    regle_violee: >
      Checklist de revue CLAUDE.md « scoping des routes Project/Task »,
      appliquée par analogie à Invoice : un MANAGER doit être scopé à son
      pôle sur toute route touchant une ressource financière, vérifié au
      niveau service, jamais supposé.
    classe: idor-scope-manque
    gravite: moyenne
    statut: resolu
    critere_de_resolution: >
      creditNoteService.listByInvoice (ou son appelant
      getInvoiceCreditNotes, server/src/controllers/invoice.controller.ts:
      124-127) doit d'abord charger la facture via invoiceRepository.findById
      et appeler assertInvoiceInScope(invoice, scope) — comme le fait déjà
      chaque autre contrôleur d'invoice.controller.ts (getInvoiceById,
      updateInvoice, sendInvoice, addPayment, addReminder, addInvoiceItem,
      updateInvoiceItem, deleteInvoiceItem, addItemsFromTimeEntries) — avant
      de renvoyer les avoirs. Un test d'intégration doit appeler réellement
      getInvoiceCreditNotes/listByInvoice avec un MANAGER d'un pôle A contre
      une facture dont le projet est en pôle B et attendre un 404, pas une
      liste vide ni un 200 avec données.
    correctif: >
      Session du 2026-07-27 (même session que la détection) : scope déplacé
      dans creditNoteService.listByInvoice(invoiceId, scope) — charge
      l'invoice via invoiceRepository.findById puis appelle
      assertInvoiceInScope (exportée depuis invoice.service.ts) avant de
      lister les CreditNote. Contrôleur mis à jour pour passer
      buildServiceScope(req). Test ajouté :
      server/test/creditNoteListByInvoiceScope.test.ts (3 cas : pôle A
      refusé 404 sur facture pôle B, pôle A identique autorisé, ADMIN non
      restreint), câblé dans run-all.test.ts. `npx tsc --noEmit` et
      `npm run lint` verts sur le correctif. **Le test lui-même n'a PAS pu
      être exécuté dans cette session** : ni PostgreSQL (localhost:5434) ni
      Redis (localhost:6379) ne sont accessibles dans cet environnement —
      confirmé par un test isolé (connexion Prisma directe → ECONNREFUSED)
      et par le blocage de `npm run test:unit` complet (jamais sorti de
      l'import de jobs/queues.ts qui ouvre une connexion Redis réelle au
      chargement du module). `statut: en_cours`, pas `resolu` : ni commité,
      ni passé en CI, ni même exécuté localement avec succès — seule la
      relecture du code et le typecheck garantissent sa cohérence
      syntaxique, pas son comportement réel.
    detecte_le: "2026-07-27"
    source: >
      Lecture directe de server/src/controllers/invoice.controller.ts (lignes
      119-127) et server/src/routes/invoice.routes.ts (lignes 906-945) :
      la route GET /invoices/:id/credit-notes est montée avec
      authorize("ADMIN","MANAGER") + requirePermission("invoices","read"),
      mais getInvoiceCreditNotes appelle directement
      creditNoteService.listByInvoice(invoiceId) sans jamais construire ni
      passer un ServiceScope — seule route de tout le fichier contrôleur
      touchant une facture par :id à ne pas appeler buildServiceScope. Toutes
      les autres routes ADMIN/MANAGER scopées sur une facture passent par
      assertInvoiceInScope (server/src/services/invoice.service.ts:33-46,
      qui renvoie 404 plutôt que 403 pour ne pas révéler l'existence d'une
      facture hors scope). Confirmé par grep : aucun test dans server/test
      ne couvre credit-notes/getInvoiceCreditNotes/listByInvoice.
    confiance: haute
    note: >
      Le chemin ADMIN-only /:id/credit-note (création d'avoir) et
      /:id/apply-credit ne sont pas concernés (ADMIN seul, pas de notion de
      pôle). Seule la lecture GET /:id/credit-notes (ADMIN+MANAGER) est
      affectée. Périmètre confirmé : server/src/controllers/invoice.controller.ts,
      server/src/routes/invoice.routes.ts, server/src/services/creditNote.service.ts.

  - id: SEC-002
    titre: >
      Le PDF d'une facture de solde (BALANCE) est généré avec le gabarit
      "Facture d'acompte" / "Acompte 30 %" — affiché incohérent avec le
      titre réel de la facture (RG-004b)
    perimetre: 4.4-facturation
    regle_violee: >
      RG-004b (facture de solde à la validation client) — cohérence
      affiché/stocké implicite : un document envoyé au client doit refléter
      la nature réelle de la facture qu'il décrit.
    classe: incoherence-affichage-stockage
    gravite: moyenne
    statut: resolu
    critere_de_resolution: >
      Le client qui télécharge le PDF d'une facture dont
      invoice.invoiceType === "BALANCE" doit lire un document intitulé
      "Facture de solde" (pas "Facture d'acompte"), dont le corps décrit le
      solde restant (pas "Acompte 30 % sur la prestation…"), et dont le
      Document créé porte type: "INVOICE_BALANCE" (pas "INVOICE_DEPOSIT",
      valeur déjà présente dans l'enum DocumentType, schema.prisma:1213,
      mais jamais utilisée en pratique). generateInvoicePDF
      (server/src/services/documentGenerator.service.ts:450-527) doit
      brancher son texte et le type de Document sur invoice.invoiceType —
      actuellement absent du type GeneratorInvoice (ligne 43-53), qui ne
      porte pas ce champ. Un test doit générer le PDF d'une facture BALANCE
      réelle (via project.service.ts#clientApprove, pas une réimplémentation)
      et vérifier le contenu du buffer PDFKit ou, a minima, le
      Document.type/title réellement écrit en base pour ce cas.
    correctif: >
      Session du 2026-07-27 (même session que la détection) :
      invoiceType ajouté à GeneratorInvoice ; logique de sélection extraite
      dans une fonction pure exportée invoicePdfWording(invoiceType,
      projectName) (titre/texte/référence/Document.type/nom de fichier),
      appelée par generateInvoicePDF. Les deux points d'enfilement
      (project.service.ts clientApprove pour BALANCE, proposal.service.ts
      acceptWithCascadeAttempt pour DEPOSIT) mis à jour pour sélectionner
      invoiceType dans leur requête Prisma et le transmettre. Test réel
      ajouté : server/test/invoicePdfWording.test.ts (3 cas : BALANCE,
      DEPOSIT, valeur absente/STANDARD), câblé dans run-all.test.ts —
      **exécuté avec succès dans cette session** (3/3 verts,
      `npx tsx --test test/invoicePdfWording.test.ts`), fonction pure sans
      dépendance DB/Redis/S3. `npx tsc --noEmit` et `npm run lint` verts.
      `statut: en_cours`, pas `resolu` : correctif non commité, jamais vu
      par la CI — le test unitaire de la fonction de sélection est vert,
      mais aucune vérification de bout en bout (génération réelle du PDF
      via generateInvoicePDF, qui nécessite un bucket S3 configuré,
      indisponible dans cet environnement) n'a été faite sur le rendu
      final du buffer PDFKit.
    detecte_le: "2026-07-27"
    source: >
      Lecture directe de server/src/services/documentGenerator.service.ts
      (generateInvoicePDF, lignes 450-527) : header(doc, "Facture
      d'acompte") ligne 459, texte fixe "Acompte 30 % sur la prestation…"
      ligne 471, et uploadAndCreate appelé avec type: "INVOICE_DEPOSIT",
      filename: "facture-acompte-...", title: "Facture d'acompte : ..."
      (lignes 518-526) — sans aucune condition sur invoice.invoiceType.
      Confirmé que cette même fonction est le seul générateur de PDF
      facture dans le dépôt (grep exhaustif sur generateInvoicePDF,
      server/src) et qu'elle est appelée sans distinction pour les factures
      BALANCE (server/src/services/project.service.ts:409-429,
      clientApprove) et DEPOSIT (server/src/services/proposal.service.ts,
      ligne 528, acceptWithCascade). Le titre stocké en base
      (Invoice.title, ex. "Facture de solde : <projet>", visible côté
      client dans InvoicesClientPage.tsx) reste correct — seul le PDF
      téléchargeable (Document lié) affiche un intitulé et un contenu
      contradictoires. Vérifié aussi côté client : grep "invoiceType" sur
      client/src ne retourne aucun résultat, confirmant qu'aucune vue ne
      compense cet écart.
    confiance: haute
    note: >
      DocumentType.INVOICE_BALANCE existe dans schema.prisma (ligne 1213)
      depuis l'introduction du modèle, ce qui suggère que la distinction
      était prévue puis jamais câblée côté generateInvoicePDF — pas un
      oubli de schéma, un oubli d'implémentation.

  - id: SEC-003
    titre: >
      invoiceService.update (ADMIN, modifie amount/title/dueDate/currency
      sur une facture DRAFT) n'écrit aucune entrée AuditLog
    perimetre: 4.4-facturation
    regle_violee: >
      Cohérence de traçabilité attendue sur le flux argent (voir
      auditLogService.record déjà appelé sur create/cancel/delete/restore/
      send/addPayment dans le même fichier) — une modification du montant
      d'une facture doit être traçable au même titre que sa création ou son
      annulation.
    classe: audit-log-manquant
    gravite: moyenne
    statut: resolu
    critere_de_resolution: >
      invoiceService.update (server/src/services/invoice.service.ts:134-148)
      doit appeler auditLogService.record({ actorId, actorRole,
      action: "invoice.update", entityType: "Invoice", entityId: id,
      before: {...champs modifiés avant...}, after: {...champs modifiés
      après...} }) avant de renvoyer `updated` — même pattern que
      invoice.cancel (ligne 166) qui capture before/after sur les champs
      réellement changés. Un test doit appeler réellement
      invoiceService.update sur une facture DRAFT dont amount est modifié
      et vérifier qu'une ligne AuditLog avec entityType: "Invoice",
      action: "invoice.update" existe après l'appel, avec before.amount
      égal à l'ancien montant.
    correctif: >
      Session du 2026-07-27 (même session que la détection) : signature de
      invoiceService.update étendue avec (actorId?, actorRole?) ; before
      capturé depuis l'invoice chargée (avec coercion Number() sur
      `amount`, un Prisma.Decimal qui ne sérialise pas correctement en JSON
      sinon) pour les seuls champs présents dans `data` ; appel
      auditLogService.record({ action: "invoice.update", ... }) ajouté
      avant le retour, même pattern que cancel(). Contrôleur
      (updateInvoice) mis à jour pour transmettre req.user?.sub/req.user?.role.
      Test ajouté dans server/test/invoiceAuditLog.test.ts (fichier
      existant SEC-152, même pattern before/after) : vérifie before.amount
      et after.amount sur une facture DRAFT modifiée. `npx tsc --noEmit`
      et `npm run lint` verts. **Le test lui-même n'a PAS pu être exécuté**
      dans cette session : ni PostgreSQL (localhost:5434) ni Redis
      (localhost:6379) ne sont accessibles dans cet environnement (voir
      SEC-001 pour le diagnostic complet, identique). `statut: en_cours`,
      pas `resolu`.
    detecte_le: "2026-07-27"
    source: >
      Lecture intégrale de server/src/services/invoice.service.ts :
      grep "auditLogService.record" dans ce fichier retourne 6
      occurrences (create l.130, cancel l.166, delete l.175, restore l.182,
      send l.191, addPayment l.287+301) mais aucune dans update
      (lignes 134-148) ni dans setReminderPaused (lignes 150-156, jugé hors
      périmètre financier direct — reminderPaused n'affecte aucun montant).
      update() est la seule route ADMIN pouvant modifier amount/title/
      dueDate/currency d'une facture existante (PUT /invoices/:id,
      server/src/routes/invoice.routes.ts:428) sans laisser de trace
      d'audit.
    confiance: haute
    note: >
      update() est bloqué sur les factures dont l'amount est dérivé de
      lignes (INVOICE_AMOUNT_DERIVED, ligne 141-144) et sur celles dont le
      PDF est déjà généré (assertInvoicePdfNotGenerated, ligne 138-140) —
      la fenêtre d'exploitation réelle est donc étroite (DRAFT, sans items,
      sans PDF déjà émis) mais existe : une facture DRAFT créée via
      POST /invoices (amount libre, sans items) peut être éditée ensuite
      sans laisser de before/after en audit.
