      Même classe que SEC-200 (client_desimbrication_enveloppe_pagination_ incorrecte), occurrence distincte détectée par un audit ciblé lancé juste après la découverte de SEC-200 : une fois le motif identifié (fonction de liste paginée + `response.data.data` alors que le contrôleur fait `res.json(result)` flat), une revue de toutes les fonctions de liste paginée dans `client/src/api/*.ts` comparées à leur contrôleur serveur exact a été faite pour vérifier si d'autres endpoints partageaient le même défaut. Les autres candidats vérifiés (clients, clientOnboarding, documents, freelancers, freelancerApplications, leads, projects, serviceRequests, tasks, users, commissions, approvals) désimbriquent correctement — soit le client fait `response.data` face à un contrôleur flat, soit le contrôleur enveloppe réellement une seconde fois (`res.json({ data: result })`) et le `response.data.data` du client est alors correct. Seuls `invoicesApi.getInvoices`/`getTrash` reproduisaient le même défaut que SEC-200. Correctif écrit dans la même session (non encore committé au moment de la rédaction de cette entrée) : les deux fonctions retournent maintenant directement `response.data`. Statut `en_cours` tant que ce correctif n'est pas committé ET vert en CI sur ce commit exact.
