      Découvert incidemment en vérifiant un rapport d'audit tiers sur la couverture de test (le rapport ne mentionnait que l'absence de test, pas l'absence de contrôle serveur lui-même). Vérifié par lecture directe : `contact.service.ts:85-109` (`convertToLead`) — `department` et `assignedManagerId` sont insérés tels quels dans `tx.lead.create` (lignes 100-101), aucune dérivation ni vérification de pôle. `contact.controller.ts:55-64` (`convertToLead`) — extrait `assignedManagerId`/`department` directement de `req.body` sans les confronter à `req.user`. La route (`contact.routes.ts:13`) autorise `ADMIN` ET `MANAGER`. Ce chemin est distinct de celui déjà documenté sous SEC-102 (formulaire manuel « Ajouter un lead », résolu) : SEC-102 couvrait l'ABSENCE de `serviceId` par défaut sur la création directe ; ici le `serviceId`/`department` est bien présent, mais librement choisi par l'appelant sans validation contre son propre pôle — donc pas une reformulation du même critère de résolution, classe partagée (`scoping_pole_manquant_ou_incorrect`) mais ID distinct. Aucun test n'existe (`grep -rn "convertToLead" server/test/` : zéro résultat).
