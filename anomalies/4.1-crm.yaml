      Même contexte de découverte que SEC-220. ContactRequest.email n'est pas @unique (contrairement à Client/User) — un visiteur peut soumettre le formulaire plusieurs fois ; l'effacement doit cibler la ligne précise (id), pas une recherche par email.
  - id: SEC-232
    titre: 'Suppression de client : branche d''erreur CLIENT_HAS_PROJECTS jamais émise par le serveur'
    perimetre: 4.1 CRM & Pipeline commercial — client/src/features/clients/ClientDetailPage.tsx, server/src/services/client.service.ts#deleteClient
    regle_violee: null
    classe: code_erreur_frontend_sans_contrepartie_serveur
    gravite: mineur
    statut: ouvert
    critere_de_resolution: |
      C'est résolu quand soit (a) le serveur bloque réellement la suppression d'un client ayant des projets actifs avec un code CLIENT_HAS_PROJECTS (409), vérifié par un test d'intégration qui appelle deleteClient contre une base réelle avec un projet actif et confirme le rejet, soit (b) la branche client code === "CLIENT_HAS_PROJECTS" est retirée de ClientDetailPage.tsx parce qu'aucune règle métier de ce type n'est voulue (le soft-delete ne cascade aucune perte de données sur les projets, donc un blocage n'est pas nécessairement justifié) — dans les deux cas, il ne doit plus rester de branche d'erreur frontend qui ne peut jamais s'exécuter.
    detecte_le: '2026-07-27'
    source: audit_llm
    confiance: certain
    note: |
      Découvert lors d'un audit ciblé du périmètre 4.1 CRM & Pipeline commercial, en réaction à la migration AG Grid récente et aux modifications non commitées de ClientDetailPage.tsx (git diff HEAD, session du 2026-07-27). Fichiers lus directement cette session : client/src/features/clients/ClientDetailPage.tsx (diff complet, lignes 200-210),  server/src/services/client.service.ts (lignes 1-90, deleteClient lignes 48-62), server/src/repositories/ client.repository.ts (findAll, delete — lignes 53-116). `deleteClient` ne lève que HttpError(404, "Client not found") ou HttpError(409, ..., "CLIENT_HAS_INVOICES") — recherche exhaustive `grep -rn "CLIENT_HAS_PROJECTS" server/src/` : zéro résultat, aucun contrôle sur les projets actifs n'existe nulle part côté serveur. La suppression est un soft-delete (clientRepository.delete met seulement `deletedAt`, ne touche pas Project) — donc pas de perte de données si un client à projets est supprimé, mais la branche frontend laisse croire à un garde-fou métier qui n'existe pas : un utilisateur qui déclenche ce cas précis retombe sur le toast générique clientsPage.errors.deleteFailed si jamais un autre 409 survient, ou la suppression aboutit sans aucun avertissement sur les projets liés.
  - id: SEC-233
    titre: Sélecteur client de CreateProposalFromLeadDialog plafonné à 50 côté serveur alors que le frontend demande et annonce 200
    perimetre: 4.1 CRM & Pipeline commercial — client/src/features/leads/CreateProposalFromLeadDialog.tsx, server/src/controllers/client.controller.ts#getClients, server/src/utils/listQuery.ts#parseListQuery
    regle_violee: null
    classe: plafond_pagesize_serveur_non_aligne_appelant
    gravite: majeur
    statut: ouvert
    critere_de_resolution: |
      C'est résolu quand le sélecteur client de CreateProposalFromLeadDialog reçoit réellement jusqu'à 200 clients (ou tout autre volume que le message affiché annonce), vérifié en créant plus de 50 clients actifs dans un environnement de test et en confirmant par un test d'intégration que le 51e (par ordre de tri createdAt desc) est bien présent dans la réponse de GET /clients?pageSize=200 — pas seulement que la requête ne renvoie pas d'erreur.
    detecte_le: '2026-07-27'
    source: audit_llm
    confiance: certain
    note: |
      Même classe que SEC-118 (leadsKanbanMaxPageSize), critère de résolution distinct : endpoint différent (GET /clients, pas GET /leads), donc ID distinct plutôt que réouverture. Fichiers lus directement cette session : client/src/features/ leads/CreateProposalFromLeadDialog.tsx (ligne 48, useClients({ pageSize: 200 }) ; lignes 127-132, notice clientSelectorTruncatedNotice affichée si total > 200), server/src/controllers/client.controller.ts (getClients, lignes 9-20, appelle parseListQuery(req.query) sans second argument), server/src/utils/listQuery.ts (parseListQuery, ligne 23, maxPageSize = 50 par défaut). Aucun override de maxPageSize trouvé pour la route clients (recherche dans le fichier controller entier). Conséquence concrète : dès que l'agence dépasse 50 clients actifs, le sélecteur de client de ce dialogue ne propose jamais que les 50 premiers (triés createdAt desc, donc les plus anciens), alors que le message affiché à l'utilisateur annonce explicitement un seuil de 200 — le message lui-même devient une fausse information dès que ce seuil réel (50) est dépassé, avant même d'atteindre le seuil annoncé (200).
