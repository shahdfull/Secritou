    statut: resolu
    critere_de_resolution: |
      C'est résolu quand chaque annotation JSDoc @swagger des modules Invoice/Proposal/Project reflète exactement le code réel (schéma Zod, statuts HTTP réellement lancés par le service, description du comportement) — vérifié en générant le spec réel (swaggerSpec depuis server/src/swagger.ts) et en comparant chaque endpoint modifié à son contrôleur/service, pas par relecture visuelle seule.
    detecte_le: '2026-07-22'
    source: manuel
    confiance: certain
    note: |
      Classée sous 4.1 CRM & Pipeline commercial (périmètre principal, égalité de score de classement automatique) — périmètre(s) secondaire(s) également concerné(s) : 4.2 Gestion de projet.

      Demande explicite du porteur : diff exhaustif Swagger vs comportement réel sur Invoice, Proposal, Project — comparer chaque annotation JSDoc à la signature réelle du handler. Invoice : aucune divergence substantielle trouvée. Proposal/Project : 5 trouvées et corrigées, chacune vérifiée par lecture directe du service réel avant correction (pas seulement le rapport d'audit) : (1) `POST /proposals/{id}/respond` et `POST /proposals/{id}/accept` documentaient le conflit de version sous 400 (proposal.routes.ts, anciennes lignes 177-178 et 473-474) alors que `proposal.service.ts:411,414,417,573` lancent réellement des 409 (`PROPOSAL_VERSION_MISMATCH`/`INVALID_PROPOSAL_TRANSITION`/ `PROPOSAL_EXPIRED`) — bloc 409 ajouté aux deux endpoints. (2) `POST /proposals` documentait un 403 générique pour un dépassement de scope MANAGER visant un `projectId` ; le vrai garde-fou (`assertProposalCreationInScope`, proposal.service.ts:68-89) vérifie `leadId`/`clientId`, pas `projectId`, et lance des 404 (« Lead not found »/« Client not found »), jamais 403 — documentation corrigée en conséquence. (3) `clientInvited` documenté sur les deux endpoints d'acceptation comme reflétant une invitation client réelle ; le code (`proposal.service.ts:562-566`) le fixe littéralement à `false` dans tous les cas depuis un changement antérieur (RG-018/SEC-002, invitation déplacée au moment du paiement) — documentation corrigée pour le dire explicitement. (4) `POST /projects` et `PUT /projects/{id}` omettaient le champ `status` (et `serviceId` pour PUT) de leur schéma de requête documenté, alors que `createProjectSchema`/`updateProjectSchema` (project.validator.ts, via `projectBaseSchema` de `@secritou/shared` étendu) les acceptent réellement — `PUT` est le seul moyen de changer le statut d'un projet (`PROJECT_STATUS_VALID_TRANSITIONS`), documentation ajoutée avec les codes d'erreur réels (`COMPLETION_REQUIRES_CLIENT_APPROVAL`, `INVALID_STATUS_TRANSITION`, tous deux 422, vérifiés dans project.service.ts:106,110). (5) `GET /projects` documentait un stub minimal `{id, name, description}` au lieu du vrai schema partagé `#/components/schemas/Project` déjà utilisé par 6 autres endpoints du même fichier — remplacé par le `$ref` existant ; dans le même mouvement, ce schema `Project` lui-même (server/src/swagger.ts) s'est révélé incomplet face au vrai `projectListSelect` (project.repository.ts:37-60, absent : clientId/serviceId/proposalId/budget/deadline/serviceType/ briefCompleted*/clientApprovedAt*/meetingFrequency/ nextMeetingDate/archivedAt/deletedAt/progress/taskDone/ taskTotal) — complété avec ces 15 champs. Vérification finale : le spec réel généré (`swaggerSpec` chargé directement via `node --import tsx`) confirme 83 chemins, les réponses 409 présentes sur les deux endpoints proposal, et les 22 champs du schema Project désormais exposés — pas une relecture visuelle du texte JSDoc seul. `npx tsc --noEmit` et `npm run lint --workspace=server` verts, suite de tests serveur complète 555/555 après les changements de validateurs associés (SEC-208).
      RÉSOLU (2026-07-23) : correctifs committés (`4bcfca7`), confirmés ancêtres du commit `0627ac0` lui-même confirmé vert par 2 runs CI consécutifs (SEC-212, note de `15b3b08`) via `git merge-base --is-ancestor 4bcfca7 0627ac0`. Correction du champ `statut` seule dans cette passe, aucun changement de code.
      Découverte incidente en cours de route (fausse alerte, notée pour mémoire) : recherche initiale d'un schema `Project` fantôme a d'abord semblé confirmer qu'il n'existait nulle part, à cause d'une confusion avec `server/src/swagger-schemas.ts` — un fichier distinct, jamais importé par aucun autre fichier du dépôt (`grep` confirmé), donc du code mort qui ne contribue rien au spec réellement servi (`swagger-jsdoc` ne scanne que `src/routes/*.ts` et `src/controllers/*.ts`, configuré dans `swagger.ts:448-451`). Le vrai schema `Project` existait bien, dans `swagger.ts` lui-même — `swagger-schemas.ts` n'est pas la cause du problème, juste un fichier mort sans rapport, non traité dans cette passe (hors périmètre de la demande initiale).
  - id: SEC-208
    titre: 'invoice.validator.ts et proposal.validator.ts réimplémentaient chacun un schéma Zod déjà défini dans @secritou/shared (invoiceItemSchema/createCreditNoteSchema/addPaymentSchema pour invoice ; proposalBaseSchema/proposalSectionSchema/rejectProposalSchema/respondToProposalSchema pour proposal) au lieu de les importer — même motif que celui déjà corrigé pour lead/document/task/project/client/user/freelancer.validator.ts ; une divergence déjà réelle constatée : leadId accepté par le serveur pour proposal mais absent du schéma partagé, invisible à tout formulaire client construit sur ce schéma'
