 ; managerPermission.repository.ts (aucun endpoint de liste paginé, uniquement des lookups internes) ; executiveMetrics.repository.ts (agrégations internes pour le dashboard, jamais un payload de liste exposé tel quel) ; user.repository.ts/project.repository.ts/ task.repository.ts (déjà couverts par le second volet non traité de SEC-171 lui-même, pas une occurrence nouvelle). Périmètre à reconfirmer plus tard, non retenu comme constat dans cette passe faute de composant frontend de liste identifié avec certitude : `projectMeeting.repository.ts#listByProject` (pas de `select` restrictif, et `notes`/`participants` sont `@db.Text`, mais aucune vue liste dédiée aux réunions n'a été localisée avec certitude dans `client/src/features` pour confirmer une sur-lecture réelle côté UI). Non corrigé dans cette passe (constat + vérification uniquement, demande explicite du porteur portait sur la vérification généralisée, pas sur un correctif immédiat) — laissé `en_cours`, à trancher/corriger dans une passe dédiée comme le second volet de SEC-171 lui-même.
