  - id: SEC-205
    titre: 'LeadDetailDialog.tsx : useLead ne déstructure jamais isLoading — pendant que la fiche détaillée (avec les propositions liées) est en cours de chargement, current retombe sur la prop lead issue de la liste, qui ne porte jamais proposals, et la section affiche « aucune proposition liée » alors que le lead en a peut-être réellement, juste pas encore chargées (faux état vide, pas seulement un indicateur de chargement manquant)'
    perimetre: client/src/features/leads/LeadDetailDialog.tsx (ligne 42, avant correctif)
    regle_violee: null
    classe: null
    gravite: mineur
    statut: resolu
    critere_de_resolution: |
      C'est résolu quand l'ouverture de la fiche détail d'un lead ayant des propositions liées affiche un indicateur de chargement pendant la requête `useLead`, puis les propositions réelles une fois chargées — jamais le message « aucune proposition » avant que le chargement ne soit terminé — vérifié par un test qui rend le vrai composant, retarde volontairement la résolution de la requête, et confirme l'absence du message vide pendant ce délai.
    detecte_le: '2026-07-22'
    source: manuel
    confiance: certain
    note: |
      Découvert en répondant à la demande explicite du porteur de généraliser EmptyState/skeleton aux fichiers `features/*.tsx` sans état de chargement/vide géré. Audit large (agent dédié) sur l'ensemble des pages/composants `features/*.tsx` consommant une requête : ~52 fichiers géraient déjà les deux états correctement (en JSX ad-hoc, pas via un composant partagé — le porteur a choisi de ne pas les migrer, leur état actuel étant fonctionnel), 0 fichier n'avait ni l'un ni l'autre. Un seul vrai trou trouvé : `LeadDetailDialog.tsx` a bien un état vide (`proposals.length === 0`) mais aucun état de chargement — `useLead(...)` n'y déstructurait que `data`, jamais `isLoading`/`isPending`. Concrètement, `current` (ligne 43, `detailedLead ?? lead`) retombe sur la prop `lead` issue de la liste/Kanban tant que la requête détaillée n'a pas résolu ; or cette prop ne porte jamais `proposals` (absent du payload de liste), donc `proposals` vaut `[]` et le composant affiche le message vide AVANT que la vraie réponse (potentiellement non vide) n'arrive — un faux négatif visible à chaque ouverture de la fiche, pas seulement une absence de spinner cosmétique.
      Corrigé dans la même session : `isLoading` (renommé `isLoadingDetail`) déstructuré de `useLead`, un indicateur de chargement (spinner + texte `common.loading`) inséré avant le test `proposals.length === 0` dans le rendu de la section propositions. Preuve par test réel (nouveau fichier `client/src/features/leads/LeadDetailDialog.test.tsx`) : mocke `@/api/axios` (le vrai module HTTP, pas le hook) avec une promesse dont la résolution est retardée manuellement, confirme que le message vide n'apparaît PAS pendant l'attente, puis que la vraie proposition s'affiche une fois la promesse résolue ; second test confirme le message vide réel une fois la requête résolue sans proposition. `npx tsc --noEmit` et `npm run lint --workspace=client` (12 warnings, exception déjà documentée, aucun nouveau) verts ; suite de tests client complète 119/119 (35 fichiers, +1 fichier/+2 tests).
      RÉSOLU (2026-07-23) : le champ `statut` était resté `en_cours` par erreur alors que le correctif était déjà committé (`a4f82f7`, confirmé présent dans `client/src/features/leads/ LeadDetailDialog.tsx` ligne 42 : `isLoadingDetail` bien déstructuré de `useLead`, testé sur le rendu ligne 92) et déjà inclus dans un run CI confirmé vert : `git merge-base --is-ancestor a4f82f7 0627ac0` confirme que `a4f82f7` est un ancêtre du commit `0627ac0`, lui-même confirmé vert par 2 runs CI consécutifs (SEC-212, note de `15b3b08`). Correction du champ `statut` seule, aucun changement de code dans cette passe.
  - id: SEC-207
    titre: 'Diff Swagger vs comportement réel sur Invoice/Proposal/Project : 5 divergences réelles trouvées — POST/respond proposal documentent un conflit de version en 400 alors que PROPOSAL_VERSION_MISMATCH/INVALID_PROPOSAL_TRANSITION/PROPOSAL_EXPIRED sont réellement des 409 ; POST /proposals documente un 403 générique pour un dépassement de scope MANAGER qui renvoie en réalité des 404 (Lead/Client not found) ; clientInvited documenté comme reflétant une invitation réelle alors qu''il vaut toujours false (RG-018/SEC-002) ; POST/PUT /projects omettent totalement le champ status (et serviceId pour PUT) du schéma de requête documenté alors qu''il est réellement accepté ; GET /projects documentait un stub {id,name,description} au lieu du vrai schema Project (lui-même incomplet, corrigé dans la même passe)'
    perimetre: server/src/routes/proposal.routes.ts, server/src/routes/project.routes.ts, server/src/swagger.ts#Project
    regle_violee: null
    classe: null
