      C'est résolu quand un utilisateur réel ouvrant /app/commercial voit la liste des propositions existantes s'afficher (au moins une ligne pour un jeu de données non vide), prouvé par un test qui appelle le vrai client HTTP (proposalsApi.getProposals) contre le vrai contrôleur (pas une réimplémentation miroir de la désimbrication) et vérifie que le tableau retourné est non vide quand le serveur a des propositions.
    detecte_le: '2026-07-22'
    source: manuel
    confiance: certain
    note: |
      Découvert incidemment en écrivant le scénario e2e Playwright "cascade proposition" (demande explicite du porteur : installer Playwright et écrire les scénarios critiques login/cascade/ approbation). Le scénario échouait systématiquement à trouver la ligne d'une proposition fraîchement créée dans le tableau, alors que `curl` direct contre le même endpoint avec le même token confirmait une réponse serveur correcte à 100% ({"data":[{...1 proposition...}], "total":1,...}). Cause réelle isolée après élimination de toutes les autres hypothèses (StrictMode, CORS, pagination, debounce de recherche) : `getProposals` du contrôleur fait `res.json(result)` avec `result` déjà égal à `{ data, total, page, pageSize }` — une enveloppe PLATE — mais `proposalsApi.getProposals` côté client s'attendait à `{ data: PaginatedResponse }` et retournait `response.data.data`, soit `undefined.data` sur le tableau réel. Bug de production réel affectant TOUS les utilisateurs (0 client actif au moment de la découverte, donc jamais remonté), pas un artefact de test — la page Propositions n'a jamais pu afficher la moindre ligne depuis l'introduction de ce code. Correctif écrit dans la même session (non encore committé au moment de la rédaction de cette entrée) : `proposalsApi.getProposals` retourne maintenant directement `response.data` (le flat `PaginatedResponse`) au lieu de `response.data.data`. Statut `en_cours` tant que ce correctif n'est pas committé ET vert en CI sur ce commit exact (règle CLAUDE.md : un correctif dans un working tree non commité ne vaut jamais `resolu`).
      Test réel ajouté (2026-07-23, même session) : `server/test/proposalInvoiceListEnvelopeFlat.http.test.ts` — appelle le vrai contrôleur via `supertest` (`GET /api/v1/proposals`) et vérifie explicitement `res.body.data` est un tableau direct contenant la proposition fraîchement créée, pas un `res.body.data.data` imbriqué — verrouille la forme exacte à laquelle `proposalsApi.getProposals` fait confiance côté client, conformément au critère de résolution écrit ci-dessus. Câblé dans `test/run-all.test.ts`. Vérifié vert en local à plusieurs reprises (3/3 assertions passent, `npm run typecheck`/`npm run lint` --workspace=server propres) avant qu'un incident Docker local (moteur arrêté accidentellement en nettoyant des connexions résiduelles d'une session de débogage précédente) n'empêche une dernière passe de couverture complète — non lié au code de ce correctif, signalé tel quel plutôt que masqué. Statut laissé `en_cours` : le correctif est commité mais son run CI n'est pas encore observé au moment de cette note (règle CLAUDE.md : commité ET vert en CI, jamais l'un sans l'autre).
      CLÔTURE (2026-07-23, même session, commit `e397d85`) : run CI confirmé vert (rapporté directement par le porteur) — critère satisfait (commité ET vert en CI). `resolu`.
