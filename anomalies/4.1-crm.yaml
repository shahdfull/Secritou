    note: |
      Audit finance/RevOps (item 1, exactitude des montants). RG-004b/ SEC-030 (déjà dans ce registre) avait vérifié que le calcul du SOLDE dans `clientApprove` est un complément-à-100% correct et unique à cet endroit précis — cette entrée ne le contredit pas, elle porte sur un site DIFFÉRENT et non vérifié à l'époque : le taux d'ACOMPTE lui-même (30%), qui apparaît en toutes lettres et indépendamment à 3 emplacements distincts, vérifiés par lecture directe et grep (`\* 0\.3\b`) sur tout `server/src` : (1) `project.service.ts:336`, fallback utilisé par `clientApprove` quand `depositInvoice.amountHT` est absent ; (2) `proposal.service.ts:466`, le calcul RÉEL exécuté par `acceptWithCascade` au moment de créer la facture d'acompte ; (3) `documentGenerator.service.ts:399`, le calcul illustratif affiché dans le PDF du devis envoyé au client AVANT acceptation. Aucun des trois n'importe une constante partagée. Gravité `majeur` (pas `mineur`) : c'est une valeur qui engage contractuellement l'agence envers le client (montant annoncé dans un devis PDF téléchargeable) — une divergence, même par oubli d'un seul site lors d'un futur changement de taux, produirait un écart chiffré et documenté entre ce qui a été promis par écrit et ce qui est réellement facturé.
