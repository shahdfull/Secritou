    gravite: majeur
    statut: resolu
    critere_de_resolution: |
      Résolu quand `GET /clients?search=<texte>` ne retourne que les clients dont `name` ou `email` contient réellement `<texte>` (insensible à la casse), vérifié directement contre une base réelle avec au moins 2 clients dont un seul correspond au texte cherché — pas déduit de la seule lecture du code.
    detecte_le: '2026-07-23'
    source: manuel
    confiance: certain
    note: |
      Découvert en investiguant SEC-213 (voir sa note pour la chronologie complète) : `client-approval.spec.ts` cherche `?search=Géant&pageSize=1` en attendant "Géant Tunisia", mais recevait "Vermeg Digital" — un nom sans rapport. Vérifié en direct (`curl`/`fetch` contre un serveur réel, conteneurs Docker frais migrés+seedés) : `?search=Géant` retournait 4 clients (Vermeg Digital, Monoprix Tunisia, Géant Tunisia, Carrefour Tunisia) dans le même ordre que `GET /clients` sans aucun paramètre — la liste complète non filtrée, triée par `createdAt`. Lu directement `client.repository.ts#findAll` (avant correctif) : construit `where = { deletedAt: null, ... }` puis ajoute conditionnellement `archivedAt`/`projects.some` (scope MANAGER), mais n'appelle JAMAIS `buildTextSearchFilter` ni n'ajoute `options.search` au `where` d'aucune façon — le paramètre `search` de la requête est silencieusement ignoré tout du long. Comparé aux repositories analogues qui font tous ce même appel correctement : `lead.repository.ts`, `project.repository.ts`, `serviceRequest.repository.ts`, `task.repository.ts` (tous via `buildTextSearchFilter`, motif confirmé par grep). Bug produit réel, pas seulement un artefact e2e : toute page ADMIN/MANAGER avec une barre de recherche clients est cassée en production, retourne toujours la liste complète (tronquée par pagination) au lieu du sous-ensemble cherché — gravité `majeur` (fonctionnalité visible et utilisée silencieusement non-opérante, pas de fuite de données puisque chaque résultat individuel reste correctement scope-vérifié par ailleurs, seul le FILTRAGE est absent).
      Corrigé : ajoute `...buildTextSearchFilter(options.search, ["name", "email"])` au `where` de `findAll`, même motif que les autres repositories (`name`/`email` — les deux champs texte du modèle `Client`, cohérent avec `SORTABLE_FIELDS` existant qui inclut déjà `email`). `npm run typecheck`/`npm run lint` --workspace=server vérifiés propres. Vérifié directement contre un vrai Postgres : `?search=Géant` ne retourne plus que "Géant Tunisia" après correctif. Suite serveur complète (77 fichiers, `test:coverage`) revérifiée verte après ce changement — aucune régression sur les tests existants de `client.repository.ts`/ `client.service.ts`.
