#
# Ce fichier fait partie du registre éclaté (voir CLAUDE.md § « Procédure
# d'audit obligatoire »). Schéma identique à l'ancien ANOMALIES.yaml
# (archivé) : id, titre, perimetre, regle_violee, classe, gravite, statut,
