      Classée sous 4.1 CRM & Pipeline commercial (périmètre principal, égalité de score de classement automatique) — périmètre(s) secondaire(s) également concerné(s) : 4.4 Facturation & Paiements.

      Demande explicite du porteur : vérifier qu'aucun endpoint ajouté récemment n'a de schéma Zod dupliqué au lieu de réutiliser `@secritou/shared`, même motif que les fichiers déjà corrigés. Audit complet des 33 fichiers de `server/src/validators/` contre les 11 fichiers de `shared/src/schemas/` : 7 fichiers réutilisent déjà correctement le partagé (lead/document/task/project/client/ user/freelancer.validator.ts, plus quelques imports de constantes/ utilitaires dans auth/booking/contact/freelancerApplication) ; 23 fichiers n'ont légitimement aucun schéma partagé applicable (concepts server-only : ai, approval, commission, notification, permissionProfile, projectMeeting, serviceRequest, timeEntry, upload, etc. — aucun `shared/src/schemas/*.ts` correspondant) ; 2 fichiers dupliquaient réellement un schéma partagé existant : `invoice.validator.ts` (createInvoiceSchema/addInvoiceItemSchema/ updateInvoiceItemSchema/createCreditNoteSchema recopiaient champ-pour-champ `invoiceBaseSchema`/`invoiceItemSchema`/ `createCreditNoteSchema` de `shared/src/schemas/invoice.schema.ts`, y compris une réimplémentation locale de `currencyCode` déjà exportée par `common.schema.ts`) et `proposal.validator.ts` (idem pour `proposalBaseSchema`/`proposalSectionSchema`/ `rejectProposalSchema`/`respondToProposalSchema`).
      Divergence réelle déjà présente au moment de l'audit (pas hypothétique) : `proposal.validator.ts` acceptait `leadId` en body de création, un champ totalement absent de `proposalBaseSchema` côté partagé — `CreateProposalFromLeadDialog. tsx` (client réel, ligne 70) soumet bien ce champ aujourd'hui, donc tout futur formulaire construit à partir du schéma partagé (au lieu de le redéfinir localement comme le fait ce composant) ne pourrait pas le représenter. Corrigé en ajoutant `leadId: z.string().uuid().optional()` à `proposalBaseSchema` (shared), pas seulement côté serveur.
      Correctifs : `invoice.validator.ts` importe désormais `invoiceItemSchema`/`createCreditNoteSchema`/`addPaymentSchema`/ `currencyCode`/`positiveDecimal` de `@secritou/shared` ; le champ `number` (généré serveur, RG-012/SEC-031, jamais accepté du client) reste exclu délibérément — pas une réutilisation aveugle de `invoiceBaseSchema` en entier, qui l'inclut. `proposal. validator.ts` importe `proposalBaseSchema`/`proposalSectionSchema`/ `rejectProposalSchema`/`respondToProposalSchema`, étendu localement avec `clientName`/`email` (snapshot de contact server-only, jamais un champ de formulaire autonome). Vigilance appliquée sur `updateProposalSchema` : NE PAS utiliser `proposalBaseSchema.partial()` tel quel — `proposalService.update` passe le corps de requête quasi tel quel à Prisma (`proposal.service.ts:266`), donc le Zod schema de la route est le seul vrai gardien de ce qu'un appelant peut réassigner sur une proposition existante ; élargir silencieusement ce schéma en réutilisant la base complète aurait permis de réassigner `clientId`/`sections`/`leadId` en PUT, un changement de comportement réel non demandé — restreint explicitement via `.pick({title, description, amount, currency, expiresAt})` pour préserver exactement l'ensemble de champs modifiables pré-existant. `npx tsc --noEmit` (serveur ET client, après l'ajout de `leadId` côté partagé), `npm run lint --workspace=server` verts ; suite de tests serveur complète 555/555 après le changement (inchangée, confirmant qu'aucun comportement de validation n'a dérivé).
      RÉSOLU (2026-07-23) : correctifs committés (`4bcfca7`, même commit que SEC-207), confirmés ancêtres du commit `0627ac0` lui-même confirmé vert par 2 runs CI consécutifs (SEC-212, note de `15b3b08`) via `git merge-base --is-ancestor 4bcfca7 0627ac0`. Correction du champ `statut` seule dans cette passe, aucun changement de code.
  - id: SEC-215
    titre: server/src/repositories/client.repository.ts#findAll construit son `where` mais n'applique jamais `options.search` — GET /clients?search=<texte> retourne la liste complète non filtrée triée par date de création, quel que soit le texte cherché, pour tout ADMIN/MANAGER utilisant la recherche clients
    perimetre: server/src/repositories/client.repository.ts#findAll
