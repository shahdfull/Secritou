  - id: SEC-187
    titre: leadService.createLead s'appuie sur un pré-check (tx.lead.findFirst puis tx.lead.create) suivi d'un catch P2002 présenté comme filet de sécurité DB, mais Lead.email ne porte qu'un @@index, jamais un @@unique — deux créations vraiment concurrentes (deux managers sur le même prospect) peuvent toutes deux lire « aucun doublon » avant que l'une des deux ne commite, produisant deux leads actifs avec le même email malgré SEC-155
    perimetre: 4.1 CRM & Pipeline commercial — server/src/services/lead.service.ts#createLead (lignes 69-101) ; schema.prisma#Lead (ligne 268, 291)
    regle_violee: null
    classe: toctou_precheck_sans_contrainte_db_reelle
    gravite: majeur
    statut: resolu
    critere_de_resolution: |
      C'est résolu quand `Lead.email` porte une contrainte réellement unique en base parmi les lignes actives (ex. `@@unique([email])` sur une colonne générée `emailIfActive` valant `email` quand `archivedAt IS NULL` et `NULL` sinon — pour ne pas bloquer la légitime ré-entrée sur un lead archivé déjà couverte par SEC-155), pour que le `catch` P2002 déjà écrit dans `createLead` cesse d'être du code mort — prouvé par un test qui appelle réellement `leadService.createLead` deux fois en concurrence stricte (`Promise.allSettled`, même modèle que `proposalAcceptCascadeConcurrency.test.ts`, SEC-134) avec le même email, et vérifie qu'un seul lead actif existe ensuite en base.
    detecte_le: '2026-07-21'
    source: audit_llm
    confiance: certain
    note: |
      Audit RevOps CRM (item 4, déduplication). Vérifié par lecture directe : `lead.service.ts:77` affirme en commentaire « the DB-level unique constraint is the real guard, the pre-check is only there to give a clean 409 in the common (non-concurrent) case » — affirmation vérifiée FAUSSE par lecture du schéma : `schema.prisma:268` (`email String? @db.VarChar(255)`) et ligne 291 (`@@index([email])`, pas `@@unique`) — aucune contrainte d'unicité n'existe sur ce champ, dans aucune forme (simple ou composite). Le `catch (err) { if (... P2002 ...) }` aux lignes 96-99 ne peut donc jamais s'exécuter en pratique : Postgres n'a rien à rejeter. Seule protection réelle : le `tx.lead.findFirst` avant `tx.lead.create`, à l'intérieur d'une transaction Prisma par défaut (pas de `isolationLevel: "Serializable"` précisé) — insuffisant contre deux transactions concurrentes qui liraient toutes deux « pas de doublon » avant que l'une ne commite. `leadDuplicateEmail.test.ts` (SEC-155) confirmé par lecture directe comme purement séquentiel (un premier `await createLead(...)` complètement terminé avant le second) — ne peut structurellement pas détecter cette race, même modèle de lacune que celui déjà trouvé dans l'audit QA de cette même conversation (tests séquentiels ne prouvant rien sur une protection concurrente). Gravité `majeur`, pas `bloquant` : pas de perte d'argent directe, mais fausse exactement les métriques que SEC-155 visait à protéger (volume de pipeline, taux de conversion) — deux lignes pour le même prospect gonflent le compte de leads actifs si la fenêtre de course est atteinte.
      RÉSOLU (session en cours) : application de la migration `20260720000000_lead_email_unique_active` — `CREATE UNIQUE INDEX "Lead_email_active_key" ON "Lead" (LOWER(email)) WHERE email IS NOT NULL AND "archivedAt" IS NULL` — EXACTEMENT la contrainte demandée par le critère de résolution (unique parmi les lignes actives, archivage exclu pour préserver la ré-entrée légitime déjà couverte par SEC-155). Le fichier SQL lui-même n'est pas de mon écriture (produit par le processus externe concurrent plus tôt dans cette session, non attribué comme mon travail) mais était resté non appliqué/non commité ; vérifié zéro doublon d'email actif existant avant application (`GROUP BY LOWER(email) HAVING count(*)>1` sur la base réelle : aucun résultat), puis appliqué via `npx prisma migrate deploy` (seule migration en attente à ce moment). Une fois la contrainte réelle en place, le `catch` P2002 déjà écrit dans `createLead` (jusque-là mort) devient un vrai filet. Preuve par test réel (`server/test/leadCreateConcurrency.test.ts`, nouveau fichier) : appelle `leadService.createLead` deux fois en concurrence stricte (`Promise.allSettled`, même modèle que `proposalAcceptCascadeConcurrency.test.ts`/SEC-134) avec le même email — exactement 1 des 2 appels réussit, l'autre est rejeté avec `LEAD_EMAIL_ALREADY_EXISTS`, et un seul Lead actif existe ensuite en base. Suite complète verte (499 tests), `npx tsc --noEmit` et `npm run lint --workspace=server` verts. Dérogation CI déjà accordée par l'utilisateur pour cette session : `resolu` malgré l'absence de run CI vert sur ce commit précis.
