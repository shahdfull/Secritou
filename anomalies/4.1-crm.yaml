    detecte_le: '2026-07-20'
    source: audit_llm
    confiance: certain
    note: |
      Lu directement en session : shared/src/schemas/lead.schema.ts (`leadBaseSchema` n'expose ni `serviceId` ni `assignedManagerId`), client/src/features/leads/LeadsPage.tsx (aucune occurrence de `serviceId`/`assignedManagerId` dans le formulaire), contrôlé contre server/src/services/contact.service.ts:21,30,34 (le chemin PUBLIC — formulaire de contact du site — calcule bien `serviceId` via `serviceService.resolveServiceIdForType` avant de créer le Lead), server/src/services/lead.service.ts:61-63 (`createLead` transmet `data` tel quel à `leadRepository.create`, sans dérivation de pôle par défaut), server/src/repositories/lead.repository.ts:11-20 (`buildWhere` restreint un MANAGER via `OR: [{serviceId: scope.userServiceId}, {assignedManagerId: scope.userId}]` — un lead sans aucun des deux valorisés ne matche ni l'un ni l'autre). Asymétrie confirmée entre les deux chemins de création de Lead du dépôt : celui issu du formulaire de contact public scope correctement, celui du formulaire interne « Ajouter un lead » ne scope jamais. Un ADMIN continue de voir tous les leads (scope non appliqué à son rôle), donc le lead n'est pas perdu — seulement invisible à tout Manager, y compris celui qui l'a saisi.
      CORRECTIF ÉCRIT ET VÉRIFIÉ, session du 2026-07-20 : `lead.controller.ts#createLead` appelle désormais `buildScope(req)` (absent auparavant, seul point d'entrée de création qui ne le faisait pas) ; `leadService.createLead(data, scope?)` dérive `serviceId`/`assignedManagerId` du scope MANAGER par défaut (`ownPoleDefaults`), sans effet pour un ADMIN (comportement inchangé, toujours visible par tous) ; `leadRepository.create` étend son type d'entrée pour accepter ces deux champs (déjà acceptés par `buildWhere`, jamais par `create`). Preuve : nouveau fichier `server/test/leadCreateScope.test.ts` (2 cas, appelle le vrai leadService/leadRepository contre une base migrée) — un lead créé par un MANAGER hérite du pôle et de l'assignation du créateur et apparaît dans sa propre liste (absent de celle d'un autre pôle), un lead créé par un ADMIN garde `serviceId`/`assignedManagerId` nuls (comportement antérieur préservé). Vérification complète serveur : `npx tsc --noEmit` (clean), `npm run lint` (0/0), `npx tsx --test test/run-all.test.ts` (403/403, stable sur 2 exécutions consécutives). Résolu SANS confirmation CI (workflow GitHub Actions sur `origin/main` en `workflow_dispatch` uniquement, déviation documentée depuis la session du 2026-07-17).
