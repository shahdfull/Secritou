  - id: SEC-118
    titre: 'LeadsPage kanban envoie pageSize: 200, mais parseListQuery le plafonne silencieusement à 50 côté serveur — le pipeline Kanban est tronqué au-delà de 50 leads, sans aucune indication à l''utilisateur'
    perimetre: 4.1 CRM & Pipeline commercial — client/src/features/leads/LeadsPage.tsx, server/src/utils/listQuery.ts, server/src/controllers/lead.controller.ts
    regle_violee: null
    classe: null
    gravite: majeur
    statut: resolu
    critere_de_resolution: |
      C'est résolu quand un pipeline de plus de 50 leads reste intégralement visible dans le Kanban (toutes colonnes confondues), soit en augmentant explicitement le plafond serveur pour ce cas d'usage précis (avec un plafond dur raisonnable, ex. 500, pas illimité), soit en chargeant le Kanban colonne par colonne avec la pagination serveur déjà existante plutôt qu'en un seul appel — prouvé par un test qui crée plus de 50 leads et vérifie qu'ils apparaissent tous dans la réponse consommée par la vue Kanban.
    detecte_le: '2026-07-20'
    source: manuel
    confiance: certain
    note: |
      Constat transmis directement par le porteur, formulé initialement comme un simple souci de performance (« le kanban charge 200 lignes d'un coup ») — vérification demandée par la procédure d'audit a révélé un défaut plus grave que celui décrit : `LeadsPage.tsx:130` envoie bien `pageSize: view === "kanban" ? 200 : pageSize`, MAIS `server/src/utils/listQuery.ts:19` (`const pageSize = Math.min(50, Math.max(1, Number(query.pageSize) || 10))`) plafonne TOUT `pageSize` reçu à 50, sans exception pour la vue Kanban. `lead.controller.ts:9` confirme que `getLeads` passe bien par `parseListQuery`. Donc le Kanban Leads ne charge JAMAIS 200 leads — il en reçoit au maximum 50, silencieusement, sans erreur ni message : un pipeline avec plus de 50 leads perd une partie de ses leads dans certaines colonnes (typiquement NEW, la plus peuplée) sans que l'utilisateur ne le sache. Gravité élevée à « majeur » (pas « bloquant ») car l'effet reste local à l'affichage (les leads ne sont pas perdus en base, juste invisibles dans cette vue précise) et dépend d'un volume de leads > 50, non garanti sur un pipeline en lancement (0 client actif à ce jour).
      CORRECTIF ÉCRIT ET VÉRIFIÉ, session du 2026-07-20 : `parseListQuery` (`listQuery.ts`) accepte désormais un second paramètre optionnel `maxPageSize` (défaut 50, comportement inchangé pour tout autre appelant) ; `lead.controller.ts#getLeads` passe `LEADS_MAX_PAGE_SIZE = 500` explicitement — plafond dur choisi, pas illimité, spécifique à ce seul endpoint (aucun autre endpoint de liste n'a ce besoin de « tout charger d'un coup »). Preuve : nouveau fichier `server/test/leadsKanbanMaxPageSize.test.ts` (3 cas) — `parseListQuery` avec le plafond relevé laisse passer `pageSize: 200` sans troncature, le plafond par défaut (sans override) reste bien à 50 pour tout autre endpoint, et `leadRepository.findAll` avec `pageSize: 200` retourne bien les 60 leads réels créés en base par le test (pas seulement 50). En vérifiant ce correctif, un test flaky préexistant a été trouvé et corrigé dans le même fichier commité sous SEC-100 (`leadService.test.ts`) : les 4 appels à `leadService.getLeads({ page: 1, pageSize: 50 }, ...)` n'y précisaient jamais `orderDir`, un champ pourtant non optionnel du type `ListQueryOptions` — à l'exécution `orderDir: undefined` produisait un tri Prisma non déterministe (`orderBy: { createdAt: undefined }`), risquant de faire sortir de la première page de 50 les leads fraîchement créés par CE test précis si la base de test partagée contenait déjà suffisamment de leads d'autres tests (exactement ce que ce nouveau fichier de 60 leads pour SEC-118 a rendu visible en pratique — 1 échec intermittent observé sur 3 exécutions consécutives de la suite avant correction, aucun depuis). Corrigé en ajoutant `orderDir: "desc"` explicitement aux 4 appels, garantissant que les leads du test apparaissent en tête de la première page quel que soit le volume déjà présent en base. Vérification complète serveur : `npx tsc --noEmit` (clean), `npm run lint` (0/0), `npx tsx --test test/run-all.test.ts` (415/415, stable sur 2 exécutions consécutives après ce correctif de flakiness). Résolu SANS confirmation CI (workflow GitHub Actions sur `origin/main` en `workflow_dispatch` uniquement, déviation documentée depuis la session du 2026-07-17).
