# Périmètre : 4.1 CRM & Pipeline commercial
# 37 anomalie(s)

anomalies:
  - id: SEC-005
    titre: Type frontend désynchronisé du schéma Prisma — champ mort (Lead.companyId)
    perimetre: 4.1 CRM & Pipeline commercial
    regle_violee: null
    classe: type_frontend_desynchronise_du_schema_prisma
    gravite: mineur
    statut: resolu
    critere_de_resolution: |
      C'est résolu quand le champ companyId est supprimé du type Lead dans client/src/api/contactRequests.api.ts, OU qu'une recherche exhaustive (client/, shared/, e2e/) confirme qu'aucun autre type frontend ne déclare de champ absent du modèle Prisma correspondant.
    detecte_le: '2026-07-16'
    source: audit_llm
    confiance: certain
    note: |
      client/src/api/contactRequests.api.ts:11 déclare companyId: string sur un type Lead ; le modèle Prisma Lead (schema.prisma) ne porte que serviceId, pas de companyId. Champ mort : aucune trace d'un appelant qui le peuplerait ou le lirait réellement, aucune contrepartie côté serveur. Recherche des autres occurrences de cette classe de défaut effectuée par un agent délégué sur les 42 fichiers de client/src/api/, 12 fichiers de client/src/types/, et 10 fichiers de shared/src/schemas/ — un second cas trouvé, voir SEC-006 (même classe, critère de résolution et gravité différents → ID distinct). Non couvert par cette recherche : types inline dans client/src/features/**/*.tsx et client/src/hooks/*.ts — voir EXPLORATION.md.
      RÉSOLU (session du 2026-07-17) : `companyId: string` supprimé du type `Lead` (client/src/api/contactRequests.api.ts) après avoir confirmé zéro appelant réel (`grep -rn "\.companyId\b" client/src/` → aucun résultat). Recherche exhaustive complétée sur le périmètre laissé de côté en 2026-07-16 : `client/src/features/**/*.tsx` et `client/src/hooks/*.ts` (`grep -rln "companyId"` → aucun résultat), puis élargie à tout `client/src/` et `shared/` par prudence (également aucun résultat) — confirme le second volet du critère de résolution en plus du premier, aucune autre occurrence de cette classe de défaut trouvée. `npm run typecheck --workspace client` vert (0 erreur) après suppression.
      Correctif poussé sur origin/main, session du 2026-07-17 (hash à renseigner au commit). `resolu` déclaré SANS confirmation CI — dérogation explicite à la règle commit+CI de CLAUDE.md, cohérente avec la dérogation déjà établie par le porteur du projet dans cette même session (« no make it resolu »).
  - id: SEC-028
    titre: proposalService.create n'appliquait aucun scoping de pôle sur clientId/leadId/serviceRequestId — un Manager pouvait créer une proposition (donc plus tard un projet) sur un client/lead d'un autre pôle
    perimetre: 4.1 CRM & Pipeline commercial, 4.2 Gestion de projet — server/src/services/proposal.service.ts, server/src/controllers/proposal.controller.ts
    regle_violee: RG-002
    classe: null
    gravite: majeur
    statut: resolu
    critere_de_resolution: |
      C'est résolu quand un Manager ne peut, par aucune combinaison de clientId/leadId/serviceRequestId, créer une proposition rattachée à un Lead assigné à un autre pôle ou à un Client déjà exclusivement lié à un projet d'un autre pôle — vérifié par un test qui appelle réellement `proposalService.create` contre une base réelle sur les deux axes (rejet ET autorisation légitime), pas seulement une lecture de code.
    detecte_le: '2026-07-18'
    source: manuel
    confiance: certain
    note: |
      Trouvé en vérifiant RG-002 (« Un Manager ne peut créer ou modifier un projet que dans son propre pôle ») en réponse à la question du porteur du projet « is there something a vérifier dans ce projet » — pas pendant un audit formel de 4.1/4.2, enregistré immédiatement conformément à CLAUDE.md.
      CONSTAT : `project.service.ts#createProject`/`updateProject` forcent bien `serviceId` au pôle du Manager (déjà vérifié `code_direct`), ce qui couvre le texte littéral de RG-002. Mais `createProject` ne vérifie jamais que la proposition source (`data.proposalId`) appartient elle-même au pôle du Manager — et en remontant la chaîne, `proposalService.create` (appelée par `POST /proposals`, seul point d'entrée réel de création) n'appliquait AUCUN scoping de pôle sur `clientId`/`leadId`/`serviceRequestId`, seulement le RBAC générique (`authorize("ADMIN","MANAGER")` + `requirePermission("proposals", "create")`, rôle/permission, jamais le pôle de la cible). Le seul contrôle existant (`createProposal` controller, branche `req.body.projectId`) ne s'active que si un `projectId` est fourni à la création — or une proposition naît presque toujours SANS projet existant (c'est justement `createProject` qui le crée ensuite à partir de la proposition acceptée). Un Manager du pôle A pouvait donc créer une proposition — et plus tard un projet, une fois acceptée — sur un client/lead du pôle B, contournant l'intention de RG-002 sans violer son texte littéral.
      NUANCE STRUCTURELLE CONFIRMÉE PAR LECTURE DIRECTE DU SCHÉMA : `Client` n'a PAS de pôle propre (`schema.prisma` : aucun champ `serviceId` sur `Client`, un même client peut avoir des projets dans plusieurs pôles) ; `ServiceRequest` non plus (son pôle, quand il en a un, se déduit de `client.projects.some.serviceId` — mécanisme déjà utilisé pour scoper `ServiceRequest` en LECTURE dans `serviceRequest.repository.ts`, jamais repris ici) ; `Lead`, en revanche, a un `serviceId` propre et non ambigu.
      DÉCISION DU PORTEUR DU PROJET (AskUserQuestion, session du 2026-07-18) : « Vérifier le pôle du Lead directement (`Lead.serviceId`), et pour ServiceRequest/clientId nu, autoriser si le client a AU MOINS un projet dans le pôle du Manager OU aucun projet du tout (client neuf) (Recommandé) ».
      CORRECTIF ÉCRIT : nouvelle fonction `assertProposalCreationInScope(data, scope)` dans `proposal.service.ts` — pour `leadId`, rejette si `Lead.serviceId` existe et diffère du pôle du Manager ; pour `clientId`, calcule l'ensemble des `serviceId` distincts des projets existants du client et rejette seulement si le client a AU MOINS un projet ET aucun dans le pôle du Manager (un client sans aucun projet reste neutre/accessible). Appelée en tête de `proposalService.create` (nouveau paramètre `scope?: ServiceScope`, optionnel donc rétrocompatible — un seul appelant réel dans tout le dépôt, `proposal.controller.ts`, déjà mis à jour). Le contrôle existant sur `projectId` (déjà présent, plus précis via `getProjectById`) est conservé tel quel, pas remplacé.
      Nouveau test `server/test/proposalCreationScope.test.ts` (câblé dans `test/run-all.test.ts`), appelle réellement `proposalService.create` contre une base migrée, 5 cas : Lead d'un autre pôle → rejeté (404) ; Lead du même pôle → autorisé ; Client déjà exclusivement lié à un projet d'un autre pôle → rejeté (404) ; Client neuf sans aucun projet → autorisé ; ADMIN (sans scope de pôle) → toujours autorisé quel que soit le pôle cible.
      `npx tsc --noEmit` vert. Suite complète : 281/281 (276 + 5 nouveaux), ~27s, aucune régression. `resolu` déclaré SANS confirmation CI — la CI est actuellement désactivée sur `origin/main` sur demande du porteur du projet (workflow_dispatch seul, session du 2026-07-17), dérogation « no make it resolu » déjà établie dans cette session.
  - id: SEC-032
    titre: Le validateur currencyCode acceptait n'importe quelle devise à 3 lettres — aucune contrainte réelle à TND en écriture sur POST /invoices et POST /proposals
    perimetre: 4.4 Facturation, 4.1 CRM & Pipeline commercial — server/src/validators/invoice.validator.ts, server/src/validators/proposal.validator.ts, shared/src/schemas/common.schema.ts
    regle_violee: RG-001
    classe: null
    gravite: majeur
    statut: resolu
    critere_de_resolution: |
      C'est résolu quand `createInvoiceSchema`/`createProposalSchema` rejettent explicitement toute devise différente de TND, ET qu'un test appelle réellement ces validateurs (pas une réimplémentation locale) pour confirmer le rejet d'une devise arbitraire ET l'acceptation de TND (explicite ou par défaut).
    detecte_le: '2026-07-18'
    source: manuel
    confiance: certain
    note: |
      Trouvé en vérifiant RG-001 (« toute proposition/facture est libellée en TND ») en réponse à la question du porteur du projet « is there something a vérifier dans ce projet », 6e règle traitée après RG-008/RG-002/RG-017/RG-004b/RG-012 — la dernière de la liste initiale des 8 règles à provenance faible identifiées par l'audit de lecture du début de cette série.
      CONSTAT : `currencyCode` (défini séparément dans `invoice.validator.ts` ET `proposal.validator.ts`, deux copies dupliquées) valait `z.string().length(3).toUpperCase()` — AUCUNE contrainte de valeur, n'importe quelle devise à 3 lettres (`USD`, `EUR`, etc.) passait la validation sur `POST /invoices` et `POST /proposals`. Seul un `.default("TND")` existait, mais rien n'empêchait un appelant de fournir explicitement une autre valeur. Aucun filtre de rattrapage dans `invoice.service.ts`/ `proposal.service.ts` : `data.currency` transite tel quel jusqu'à la base. Impact réel confirmé : `DEFAULT_CURRENCY = "TND"` (`server/src/constants/currency.ts`) est déjà utilisée comme FILTRE dans les repositories analytics/forecast (`executiveMetrics.repository.ts`, `revenueForecast.repository.ts`, déjà lus intégralement lors de l'audit du module 4.8) — une facture créée dans une autre devise aurait été silencieusement exclue de TOUS les KPIs financiers (cash, forecast, executive metrics), pas seulement « non conforme à TND » mais invisible du pilotage.
      TROISIÈME COPIE TROUVÉE, également corrigée : `shared/src/schemas/ common.schema.ts` exporte sa propre `currencyCode` identique (même défaut), utilisée par `shared/src/schemas/invoice.schema.ts`/ `proposal.schema.ts` — ces deux fichiers sont du CODE MORT confirmé (grep exhaustif sur tout le monorepo : zéro import réel côté client ou serveur, seulement réexportés via `shared/src/index.ts`), mais portant le même nom exact que les vrais validateurs serveur — un risque de piège pour un développeur futur qui importerait `createInvoiceSchema` depuis `@secritou/shared` en pensant utiliser le vrai validateur. Corrigée par cohérence, sans activer ce code mort ni créer de nouvelle capacité.
      DÉCISION DU PORTEUR DU PROJET (AskUserQuestion, session du 2026-07-18) : « Lacune réelle à corriger : contraindre `currencyCode` à TND uniquement (Recommandé) ».
      CORRECTIF ÉCRIT : `currencyCode` changée en `z.literal(DEFAULT_CURRENCY)` (import de la constante serveur existante, une seule source de vérité) dans `invoice.validator.ts` et `proposal.validator.ts` ; même changement en dur (`z.literal("TND")`, `shared/` ne peut pas dépendre de `server/`) dans `shared/src/schemas/common.schema.ts`. Vérifié qu'aucun test réel n'était affecté : les seuls usages de devises non-TND dans les tests (`idor.test.ts`, `proposal.service.test.ts`, `proposalAcceptCascade.test.ts`, `validators.test.ts`) sont soit des fixtures de données pour tester une logique différente (IDOR, cascade), soit — pour `validators .test.ts` — un schéma réimplémenté localement, déjà identifié comme déconnecté du vrai validateur, non affecté par ce changement.
      ÉCART INCIDENT TROUVÉ ET CORRIGÉ DANS LA MÊME PASSE (hors périmètre strict de SEC-032, enregistré immédiatement conformément à CLAUDE.md) : en exécutant les tests du workspace `shared` pour confirmer l'absence de régression, `shared/src/constants/ contactForm.test.ts` échouait — un test figé (« frozen enum test ») attendait encore les 4 anciens noms de pôles anglais pré-migration (`Business Performance`, `Digital Growth`, `Technology Solutions`, `AI & Automation`) alors que `contactForm.ts` utilise déjà les 4 noms canoniques FR depuis une session antérieure (cf. SEC-001, déjà résolue côté serveur/client mais cette occurrence dans `shared/` n'avait jamais été couverte). Le code était déjà correct, seul le test était faux — corrigé (pas le code), même classe de défaut que SEC-001, occurrence distincte du même vocabulaire obsolète.
      Nouveau test `server/test/currencyRejectsNonTnd.test.ts` (câblé dans `test/run-all.test.ts`), appelle réellement `createInvoiceSchema`/ `createProposalSchema` (pas une réimplémentation) : rejette USD/EUR, accepte TND explicite et par défaut sur les deux schémas.
      `npx tsc --noEmit` vert (server, client). `npm test` du workspace `shared` vert (9/9, après correction du test figé). Suite complète serveur : 292/292 (288 + 4 nouveaux), ~24-28s, aucune régression. `resolu` déclaré SANS confirmation CI : la CI est actuellement désactivée sur `origin/main` sur demande du porteur du projet (workflow_dispatch seul, session du 2026-07-17), dérogation « no make it resolu » déjà établie dans cette session.
      Toutes les 8 règles §5 identifiées par l'audit de lecture initial (RG-001, RG-002, RG-004b, RG-008, RG-012, RG-017, RG-005, RG-020) sont désormais traitées ou explicitement écartées comme non pertinentes (RG-005 statut PRÉVU par construction, RG-020 code déjà lu sans lacune technique réelle).
  - id: SEC-099
    titre: assertProposalInScope et proposalService.getAll scopent le MANAGER sur Proposal.projectId (relation avant, quasi toujours nulle) au lieu de linkedProject (le projet créé DEPUIS la proposition) — un MANAGER ne peut ni lister, ni lire, ni modifier, envoyer, accepter ou gérer les sections de ses propres propositions
    perimetre: 4.1 CRM & Pipeline commercial — server/src/services/proposal.service.ts, server/src/repositories/proposal.repository.ts
    regle_violee: RG-002
    classe: scoping_pole_manquant_ou_incorrect
    gravite: majeur
    statut: resolu
    critere_de_resolution: |
      C'est résolu quand un MANAGER, après avoir créé (chemin déjà autorisé par SEC-028) une proposition pour un lead/client de son propre pôle, peut ensuite la retrouver dans GET /proposals, l'ouvrir via GET /proposals/:id, la modifier, l'envoyer (POST /:id/send), l'accepter (POST /:id/accept) et gérer ses sections — le tout scopé au pôle réel de la proposition (dérivé du projet lié par la relation linkedProject, ou du lead/client d'origine), tandis qu'un MANAGER d'un autre pôle reçoit toujours 404 sur ces mêmes propositions. Prouvé par un test qui appelle réellement proposalService.getAll/getById/send sur une base migrée : une proposition DRAFT et une proposition ACCEPTED créées pour le pôle du MANAGER sont bien visibles/actionnables par lui, celles d'un autre pôle non.
    detecte_le: '2026-07-20'
    source: audit_llm
    confiance: certain
    note: |
      Lu directement en session : proposal.service.ts (intégral), proposal.repository.ts (intégral), schema.prisma#Proposal. Le modèle Proposal porte DEUX relations distinctes vers Project : `project`/`projectId` (relation "ProjectProposals", relation avant) et `linkedProject` (back-relation "ProjectProposal", le Project dont le champ `proposalId` pointe vers cette proposition). À la création, `projectId` est presque toujours nul (le projet n'existe pas encore). À l'acceptation, `acceptWithCascade` crée un Project avec `proposalId: proposal.id` (donc alimente `linkedProject`, la back-relation) — il n'écrit JAMAIS `proposal.projectId`. Résultat : `proposal.projectId` reste nul pour l'immense majorité des propositions, même ACCEPTED (sauf le cas rare où la proposition a été créée en pointant un projet préexistant). Or `assertProposalInScope` (proposal.service.ts:25-35) rejette explicitement tout MANAGER dès que `!proposal.projectId` (ligne 28 : `if (!proposal.projectId) throw new HttpError(404, ...)`), et `getAll` (proposal.service.ts:197-200 → proposal.repository.ts:18-20) filtre le MANAGER sur `where.project = { is: { serviceId } }` (même relation avant). Les deux chemins évaluent donc à nul/vide pour un MANAGER sur pratiquement toutes les propositions. Conséquence vérifiée par lecture de bout en bout (routes → controller → service → repository) : un MANAGER voit une liste de propositions vide et obtient 404 sur getById/update/send/accept/addSection/updateSection — le rôle MANAGER est en pratique exclu de tout le cycle de vie post-création des propositions, alors que RG-002 pose qu'il gère son pôle et que SEC-028 l'autorise explicitement à en CRÉER. Asymétrie : SEC-028 a corrigé le scope de création (sur Lead.serviceId / projets du client), mais le scope de LECTURE/écriture est resté branché sur la mauvaise relation, dans le sens trop restrictif. La correction n'est PAS un simple ajout de capacité : le pôle d'une proposition doit être dérivé de `linkedProject.serviceId` (ou du lead/client, comme le fait déjà assertProposalCreationInScope) au lieu de `projectId`. Signalé, non corrigé (audit lecture seule).
      CORRECTIF ÉCRIT ET VÉRIFIÉ, session du 2026-07-20 : tous les appelants de `assertProposalInScope` vérifiés un par un (getById, update, send, addSection, updateSection, deleteSection ; accept/reject passent par un appel préalable à getById en guard, confirmé dans proposal.controller.ts). `assertProposalInScope` réécrite pour dériver le scope de `linkedProject.serviceId` en priorité (autoritaire si présent), sinon du `leadId.serviceId`, sinon des projets existants du client — même logique que `assertProposalCreationInScope`, désormais partagée en esprit entre les deux fonctions. `findById` (proposal.repository.ts) étend le `select` de `linkedProject` pour inclure `serviceId`. `findProposalBySectionId` étend son `select` pour inclure `leadId` et `linkedProject.serviceId` (utilisé par updateSection/deleteSection). `proposalRepository.findAll` (liste) corrigée en miroir exact de la même règle, exprimée en clause Prisma `OR`/`AND` plutôt qu'en post-check, puisqu'un filtre de liste ne peut pas être un throw. Routes ADMIN-only (`DELETE /:id`, `DELETE /:id/sections/:sectionId`) vérifiées non concernées (Admin non scopé par pôle). Preuve : nouveau fichier `server/test/proposalScopeAfterCreation.test.ts` (4 cas, appelle le vrai proposalService contre une base migrée) — un MANAGER retrouve et lit sa propre proposition via lead avant tout projet, un MANAGER d'un autre pôle reçoit 404 et ne la voit pas dans sa liste, un MANAGER retrouve sa proposition après qu'acceptWithCascade ait créé son linkedProject, et un MANAGER est rejeté sur une proposition liée exclusivement (via client) à un projet d'un autre pôle sans lead. Vérification complète serveur : `npx tsc --noEmit` (propre), `npm run lint` (0/0), `npx tsx --test test/run-all.test.ts` (399/399, stable sur 2 exécutions consécutives). Résolu SANS confirmation CI (workflow GitHub Actions sur `origin/main` en `workflow_dispatch` uniquement, déviation documentée depuis la session du 2026-07-17).
  - id: SEC-100
    titre: Tests CRM en réimplémentation locale sur un companyId fictif (lead.repository.test.ts, leadService.test.ts, proposal.service.test.ts) — vert trompeur, ne prouvent rien sur le vrai scoping/IDOR des leads et propositions
    perimetre: 4.1 CRM & Pipeline commercial — server/test/lead.repository.test.ts, server/test/leadService.test.ts, server/test/proposal.service.test.ts
    regle_violee: null
    classe: test_reimplemente_companyid_fictif
    gravite: mineur
    statut: resolu
    critere_de_resolution: |
      C'est résolu quand ces trois fichiers de test appellent réellement le code de production CRM (leadRepository.findById/update/delete et son buildWhere, leadService, proposalService) — importé et exécuté, pas des fonctions locales réimplémentées — de sorte qu'ils deviennent rouges si le vrai scoping MANAGER (serviceId + assignedManagerId) ou la vraie logique de reject/send/update dérive. En particulier, la preuve d'isolation doit porter sur `serviceId` (le vrai mécanisme mono-tenant), jamais sur un `companyId` qui n'existe nulle part dans le dépôt.
    detecte_le: '2026-07-20'
    source: audit_llm
    confiance: certain
    note: |
      Lu directement en session : server/test/lead.repository.test.ts, server/test/leadService.test.ts, server/test/proposal.service.test.ts, comparés au code réel (lead.repository.ts, lead.service.ts, proposal.service.ts). Les trois fichiers déclarent en tête « mirror of … »/« mirrors the real service logic » et testent des fonctions LOCALES au fichier, jamais le code importé : (1) lead.repository.test.ts définit repositoryUpdate/repositoryDelete/ repositoryFindById avec un `where: { id, companyId }` et asserte que `companyId` DOIT figurer dans la clause WHERE — or le vrai lead.repository.ts n'a aucun `companyId` (dépôt mono-tenant, CLAUDE.md/ SEC-004/SEC-005 : aucune notion de companyId/tenantId), il scope sur `serviceId`/`assignedManagerId`. Ce test resterait vert même si le vrai buildWhere perdait tout scoping de pôle. (2) leadService.test.ts réimplémente un `serviceFilter` PLUS SIMPLE que le vrai buildWhere : sa version mock ne teste que `{ serviceId }`, alors que le vrai buildWhere applique un `OR` [serviceId, assignedManagerId] — le test ne couvre donc même pas la branche assignedManagerId du vrai code. (3) proposal.service.test.ts réimplémente reject/send/update (« mirrors proposalService.… ») avec un objet portant encore `companyId` et une signature `findById(id, companyId)` absente du vrai repository, et n'importe jamais proposalService. Même famille que SEC-087 (taskScope.test.ts/idor.test.ts, même défaut companyId fictif), mais critère de résolution distinct (trois fichiers du module 4.1, code cible différent : CRM leads/propositions) — relié par la classe, non fusionné, conformément à « un ID = un critère de résolution ». Signalé, non corrigé (audit lecture seule ; par ailleurs « un test rouge est une hypothèse sur le code » — ne pas réaligner sans instruction).
      CORRECTIF ÉCRIT ET VÉRIFIÉ, session du 2026-07-20 : les trois fichiers réécrits pour appeler le vrai code contre une base migrée, plus de `companyId` fictif nulle part. `lead.repository.test.ts` — appelle `leadRepository.findById`/ `findAll` réels : un MANAGER hors pôle reçoit `null`, un MANAGER dans son pôle lit la ressource, un MANAGER lit une ressource assignée directement à lui (`assignedManagerId`) même hors de son pôle (branche du vrai `OR` que l'ancienne version ne couvrait jamais), un ADMIN lit sans restriction, `findById` exclut un lead archivé par défaut et l'inclut sur demande explicite, `findAll` filtre correctement une liste MANAGER (6 cas). `leadService.test.ts` — le bloc `serviceMapping.serviceNameForType` (déjà réel) conservé tel quel ; le bloc `serviceFilter` fictif remplacé par des appels réels à `leadService.getLeads` : ADMIN voit tous pôles, MANAGER ne voit que son pôle, MANAGER voit aussi une ressource assignée directement hors pôle (couvre enfin la branche `assignedManagerId` que l'ancien mock ne testait jamais), MANAGER sans pôle (`userServiceId: null`) ne voit rien par défaut plutôt que tout (4 cas). `proposal.service.test.ts` — entièrement réécrit, appelle `proposalService.reject`/`send`/`update`/`acceptWithCascade` réels : reject transitionne un SENT vers REJECTED et refuse un DRAFT (`INVALID_PROPOSAL_TRANSITION`), send transitionne un DRAFT vers SENT, update reverte un SENT/VIEWED vers DRAFT sur un vrai changement de contenu (avec entrée d'historique réelle) mais pas sur un no-op ni un champ non-contenu (pdfUrl), acceptWithCascade rejette une version périmée (`PROPOSAL_VERSION_MISMATCH`, après un vrai bump de version) et réussit avec création de projet quand la version correspond (8 cas). Note : `acceptWithCascade` lui-même est déjà couvert par du code réel ailleurs (`portalActivationOnPayment.test.ts`, `projectCreateArchiveRestore.test.ts`, `proposalScopeAfterCreation.test.ts`), ce fichier ne duplique que le guard de version, jamais couvert par du vrai code avant cette session.
      DÉFAUT ANALOGUE REPÉRÉ HORS PÉRIMÈTRE, NON TRAITÉ ICI : `server/test/proposalAcceptCascade.test.ts` a exactement le même défaut (réimplémentation locale avec `companyId` fictif de `acceptWithCascade`) — hors du périmètre déclaré de SEC-100 (qui ne listait que 3 fichiers), non corrigé dans cette passe. À signaler séparément si une session future traite ce fichier.
      Vérification complète serveur : `npx tsc --noEmit` (clean), `npm run lint` (0/0), `npx tsx --test test/run-all.test.ts` (394/394, stable sur 2 exécutions consécutives — le nombre total de tests baisse légèrement par rapport à avant cette passe car les tests fictifs unitaires très nombreux sont remplacés par moins de tests réels contre une vraie base, chacun prouvant davantage). Résolu SANS confirmation CI (workflow GitHub Actions sur `origin/main` en `workflow_dispatch` uniquement, déviation documentée depuis la session du 2026-07-17).
  - id: SEC-101
    titre: 'Bouton « Créer une proposition » sur un lead : les 3 couches (Kanban, dialogue détail, serveur) se contredisent sur les statuts autorisés — échoue à 100% depuis le Kanban'
    perimetre: 4.1 CRM & Pipeline commercial — client/src/features/leads/LeadsKanban.tsx, client/src/features/leads/LeadDetailDialog.tsx, server/src/services/proposal.service.ts
    regle_violee: null
    classe: null
    gravite: majeur
    statut: resolu
    critere_de_resolution: |
