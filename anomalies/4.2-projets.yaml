      C'est résolu quand ProjectsPage.tsx ne présente plus de bouton ni de dialogue "Nouveau projet" (ce chemin de création directe étant incohérent avec la règle métier réelle "un projet naît toujours d'une proposition acceptée"), ET qu'aucun code mort correspondant (formulaire, handler, imports) ne subsiste — vérifié par lecture directe du fichier et par un build/typecheck client vert.
