    note: |
      Découvert en corrigeant SEC-212 : une fois le job `server` débloqué (seed) et la couverture repassée au-dessus des seuils, un seul test restait rouge — log CI lu directement : `AssertionError: a losing create must be rejected specifically for the cap, not an unrelated error`, avec en amont plusieurs lignes `prisma:error ... Transaction failed due to a write conflict or a deadlock. Please retry your transaction` sur `tx.taskChecklistItem.create()`. Distinct de SEC-077 (déjà `resolu`, même `classe`) : SEC-077 a fermé la fenêtre de course sur l'ATOMICITÉ du comptage plafond/position (un seul `count()` dans la transaction) ; ce constat porte sur la ROBUSTESSE du retry autour de cette même transaction sous charge réelle — critère de résolution distinct (stabilité sous contention réelle, pas seulement correction du calcul), donc ID séparé plutôt que réouverture de SEC-077 (CLAUDE.md « un ID = un critère de résolution »).
      Lu directement `taskChecklist.repository.ts#create` (lignes 48-78 avant correctif) : la boucle de retry ne considère comme rejouable que `err.code === "P2034"` (le code Prisma documenté pour un conflit de sérialisation OU un deadlock), avec 8 tentatives et un backoff `Math.random() * 20` (0-20ms plat, pas exponentiel). Sous 5 appelants concurrents réels contre un Postgres CI (pas un mock), ce budget peut s'épuiser avant que tous se soient sérialisés, laissant l'erreur Prisma brute remonter à l'appelant (ligne `if (!isSerializationConflict || remainingRetries === 0) throw err;`) au lieu du HttpError attendu — exactement le symptôme observé en CI, pas un défaut du test.
