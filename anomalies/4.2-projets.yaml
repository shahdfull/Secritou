      APPROFONDISSEMENT AVANT CORRECTIF : `useDeleteChecklistItem`/ `useUpdateChecklistItem`/`useCreateChecklistItem` (`useTaskChecklist.ts`) n'avaient en réalité AUCUN `onError`, pas même générique — plus grave que le rapport initial (qui parlait d'un « toast générique éventuel du hook ») : pour la checklist précisément, l'échec était RÉELLEMENT silencieux, zéro toast. Même constat pour `useCreateDocument`/`useUpdateDocument`/ `useDeleteDocument` (`useDocuments.ts`, consommé par `TaskAttachments.tsx` mais aussi `DocumentsPage.tsx` et `ProjectDetailPage.tsx`).
      Corrigé (même session, choix du porteur : « Tout traiter (4 items) ») : nouvel utilitaire partagé `client/src/utils/apiError.ts#getServerErrorMessage` (extrait `error.response.data.error.message`, même pattern déjà établi par `TasksKanban.tsx#handleDragEnd`). Câblé dans les `onError` de `useCreateTimeEntry` (`useTimeEntries.ts`), `useCreateProjectMeeting`/`useUpdateProjectMeeting`/ `useDeleteProjectMeeting`/`useSetMeetingSchedule` (`useProjectMeetings.ts`), `useCreateChecklistItem`/`useUpdateChecklistItem`/ `useDeleteChecklistItem` (`useTaskChecklist.ts`, qui n'avaient aucun `onError` — désormais avec message serveur en priorité et un repli spécifique par action), et `useCreateDocument`/`useUpdateDocument`/`useDeleteDocument` (`useDocuments.ts`, bénéficie aux 3 consommateurs, pas seulement `TaskAttachments.tsx`). Corrigé au niveau des HOOKS plutôt qu'en ajoutant un second `onError` par composant appelant, pour éviter un double toast (React Query appelle à la fois le `onError` du `useMutation` et celui passé à `mutate()`, vérifié par lecture du code source `@tanstack/query-core`). Clés i18n `documents.createError`/`updateError`/`deleteError` ajoutées (FR/EN, absentes jusqu'ici).
      Preuve par test réel : nouveau fichier `useTaskChecklist.test.tsx` (2 cas) — appelle réellement `useCreateChecklistItem` contre un rejet Axios simulé porteur d'un code `PROJECT_ARCHIVED`, confirme le message serveur exact affiché (pas de double toast) ; second cas, absence de réponse structurée → repli spécifique. Vérification complète : `npx tsc --noEmit` (client, propre), `npx vitest run` (client, 90/90), `npm run lint` (client, 12 warnings — SEC-049, stable), `npm run build` (succès), `node scripts/check-i18n.mjs` (vert). Résolu SANS confirmation CI : workflow GitHub Actions sur `origin/main` en `workflow_dispatch` uniquement (déviation établie en session le 2026-07-17, citée à chaque clôture depuis).
  - id: SEC-096
    titre: Couleurs et libellés de statut de tâche codés en dur dans ProjectDetailPage (TASK_STATUS_COLOR/TASK_STATUS_LABELS) et 3e jeu dans TasksKanban (STATUS_CONFIG) au lieu des helpers centralisés — un même statut change de couleur selon l'écran, libellés FR hors i18n
    perimetre: 4.2/4.3 — client/src/features/projects/ProjectDetailPage.tsx (TASK_STATUS_COLOR, TASK_STATUS_LABELS), client/src/features/tasks/TasksKanban.tsx (STATUS_CONFIG)
    categorie: H
    regle_violee: null
    classe: coherence_ui_couleurs_i18n
    gravite: mineur
    statut: resolu
    critere_de_resolution: |
      Sera résolu quand ProjectDetailPage et TasksKanban rendent les badges de statut de tâche via `getTaskStatusBadgeClass` (utils/statusColors.ts) et les libellés via `getStatusLabel(status, t)` (taskUtils) au lieu de leurs tables locales codées en dur en français, vérifié par relecture — de sorte qu'un même statut ait partout la même couleur et un libellé traduisible.
    detecte_le: '2026-07-20'
    source: audit_llm
    confiance: certain
    note: |
      Audit a11y/UX LECTURE SEULE, lecture directe. `ProjectDetailPage.tsx` (lignes 33-45) redéfinit localement `TASK_STATUS_COLOR` (ex. `IN_PROGRESS: bg-yellow-100 text-yellow-700`, `REVIEW: bg-purple-100 text-purple-700`) et `TASK_STATUS_LABELS` (« À faire »/« En cours »/… en dur), alors que le reste du module passe par `getTaskStatusBadgeClass` (bg-primary-soft/accent-soft) et `getStatusLabel(…, t)`. `TasksKanban.tsx#STATUS_CONFIG` (lignes 39-44) constitue un 3e jeu encore différent (bg-blue-100/bg-yellow-100) avec libellés FR en dur. Conséquences : (a) un même statut n'a pas la même couleur selon l'écran (détail projet vs liste vs kanban), source de confusion produit ; (b) les libellés FR codés en dur échappent à l'i18n FR/EN (`fallbackLng: "fr"`) — un passage EN laisserait « À faire » non traduit. Ce ne sont pas des contrastes sous le seuil AA en soi (les paires -100/-700 tiennent), mais des jeux divergents non centralisés qui rendent toute correction de contraste future partielle. Gravité mineure (cosmétique/cohérence).
      Corrigé (même session, choix du porteur : « Tout traiter (4 items) ») : `TASK_STATUS_COLOR`/`TASK_STATUS_LABELS` (`ProjectDetailPage.tsx`) supprimés, ses 2 sites d'appel routés sur `getTaskStatusBadgeClass(status)` (utils/statusColors.ts) et `getTaskStatusLabel(status, t)` (alias importé de `taskUtils.ts#getStatusLabel`). `STATUS_CONFIG`/`StatusConfig` (`TasksKanban.tsx`) supprimés — `bgColor` n'était de toute façon jamais consommé dans le rendu (vérifié par grep avant suppression), seul `label` l'était pour l'en-tête de colonne, remplacé par `getStatusLabel(status, t)`. Effet visible : REVIEW affiche désormais partout « En revue » (clé i18n `tasksPage.statuses.review`), plus « Révision » (ProjectDetailPage) ni « En révision » (TasksKanban) — les 3 libellés distincts convergent vers un seul texte traduisible. Preuve par test réel : `ProjectDetailPage.test.tsx` (1 cas — une tâche REVIEW affiche « En revue », jamais l'ancien « Révision » codé en dur). Vérification complète : `npx tsc --noEmit` (client, propre), `npx vitest run` (client, 90/90), `npm run lint` (client, 12 warnings — SEC-049, stable), `npm run build` (succès). Résolu SANS confirmation CI : workflow GitHub Actions sur `origin/main` en `workflow_dispatch` uniquement (déviation établie en session le 2026-07-17, citée à chaque clôture depuis).
  - id: SEC-097
    titre: Actions en masse sur les taches (bulkUpdateStatus/bulkDelete) executees strictement en serie, une tache a la fois, chacune retraversant tout le chemin updateTask/deleteTask (5-8 requetes + invalidations de cache) — jusqu'a 100 iterations sequentielles par requete HTTP
    perimetre: 4.2 Gestion de projet — server/src/services/task.service.ts#bulkUpdateStatus/#bulkDelete, client/src/features/tasks/components/TasksListView.tsx (selection jusqu'a la page entiere)
    categorie: C
    regle_violee: null
    classe: null
    gravite: mineur
    statut: resolu
    critere_de_resolution: |
      Sera résolu quand un ADMIN/MANAGER qui sélectionne N tâches et déclenche un changement de statut ou une suppression groupée voit la réponse revenir sans que le serveur ait exécuté N boucles strictement séquentielles de 5 à 8 requêtes chacune : soit en parallélisant les itérations (Promise.all borné), soit en groupant les lectures/écritures communes (une seule invalidation de cache par pôle/client au lieu d'une par tâche), tout en conservant le rapport détaillé par id et le passage par la même validation métier.
    detecte_le: '2026-07-20'
    source: audit_llm
    confiance: certain
    note: |
      Audit performance/scalabilité du module Gestion de Projets, lecture directe. `bulkUpdateStatus`/`bulkDelete` (task.service.ts, lignes 299-323) itèrent `for (const id of taskIds)` en `await` séquentiel, appelant `this.updateTask`/`this.deleteTask` une fois par tâche. Ce choix est délibéré et documenté (commentaire lignes 290-298 : réutiliser la logique métier plutôt que la dupliquer, traitement « au mieux » avec rapport par id) — l'angle métier n'est PAS rouvert. L'angle performance ne l'était pas : chaque `updateTask` déclenche `findByIdAdmin` (1) + `assertProjectInScope`/`assertProjectIsOpenForTaskChanges` (1-2) + éventuellement `checkFreelancerAvailability` + `taskRepository.update` (updateMany + findFirst = 2) + `project.findUnique` (1) + notifications + `invalidateTags` (round-trips Redis), soit ~5-8 requêtes par tâche. Le plafond de sélection est la page entière du tableau (pageSize max 50 côté liste) ; côté route/validateur bulk, à vérifier si un plafond de 100 ids s'applique (mentionné dans les commentaires SEC-075 mais non relu ici). À 50-100 tâches, c'est 250 à 800 requêtes SQL sérialisées dans un seul handler HTTP, chacune attendant la précédente — latence cumulée et connexion DB monopolisée pendant toute la durée. Impact réel faible à ce stade (0 client actif, volumes nuls) ; gravité mineure, mais réel motif d'amplification non couvert par un ID existant (SEC-060 couvre la fonctionnalité bulk et son autorisation, pas son coût séquentiel). Distinct de SEC-091 (N+1 côté client sur le portail) : ici l'amplification est intra-requête côté serveur.
      APPROFONDISSEMENT AVANT CORRECTIF : plafond confirmé par lecture directe (`server/src/validators/task.validator.ts:72,79`, `taskIds: z.array(z.string().uuid()).min(1).max(100)`) — exactement 100, pas 50-100 comme formulé prudemment ci-dessus. Jusqu'à ~800 requêtes SQL sérialisées confirmé, pas une estimation.
      Corrigé : `bulkUpdateStatus`/`bulkDelete` remplacent la boucle `for...of` séquentielle par `Promise.allSettled(taskIds.map(...))` — chaque tâche traverse toujours exactement le même chemin complet `updateTask`/`deleteTask` (aucune règle métier contournée, le traitement reste « au mieux », le rapport détaillé par id est inchangé), mais les N appels s'exécutent désormais en parallèle au lieu d'en série. Aucun risque de course entre tâches : chaque itération porte sur un `id` de tâche distinct, jamais la même ligne, donc aucune requête Prisma concurrente ne peut se chevaucher sur les mêmes verrous. Preuve par test réel : `taskBulkActions.test.ts` (« SEC-097 », 1 cas) — crée 10 tâches réelles, mesure le temps d'un `bulkUpdateStatus` sur les 10 contre le temps d'un seul `updateTask` isolé, confirme que le lot reste dans le même ordre de grandeur qu'un seul appel (marge ×4, pas ×10) — preuve empirique de la parallélisation, pas seulement une relecture du code. Vérification complète : `npx tsc --noEmit` (serveur, propre), `npx tsx --test test/run-all.test.ts` (395/395, stable sur 2 exécutions consécutives), `npm run lint` (serveur, 0 warning). Résolu SANS confirmation CI : workflow GitHub Actions sur `origin/main` en `workflow_dispatch` uniquement (déviation établie en session le 2026-07-17, citée à chaque clôture depuis).
      FLAKE OBSERVÉ ET CORRIGÉ (2026-07-23, run CI `npm run test:coverage --workspace=server` sur le commit `4432dff`) : le même test d'assertion de timing (`taskBulkActions.test.ts`) a échoué sur ce run précis (marge ×4 dépassée), faisant échouer tout le job server. Code réel revérifié à cette occasion : `task.service.ts:307`, `bulkUpdateStatus` utilise bien `Promise.allSettled(taskIds.map(...))`, pas de boucle séquentielle — le correctif SEC-097 lui-même n'a pas régressé, ce n'était pas une réouverture de ce défaut, seulement une marge de test trop stricte pour la contention réelle du runner GitHub Actions partagé. Décision explicite du porteur (AskUserQuestion) : élargir la marge ×4 → ×6 plutôt qu'ajouter un retry ou ne rien faire — `server/test/taskBulkActions.test.ts` modifié en conséquence, le principe prouvé (lot concurrent ~1x, jamais proche de ~10x séquentiel) reste inchangé, seul le bruit absorbé change. Pas de nouvel ID ouvert pour ce point (même critère de résolution que SEC-097, pas une classe de défaut distincte).
