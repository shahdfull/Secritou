    source: manuel
    confiance: certain
    note: |
      Signalé directement par le porteur du projet, avec une analyse de cause racine déjà fournie et deux options explicitement proposées "à trancher avec le PO" — confirmé intégralement par lecture directe des 4 fichiers cités avant toute action, conformément à CLAUDE.md (ne jamais inférer une décision produit).
      CONSTAT (confirmé) : `project.validator.ts#createProjectSchema` exige `proposalId: z.string().uuid()`, non optionnel. `project.service.ts#createProject` interroge cette proposition et lève `404 "Proposal not found"` si absente, ou `422 PROPOSAL_NOT_ACCEPTED` si son statut n'est pas `ACCEPTED`. Or `ProjectsPage.tsx` importait `createProjectSchema`/ `CreateProjectForm` depuis `@secritou/shared` (schéma générique SANS `proposalId`), et `CreateProjectInput` (`client/src/types/project.ts`) ne déclare pas ce champ non plus — confirmé par lecture directe des deux schémas. Aucun champ du formulaire ne le collectait. Conséquence vérifiée de bout en bout (formulaire → hook → API → validateur → service) : tout ADMIN/ MANAGER cliquant "Nouveau projet" recevait systématiquement un rejet serveur. `POST /projects` confirmé comme SEUL appelant de ce chemin dans tout le dépôt (grep exhaustif de `projectsApi.create`/ `useCreateProject`).
