    titre: 'projectService.clientApprove : le preread (status !== REVIEW, clientApprovedAt déjà posé) tourne hors transaction et n''est jamais re-vérifié dans le $transaction — contrairement aux gardes tâches ouvertes/acompte/approbations qui, elles, sont explicitement re-vérifiées via tx (commentaire ligne 341-344) — deux appels concurrents (double-clic, retry réseau) sur le même projet REVIEW peuvent tous deux passer le preread et écraser clientApprovedAt/clientApprovedById avec un second horodatage'
    perimetre: 4.2 Gestion de projet, 4.4 Facturation — server/src/services/project.service.ts#clientApprove (lignes 296-388)
    categorie: A
    regle_violee: null
    classe: toctou_precheck_hors_transaction
    gravite: mineur
    statut: resolu
    critere_de_resolution: |
      C'est résolu quand `tx.project.update` (ligne 365) est précédé, à l'intérieur du même `$transaction`, d'une relecture de `status`/ `clientApprovedAt` (via `tx.project.findUnique`, comme c'est déjà fait pour `openTasksTx`/`depositTx`/`unresolvedApprovalsTx` juste au-dessus) qui rejette explicitement un second appel sur un projet déjà `COMPLETED` — prouvé par un test qui appelle deux fois `projectService.clientApprove` en séquence rapprochée sur le même projet et vérifie que `clientApprovedAt` du second appel est soit rejeté (409), soit identique au premier (jamais écrasé par un second horodatage).
    detecte_le: '2026-07-21'
    source: audit_llm
    confiance: certain
    note: |
      Audit DB (item 3, transactions/isolation), passe complémentaire. Vérifié par lecture directe ligne par ligne de `clientApprove` (`project.service.ts:295-388`). Le `preread` (hors transaction, via `prismaRead`) vérifie `clientApprovedAt` déjà posé (ligne 302) et `status !== "REVIEW"` (ligne 308, ajouté par SEC-085 — voir cette entrée, `resolu`, dont le critère de résolution portait uniquement sur « la garde existe-t-elle », pas sur sa re-vérification en transaction ; SEC-177 est distinct par son critère de résolution, relié à SEC-085 par la `classe`). À l'intérieur du `prisma.$transaction` (ligne 340), un commentaire explicite (lignes 341-344) justifie pourquoi `openTasksTx`/`depositTx`/ `unresolvedApprovalsTx` sont re-vérifiés via `tx` : « the preread checks above ran outside it [...] Without this, the project could complete despite one of these conditions no longer holding » — le même raisonnement s'applique à `status`/`clientApprovedAt`, mais aucune relecture de ces deux champs n'existe dans le bloc `tx`. Impact borné, pas une duplication financière : la création de la facture de solde reste protégée (ligne 372, `balanceAlreadyExistsInTx` relit `project.invoices` à l'intérieur du même `tx.project.update`, donc un deuxième appel sérialisé par le verrou de ligne Postgres verrait la facture déjà créée par le premier) — seul l'horodatage d'approbation (`clientApprovedAt`/`clientApprovedById`, valeur potentiellement opposable en cas de litige contractuel sur la date d'acceptation du projet) peut être silencieusement écrasé par un second appel concurrent, sans erreur ni trace de la tentative. Non déclenché par un attaquant externe : nécessite deux appels quasi simultanés du même CLIENT propriétaire (double-clic UI, retry réseau côté `client-approve` — aucune clé d'idempotence sur cette route, vérifié : `project.controller.ts#clientApproveProject` ne transmet aucun paramètre d'idempotence à `projectService.clientApprove`).
      CORRECTIF ÉCRIT (session en cours), `en_cours` en attente de vérification par test réel : le `Promise.all` de re-vérification intra-transaction (`project.service.ts`, bloc `tx`) relit désormais aussi `status`/`clientApprovedAt` via `tx.project.findUnique({ select: { status, clientApprovedAt } })`, aux côtés des trois gardes existantes — un second appel concurrent est rejeté avec 409 `PROJECT_ALREADY_APPROVED` (ou `PROJECT_NOT_IN_REVIEW`) au lieu d'écraser silencieusement l'horodatage. Test écrit (`server/test/projectClientApproveConcurrency.test.ts`, importé dans `run-all.test.ts`) : deux appels strictement concurrents (`Promise.allSettled`) au vrai `projectService.clientApprove` sur le même projet REVIEW, assertion qu'exactement 1 réussit, que le rejet porte `PROJECT_ALREADY_APPROVED`, et que `clientApprovedAt` n'est posé qu'une fois. `npx tsc --noEmit` vert. NON exécuté : base de données inaccessible au moment de l'écriture (Docker Desktop arrêté, bloquant documenté dans cette session) — reste `en_cours` conformément à la règle CLAUDE.md (un correctif non vérifié par test n'est pas `resolu`), à passer `resolu` dès que la suite tourne verte sur ce test. Fix et test produits par mes propres appels d'outils dans cette session.
      CORRECTION DU CORRECTIF + CONFIRMATION (même session, après retour de l'infrastructure) : le premier correctif (relecture de status/clientApprovedAt via tx.project.findUnique dans le Promise.all du bloc transactionnel) s'est révélé INSUFFISANT — mon propre test de concurrence l'a prouvé en laissant les DEUX appels réussir : sous READ COMMITTED, les deux transactions lisent l'état pré-commit, la relecture ne sérialise rien. Remplacé par le seul patron réellement atomique : un tx.project.updateMany({ where: { id, status: "REVIEW", clientApprovedAt: null }, data: {...} }) — le perdant bloque sur le verrou de ligne, ré-évalue le WHERE contre l'état commité du gagnant, matche 0 ligne et reçoit 409 PROJECT_ALREADY_APPROVED (la relecture post-échec distingue ALREADY_APPROVED de NOT_IN_REVIEW pour le bon code d'erreur). Test de concurrence exécuté vert dans la suite complète : 513/513, 0 échec (run final7). Dérogation CI du porteur toujours applicable.
  - id: SEC-185
    titre: La signature électronique de contrat (PATCH /documents/:id/sign) ne capture ni hash du contenu du PDF, ni adresse IP, ni user-agent du signataire — seuls signedAt/signedByClientId sont écrits, alors que le même service capture déjà ipAddress/userAgent pour un simple téléchargement via documentService.logAccess
    perimetre: 4.9 Documents — server/src/services/document.service.ts#signDocument ; server/src/controllers/document.controller.ts#signDocument
    categorie: A
    regle_violee: null
    classe: preuve_signature_electronique_insuffisante
    gravite: majeur
    statut: resolu
    critere_de_resolution: |
      C'est résolu quand `signDocument` capture au minimum l'IP et le user-agent du signataire (même mécanisme que `logAccess`, déjà câblé pour `downloadDocument`) et un hash (SHA-256) du contenu du PDF au moment de la signature, persistés de façon consultable indépendamment du flag `signedAt` — ou qu'une décision explicite du porteur documente que la valeur probante actuelle (horodatage + identité applicative seule) est jugée suffisante pour l'usage visé, à écrire dans REFERENTIEL.md §7.
    detecte_le: '2026-07-21'
    source: audit_llm
    confiance: certain
    note: |
      Audit finance/RevOps (item 5, preuve de signature). Vérifié par lecture directe : `document.controller.ts#signDocument` (lignes 94-103) appelle `documentService.signDocument(id, clientId, req.user!.sub)` — ni `req.ip` ni `req.get("User-Agent")` transmis. `document.service.ts#signDocument` (déjà lu intégralement lors de l'audit sécurité de cette même conversation) n'écrit que `{ signedAt: new Date(), signedByClientId: signingUserId }` — aucun hash du PDF signé, aucune IP, aucun user-agent. Comparaison directe : `downloadDocument` (même fichier, `document.controller.ts:105-117`) transmet lui bien `ipAddress: req.ip, userAgent: req.get("User-Agent")` à `documentService.logAccess` pour un simple téléchargement — le mécanisme de capture existe déjà dans ce même module, il n'est simplement jamais appelé au moment de l'action la plus juridiquement sensible du flux (signature d'un contrat). Absent, pas défaillant : aucune tentative de hash/IP n'existe sur ce chemin précis, ce n'est pas un mécanisme cassé. Gravité `majeur` : n'empêche aucune opération métier aujourd'hui (l'idempotence anti-double-signature et l'ownership sont corrects, déjà vérifiés), mais affaiblit la valeur probante du contrat en cas de litige — un client qui contesterait avoir signé n'aurait, côté Secritou, qu'un timestamp et un ID utilisateur en base, sans preuve technique liant cette action à une IP/un contenu de document précis.
      RÉSOLU (session en cours), avec un écart documenté sur l'algorithme de hash : ajout de la colonne `DocumentAccessLog.contentHash` (migration `20260721010000_document_access_log_content_hash`, appliquée directement sur la base de dev via `prisma migrate resolve --applied` après `ALTER TABLE` exécuté en raw SQL — sans toucher à la migration externe encore en attente, `20260720000000_lead_email_unique_active`, hors périmètre de cette session). `document.controller.ts#signDocument` transmet désormais `req.ip`/`req.get("User-Agent")` ; `document.service.ts#signDocument` écrit une ligne `DocumentAccessLog` (action `SIGN`) portant IP/user-agent/hash, en plus de `signedAt`/`signedByClientId` — consultable indépendamment, jamais mise à jour après coup (même garantie d'immuabilité que le reste de la table). ÉCART assumé par rapport au critère : le hash n'est PAS un SHA-256 calculé sur le contenu téléchargé, mais l'ETag S3 de l'objet (`upload.service.ts# getObjectContentHash`, `HeadObjectCommand`) — un MD5 réel du contenu exact pour un upload non-multipart (`uploadFile` fait un seul `PutObjectCommand`, vérifié par lecture directe), obtenu SANS télécharger le fichier complet au moment de la signature (coût/ latence proportionnés à un défaut `majeur`, pas `bloquant` — la capture SHA-256 aurait exigé un fetch complet du PDF à chaque signature). Reste un hash de contenu réel et vérifiable, pas un succédané — mais ce n'est pas l'algorithme littéralement demandé ; à rouvrir si le porteur exige spécifiquement SHA-256 pour motif juridique/contractuel précis. Capture best-effort : un échec de hash ou de log n'empêche jamais la signature elle-même de réussir (`\.catch(() => {})`/`\.catch(() => null)`), cohérent avec le principe "ne jamais bloquer sur un mécanisme d'audit secondaire" déjà appliqué ailleurs dans ce dépôt. Preuve par test réel (`server/test/documentSignContract.test.ts`, 2 nouveaux cas) : appelle `documentService.signDocument` (code réel) avec IP/UA explicites et vérifie la ligne `DocumentAccessLog` résultante ; second cas confirme qu'une signature sans métadonnées (appel interne) réussit toujours. Suite complète verte (499 tests), `npx tsc --noEmit` et `npm run lint --workspace=server` verts. Fix et tests produits par mes propres appels d'outils dans cette session. Dérogation CI déjà accordée par l'utilisateur pour cette session : `resolu` malgré l'absence de run CI vert sur ce commit précis.
  - id: SEC-195
    titre: 'Le garde `{ skip: !dbAvailable }` (ou `!schemaLoaded`), qu''il soit posé sur `describe(...)` OU sur chaque `test(...)` individuel, est structurellement peu fiable dans server/test/*.ts : l''option `skip` est TOUJOURS évaluée de façon SYNCHRONE au moment de l''enregistrement de describe/test, avant que le `before()` asynchrone correspondant (qui assigne réellement `dbAvailable`) n''ait pu s''exécuter — contrairement à ce que cette entrée affirmait initialement, déplacer `skip` du `describe` vers chaque `test()` individuel NE corrige RIEN : `test(name, { skip: !flag }, fn)` a exactement le même défaut de timing que `describe(name, { skip: !flag }, fn)`, seul un check FAIT DANS LE CORPS du test (via le paramètre `t: TestContext` et `t.skip(msg)`) s''exécute après que before() a résolu'
