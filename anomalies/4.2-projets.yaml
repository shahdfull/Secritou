    source: audit_llm
    confiance: certain
    note: |
      Audit exhaustif du module Gestion de Projets (agent dédié, lecture seule), confirmé par lecture directe et exécution réelle du schéma Zod. `createTaskSchema`/`updateTaskSchema` (`task.validator.ts`) déclarent `startDate`/`dueDate` en `z.string().refine(isValidDateString).transform(...).optional()` — `.optional()` n'accepte que `undefined`, jamais une chaîne vide : `""` échoue au `refine` avec le message « Invalid date ». Vérifié par exécution directe du schéma réel : `{startDate:"",dueDate:""}` → `success:false` (2 issues « Invalid date ») ; `{}` (champs omis) → `success:true`. Or `useTaskActions.ts` initialise `createForm` (`defaultValues.startDate:""`, `dueDate:""`) et `openCreateDialogForProject` (même défaut), et `handleEditTask` fait `editForm.reset({...task, startDate: task.startDate ? ... : "", dueDate: ... ? ... : ""})` — une tâche sans date affiche donc `""` au montage du formulaire d'édition aussi. Aucun nettoyage n'existe entre le formulaire et l'appel réseau (`useTasks.ts#useCreateTask/useUpdateTask` transmettent `data` tel quel, `tasks.api.ts#create/update` ne transforment rien). Confirmé qu'aucun test n'existe pour `TaskCreateDialog.tsx`/`TaskEditDialog.tsx` couvrant ce chemin — c'est ce qui a laissé passer ce défaut malgré les nombreuses sessions d'audit précédentes sur ce module.
