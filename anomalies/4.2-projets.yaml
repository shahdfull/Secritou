anomalies:
  - id: SEC-023
    titre: 'documentService.signDocument : signature de contrat toujours impossible (FK signedByClientId erronée) + client sans projet permanemment bloqué'
    perimetre: 3.18 Document — server/src/services/document.service.ts
    categorie: G
    regle_violee: null
    classe: null
    gravite: bloquant
    statut: resolu
    critere_de_resolution: |
      C'est résolu quand un client peut réellement signer un document de type CONTRACT, à la fois quand ce document est lié à un projet et quand il ne l'est pas (directement attaché au client), vérifié par un test qui appelle réellement `documentService.signDocument` contre une base réelle et confirme que `signedAt` est renseigné et que `signedByClientId` contient bien l'id de l'utilisateur signataire (pas juste l'absence d'erreur).
    detecte_le: '2026-07-17'
    source: audit_llm
    confiance: certain
    note: |
      Trouvé en lisant intégralement `document.service.ts` pour confirmer le statut de l'entité 3.18 (§3, `[À CONFIRMER]` → tentative de passage à IMPLÉMENTÉ), session du 2026-07-17 — pas pendant un audit formel d'un module, enregistré immédiatement conformément à CLAUDE.md. Deux défauts indépendants dans la même méthode :
      (a) Ownership check incomplet — `signDocument` (avant correction) vérifiait uniquement `doc.project?.clientId !== clientId`. Or `createDocumentSchema` (shared/src/schemas/document.schema.ts) autorise explicitement un document `type: "CONTRACT"` sans `projectId` (`projectId` optionnel). Pour un tel document, `doc.project` est `null`, donc `doc.project?.clientId` vaut `undefined`, qui ne correspond jamais à un `clientId` réel — même le propriétaire légitime (via `Document.clientId`, une relation directe bien réelle sur le modèle) recevait un 403 permanent, sans aucun moyen de le contourner.
      (b) FK erronée, BEAUCOUP plus grave — `Document.signedByClientId` (schema.prisma:804-805) est en réalité une clé étrangère vers `User.id` (relation nommée `"SignedDocuments"` sur le modèle `User`), PAS vers `Client.id`, malgré son nom. Le code écrivait pourtant `signedByClientId: clientId` (un `Client.id`) — ce qui viole systématiquement la contrainte FK, quel que soit le chemin (projet lié ou non). Conséquence concrète, confirmée par reproduction réelle des DEUX scénarios (pas seulement lu dans le code) : AUCUN client n'a jamais pu signer un contrat avec succès via cet endpoint, y compris via le chemin normal/prévu (document lié à un projet) — fonctionnalité citée dans README.md (« Document viewer with contract e-signature ») cassée depuis l'origine.
      REPRODUCTION RÉELLE avant correctif (pas seulement lecture de code) : (1) document CONTRACT sans projectId créé pour un vrai client → `signDocument` → `403 Forbidden` (défaut a). (2) document CONTRACT AVEC projectId réel, client réel propriétaire du projet → `signDocument` → passe le contrôle d'ownership mais échoue avec `PrismaClientKnownRequestError P2003, Foreign key constraint violated on the constraint: Document_signedByClientId_fkey` (défaut b, confirmé sur le chemin normal, pas seulement le cas limite du défaut a).
      CORRECTIF ÉCRIT ET VÉRIFIÉ, même session : (a) `signDocument` calcule désormais `owningClientId = doc.project?.clientId ?? doc.clientId` — accepte l'ownership via l'une ou l'autre relation légitime. (b) `signDocument` prend un 3e paramètre `signingUserId` (l'id réel de l'utilisateur authentifié, `req.user.sub` — pas `clientId`) et l'écrit dans `signedByClientId`. `document.controller.ts#signDocument` passe désormais `req.user!.sub` en plus de `clientId`. Reproduction re-testée après correctif, les deux scénarios ET un 3e (mauvais client rejeté) : les 3 confirmés — signature réussie avec `signedByClientId` égal à l'id utilisateur réel dans les 2 cas valides, 403 confirmé pour un client non-propriétaire.
      Nouveau test `server/test/documentSignContract.test.ts` (câblé dans `test/run-all.test.ts`), appelle réellement `signDocument` contre une base migrée. 4 cas : contrat lié à un projet signé avec succès (signedByClientId = id utilisateur, pas id client) ; contrat sans projet signé avec succès ; un autre client ne peut pas signer un contrat qui n'est pas le sien (403) ; un contrat déjà signé ne peut pas être signé une seconde fois (409 ALREADY_SIGNED). `npm run typecheck --workspace server` vert. `npm run test:unit --workspace server` : 273/273 (269 + 4 nouveaux), exécuté deux fois de suite, ~15-18s, aucune régression du type SEC-002 (pas de cache Redis touché par ce fichier).
      Correctif poussé sur origin/main, session du 2026-07-17 (hash à renseigner au commit). `resolu` déclaré SANS confirmation CI — dérogation explicite à la règle commit+CI de CLAUDE.md, déjà établie par le porteur du projet dans cette même session (« no make it resolu »). Gravité `bloquant` (pas `majeur`) : contrairement aux autres anomalies de cette session, celle-ci empêchait TOTALEMENT une fonctionnalité citée explicitement dans README.md comme livrée, depuis l'introduction du champ — pas une dégradation partielle.
  - id: SEC-026
    titre: 37 erreurs ESLint pré-existantes font échouer les jobs CI client/server sur origin/main, hors de tout périmètre touché par les sessions d'audit
    perimetre: systémique — server/src/controllers/**, server/src/services/upload.service.ts, server/src/services/agentOrchestrator.service.ts, server/test/invoice.service.test.ts, client/src/api/axios.ts, client/src/features/projects/ProjectDetailPage.tsx
    categorie: D
    regle_violee: null
    classe: null
    gravite: majeur
    statut: resolu
    critere_de_resolution: |
      C'est résolu quand `npm run lint --workspace=server` ET `npm run lint --workspace=client` retournent 0 erreur (les warnings restent tolérés, seule la CI actuelle échoue sur les erreurs), vérifié par un push vers origin/main dont le job CI "client" et le job "server" passent réellement au vert (pas seulement une exécution locale).
    detecte_le: '2026-07-17'
    source: manuel
    confiance: certain
    note: |
      Classée sous 4.2 Gestion de projet (périmètre principal, égalité de score de classement automatique) — périmètre(s) secondaire(s) également concerné(s) : 4.11 Module IA (agent-service).

      Trouvé en vérifiant l'état réel de la CI sur `origin/main` (API GitHub REST non authentifiée, `/repos/.../commits/main/check-runs` — `gh` CLI indisponible dans cet environnement) après une série de `resolu` déclarés sous dérogation « no make it resolu » cette session. Sur le HEAD `2c8d3cc` au moment du constat, 3 jobs échouent (`client`, `server`, `i18n-check`), contredisant potentiellement le critère de résolution de SEC-010 (« voit passer au vert ») — voir la note ajoutée à SEC-010 pour la reformulation exacte de ce lien.
      DIAGNOSTIC COMPLET, par exécution locale de `npm run lint` dans chaque workspace (pas seulement lecture des annotations GitHub, qui ne donnent que le nombre de lignes sans détail exploitable pour le job "server") :
      Server — 33 erreurs, 8 fichiers : `src/controllers/project.controller.ts` (12, toutes `@typescript-eslint/no-non-null-asserted-optional-chain` — pattern `x?.y!` répété), `src/controllers/freelancer.controller.ts` (6, même règle), `src/controllers/comment.controller.ts` (4, même règle), `src/controllers/task.controller.ts` (4, même règle + 1 `no-useless-catch`), `src/controllers/summary.controller.ts` (3, même règle), `src/services/agentOrchestrator.service.ts` (1 `no-useless-catch`), `src/services/upload.service.ts` (1 `no-useless-catch`), `test/invoice.service.test.ts` (2 `no-constant-condition`). 30 des 33 erreurs sont la même classe de défaut (`no-non-null-asserted-optional-chain`) répétée sur 5 contrôleurs, probablement écrits à la même époque avec le même pattern `req.user?.id!` (ou équivalent) — pas 5 défauts indépendants, 1 pattern systématique.
      Client — 4 erreurs, 2 fichiers : `src/api/axios.ts` (1 `no-async-promise-executor`, ligne 124), `src/features/projects/ProjectDetailPage.tsx` (3 `react-hooks/rules-of-hooks` — hooks appelés conditionnellement, lignes 88-90).
      i18n-check — 1 faux positif du script `scripts/check-i18n.mjs` : signale `exec.needsAttentionSub` comme absente, alors que la clé existe réellement sous forme pluralisée i18next (`needsAttentionSub_one`/`needsAttentionSub_other`, `client/src/i18n/locales/{fr,en}/translation.json:2165-2166`, consommée par `DashboardPage.tsx:258`) — le script ne reconnaît pas la convention de suffixe pluriel. Distinct des 37 erreurs ESLint ci-dessus, pas compté dans le total, mais fait aussi échouer la CI sur ce HEAD ; laissé hors du périmètre de correction de cette anomalie (défaut du script de vérification, pas du code applicatif).
      CONFIRMÉ HORS DU PÉRIMÈTRE DE CETTE SESSION : aucun des 10 fichiers fautifs (8 server + 2 client) ne figure dans la liste des fichiers édités par les commits de cette session (`1f8ff97`..`2c8d3cc`, module 4.7/4.8/4.10 + SEC-024/025), vérifié par `git log --oneline -- <fichier>` sur chacun, tous antérieurs de plusieurs commits/sessions. Un lint isolé sur les fichiers réellement modifiés cette session (`server/src/repositories/executiveMetrics.repository.ts`, `server/test/executiveMetricsProjectRisks.test.ts`, `client/src/types/permissions.ts`) est vert.
      Décision du porteur du projet (AskUserQuestion, session du 2026-07-17) : « Ouvrir SEC-026 (dette lint), rouvrir SEC-010 (Recommandé) » — d'abord seulement enregistré et diagnostiqué.
      CORRIGÉ dans la même session, sur demande explicite du porteur du projet (« ok on corrige alors ») :
      Server, 30 des 33 erreurs — pattern `req.user?.sub!`/`req.user?.role!` (le type `no-non-null-asserted-optional-chain` reproché) remplacé par `req.user!.sub`/`req.user!.role` dans les 5 contrôleurs concernés (`comment.controller.ts`, `freelancer.controller.ts`, `project.controller.ts`, `summary.controller.ts`, `task.controller.ts`) — l'assertion porte désormais sur `req.user` lui-même (garanti non-null par le middleware `authenticate` sur toutes ces routes), pas sur le résultat d'un chaînage optionnel ; `sub`/`role` sont des champs obligatoires de `JwtPayload` (`server/src/types/auth.ts`), donc aucun `!` n'est nécessaire après eux. Les 3 erreurs `no-useless-catch` restantes corrigées en supprimant le `catch` inutile (`agentOrchestrator.service.ts` : catch+rethrow devant un `finally` réel, `finally` seul conservé ; `upload.service.ts` : `try/catch` entier supprimé, aucun `finally`). Les 2 `no-constant-condition` dans `invoice.service.test.ts` corrigées en remplaçant les conditions littérales (`if (-100 <= 0) throw ...`, qui ne prouvaient rien — CLAUDE.md, règle sur les tests qui réimplémentent leur cible) par un appel réel à `addPaymentSchema.safeParse` (`server/src/validators/invoice.validator.ts`, `amount: positiveDecimal` = `z.number().positive()`), le vrai garde-fou qui rejette déjà les montants ≤ 0 au niveau validateur — les tests appellent maintenant le code réel au lieu de simuler une condition à côté.
      Client, les 4 erreurs : `axios.ts` — `no-async-promise-executor` corrigée en extrayant le corps de l'exécuteur `async` dans une fonction `runRefresh` nommée, appelée depuis un exécuteur de `Promise` synchrone (mêmes paramètres `resolveRefresh`/`rejectRefresh`, même comportement — le `try/catch/ finally` interne gérait déjà correctement le rejet, seul le pattern d'exécuteur async lui-même était en cause). `ProjectDetailPage.tsx` — les 3 `react-hooks/rules-of-hooks` corrigées en remontant `useMySplitForProject`/`useProjectTemplateForService`/ `useApplyProjectTemplate` AVANT les deux `return` anticipés (`isLoading`, `isError || !project`) : c'était un vrai bug (nombre de hooks appelés variable selon l'état de chargement, pas seulement un style discutable), corrigé en passant `project?.id ?? ""`/ `project?.serviceId` aux hooks — les trois sont déjà conçus pour être inertes tant que leur argument est vide/undefined (`enabled` interne ou `!!serviceId`), donc aucun effet de bord avant que `project` soit chargé.
      i18n-check : `scripts/check-i18n.mjs` corrigé pour reconnaître la convention de suffixe pluriel i18next (`_zero`/`_one`/`_two`/`_few`/ `_many`/`_other`) — accepte désormais une clé utilisée comme `t("key", { count })` si au moins une variante suffixée existe dans l'un des deux fichiers de traduction, au lieu d'exiger la clé littérale exacte. Vérifié : seuls `_one`/`_other` sont réellement utilisés dans ce dépôt (`grep` sur les deux fichiers de traduction).
      EFFET DE BORD DÉCOUVERT ET ÉCARTÉ (pas une anomalie) : `npm run prisma:format:check --workspace=server` échouait localement à la première tentative, mais `prisma format` puis re-`--check` ne produisait ensuite AUCUNE différence de contenu (fichier identique octet pour octet, même hash MD5 avant/après) — `git status` l'a un instant signalé modifié puis le diff réel était vide (artefact de normalisation de fin de ligne local à ce poste Windows, jamais un changement de contenu). `git checkout -- server/prisma/schema.prisma` exécuté pour ne rien laisser dans le commit. N'explique donc PAS le job "server" original — confirmé que les 33 erreurs ESLint en sont l'unique cause réelle sur ce HEAD.
      VÉRIFICATION LOCALE COMPLÈTE (les 4 workspaces/gates que la CI exécute, en plus des jobs déjà nommés) : `npm run lint --workspace=server` → 0 erreur (167 warnings, tolérés). `npm run lint --workspace=client` → 0 erreur (153 warnings, tolérés). `npx tsc --noEmit` vert des deux côtés. `node scripts/check-i18n.mjs` → passé. `npm run build --workspace=server` et `--workspace=client` → les deux réussissent. Scan de secrets sur le bundle client → propre. Suite de tests complète : server 274/274 (incluant les 2 tests `invoice.service.test.ts` réécrits), client 22/22 (7 fichiers) — deux exécutions, aucune régression.
      `resolu` déclaré SANS confirmation CI — dérogation explicite à la règle commit+CI de CLAUDE.md, déjà établie par le porteur du projet dans cette même session (« no make it resolu ») ; le critère de résolution textuel exige un push vu vert par la CI, condition qui ne peut être remplie qu'après ce commit — signalé ici pour qu'une lecture future distingue « vérifié localement, exhaustivement » de « confirmé par la CI elle-même ».
  - id: SEC-030
    titre: 'RG-004b (facture de solde) : provenance code_grep seule, calcul exact jamais confirmé par lecture directe ni test réel — aucun défaut trouvé, preuve manquante comblée'
    perimetre: 4.4 Facturation, 4.2 Gestion de projet, 4.6 Portail client — server/src/services/project.service.ts (clientApprove)
    categorie: E
    regle_violee: RG-004b
    classe: null
    gravite: mineur
    statut: resolu
    critere_de_resolution: |
      C'est résolu quand une lecture directe ligne par ligne de `clientApprove` confirme la formule exacte du montant de solde, ET qu'un test appelle réellement `projectService.clientApprove` contre une base réelle et vérifie le montant exact de la facture BALANCE créée — dans le cas nominal (acompte à 30%) ET dans un cas où l'acompte réellement facturé dévie du taux attendu, pour distinguer un complément à 100% d'un recalcul indépendant fixe à 70%.
    detecte_le: '2026-07-18'
    source: manuel
    confiance: certain
    note: |
      Traité en réponse à la question du porteur du projet « is there something a vérifier dans ce projet », après RG-008 (SEC-027), RG-002 (SEC-028) et RG-017 (SEC-029) — RG-004b nommée dans l'audit de lecture initial comme priorité argent (facture de solde, provenance `code_grep` seule).
      VÉRIFICATION RÉELLE, AUCUN DÉFAUT TROUVÉ (comme SEC-029, contrairement à SEC-027/SEC-028) : lecture directe ligne par ligne de `project.service.ts#clientApprove` (lignes 306-308) confirme la formule exacte : `depositAmount = depositInvoice.amountHT ?? (proposalAmount * 30%)` `balanceAmount = proposalAmount - depositAmount` C'est un COMPLÉMENT À 100%, pas un recalcul indépendant fixe à 70% comme le texte littéral de la règle pourrait le laisser penser — en réalité un comportement PLUS robuste : quel que soit le montant réellement facturé pour l'acompte, le solde ajuste automatiquement pour que acompte + solde = montant total de la proposition, jamais un solde fixe qui pourrait sur- ou sous-facturer si l'acompte réel avait dévié de 30% pour une raison quelconque.
      Les 3 tests existants qui touchent `clientApprove` (`project.clientApprove.test.ts`, `ratingRequestNotification.test.ts`, `projectUpdateBlocksCompletion.test.ts`) réimplémentent tous une logique-miroir locale (« mirrors the guard order… ») au lieu d'appeler le vrai service — CLAUDE.md : un tel test « vaudrait `code_grep` au mieux ». Aucun des trois n'asserte quoi que ce soit sur le montant de la facture de solde.
      Nouveau test `server/test/projectClientApproveBalanceInvoice.test.ts` (câblé dans `test/run-all.test.ts`), appelle réellement `projectService.clientApprove` contre une base migrée, 2 cas : (1) cas nominal, acompte payé à 300 sur une proposition de 1000 → solde créé à 700 exactement ; (2) acompte dévié à 400 (pas les 30% habituels) sur la même proposition de 1000 → solde créé à 600 exactement (pas 700, qui aurait prouvé un recalcul fixe déconnecté de l'acompte réel) — confirme explicitement que acompte + solde totalise toujours exactement le montant de la proposition, jamais plus, jamais moins.
      `npx tsc --noEmit` vert. Suite complète : 286/286 (284 + 2 nouveaux), ~23-25s, aucune régression. `resolu` déclaré SANS confirmation CI : la CI est actuellement désactivée sur `origin/main` sur demande du porteur du projet (workflow_dispatch seul, session du 2026-07-17), dérogation « no make it resolu » déjà établie dans cette session.
  - id: SEC-033
    titre: Le détail d'un projet n'affichait jamais ses tâches — projectListSelect ne sélectionnait jamais la relation tasks
    perimetre: 4.2 Gestion de projet — server/src/repositories/project.repository.ts, client/src/features/projects/ProjectDetailPage.tsx
    categorie: G
    regle_violee: null
    classe: null
    gravite: bloquant
    statut: resolu
    critere_de_resolution: |
      C'est résolu quand un utilisateur peut ouvrir le détail d'un projet et voir réellement la liste de ses tâches (pas seulement l'absence d'erreur) — vérifié par un test qui appelle réellement `projectService.getProjectById` contre une base réelle et confirme que les tâches créées apparaissent dans le résultat, avec leurs champs id/title/status.
    detecte_le: '2026-07-18'
    source: manuel
    confiance: certain
    note: |
      Signalé directement par le porteur du projet (constat détaillé, session du 2026-07-18), hors du fil des règles §5 en cours de vérification — enregistré immédiatement conformément à CLAUDE.md.
      CONSTAT (vérifié intégralement avant correction, pas pris tel quel) : `projectListSelect` (`project.repository.ts`, partagé par `findAll` ET `findById`) ne sélectionnait jamais la relation `tasks`. Le type `ProjectWithProgress` (même fichier) ne déclarait que `progress`/ `taskDone`/`taskTotal`, jamais `tasks` — confirmant que ce champ n'avait jamais été prévu côté serveur pour ce chemin. Côté client, `types/project.ts#Project.tasks?: Task[]` (optionnel) masquait totalement l'absence côté TypeScript ; `ProjectDetailPage.tsx:98` (`const tasks = project.tasks ?? []`) recevait donc systématiquement un tableau vide. Conséquences confirmées par lecture directe : l'onglet Tâches toujours vide (ligne 199, condition `tasks.length > 0` toujours fausse), le compteur par statut (ligne 203) et le lien « Voir toutes les tâches (n) » (lignes 278-286) jamais affichés, le bandeau « Partir du template » (lignes 294-303) affiché à tort en permanence dès qu'un template avec des tâches existe (branche `tasks.length === 0` toujours empruntée). Le % de progression restait correct car calculé par une requête SQL indépendante (`getProgressForProject`, agrégation directe sur `Task` sans passer par la relation Prisma), ce qui rendait l'incohérence visible pour l'utilisateur (barre à 60%, liste vide) plutôt que masquée.
      RBAC vérifié avant de choisir le correctif : `GET /tasks` (route dédiée) est gardée `authorize("ADMIN", "MANAGER", "FREELANCER")`, EXCLUANT explicitement CLIENT — un correctif « ajouter un `useTasks({projectId})` côté front » aurait cassé silencieusement pour le rôle CLIENT (403), qui accède à son propre projet via un chemin de scope différent (`findById`'s branche `else`, filtrée sur `clientId`). Corrigé côté SERVEUR à la place : `tasks` ajouté uniquement au `baseSelect` de `findById` (projet unique), PAS à `projectListSelect` lui-même (partagé avec `findAll`, la liste paginée — y ajouter `tasks` aurait tiré toutes les tâches de tous les projets listés, une régression de performance réelle sur un endpoint de liste). Scope du select limité aux 3 champs réellement consommés par `ProjectDetailPage.tsx` (`id`/`title`/`status` — les 2 appels à `TimeTrackingTab` ne consomment que `{id, title}`), `ProjectWithProgress` mis à jour pour déclarer `tasks?` en cohérence.
      Nouveau test `server/test/projectDetailIncludesTasks.test.ts` (câblé dans `test/run-all.test.ts`), appelle réellement `projectService.getProjectById` contre une base migrée, 2 cas : un projet avec 3 tâches renvoie bien les 3 (titres et statuts corrects, pas juste "non vide") ; un projet sans tâche renvoie un tableau vide (pas `undefined`, pour que `?? []` côté front reste une garde défensive et non le masque du bug).
      `npx tsc --noEmit` vert (server, client — le type client `Project .tasks?: Task[]` accepte structurellement le shape réduit renvoyé). Suite complète serveur : 294/294 (292 + 2 nouveaux), ~23-25s, aucune régression. `resolu` déclaré SANS confirmation CI : la CI est actuellement désactivée sur `origin/main` sur demande du porteur du projet (workflow_dispatch seul, session du 2026-07-17), dérogation « no make it resolu » déjà établie dans cette session.
  - id: SEC-034
    titre: L'onglet « Mes livrables » n'était filtré par aucun projet — et les livrables déposés n'avaient jamais de projectId, les rendant invisibles pour le freelance qui les dépose
    perimetre: 4.2 Gestion de projet, 4.7 Freelances — client/src/features/projects/ProjectDetailPage.tsx, server/src/repositories/document.repository.ts
    categorie: G
    regle_violee: null
    classe: null
    gravite: bloquant
    statut: resolu
    critere_de_resolution: |
      C'est résolu quand un Freelancer ouvrant le détail d'un projet ne voit que les livrables de CE projet (pas ceux d'autres affaires), ET quand un livrable qu'il vient de déposer est réellement visible pour lui-même dans cette même liste — vérifié par un test qui appelle réellement `documentService.create` puis `documentService.getAll` contre une base réelle, scopé FREELANCER.
    detecte_le: '2026-07-18'
    source: manuel
    confiance: certain
    note: |
      Signalé directement par le porteur du projet (constat détaillé, session du 2026-07-18), immédiatement après SEC-033 (même fichier, même page) — enregistré et corrigé immédiatement conformément à CLAUDE.md.
      CONSTAT INITIAL (confirmé par lecture directe) : `ProjectDetailPage.tsx:60` appelait `useDocuments({ page: 1, pageSize: 50 })` sans jamais passer `projectId: project.id`, alors que le hook (`useDocuments`) et l'API (`documentsApi.getDocuments`) supportent ce paramètre. Un Freelancer ouvrant le projet A voyait donc la liste de tous ses documents `DELIVERABLE` toutes affaires confondues (et au-delà de 50 documents, certains disparaissaient silencieusement de la liste, pagination oblige).
      SECOND DÉFAUT TROUVÉ EN VÉRIFIANT (plus grave que le constat initial, empilé sur le même flux) : le dépôt du livrable (`createDocument`, lignes 366-375) ne transmettait JAMAIS `projectId`/`clientId` non plus — seulement `tags: [project.name]` (texte libre, fragile, cassable si le projet est renommé). Or `documentRepository.findAll`'s scope FREELANCER filtre `where .project = { tasks: { some: { assigneeId } } }` — vérifié EMPIRIQUEMENT contre une vraie base (script de vérification isolé, supprimé après usage) qu'une relation Prisma imbriquée sur un champ `null` (`Document.projectId` optionnel) ne matche JAMAIS ce filtre. Conséquence réelle : un livrable déposé par un freelance était INVISIBLE POUR LUI-MÊME dès qu'il consultait via ce chemin, y compris juste après l'avoir déposé — corriger uniquement la lecture (ajouter `projectId` à `useDocuments`) n'aurait rien changé tant que les documents créés n'avaient pas de `projectId` réel. Un ADMIN (pas de filtre `project`) ou un MANAGER dont le scope de pôle dépend de `Document.clientId` (`where.client = { projects: { some: {...} } }`) voyaient malgré tout ces documents — seul FREELANCER était strictement aveugle à ses propres dépôts.
      DÉCISION DU PORTEUR DU PROJET (AskUserQuestion, session du 2026-07-18) : « Corriger les deux : lecture (projectId sur useDocuments) ET écriture (projectId sur createDocument) (Recommandé) ».
      CORRECTIF ÉCRIT : `ProjectDetailPage.tsx:60` passe désormais `projectId: id` (le paramètre de route, disponible dès le rendu, avant même le chargement de `project` — évite tout souci d'ordre de hooks). L'appel `createDocument` (lignes 366-378) transmet désormais `projectId: project.id` ET `clientId: project.clientId` en plus du `tags: [project.name]` existant (conservé pour la recherche texte déjà supportée côté serveur) — couvre à la fois le scope FREELANCER (`project.tasks.some`) et le scope MANAGER (`client.projects.some`).
      Nouveau test `server/test/freelancerSeesOwnDeliverable.test.ts` (câblé dans `test/run-all.test.ts`), appelle réellement `documentService.create` puis `documentService.getAll` contre une base migrée, 2 cas : (1) un livrable créé avec `projectId`/ `clientId` est bien visible pour le freelance staffé sur ce projet ; (2) le même livrable SANS `projectId` (reproduisant le comportement d'avant correctif) reste invisible pour ce même freelance — preuve rigoureuse que le défaut était réel, pas supposé.
      ÉCART NON CORRIGÉ, SIGNALÉ MAIS HORS PÉRIMÈTRE DE CETTE PASSE : en lisant `document.schema.ts` (`shared/`), le champ `title` envoyé par `ProjectDetailPage.tsx` à la création n'existe dans AUCUN schéma de validation (`documentBaseSchema` ne connaît que `name`, pas `title`), alors que `Document.title` est un champ `String` requis (non nullable) dans `schema.prisma`. Zod strippe silencieusement ce champ avant qu'il n'atteigne le service — comportement à vérifier séparément (une future anomalie, pas ouverte ici faute de vérification complète du chemin de persistance réel).
      `npx tsc --noEmit` vert (server, client). Suite complète serveur : 296/296 (294 + 2 nouveaux), ~21-25s, aucune régression. `resolu` déclaré SANS confirmation CI : la CI est actuellement désactivée sur `origin/main` sur demande du porteur du projet (workflow_dispatch seul, session du 2026-07-17), dérogation « no make it resolu » déjà établie dans cette session.
  - id: SEC-035
    titre: Onglets Actif/Terminé du freelance (ProjectsPage.tsx) calculés par .filter() sur une seule page paginée — incompatible avec la pagination affichée en bas de page
    perimetre: 4.2 Gestion de projet, 4.7 Freelances — client/src/features/projects/ProjectsPage.tsx, server/src/repositories/project.repository.ts
    categorie: C
    regle_violee: null
    classe: null
    gravite: majeur
    statut: resolu
    critere_de_resolution: |
      C'est résolu quand un Freelancer avec plus de 12 projets voit des compteurs et un contenu de sous-onglet (Actif/Terminé) corrects et complets sans devoir naviguer manuellement page par page — vérifié par un test qui appelle réellement `projectRepository.findAll` avec un filtre `statusIn` contre une base réelle et confirme le filtrage ET la pagination indépendante (page 1 sur 2 projets ne masque jamais le second, atteignable en parcourant les pages).
    detecte_le: '2026-07-18'
    source: manuel
    confiance: certain
    note: |
      Signalé directement par le porteur du projet (constat détaillé, session du 2026-07-18) — enregistré et corrigé immédiatement conformément à CLAUDE.md.
      CONSTAT (vérifié intégralement) : `ProjectsPage.tsx`, `activeProjects`/ `doneProjects` étaient calculés par `.filter()` sur `projects = projectsResult.data` — une seule page de `useProjects` (12 éléments par défaut, `useListParams(12)`). Si un freelance avait plus de 12 projets, les compteurs des onglets et leur contenu étaient faux : un projet « Terminé » sur la page 2 n'apparaissait jamais dans l'onglet « Terminé » tant qu'on n'y naviguait pas manuellement — alors que la pagination en bas de page (`DataTablePagination`, `total`) portait sur le total réel non filtré. Deux logiques de pagination incompatibles coexistaient sur le même écran.
      Root cause serveur : `project.repository.ts#buildWhere` ne supportait qu'un filtre `status` UNIQUE (`ListQueryOptions.status`, partagé par toutes les entités du projet — leads, clients, invoices, etc.), incapable d'exprimer « Actif » qui regroupe 3 statuts (`PLANNING`/`IN_PROGRESS`/`REVIEW`).
      DÉCISION DU PORTEUR DU PROJET (AskUserQuestion, session du 2026-07-18) : « Ajouter un filtre `statusIn` côté serveur, deux requêtes séparées côté client par sous-onglet (Recommandé) » — plutôt qu'un contournement fragile (augmenter le pageSize).
      CORRECTIF ÉCRIT : Serveur — nouveau paramètre `statusIn?: ProjectStatus[]` ajouté à `projectRepository.findAll`/`projectService.getAllProjects`, en plus de (pas remplaçant) `options.status` — pas d'élargissement du type générique `ListQueryOptions` partagé par toutes les entités, pour ne pas répercuter ce besoin spécifique aux projets ailleurs. Query param `statusIn` (liste séparée par virgules) parsé et validé dans `project.controller.ts` contre les valeurs réelles de `ProjectStatus` (`Object.values`), valeurs invalides silencieusement ignorées. Client — `projectsApi.getAll`/`useProjects` acceptent désormais `statusIn?: string` (type élargi localement, pas dans `ListQueryParams` partagé). `ProjectsPage.tsx` : les sous-onglets Actif/Terminé du Freelancer sont désormais deux requêtes `useProjects` indépendantes (`activePage`/`donePage`, état local par onglet, pas partagé avec l'URL de la liste ADMIN/MANAGER), chacune avec sa propre `DataTablePagination`. Les compteurs de badge utilisent désormais `activeTotal`/`doneTotal` (le vrai total serveur), plus `activeProjects.length`/`doneProjects.length` (taille de la page courante). La pagination générique en bas de page est désormais masquée pour le rôle Freelancer (`!isFreelancer &&`), puisqu'elle ne s'applique qu'à la liste plate ADMIN/MANAGER.
      Nouveau test `server/test/projectStatusInFilter.test.ts` (câblé dans `test/run-all.test.ts`), appelle réellement `projectRepository.findAll` contre une base migrée, 2 cas : (1) `statusIn=[PLANNING,IN_PROGRESS,REVIEW]` exclut bien un projet `COMPLETED` ; (2) pagination indépendante confirmée en parcourant chaque page une par une (`pageSize=1`) jusqu'à retrouver les 2 projets attendus — preuve qu'aucun n'est silencieusement perdu au-delà de la première page.
      **Limite de vérification signalée explicitement** : aucun outil de navigateur disponible dans cet environnement pour cliquer réellement sur les sous-onglets et confirmer visuellement le rendu — vérification de niveau code uniquement (typecheck client/serveur, lint, build client réussi, test d'intégration serveur réel sur `statusIn`), pas un test UI en conditions réelles.
      `npx tsc --noEmit` vert (server, client). `npm run build` client réussi. Suite complète serveur : 298/298 (296 + 2 nouveaux), ~30s, aucune régression. `resolu` déclaré SANS confirmation CI : la CI est actuellement désactivée sur `origin/main` sur demande du porteur du projet (workflow_dispatch seul, session du 2026-07-17), dérogation « no make it resolu » déjà établie dans cette session.
  - id: SEC-036
    titre: '4 failles IDOR de scope MANAGER : réunions de projet, application de template, brief et timeline lisibles/modifiables hors du pôle du Manager'
    perimetre: 4.2 Gestion de projet — server/src/services/projectMeeting.service.ts, server/src/services/projectTemplate.service.ts, server/src/services/project.service.ts, server/src/routes/project.routes.ts
    categorie: A
    regle_violee: RG-002
    classe: scope_manager_manquant
    gravite: bloquant
    statut: resolu
    critere_de_resolution: |
      C'est résolu quand un Manager du pôle A reçoit un rejet (403 ou 404 selon le point d'entrée) sur toute tentative de lister/créer des réunions, lire/modifier la cadence de rappel, appliquer un template, ou lire le brief/la timeline d'un projet du pôle B — vérifié par un test qui appelle réellement chaque méthode contre une base réelle, sur les 4 axes, ET confirme qu'un Manager du même pôle (ou un ADMIN non scopé) continue de fonctionner normalement.
    detecte_le: '2026-07-18'
    source: manuel
    confiance: certain
    note: |
      Signalé directement par le porteur du projet, sous la casquette « ingénieur sécurité » — 3 constats précis fournis, tous confirmés par lecture directe avant toute correction. Un 4e trou distinct trouvé en vérifiant le 3e, non mentionné dans le signalement initial — enregistré et corrigé dans la même passe conformément à CLAUDE.md.
      CONSTAT 1 (confirmé) : `projectMeeting.service.ts` (`listByProject`/`create`/`getSchedule`/`setSchedule`) n'appliquait AUCUN contrôle de scope — contrairement au pattern déjà en place dans `task.service.ts#assertProjectInScope`. Un Manager du pôle A pouvait lister/créer des réunions et lire/modifier la cadence de rappel (`meeting-schedule`, qui pilote le job de rappel quotidien) d'un projet du pôle B, en connaissant/devinant son UUID. Vérifié sur toute la chaîne (route → controller → service → repository) : aucun niveau ne filtrait.
      CONSTAT 2 (confirmé) : `projectTemplate.service.ts#applyToProject` chargeait bien `project.serviceId` (pour choisir le bon template du pôle) mais ne le comparait jamais au pôle du Manager appelant. Un Manager hors périmètre pouvait injecter en masse les tâches du template de son propre pôle dans un projet qui n'était pas le sien.
      CONSTAT 3 (confirmé) : `GET /:id/timeline-status` et `GET /:id/brief` n'avaient que `authenticate`, jamais `authorize(...)` — la protection reposait entièrement sur le filtrage interne du service, sans filet de sécurité au niveau routeur (un futur rôle ajouté ou un oubli de scoping service serait passé inaperçu).
      CONSTAT 4, TROUVÉ EN VÉRIFIANT LE CONSTAT 3 (pas dans le signalement initial) : `project.service.ts#getBrief`/`getTimelineStatus` construisaient un `where` qui ne filtrait EXPLICITEMENT que `CLIENT` et `FREELANCER` — le rôle `MANAGER` n'était jamais scopé par pôle dans ces deux méthodes, contrairement à `project.repository.ts#findById` qui gère bien ce cas (`serviceId: serviceId ?? undefined`). Un Manager du pôle A pouvait donc lire le BRIEF (potentiellement des objectifs/budget client confidentiels) ET la timeline complète de n'importe quel projet, indépendamment du problème d'`authorize()` du constat 3 — même avec un `authorize()` ajouté, sans ce correctif un Manager MANAGER aurait continué à tout voir.
      DÉCISION DU PORTEUR DU PROJET (AskUserQuestion, session du 2026-07-18) : « Corriger les 4 dans la même passe (Recommandé) ».
      CORRECTIFS ÉCRITS : (1) `assertProjectInScope` (identique au pattern de `task.service.ts`) ajouté à `projectMeeting.service.ts`, appliqué aux 4 méthodes ; controllers mis à jour pour construire et transmettre le `scope` via `buildServiceScope`. (2) `projectTemplate.service.ts#applyToProject` : vérification directe `project.serviceId !== scope.userServiceId` (le projet est déjà chargé avec son `serviceId`, pas besoin d'une requête séparée comme dans le pattern générique) — `403 PROJECT_OUT_OF_SCOPE`. (3) `authorize("ADMIN", "MANAGER", "CLIENT", "FREELANCER")` ajouté explicitement aux 2 routes (`timeline-status`, `brief`), en filet de sécurité, pas en remplacement du scoping interne déjà nécessaire. (4) Filtre `if (role === "MANAGER") where.serviceId = managerServiceId ?? "__none__"` ajouté à `getBrief` ET `getTimelineStatus` ; les deux controllers construisent désormais le scope MANAGER et le transmettent en paramètre supplémentaire.
      Nouveau test `server/test/managerScopeIdorFixes.test.ts` (câblé dans `test/run-all.test.ts`), appelle réellement les 4 services contre une base migrée, 5 cas : rejet cross-pôle sur les 4 méthodes de `projectMeeting.service.ts` ; fonctionnement normal same-pole/ ADMIN confirmé pour ne pas sur-restreindre ; rejet cross-pôle sur `applyToProject`, `getBrief`, `getTimelineStatus`.
      BUG DE TEST TROUVÉ ET CORRIGÉ EN COURS DE ROUTE (pas dans le code applicatif) : le premier jet du test déclarait `managerAScope` comme `const` au niveau module, capturant `serviceA` avant que le hook `before()` ne l'assigne (donc toujours `undefined`) — masquait un vrai bug de test sous un faux positif (tous les rejets passaient, mais pour la mauvaise raison : `userServiceId: undefined` rejette n'importe quel pôle, pas seulement le pôle B). Détecté par le test "same-pole Manager" qui échouait à tort. Corrigé en transformant `managerAScope` en fonction, appelée après l'assignation réelle de `serviceA`.
      `npx tsc --noEmit` vert. Suite complète : 303/303 (298 + 5 nouveaux), ~28-30s, aucune régression. `resolu` déclaré SANS confirmation CI : la CI est actuellement désactivée sur `origin/main` sur demande du porteur du projet (workflow_dispatch seul, session du 2026-07-17), dérogation « no make it resolu » déjà établie dans cette session.
  - id: SEC-037
    titre: 'Qualité de code : incohérence prisma/prismaRead (risque plus grave qu''une simple charge inutile), Kanban tâches sans garde de transition + message d''erreur générique, plafond 200 tâches sans indicateur, typage mensonger sur getFreelancerAvailability'
    perimetre: 4.2 Gestion de projet, 4.6 Portail client — server/src/repositories/project.repository.ts, server/src/repositories/task.repository.ts, server/src/utils/projectProgress.ts, server/src/controllers/task.controller.ts, client/src/features/tasks/TasksKanban.tsx, client/src/features/tasks/TasksPage.tsx
    categorie: B
    regle_violee: null
    classe: null
    gravite: majeur
    statut: resolu
    critere_de_resolution: |
      C'est résolu quand : (1) aucune méthode d'écriture de project.repository.ts/task.repository.ts n'utilise prismaRead — vérifié par un test qui scanne le code source réel ; (2) le Kanban de tâches rejette visuellement une transition non autorisée avant tout appel réseau, ET affiche le message d'erreur réel du serveur quand un rejet survient malgré tout (ex: projet complété) ; (3) un bandeau signale une troncature quand plus de 200 tâches existent en vue kanban ; (4) le cast de getFreelancerAvailability porte un commentaire explicite documentant sa dépendance au middleware de validation.
    detecte_le: '2026-07-18'
    source: manuel
    confiance: certain
    note: |
      Signalé directement par le porteur du projet, casquette "ingénieur full-stack" — mélange de constats de qualité de code (points 1, 4, 5, 6 corrigés ici) et d'observations positives (transactions de clientApprove, machine à états centralisée dans shared/ — non modifiées, saluées telles quelles, aucune anomalie associée).
      CONSTAT 1, PLUS GRAVE QUE RAPPORTÉ (vérifié) : le rapport signalait une simple incohérence de performance (task.repository.ts/ projectProgress.ts sur prisma primaire au lieu de prismaRead). En vérifiant, trouvé pire : project.repository.ts faisait "import prismaRead as prisma" puis utilisait cet alias pour TOUT — y compris create/update/delete/archive/restore (écritures). Si DATABASE_READ_URL pointe un jour vers un vrai réplica en lecture seule, TOUTES les écritures sur Project échoueraient. Invisible actuellement car DATABASE_READ_URL n'est pas configuré dans cet environnement (prismaRead === prisma, même client sous-jacent) — exactement le genre de bug qui dort jusqu'à ce qu'un réplica soit réellement branché.
      CORRECTIF ÉCRIT : project.repository.ts importe désormais prisma ET prismaRead séparément — prisma réservé aux écritures et aux pré-lectures immédiatement suivies d'une écriture dans le même appelant (findByIdAdmin, lu juste avant update/delete/applyTemplate par les services appelants) ; prismaRead pour toutes les lectures pures (findAll, findById, findDeleted, countNonDraftInvoices, hasDepositInvoice, countOnboardings). task.repository.ts : findAll/findById/existsInCompany (lectures pures) passées à prismaRead ; findByIdAdmin laissée sur prisma pour la même raison de pré-lecture-avant-écriture (utilisée par updateTask/deleteTask). projectProgress.ts : requête SQL brute ($queryRaw) passée à prismaRead — appelée sur chaque liste de projets, confirmée par grep des appelants (project.repository.ts, summary.repository.ts).
      Nouveau test server/test/prismaReadWriteSeparation.test.ts (câblé dans test/run-all.test.ts) — sans dépendance base de données (DATABASE_READ_URL non configuré ici rend un test comportemental impossible à distinguer) : scanne directement le code source réel des deux fichiers, confirme qu'aucun appel prismaRead.<model> .<méthode mutante> n'existe, et que l'alias prismaRead as prisma (la cause racine du bug) a bien disparu.
      CONSTAT 4 (Kanban tâches) : TasksKanban.tsx acceptait visuellement n'importe quel drop (ex. TODO -> DONE), interdit par ALLOWED_TASK_TRANSITIONS (shared/) — rejet serveur (422), puis rollback optimiste avec un toast générique masquant le message serveur explicite ("Cannot transition from TODO to DONE. Allowed: ..."). Corrigé : garde ALLOWED_TASK_TRANSITIONS[activeStatus] ?.includes(overStatus) ajoutée avant tout appel réseau (rejet immédiat, pas de round-trip inutile) ; le onError restant remonte désormais error.response.data.error.message (le message serveur réel) au lieu du seul toast générique, pour les rejets que ce garde-fou client ne peut pas anticiper (ex: projet complété). Pattern calqué sur LeadsKanban.tsx#leadInvalidTransition, déjà établi pour la même classe de défaut côté Leads.
      CONSTAT 5 (plafond Kanban) : TasksPage.tsx fixe pageSize: 200 en vue kanban sans indicateur — au-delà, des tâches disparaissent silencieusement du board. Le rapport lui-même le qualifie de "pas un bug à ce stade... mais une bombe à retardement". Corrigé a minima : bandeau d'avertissement ("Affichage limité aux 200 premières tâches sur N") affiché quand total > 200 en vue kanban — pas de refonte de la pagination du Kanban, hors du périmètre proportionné pour ce stade du produit (décision du porteur du projet).
      CONSTAT 6 (typage mensonger) : task.controller.ts #getFreelancerAvailability caste req.query as unknown as {startDate: Date, endDate: Date} — trompeur en lecture isolée (req.query est nativement des chaînes), mais correct à l'exécution grâce à validate(getFreelancerAvailabilitySchema) (transform Zod + réassignation de req.query par validate.middleware.ts), confirmé par lecture directe des deux fichiers. Pas de bug réel — commentaire explicite ajouté documentant la dépendance au middleware, pour qu'un futur développeur ne retire pas le validateur sans comprendre que le typage du controller en dépend silencieusement.
      OBSERVATIONS POSITIVES DU RAPPORT, NON MODIFIÉES : clientApprove (project.service.ts) revérifie les conditions critiques (tâches ouvertes, acompte payé, approbations en attente) À L'INTÉRIEUR de la transaction après une pré-lecture — bonne défense contre les races, déjà en place, aucune action requise. PROJECT_STATUS_VALID_TRANSITIONS/ALLOWED_TASK_TRANSITIONS centralisées dans shared/, réutilisées identiquement front/back — bon principe DRY déjà en place, aucune action requise.
      npx tsc --noEmit vert (server, client). npm run build client réussi. node scripts/check-i18n.mjs passé après ajout des 2 nouvelles clés (taskInvalidTransition, kanbanTruncatedNotice, FR+EN). Suite complète serveur : 306/306 (303 + 3 nouveaux), ~24s, aucune régression (après un aléa transitoire de connexion Postgres, résolu par nouvelle tentative — conteneur confirmé healthy via docker ps, pas lié à mes changements).
      Limite de vérification signalée explicitement : aucun outil de navigateur disponible dans cet environnement pour cliquer/glisser réellement une carte Kanban et confirmer visuellement le rejet de transition et le bandeau de troncature — vérification de niveau code uniquement (typecheck, lint, build, test structurel réel côté serveur), pas un test UI en conditions réelles.
      "resolu" déclaré SANS confirmation CI : la CI est actuellement désactivée sur origin/main sur demande du porteur du projet (workflow_dispatch seul, session du 2026-07-17), dérogation "no make it resolu" déjà établie dans cette session.
