    gravite: majeur
    statut: resolu
    critere_de_resolution: |
      C'est résolu quand les 63 fichiers listés ci-dessus utilisent exclusivement le pattern : `describe(...)` SANS option `skip`, et chaque `test(...)` accepte un paramètre `t` et vérifie `if (!dbAvailable) { t.skip("..."); return; }` comme première ligne du corps du test (le seul mécanisme qui s'exécute après que before() a résolu) — vérifié par grep exhaustif confirmant zéro occurrence restante de `{ skip: !dbAvailable` ou `{ skip: !schemaLoaded` en dehors des commentaires, ET par un run CI vert sur le commit qui porte ce correctif (voir règle générale du dépôt : un correctif non commité/non vert en CI reste `en_cours`).
    detecte_le: '2026-07-22'
    source: audit_llm
    confiance: certain
    note: |
      Découvert en investiguant un run CI réel (commit `97470f0`, job "server") qui échouait avec des erreurs Prisma explicites (`Argument client is missing`, `Argument where ... needs at least one of id or serviceId`) sur des variables (`clientId`, `serviceId`) censées être assignées par un `before()` — alors que 3 exécutions locales consécutives de la suite complète, avec les mêmes variables d'environnement CI simulées, passaient 520/520 sans aucun échec. Hypothèse initiale confirmée : `node:test` lit l'option `skip` au moment de l'enregistrement synchrone de describe/test, alors que le `before()` correspondant ne s'exécute que lors du "run" réel de la suite, trop tard pour influencer un `skip` déjà figé.
      Correction de cette entrée (même session, avant toute clôture) : le critère de résolution initial affirmait que `projectTemplateIdempotencyAndFreelancerFields.test.ts` utilisait "déjà correctement" le pattern `skip` au niveau `test()` individuel (ligne 90), et proposait de généraliser cette migration describe→test aux 38 autres fichiers. Ce critère était FAUX : ce fichier précis faisait partie des échecs CI sur ce run, alors qu'il utilisait déjà `test(name, { skip: !dbAvailable }, fn)`. Reproduit empiriquement via deux scripts `node -e` isolés : un `test(name, { skip: !flag }, fn)` enregistré après un `before()` async qui met `flag = true` après un délai artificiel EST SAUTÉ quand même, exactement comme au niveau `describe` — l'option `skip` de `test()` partage le même défaut d'évaluation synchrone que celle de `describe()`. Le seul pattern qui fonctionne réellement : accepter `(t)` dans le corps du test et faire `if (!flag) { t.skip(msg); return; }` comme première ligne du test — ce corps ne s'exécute qu'après que node:test a attendu la résolution de before().
      Portée réelle également corrigée à la hausse : la première passe avait compté "39 fichiers" par un grep approximatif ; un nouveau grep exhaustif sur `server/test/*.ts` a trouvé 63 fichiers avec le pattern `skip: !dbAvailable`/`skip: !schemaLoaded` (describe-level ou test-level confondus), tous corrigés dans cette même session par script + vérification manuelle des cas ambigus (fichiers à describe multiples, variante multi-lignes `describe(\n  title,\n { skip: ... },\n  () => {`). Après correction : 555 tests locaux, 554 passent, le seul échec restant (`taskBulkActions.test.ts`, SEC-097, assertion de timing sur l'exécution concurrente) est un test préexistant non touché par cette passe, non lié au défaut décrit ici. `npm run typecheck` et `npm run lint` verts côté server après correction. Reste à committer et confirmer un run CI vert sur ce commit avant de passer ce statut à `resolu`.
      RÉSOLU (session du 2026-07-23, audit CI SEC-212) : grep exhaustif relancé sur `server/test/*.ts`, exclusion des lignes commentaires — zéro occurrence réelle de `{ skip: !dbAvailable` ou `{ skip: !schemaLoaded` en dehors des commentaires explicatifs SEC-195 eux-mêmes (qui citent le motif interdit dans leur texte). Vérifié sur un fichier représentatif (`authCookieAndLogoutReuse.test.ts`) : `describe(...)` sans option `skip`, chaque `test(name, async (t) => {...})` accepte bien `t`. Job `server` de la CI observé vert à plusieurs reprises dans cette même session, exécutant l'intégralité de ces 63+ fichiers via `test/run-all.test.ts` sans aucun skip fantôme. Critère satisfait. `resolu`.
