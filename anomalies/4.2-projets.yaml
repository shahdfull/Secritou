    note: |
      Audit performance/cache du module Gestion de Projets, lecture directe. `summary.repository.ts#getProjectSummary` (lignes 90-100) renvoie `commentCount` et `getClientSummary` renvoie `taskCount` ; `summary.service.ts` (lignes 20-31) les écrit en cache Redis TTL 120s (projectSummary) / 300s (clientSummary) sous les tags `cacheTags.project(projectId)` / `cacheTags.client(clientId)` + `cacheTags.company()`. `comment.service.ts`/`taskChecklist.service.ts`/ `projectMeeting.service.ts` n'appellent effectivement JAMAIS `invalidateTags` (vérifié : aucun import de cacheService/cacheKeys dans ces trois fichiers) — confirmé, incohérent avec le reste du module.
      CORRECTION DU CONSTAT AVANT TOUTE ACTION (vérification demandée explicitement, session 2026-07-20) : le rapport d'origine affirmait qu'un « compteur affiche une valeur périmée jusqu'à l'expiration du TTL » — FAUX tel qu'énoncé. Vérifié par lecture directe et grep exhaustif (`grep -rn "cacheKeys.projectSummary\|cacheKeys.clientSummary" server/src/`) : `summary.service.ts#getProjectSummary`/ `#getClientSummary` appellent `cacheSet(...)` (écriture) mais n'appellent JAMAIS `cacheGet(...)` pour ce même `cacheKey` — ni dans ce fichier, ni ailleurs dans le dépôt (seul `getEnhancedDashboardSummary`, méthode distincte, fait un vrai cycle lecture-avant-calcul/écriture). Le endpoint `GET /summary/projects/ :projectId` recalcule donc TOUJOURS `commentCount` frais depuis la base à chaque appel — le cache écrit n'est jamais consulté pour servir une réponse. Conséquence réelle : PAS de donnée périmée visible aujourd'hui, contrairement à l'affirmation initiale ; l'absence d'invalidation est une incohérence de style/dette (le cache s'accumule dans Redis sans jamais être lu, ou attend un consommateur futur non encore écrit), pas un bug utilisateur actif. Gravité maintenue à `mineur` sur cette base corrigée — cohérence de code, pas correction de symptôme.
      Corrigé (par cohérence, sur décision explicite du porteur — « Traiter les deux tels quels ») : `comment.service.ts` (createComment/ updateComment/deleteComment), `taskChecklist.service.ts` (createItem/ updateItem/deleteItem) et `projectMeeting.service.ts` (create/update/ delete) invalident désormais `cacheTags.company()`, `cacheTags.project(projectId)` et `cacheTags.client(clientId)` (si le projet a un client), sur le même modèle que `task.service.ts`/ `project.service.ts`. `setSchedule` (projectMeeting.service.ts) volontairement NON touché : `meetingFrequency`/`nextMeetingDate` ne font partie d'aucun champ mis en cache par `getProjectSummary`/ `getClientSummary` (`commentCount`/`taskCount` seulement) — hors du périmètre strict de ce constat. Preuve par test réel : nouveau fichier `projectModuleCacheInvalidation.test.ts` (3 cas) — écrit une vraie entrée de cache taguée via `cacheSet` (même primitive que `summary.service.ts`), appelle réellement `commentService .createComment`/`taskChecklistService.createItem`/ `projectMeetingService.create` contre une base migrée, confirme que l'entrée taguée a disparu après la mutation (`cacheGet` → `null`) — preuve que `invalidateTags` est réellement atteint, pas seulement importé. Vérification complète : `npx tsc --noEmit` (serveur, propre), `npx tsx --test test/run-all.test.ts` (395/395, stable sur 2 exécutions consécutives, aucun handle Redis resté ouvert), `npm run lint` (serveur, 0 warning). Résolu SANS confirmation CI : workflow GitHub Actions sur `origin/main` en `workflow_dispatch` uniquement (déviation établie en session le 2026-07-17, citée à chaque clôture depuis).
