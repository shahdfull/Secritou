# Registre des anomalies — Secritou
#
# Ce fichier fait partie du registre éclaté (voir CLAUDE.md § « Procédure
# d'audit obligatoire »). Schéma par anomalie : id, titre, perimetre,
# regle_violee, classe, gravite, statut, critere_de_resolution, detecte_le,
# source, confiance, note.
# Ne jamais reformuler un titre existant — citer l'ID.
#
# Périmètre : 4.2 Gestion de projet
# 3 anomalie(s) — registre remis à zéro le 2026-07-27, historique réel
# archivé sur la branche locale archive/anomalies-avant-reset (commit 3c03297).
# +1 le 2026-08-14 (SEC-112, flaky test timing constaté hors audit formel).

anomalies:
  - id: SEC-020
    titre: >
      timeEntry.service.ts (create/list/summary/mySummary) ne vérifie jamais
      que le projet appartient au pôle du MANAGER appelant — seul
      task.service.ts/projectMeeting.service.ts/projectTemplate.service.ts
      appellent assertProjectInScope, timeEntry.service.ts non
    perimetre: 4.2-projets
    regle_violee: >
      RG-002 (Rattachement mission → pôle → associé) — un Manager (associé)
      ne peut créer, lire ou modifier des ressources d'un projet que dans
      son propre pôle.
    classe: idor-scope-manque
    gravite: bloquant
    statut: resolu
    critere_de_resolution: >
      Un test réel appelle timeEntryService.create/list/summary/mySummary
      (ou les routes POST/GET /projects/:id/time-entries,
      GET /projects/:id/my-time-summary) avec un scope MANAGER dont le
      serviceId diffère de celui du projet ciblé, et observe un rejet
      (403/404) au lieu d'un succès — pour les 4 méthodes. Le correctif doit
      appeler assertProjectInScope (server/src/utils/serviceScope.ts),
      cohérent avec le pattern déjà utilisé par task.service.ts/
      projectMeeting.service.ts/projectTemplate.service.ts.
    detecte_le: "2026-07-29"
    source: >
      Audit direct de 4.2-projets (catégories A/B/G), lecture intégrale de
      server/src/services/timeEntry.service.ts,
      server/src/repositories/timeEntry.repository.ts,
      server/src/controllers/timeEntry.controller.ts,
      server/src/routes/project.routes.ts (comparaison avec le pattern
      assertProjectInScope de server/src/utils/serviceScope.ts, déjà
      appliqué dans task.service.ts/projectMeeting.service.ts/
      projectTemplate.service.ts).
    confiance: haute
    note: >
      Route POST/GET /projects/:id/time-entries et
      GET /projects/:id/my-time-summary sont toutes authorize("ADMIN",
      "MANAGER","FREELANCER") sans aucun filtre de pôle au niveau service —
      un MANAGER peut journaliser du temps, lister les entrées, et lire son
      propre résumé de temps sur un projet de n'importe quel autre pôle.
      getTimeSummary (résumé global du projet) est authorize("ADMIN") seul,
      donc hors de portée pour un MANAGER — non concerné par ce constat.
      globalSummary/workloadByAssignee (GET /time-entries/summary,
      /workload — hors périmètre_code de ce fichier de routes) forcent déjà
      correctement serviceId au niveau contrôleur pour MANAGER — seules les
      4 méthodes keyed par projectId direct (create/list/summary/mySummary)
      sont concernées.
      Corrigé (session du 2026-07-29) : assertProjectInScope appelé dans
      create/list/mySummary (summary reste non scopé, route ADMIN-only) ;
      scope construit et transmis depuis timeEntry.controller.ts. Nouveau
      test server/test/timeEntryScope.test.ts (7 cas, appelle réellement
      timeEntryService contre une base migrée), enregistré dans
      test/run-all.test.ts. `verifie: test`.

  - id: SEC-021
    titre: >
      timeEntryService.create ne vérifie pas que taskId appartient bien à
      l'assigneeId du FREELANCER appelant (seul le rattachement du taskId au
      projectId est vérifié) — un FREELANCER staffé sur un projet peut
      journaliser du temps sur la tâche d'un collègue du même projet
    perimetre: 4.2-projets
    regle_violee: >
      Cohérence attendue avec la restriction FREELANCER déjà appliquée
      ailleurs dans le module (task.service.ts#updateTask : un FREELANCER ne
      peut agir que sur ses propres tâches assignées) — timeEntry.service.ts
      ne réplique cette restriction qu'au niveau du projet, pas de la tâche
      précise journalisée.
    classe: idor-scope-manque
    gravite: moyenne
    statut: resolu
    critere_de_resolution: >
      Un test réel appelle timeEntryService.create avec un FREELANCER staffé
      sur le projet (au moins une tâche qui lui est assignée) mais passant le
      taskId d'une tâche du même projet assignée à un autre utilisateur, et
      observe un rejet (403/422) au lieu d'un succès.
    detecte_le: "2026-07-29"
    source: >
      Audit direct de 4.2-projets, lecture intégrale de
      server/src/services/timeEntry.service.ts#create (comparaison avec
      task.service.ts#updateTask, qui restreint explicitement un FREELANCER
      à task.assigneeId === scope.userId).
    confiance: haute
    note: >
      Constat distinct de SEC-020 (portée FREELANCER-vers-tâche, pas
      MANAGER-vers-projet) — même classe (idor-scope-manque), critère de
      résolution différent, donc ID distinct (voir CLAUDE.md « Règle des
      IDs »). Impact limité à la visibilité/attribution des heures
      journalisées (pas un accès à des données financières client), d'où la
      gravité moyenne plutôt que bloquant.
      Corrigé (session du 2026-07-29) : timeEntryService.create restreint
      désormais data.taskId à assigneeId: userId quand userRole ===
      "FREELANCER". Même test server/test/timeEntryScope.test.ts (2 des 7
      cas couvrent spécifiquement ce constat). `verifie: test`.

  - id: SEC-022
    titre: >
      documentService.update/createVersion n'appellent jamais
      documentRepository.findById avec un viewer scopé — un MANAGER peut
      modifier ou créer une nouvelle version de n'importe quel document
      (nom, titre, tags, accessLevel) hors de son pôle, alors que
      getById/getDownloadUrl vérifient déjà correctement ce même scope via
      where.client.projects.some.serviceId
    perimetre: 4.2-projets
    regle_violee: >
      RG-002 (Rattachement mission → pôle → associé) — un Manager ne peut
      créer, lire ou modifier des ressources d'un projet que dans son
      propre pôle.
    classe: idor-scope-manque
    gravite: eleve
    statut: resolu
    critere_de_resolution: >
      Un test réel appelle documentService.update et documentService.
      createVersion avec un viewer MANAGER dont le serviceId diffère de
      celui du projet/client propriétaire du document ciblé, et observe un
      rejet (403/404) au lieu d'un succès — pour les deux méthodes.
    detecte_le: "2026-07-29"
    source: >
      Audit direct de 4.2-projets, lecture intégrale de
      server/src/services/document.service.ts,
      server/src/repositories/document.repository.ts,
      server/src/controllers/document.controller.ts,
      server/src/routes/document.routes.ts (comparaison entre
      documentRepository.findById(id, viewer) — utilisé correctement par
      getById/getDownloadUrl — et update/createVersion, qui appellent
      soit prisma.document.update(id) directement soit
      documentRepository.findById(id) SANS le second argument viewer).
    confiance: haute
    note: >
      PUT /documents/:id (authorize ADMIN/MANAGER, requirePermission
      documents.update) et POST /documents/:id/versions (même garde)
      passent bien par requirePermission, mais aucun scope de pôle n'est
      revérifié après ce point — la garde RBAC granulaire donne une fausse
      impression de sécurité complète alors que le scope métier (pôle) est
      absent sur ces deux chemins d'écriture précis. DELETE /documents/:id
      est ADMIN-only (jamais atteignable par un MANAGER), donc hors de
      portée de ce constat malgré le même repository.delete(id) sans
      scope.
      Corrigé (session du 2026-07-29) : documentService.update/
      createVersion acceptent désormais un viewer et appellent
      documentRepository.findById(id, viewer) (404 si hors scope) avant
      d'écrire. document.controller.ts construit et transmet le scope
      MANAGER. Nouveau
      server/test/documentUpdateVersionScopeManager.test.ts (5 cas,
      appelle réellement documentService contre une base migrée),
      enregistré dans test/run-all.test.ts. `verifie: test`.

  - id: SEC-112
    titre: >
      test/taskBulkActions.test.ts#"processes tasks concurrently, not
      sequentially" échoue de façon récurrente en CI sur des commits sans
      rapport avec le module tâches — 4 échecs consécutifs observés le
      2026-08-14 sur 2 commits successifs (31834991818, 31835959744),
      tous avec le même symptôme : ratio juste au-dessus du seuil 6x
      (6.1x/6.2x/6.5x), jamais un écart massif. Le seuil avait déjà été
      élargi une fois (4x -> 6x, 2026-07-23, cf. commentaire du test qui
      cite "SEC-097" — un ID appartenant en réalité à une tout autre
      anomalie transverse dans le registre actuel, cf. note) après un
      flake réel similaire — la marge actuelle reste insuffisante face
      au bruit réel du runner GitHub Actions partagé.
    perimetre: 4.2-projets
    regle_violee: >
      Aucune règle métier — fiabilité d'infrastructure de test. Le test
      mesure un ratio entre deux durées observées (batchDuration /
      singleDuration), où singleDuration est une unique requête de
      quelques millisecondes (8-10ms observés) — hautement sensible au
      moindre jitter réseau/DB du runner CI partagé, contrairement à une
      mesure moyennée sur plusieurs appels.
    classe: test-timing-relatif-marge-insuffisante-ci-partage
    gravite: mineure
    statut: ouvert
    detecte_le: "2026-08-14"
    source: >
      Constat incident pendant la vérification post-push de SEC-096
      (intégration axe-core continue) — 2 commits successifs et sans
      rapport avec le module tâches (fbfa5b9 : client/i18n/e2e uniquement ;
      46227b8 : anomalies/*.yaml uniquement) ont chacun déclenché un échec
      de ce test précis en CI, nécessitant respectivement 1 et 2 re-runs
      pour repasser vert. Enregistré immédiatement conformément à
      CLAUDE.md (tout écart constaté hors d'un audit formel s'enregistre
      dans la même session).
    confiance: >
      Haute sur le fait qu'aucun des deux commits déclencheurs n'est la
      cause (diffs vérifiés directement). Haute aussi sur la nature du
      défaut (marge de timing relative insuffisante face au bruit CI,
      pas une régression de concurrence réelle) : le commentaire du test
      lui-même (lignes 186-192) documente déjà un précédent identique
      (flake réel confirmé sous contention du pool de connexions, code
      Promise.allSettled vérifié inchangé) qui avait déjà motivé un premier
      élargissement de marge (4x -> 6x) — ce nouvel épisode montre que ce
      premier élargissement n'a pas suffi durablement.
    critere_de_resolution: >
      Soit (a) la marge de comparaison est rendue moins sensible au bruit
      (ex. moyenne de plusieurs appels single au lieu d'un seul, ou seuil
      absolu en ms plutôt qu'un ratio contre une mesure elle-même
      bruitée), avec preuve d'une stabilité réelle sur plusieurs runs CI
      consécutifs — pas une seule observation ; soit (b) le test est
      restructuré pour ne plus dépendre du timing réel (ex. compter les
      appels concurrents réellement émis plutôt que mesurer une durée
      totale). Ne pas se contenter d'élargir la marge une seconde fois
      sans changer la méthode de mesure — c'est déjà ce qui a été fait une
      fois (2026-07-23) et le problème est revenu.
    note: >
      Le commentaire du test citait "SEC-097" comme origine du premier
      élargissement de marge (2026-07-23) — cet ID appartient aujourd'hui
      à une tout autre anomalie du registre actuel (transverse.yaml#
      SEC-097, dette technique WCAG, resolu le 2026-08-14). Ce n'est pas
      une erreur de frappe : le registre a été remis à zéro le
      2026-07-27 (voir l'en-tête de _index.yaml), et ce commentaire de
      code, écrit avant cette date, citait un ID de l'ancien registre
      (archivé sur la branche archive/anomalies-avant-reset, commit
      3c03297) jamais mis à jour après le reset. Corrigé depuis (mandat
      explicite et séparé du porteur, pas une initiative dans le cadre
      de cette anomalie) : commit af005f7, le describe et le commentaire
      référencent désormais SEC-112 — seuil et logique du test
      inchangés.

      2026-08-14, preuves supplémentaires de récurrence : le commit
      44e7ca4 (registre uniquement, SEC-070) a déclenché 2 nouveaux
      échecs consécutifs de ce même test avant de repasser vert au 3e
      essai — ratios 6.8x puis 7.0x (ce dernier dépasse même le seuil
      alors en vigueur de 6x, contrairement aux 3 premiers échecs qui
      restaient juste en dessous). 6 échecs au total le 2026-08-14 sur
      3 commits successifs sans rapport avec le module tâches
      (fbfa5b9, 46227b8, 44e7ca4), confirmant que la marge actuelle
      n'offre plus de garantie fiable, pas seulement un bruit
      occasionnel. Renforce critere_de_resolution ci-dessus : élargir la
      marge une troisième fois ne suffira probablement pas non plus
      sans changer la méthode de mesure elle-même.

    investigation_2026_08_14: >
      Investigation de cause réelle menée (demande explicite du porteur,
      sur mandat d'interdire un 3e élargissement silencieux de la marge).

      Étape 1 — lecture complète du test (server/test/
      taskBulkActions.test.ts) : singleDuration mesurait une SEULE requête
      updateTask() d'échauffement (~8-10ms observés) ; batchDuration
      mesurait bulkUpdateStatus() sur 10 tâches concurrentes ; seuil
      batchDuration < singleDuration * 6.

      Étape 2 — lecture du code réel de l'action bulk (task.service.ts) :
      bulkUpdateStatus utilise bien Promise.allSettled (concurrence réelle
      confirmée, aucun N+1 séquentiel). Mais updateTask() lui-même appelle
      inconditionnellement invalidateTags() (cacheService.ts) en fin de
      parcours, dont l'implémentation itère les tags SÉQUENTIELLEMENT
      (une boucle for, chaque itération faisant sMembers puis del contre
      Redis — 2-3 aller-retours par tag). Les 10 tâches du test partagent
      TOUTES le même project (makeProject appelé une seule fois), donc
      les 10 appels concurrents à invalidateTags ciblent exactement les
      mêmes clés Redis (company/dashboard/project) — un mécanisme de
      contention plausible et cohérent avec le commentaire historique du
      test ("connection-pool contention" déjà noté en 2026-07-23).

      Étape 3 — isolation : le test relancé seul 10 fois de suite (2
      passes de 5) sur cette machine locale, 0/10 échec, batchDuration
      systématiquement 52-158ms selon la mesure, largement sous tout
      seuil testé. MAIS : le Redis local de cette machine s'est avéré
      répondre en erreur (SocketTimeoutError) à chaque invocation
      d'invalidateTags pendant ces runs — invalidateTags avale l'erreur
      en interne (try/catch, log warn) sans jamais la remonter au test,
      donc le vrai coût Redis n'a PU être mesuré en isolation locale
      sur cette machine. Le mécanisme de contention identifié à l'étape 2
      reste une explication plausible et structurellement cohérente des
      échecs CI (où Redis répond normalement), mais n'a pas pu être
      confirmé empiriquement en reproduction locale faute d'un Redis
      local fonctionnel pour comparer.

      Étape 4 — décision (demande explicite du porteur) : ni cause
      déterministe strictement confirmée (pas de reproduction locale
      possible), ni absence de piste (mécanisme plausible identifié et
      documenté) — situation intermédiaire. Plutôt qu'un 3e élargissement
      de la marge relative (interdit par le mandat), la voie (a) du
      critere_de_resolution est appliquée sous sa variante "seuil absolu
      en ms plutôt qu'un ratio contre une mesure elle-même bruitée" :
      commit [à renseigner après commit] remplace l'assertion par une
      borne absolue généreuse (batchDuration < 500ms, ~8x la pire valeur
      jamais observée en CI à ce jour, 61ms) — retire aussi le warm-up
      updateTask() désormais inutile (plus de ratio à calculer). Résultat
      fonctionnel (10/10 succès) toujours vérifié en plus du timing.
      Vérifié stable sur 10 exécutions isolées locales consécutives
      (0/10 échec, 101-144ms observés) avant commit — reste à confirmer
      sur plusieurs runs CI réels avant clôture, même doctrine que
      SEC-111 (compter les tentatives, pas se satisfaire d'un seul run
      vert après ajustement).
