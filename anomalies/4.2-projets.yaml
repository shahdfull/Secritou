      DÉCISION DU PORTEUR DU PROJET (AskUserQuestion, session du 2026-07-18) : « Retirer le bouton/dialogue (Recommandé) » — plutôt que de réparer le formulaire avec un sélecteur de proposition (2e option proposée, nécessitant un nouvel endpoint `GET /proposals?status=ACCEPTED&projectId=null`, non créé).
      CORRECTIF ÉCRIT : bouton "Nouveau projet", son `<Dialog>`/ `<DialogTrigger>`, le formulaire `createForm` (react-hook-form + `createProjectSchema`), le handler `handleCreate`, et `useCreateProject()` retirés de `ProjectsPage.tsx`. `canCreate` (`usePermission("projects", "create")`) retiré, son seul usage étant ce bouton (confirmé par grep, aucun autre composant du dépôt ne consomme cette permission). Imports devenus morts nettoyés (`Plus`, `DialogTrigger`, `createProjectSchema`, `CreateProjectForm`, `useCreateProject`). Le formulaire d'ÉDITION (`editForm`/`handleEdit`, sur un projet existant, sans `proposalId`) reste intact et fonctionnel — seul le chemin de CRÉATION directe est retiré. Route serveur `POST /projects` (validateur, service) volontairement non touchée : reste disponible pour un futur usage programmatique/API directe si besoin, seul le point d'entrée UI cassé est retiré.
      Aucun test ajouté : retrait de code mort côté UI, pas de nouvelle logique métier à prouver — la garantie tient au typecheck (0 erreur après retrait, confirmant qu'aucun autre code du dépôt ne dépendait de ce formulaire) et à la lecture directe. Clés i18n (`newProject`, `createProject`, `createProjectDesc`, etc.) volontairement laissées en place (orphelines mais inoffensives — `check-i18n.mjs` ne signale que les clés manquantes/désynchronisées, pas les clés inutilisées, hors périmètre de ce correctif).
      `npx tsc --noEmit` vert. `npm run build` réussi. `resolu` déclaré SANS confirmation CI : la CI est actuellement désactivée sur `origin/main` sur demande du porteur du projet (workflow_dispatch seul, session du 2026-07-17), dérogation "no make it resolu" déjà établie dans cette session.
