      Trois décisions de conception tranchées via AskUserQuestion avant tout code, chacune changeant significativement le modèle de données à construire : (1) profondeur — un seul niveau, une sous-tâche ne peut pas elle-même avoir de sous-tâches (écarte l'imbrication récursive et son UI) ; (2) autonomie — une sous-tâche est une simple checklist (titre + fait/pas fait), PAS une entité `Task` complète avec assignee/statut/échéance propres (écarte la réutilisation de `Task.parentId`, qui aurait laissé croire à tort qu'une sous-tâche est une vraie tâche) ; (3) complétion — aucune règle automatique ne bloque le statut du parent en fonction de ses sous-tâches, statuts totalement indépendants (écarte une nouvelle règle métier de blocage à concevoir et tester).
