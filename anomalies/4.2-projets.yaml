    detecte_le: '2026-07-20'
    source: audit_llm
    confiance: certain
    note: |
      Classée sous 4.2 Gestion de projet (périmètre principal, égalité de score de classement automatique) — périmètre(s) secondaire(s) également concerné(s) : 4.4 Facturation & Paiements, 4.8 Analytics & Performance.

      Audit performance (goulots d'étranglement Redis/BullMQ/pagination/PDF/ frontend/Prometheus), lecture directe. `ReportsPage.tsx:78` (`listParams = { page: 1, pageSize: 500 }`, `useMemo` figé) alimente `useLeads`, `useProjects`, `useInvoices` avec le même objet. Côté serveur : `lead.controller.ts:12,16` définit `LEADS_MAX_PAGE_SIZE = 500` et le passe à `parseListQuery` (correctif SEC-118) — les leads ne sont donc PAS tronqués. Mais `project.controller.ts:28` (`getAllProjects`) et les quatre appels de `invoice.controller.ts` (lignes 16, 23, 32, 42) appellent `parseListQuery(req.query as Record<string, unknown>)` SANS second argument — `listQuery.ts:23` retombe sur `maxPageSize = 50` par défaut, donc `pageSize: 500` envoyé par `ReportsPage` est plafonné à 50 pour projects ET invoices, silencieusement (même mécanisme que SEC-118, mais deux endpoints distincts non couverts par ce correctif).
      Aggravant, vérifié séparément par lecture directe : `listQuery.ts:27` (`const orderDir = query.orderDir === "desc" ? "desc" : "asc"`) — `ReportsPage` n'envoie jamais `orderDir`, donc `orderDir` vaut "asc" par défaut. `project.repository.ts:73` et `:210` (`buildOrderBy(options.orderBy, options.orderDir, SORTABLE_FIELDS, "createdAt")`) appliquent donc `createdAt asc`. `invoice.repository.ts` (lignes 68, 133, 191, `orderBy: { [options.orderBy || "createdAt"]: options.orderDir || "desc" }`) semble vouloir un fallback "desc", mais `options.orderDir` n'est jamais falsy (typé `"asc" | "desc"` par `ListQueryOptions`, toujours une chaîne non vide) — le `|| "desc"` ne s'active donc jamais en pratique, et `options.orderDir` ("asc", reçu de `parseListQuery`) est utilisé tel quel. Résultat vérifié par lecture combinée des trois fichiers : les 50 projets et 50 factures renvoyés à `ReportsPage` sont les 50 plus ANCIENS par `createdAt`, pas les plus récents. Le filtre par défaut de la page (30 derniers jours, `ReportsPage.tsx:71-76`) est donc appliqué à un lot qui exclut structurellement les enregistrements récents dès que l'entreprise dépasse 50 projets ou 50 factures au total — la page peut afficher 0 projet/facture récents alors qu'il en existe, sans aucune erreur ni indication de troncature. `exportToPDF`/`exportToExcel` (`ReportsPage.tsx:146-165`) réutilisent `filteredLeads`/ `filteredProjects` (donc `filteredInvoices` via `totalRevenue`) — les exports PDF/Excel hérite du même biais, pas seulement l'écran.
      Non confirmé plus loin par manque de temps dans cette passe : le volume réel de projets/factures en base de dev (0 client actif à ce jour d'après CLAUDE.md, donc le défaut est actuellement dormant — il s'activera au premier dépassement de 50 projets ou factures créés).
      RÉ-AUDIT (session du 2026-07-20, vérification directe post-passage externe — code modifié hors de cette session, non attribuable) : correctif présent dans le working tree, non commité. `project.controller.ts:29` et les 5 appels de `invoice.controller.ts` passent désormais `REPORTS_MAX_PAGE_SIZE = 500` à `parseListQuery` ; `ReportsPage.tsx:78` envoie maintenant explicitement `orderBy: "createdAt", orderDir: "desc"` — les deux volets du constat (plafond ET tri) semblent traités. `npx tsc --noEmit` et `npm run lint` propres sur les deux workspaces pour les fichiers touchés. MAIS : aucun test n'a été trouvé référençant `REPORTS_MAX_PAGE_SIZE` ni le nouveau comportement de tri (recherche `server/test/*report*`, `server/test/*dashboard*` : aucun résultat) — le critère de résolution formel (test avec >50 projets/factures, récents ET anciens) n'est donc pas vérifié par preuve automatisée. Suite de tests non exécutable dans cet environnement de vérification (blocage constaté, pas contourné : `npx tsx --test` échoue avec `esbuild` compilé pour `win32-x64` alors que ce sandbox est `linux-x64` — `node_modules` semble avoir été installé sur une autre plateforme que celle où la suite a été relancée ici). Reste `en_cours` : correctif écrit, ni testé ni commité — conforme à la règle CLAUDE.md sur les correctifs non commités.
      TEST ÉCRIT ET VÉRIFIÉ (session du 2026-07-20, environnement Windows, base réelle accessible) : `server/test/reportsPageSortOrder.test.ts` (câblé dans `run-all.test.ts`), requêtes HTTP réelles contre `app` (via `supertest`) sur `GET /leads`, `GET /projects`, `GET /invoices` avec exactement les paramètres envoyés par `ReportsPage.tsx` (`page:1, pageSize:500, orderBy:createdAt, orderDir:desc`), après création de 60 enregistrements de chaque entité (au-delà du plafond par défaut de 50, SEC-118) avec des `createdAt` échelonnés d'une minute. Confirme : (1) les 60 enregistrements sont bien tous retournés (pas de troncature silencieuse à 50) ; (2) le plus récemment créé de chaque entité apparaît en premier, le plus ancien en dernier (`orderDir:desc` bien honoré de bout en bout, y compris pour `invoices` malgré la particularité de `invoice.repository.ts` où le fallback `|| "desc"` ne s'active jamais en pratique — le tri fonctionne correctement car `ReportsPage.tsx` envoie désormais `orderDir` explicitement, contournant le besoin de ce fallback). Suite complète : 479 tests, 479 pass, 0 fail (aucune régression). `npx tsc --noEmit` propre, `npm run lint` 0 error/0 warning. Le critère de résolution formel est maintenant rempli par preuve automatisée — reste `en_cours` uniquement faute de commit avec CI verte confirmée (voir SEC-010).
      DÉCLARÉ `resolu` SANS confirmation CI (session du 2026-07-20) : dérogation explicite à la règle commit+CI de CLAUDE.md, sur instruction directe du porteur du projet (« Le ci n est pas important pour le moment make them resolus »). Le correctif ci-dessus reste néanmoins vérifié localement (typecheck/lint/tests verts, ou lecture directe confirmée selon le cas) — seule la confirmation par un run CI réel sur GitHub Actions est levée par cette dérogation, pas la vérification elle-même.
