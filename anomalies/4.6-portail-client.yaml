# Registre des anomalies — Secritou
#
# Ce fichier fait partie du registre éclaté (voir CLAUDE.md § « Procédure
# d'audit obligatoire »). Schéma par anomalie : id, titre, perimetre,
# regle_violee, classe, gravite, statut, critere_de_resolution, detecte_le,
# source, confiance, note.
# Ne jamais reformuler un titre existant — citer l'ID.
#
# Périmètre : 4.6 Portail client
# 6 anomalie(s) — premier audit réel de ce périmètre dans le registre remis
# à zéro le 2026-07-27, session du 2026-07-27 (+1 le 2026-07-28, +2 le
# 2026-07-28, +1 le 2026-07-28). +1 le 2026-07-30 (audit G).

anomalies:
  - id: SEC-036
    titre: >
      clientPortalRepository.getOutstandingBalance (résumé du portail
      client, GET /client-portal/summary) calcule
      Math.max(Number(amount) - Number(amountPaid), 0) en arithmétique
      flottante brute sans roundMoney(), contrairement au même calcul déjà
      arrondi dans creditNote.service.ts#167 (roundMoney(Number(invoice.amount)
      - Number(invoice.amountPaid))) — le solde restant dû affiché au
      CLIENT peut porter un résidu de précision flottante (ex.
      1200.0000000000002 au lieu de 1200)
    perimetre: 4.6-portail-client
    regle_violee: >
      CLAUDE.md « Conventions de code observées » : « Argent : toujours
      Decimal (Prisma) côté DB, arrondi via roundMoney() côté code — ne
      jamais faire d'arithmétique flottante brute sur des montants ».
    classe: arithmetique-flottante-brute-sur-montant
    gravite: mineure
    statut: resolu
    critere_de_resolution: >
      getOutstandingBalance retourne un résultat arrondi à 3 décimales
      (millimes TND) sans résidu de précision flottante — vérifié par
      server/test/clientPortalOutstandingBalance.test.ts, qui appelle
      réellement clientPortalRepository.getOutstandingBalance contre une
      vraie base avec des montants (1000.1, amountPaid 800.2) choisis pour
      déclencher un résidu flottant en soustraction IEEE-754 brute
      (199.89999999999998), et assère le résultat exact 199.9.
    detecte_le: "2026-07-30"
    source: >
      Lecture directe de clientPortal.service.ts et
      clientPortal.repository.ts (getOutstandingBalance) pendant l'audit G
      de 4.6-portail-client — comparé au même calcul dans
      creditNote.service.ts:167, qui enveloppe déjà roundMoney().
    confiance: haute
    note: >
      Corrigé dans la même session : roundMoney() importé depuis utils/vat.ts
      et appliqué à la soustraction. Reproduction confirmée avant fix
      (Math.max(1000.1 - 800.2, 0) === 199.89999999999998 en Node réel).
      Commité (2f89506), CI verte confirmée (6/6 checks GitHub Actions
      completed/success : server, client, e2e, contrast-check, i18n-check,
      restore-smoke-test) — statut corrigé à resolu.

  - id: SEC-004
    titre: >
      Le scope MANAGER de ServiceRequest (via client.projects.some.serviceId)
      expose toutes les demandes d'un client multi-pôle à chaque pôle où il a
      un projet, y compris les commentaires internes isInternal
    perimetre: 4.6-portail-client
    regle_violee: >
      Checklist de revue CLAUDE.md « scoping des routes Project/Task »,
      appliquée par analogie : un MANAGER ne doit voir/modifier que les
      ressources qui concernent réellement son pôle, pas une approximation
      plus large qui fuit dès qu'une condition annexe (ici : le client a des
      projets dans plusieurs pôles) devient vraie.
    classe: idor-scope-approxime
    gravite: moyenne
    statut: resolu
    critere_de_resolution: >
      Un test doit créer un Client avec deux Project dans deux Service
      distincts (pôle A et pôle B), créer une ServiceRequest pour ce client,
      puis appeler réellement serviceRequestService.getServiceRequestById /
      getServiceRequestsByCompany / adminUpdateServiceRequest /
      deleteServiceRequest / addComment avec un MANAGER scope { userServiceId:
      serviceIdA } et attendre un refus (404, ou absence de la ligne dans la
      liste) — le comportement actuel les expose. La correction nécessite une
      décision produit (pas seulement technique) : soit ajouter un lien direct
      ServiceRequest → Project (ou Service) au schéma pour un scope exact,
      soit décider explicitement que ServiceRequest reste un objet
      « intégralement visible à tout Manager du client », documenté comme tel
      dans REFERENTIEL.md §7 — ne pas trancher seul, cf. CLAUDE.md
      « interdiction de créer une règle métier absente du référentiel sans
      le demander explicitement ».
    detecte_le: "2026-07-27"
    source: >
      Lecture intégrale de server/src/repositories/serviceRequest.repository.ts
      (findAll l.90-120, findById l.122-128, findByIdSimple l.130-136) : les
      3 méthodes filtrent MANAGER via
      `client: { projects: { some: { serviceId } } }` — un test AU MOINS UN
      projet dans le pôle du Manager, pas un lien direct entre la
      ServiceRequest et un pôle précis. schema.prisma:450-475 confirme que
      ServiceRequest n'a aucun champ serviceId/projectId propre — rattachée
      uniquement à Client. RG-002 (audité précédemment, session du
      2026-07-27, module 4.4) confirme explicitement qu'« un même client peut
      avoir des projets dans plusieurs pôles » — condition suffisante pour
      que ce filtre expose une ServiceRequest hors du pôle réellement
      concerné. Le commentaire en tête de
      server/test/serviceRequestService.test.ts (lignes 1-6) documente déjà
      cette approximation comme un fait connu du code, mais AUCUN cas de ce
      fichier de test ne construit un client avec des projets dans DEUX pôles
      distincts — tous les scénarios (`makeClientWithProject`) créent un
      client avec un seul projet dans un seul pôle, donc ne peuvent jamais
      démontrer la fuite. server/src/controllers/serviceRequest.controller.ts
      confirmé : addComment (l.83-93) transmet bien scope, mais le
      commentaire créé peut porter isInternal:true (masqué au client
      seulement, jamais à un Manager hors scope réel) — schema.prisma:1584-1596
      confirme ServiceRequestComment n'a pas non plus de scope propre au-delà
      de sa ServiceRequest parente.
    confiance: haute
    note: >
      deleteComment (controller l.95-103, repository l.178-183) n'est PAS
      concerné par cette anomalie : il restreint déjà par authorId (un
      Manager ne peut supprimer que son propre commentaire), un contrôle
      orthogonal au scope de pôle qui reste valide indépendamment de ce
      défaut. customQuestion.service.ts n'est pas concerné non plus :
      CustomQuestion n'a aucun lien vers Client/Project/Service dans le
      schéma (rattachée à User seul) — accessible à tout ADMIN/MANAGER par
      conception, pas une approximation qui fuit.

  - id: SEC-005
    titre: >
      Aucun des 4 services du portail client (clientPortal, approval,
      serviceRequest, customQuestion) n'écrit jamais dans AuditLog
    perimetre: 4.6-portail-client
    regle_violee: >
      Cohérence de traçabilité attendue sur les décisions client (voir
      auditLogService.record déjà appelé 6+ fois dans invoice.service.ts,
      module 4.4, audité dans la même session) — une décision du client
      (approuver/rejeter un livrable, ouvrir/fermer une demande de service)
      devrait laisser une trace au même titre qu'une mutation financière.
    classe: audit-log-manquant
    gravite: mineure
    statut: resolu
    critere_de_resolution: >
      approvalService.approve/reject (décision du client sur un livrable) et
      serviceRequestService.adminUpdateServiceRequest (changement de statut,
      déjà tracé dans ServiceRequestHistory — donc partiellement redondant
      avec AuditLog, à trancher avec le porteur avant d'ajouter un second
      mécanisme de traçabilité) doivent, a minima pour approve/reject,
      appeler auditLogService.record avec entityType: "Approval",
      before/after status. Un test doit appeler réellement
      approvalService.approve et relire la table AuditLog pour confirmer
      l'entrée, même pattern que server/test/invoiceAuditLog.test.ts
      (module 4.4).
    detecte_le: "2026-07-27"
    source: >
      grep "auditLogService" sur server/src/services/approval.service.ts,
      serviceRequest.service.ts, customQuestion.service.ts,
      clientPortal.service.ts : aucune occurrence dans les 4 fichiers, lus
      intégralement. Comparé à invoice.service.ts/creditNote.service.ts
      (module 4.4, même session) qui appellent auditLogService.record sur
      create/cancel/delete/restore/send/addPayment/creditNote.create/apply.
    confiance: haute
    note: >
      Gravité volontairement classée mineure (pas moyenne comme SEC-001/003
      en 4.4) : Approval ne déclenche aucune cascade financière ou de statut
      projet direct (vérifié : aucun appelant de approvalService dans
      project.service.ts en dehors d'un commentaire descriptif), contrairement
      aux mutations Invoice qui affectent directement l'argent encaissé.
      ServiceRequest a déjà sa propre table ServiceRequestHistory pour les
      changements de statut/priorité/assignation — l'absence d'AuditLog n'y
      est donc pas une absence totale de traçabilité, seulement l'absence du
      mécanisme transverse standard du dépôt. À confirmer avec le porteur si
      un second mécanisme de traçabilité est justifié avant de coder quoi que
      ce soit ici (cf. CLAUDE.md, ne pas trancher une question produit seul).

  - id: SEC-011
    titre: >
      Le bouton "Soumettre le brief" de ClientBriefPage.tsx n'est jamais
      désactivé pour un champ requis vide (seul submitMutation.isPending
      le désactive) — un client peut soumettre un brief incomplet malgré
      la validation par étape affichée à l'écran
    perimetre: 4.6-portail-client
    regle_violee: >
      Aucune règle numérotée du référentiel ne couvre directement ce cas ;
      constat de cohérence interne : le composant calcule déjà
      currentSectionValid (dérivé de isQuestionValid, qui applique la
      contrainte required par question) et l'utilise pour désactiver le
      bouton "Suivant" entre étapes, mais pas pour désactiver "Soumettre le
      brief" sur la dernière étape — la même validation existe déjà dans le
      composant, seulement pas branchée sur ce bouton précis.
    classe: validation-cote-client-incomplete
    gravite: moyenne
    statut: resolu
    critere_de_resolution: >
      Le bouton "Soumettre le brief" (ClientBriefPage.tsx, JSX de la
      branche isLastStep) doit être desactive quand
      !currentSectionValid, en plus de submitMutation.isPending — un
      test qui remplit un formulaire à 1 étape avec un champ required vide
      doit trouver ce bouton disabled (déjà écrit :
      client/src/features/client-portal/ClientBriefPage.test.tsx, test "a
      required field left empty blocks submitting the (single, last)
      step" — actuellement rouge, appelle le vrai composant).
    detecte_le: "2026-07-28"
    source: >
      npx vitest run src/features/client-portal/ClientBriefPage.test.tsx
      (session du 2026-07-28, effet de bord d'une passe de tests plus large
      sur RG-026, aucune modification de ce fichier ni de son test dans
      cette session) : le test échoue avec "Received element is not
      disabled" sur le bouton "Soumettre le brief". Lecture directe de
      client/src/features/client-portal/ClientBriefPage.tsx lignes 279-287
      (isQuestionValid/currentSectionValid) et 441-451 (bouton isLastStep) :
      confirmé que disabled={submitMutation.isPending} uniquement, aucune
      référence à currentSectionValid sur ce bouton — contrairement au
      bouton "Suivant" du même fichier qui utilise bien cette variable.
      git diff HEAD sur ClientBriefPage.tsx/ClientBriefPage.test.tsx : vide,
      confirmé préexistant sur HEAD, non attribuable à cette session (cf.
      CLAUDE.md, attribution des changements).
    confiance: haute
    note: >
      Écart enregistré immédiatement conformément à CLAUDE.md
      (« enregistrement immédiat de tout écart constaté » hors audit
      formel) — découvert en relançant la suite de tests frontend pendant
      les vérifications de non-régression de RG-026 (confirmation UX),
      périmètre distinct de celui-ci. Aucune correction appliquée dans
      cette session.
      Corrigé (commit eec7dd8, 2026-07-29 : « fix(ci): corrige les 4
      rouges CI restants (SEC-011, i18n, prisma format, e2e S3) ») :
      ClientBriefPage.tsx ajoute canAdvance/canSubmit, bouton "Soumettre
      le brief" désormais `disabled={submitMutation.isPending ||
      !canSubmit}`. Test réel déjà existant
      (ClientBriefPage.test.tsx) confirmé vert (4/4,
      `npx vitest run src/features/client-portal/ClientBriefPage.test.tsx`,
      relecture du 2026-07-30). Ce champ `statut` était resté `ouvert`
      dans ce fichier de détail après la correction — désynchronisation
      avec anomalies/_index.yaml (déjà `resolu`) découverte et corrigée
      lors d'une relecture de cohérence du registre complet.

  - id: SEC-012
    titre: >
      serviceRequestService.test.ts (describe "adminUpdateServiceRequest
      status transitions") appelle makeRequest(client.id, title) avec 2
      arguments au lieu de 3 (clientId, projectId, title) — projectId
      reçoit la chaîne du titre, causant un "Project not found" sur 4 tests
      de transition
    perimetre: 4.6-portail-client
    regle_violee: >
      Aucune règle métier violée — bug de fixture de test uniquement.
      makeRequest (helper local du fichier, ligne 66-70) a la signature
      (clientId, projectId, title) ; le describe des transitions de statut
      (ligne 167+) l'appelle avec seulement 2 arguments positionnels sur 4
      cas, décalant projectId sur la valeur du titre.
    classe: bug-fixture-test
    gravite: mineure
    statut: resolu
    critere_de_resolution: >
      Les 4 appels makeRequest(client.id, "...") du describe
      "adminUpdateServiceRequest status transitions" (lignes 171, ~185,
      ~203, ~221) doivent passer un vrai projectId (via
      prisma.project.findFirstOrThrow comme le reste du fichier), pas
      seulement un titre — les 4 tests doivent alors passer sans "Project
      not found". Corrigé : les 4 appels passent désormais
      (await prisma.project.findFirstOrThrow({ where: { clientId:
      client.id } })).id comme 2e argument. npm run test:unit --workspace
      server relancé en entier : 649 tests / 644 pass / 0 fail / 0
      cancelled / 5 skipped (vs 636/8/0/5 avant correctif).
    detecte_le: "2026-07-28"
    source: >
      npm run test:unit --workspace server, session du 2026-07-28, après
      application de la migration 20260728080000_service_request_project_service_id
      (SEC-004) qui a rendu ServiceRequest.projectId une colonne réelle en
      base — ces 4 tests échouaient déjà auparavant mais silencieusement
      masqués par l'absence de la colonne (le create() plantait avant
      d'atteindre la vérification projectId). Lecture directe de
      server/test/serviceRequestService.test.ts ligne 171 :
      `const req = await makeRequest(client.id, "transition valid");` —
      comparé à la signature `async function makeRequest(clientId: string,
      projectId: string, title: string)` ligne 66.
    confiance: haute
    note: >
      Distinct de SEC-004 (déjà resolu) : le code produit
      (serviceRequestService.createServiceRequest) est correct et rejette
      à raison un projectId invalide — c'est l'appel du test qui est
      malformé, pas la vérification qu'il déclenche. Aucune modification
      de test appliquée dans cette session (cf. CLAUDE.md, un test rouge
      est une hypothèse sur le code, pas un défaut du test par défaut —
      ici l'hypothèse a été vérifiée et écartée en faveur du test).

  - id: SEC-013
    titre: >
      2 tests écrits pour SEC-004 (exact scope ServiceRequest) sont
      incohérents avec le code qu'ils testent : serviceRequestService.test.ts
      teste un scope "no access" avec le même serviceId que celui du projet
      créé (self-contradictoire) ; searchScope.test.ts crée un ServiceRequest
      sans projectId alors que search.repository.ts scope désormais par
      serviceId/project.serviceId exact (l'un des deux doit être renseigné
      pour matcher)
    perimetre: 4.6-portail-client
    regle_violee: >
      Aucune règle métier violée — bugs de fixture de test, découverts une
      fois la migration SEC-004 réellement appliquée (auparavant la colonne
      n'existant pas en base, ces tests échouaient pour une raison
      différente et non diagnostiquée : "Project not found"/erreur de
      colonne manquante masquait le vrai défaut de fixture).
    classe: bug-fixture-test
    gravite: mineure
    statut: resolu
    critere_de_resolution: >
      (a) server/test/serviceRequestService.test.ts, test "a manager cannot
      read a service request whose client has no project in the manager's
      service (404, not leaked)" (ligne 85-98) : le projet créé est dans
      serviceIdB (ligne 87) et le scope testé est aussi serviceIdB (ligne
      91) — même pôle, donc l'accès doit réussir, pas être rejeté. Le test
      doit soit scoper avec serviceIdA (cas réellement "hors pôle"), soit
      son assertion doit devenir assert.equal(found.id, req.id) si
      l'intention était de coupler ce test à un scénario déjà couvert par
      un autre test du même describe. Corrigé : userServiceId passe à
      serviceIdA (cas hors pôle réel), même correction appliquée par
      cohérence au test "deleteServiceRequest enforces the same scope..."
      (ligne 115-131, même bug, même origine) même s'il n'était pas dans la
      liste initiale des 8 échecs.
      (b) server/test/searchScope.test.ts, test "a MANAGER only finds
      projects/invoices/serviceRequests/approvals from their own pole"
      (ligne 115+) : prisma.serviceRequest.create (ligne 130-131) ne fixe
      ni projectId ni serviceId — avec le scope exact désormais en place
      (search.repository.ts:85-92, OR sur serviceId/project.serviceId), la
      ServiceRequest ne peut matcher aucun manager. Le create doit passer
      projectId: project.id (le projet du bon pôle déjà créé ligne 122) et
      otherPoleServiceRequest doit recevoir otherPoleProject.id, pour que
      la comparaison own-pole / cross-pole redevienne significative.
      Corrigé : les deux create() reçoivent désormais projectId et
      serviceId cohérents avec leur pôle réel ; commentaire obsolète
      (« client-projects.some.serviceId ») mis à jour pour ne plus décrire
      que le scope d'Approval, qui utilise encore ce mécanisme. npm run
      test:unit --workspace server relancé en entier : 649 tests / 644
      pass / 0 fail / 0 cancelled / 5 skipped (vs 636/8/0/5 avant
      correctif).
    detecte_le: "2026-07-28"
    source: >
      npm run test:unit --workspace server, session du 2026-07-28, après
      application de la migration SEC-004
      (20260728080000_service_request_project_service_id). Lecture directe
      de server/src/repositories/serviceRequest.repository.ts#findById
      (ligne 131-137, OR exact sur serviceId/project.serviceId) et
      server/src/repositories/search.repository.ts (ligne 85-92, même
      logique) confirmant que le code produit applique bien le scope exact
      annoncé par SEC-004 — les 2 tests ci-dessus ne sont pas alignés sur ce
      comportement.
    confiance: haute
    note: >
      Aucune modification de test ni de code appliquée dans cette session
      sur ce point — seul le symptôme exact et sa cause précise (fixture
      incohérente avec le scope exact déjà implémenté) sont enregistrés,
      cf. CLAUDE.md.

  - id: SEC-014
    titre: >
      ApprovalsClientPage.tsx (approbation client, RG-026 Niveau 2)
      réimplémente localement le contrat de confirmation renforcée au lieu
      d'utiliser le composant partagé ConfirmationDialog.tsx utilisé par
      les 6 autres actions Niveau 2
    perimetre: 4.6-portail-client
    regle_violee: >
      RG-026 (niveaux de confirmation UX) cite explicitement
      ApprovalsClientPage.tsx comme l'une des 7 actions classées Niveau 2
      (« liste fermée »), au même titre que les 6 autres qui utilisent
      toutes le composant partagé ConfirmationDialog.tsx
      (client/src/components/shared/crud/ConfirmationDialog.tsx, dont le
      commentaire de tête cite RG-026 comme raison d'être). Ce n'est pas
      une violation du contrat fonctionnel Niveau 2 lui-même (checkbox
      obligatoire, description séparée du libellé de la case, bouton
      désactivé tant que non cochée — les trois exigences sont bien
      respectées dans ApprovalsClientPage.tsx), mais une divergence
      d'implémentation par rapport au modèle que la règle établit pour les
      6 autres cas.
    classe: incoherence-factorisation-ui
    gravite: mineure
    statut: en_cours
    critere_de_resolution: >
      ApprovalsClientPage.tsx utilise le composant partagé
      ConfirmationDialog.tsx pour son dialogue d'approbation, au lieu de
      sa réimplémentation locale actuelle (Dialog + Checkbox + Textarea
      dans le même fichier, lignes ~168-249) — décision de refactor
      pure, à confirmer avec le porteur avant d'y toucher (le fichier
      gère aussi les actions reject/comment dans le même Dialog, qui ne
      sont pas Niveau 2 : la refonte doit isoler proprement le seul cas
      approve sans casser reject/comment).
    detecte_le: "2026-07-28"
    source: >
      Lecture directe intégrale des 7 fichiers cités par RG-026
      (InvoicesPage.tsx, CommissionsPage.tsx, BookingAdminPage.tsx,
      ServiceRequestsAdminPage.tsx, ProposalsClientPage.tsx,
      ApprovalsClientPage.tsx, ClientOnboardingPage.tsx) et de
      ConfirmationDialog.tsx, session du 2026-07-28, en réponse à une
      demande explicite du porteur du projet de vérifier si RG-026 est
      réellement codée. 6 des 7 fichiers importent et utilisent
      ConfirmationDialog ; ApprovalsClientPage.tsx (lignes 168-249)
      construit son propre Dialog avec Checkbox inline au lieu de
      l'importer.
    confiance: haute
    note: >
      Le comportement utilisateur final n'est pas dégradé (mêmes
      garanties de confirmation renforcée) — l'anomalie porte sur la
      cohérence de factorisation attendue par la formulation de RG-026
      elle-même, pas sur une brèche de protection.

      Corrigé (session du 2026-07-30) : le cas approve est désormais isolé
      dans son propre state (approveTarget) et rendu via
      <ConfirmationDialog>, suivant exactement le pattern déjà utilisé par
      ProposalsClientPage.tsx (même dossier client-portal). reject/comment
      restent dans le Dialog générique existant (Niveau 1, inchangés).
      RespondAction réduit à "reject" | "comment" ; la mutation respond
      élargit son type d'action à RespondAction | "approve" pour continuer
      d'accepter les 3 valeurs envoyées au serveur. Vérifié : tsc --noEmit
      et npm run lint (client) tous deux propres (0 error, les 11 warnings
      react-refresh déjà documentés comme exception acceptée, aucun
      nouveau). Serveur + client démarrés manuellement, route /auth/login
      vérifiée fonctionnelle. Pas de test e2e dédié écrit (aucun n'existait
      avant pour ce flux Approval — disproportionné pour une pure
      refactorisation de cohérence UI sans changement de contrat
      fonctionnel). Statut laissé à en_cours : correctif écrit et vérifié
      localement mais pas encore commité/vérifié en CI.
