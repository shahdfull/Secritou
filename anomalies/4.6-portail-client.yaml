anomalies:
  - id: SEC-002
    titre: Activation du portail client non alignée sur le paiement de la 1re tranche
    perimetre: 4.6 Portail client
    categorie: G
    regle_violee: RG-018
    classe: null
    gravite: majeur
    statut: resolu
    critere_de_resolution: |
      C'est résolu quand l'invitation du compte client / l'activation du portail (portalActivatedAt) est déclenchée uniquement par le passage de la facture d'acompte à PAID (addPayment), et non plus à l'acceptation de la proposition — OU quand une décision produit explicite documente que le comportement actuel (activation à l'acceptation) est le comportement voulu, auquel cas RG-018 doit être mise à jour dans REFERENTIEL.md en conséquence (et cette entrée passée à statut: rejete avec la référence à cette décision).
    detecte_le: '2026-07-15'
    source: audit_llm
    confiance: a_confirmer
    note: |
      Le cahier des charges du site (Secritou_CahierDesCharges_Site.docx, document historique — voir REFERENTIEL.md §0) prévoit explicitement : "paiement de la 1re tranche = ouverture de l'espace client". Le comportement observé de acceptWithCascade (proposal.service.ts, session du 2026-07-15 : invitation du client envoyée immédiatement à l'acceptation de la proposition, avant tout paiement) provient d'une lecture directe de ce fichier cette session-là — mais le rapprochement avec la règle du CDC lui-même a été fait via un audit antérieur (round5-report.md, document historique), non revérifié ligne à ligne contre le CDC directement. confiance: a_confirmer reflète cette partie non revérifiée du rapprochement, pas le comportement du code lui-même.
      DÉCOUVERTE COMPLÉMENTAIRE avant correction, session du 2026-07-17 : le portail n'était PAS ouvert sans garde comme le laissait supposer une lecture rapide — `requireActivatedPortal` (server/src/middlewares/rbac.middleware.ts:23-46) existe déjà et bloque bien l'accès aux données du portail (8 fichiers de routes : approval, client, clientOnboarding, clientPortal, document, project, serviceRequest, summary) tant que `Client.portalActivatedAt` est null — commentaire du code confirmant l'intention : « A CLIENT account can exist and log in beforehand [...] but every portal data route must be gated behind this check ». Le vrai défaut, plus étroit que le titre ne le suggère : le COMPTE (email + mot de passe temporaire) était créé et envoyé dès l'acceptation, avant tout paiement — le client pouvait se connecter mais tombait sur un mur 403 (`PORTAL_NOT_ACTIVATED`). Confirmé au porteur du projet avant de choisir entre « garder ce design (compte tôt + gate) » et « retarder aussi le compte » — décision : retarder le compte.
      CORRECTIF ÉCRIT ET VÉRIFIÉ, session du 2026-07-17 : `proposal.service.ts#acceptWithCascade` n'appelle plus `clientService.inviteClientUser` (import retiré, devenu inutilisé). `invoice.service.ts#addPayment` l'appelle désormais, post-commit, uniquement quand la transaction vient de faire passer `Client.portalActivatedAt` de `null` à une date réelle (nouveau flag `justActivatedPortal`, dérivé du `count` réel de l'`updateMany` idempotent existant — pas une re-dérivation de la condition `newStatus === "PAID" && invoiceType === "DEPOSIT"`, pour ne jamais ré-inviter sur un paiement ultérieur d'un client déjà activé). 409 (compte déjà existant) avalé, même comportement qu'avant au même endroit logique. `acceptWithCascade` retourne toujours `clientInvited` dans sa réponse (type/i18n client inchangés) mais toujours `false` désormais — le toast `proposals.acceptCascade.clientInvited` côté client ne s'affichera donc simplement plus jamais à ce moment, sans erreur, laissé tel quel (hors du périmètre de cette décision).
      Nouveau test `server/test/portalActivationOnPayment.test.ts` (câblé dans `test/run-all.test.ts`), appelle réellement `acceptWithCascade` ET `addPayment` contre une base migrée — pas une réimplémentation (contrairement à `proposalAcceptCascade.test.ts`, qui mocke tout dans un « monde » local et n'aurait PAS détecté cette régression : vérifié en confirmant que la suite complète restait 264/264 même avant ce correctif). 3 cas : accepter ne crée aucun `User` ; payer intégralement l'acompte crée exactement un `User` (role CLIENT, mustChangePassword true) ET active le portail ; un second paiement sur un client déjà activé ne crée pas de doublon.
      BUG D'INFRASTRUCTURE DE TEST TROUVÉ ET CORRIGÉ EN COURS DE ROUTE, même session : ce nouveau fichier est le premier de toute la suite à déclencher pour de vrai `invalidateFinanceCaches` (cache/redis.ts, client Redis du package `redis`, distinct du client `ioredis` de BullMQ que `run-all.test.ts` ferme déjà) — laissé ouvert, il maintenait le process Node vivant ~40s après la fin réelle des tests (3.5s), jusqu'à ce que `node --test` le tue lui-même et rapporte faussement le fichier entier en échec. Diagnostiqué par isolation progressive (base → 3 fichiers → 1 fichier → inspection de `pg_stat_activity`, qui a exclu un verrou DB réel : toutes les connexions étaient `idle`/`ClientRead`, pas bloquées). Corrigé par l'ajout de `closeRedisClient()` dans le hook `after()` de ce fichier spécifiquement (pas dans `run-all.test.ts` — ce fichier est le seul à en avoir besoin pour l'instant, un futur fichier qui toucherait aussi le cache devra faire de même ou ce sera à généraliser). Suite complète reconfirmée à 267/267 (264 + 3 nouveaux), exécutée deux fois de suite, ~16-19s à chaque fois — retour à la vitesse normale.
      `npm run typecheck --workspace server` vert (0 erreur).
      Correctif poussé sur origin/main, session du 2026-07-17 (hash à renseigner au commit). `resolu` déclaré SANS confirmation CI — dérogation explicite à la règle commit+CI de CLAUDE.md, cohérente avec la dérogation déjà établie par le porteur du projet dans cette même session (« no make it resolu »). Comme les autres correctifs de cette session portant un vrai nouveau test appelant le code réel, le critère textuel exact (activation uniquement via addPayment) est satisfait indépendamment de la dérogation CI.
  - id: SEC-091
    titre: 'Portail client : chaque carte projet declenche 2 requetes independantes (timeline avec polling 30s + taches terminees), motif N+1 qui s''aggrave avec le nombre de projets d''un client'
    perimetre: 4.2 Gestion de projet, 4.6 Portail client — client/src/features/client-portal/ProjectsClientPage.tsx, client/src/features/client-portal/components/ProjectTimeline.tsx, client/src/features/client-portal/components/CompletedTasksList.tsx
    categorie: C
    regle_violee: null
    classe: null
    gravite: mineur
    statut: resolu
    critere_de_resolution: |
      Sera résolu par la consolidation des requêtes par carte (batch côté serveur ou désactivation du polling au-delà d'un certain nombre de projets affichés), si le volume de projets par client le justifie un jour.
    detecte_le: '2026-07-20'
    source: audit_llm
    confiance: certain
    note: |
      Audit exhaustif du module Gestion de Projets, confirmé par lecture directe. `ProjectsClientPage.tsx` rend une `ProjectTimeline` (polling `refetchInterval: 30_000`) et une `CompletedTasksList` par carte projet — N projets = 2×N requêtes actives, dont N qui repollent en continu. En pratique un client a peu de projets actifs simultanés, donc impact réel faible à ce stade ; non corrigé cette passe (décision du porteur : gravité mineure, effort moyen, pas de symptôme réel observé — reste `ouvert` pour suivi si le volume de projets par client augmente). Champ `statut` corrigé de `resolu` à `en_cours` (session du 2026-07-22) : la note ci-dessus documentait déjà explicitement « non corrigé cette passe », un statut `resolu` sans correctif associé était une incohérence du champ, pas un fait nouveau.
      Depuis (SEC-116, session antérieure) : `ProjectTimeline` n'est plus montée inconditionnellement pour chaque carte — montage paresseux via `IntersectionObserver` (`LazyProjectTimeline` dans `ProjectsClientPage.tsx`). Cela réduit le nombre de pollers actifs simultanés à ceux réellement visibles, mais ne change ni le nombre de requêtes par carte visible (toujours 2), ni la fréquence de polling elle-même — les deux volets restaient entiers.
      RÉSOLU PARTIELLEMENT (session du 2026-07-22, décision explicite du porteur) : fusionner les 2 endpoints (timeline synthétique en 7 étapes vs liste réelle des tâches terminées) inverserait une décision architecturale déjà prise et documentée (SEC-061 : routes délibérément séparées, la timeline résume tandis que `completed-tasks` renvoie de vraies lignes de tâches CLIENT-only) — non retenu pour ne pas défaire ce choix sans nouvelle instruction. `CompletedTasksList` n'a d'ailleurs déjà aucun polling (`useProjectCompletedTasks` : `staleTime` seul, pas de `refetchInterval`) ; seule `ProjectTimeline` repolle en continu. Le porteur a choisi d'espacer ce polling plutôt que de fusionner : `refetchInterval` de `useProjectTimeline` relevé de 30s à 120s (`ProjectTimeline.tsx`). Les 2 requêtes distinctes par carte au premier rendu restent inchangées (chacune sert une donnée réellement différente, pas une duplication), seule la répétition dans le temps de l'une des deux est réduite d'un facteur 4. `npx tsc --noEmit` (client) vert. Laissé `en_cours` plutôt que `resolu` : correctif non encore committé.
      RÉSOLU (session du 2026-07-23, sur demande explicite du porteur de traiter ce dernier point) : décision explicite du porteur (AskUserQuestion) — batcher les 2 endpoints en 1 seul appel HTTP plutôt que documenter comme non prioritaire ou plafonner le nombre de pollers. Les 2 endpoints restent logiquement distincts (décision SEC-061 non rouverte) — seul le TRANSPORT est groupé, pas la donnée elle-même.
      Côté serveur : nouvelle méthode `projectService.getPortalSummaries(ids, clientId)` (project.service.ts) qui appelle en interne les DEUX méthodes déjà existantes (`getTimelineStatus`, `getCompletedTasksForClient`) pour chaque id, via `Promise.allSettled` (pas `Promise.all`) — un id appartenant à un autre client ou inexistant est silencieusement omis du résultat plutôt que de faire échouer tout le lot (même propriété de sécurité que les 2 endpoints d'origine, qui 404ent chacun individuellement). Nouvelle route CLIENT-only `GET /projects/my/summaries?ids=...` (project.routes.ts), validée par un nouveau schéma Zod (`getPortalSummariesSchema`, project.validator.ts — jusqu'à 100 ids, plafond identique à `/projects/my`).
      Côté client : point important vérifié AVANT d'implémenter — un batch naïf demandant TOUS les projectId dès le chargement de la page aurait cassé la garantie déjà testée sous SEC-116 (montage paresseux via IntersectionObserver, aucune requête tant qu'une carte n'est pas visible). Résolu en conciliant les deux : chaque carte continue de signaler sa propre visibilité au parent (`LazyProjectCard`, ex-`LazyProjectTimeline`, renommé car il enveloppe maintenant 2 enfants) ; le parent (`ProjectsClientPage.tsx`) accumule les ids devenus visibles dans un état `visibleIds`, et un seul hook `usePortalSummaries` (nouveau fichier `hooks/usePortalSummaries.ts`) bat ces ids en un seul appel — jamais plus qu'un appel pour l'ensemble des cartes déjà visibles à un instant donné, jamais un appel pour une carte hors écran. `ProjectTimeline.tsx` et `CompletedTasksList.tsx` ne font plus leur propre requête réseau : ils reçoivent `steps`/`tasks`/`isLoading` en props depuis le résultat batché du parent. Le hook `useProjectCompletedTasks.ts` (devenu mort) est supprimé. Cadence de polling inchangée (120s, déjà élargie depuis 30s dans une passe antérieure de ce même correctif), maintenant partagée par tous les cards visibles au lieu d'un poller par carte.
      Preuve par test réel : `server/test/projectPortalSummaries.test.ts` (nouveau fichier) — appelle le vrai `projectService.getPortalSummaries` contre une vraie base, confirme le batch multi-projets ET la propriété de sécurité (un projet d'un autre client est omis, pas une erreur qui casse tout le lot). `client/src/features/client-portal/ ProjectsClientPage.test.tsx` (réécrit) : confirme qu'aucun appel `/projects/my/summaries` ne part avant qu'une carte devienne visible (préserve SEC-116), puis qu'un seul appel groupé part pour 2 cartes devenues visibles (pas 2 appels séparés) — `getMock.mock.calls.filter(...).length === 1`, pas une assertion de surface. `client/src/features/client-portal/components/ CompletedTasksList.test.tsx` (réécrit) : composant testé en isolation via ses nouvelles props, sans mock réseau (il n'en fait plus). `npx tsc --noEmit` et `npm run lint --workspace=server`/ `--workspace=client` vérifiés propres (11 warnings côté client, au lieu des 12 exceptions documentées — `ProjectTimeline.tsx` a perdu son export `useProjectTimeline`, une des 12 occurrences react-refresh disparaît naturellement, pas une régression). Suite complète client (`npm run test --workspace=client`) : 125/125 vertes en local. Non exécuté contre une vraie base au moment de ce commit pour le nouveau test serveur : Docker local indisponible — poussé sans confirmation locale, la CI fera foi. Décision consignée dans REFERENTIEL.md §7.
      CONFIRMÉ (2026-07-23) : `npx playwright test --reporter=list` vert sur le commit `e6fcb7c` (« green », après le correctif SEC-218 sur ce même run) — le scénario e2e du portail client (`client-approval.spec.ts`), qui exerce directement le chemin `LazyProjectCard`/`usePortalSummaries` introduit par ce correctif, passe réellement en conditions réelles (navigateur + serveur + base), pas seulement en test unitaire mocké.
  - id: SEC-111
    titre: ServiceRequest.priority et ServiceRequest.type sans index alors que les deux sont utilisés comme filtre WHERE (et priority comme tri) dans serviceRequest.repository.ts
    perimetre: schema.prisma — model ServiceRequest ; server/src/repositories/serviceRequest.repository.ts
    categorie: B
    regle_violee: null
    classe: index_manquant_colonne_filtree
    gravite: mineur
    statut: resolu
    critere_de_resolution: |
      C'est résolu quand `schema.prisma#ServiceRequest` porte `@@index([priority])` et `@@index([type])` (ou un index composite couvrant les deux avec `status`/`createdAt` selon le plan de requête réel), qu'une migration Prisma correspondante est commitée, et qu'un `EXPLAIN` sur la requête de `serviceRequest.repository.ts` filtrée par `priority` et/ou `type` ne montre plus de `Seq Scan` sur une base de taille représentative.
    detecte_le: '2026-07-20'
    source: audit_llm
    confiance: certain
    note: |
      Vérifié par lecture directe : `schema.prisma:450-473` — `ServiceRequest` a des index sur `clientId`, `status`, `createdAt`, `status+createdAt`, `assignedToId`, mais aucun sur `priority` ni `type`. `server/src/repositories/serviceRequest.repository.ts:8` liste `priority` dans `SORTABLE_FIELDS` ; lignes 106-107, `priority` et `type` sont tous deux appliqués comme filtre `where` conditionnel (`...(options.priority ? { priority: options.priority } : {})`, `...(options.type ? { type: options.type } : {})`) — donc les deux colonnes sont bien exercées par du code réel, pas un risque théorique. Gravité `mineur` : 0 client actif à ce jour, aucune requête lente constatée — reflète l'absence d'impact prouvé aujourd'hui, pas une minimisation du risque à l'échelle (le volume de `ServiceRequest` croît avec l'activité commerciale, contrairement à SEC-113).
      RÉSOLU (session en cours) : `@@index([priority])` et `@@index([type])` ajoutés à `schema.prisma#ServiceRequest`, migration `20260721020000_index_cleanup_and_time_entry_invoice_fk` (batch couvrant aussi SEC-112/113/166/167), appliquée sur la base de dev réelle. Preuve par test réel (`server/test/schemaIndexCleanupAndTimeEntryFk.test.ts`) : requête `pg_indexes` confirmant `ServiceRequest_priority_idx` et `ServiceRequest_type_idx` existent réellement en base, pas seulement dans le schéma. `npx tsc --noEmit` et `npm run lint --workspace=server` verts, suite complète verte (505 tests). Dérogation CI déjà accordée par l'utilisateur pour cette session : `resolu` malgré l'absence de run CI vert sur ce commit précis.
  - id: SEC-116
    titre: ProjectsClientPage monte un ProjectTimeline (polling 30s) par carte projet — le coût de polling devient (nb clients actifs) × (nb projets affichés) × 2 req/min, sans limite de cartes ni lazy-mount
    perimetre: 4.6 Portail client — client/src/features/client-portal/ProjectsClientPage.tsx, client/src/features/client-portal/components/ProjectTimeline.tsx
    categorie: C
    regle_violee: null
    classe: null
    gravite: mineur
    statut: resolu
    critere_de_resolution: |
      C'est résolu quand le nombre de requêtes de polling simultanées sur cette page est borné indépendamment du nombre de projets du client (ex. timeline montée seulement pour la carte visible/dépliée, ou requête de statut mutualisée pour toute la page au lieu d'une par carte) — prouvé par un test qui rend la page avec N projets et vérifie qu'au plus un nombre borné de requêtes de timeline est déclenché, pas N.
    detecte_le: '2026-07-20'
    source: manuel
    confiance: certain
    note: |
      Constat transmis directement par le porteur (liens fichier/ligne), vérifié par lecture directe : `ProjectsClientPage.tsx:44` (`useMyProjects` charge `pageSize: 100`), ligne 190 (`<ProjectTimeline projectId={project.id} />` monté sans condition pour CHAQUE élément de `projects.map(...)`) ; `ProjectTimeline.tsx:18` (`useProjectTimeline` — `refetchInterval: 30_000`, aucune limite au nombre d'instances). Avec jusqu'à 100 projets affichés par client et un polling de 30s par instance montée, le coût de polling total croît linéairement avec le nombre de projets par client ET le nombre de clients connectés simultanément, sans aucun plafond.
      CORRECTIF ÉCRIT ET VÉRIFIÉ, session du 2026-07-20 : nouveau composant `LazyProjectTimeline` dans `ProjectsClientPage.tsx` — encapsule `ProjectTimeline` derrière un `IntersectionObserver` (`rootMargin: "200px"`), ne montant le vrai composant (donc ne démarrant son polling 30s) que lorsque sa carte devient visible dans le viewport ; une fois visible, reste monté (pas de démontage au défilement, pour ne pas jeter le cache React Query utile et re-déclencher un refetch inutile au retour). Preuve : nouveau fichier `client/src/features/client-portal/ProjectsClientPage.test.tsx` (2 cas, rendu réel de la page, `IntersectionObserver` mocké pour contrôler la visibilité) — aucun appel à `getTimelineStatus` avant qu'une carte ne devienne visible, puis appel réel dès qu'elle le devient. Vérification complète client : `npx tsc --noEmit` (propre sur les fichiers de ce périmètre — un fichier D'UNE AUTRE SESSION CONCURRENTE, `ServiceRequestsAdminPage.tsx`, casse le typecheck global et `npm run build`/`node scripts/check-i18n.mjs` au moment de cette vérification, non lié à ce correctif, non touché par cette session), `npx vitest run` (100/100, stable sur 2 exécutions), `npm run lint` (12 warnings — exception SEC-049, stable). Résolu SANS confirmation CI (workflow GitHub Actions sur `origin/main` en `workflow_dispatch` uniquement, déviation documentée depuis la session du 2026-07-17).
  - id: SEC-117
    titre: 'useProjectTimeline (client-portal) ne suspend jamais son polling 30s quand l''onglet est masqué — pas de garde Page Visibility API — CONSTAT INFIRMÉ : le comportement demandé existe déjà nativement dans React Query v5'
    perimetre: 4.6 Portail client — client/src/features/client-portal/components/ProjectTimeline.tsx
    categorie: F
    regle_violee: null
    classe: null
    gravite: mineur
    statut: rejete
    critere_de_resolution: |
      Non applicable — vérification du code source de la librairie (`node_modules/@tanstack/query-core/build/modern/queryObserver.js:215`, `if (this.options.refetchIntervalInBackground || focusManager.isFocused())`) confirme que `refetchInterval` de React Query v5 est DÉJÀ conditionné par défaut à `focusManager.isFocused()` (`focusManager.js:59`, `globalThis.document?.visibilityState !== "hidden"`, câblé sur l'event `visibilitychange`) — sauf si l'appelant passe explicitement `refetchIntervalInBackground: true`, ce qu'aucun code de ce dépôt ne fait (`grep -rn "refetchIntervalInBackground" client/src/` : zéro résultat). Le polling de `useProjectTimeline` s'arrête donc déjà quand l'onglet est masqué, sans code supplémentaire requis.
    detecte_le: '2026-07-20'
    source: manuel
    confiance: certain
    note: |
      Constat transmis directement par le porteur, vérifié par lecture directe : `ProjectTimeline.tsx:14-20` (`useProjectTimeline`) — `refetchInterval: 30_000`, effectivement sans option `refetchIntervalInBackground` explicite. Le rapport source en déduisait une absence de garde de visibilité — vérification du comportement RÉEL de la librairie (pas seulement du code applicatif) demandée par la procédure d'audit avant toute correction : la garde existe déjà, nativement, côté `@tanstack/query-core` (`refetchIntervalInBackground` par défaut `undefined`/falsy → branche `focusManager.isFocused()` seule évaluée). Confirmé également par `queryClient.ts` (aucune option globale `refetchIntervalInBackground: true` dans `defaultOptions`). Statut `rejete` plutôt que `ouvert` : il n'y a rien à corriger dans le code applicatif, le comportement demandé est déjà celui observé. Aucun test dédié ajouté — un test de ce comportement testerait la librairie elle-même, pas du code de ce dépôt.
  - id: SEC-163
    titre: 'client/src/features/client-portal/ClientBriefPage.tsx contient du texte mojibake (UTF-8 réinterprété en Latin-1 : « problÃ¨me », « rÃ©fÃ©rence », « pÃ´le ») — bloque actuellement npm run lint --workspace client (no-irregular-whitespace, ligne 257), empêchant tout commit propre sur ce workspace tant que non corrigé'
    perimetre: client/src/features/client-portal/ClientBriefPage.tsx:254,257
    categorie: B
    regle_violee: null
    classe: null
    gravite: majeur
    statut: resolu
    critere_de_resolution: |
      C'est résolu quand un utilisateur CLIENT consultant cette page voit du français correctement accentué (pas de séquences « Ã© »/« Ã¨ »/« Ã´ »), et quand `npm run lint --workspace client` passe à 0 erreur/0 warning sur ce fichier.
    detecte_le: '2026-07-20'
    source: audit_llm
    confiance: certain
    note: |
      Découvert incidemment en vérifiant l'état du dépôt pendant le ré-audit de SEC-156/SEC-160 (`npm run lint --workspace client` lancé pour confirmer qu'un correctif tiers n'avait rien cassé). Lecture directe : lignes 254 et 257 de `ClientBriefPage.tsx` contiennent « Si le problÃ¨me persiste... » et « Ces rÃ©ponses servent... pour le pÃ´le concernÃ© » — motif classique de double-encodage (bytes UTF-8 d'un caractère accentué réinterprétés comme Latin-1/Windows-1252 puis ré-encodés). Bloque `eslint` (`no-irregular-whitespace`, ligne 257) avec code de sortie 1 — CLAUDE.md exige `npm run lint` totalement propre sur les deux workspaces avant tout commit (SEC-049), donc AUCUN commit n'est possible actuellement tant que ce fichier n'est pas corrigé, y compris pour livrer les correctifs SEC-156/SEC-160 par ailleurs déjà écrits dans le même working tree.
      Non attribuable à une session précise : `git status` montre la quasi totalité du dépôt comme modifiée (probablement une différence de fin de ligne entre l'environnement d'origine et ce sandbox Linux, pas un contenu réellement changé fichier par fichier), donc impossible de dater l'introduction de ce mojibake par une simple lecture de diff depuis cette session — signalé tel quel, sans cause inventée.
      RÉSOLU (session en cours) : lecture des octets bruts du fichier (`xxd`) a révélé que le mojibake n'était pas uniforme — certaines occurrences (ligne 257 notamment) étaient un DOUBLE ré-encodage (`c3 83 c2 a9` au lieu de `c3 a9` pour un é), pas le simple ré-encodage Latin-1 décrit dans le titre d'origine ; un remplacement texte naïf sur ces lignes ne matchait pas byte-à-byte. Corrigé les 9 occurrences (lignes 141, 160, 190, 193, 195, 217, 254, 257, 318, 348, 355, 361, 375, 404, 413) par réécriture directe de chaque ligne en UTF-8 correct (accents français propres, tirets/points de suspension typographiques). Vérifié par grep final sur tout le fichier (`Ã`/ `â€`/`Â`) : zéro résultat restant. Vérifié par `npx eslint src/features/client-portal/ClientBriefPage.tsx` depuis `client/` : sortie vide, code de sortie 0 — 0 erreur/0 warning sur ce fichier précis, satisfaisant le second volet du critère de résolution. Fix produit par mes propres appels d'outils dans cette session. Dérogation CI déjà accordée par l'utilisateur pour cette session : `resolu` malgré l'absence de run CI vert sur ce commit précis — le lint local ciblé est vert, `npm run lint --workspace client` complet sera revérifié dans le lot de vérification final de cette passe.
  - id: SEC-164
    titre: 'Migration 20260625230000_remove_commented_approval_status réécrit silencieusement l''historique : UPDATE "ApprovalTimeline" SET "status" = ''PENDING'' WHERE "status"::text = ''COMMENTED'' falsifie toute ligne d''audit historique qui valait réellement COMMENTED au moment des faits — ApprovalTimeline est un journal d''audit (mêmes rôle que ProposalHistory), pas un état courant qu''on peut réécrire'
    perimetre: server/prisma/migrations/20260625230000_remove_commented_approval_status/migration.sql ; schema.prisma#ApprovalTimeline
    categorie: B
    regle_violee: null
    classe: null
    gravite: bloquant
    statut: resolu
    critere_de_resolution: |
      C'est résolu quand on peut affirmer, pour toute base ayant réellement exécuté cette migration avec des lignes ApprovalTimeline.status = 'COMMENTED' préexistantes, que la valeur d'origine reste retrouvable quelque part (colonne de sauvegarde, table d'archive, ou preuve que la migration n'a jamais rencontré de ligne COMMENTED en production/dev partagé) — vérifié en interrogeant la base réelle pour compter les lignes affectées au moment de l'exécution, pas en relisant seulement le SQL de la migration.
    detecte_le: '2026-07-20'
    source: audit_llm
    confiance: certain
    note: |
      Audit architecture base de données, lecture intégrale des 42 migrations. Lecture directe de `20260625230000_remove_commented_approval_status/migration.sql` : la migration retire la valeur `COMMENTED` de l'enum `ApprovalStatus` (recréation de type, lignes 12-19) et, avant de le faire, ligne 16 : `UPDATE "ApprovalTimeline" SET "status" = 'PENDING' WHERE "status"::text = 'COMMENTED'`. `ApprovalTimeline` est un modèle d'historique/journal (`schema.prisma:1184-1197`, commentaire "Approval Center" — même rôle que `ProposalHistory` : une ligne par événement passé, jamais mise à jour après coup dans le code applicatif, seulement `create()` — vérifié par grep : aucun `approvalTimelineRepository.update` ni `prisma.approvalTimeline.update` nulle part dans `server/src/`). Réécrire `status` sur des lignes existantes transforme donc un journal d'événements passés en une version falsifiée de ce journal : une ligne qui disait « commentaire ajouté à telle date » dit désormais « en attente », ce qui n'a jamais été vrai à cette date précise — perte d'information irréversible si des lignes COMMENTED existaient réellement au moment de l'exécution (non vérifié dans cette passe : pas d'accès à une base ayant exécuté cette migration avec des données réelles ; le commentaire en tête du fichier suggère un existant `PENDING` par défaut au niveau colonne, donc l'ampleur réelle dépend de l'usage passé de la valeur COMMENTED avant sa suppression, non mesurable depuis le SQL seul).
      Distinct de SEC-115 (déjà enregistré : `20260711183136_sync_schema_drift` contient un `ALTER INDEX ... RENAME` non strictement additive) — ici le problème n'est pas la stratégie additive-only au sens schéma, mais la perte/falsification de données métier dans une migration qui s'exécute par ailleurs correctement.
      RÉSOLU : requête directe sur la base de dev réelle (migrée) — `SELECT status, count(*) FROM "ApprovalTimeline" GROUP BY status` renvoie exactement `{PENDING: 5, APPROVED: 1}`, zéro ligne `COMMENTED`, et correspond exactement aux 6 lignes du seed (`server/prisma/seed.ts:852-859`). Plus important : grep exhaustif de `server/src` confirme qu'il n'existe qu'un seul point d'écriture vers `ApprovalTimeline.status`, `approval.service.ts:189` — `approvalRepository.addTimeline(id, { action: "COMMENTED", comment, status: approval.status, userId })` — qui écrit toujours le statut COURANT de l'Approval (`PENDING`/`APPROVED`/`REJECTED`) dans la colonne `status`, et la chaîne littérale `"COMMENTED"` dans la colonne `action` (distincte). Le seed applique le même patron ligne 856/858 : `action: 'COMMENTED', status: 'PENDING'`, jamais `status: 'COMMENTED'`. Autrement dit, malgré la présence de `COMMENTED` dans l'enum `ApprovalStatus` depuis la toute première migration (`20260625150326_init/migration.sql:50`), aucun chemin de code applicatif n'a jamais écrit cette valeur dans la colonne `status` de `ApprovalTimeline` — seulement dans `action`, une colonne `VARCHAR` libre non affectée par le changement d'enum. Le `UPDATE ... WHERE status = 'COMMENTED'` de la migration incriminée était donc, dans les faits, une opération sur zéro ligne dans toute base peuplée exclusivement via le code applicatif ou le seed — le risque décrit (falsification d'un historique COMMENTED réel) n'a jamais pu se matérialiser, faute d'écrivain produisant cette valeur. Le critère de résolution ("interroger la base réelle pour compter les lignes affectées") est donc satisfait par une valeur de zéro constatée, pas supposée. Aucun changement de code nécessaire. Dérogation CI déjà accordée par l'utilisateur pour cette session : `resolu` malgré l'absence de run CI vert sur ce commit précis (ici, la vérification elle-même n'a modifié aucun fichier de code — seule ANOMALIES.yaml change).
  - id: SEC-188
    titre: 'invoice.service.ts#addPayment : le paiement est déjà commité (statut PAID, portalActivatedAt posé) quand l''invite client post-commit s''exécute ; si inviteClientUser échoue pour une raison autre que 409 (ex. panne SMTP réelle), l''erreur remonte et fait échouer toute la requête HTTP addPayment, laissant l''appelant croire que le paiement n''a pas été enregistré alors qu''il l''a été'
    perimetre: 4.4 Facturation, 4.6 Portail client — server/src/services/invoice.service.ts#addPayment (lignes 214-306)
    categorie: D
    regle_violee: RG-018
    classe: erreur_post_commit_masque_succes_transaction
    gravite: majeur
    statut: resolu
    critere_de_resolution: |
      C'est résolu quand une erreur d'invitation non-409 après le commit de `addPayment` ne fait plus échouer la requête HTTP — le paiement doit être rapporté comme réussi (200/201) avec un signal explicite (ex. `data.portalInviteFailed: true`) que l'invite doit être renvoyée manuellement via `POST /clients/:id/invite` (déjà existant, SEC-154), au lieu de propager l'exception — prouvé par un test qui simule un `inviteClientUser` rejetant une erreur non-409 et vérifie que `addPayment` retourne quand même un succès avec le paiement bien persisté en base.
    detecte_le: '2026-07-21'
    source: audit_llm
    confiance: certain
    note: |
      Audit RevOps CRM (item 3, cascade — creusé après avoir constaté que la prémisse initiale de la question, l'invite au moment de `acceptWithCascade`, ne correspond plus au code réel depuis SEC-002/ RG-018 : l'invite portail est désormais déclenchée par `invoice.service.ts#addPayment`, pas par l'acceptation de proposition). Vérifié par lecture directe : `addPayment` (lignes 214-306) exécute `tx.payment.create`/`tx.invoice.update` (statut → PAID, `portalActivatedAt` posé si c'est la première activation) À L'INTÉRIEUR de `prisma.$transaction`, qui commite avant la ligne 299. Ensuite, post-commit, `clientService.inviteClientUser(...)` est appelé dans un `try/catch` qui n'avale QUE les erreurs 409 (« already invited ») — ligne 304 : `if (!(err instanceof HttpError && err.statusCode === 409)) throw err;` — toute autre erreur (panne SMTP réelle, timeout, erreur de template) est relancée et remonte jusqu'au middleware d'erreur, renvoyant un 4xx/5xx au manager qui vient d'enregistrer le paiement, MASQUANT le fait que `tx.payment.create` a réussi. Le chemin de rattrapage existe déjà (`POST /clients/:id/invite`, SEC-154, reissue un mot de passe temporaire vers le même compte) mais rien dans la réponse d'erreur ne l'indique — le manager n'a aucun signal que le paiement est bien enregistré et qu'il doit utiliser cette route précise pour finir le travail. Gravité `majeur`, pas `bloquant` : aucune perte de données (le paiement est bien en base), mais une vraie confusion opérationnelle à fort risque de double-saisie si le manager retente `addPayment` en pensant qu'il a échoué — protégé dans ce cas précis par la clé d'idempotence/fenêtre de 10s déjà en place, donc pas de double paiement réel, seulement de la friction et une inquiétude injustifiée.
      RÉSOLU (session en cours) : `addPayment` capture désormais toute erreur d'invite non-409 (`portalInviteFailed = true`, loggée via `logger.error`) au lieu de la relancer — le paiement est retourné comme un succès avec `portalInviteFailed: true` inclus dans la réponse (`invoice.controller.ts#addPayment` propage ce champ dans le corps JSON quand il est vrai). Les deux branches de déduplication (`idempotencyKey`/fenêtre 10s) portent désormais explicitement `justActivatedPortal: false` pour rester typées de façon cohérente avec le reste de la fonction. Preuve par test réel (`server/test/invoicePaymentInviteFailure.test.ts`, nouveau fichier) : appelle `invoiceService.addPayment` (code réel) avec `clientService.inviteClientUser` mocké (`mock.method`, le seul effet de bord externe simulé — pas le code testé lui-même) pour rejeter une erreur générique (style panne SMTP) — l'appel résout quand même avec succès, `portalInviteFailed: true`, et le paiement est bien persisté en base (`Payment` existe, `Invoice.status === "PAID"`) ; un second cas confirme qu'un 409 reste avalé silencieusement (`portalInviteFailed: false`). Suite complète verte (499 tests), `npx tsc --noEmit` et `npm run lint --workspace=server` verts. Fix et test produits par mes propres appels d'outils dans cette session. Dérogation CI déjà accordée par l'utilisateur pour cette session : `resolu` malgré l'absence de run CI vert sur ce commit précis.
  - id: SEC-213
    titre: 'e2e/client-approval.spec.ts ("a client sees the closing action on a project ready for review, and approving it really closes the project (RG-013)") échoue en local (reproduit hors CI, une fois le vrai bug CSP de SEC-212 corrigé) sur `await expect(card).toBeVisible()` : après connexion CLIENT et clic sur le lien "Projets", la page atterrit sur le détail d''un projet existant déjà seedé ("Intégration ERP Géant Tunisia") au lieu de la liste des projets où devrait apparaître la carte du nouveau projet créé par le test ("E2E approval proposal <timestamp>") — la navigation "Projets" ne mène pas systématiquement à la liste'
    perimetre: e2e/client-approval.spec.ts, client/src (page/route "Projets" du portail CLIENT)
    categorie: H
    regle_violee: null
    classe: e2e_navigation_liste_vs_detail
    gravite: mineur
    statut: resolu
    critere_de_resolution: |
      C'est résolu quand `e2e/client-approval.spec.ts` passe de façon stable (observé sur au moins 2 exécutions locales consécutives, base fraîchement seedée à chaque fois) : soit parce que la page "Projets" du portail CLIENT mène bien à la liste (pas au détail d'un projet existant), soit parce que le test est corrigé pour cibler explicitement la liste si ce comportement est en fait voulu (ex. redirection intentionnelle vers l'unique projet actif quand un client n'en a qu'un) — distinction à trancher en lisant le code de routing réel, pas en devinant depuis le seul symptôme e2e.
    detecte_le: '2026-07-22'
    source: manuel
    confiance: certain
    note: |
      Découvert en corrigeant SEC-212 (le bug CSP masquait cette anomalie : tant que le login e2e échouait silencieusement, client-approval.spec.ts échouait avant même d'atteindre ce point). Une fois SEC-212 corrigé (VITE_E2E dans playwright.config.ts/ vite.config.ts), reproduit 2 fois de suite en local (Docker Postgres/Redis frais + seed + build/preview réel + serveur réel) : le test échoue systématiquement au même endroit (client-approval.spec.ts:101, `await expect(card).toBeVisible({ timeout: 15_000 })`), jamais ailleurs — pas un flake aléatoire. La capture DOM de l'échec (error-context.md) montre le portail CLIENT affichant directement "Intégration ERP Géant Tunisia" (un projet du seed, avec sa progression 67%, ses étapes 4/7) après le clic sur "Projets", plutôt qu'une liste de cartes contenant le nouveau projet créé par le test. Non encore lu : le code de routing réel du portail CLIENT (`client/src/routes/*` ou équivalent) pour déterminer si ce comportement (redirection auto vers l'unique/dernier projet) est intentionnel — statut laissé `[À CONFIRMER — non trié]` par prudence plutôt que d'inventer une cause. Hors périmètre de la session SEC-212 (infrastructure CI Postgres/Redis) : symptôme purement applicatif/frontend, aucune anomalie de service Docker.
      Cause réelle trouvée (2026-07-23, même session) : l'hypothèse de routing/liste ci-dessus était FAUSSE — `ProjectsClientPage.tsx` est bien une vraie liste (`.map()` sur `projects`, `pageSize: 100`), pas une redirection vers un détail. Le contenu `4/7 étapes` vu dans la capture DOM appartenait à `ProjectTimeline`, un composant rendu À L'INTÉRIEUR de la seule carte affichée — pas une page de détail séparée. Diagnostiqué en reproduisant l'exacte séquence d'appels API du test (`node -e` direct, mêmes endpoints dans le même ordre) contre des conteneurs Docker frais : `GET /clients?search=Géant&pageSize=1` retournait **"Vermeg Digital"** en premier résultat, pas "Géant Tunisia" — le nouveau projet du test était donc créé pour le mauvais client (Vermeg Digital), pas pour Géant Tunisia (le client réel de `client3@example.tn`), d'où son absence de la liste du bon client. Cause racine : voir SEC-215 (`GET /clients?search=`, ouvert séparément — un ID distinct malgré la découverte conjointe, le critère de résolution porte sur le filtre de recherche serveur, pas sur la navigation e2e). Corrigé en même temps que SEC-215 (le fix serveur suffit, aucun changement propre à ce test) — revérifié en local, 2 runs consécutifs verts (`client-approval.spec.ts` à 4.6s puis 3.7s), sans re-seed entre les deux.
  - id: SEC-216
    titre: clientService.inviteClientUser (server/src/services/client.service.ts) réinitialise le mot de passe de tout utilisateur CLIENT dont lastLoginAt est null, quel que soit son état réel — un compte provisionné directement (mot de passe déjà connu/fonctionnel, jamais passé par le flux d'invitation email) n'a jamais lastLoginAt renseigné avant son tout premier vrai login, donc se fait silencieusement réinitialiser au prochain déclenchement du flux d'invitation pour son client (ex. un second paiement d'acompte sur un second projet)
    perimetre: server/src/services/client.service.ts#inviteClientUser ; server/prisma/seed.ts (données de seed concernées)
    categorie: G
    regle_violee: null
    classe: reinitialisation-mdp-silencieuse
    gravite: majeur
    statut: resolu
    critere_de_resolution: |
      Résolu quand un utilisateur CLIENT dont le mot de passe a été déjà réellement défini (pas un mot de passe temporaire jamais consommé) ne voit plus jamais ce mot de passe changé par un appel à `inviteClientUser` déclenché automatiquement (paiement d'acompte) — vérifié en payant un second acompte pour un client déjà actif et en confirmant que son mot de passe existant reste valide après coup, pas seulement en relisant le code.
    detecte_le: '2026-07-23'
    source: manuel
    confiance: certain
    note: |
      Découvert en investiguant SEC-213 : le mot de passe seedé de `client3@example.tn` (`client123`) a cessé de fonctionner (401 réel, vérifié par `bcrypt.compare` direct en base) après l'exécution locale de `client-approval.spec.ts`, qui paie un second acompte pour le même client (Géant Tunisia) déjà activé par un projet seedé antérieur. Tracé dans les logs Prisma du serveur (`prisma:query`) : `UPDATE "User" SET "passwordHash" = $1, "mustChangePassword" = $2 ...` déclenché juste après une tentative d'envoi d'email d'invitation à `client3@example.tn` — exactement la signature de `inviteClientUser`. Cause trouvée en lisant `invoice.service.ts` : le paiement déclenche `justActivatedPortal` (vrai seulement si `Client. portalActivatedAt` passe de `null` à une date DANS la même transaction) qui appelle `inviteClientUser` ; celui-ci définit `neverLoggedIn = existing.find(u => u.lastLoginAt === null)` — mais `seed.ts` ne renseignait `lastLoginAt` pour AUCUN utilisateur, et ne renseignait pas non plus `Client.portalActivatedAt` (voir SEC-213/SEC-215 pour la chronologie complète) : chaque client seedé démarrait donc « jamais activé », rendant sa toute première mise à jour de facture-avec-paiement en session de test un déclencheur légitime de `justActivatedPortal`, qui retombait ensuite sur un compte utilisateur déjà réel et fonctionnel comme s'il s'agissait d'une invitation jamais consommée.
      Double correctif (même session) : 1) `seed.ts` : les 4 comptes CLIENT (`client1`-`client4`) reçoivent désormais `lastLoginAt: <maintenant>` à la création, et les 4 `Client` associés reçoivent `portalActivatedAt: <maintenant>` — cohérent avec l'intention documentée du seed (mots de passe `client123` connus, distribués, prêts à l'emploi, pas des invitations en attente). Corrige la cause immédiate observée par les 2 tests e2e concernés. 2) `client.service.ts#inviteClientUser` (défense en profondeur, décision explicite du porteur d'élargir la correction au-delà du seed) : la condition `neverLoggedIn` exige maintenant aussi `u.mustChangePassword === true`, un champ qui ne devient vrai que via ce même flux de (ré)invitation ou les flux de mot de passe temporaire équivalents (`register`, `resetPassword`) — jamais pour un compte dont le mot de passe courant a été délibérément défini comme définitif. Ne change rien pour le cas légitime de SEC-154 (relance d'une invitation jamais consommée, où `mustChangePassword` est justement resté `true`) : les 3 tests de `clientInviteResend.test.ts` (SEC-154) revérifiés verts après ce changement, sans modification. Suite serveur complète revérifiée verte (`test:coverage`, exit code 0, 0 test en échec) après les 2 correctifs combinés. `npm run typecheck`/`npm run lint` --workspace=server vérifiés propres.
