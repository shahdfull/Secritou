      RÉSOLU (2026-07-23) : `npx playwright test --reporter=list` confirmé vert par l'utilisateur sur le commit `e6fcb7c` (« green »), incluant `client-approval.spec.ts` — le test précédemment en échec reproductible passe désormais de façon stable.
