# Registre des anomalies — Secritou
#
# Ce fichier fait partie du registre éclaté (voir CLAUDE.md § « Procédure
# d'audit obligatoire »). Schéma par anomalie : id, titre, perimetre,
# regle_violee, classe, gravite, statut, critere_de_resolution, detecte_le,
# source, confiance, note.
# Ne jamais reformuler un titre existant — citer l'ID.
#
# Périmètre : 4.5 Rémunération des associés (Commissions)
# 3 anomalie(s) — registre remis à zéro le 2026-07-27, historique réel
# archivé sur la branche locale archive/anomalies-avant-reset (commit 3c03297).
# +4 le 2026-08-01 (Phase 1 point 3, audit demandé par le porteur).

anomalies:
  - id: SEC-081
    titre: >
      PUT /commissions/projects/:id/splits (commissionService.setSplits)
      valide la somme des ratePct, les doublons et le mode PER_TASK, mais
      jamais que chaque partnerId fourni correspond à un User réel avant
      l'écriture — un partnerId UUID syntaxiquement valide mais
      inexistant fait échouer la contrainte de clé étrangère (P2003), non
      catchée par error.middleware.ts, remontant en 500 brut. Même classe
      que SEC-077 (invoice.service.ts#create), site de code distinct.
      Reproduit réellement contre un serveur HTTP réel avec un vrai token
      ADMIN et un projet réel
    perimetre: 4.5-commissions
    regle_violee: >
      Même incohérence que SEC-077 : task.service.ts#assertAssigneeIsValid
      établit déjà le patron (findUnique préalable convertissant une
      violation FK potentielle en erreur propre) — setSplits ne l'applique
      pas pour partnerId.
    classe: fk-non-validee-500-brut
    gravite: mineure
    statut: resolu
    note_resolution: >
      Correctif commité (f7b3e33, findMany d'existence + HttpError 404
      PARTNER_NOT_FOUND dans commissionService.setSplits), test HTTP
      réel (commissionFkAndOrderByGuards.http.test.ts). CI verte
      confirmée : run GitHub Actions 30995001782, tous jobs success
      (dont "server").
    critere_de_resolution: >
      commissionService.setSplits vérifie l'existence de chaque partnerId
      (ex. un seul findMany({where:{id:{in:partnerIds}}}) comparé au
      nombre attendu) avant l'écriture, et lève une HttpError 404/422
      propre si un ou plusieurs partnerId n'existent pas. Un test réel
      (HTTP) doit confirmer qu'un partnerId inexistant renvoie un code
      d'erreur propre, jamais un 500.
    detecte_le: "2026-08-01"
    source: >
      Phase 1 point 3 (Commissions), audit des contrats API demandé par
      le porteur — reproduction HTTP réelle (server temporaire, vrai
      token ADMIN, projet réel créé en base, PUT splits avec un partnerId
      UUID syntaxiquement valide mais inexistant) : 500 brut confirmé,
      log serveur montrant PrismaClientKnownRequestError code P2003 non
      catché. Script de reproduction supprimé après usage, jamais
      committé.
    confiance: haute
    note: >
      Même classe que SEC-077 (fk-non-validee-500-brut), fichier
      différent — non fusionné sous un seul ID (règle CLAUDE.md : classe
      identique n'implique pas fusion si le site de code et le correctif
      diffèrent). setManagerFee (commission.service.ts:217-228) présente
      potentiellement le même défaut sur managerId — non vérifié par
      reproduction dans cette session, à confirmer avant de l'inclure
      dans le même correctif si jamais traité.

  - id: SEC-080
    titre: >
      Trois points de performance mineurs, non mesurables à la
      volumétrie actuelle (0 client actif), regroupés sous un même
      constat de dette technique : (1) generateManagerFeesOnDeliveryTx
      (commission.service.ts:203-211) boucle un await Prisma par manager
      au lieu d'un createMany, alors que le pattern createMany est déjà
      appliqué juste au-dessus dans le même fichier pour un cas
      équivalent (commentaire SEC-170) ; (2) commissionRepository.markPaid/
      findById chargent include:{partner,project,invoice} en entier alors
      que le service ne lit jamais project pour ces deux usages (markPaid
      ne lit que status avant l'update) ; (3) getSplitsByProjectTx/
      getManagerFeesByProjectTx n'ont pas de select explicite,
      chargent id/createdAt/updatedAt jamais utilisés par les deux seuls
      appelants
    perimetre: 4.5-commissions
    regle_violee: >
      Aucune règle métier — cohérence de patron de code interne (le
      createMany est déjà le patron établi ailleurs dans le même
      fichier, cf. commentaire SEC-170 dans le repository) et principe
      général de ne charger que ce qui est consommé.
    classe: dette-technique-perf-non-mesurable-volumetrie-actuelle
    gravite: mineure
    statut: resolu
    note_resolution: >
      Décision explicite du porteur de traiter cette dette en avance de
      son propre déclencheur (0 client actif toujours vrai au moment du
      traitement). Les 3 points appliqués : (1) createManagerFeeCommissionsManyTx
      (createManyAndReturn) remplace la boucle await-par-manager,
      patron déjà établi par SEC-170 ; (2) commissionRepository.findById
      renommée findStatusById avec select:{status:true} (seul appelant :
      markPaid), et markPaid (l'update) perd .project de son include
      (jamais lu) ; (3) select explicite sur getSplitsByProjectTx
      (partnerId/ratePct) et getManagerFeesByProjectTx
      (managerId/amount), limité aux champs réellement lus par leurs
      seuls appelants. Pas de nouveau test : optimisation interne sans
      changement de comportement observable, vérifiée par les suites
      existantes (commissionService.test.ts#markPaid : 26/26 verts ;
      managerProjectFee.test.ts#generateManagerFeesOnDeliveryTx : 9/9
      verts) — tsc --noEmit confirmant qu'aucun appelant ne lisait les
      champs retirés. Commit 229a720, CI verte confirmée : run GitHub
      Actions 31184201796, tous jobs success (dont "server").
    critere_de_resolution: >
      Non prioritaire tant que la volumétrie réelle ne le justifie pas
      (agence à 0 client actif au moment de ce constat) — à traiter sur
      signal fort (nombre de managers de pôle par projet dépassant une
      poignée, ou volumétrie de Commission par partenaire dépassant
      quelques centaines de lignes), pas par défaut. Si traité : (1)
      remplacer la boucle par tx.commission.createMany ; (2) select
      minimal ({status: true} pour findById avant markPaid,
      retirer project de l'include de markPaid) ; (3) select explicite
      sur getSplitsByProjectTx/getManagerFeesByProjectTx limité aux
      champs réellement lus par les appelants.
    detecte_le: "2026-08-01"
    source: >
      Phase 1 point 3 (Commissions), audit performance SQL demandé par
      le porteur — agent d'exploration dédié, confirmé par lecture
      directe de commission.service.ts/.repository.ts dans la même
      session.
    confiance: haute
    note: >
      Regroupé sous un seul ID (pas 3 IDs distincts) : les 3 points
      partagent le même statut (dette technique non actionnable
      actuellement) et le même déclencheur de traitement (signal de
      volumétrie réelle), contrairement à SEC-075/SEC-079 (orderBy) qui
      sont des défauts de disponibilité déjà reproductibles aujourd'hui,
      indépendants du volume de données.

  - id: SEC-079
    titre: >
      commission.repository.ts#getAll (server/src/repositories/commission.repository.ts:263)
      interpole options.orderBy directement dans la clause Prisma sans
      passer par buildOrderBy — même classe que SEC-075 (invoice.repository.ts),
      site de code distinct. En plus de l'absence de whitelist, aucun
      index n'existe sur Commission.createdAt (seuls partnerId/projectId/
      invoiceId/status sont indexés individuellement, schema.prisma
      ~lignes 1508-1511) — le tri par défaut de getMyCommissions/getAll
      force un scan+sort non couvert par index dès quelques milliers de
      lignes par partenaire
    perimetre: 4.5-commissions
    regle_violee: >
      Même incohérence que SEC-075 : buildOrderBy existe précisément pour
      whitelister un orderBy venant de req.query, 8+ repositories
      l'utilisent déjà — commission.repository.ts en est une exception de
      plus.
    classe: orderby-non-whiteliste-500-brut
    gravite: mineure
    statut: resolu
    note_resolution: >
      Correctif commité (f7b3e33, SORTABLE_FIELDS + buildOrderBy sur
      commission.repository.ts#getAll), test HTTP réel
      (commissionFkAndOrderByGuards.http.test.ts). CI verte confirmée :
      run GitHub Actions 30995001782, tous jobs success (dont "server").
    critere_de_resolution: >
      commission.repository.ts#getAll utilise buildOrderBy(options.orderBy,
      options.orderDir, [liste des champs Commission réellement
      triables], "createdAt"). Un test réel (HTTP) doit confirmer qu'un
      orderBy invalide retombe sur le tri par défaut et renvoie 200, pas
      500.
    detecte_le: "2026-08-01"
    source: >
      Phase 1 point 3 (Commissions), audit performance SQL (agent
      d'exploration dédié) confirmé par reproduction HTTP réelle (server
      temporaire, vrai token ADMIN) : GET /commissions?orderBy=partner →
      500, GET /commissions?orderBy=nonExistentField → 500,
      GET /commissions?orderBy=amount (colonne réelle) → 200. Script de
      reproduction supprimé après usage, jamais committé.
    confiance: haute
    note: >
      Même classe que SEC-075 (même défaut, même critère de résolution,
      fichier différent) — non fusionné sous un seul ID car chaque
      correctif touche un repository distinct (règle CLAUDE.md : classe
      identique n'implique pas ID unique si le site de code diffère).
      Index composite (partnerId, createdAt) ou (status, createdAt)
      absent également — non enregistré comme anomalie séparée, la
      whitelist d'orderBy est le point d'entrée prioritaire (un champ
      arbitraire non whitelisté rend de toute façon tout index composite
      inefficace tant que n'importe quel champ peut être demandé).

  - id: SEC-078
    titre: >
      commissionService.markPaid (server/src/services/commission.service.ts:515)
      construit le message de notification COMMISSION_PAID avec
      `${updatedCommission.invoice?.number ? "" : ""}` — les deux branches
      du ternaire retournent la même chaîne vide, donc le numéro de
      facture n'apparaît jamais dans le message quel que soit son
      existence, malgré commissionRepository.markPaid (repository.ts:295)
      qui charge bien invoice:{select:{id,number}} explicitement pour cet
      usage. Message final toujours "Votre commission de X.XXX  a été
      versée." (double espace, aucune référence à la facture)
    perimetre: 4.5-commissions
    regle_violee: >
      Aucune règle métier écrite — défaut de fond dans un message destiné
      à l'utilisateur : la donnée est chargée spécifiquement pour cet
      usage (include explicite dans le repository) mais jamais utilisée,
      signe d'un refactor incomplet plutôt que d'un choix délibéré.
    classe: expression-morte-message-notification
    gravite: mineure
    statut: resolu
    note_resolution: >
      Correctif commité (0e89fac) exactement conforme au critère écrit
      ci-dessous. Portée étendue à la devise, hors périmètre écrit
      initial de cet ID : le message n'incluait aucune devise
      (Number(...).toFixed(3) seul), contrairement au pattern cohérent
      du reste du dépôt (invoice.service.ts:209,341,345,
      `${amount} ${currency ?? "TND"}`) — découvert pendant la
      vérification du correctif, extension validée explicitement par le
      porteur avant implémentation plutôt que traitée comme un
      correctif silencieux hors mandat. commissionRepository.markPaid
      charge désormais invoice.currency en plus de invoice.number. Test
      réel (commissionMarkPaidNotificationMessage.test.ts) appelle le
      vrai commissionService.markPaid et lit le job BullMQ réellement
      enfilé. CI verte confirmée : run GitHub Actions 30999069327, tous
      jobs success (dont "server").
    critere_de_resolution: >
      Le message de notification COMMISSION_PAID inclut réellement le
      numéro de facture quand updatedCommission.invoice existe (ex.
      `${updatedCommission.invoice?.number ? \` (facture ${updatedCommission.invoice.number})\` : ""}`),
      et reste sans référence facture propre (pas de double espace) quand
      absent. Un test réel doit créer une commission avec et sans facture
      liée, appeler markPaid, et vérifier le contenu du message enfilé.
    detecte_le: "2026-08-01"
    source: >
      Phase 1 point 3 (Commissions), lecture directe de
      commission.service.ts#markPaid pendant l'audit performance/tests —
      confirmé par lecture croisée de
      commissionRepository.markPaid (server/src/repositories/commission.repository.ts:291-297)
      montrant que invoice:{select:{id,number}} est bien chargé pour cet
      appel précis, donc la donnée existe et le ternaire mort n'est pas
      une simple absence de champ.
    confiance: haute
    note: >
      Défaut cosmétique (message de notification), aucun impact sur le
      calcul ou l'enregistrement de la commission elle-même — le montant,
      le statut PAID et paidAt sont tous corrects. N'affecte que le texte
      lu par le partenaire dans l'application.

  - id: SEC-007
    titre: >
      Aucun chemin API réel ne permet de retirer l'assigneeId d'une Task
      (mettre à null) — updateTask ne peut donc jamais faire franchir le
      seuil "≥1 freelancer assigné" → "0" par retrait d'assignation, ce qui
      laisse RG-005-bis (recalcul auto de split de commission) non testable
      sur cette direction précise du seuil
    perimetre: 4.5-commissions
    regle_violee: >
      RG-005-bis (voir REFERENTIEL.md §5, session du 2026-07-28) exige un
      recalcul automatique du split de commission à chaque franchissement du
      seuil 0<->≥1 Freelancer assigné sur une Task du projet, dans les DEUX
      sens. Le sens "ajout" est réellement exercé (createTask/updateTask
      avec un nouvel assigneeId) ; le sens "retrait" ne peut être déclenché
      par aucun appelant réel, faute de chemin d'écriture pour assigneeId:
      null.
    classe: capacite-produit-manquante
    gravite: mineure
    statut: resolu
    critere_de_resolution: >
      Un utilisateur autorisé (ADMIN/MANAGER dans le pôle du projet) doit
      pouvoir retirer l'assigné d'une tâche depuis l'écran des tâches
      (TasksListView / TasksKanban), et ce retrait doit se répercuter dans
      taskService.updateTask jusqu'à assigneeId: null en base. Chemin à
      construire : shared/src/schemas/task.schema.ts#taskBaseSchema
      (assigneeId doit accepter null, pas seulement string|undefined) →
      server/src/validators/task.validator.ts → task.controller.ts →
      task.service.ts#updateTask (déjà prêt à réagir : reassigned est
      calculé sur data.assigneeId !== undefined, donc null passe déjà le
      test one fois le typage corrigé) → UI (bouton "Retirer l'assigné").
      Un test doit appeler réellement taskService.updateTask avec
      assigneeId: null sur une tâche précédemment assignée à un
      FREELANCER seul sur le projet, et vérifier que
      commissionService.recalcAutoSplit est bien déclenché (retour à
      ADMIN 80%/Managers 20% ou 100% ADMIN si 0 Manager).
    detecte_le: "2026-07-28"
    source: >
      Écrit en implémentant RG-005-bis (session du 2026-07-28) :
      shared/src/schemas/task.schema.ts:33 (assigneeId: z.string().optional(),
      pas de .nullable()) ; grep exhaustif "assigneeId: null" sur
      server/src : zéro résultat dans tout le dépôt. taskService.updateTask
      (server/src/services/task.service.ts:207-208) calcule bien
      `reassigned` sur `data.assigneeId !== undefined`, ce qui gérerait
      correctement un `null` reçu — mais aucun appelant, du contrôleur au
      schéma partagé, ne peut produire cette valeur aujourd'hui.
    confiance: haute
    note: >
      SEC-016 (session du 2026-07-29) a trouvé que ce statut resolu ne
      remplissait pas le critère exact ci-dessus (test manquant sur le
      franchissement de seuil descendant). Corrigé sous SEC-016 (voir
      plus bas dans ce fichier) — le nouveau test qui referme SEC-016
      referme aussi, de fait, ce critère précis de SEC-007. Ne pas
      rouvrir SEC-007 elle-même : le gap qu'elle décrivait au moment de
      sa clôture (statut, confiance, source) reste correct pour
      l'historique, c'est le critère qui a été vérifié après coup, sous
      un ID distinct dédié à cette vérification (CLAUDE.md « Un ID = un
      critère de résolution »).

  - id: SEC-015
    titre: >
      REFERENTIEL.md §5 RG-006 à RG-011 (base de calcul commission, cycle
      de vie paiement, cascade proposition, visibilité par associé) sont
      des définitions obsolètes — le code (commission.service.ts,
      task.service.ts, schema.prisma) a réutilisé silencieusement ces
      mêmes identifiants pour un régime de rémunération PER_TASK entier
      (payoutBudget, Task.payoutAmount, ProjectManagerFee, coefficient
      qualité) qui n'existe nulle part dans REFERENTIEL.md §5
    perimetre: 4.5-commissions
    regle_violee: >
      CLAUDE.md § « Cohérence obligatoire REFERENTIEL.md ↔ anomalies/*.yaml »
      (par extension : la numérotation RG elle-même ne peut diverger entre le
      code et REFERENTIEL.md sans que ce dernier ne soit mis à jour dans la
      même passe) et § « Toute décision du porteur s'écrit dans §7 dans la
      même passe ». REFERENTIEL.md §5 documente RG-006 (« Rémunération à la
      mission — état implémenté », splits manuels ProjectCommissionSplit),
      RG-007 (« Base de calcul de la commission », montant brut encaissé),
      RG-008 (« Déclenchement de la commission », sur Payment), RG-009
      (« Cycle de vie du paiement de commission », PENDING->PAID), RG-010
      (« Cascade d'acceptation de proposition ») et RG-011 (« Visibilité des
      commissions par associé »). Le code réutilise ces 6 identifiants pour
      des règles totalement différentes du régime PER_TASK : RG-006 devient
      « refonte paiement à la tâche : enveloppe payoutBudget »
      (commission.service.ts:110, :228), RG-007 devient « une tâche ne peut
      pas quitter TODO sans payoutAmount fixé » (task.service.ts:66), RG-008
      devient « barème qualité/délai à la validation, computeForTaskValidationTx »
      (commission.service.ts:84, :439), RG-009 devient « conflit d'intérêt,
      pas d'auto-validation Manager » (task.service.ts:85), RG-010 devient
      « verrouillage du mode dès qu'une Commission existe »
      (commission.service.ts:282, :331), RG-011 devient « fee manager fixe à
      la livraison, generateManagerFeesOnDeliveryTx » (commission.service.ts:182).
      schema.prisma lui-même cite un 3e jeu d'identifiants pour le même
      régime PER_TASK (« PER_TASK (RG-028/RG-029) », ligne 22 ; « RG-006 »,
      ligne 601 ; « RG-008 », ligne 1483) — trois sources ne sont pas
      d'accord entre elles sur quels RG-xxx couvrent ce régime.
    classe: incoherence-doc-code-rg-id
    gravite: eleve
    statut: resolu
    critere_de_resolution: >
      REFERENTIEL.md §5 est mis à jour dans la même session que ce
      correctif : soit (a) RG-006 à RG-011 existants sont renommés/déplacés
      sous de nouveaux identifiants libres (après RG-029) pour documenter le
      régime PER_TASK tel qu'il existe réellement en code (payoutBudget,
      Task.payoutAmount/qualityScore/reworkCount, ProjectManagerFee, conflit
      de validation, verrouillage de mode), et les commentaires de code
      (commission.service.ts, task.service.ts, schema.prisma) sont mis à
      jour pour citer les nouveaux identifiants — soit (b) le porteur du
      projet confirme explicitement que RG-006 à RG-011 doivent être
      RÉÉCRITS en place pour refléter le régime PER_TASK, et que leur sens
      actuel dans REFERENTIEL.md (splits manuels, base brute encaissée,
      cascade proposition, visibilité associé) est soit fusionné ailleurs
      soit abandonné — décision produit qui ne se déduit pas du code, à
      demander explicitement avant toute réécriture (CLAUDE.md
      « Interdiction d'inférer une décision de l'utilisateur »). Dans les
      deux cas, schema.prisma doit citer les MÊMES identifiants que
      REFERENTIEL.md, pas un 3e jeu distinct.
    detecte_le: "2026-07-29"
    source: >
      Lecture directe intégrale de server/src/services/commission.service.ts
      (532 lignes), server/src/controllers/commission.controller.ts (87
      lignes), server/src/routes/commission.routes.ts (72 lignes),
      server/src/validators/commission.validator.ts (32 lignes),
      server/src/repositories/commission.repository.ts (291 lignes), grep
      ciblé sur server/src/services/task.service.ts (lignes 38-83, 190-201,
      315-348) et server/prisma/schema.prisma (lignes 22, 208, 216, 582-656,
      1426, 1439-1490), et grep exhaustif "RG-006 —" à "RG-011 —" sur
      REFERENTIEL.md (6 résultats, lignes 1466-1531), session du 2026-07-29.
    confiance: haute
    correctif: >
      Option (a) retenue par le porteur (AskUserQuestion, session du
      2026-07-29) : le régime PER_TASK renuméroté RG-030 (enveloppe
      payoutBudget) à RG-035 (fee Manager à la livraison), documenté dans
      REFERENTIEL.md §5 juste après RG-029, avec une note de numérotation
      explicite renvoyant à ce SEC-015. RG-006 à RG-011 laissées inchangées.
      Tous les commentaires de code et labels de test mis à jour vers les
      nouveaux identifiants : commission.service.ts, commission.repository.ts,
      commission.validator.ts, task.service.ts, project.service.ts,
      schema.prisma, server/test/managerProjectFee.test.ts,
      server/test/taskPayoutRules.test.ts,
      server/test/taskFixedCommission.test.ts,
      server/test/commissionService.test.ts. Décision écrite dans
      REFERENTIEL.md §7 (entrée du 2026-07-29) dans la même session.
      Commité (d18325a) et confirmé vu vert en CI sur le commit fdc1363
      (run GitHub Actions 30457571233, 6/6 jobs verts) — critère de
      résolution rempli (CLAUDE.md « Un critère de résolution se vérifie
      sur un commit »). Note : les commentaires SQL des migrations déjà
      appliquées (20260728020000_project_payout_budget,
      20260728040000_task_payout_fields) citent encore RG-006/RG-007/
      RG-008/RG-009 — volontairement non modifiés, une migration déjà
      appliquée est un artefact historique immuable (même traitement que
      l'AuditLog, jamais réécrit après coup) ; seuls les commentaires du
      code source vivant ont été renumérotés.

  - id: SEC-016
    titre: >
      SEC-007 marquée resolu alors que son critère de résolution exact
      (un test appelant réellement taskService.updateTask avec
      assigneeId:null et vérifiant le déclenchement de
      commissionService.recalcAutoSplit vers le seuil "0 freelancer") n'est
      pas rempli — le chemin de désassignation existe (UI + schéma + test
      de persistance) mais aucun test ne prouve le franchissement du seuil
      dans le sens descendant sur le split de commission
    perimetre: 4.5-commissions
    regle_violee: >
      CLAUDE.md § « Un critère de résolution s'énonce par ce que
      l'utilisateur peut faire » et § « `verifie: test` exige un test qui
      appelle le code réel ». Le critère de résolution de SEC-007 (voir
      ci-dessus dans ce même fichier) exige explicitement : « Un test doit
      appeler réellement taskService.updateTask avec assigneeId: null sur
      une tâche précédemment assignée à un FREELANCER seul sur le projet, et
      vérifier que commissionService.recalcAutoSplit est bien déclenché ».
      Le chemin de désassignation (shared/src/schemas/task.schema.ts:33,
      assigneeId: z.string().nullable().optional() ; UI
      TaskEditDialog.tsx:223, bouton "Retirer l'assigné" ;
      server/test/taskUpdateScope.test.ts:110-121, test de persistance
      assigneeId:null) a bien été construit — mais
      server/test/commissionAutoSplitTaskTrigger.test.ts:106-112 documente
      lui-même explicitement, dans un commentaire non retiré, que le test du
      franchissement de seuil descendant (1->0 freelancer déclenchant
      recalcAutoSplit) n'a jamais été écrit.
    classe: critere-resolution-incomplet
    gravite: moyenne
    statut: resolu
    critere_de_resolution: >
      Un nouveau cas de test dans commissionAutoSplitTaskTrigger.test.ts (ou
      un fichier dédié) appelle réellement taskService.updateTask avec
