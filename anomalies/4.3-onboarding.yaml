# Registre des anomalies — Secritou
#
# Ce fichier fait partie du registre éclaté (voir CLAUDE.md § « Procédure
# d'audit obligatoire »). Schéma par anomalie : id, titre, perimetre,
# regle_violee, classe, gravite, statut, critere_de_resolution, detecte_le,
# source, confiance, note.
# Ne jamais reformuler un titre existant — citer l'ID.
#
# Périmètre : 4.3 Onboarding client
# 2 anomalie(s) — registre remis à zéro le 2026-07-27, historique réel
# archivé sur la branche locale archive/anomalies-avant-reset (commit 3c03297).
# +1 le 2026-08-01 (Phase 1 point 4 du mandat QA, tests réels de
# contraintes FK/cascade demandés par le porteur).

anomalies:
  - id: SEC-088
    titre: >
      gdprService.eraseClient (server/src/services/gdpr.service.ts:95-116)
      hard-delete réellement un Client (tx.client.delete) quand
      invoiceCount === 0, avec un catch(isRestrictedDeleteError) prévu
      pour retomber en mode "anonymized" si Postgres lève P2003 — mais
      ClientOnboarding a onDelete:Cascade sur client (schema.prisma:968),
      donc la ligne ClientOnboarding est supprimée EN CASCADE avant que
      la contrainte Restrict sur Project (schema.prisma:966, documentée
      "deleting a project must not silently destroy its onboarding
      record") n'ait la moindre chance de se déclencher — aucune
      violation FK ne se produit, isRestrictedDeleteError n'est jamais
      atteint, mode reste "deleted". Reproduit réellement via l'endpoint
      réel POST /gdpr/clients/:id/erase sur un client sans facture ayant
      un projet IN_PROGRESS avec un onboarding actif : réponse 200
      {"mode":"deleted"}, le Client est bien supprimé, le Project
      IN_PROGRESS survit mais son ClientOnboarding a disparu
      silencieusement, sans aucune erreur ni trace
    perimetre: 4.3-onboarding
    regle_violee: >
      Le commentaire du schéma lui-même (schema.prisma:965 "Restrict (not
      Cascade): deleting a project must not silently destroy its
      onboarding record") énonce l'intention exacte que ce cas viole —
      juste par un chemin différent (suppression du Client, pas du
      Project). Le garde-fou applicatif (isRestrictedDeleteError,
      gdpr.service.ts:39-41, commentaire "silently cascading") montre que
      les auteurs avaient conscience du risque de cascade silencieuse
      mais n'ont protégé que contre le cas où Postgres lève une erreur
      P2003 — pas contre le cas, ici réel, où aucune erreur ne se
      produit parce qu'une cascade en amont a déjà supprimé la ligne qui
      aurait dû déclencher le Restrict.
    classe: cascade-schema-contourne-restrict-documente
    gravite: eleve
    statut: resolu
    critere_de_resolution: >
      eraseClient vérifie explicitement l'existence d'un ClientOnboarding
      actif lié à un projet du client AVANT de tenter tx.client.delete
      (même patron que la vérification invoiceCount déjà en place) et
      retombe en mode "anonymized" dans ce cas — pas seulement en cas
      d'exception P2003 remontée par Postgres. Un test réel doit créer un
      client sans facture avec un projet ayant un onboarding actif,
      appeler POST /gdpr/clients/:id/erase, et vérifier soit un mode
      "anonymized" soit un rejet explicite — jamais "deleted" avec
      l'onboarding disparu sans trace.
    correctif: >
      clientRepository.countProjectOnboardings(id) ajoutée (compte les
      ClientOnboarding liés via project.clientId) et appelée dans
      eraseClient avant le hard-delete — le mode bascule sur
      "anonymized" dès que onboardingCount > 0, même patron exact que le
      garde invoiceCount déjà en place (if (invoiceCount === 0 &&
      onboardingCount === 0)). Vérifié réellement, reproduisant le
      scénario exact de la découverte : client réel sans facture créé,
      projet IN_PROGRESS réel créé, ClientOnboarding réel créé et lié —
      POST /gdpr/clients/:id/erase répond désormais 200
      {"mode":"anonymized"} (au lieu de {"mode":"deleted"} avant le
      correctif) ; relecture de la base confirme le Client anonymisé
      (nom/email remplacés, pas supprimé), le Project IN_PROGRESS
      intact, et surtout le ClientOnboarding toujours présent (n'a plus
      disparu silencieusement). 783/785 tests server verts (seul échec :
      SEC-069, pré-existant, sans rapport). En attente de commit + CI
      verte avant passage à resolu.
    detecte_le: "2026-08-01"
    source: >
      Phase 1, point 4 du mandat QA (tests DB : contraintes, FK,
      cascades, rollback de transaction réel) — reproduit en 3 temps sur
      une base réelle : (1) DELETE SQL brut sur Project avec onboarding
      lié → correctement bloqué par Postgres (P2003) ; (2) DELETE SQL
      brut sur Client avec projet+onboarding liés → réussi, onboarding
      supprimé en cascade, projet survivant orphelin ; (3) confirmé que
      ce n'est pas un artefact du SQL brut : le vrai endpoint
      POST /gdpr/clients/:id/erase produit exactement le même résultat
      ({"mode":"deleted"}, 200), avec le Project IN_PROGRESS confirmé
      toujours présent et son ClientOnboarding confirmé disparu par
      lecture directe post-appel.
    confiance: haute
    note: >
      Distinct de SEC-037 (déjà résolu, transaction atomique sur les
      effacements RGPD — regroupe plusieurs écritures dans un seul
      $transaction pour éviter un effacement partiel en cas de crash
      mi-séquence) : SEC-037 protège contre une panne pendant la
      séquence, ce nouveau constat se produit même quand la transaction
      réussit intégralement et de façon parfaitement atomique — c'est le
      RÉSULTAT de la cascade Postgres qui est en cause, pas une
      défaillance d'exécution. deleteProject (le chemin direct,
      client.service.ts n'est pas concerné) bloque déjà correctement ce
      même cas via un contrôle applicatif explicite
      (PROJECT_HAS_ONBOARDING, 409, vérifié dans cette même session) —
      eraseClient est le seul chemin qui l'esquive, via un client
      différent du projet lui-même.

  - id: SEC-029
    titre: >
      Le modèle Payment de l'étape onboarding (amount/amountPaid/status)
      n'est jamais rattaché à un Invoice réel (Payment.invoiceId n'est
      jamais écrit par clientOnboarding.*) ni recalculé/vérifié contre le
      paiement réellement enregistré côté invoiceService.addPayment — un
      ADMIN/MANAGER peut définir status:"PAID" avec un amountPaid
      arbitraire, affiché comme fait acquis au CLIENT
      (ClientOnboardingPage.tsx), sans aucune garantie que ce paiement
      existe réellement dans le registre financier
    perimetre: 4.3-onboarding
    regle_violee: >
      Cohérence attendue entre l'affichage client d'un statut de paiement
      et la réalité du registre financier (Invoice/Payment réels gérés par
      invoiceService.addPayment, RG-008/RG-012) — aucune règle métier
      explicite dans REFERENTIEL.md ne couvre ce Payment d'onboarding
      spécifiquement, ce qui est en soi le symptôme : un champ financier
      affiché au client existe sans qu'aucune règle ne le gouverne.
    classe: invariant-financier-absent
    gravite: eleve
    statut: resolu
    critere_de_resolution: >
      Une décision du porteur du projet tranche l'intention de ce champ
      (parmi : (a) le lier réellement à Invoice via invoiceId et ne
      permettre status:"PAID" que si un Payment réel existe côté
      invoiceService pour le montant correspondant ; (b) le documenter
      explicitement comme un simple indicateur manuel de suivi, sans
      valeur probante financière, avec un avertissement UI en ce sens ;
      (c) le retirer si redondant avec le flux réel acompte/solde de 4.4).
      Ne pas trancher seul (CLAUDE.md « réparer n'est pas développer » —
      créer le rattachement à Invoice serait un développement, pas une
      correction). Décision du porteur (AskUserQuestion, session du
      2026-07-30) : option (a).
    detecte_le: "2026-07-30"
    source: >
      Lecture intégrale de server/src/validators/clientOnboarding.validator.ts
      (paymentBody : amount/amountPaid/status tous optionnels et
      indépendants, aucune contrainte croisée), grep confirmant
      Payment.invoiceId n'est jamais référencé par clientOnboarding.*
      (server/src/services/, server/src/repositories/), et
      client/src/features/client-onboarding/ClientOnboardingPage.tsx
      (affichage direct amount/amountPaid/status au CLIENT sans aucune
      réserve).
    confiance: haute
    note: >
      Impact réel dépend de l'usage effectif du champ en production (0
      client actif à ce jour) — mais le risque métier est réel dès le
      premier client si ce statut sert de référence pour la suite du
      pipeline d'onboarding (ex. déblocage d'étapes suivantes) sans
      correspondre à un encaissement réellement constaté par
      invoiceService.
      Corrigé (session du 2026-07-30) : amount/amountPaid/status retirés
      de paymentBody (validator, serveur ET shared/) — deadline reste seul
      champ saisissable. clientOnboardingService.createPayment/
      updatePayment dérivent désormais ces 3 champs (+ invoiceId) depuis
      la vraie facture DEPOSIT du projet
      (prisma.invoice.findFirst({ projectId, invoiceType: "DEPOSIT" }),
      même pattern que project.service.ts#clientApprove) à chaque
      création/mise à jour — jamais depuis l'entrée appelant.
      mapInvoiceStatusToPaymentStatus mappe InvoiceStatus → PaymentStatus
      (PAID/PARTIAL/sinon UNPAID). Nouveau
      server/test/clientOnboardingPaymentDerivedFromInvoice.test.ts (4
      cas, appelle réellement clientOnboardingService contre une base
      migrée — dérivation initiale, PARTIAL, PAID, resynchronisation sur
      updatePayment après changement de l'invoice), enregistré dans
      test/run-all.test.ts. `verifie: test`.

  - id: SEC-025
    titre: >
      clientOnboardingService/repository — updateOnboarding, deleteOnboarding,
      updateStep, addStep et les 14 méthodes create/update de sous-entité
      (Contract, Payment, Questionnaire, Specifications, Kickoff,
      Production, Delivery) ne reçoivent ni ne vérifient jamais
      managerServiceId — seules les 3 méthodes de lecture (findAll/
      findById/findByProjectId) scopent par pôle ; un MANAGER peut
      créer/modifier un contrat ou un paiement d'onboarding de n'importe
      quel client, hors de son pôle
    perimetre: 4.3-onboarding
    regle_violee: >
      RG-002 (Rattachement mission → pôle → associé) — un Manager (associé)
      ne peut créer, lire ou modifier des ressources d'un projet/client que
      dans son propre pôle.
    classe: idor-scope-manque
    gravite: bloquant
    statut: resolu
    critere_de_resolution: >
      Un test réel appelle chacune des méthodes d'écriture concernées
      (updateOnboarding, deleteOnboarding, updateStep, addStep,
      create/updateContract, create/updatePayment,
      create/updateQuestionnaire, create/updateSpecifications,
      create/updateKickoff, create/updateProduction,
      create/updateDelivery) avec un scope MANAGER dont le serviceId
      diffère de celui du projet/client propriétaire de l'onboarding
      ciblé, et observe un rejet (403/404) au lieu d'un succès — pour
      chacune.
    detecte_le: "2026-07-30"
    source: >
      Lecture intégrale de server/src/services/clientOnboarding.service.ts,
      server/src/repositories/clientOnboarding.repository.ts,
      server/src/controllers/clientOnboarding.controller.ts,
      server/src/routes/clientOnboarding.routes.ts (comparaison entre les
      3 méthodes de lecture, qui reçoivent bien managerServiceId et
      filtrent via project.serviceId — commentaire "previously unscoped"
      confirmant une correction antérieure sur ce point précis côté
      lecture seule — et les 18 méthodes d'écriture, qui ne reçoivent que
      userClientId).
    confiance: haute
    note: >
      Toutes les routes d'écriture (POST/PUT sur onboarding, step,
      contract, payment, questionnaire, specifications, kickoff,
      production, delivery) sont authorize("ADMIN","MANAGER"[,"CLIENT"])
      + requirePermission("client-onboarding", <action>) — la garde RBAC
      granulaire passe, mais aucun scope de pôle n'est jamais revérifié
      derrière elle, contrairement au pattern assertProjectInScope déjà
      établi ailleurs (task.service.ts, projectMeeting.service.ts,
      projectTemplate.service.ts, timeEntry.service.ts — SEC-020).
      Gravité bloquant (pas seulement eleve) car les entités concernées
      incluent Contract et Payment — des documents contractuels et
      financiers, pas seulement des métadonnées de suivi.
      Corrigé (session du 2026-07-30) : managerServiceId ajouté à
      updateOnboarding, updateStep, addStep et aux 14 méthodes
      create/update de sous-entité (repository + service + contrôleur,
      pattern identique à userClientId déjà en place — where.project ou
      where.onboarding.project/onboardingStep.onboarding.project selon la
      profondeur de relation). deleteOnboarding non modifié (route
      ADMIN-only, aucun MANAGER ne l'atteint). Nouveau
      server/test/clientOnboardingWriteScopeManager.test.ts (9 cas,
      appelle réellement clientOnboardingService contre une base migrée —
      onboarding, step, contract, payment, ADMIN non scopé), enregistré
      dans test/run-all.test.ts. `verifie: test`.
