      avec un token fraîchement émis et valide — constaté en conditions
      réelles (déconnexion puis reconnexion immédiate, bloqué ~15 min)
    perimetre: 4.14-auth
    statut: resolu
    gravite: eleve
    classe: revocation-token-trop-large-sub-sans-jti
