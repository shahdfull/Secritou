# Registre des anomalies — Secritou
#
# Ce fichier fait partie du registre éclaté (voir CLAUDE.md § « Procédure
# d'audit obligatoire »). Schéma par anomalie : id, titre, perimetre,
# regle_violee, classe, gravite, statut, critere_de_resolution, detecte_le,
# source, confiance, note.
# Ne jamais reformuler un titre existant — citer l'ID.
#
# Registre remis à zéro le 2026-07-27 (décision explicite du porteur du
# projet) : l'historique réel (234 anomalies migrées depuis l'ancien
# ANOMALIES.yaml) est archivé sur la branche locale
# archive/anomalies-avant-reset (commit 3c03297), pas perdu — seulement
# retiré de ce fichier pour repartir avec un registre vide.

dernier_id: SEC-024
anomalies:
  - id: SEC-023
    titre: >
      .github/workflows/ci.yml et backup.yml référencent actions/checkout@v4,
      actions/setup-node@v4, actions/upload-artifact@v4 par tag mutable,
      jamais par SHA de commit — écart explicitement documenté par le
      commentaire MED-1 dans ci.yml mais jamais corrigé ; dependabot.yml
      maintiendrait des SHA épinglés à jour s'ils existaient, mais ne les
      crée pas rétroactivement
    perimetre: transverse
    statut: resolu
    gravite: moyenne
    classe: ci-action-non-epinglee

  - id: SEC-024
    titre: >
      backup.yml se connecte en SSH à l'hôte de production avec
      -o StrictHostKeyChecking=no, désactivant toute vérification de la
      clé d'hôte — expose la connexion à une attaque MITM sur le chemin
      SSH vers le serveur de sauvegarde
    perimetre: transverse
    statut: ouvert
    gravite: moyenne
    classe: ssh-host-key-non-verifiee

  - id: SEC-022
    titre: >
      documentService.update/createVersion n'appellent jamais
      documentRepository.findById avec un viewer scopé — un MANAGER peut
      modifier ou créer une nouvelle version de n'importe quel document
      (nom, titre, tags, accessLevel) hors de son pôle, alors que
      getById/getDownloadUrl vérifient déjà correctement ce même scope via
      where.client.projects.some.serviceId
    perimetre: 4.2-projets
    statut: resolu
    gravite: eleve
    classe: idor-scope-manque

  - id: SEC-020
    titre: >
      timeEntry.service.ts (create/list/summary/mySummary) ne vérifie jamais
      que le projet appartient au pôle du MANAGER appelant — seul
      task.service.ts/projectMeeting.service.ts/projectTemplate.service.ts
      appellent assertProjectInScope, timeEntry.service.ts non
    perimetre: 4.2-projets
    statut: resolu
    gravite: bloquant
    classe: idor-scope-manque

  - id: SEC-021
    titre: >
      timeEntryService.create ne vérifie pas que taskId appartient bien à
      l'assigneeId du FREELANCER appelant (seul le rattachement du taskId au
      projectId est vérifié) — un FREELANCER staffé sur un projet peut
      journaliser du temps sur la tâche d'un collègue du même projet
    perimetre: 4.2-projets
    statut: resolu
    gravite: moyenne
    classe: idor-scope-manque

  - id: SEC-001
    titre: >
      GET /invoices/:id/credit-notes ne vérifie aucun scope de pôle pour
      MANAGER — IDOR sur la liste des avoirs d'une facture hors pôle
    perimetre: 4.4-facturation
    statut: resolu
    gravite: moyenne
    classe: idor-scope-manque

  - id: SEC-002
    titre: >
      Le PDF d'une facture de solde (BALANCE) est généré avec le gabarit
      "Facture d'acompte" / "Acompte 30 %" — affiché incohérent avec le
      titre réel de la facture (RG-004b)
    perimetre: 4.4-facturation
    statut: resolu
    gravite: moyenne
    classe: incoherence-affichage-stockage

  - id: SEC-003
    titre: >
      invoiceService.update (ADMIN, modifie amount/title/dueDate/currency
      sur une facture DRAFT) n'écrit aucune entrée AuditLog
    perimetre: 4.4-facturation
    statut: resolu
    gravite: moyenne
    classe: audit-log-manquant

  - id: SEC-004
    titre: >
      Le scope MANAGER de ServiceRequest (via client.projects.some.serviceId)
      expose toutes les demandes d'un client multi-pôle à chaque pôle où il a
      un projet, y compris les commentaires internes isInternal
    perimetre: 4.6-portail-client
    statut: resolu
    gravite: moyenne
    classe: idor-scope-approxime

  - id: SEC-005
    titre: >
      Aucun des 4 services du portail client (clientPortal, approval,
      serviceRequest, customQuestion) n'écrit jamais dans AuditLog
    perimetre: 4.6-portail-client
    statut: resolu
    gravite: mineure
    classe: audit-log-manquant

  - id: SEC-006
    titre: >
      Aucun endpoint ni interface ne permet d'assigner ou de modifier le
      serviceId (pôle) d'un utilisateur MANAGER — le champ dont dépend tout
      le scoping par pôle audité sur les modules 4.1/4.2/4.4/4.6 n'est
      jamais écrit ailleurs qu'en base directement
    perimetre: 4.14-auth
    statut: resolu
    gravite: majeure
    classe: capacite-produit-manquante

  - id: SEC-007
    titre: >
      Aucun chemin API réel ne permet de retirer l'assigneeId d'une Task
      (mettre à null) — updateTask ne peut donc jamais faire franchir le
      seuil "≥1 freelancer assigné" → "0" par retrait d'assignation, ce qui
      laisse RG-005-bis (recalcul auto de split de commission) non testable
      sur cette direction précise du seuil
    perimetre: 4.5-commissions
    statut: resolu
    gravite: mineure
    classe: capacite-produit-manquante

  - id: SEC-008
    titre: >
      GET /users/me (userService.getMe) retourne 500 en base de dev réelle
      — la table AppSetting (migration RG-020) n'a jamais été appliquée,
      alors que getMe l'interroge désormais à chaque appel
    perimetre: 4.14-auth
    statut: resolu
    gravite: majeure
    classe: migration-non-appliquee

  - id: SEC-009
    titre: >
      La suite user.service.test.ts échoue sur 2 fronts distincts après
      l'ajout du chemin d'écriture serviceId (SEC-006) : un test RG-021
      préexistant appelle updateUser(..., "service-1", ...) sans mocker
      prisma.service.findUnique (404 réel "Service not found"), et le
      describe SEC-006 lui-même plante à l'initialisation
      (mock.method(prisma.service, "findUnique", ...) reçoit "findUnique"
      undefined), annulant 6 tests de la suite
    perimetre: 4.14-auth
    statut: resolu
    gravite: majeure
    classe: test-casse-par-changement-non-synchronise

  - id: SEC-010
    titre: >
      gdprErasure.test.ts — l'anonymisation d'un Client avec facture
      s'exécute (mode "anonymized" confirmé) mais l'assertion sur
      Invoice.amount.toString() attend "100.000" et obtient "100"
    perimetre: transverse
    statut: resolu
    gravite: mineure
    classe: assertion-format-decimal

  - id: SEC-011
    titre: >
      Le bouton "Soumettre le brief" de ClientBriefPage.tsx n'est jamais
      désactivé pour un champ requis vide (seul submitMutation.isPending
      le désactive) — un client peut soumettre un brief incomplet malgré
      la validation par étape affichée à l'écran
    perimetre: 4.6-portail-client
    statut: resolu
    gravite: moyenne
    classe: validation-cote-client-incomplete

  - id: SEC-012
    titre: >
      serviceRequestService.test.ts (describe "adminUpdateServiceRequest
      status transitions") appelle makeRequest(client.id, title) avec 2
      arguments au lieu de 3 (clientId, projectId, title) — projectId
      reçoit la chaîne du titre, causant un "Project not found" sur 4 tests
      de transition
    perimetre: 4.6-portail-client
    statut: resolu
    gravite: mineure
    classe: bug-fixture-test

  - id: SEC-013
    titre: >
      2 tests écrits pour SEC-004 (exact scope ServiceRequest) sont
      incohérents avec le code qu'ils testent : serviceRequestService.test.ts
      teste un scope "no access" avec le même serviceId que celui du projet
      créé (self-contradictoire) ; searchScope.test.ts crée un ServiceRequest
      sans projectId alors que search.repository.ts scope désormais par
      serviceId/project.serviceId exact (l'un des deux doit être renseigné
      pour matcher)
    perimetre: 4.6-portail-client
    statut: resolu
    gravite: mineure
    classe: bug-fixture-test

  - id: SEC-014
    titre: >
      ApprovalsClientPage.tsx (approbation client, RG-026 Niveau 2)
      réimplémente localement le contrat de confirmation renforcée au lieu
      d'utiliser le composant partagé ConfirmationDialog.tsx utilisé par
      les 6 autres actions Niveau 2
    perimetre: 4.6-portail-client
    statut: ouvert
    gravite: mineure
    classe: incoherence-factorisation-ui

  - id: SEC-015
    titre: >
      REFERENTIEL.md §5 RG-006 à RG-011 (base de calcul commission, cycle
      de vie paiement, cascade proposition, visibilité par associé) sont
      des définitions obsolètes — le code (commission.service.ts,
      task.service.ts, schema.prisma) a réutilisé silencieusement ces
      mêmes identifiants pour un régime de rémunération PER_TASK entier
      (payoutBudget, Task.payoutAmount, ProjectManagerFee, coefficient
      qualité) qui n'existe nulle part dans REFERENTIEL.md §5
    perimetre: 4.5-commissions
    statut: resolu
    gravite: eleve
    classe: incoherence-doc-code-rg-id

  - id: SEC-016
    titre: >
      SEC-007 marquée resolu alors que son critère de résolution exact
      (un test appelant réellement taskService.updateTask avec
      assigneeId:null et vérifiant le déclenchement de
      commissionService.recalcAutoSplit vers le seuil "0 freelancer") n'est
      pas rempli — le chemin de désassignation existe (UI + schéma + test
      de persistance) mais aucun test ne prouve le franchissement du seuil
      dans le sens descendant sur le split de commission
    perimetre: 4.5-commissions
    statut: resolu
    gravite: moyenne
    classe: critere-resolution-incomplet

  - id: SEC-017
    titre: >
      Dépendance circulaire creditNote.service.ts <-> invoice.service.ts
      (madge --circular, porte CI "Circular dependency check") — invoice.service.ts
      importe creditNoteService pour la cascade de trop-perçu, creditNote.service.ts
      importait assertInvoiceInScope depuis invoice.service.ts
    perimetre: transverse
    statut: resolu
    gravite: moyenne
    classe: dependance-circulaire

  - id: SEC-018
    titre: >
      lead.validator.ts écrase status: z.nativeEnum(LeadStatus).optional()
      par z.literal(LeadStatus.NEW).optional() — PUT /leads/:id rejette
      toute transition de statut autre que NEW, cassant le pipeline
      commercial (Kanban, convertLead) de bout en bout
    perimetre: 4.1-crm
    statut: resolu
    gravite: bloquant
    classe: regression-validation-zod

  - id: SEC-019
    titre: >
      proposal.controller.ts#createProposal appelle
      projectService.getProjectById(projectId, userId, "MANAGER",
      scope.userServiceId) avec 4 arguments positionnels — le serviceId
      (5e paramètre) reste undefined, neutralisant le filtre de scope
      MANAGER dans project.repository.ts#findById (where.serviceId:
      undefined est ignoré par Prisma) — un MANAGER peut créer une
      proposition liée à un projet d'un autre pôle
    perimetre: 4.1-crm
    statut: resolu
    gravite: bloquant
    classe: idor-scope-manque
