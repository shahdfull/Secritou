# Registre des anomalies — Secritou
#
# Ce fichier fait partie du registre éclaté (voir CLAUDE.md § « Procédure
# d'audit obligatoire »). Schéma par anomalie : id, titre, perimetre,
# regle_violee, classe, gravite, statut, critere_de_resolution, detecte_le,
# source, confiance, note.
# Ne jamais reformuler un titre existant — citer l'ID.
#
# Registre remis à zéro le 2026-07-27 (décision explicite du porteur du
# projet) : l'historique réel (234 anomalies migrées depuis l'ancien
# ANOMALIES.yaml) est archivé sur la branche locale
# archive/anomalies-avant-reset (commit 3c03297), pas perdu — seulement
# retiré de ce fichier pour repartir avec un registre vide.

dernier_id: SEC-112
anomalies:
  - id: SEC-112
    titre: >
      test/taskBulkActions.test.ts#"processes tasks concurrently, not
      sequentially" échoue de façon récurrente en CI sur des commits sans
      rapport avec le module tâches — 4 échecs consécutifs observés le
      2026-08-14 sur 2 commits successifs (31834991818, 31835959744),
      tous avec le même symptôme : ratio juste au-dessus du seuil 6x
      (6.1x/6.2x/6.5x), jamais un écart massif. Le seuil avait déjà été
      élargi une fois (4x -> 6x, 2026-07-23, cf. commentaire du test qui
      cite "SEC-097" — un ID appartenant en réalité à une tout autre
      anomalie transverse dans le registre actuel, cf. note) après un
      flake réel similaire — la marge actuelle reste insuffisante face
      au bruit réel du runner GitHub Actions partagé.
    perimetre: 4.2-projets
    statut: ouvert
    gravite: mineure
    classe: test-timing-relatif-marge-insuffisante-ci-partage
  - id: SEC-111
    titre: >
      Job CI e2e rouge (run 31735502093, 2026-08-13, commit cd49909) sur
      e2e/ai-assistant-action-proposal.spec.ts — timeout 220s sur
      l'apparition du bouton "Confirmer" après une proposition de tâche
      par l'assistant IA (qwen2.5:3b-instruct sur runner CPU-only
      partagé), échoué à la fois au run initial et au retry automatique.
      Écarté comme régression du commit lui-même : le commit cd49909 ne
      touche que anomalies/_index.yaml et anomalies/transverse.yaml
      (contenu YAML de documentation, aucun fichier applicatif) — le run
      précédent immédiat (31719896982, commit 3e90945, changements
      applicatifs réels sur les mêmes zones du produit) avait ce même
      job e2e vert. Le fichier de test documente lui-même sa propre
      fragilité (commentaire : modèle 3B peu fiable pour enchaîner deux
      appels d'outils, "deliberately NOT part of a shared parallel run").
    perimetre: 4.11-ia
    statut: resolu
    gravite: mineure
    classe: e2e-flaky-llm-reel-timing-ci
    note_resolution: >
      Résolu le 2026-08-14 par la voie (a) du critere_de_resolution : re-run
      réel du job e2e en échec sur le run/commit d'origine (run 31735502093,
      commit cd49909, aucun changement de code), 2 tentatives distinctes,
      toutes deux vertes — tentative 1 : success, 2026-08-14T18:41:54Z à
      18:50:07Z (~8min13s) ; tentative 2 : success, 2026-08-14T18:50:42Z à
      18:57:11Z (~6min29s). Conforme à l'exigence de la note existante
      ("un flaky qui repasse vert au 2e essai reste un flaky, pas un
      non-problème") : 2 tentatives comptées, pas une seule. Corroboré
      (sans que cela ait suffi seul) par les 4 runs déjà verts sur des
      commits ultérieurs avec code applicatif réel changé
      (31736741864, 31740433668, 31784610142, 31785320569). Détail complet
      dans anomalies/4.11-ia.yaml.
  - id: SEC-110
    titre: >
      Distinct de SEC-082 (résolu) : SEC-082 vérifie qu'un abandon
      client PROPRE (fetch AbortController.abort(), ex. bouton annuler
      SEC-092) coupe bien le tour Ollama via res.on("close"). Testé
      réellement le 2026-08-13 avec une coupure RÉSEAU BRUTE (proxy TCP
      local, socket.destroy() sur la connexion déjà établie, sans fetch
      abort côté client) pendant un tour SSE IA en cours : le tour
      Ollama continue jusqu'à sa fin naturelle et le message ASSISTANT
      complet (2100 caractères) est persisté normalement, comme si la
      connexion n'avait jamais été coupée — res.on("close") ne s'est
      pas déclenché sur ce type de coupure précis. Aucune corruption de
      donnée (même garantie que SEC-082 : persistance atomique et
      tardive), mais gaspillage du seul worker Ollama disponible sur
      une réponse qu'aucun client ne recevra, et incohérence UX
      (réponse existante en base, invisible pour l'utilisateur qui a
      perdu sa connexion)
    perimetre: 4.11-ia
    statut: resolu
    gravite: moyenne
    classe: sse-sans-annulation-liee-a-la-connexion
    note_resolution: >
      Résolu le 2026-08-14 (commit eef6dbf, CI verte confirmée run
      31784610142, 8/8 jobs dont server/e2e). Correctif : heartbeat SSE
      (": ping\n\n" toutes les 5s, aiConversation.controller.ts) force
      une tentative d'écriture régulière pendant un tour en cours, ce
      qui fait surfacer une coupure TCP brute en un intervalle plutôt
      qu'à la prochaine écriture naturelle (potentiellement jamais avant
      la fin du tour). res.on("error") écouté en plus de res.on("close").
      Test réel dans server/test/aiConversationRawNetworkDrop.test.ts
      (verifie: test — proxy TCP local + socket.destroy() sur la
      connexion déjà établie, sans FIN/RST vers le serveur, pendant un
      vrai tour SSE) : prouve abortController.signal.aborted === true et
      0 message ASSISTANT persisté après la coupure. Détail complet dans
      anomalies/4.11-ia.yaml.
  - id: SEC-109
    titre: >
      Collision d'ID découverte le 2026-08-12 : REFERENTIEL.md §7
      (entrée du 2026-07-17) documente sous "SEC-024" un bug
      executiveMetricsRepository.getAll (RiskItem déclarait 6 types mais
      n'en produisait réellement que 3 — PROJECT_CRITICAL/STALE_PROJECT
      jamais poussés dans risks[], CONTRACT_EXPIRING sans base réelle
