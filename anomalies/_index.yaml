      fonctionnel ciblé. CORRIGÉ (commit 15eb6d9) : enregistrement
      centralisé dans client/src/lib/agGridModules.ts +
      enableDevValidations() actif en dev + 2 tests qui détectent
      réellement la régression (vérifiés rouge sans le module, vert
