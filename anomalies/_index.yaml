  - id: SEC-024
    titre: >
      backup.yml se connecte en SSH à l'hôte de production avec
      -o StrictHostKeyChecking=no, désactivant toute vérification de la
      clé d'hôte — expose la connexion à une attaque MITM sur le chemin
      SSH vers le serveur de sauvegarde
    perimetre: transverse
    statut: ouvert
    gravite: moyenne
    classe: ssh-host-key-non-verifiee
    note: >
      Correctif déjà écrit et commité (0a26794, ancêtre de HEAD sur
      main) : StrictHostKeyChecking=no remplacé par UserKnownHostsFile
      + secret SSH_KNOWN_HOSTS — vérifié à l'instant, la ligne
      StrictHostKeyChecking=no n'existe plus dans backup.yml. `statut`
      volontairement laissé `ouvert` : le critère de résolution exige
      une vérification de bout en bout contre un vrai hôte SSH,
      impossible tant que SEC-217 reste vraie (aucun serveur de
      production). 2026-08-12 : job CI ssh-known-hosts-check ajouté
      (preuve fail-closed sans serveur réel) + checklist dupliquée dans
      REFERENTIEL.md §8.1 — statut inchangé. Détail complet dans
      anomalies/transverse.yaml#SEC-024.
    declencheur_reexamen: >
      Existence d'un vrai serveur de production (activation de
      SEC-217) permettant un run réel du step SSH de backup.yml —
      jamais par lecture seule du YAML.

