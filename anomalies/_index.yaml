# Registre des anomalies — Secritou
#
# Ce fichier fait partie du registre éclaté (voir CLAUDE.md § « Procédure
# d'audit obligatoire »). Schéma par anomalie : id, titre, perimetre,
# regle_violee, classe, gravite, statut, critere_de_resolution, detecte_le,
# source, confiance, note.
# Ne jamais reformuler un titre existant — citer l'ID.
#
# Registre remis à zéro le 2026-07-27 (décision explicite du porteur du
# projet) : l'historique réel (234 anomalies migrées depuis l'ancien
# ANOMALIES.yaml) est archivé sur la branche locale
# archive/anomalies-avant-reset (commit 3c03297), pas perdu — seulement
# retiré de ce fichier pour repartir avec un registre vide.

dernier_id: SEC-038
anomalies:
  - id: SEC-038
    titre: >
      commissionRepository.getAdminPartnerId() sélectionnait le "premier
      ADMIN" via findFirst sans orderBy (ordre non garanti par Postgres) —
      avec plusieurs comptes ADMIN (RG-021 les autorise explicitement),
      l'ADMIN recevant la part de commission dans
      recalcAutoSplit/resetToAutoSplit pouvait varier d'un appel à
      l'autre ; découvert via la flakiness de commissionService.test.ts/
      commissionAutoSplitTaskTrigger.test.ts (passent isolément, 6
      assertions échouent parfois quand d'autres fichiers de test
      créaient temporairement un second ADMIN en base pendant
      test/run-all.test.ts)
    perimetre: transverse
    statut: ouvert
    gravite: moyenne
    classe: selection-non-deterministe-entite-metier

  - id: SEC-037
    titre: >
      gdprService.eraseClient/eraseUser/eraseLead/eraseContactRequest
      exécutent chacune plusieurs écritures Prisma séquentielles (delete
      des leads liés puis delete du client ; ou update client puis update
      leads puis update portalUsers) sans les envelopper dans
      prisma.$transaction — un échec à mi-séquence (crash serveur, erreur
      réseau DB) laisse l'effacement RGPD partiellement appliqué (ex.
      leads supprimés mais Client encore présent, ou Client anonymisé
      mais comptes portail non révoqués/anonymisés)
    perimetre: transverse
    statut: resolu
    gravite: moyenne
    classe: ecriture-multi-etapes-sans-transaction

  - id: SEC-036
    titre: >
      clientPortalRepository.getOutstandingBalance (résumé du portail
      client, GET /client-portal/summary) calcule
      Math.max(Number(amount) - Number(amountPaid), 0) en arithmétique
      flottante brute sans roundMoney(), contrairement au même calcul déjà
      arrondi dans creditNote.service.ts#167 (roundMoney(Number(invoice.amount)
      - Number(invoice.amountPaid))) — le solde restant dû affiché au
      CLIENT peut porter un résidu de précision flottante (ex.
      1200.0000000000002 au lieu de 1200)
    perimetre: 4.6-portail-client
    statut: resolu
    gravite: mineure
    classe: arithmetique-flottante-brute-sur-montant

  - id: SEC-035
    titre: >
      aiConversationService.create/addMessage persistent le message USER
      (aiConversationRepository.addMessage) AVANT d'appeler callOllama —
      si l'appel échoue (timeout 120s, Ollama indisponible), l'exception
      remonte telle quelle au client (5xx) mais le message USER reste
      durablement enregistré sans réponse ASSISTANT associée ; un client
      qui renvoie le même message après l'erreur crée un second message
      USER orphelin dans l'historique de la même conversation, aucun état
      « échoué » n'est jamais écrit
    perimetre: 4.11-ia
    statut: resolu
    gravite: mineure
    classe: ecriture-partielle-sans-etat-echec

  - id: SEC-034
    titre: >
      generateBriefSchema/generateTasksSchema (POST /ai/brief, POST
      /ai/tasks) valident context: z.record(z.any()) sans aucune limite de
      taille/profondeur — le payload part directement en
      JSON.stringify(contextData) vers Ollama (agentOrchestrator.service.ts),
      seul aiRateLimit (limite de fréquence) protège ce chemin, aucune
      limite de volume
    perimetre: 4.11-ia
    statut: resolu
    gravite: mineure
    classe: validation-entree-non-bornee

  - id: SEC-033
    titre: >
      personas.ts#getPersona retombe silencieusement sur le premier
      persona du Record (Object.values(personas)[0]) pour un id inconnu
      au lieu de retourner undefined/lever — actuellement non exploitable
      (les 2 seuls appelants, generateBrief/generateTasks, codent
      personaId en dur), mais un futur appelant passant un id utilisateur
      directement à getPersona exécuterait silencieusement le mauvais
      persona plutôt que d'échouer
    perimetre: 4.11-ia
    statut: resolu
    gravite: mineure
    classe: repli-silencieux-id-invalide

  - id: SEC-032
    titre: >
      @bull-board/api et @bull-board/express sont déclarées dans
      server/package.json (dependencies) mais jamais importées ni montées
      nulle part dans src/ — aucun dashboard d'observabilité BullMQ
      n'existe réellement malgré la dépendance présente
    perimetre: transverse
    statut: resolu
    gravite: mineure
    classe: dependance-non-utilisee

  - id: SEC-031
    titre: >
      executiveMetricsRepository.getAll — overdueGrowthMoM/pendingGrowthMoM
      recalculent le « snapshot du mois dernier » en filtrant sur le
      status ACTUEL de la facture (status: {in:[...]}), pas sur son état
      réel fin du mois dernier — une facture en retard fin du mois
      dernier mais payée depuis (status désormais PAID) disparaît aussi
      du snapshot passé, biaisant systématiquement la croissance affichée
      vers une amélioration factice à chaque paiement d'ancienne facture
    perimetre: 4.8-analytics
    statut: resolu
    gravite: moyenne
    classe: kpi-historique-non-reconstitue

  - id: SEC-030
    titre: >
      server/tsconfig.json n'inclut que "src/**/*.ts" — npm run typecheck
      (tsc --noEmit) ne vérifie jamais server/test/**, qui peut donc
      accumuler des erreurs de type réelles (constaté : deux appels
      obsolètes de clientOnboardingService.createPayment avec un shape
      retiré du type PaymentInput, jamais détectés) sans jamais faire
      échouer la porte CI typecheck ; les tests continuent de s'exécuter
      via tsx (qui strip les types sans les vérifier), masquant le défaut
    perimetre: transverse
    statut: resolu
    gravite: moyenne
    classe: typecheck-perimetre-incomplet

  - id: SEC-029
    titre: >
      Le modèle Payment de l'étape onboarding (amount/amountPaid/status)
      n'est jamais rattaché à un Invoice réel (Payment.invoiceId n'est
      jamais écrit par clientOnboarding.*) ni recalculé/vérifié contre le
      paiement réellement enregistré côté invoiceService.addPayment — un
      ADMIN/MANAGER peut définir status:"PAID" avec un amountPaid
      arbitraire, affiché comme fait acquis au CLIENT
      (ClientOnboardingPage.tsx), sans aucune garantie que ce paiement
      existe réellement dans le registre financier
    perimetre: 4.3-onboarding
    statut: resolu
    gravite: eleve
    classe: invariant-financier-absent

  - id: SEC-028
    titre: >
      gscConnectionService (startConnect/getStatus/disconnect/
      completeConnect) et metricSnapshotController#getClientMetrics ne
      vérifient jamais que le clientId appartient au pôle du MANAGER
      appelant — un MANAGER peut initier/consulter/déconnecter une
      connexion Search Console et lire les métriques de n'importe quel
      client, hors de son pôle
    perimetre: 4.8-analytics
    statut: resolu
    gravite: eleve
    classe: idor-scope-manque

  - id: SEC-027
    titre: >
      GET/POST /ratings/freelancers/:freelancerId (getRatings/addRating)
      ne scopent jamais par pôle pour MANAGER — un MANAGER peut lire ou
      créer une évaluation pour un freelance sans tâche dans son pôle
    perimetre: 4.7-freelances
    statut: resolu
    gravite: moyenne
    classe: idor-scope-manque

  - id: SEC-026
    titre: >
      GET /freelancers/:id (getFreelancerById) ne scope jamais par pôle
      pour MANAGER — freelancerService.getById n'a aucun paramètre de
      scope, contrairement à getAll (list) qui filtre déjà via
      user.tasks.some.project.serviceId ; un MANAGER peut lire par id
      direct le profil complet (hourlyRate inclus) d'un freelance sans
      tâche dans son pôle
    perimetre: 4.7-freelances
    statut: resolu
    gravite: eleve
    classe: idor-scope-manque

  - id: SEC-025
    titre: >
      clientOnboardingService/repository — updateOnboarding, deleteOnboarding,
      updateStep, addStep et les 14 méthodes create/update de sous-entité
      (Contract, Payment, Questionnaire, Specifications, Kickoff,
      Production, Delivery) ne reçoivent ni ne vérifient jamais
      managerServiceId — seules les 3 méthodes de lecture (findAll/
      findById/findByProjectId) scopent par pôle ; un MANAGER peut
      créer/modifier un contrat ou un paiement d'onboarding de n'importe
      quel client, hors de son pôle
    perimetre: 4.3-onboarding
    statut: resolu
    gravite: bloquant
    classe: idor-scope-manque

  - id: SEC-023
    titre: >
      .github/workflows/ci.yml et backup.yml référencent actions/checkout@v4,
      actions/setup-node@v4, actions/upload-artifact@v4 par tag mutable,
      jamais par SHA de commit — écart explicitement documenté par le
      commentaire MED-1 dans ci.yml mais jamais corrigé ; dependabot.yml
      maintiendrait des SHA épinglés à jour s'ils existaient, mais ne les
      crée pas rétroactivement
    perimetre: transverse
    statut: resolu
    gravite: moyenne
    classe: ci-action-non-epinglee

  - id: SEC-024
    titre: >
      backup.yml se connecte en SSH à l'hôte de production avec
      -o StrictHostKeyChecking=no, désactivant toute vérification de la
      clé d'hôte — expose la connexion à une attaque MITM sur le chemin
      SSH vers le serveur de sauvegarde
    perimetre: transverse
    statut: ouvert
    gravite: moyenne
    classe: ssh-host-key-non-verifiee

  - id: SEC-022
    titre: >
      documentService.update/createVersion n'appellent jamais
      documentRepository.findById avec un viewer scopé — un MANAGER peut
      modifier ou créer une nouvelle version de n'importe quel document
      (nom, titre, tags, accessLevel) hors de son pôle, alors que
      getById/getDownloadUrl vérifient déjà correctement ce même scope via
      where.client.projects.some.serviceId
    perimetre: 4.2-projets
    statut: resolu
    gravite: eleve
    classe: idor-scope-manque

  - id: SEC-020
    titre: >
      timeEntry.service.ts (create/list/summary/mySummary) ne vérifie jamais
      que le projet appartient au pôle du MANAGER appelant — seul
      task.service.ts/projectMeeting.service.ts/projectTemplate.service.ts
      appellent assertProjectInScope, timeEntry.service.ts non
    perimetre: 4.2-projets
    statut: resolu
    gravite: bloquant
    classe: idor-scope-manque

  - id: SEC-021
    titre: >
      timeEntryService.create ne vérifie pas que taskId appartient bien à
      l'assigneeId du FREELANCER appelant (seul le rattachement du taskId au
      projectId est vérifié) — un FREELANCER staffé sur un projet peut
      journaliser du temps sur la tâche d'un collègue du même projet
    perimetre: 4.2-projets
    statut: resolu
    gravite: moyenne
    classe: idor-scope-manque

  - id: SEC-001
    titre: >
      GET /invoices/:id/credit-notes ne vérifie aucun scope de pôle pour
      MANAGER — IDOR sur la liste des avoirs d'une facture hors pôle
    perimetre: 4.4-facturation
    statut: resolu
    gravite: moyenne
    classe: idor-scope-manque

  - id: SEC-002
    titre: >
      Le PDF d'une facture de solde (BALANCE) est généré avec le gabarit
      "Facture d'acompte" / "Acompte 30 %" — affiché incohérent avec le
      titre réel de la facture (RG-004b)
    perimetre: 4.4-facturation
    statut: resolu
    gravite: moyenne
    classe: incoherence-affichage-stockage

  - id: SEC-003
    titre: >
      invoiceService.update (ADMIN, modifie amount/title/dueDate/currency
      sur une facture DRAFT) n'écrit aucune entrée AuditLog
    perimetre: 4.4-facturation
    statut: resolu
    gravite: moyenne
    classe: audit-log-manquant

  - id: SEC-004
    titre: >
      Le scope MANAGER de ServiceRequest (via client.projects.some.serviceId)
      expose toutes les demandes d'un client multi-pôle à chaque pôle où il a
      un projet, y compris les commentaires internes isInternal
    perimetre: 4.6-portail-client
    statut: resolu
    gravite: moyenne
    classe: idor-scope-approxime

  - id: SEC-005
    titre: >
      Aucun des 4 services du portail client (clientPortal, approval,
      serviceRequest, customQuestion) n'écrit jamais dans AuditLog
    perimetre: 4.6-portail-client
    statut: resolu
    gravite: mineure
    classe: audit-log-manquant

  - id: SEC-006
    titre: >
      Aucun endpoint ni interface ne permet d'assigner ou de modifier le
      serviceId (pôle) d'un utilisateur MANAGER — le champ dont dépend tout
      le scoping par pôle audité sur les modules 4.1/4.2/4.4/4.6 n'est
      jamais écrit ailleurs qu'en base directement
    perimetre: 4.14-auth
    statut: resolu
    gravite: majeure
    classe: capacite-produit-manquante

  - id: SEC-007
    titre: >
      Aucun chemin API réel ne permet de retirer l'assigneeId d'une Task
      (mettre à null) — updateTask ne peut donc jamais faire franchir le
      seuil "≥1 freelancer assigné" → "0" par retrait d'assignation, ce qui
      laisse RG-005-bis (recalcul auto de split de commission) non testable
      sur cette direction précise du seuil
    perimetre: 4.5-commissions
    statut: resolu
    gravite: mineure
    classe: capacite-produit-manquante

  - id: SEC-008
    titre: >
      GET /users/me (userService.getMe) retourne 500 en base de dev réelle
      — la table AppSetting (migration RG-020) n'a jamais été appliquée,
      alors que getMe l'interroge désormais à chaque appel
    perimetre: 4.14-auth
    statut: resolu
    gravite: majeure
    classe: migration-non-appliquee

  - id: SEC-009
    titre: >
      La suite user.service.test.ts échoue sur 2 fronts distincts après
      l'ajout du chemin d'écriture serviceId (SEC-006) : un test RG-021
      préexistant appelle updateUser(..., "service-1", ...) sans mocker
      prisma.service.findUnique (404 réel "Service not found"), et le
      describe SEC-006 lui-même plante à l'initialisation
      (mock.method(prisma.service, "findUnique", ...) reçoit "findUnique"
      undefined), annulant 6 tests de la suite
    perimetre: 4.14-auth
    statut: resolu
    gravite: majeure
    classe: test-casse-par-changement-non-synchronise

  - id: SEC-010
    titre: >
      gdprErasure.test.ts — l'anonymisation d'un Client avec facture
      s'exécute (mode "anonymized" confirmé) mais l'assertion sur
      Invoice.amount.toString() attend "100.000" et obtient "100"
    perimetre: transverse
    statut: resolu
    gravite: mineure
    classe: assertion-format-decimal

  - id: SEC-011
    titre: >
      Le bouton "Soumettre le brief" de ClientBriefPage.tsx n'est jamais
      désactivé pour un champ requis vide (seul submitMutation.isPending
      le désactive) — un client peut soumettre un brief incomplet malgré
      la validation par étape affichée à l'écran
    perimetre: 4.6-portail-client
    statut: resolu
    gravite: moyenne
    classe: validation-cote-client-incomplete

  - id: SEC-012
    titre: >
      serviceRequestService.test.ts (describe "adminUpdateServiceRequest
      status transitions") appelle makeRequest(client.id, title) avec 2
      arguments au lieu de 3 (clientId, projectId, title) — projectId
      reçoit la chaîne du titre, causant un "Project not found" sur 4 tests
      de transition
    perimetre: 4.6-portail-client
    statut: resolu
    gravite: mineure
    classe: bug-fixture-test

  - id: SEC-013
    titre: >
      2 tests écrits pour SEC-004 (exact scope ServiceRequest) sont
      incohérents avec le code qu'ils testent : serviceRequestService.test.ts
      teste un scope "no access" avec le même serviceId que celui du projet
      créé (self-contradictoire) ; searchScope.test.ts crée un ServiceRequest
      sans projectId alors que search.repository.ts scope désormais par
      serviceId/project.serviceId exact (l'un des deux doit être renseigné
      pour matcher)
    perimetre: 4.6-portail-client
    statut: resolu
    gravite: mineure
    classe: bug-fixture-test

  - id: SEC-014
    titre: >
      ApprovalsClientPage.tsx (approbation client, RG-026 Niveau 2)
      réimplémente localement le contrat de confirmation renforcée au lieu
      d'utiliser le composant partagé ConfirmationDialog.tsx utilisé par
      les 6 autres actions Niveau 2
    perimetre: 4.6-portail-client
    statut: resolu
    gravite: mineure
    classe: incoherence-factorisation-ui

  - id: SEC-015
    titre: >
      REFERENTIEL.md §5 RG-006 à RG-011 (base de calcul commission, cycle
      de vie paiement, cascade proposition, visibilité par associé) sont
      des définitions obsolètes — le code (commission.service.ts,
      task.service.ts, schema.prisma) a réutilisé silencieusement ces
      mêmes identifiants pour un régime de rémunération PER_TASK entier
      (payoutBudget, Task.payoutAmount, ProjectManagerFee, coefficient
      qualité) qui n'existe nulle part dans REFERENTIEL.md §5
    perimetre: 4.5-commissions
    statut: resolu
    gravite: eleve
    classe: incoherence-doc-code-rg-id

  - id: SEC-016
    titre: >
      SEC-007 marquée resolu alors que son critère de résolution exact
      (un test appelant réellement taskService.updateTask avec
      assigneeId:null et vérifiant le déclenchement de
      commissionService.recalcAutoSplit vers le seuil "0 freelancer") n'est
      pas rempli — le chemin de désassignation existe (UI + schéma + test
      de persistance) mais aucun test ne prouve le franchissement du seuil
      dans le sens descendant sur le split de commission
    perimetre: 4.5-commissions
    statut: resolu
    gravite: moyenne
    classe: critere-resolution-incomplet

  - id: SEC-017
    titre: >
      Dépendance circulaire creditNote.service.ts <-> invoice.service.ts
      (madge --circular, porte CI "Circular dependency check") — invoice.service.ts
      importe creditNoteService pour la cascade de trop-perçu, creditNote.service.ts
      importait assertInvoiceInScope depuis invoice.service.ts
    perimetre: transverse
    statut: resolu
    gravite: moyenne
    classe: dependance-circulaire

  - id: SEC-018
    titre: >
      lead.validator.ts écrase status: z.nativeEnum(LeadStatus).optional()
      par z.literal(LeadStatus.NEW).optional() — PUT /leads/:id rejette
      toute transition de statut autre que NEW, cassant le pipeline
      commercial (Kanban, convertLead) de bout en bout
    perimetre: 4.1-crm
    statut: resolu
    gravite: bloquant
    classe: regression-validation-zod

  - id: SEC-019
    titre: >
      proposal.controller.ts#createProposal appelle
      projectService.getProjectById(projectId, userId, "MANAGER",
      scope.userServiceId) avec 4 arguments positionnels — le serviceId
      (5e paramètre) reste undefined, neutralisant le filtre de scope
      MANAGER dans project.repository.ts#findById (where.serviceId:
      undefined est ignoré par Prisma) — un MANAGER peut créer une
      proposition liée à un projet d'un autre pôle
    perimetre: 4.1-crm
    statut: resolu
    gravite: bloquant
    classe: idor-scope-manque
