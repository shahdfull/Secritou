      2026-07-17). Ce sujet est totalement distinct du SEC-024 du
      registre anomalies/*.yaml actuel (SSH backup.yml,
      StrictHostKeyChecking, ouvert depuis le 2026-07-30) et n'existait
      sous aucun ID dans anomalies/*.yaml — probablement un reliquat
      d'une numérotation antérieure à l'éclatement du registre
      (2026-07-27) jamais reporté. Enregistré ici sous un ID propre pour
      lever l'ambiguïté, sans toucher au texte de REFERENTIEL.md §7 (qui
      reste la source historique de la décision du porteur à l'époque).
    perimetre: 4.8-analytics
    statut: resolu
    gravite: mineure
    classe: registre-collision-id-referentiel
  - id: SEC-108
    titre: >
      19 fichiers appelaient chacun indépendamment
      ModuleRegistry.registerModules([AllCommunityModule]) pour AG Grid,
      sans point central — un module manquant (oubli lors d'un futur
      ajout de fonctionnalité) échoue TOTALEMENT SILENCIEUSEMENT :
