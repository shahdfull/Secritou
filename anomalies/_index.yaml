    perimetre: transverse
    statut: resolu
    gravite: elevee
    classe: echec-silencieux-registre-module-non-centralise
  - id: SEC-107
    titre: >
      write-excel-file (dépendance client, migration SEC-106) est
      maintenue par un mainteneur unique (catamphetamine) et ~20x
      moins téléchargée que les alternatives comparées lors de son
      adoption (602K/semaine vs 13,17M pour exceljs, 12,12M pour xlsx,
      mesuré le 2026-08-11) — risque de bus factor à moyen terme
      (abandon de la lib, CVE non patchée faute de mainteneur actif),
      pas un défaut de code actuel. Statut SURVEILLANCE introduit ici
      pour la première fois dans ce registre (5e statut, aucun
      précédent) — distinct de "gelé" (backlog d'audit reporté) : il
      s'agit d'un suivi actif d'un risque de dépendance externe, pas
      d'un travail reporté.
    perimetre: transverse
    statut: surveillance
    gravite: mineure
    classe: risque-dependance-mainteneur-unique
  - id: SEC-106
    titre: >
      La migration exceljs → write-excel-file (commit 692154f,
      2026-08-11) a été implémentée sur du code de production sans
      repasser par un rapport d'audit dédié pré-implémentation, alors
      que l'instruction explicite du porteur était "SANS l'implémenter
      avant ma validation". L'agent a traité la réponse du porteur à
      "Quelle suite pour exceljs ?" (choix de l'option write-excel-file
      parmi 3) comme une autorisation d'implémenter directement,
      alors que cette réponse ne portait que sur le choix de la
      bibliothèque candidate, pas sur un rapport d'audit final
      présentant le code de migration avant écriture. Le rapport montré
      au porteur est arrivé APRÈS l'écriture du fichier, pas avant.
    perimetre: transverse
    statut: resolu
    gravite: moyenne
    classe: implementation-sans-validation-prealable-explicite
  - id: SEC-105
    titre: >
      Flaky CI (pas une régression) sur e2e/sonner-palette-contrast.spec.ts
      (SEC-100) : le job e2e du commit 2391409 (2026-08-10T16:07:46Z,
      avant cette session) avait échoué sur 2 tests axe-core
      (toast.success ET toast.error). CONFIRMÉ FLAKY, pas une régression
      réelle : 10/10 passes en local (Windows) sans aucun changement de
      code, ET rerun du même job sur le même commit en environnement CI
      réel (Ubuntu/headless, run 31407302524) repassé success. Cause
      probable : scan axe-core capturé pendant la transition CSS
      d'entrée du toast (pas d'attente de stabilisation après
      toBeVisible() dans le test), pas un défaut de palette — les 2
      couleurs mesurées lors de l'échec ne correspondaient à aucune
      palette stable connue (ni Tailwind du code, ni défaut Sonner) et
      variaient entre les 2 tentatives d'un même test.
    perimetre: transverse
    statut: resolu
    gravite: moyenne
    classe: regression-ci-contraste-non-expliquee
  - id: SEC-104
    titre: >
      SEC-095/SEC-103 ont été marquées resolu (commit f2e1c01,
      2026-08-10) sans validation explicite du porteur sur le contenu
      chiffré du rapport Lighthouse — la seule confirmation obtenue
      portait sur le CHOIX DE MÉTHODE ("Comment veux-tu documenter ces
      résultats ?" → "Je rédige la mise à jour complète"), pas sur les
      DONNÉES elles-mêmes (scores par page, chiffres LCP). L'agent a
      traité cette réponse comme une validation de contenu, alors que
      CLAUDE.md exige un rapport avant de trancher resolu et que le
      porteur avait explicitement demandé "je déciderai ensuite quoi
      corriger" plus tôt dans la même session. Les données se sont
      révélées exactes a posteriori (vérifié le 2026-08-10 : tableau
      complet 4 scores × 8 pages reconstitué depuis les fichiers
      lhr/*.json horodatés 17:44-17:57, fetchTime interne cohérent,
      lighthouseVersion 13.4.1 confirmée) — mais l'exactitude a posteriori
      ne couvre pas l'absence de validation préalable au moment du commit.
    perimetre: transverse
    statut: resolu
    gravite: moyenne
    classe: statut-resolu-sans-validation-explicite-du-contenu
  - id: SEC-103
    titre: >
      Le texte de SEC-095 affirme qu'un run Lighthouse réel a eu lieu le
      2026-08-03 sur 8 pages et a contribué à la découverte de
      SEC-098/099/100, sans preuve trouvable pour cette affirmation
      précise — aucun rapport Lighthouse archivé, aucun fichier de
      résultats dans le dépôt, et les commits datés de ce jour
      (8e9da93 notamment) ne documentent que des corrections
      axe-core/contraste, aucun score Lighthouse. Un artifact externe
      retrouvé ("Secritou — Clôture Phase 2 QA", daté 2026-08-01)
      indique au contraire explicitement que l'audit Lighthouse complet
      n'a jamais été lancé faute de temps dans cette session. Distinct de
      SEC-101 (absence de vérification automatique statut/preuve) : ici
      la preuve elle-même de l'affirmation factuelle est introuvable, pas
      seulement non rapprochée automatiquement d'un statut.
    perimetre: transverse
    statut: resolu
    gravite: moyenne
    classe: registre-affirmation-non-sourcee
    note: >
      Résolu le 2026-08-10 : l'affirmation non sourcée a été retirée du
      texte de SEC-095 (remplacée par une mention NON VÉRIFIABLE puis par
      les données du run réel du 2026-08-10, qui rend la question sans
      objet). Détail complet dans anomalies/transverse.yaml#SEC-103.
  - id: SEC-102
    titre: >
      authRateLimit (server/src/middlewares/rateLimit.middleware.ts, 30
      requêtes/15min, compteur en mémoire partagé par IP, sans exception
      pour l'environnement de test) est partagé par TOUS les fichiers
      server/test/*.http.test.ts d'une même exécution
      npm run test:coverage --workspace=server — 24+ appels réels à
      POST /auth/login cumulés dans server/test/run-all.test.ts avant
      même l'ajout du fichier SEC-075/077, chaque nouveau fichier de
      test HTTP rapproche silencieusement la suite du seuil de 30.
      Découvert en poussant le commit SEC-075/077 (44b4573) : le job CI
      "server" a échoué (429 confirmé par diagnostic temporaire) sur
      aiConversationStreamCancellation.test.ts, un fichier totalement
      sans rapport avec invoice.repository.ts/invoice.service.ts — testé
      et confirmé en isolation (passe seul) et par un test de contrôle
      strict (repasse au vert sur le commit parent sans le nouveau
      fichier de test).
    perimetre: transverse
    regle_violee: >
      Un test de non-régression réel ne doit jamais échouer par
      accumulation d'un état global partagé entre fichiers indépendants
      — le rate-limit de sécurité (légitime en production) n'a aucune
      échappatoire dédiée à la suite de tests CI, contrairement à
      sensitiveWriteRateLimit/frequentInteractionRateLimit qui en ont
      déjà une (E2E_RELAXED_RATE_LIMITS, SEC-212).
    classe: rate-limit-partage-sans-echappatoire-test
    gravite: moyenne
    statut: resolu
    note_resolution: >
      CI verte confirmée : run GitHub Actions 30953695348 sur
      2af0a82c11c1e85b34b9bf87196b0ebaa9af857d, tous les jobs success
      (dont "server", celui où l'échec s'était produit).
    critere_de_resolution: >
      authRateLimit dispose d'un opt-in explicite et étroit (jamais actif
      en production, jamais élargi au-delà de sa propre limite) activable
      pour la suite de tests CI, sans élargir aucune autre limite déjà
      couverte par un mécanisme distinct testé (taskUpdateRateLimit.test.ts
      vérifie que sensitiveWriteRateLimit/frequentInteractionRateLimit
      restent à leur valeur réelle dans ce même job — un correctif qui
      les élargirait aussi casserait cette preuve). Vérifié par un run
      complet local (npx tsx --test test/run-all.test.ts) avec le flag
      actif : 787 pass, 1 fail restant (SEC-069, pré-existant et
      indépendant, confirmé par un test de contrôle sans le flag ni le
      nouveau fichier de test).
    detecte_le: "2026-08-04"
    source: >
      Échec CI réel sur le run 30947979863 (commit 44b4573, job "server"),
      confirmé par un diagnostic temporaire (console.error retiré après
      capture) montrant "429 Too many authentication attempts" sur le
      login de aiConversationStreamCancellation.test.ts. Cause isolée par
      test de contrôle : checkout du commit parent (1ed4366) sans le
      nouveau fichier invoiceFkAndOrderByGuards.http.test.ts fait
      repasser ce même test au vert sur un run local identique.
    confiance: haute
    note: >
      E2E_RELAXED_RATE_LIMITS (SEC-212) existait déjà mais élargit aussi
      sensitiveWriteRateLimit/frequentInteractionRateLimit — l'activer
      globalement sur le job "server" a été testé et rejeté (casse
      taskUpdateRateLimit.test.ts, qui asserte que ces deux limites
      restent à leur valeur réelle dans ce job). Nouveau flag
      E2E_RELAXED_AUTH_RATE_LIMIT introduit spécifiquement pour
      authRateLimit seul, activé uniquement dans le bloc env: du job
      "server" (pas "e2e", pas de portée globale). Corrige au passage un
      message d'erreur de garde en production (env.ts) qui mentionnait
      à tort authRateLimit sous l'ancien flag E2E_RELAXED_RATE_LIMITS,
      alors que ce dernier ne l'a jamais réellement couvert dans le code.
  - id: SEC-101
    titre: >
      Le registre n'a aucune vérification automatique qui rapproche un
      statut "resolu" déclaré d'une preuve réelle (commit cité, CI verte
      associée) au moment où le statut change — la seule garantie était
      la discipline manuelle de l'agent qui fait l'édition YAML. Pattern
      confirmé sur 5 anomalies distinctes dans cette seule mission :
      SEC-095/SEC-096 (statut jamais mis à jour après dégel/correctif
      réel, découvert le 2026-08-03) puis SEC-066/SEC-071/SEC-072
      (statut resolu écrit dans anomalies/transverse.yaml et
      anomalies/4.11-ia.yaml par des commits antérieurs — d8a652e46 et
      7c0ab6e — mais jamais répercuté dans anomalies/_index.yaml,
      découvert le 2026-08-04). CORRIGÉ (commits 62b8bb4/CI verte run
      31650058307) : job CI dédié anomaly-registry-check
      (scripts/check-anomaly-registry.mjs) vérifie automatiquement (a)
      la cohérence de statut entre _index.yaml et chaque fichier de
      détail par périmètre, dans les deux sens, et (b) que tout SHA de
      commit cité par une anomalie resolu existe réellement dans
      l'historique git.
    perimetre: transverse
    statut: resolu
    gravite: moyenne
    classe: registre-statut-resolu-sans-verification-automatique
  - id: SEC-100
    titre: >
      Le wrapper Toaster (client/src/components/ui/sonner.tsx) active
      richColors (App.tsx:45) sans définir de classNames pour les
      couleurs sémantiques success/error/info (toastOptions.classNames ne
      couvre que toast/description/actionButton/cancelButton génériques)
      — Sonner applique donc ses propres couleurs par défaut (palette
      HSL intégrée à la librairie, non alignée avec les tokens du projet)
      à TOUT toast utilisant toast.success/error/info. Les 3 palettes
      mesurent toutes sous le seuil WCAG 1.4.3 (4.5:1), à un écart
      cohérent et faible : success #008a2e sur #ecfdf3 = 4.26:1, info
      #0973dc sur #f0f8ff = 4.35:1, error #e60000 sur #fff0f0 = 4.35:1.
      data-description hérite de la même couleur que le titre
      (color: inherit sous richColors), donc le texte descriptif des
      toasts est également concerné, pas seulement le titre. Portée
      confirmée par grep : 115 appels toast.* dans client/src (80
      toast.error, 33 toast.success, 2 toast.info) — aucun usage de
      toast.warning/loading/promise. Défaut à la source (un seul point
      de configuration non stylisé), pas 115 défauts isolés — un
      correctif centralisé dans sonner.tsx corrigerait potentiellement
      tous les usages en un seul point, mais aucune stratégie de
      correction n'est encore tranchée à ce stade (rapport seul, aucune
      proposition de fix) — depuis résolu par un correctif centralisé
      dans sonner.tsx, validé par le porteur avant implémentation.
    perimetre: transverse
    statut: resolu
    gravite: elevee
    classe: contraste-composant-tiers-non-stylise-large-portee
  - id: SEC-099
    titre: >
      GrowthBadge (client/src/features/dashboard/DashboardPage.tsx:78-87)
      — indicateur de croissance/décroissance affiché sur les KPI du
      tableau de bord exécutif (ex. "Trésorerie MTD", HeroStat ligne
      244-249 ; usages HeroStat lignes 244/251/257 sur fond --card
      blanc, CompactStat lignes 310/316/322/327 sur fond --background) —
      utilise text-red-500 pour une valeur négative, mesuré sous le
      seuil WCAG 1.4.3 (4.5:1) : 3.76:1 sur --card (blanc pur), 3.65:1
      sur --background (#fdfbfa), cohérent avec la mesure axe-core de
      3.69:1 obtenue lors de l'investigation SEC-098 (composant
      initialement confondu avec NotificationBell.tsx car partageant la
      même classe text-red-500, avant vérification directe du HTML remonté
      par axe qui a révélé qu'il s'agissait en fait de ce composant
      distinct sur DashboardPage).
    perimetre: transverse
    regle_violee: >
      WCAG 1.4.3 — la valeur de croissance est un texte numérique
      informatif (ex. "-12%"), pas un simple ornement, donc le seuil
      texte 4.5:1 s'applique.
    classe: contraste-kpi-financier-sous-seuil
    gravite: moyenne
    statut: resolu
    detecte_le: "2026-08-03"
    source: >
      Découverte incidente en vérifiant par axe-core le correctif
      SEC-098 (2026-08-03) — un scan sur dashboard-admin a remonté ce
      composant distinct, confondu au départ avec NotificationBell.tsx à
      cause de la classe CSS identique (text-red-500).
    confiance: >
      Élevée — ratio calculé directement depuis les valeurs hex réelles
      de Tailwind (red-500 #ef4444) contre les tokens --card/--background
      du projet, cohérent avec le ratio mesuré par axe-core sur le HTML
      réel remonté pendant l'investigation SEC-098.
    note: >
      Fonction réelle confirmée par lecture directe : GrowthBadge affiche
      un pourcentage de variation (calculateGrowth, DashboardPage.tsx:89-96)
      pour un KPI financier de premier plan (le premier des 3 "hero
      stats" est la trésorerie du mois en cours) — pas un indicateur
      décoratif, un utilisateur malvoyant ne percevrait pas qu'un KPI
      financier est en baisse. Même famille de défaut que SEC-098
      (composant fonctionnel d'alerte/statut, pas cosmétique), gravité
      alignée en conséquence (moyenne).
    critere_de_resolution: >
      La couleur utilisée pour une variation négative atteint 4.5:1 sur
      les deux fonds réels où le composant apparaît (--card et
      --background), vérifié par un test réel qui force une valeur de
      croissance négative et scanne via axe-core.
  - id: SEC-098
    titre: >
      Le badge compteur de notifications non lues (NotificationBell.tsx:137-142,
      Badge variant="destructive", visible sur toutes les pages
      authentifiées via le header) et les icônes d'alerte de la liste
      déroulante (XCircle/AlertTriangle, classe text-red-500,
      NotificationBell.tsx:28/52/56, pour APPROVAL_REJECTED/PROJECT_STALE/
      PROJECT_DEADLINE_SOON/TASK_OVERDUE) mesuraient un contraste sous le
      seuil WCAG 1.4.3 (4.5:1) : badge compteur 4.07:1 (dashboard-admin),
      3.77:1 (crm), 2.77:1 (ai-assistant), 3.24:1 (dashboard-manager) —
      variabilité due à animate-pulse (NotificationBell.tsx:139, actif
      quand hasCritical est vrai) qui faisait osciller l'opacité réelle au
      moment précis de la mesure, donc le pire cas mesurable descendait sous
      2.8:1 en creux de pulsation. Icônes d'alerte (liste déroulante,
      #fb2c36 sur #fdfbfa) mesurées à 3.69:1. Angle mort du premier audit
      SEC-096 (2026-08-03) : le scan initial (scroll bas de page + retour
      haut) ne capturait la cloche de notifications qu'au repos, sans
      déclencher l'ouverture du popover ni garantir une notification non
