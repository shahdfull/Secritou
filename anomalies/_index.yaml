# Registre des anomalies — Secritou
#
# Ce fichier fait partie du registre éclaté (voir CLAUDE.md § « Procédure
# d'audit obligatoire »). Schéma par anomalie : id, titre, perimetre,
# regle_violee, classe, gravite, statut, critere_de_resolution, detecte_le,
# source, confiance, note.
# Ne jamais reformuler un titre existant — citer l'ID.
#
# Registre remis à zéro le 2026-07-27 (décision explicite du porteur du
# projet) : l'historique réel (234 anomalies migrées depuis l'ancien
# ANOMALIES.yaml) est archivé sur la branche locale
# archive/anomalies-avant-reset (commit 3c03297), pas perdu — seulement
# retiré de ce fichier pour repartir avec un registre vide.

dernier_id: SEC-052
anomalies:
  - id: SEC-052
    titre: >
      La correction initiale proposée pour la dérive OLLAMA_MODEL
      (env_file: server/.env ajouté au service ollama-pull, avec
      ${OLLAMA_MODEL:-mistral} laissé tel quel dans entrypoint) ne
      corrigeait en réalité rien : Docker Compose interpole
      ${OLLAMA_MODEL} écrit directement dans entrypoint/environment au
      moment du parsing du YAML (contre le shell hôte / un .env racine),
      AVANT que env_file ne soit jamais injecté dans le conteneur —
      confirmé par test réel (ajout de OLLAMA_MODEL=llama3 à
      server/.env seul, aucun effet sur la commande résolue par docker
      compose config). La vraie correction nécessite $$OLLAMA_MODEL
      (échappé) pour laisser le shell du conteneur lui-même résoudre la
      variable au runtime, avec la valeur réellement injectée par
      env_file
    perimetre: 4.11-ia
    statut: resolu
    gravite: moyenne
    classe: interpolation-compose-au-mauvais-moment

  - id: SEC-051
    titre: >
      businessProjectProgressRecalculated (server/src/observability/
      businessMetrics.ts:11) est un compteur Prometheus exporté sans
      aucun consommateur — grep confirmant zéro incrémentation
      (.inc()) nulle part dans server/src, introduit en un seul commit
      historique (bb350dd) jamais utilisé depuis. Même classe que
      SEC-045, mais antérieur et hors module IA — découvert incidemment
      lors de la contre-vérification du porteur sur le nettoyage 4.11
    perimetre: transverse
    statut: ouvert
    gravite: mineure
    classe: metrique-orpheline-sans-appelant

  - id: SEC-050
    titre: >
      SEC-046 (registre) contient une incohérence interne : son
      critere_de_resolution exige "titre SEC-040 aligné sur son
      périmètre réel", mais sa propre note explique explicitement que le
      titre a été laissé inchangé conformément à la règle CLAUDE.md "ne
      jamais reformuler un titre existant" — le critère n'a donc jamais
      été rempli tel qu'écrit, bien que la correction réelle effectuée
      (celle décrite par la note) soit correcte et suffisante
    perimetre: 4.11-ia
    statut: ouvert
    gravite: mineure
    classe: incoherence-interne-registre

  - id: SEC-049
    titre: >
      Deux commentaires de test devenus faux après la suppression de
      /ai/chat (SEC-044), jamais mis à jour dans cette même passe :
      aiExecutionAccessClient.test.ts ligne 10 affirme "authorize()
      covers the one remaining AI route, /ai/chat" (route supprimée le
      même jour) ; ai.endpoint.test.ts se décrit comme couvrant
      "/ai/conversations/*" mais n'importe rien de
      aiConversation.routes.ts — il exerce authorize() de façon
      totalement isolée, sans jamais appeler le vrai routeur, donc son
      commentaire affirme une couverture que le test ne prouve pas
      réellement
    perimetre: 4.11-ia
    statut: ouvert
    gravite: mineure
    classe: commentaire-de-test-perime

  - id: SEC-048
    titre: >
      Trois statuts REFERENTIEL.md marqués IMPLÉMENTÉ/verifie:code_direct
      ou verifie:test citaient des fichiers supprimés le 2026-07-30
      (SEC-040/SEC-044) sans jamais être mis à jour dans les mêmes
      commits : RG-014 (agentOrchestrator.service.ts lignes 90-92,
      ai.endpoint.test.ts) — le fichier cité n'existe plus, et l'énoncé
      "seuls Admin et Manager peuvent déclencher un persona IA" n'a plus
      d'objet (plus de persona) ; RG-017 (ai.routes.ts,
      agentOrchestratorService.executeAgent "revérifie lui-même le
      rôle") — la défense en profondeur au niveau service décrite
      n'existe plus nulle part, seul le middleware authorize() protège
      désormais aiConversation.service.ts, qui ne vérifie aucun rôle
      dans ses propres méthodes ; §3.22 AiConversation/AiMessage
      (agentOrchestrator.service.ts intégral "qui persiste ces
      entités") — doublement faux, le fichier est supprimé ET
      l'orchestrateur n'a jamais été la couche CRUD réelle
      (aiConversation.repository.ts), erreur déjà identifiée et
      corrigée dans perimetre_code le 2026-07-17 mais jamais répercutée
      au niveau entité. Découvert par contre-vérification du porteur du
      projet, session du 2026-07-30, hors périmètre de SEC-046 (qui ne
      couvrait que 4.11 et le grep de 4 emplacements, celui-ci est un
      5e cas, dans §3, passé sous le radar)
    perimetre: 4.11-ia
    statut: ouvert
    gravite: moyenne
    classe: affirmation-factuelle-non-sourcee
  - id: SEC-047
    titre: >
      SEC-041 (Ollama ajouté aux docker-compose) est incomplète : l'image
      ollama/ollama:latest démarre avec zéro modèle téléchargé — aucun
      "ollama pull" n'existe nulle part dans le dépôt. Le healthcheck
      "ollama list" réussit sur un store de modèles vide, donc le
      conteneur est déclaré healthy et server (depends_on:
      condition: service_healthy) démarre en croyant l'IA prête ; le
      premier POST /api/chat avec model:"mistral" échoue en 404 "model
      not found"
    perimetre: 4.11-ia
    statut: resolu
    gravite: moyenne
    classe: healthcheck-ne-verifie-pas-la-vraie-disponibilite

  - id: SEC-046
    titre: >
      REFERENTIEL.md §4.11, SEC-040 (titre et note), SEC-043 (note) et
      EXPLORATION.md (ligne 36, périmètre 4.11) contiennent des
      affirmations factuelles inexactes écrites après la suppression du
      chemin agent : REFERENTIEL.md affirme que /ai/chat est "consommé
      par AIAssistantFloat.tsx" (faux — ce composant n'importe que le
      type ChatMessage, la vraie logique réseau vit dans
      AIAssistantPage.tsx qui appelle uniquement useCreateConversation/
      useAddMessage, jamais aiApi.chat) ; SEC-043 affirme que /ai/chat
      "utilise aiConversation.service.ts" (faux — ai.controller.ts#chat
      appelle callOllama directement, ne persiste rien) ; le titre de
      SEC-040 dit "3 endpoints" mais n'en liste que 2 (généralisation du
      constat initial jamais mise à jour) ; EXPLORATION.md liste encore
      personas.ts et agentOrchestrator.service.ts comme fichiers lus du
      périmètre 4.11 alors qu'ils sont supprimés
    perimetre: 4.11-ia
    statut: resolu
    gravite: moyenne
    classe: affirmation-factuelle-non-sourcee

  - id: SEC-045
    titre: >
      businessMetrics.logAgentCall (server/src/observability/businessMetrics.ts)
      n'a plus aucun appelant depuis la suppression de
      agentOrchestrator.service.ts#executeAgent — les métriques
      Prometheus agent_call_total et agent_call_duration_seconds restent
      enregistrées sur le registry et exposées à zéro pour toujours, sans
      aucun code applicatif ne les incrémentant plus jamais
    perimetre: 4.11-ia
    statut: resolu
    gravite: mineure
    classe: metrique-orpheline-sans-appelant

  - id: SEC-044
    titre: >
      POST /ai/chat (ai.controller.ts#chat, ai.routes.ts, ai.validator.ts
      #chatSchema) n'a aucun appelant réel côté client — grep de
      aiApi.chat dans client/src : le seul import de
      client/src/api/ai.api.ts (AIAssistantFloat.tsx, AdminLayout.tsx)
      ne prend que le type ChatMessage ; toute l'UI de chat passe par
      aiConversations.api.ts vers /ai/conversations/* (useCreateConversation/
      useAddMessage dans AIAssistantPage.tsx). Même classe que SEC-040
      (capacité serveur sans point d'entrée frontend), site de code
      distinct — introduite/révélée par la correction de SEC-040 elle-même
      (retirer /ai/brief,/ai/tasks a laissé /ai/chat comme seul survivant
      du fichier, sans revérifier s'il avait, lui, un vrai appelant)
    perimetre: 4.11-ia
    statut: resolu
    gravite: mineure
    classe: capacite-serveur-sans-point-dentree-frontend

  - id: SEC-043
    titre: >
      agentOrchestratorService.executeAgent persiste son résultat via
      aiConversationService.create(userId, JSON.stringify({persona,
      context, result}), personaId) — create() appelle callOllama sur ce
      firstMessage, déclenchant un SECOND appel LLM (jusqu'à 120s de plus)
      pour chaque génération de brief/tâches, avec le JSON stringifié
      envoyé comme question utilisateur au system prompt CRM générique ;
      le titre de conversation résultant est le JSON tronqué à 60 chars
      ({"persona":"brief-generator"...) ; si ce second appel échoue,
      executeAgent lève après avoir déjà produit le vrai résultat (perdu
      pour l'appelant) alors que businessMetrics.logAgentCall a déjà
      enregistré success:true dans le finally
    perimetre: 4.11-ia
    statut: resolu
    gravite: eleve
    classe: cout-latence-doubles-effet-de-bord-persistance

  - id: SEC-042
    titre: >
      callAgentWithRetry (agentOrchestrator.service.ts) retente sur
      n'importe quelle erreur catch — y compris un 502 Ollama réel ou un
      persona introuvable — au lieu de restreindre le retry aux erreurs de
      parsing (extractJson/JSON.parse/schema.parse), gaspillant un cycle
      complet (jusqu'à 240s) sur des erreurs qu'un retry identique ne peut
      pas corriger ; l'erreur finale (lastError) remonte brute au
      middleware d'erreur, donc une ZodError de schema.parse sort en 500
      générique au lieu d'un code lisible (422/502)
    perimetre: 4.11-ia
    statut: resolu
    gravite: moyenne
    classe: retry-non-borne-a-la-classe-derreur

  - id: SEC-041
    titre: >
      REFERENTIEL.md §5 RG-015 (module IA auto-hébergé, Ollama) est marquée
      IMPLÉMENTÉ verifie:code_direct sur la seule base du code
      (llm.client.ts appelle bien OLLAMA_URL), mais aucun service ollama
      n'existe dans docker-compose.yml ni docker-compose.prod.yml — la
      valeur par défaut de OLLAMA_URL (http://localhost:11434) pointe, une
      fois le serveur conteneurisé, sur le conteneur serveur lui-même, pas
      sur un Ollama réel ; l'écart est entre le code et le déploiement,
      pas dans le code
    perimetre: 4.11-ia
    statut: resolu
    gravite: moyenne
    classe: ecart-code-deploiement

  - id: SEC-040
    titre: >
      Les 3 endpoints POST /ai/brief, /ai/tasks (et par extension le
      persona task-planner) ne sont appelés par aucun code de
      client/src — grep exhaustif sur "/ai/brief", "/ai/tasks",
      "brief-generator", "task-planner" côté client : zéro résultat, seul
      ChatMessage (type) est importé depuis client/src/api/ai.api.ts par
      AIAssistantFloat.tsx ; brief-generator/task-planner sont du code
      serveur testé et audité (SEC-033/034) mais structurellement
      inatteignable par un utilisateur du produit
    perimetre: 4.11-ia
    statut: resolu
    gravite: mineure
    classe: capacite-serveur-sans-point-dentree-frontend

  - id: SEC-039
    titre: >
      llm.client.ts#callOllama retombe silencieusement sur "Désolé, je
      n'ai pas pu générer de réponse." (data.message?.content ?? ...) si
      Ollama répond 200 avec un content vide/absent — ce texte de repli
      est ensuite persisté comme un vrai message ASSISTANT en base
      (aiConversationRepository.addMessage), indistinguable pour le
      client d'une réponse légitime du modèle
    perimetre: 4.11-ia
    statut: resolu
    gravite: mineure
    classe: repli-silencieux-reponse-vide
  - id: SEC-038
    titre: >
      commissionRepository.getAdminPartnerId() sélectionnait le "premier
      ADMIN" via findFirst sans orderBy (ordre non garanti par Postgres) —
      avec plusieurs comptes ADMIN (RG-021 les autorise explicitement),
      l'ADMIN recevant la part de commission dans
      recalcAutoSplit/resetToAutoSplit pouvait varier d'un appel à
      l'autre ; découvert via la flakiness de commissionService.test.ts/
      commissionAutoSplitTaskTrigger.test.ts (passent isolément, 6
      assertions échouent parfois quand d'autres fichiers de test
      créaient temporairement un second ADMIN en base pendant
      test/run-all.test.ts)
    perimetre: transverse
    statut: resolu
    gravite: moyenne
    classe: selection-non-deterministe-entite-metier

  - id: SEC-037
    titre: >
      gdprService.eraseClient/eraseUser/eraseLead/eraseContactRequest
      exécutent chacune plusieurs écritures Prisma séquentielles (delete
      des leads liés puis delete du client ; ou update client puis update
      leads puis update portalUsers) sans les envelopper dans
      prisma.$transaction — un échec à mi-séquence (crash serveur, erreur
      réseau DB) laisse l'effacement RGPD partiellement appliqué (ex.
      leads supprimés mais Client encore présent, ou Client anonymisé
      mais comptes portail non révoqués/anonymisés)
    perimetre: transverse
    statut: resolu
    gravite: moyenne
    classe: ecriture-multi-etapes-sans-transaction

  - id: SEC-036
    titre: >
      clientPortalRepository.getOutstandingBalance (résumé du portail
      client, GET /client-portal/summary) calcule
      Math.max(Number(amount) - Number(amountPaid), 0) en arithmétique
      flottante brute sans roundMoney(), contrairement au même calcul déjà
      arrondi dans creditNote.service.ts#167 (roundMoney(Number(invoice.amount)
      - Number(invoice.amountPaid))) — le solde restant dû affiché au
      CLIENT peut porter un résidu de précision flottante (ex.
      1200.0000000000002 au lieu de 1200)
    perimetre: 4.6-portail-client
    statut: resolu
    gravite: mineure
    classe: arithmetique-flottante-brute-sur-montant

  - id: SEC-035
    titre: >
      aiConversationService.create/addMessage persistent le message USER
      (aiConversationRepository.addMessage) AVANT d'appeler callOllama —
      si l'appel échoue (timeout 120s, Ollama indisponible), l'exception
      remonte telle quelle au client (5xx) mais le message USER reste
      durablement enregistré sans réponse ASSISTANT associée ; un client
      qui renvoie le même message après l'erreur crée un second message
      USER orphelin dans l'historique de la même conversation, aucun état
      « échoué » n'est jamais écrit
    perimetre: 4.11-ia
    statut: resolu
    gravite: mineure
    classe: ecriture-partielle-sans-etat-echec

  - id: SEC-034
    titre: >
      generateBriefSchema/generateTasksSchema (POST /ai/brief, POST
      /ai/tasks) valident context: z.record(z.any()) sans aucune limite de
      taille/profondeur — le payload part directement en
      JSON.stringify(contextData) vers Ollama (agentOrchestrator.service.ts),
      seul aiRateLimit (limite de fréquence) protège ce chemin, aucune
      limite de volume
    perimetre: 4.11-ia
    statut: resolu
    gravite: mineure
    classe: validation-entree-non-bornee

  - id: SEC-033
    titre: >
      personas.ts#getPersona retombe silencieusement sur le premier
      persona du Record (Object.values(personas)[0]) pour un id inconnu
      au lieu de retourner undefined/lever — actuellement non exploitable
      (les 2 seuls appelants, generateBrief/generateTasks, codent
      personaId en dur), mais un futur appelant passant un id utilisateur
      directement à getPersona exécuterait silencieusement le mauvais
      persona plutôt que d'échouer
    perimetre: 4.11-ia
    statut: resolu
    gravite: mineure
    classe: repli-silencieux-id-invalide

  - id: SEC-032
    titre: >
      @bull-board/api et @bull-board/express sont déclarées dans
      server/package.json (dependencies) mais jamais importées ni montées
      nulle part dans src/ — aucun dashboard d'observabilité BullMQ
      n'existe réellement malgré la dépendance présente
    perimetre: transverse
    statut: resolu
    gravite: mineure
    classe: dependance-non-utilisee

  - id: SEC-031
    titre: >
      executiveMetricsRepository.getAll — overdueGrowthMoM/pendingGrowthMoM
      recalculent le « snapshot du mois dernier » en filtrant sur le
      status ACTUEL de la facture (status: {in:[...]}), pas sur son état
      réel fin du mois dernier — une facture en retard fin du mois
      dernier mais payée depuis (status désormais PAID) disparaît aussi
      du snapshot passé, biaisant systématiquement la croissance affichée
      vers une amélioration factice à chaque paiement d'ancienne facture
    perimetre: 4.8-analytics
    statut: resolu
    gravite: moyenne
    classe: kpi-historique-non-reconstitue

  - id: SEC-030
    titre: >
      server/tsconfig.json n'inclut que "src/**/*.ts" — npm run typecheck
      (tsc --noEmit) ne vérifie jamais server/test/**, qui peut donc
      accumuler des erreurs de type réelles (constaté : deux appels
      obsolètes de clientOnboardingService.createPayment avec un shape
      retiré du type PaymentInput, jamais détectés) sans jamais faire
      échouer la porte CI typecheck ; les tests continuent de s'exécuter
      via tsx (qui strip les types sans les vérifier), masquant le défaut
    perimetre: transverse
    statut: resolu
    gravite: moyenne
    classe: typecheck-perimetre-incomplet

  - id: SEC-029
    titre: >
      Le modèle Payment de l'étape onboarding (amount/amountPaid/status)
      n'est jamais rattaché à un Invoice réel (Payment.invoiceId n'est
      jamais écrit par clientOnboarding.*) ni recalculé/vérifié contre le
      paiement réellement enregistré côté invoiceService.addPayment — un
      ADMIN/MANAGER peut définir status:"PAID" avec un amountPaid
      arbitraire, affiché comme fait acquis au CLIENT
      (ClientOnboardingPage.tsx), sans aucune garantie que ce paiement
      existe réellement dans le registre financier
    perimetre: 4.3-onboarding
    statut: resolu
    gravite: eleve
    classe: invariant-financier-absent

  - id: SEC-028
    titre: >
      gscConnectionService (startConnect/getStatus/disconnect/
      completeConnect) et metricSnapshotController#getClientMetrics ne
      vérifient jamais que le clientId appartient au pôle du MANAGER
      appelant — un MANAGER peut initier/consulter/déconnecter une
      connexion Search Console et lire les métriques de n'importe quel
      client, hors de son pôle
    perimetre: 4.8-analytics
    statut: resolu
    gravite: eleve
    classe: idor-scope-manque

  - id: SEC-027
    titre: >
      GET/POST /ratings/freelancers/:freelancerId (getRatings/addRating)
      ne scopent jamais par pôle pour MANAGER — un MANAGER peut lire ou
      créer une évaluation pour un freelance sans tâche dans son pôle
    perimetre: 4.7-freelances
    statut: resolu
    gravite: moyenne
    classe: idor-scope-manque

  - id: SEC-026
    titre: >
      GET /freelancers/:id (getFreelancerById) ne scope jamais par pôle
      pour MANAGER — freelancerService.getById n'a aucun paramètre de
      scope, contrairement à getAll (list) qui filtre déjà via
      user.tasks.some.project.serviceId ; un MANAGER peut lire par id
      direct le profil complet (hourlyRate inclus) d'un freelance sans
      tâche dans son pôle
    perimetre: 4.7-freelances
    statut: resolu
    gravite: eleve
    classe: idor-scope-manque

  - id: SEC-025
    titre: >
      clientOnboardingService/repository — updateOnboarding, deleteOnboarding,
      updateStep, addStep et les 14 méthodes create/update de sous-entité
