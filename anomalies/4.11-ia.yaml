# Registre des anomalies — Secritou
#
# Ce fichier fait partie du registre éclaté (voir CLAUDE.md § « Procédure
# d'audit obligatoire »). Schéma par anomalie : id, titre, perimetre,
# regle_violee, classe, gravite, statut, critere_de_resolution, detecte_le,
# source, confiance, note.
# Ne jamais reformuler un titre existant — citer l'ID.
#
# Périmètre : 4.11 Module IA (agent-service)
# 0 anomalie(s) — registre remis à zéro le 2026-07-27, historique réel
# archivé sur la branche locale archive/anomalies-avant-reset (commit 3c03297).
#
# Reclassé GELÉ → ACTIF le 2026-07-30 (décision explicite du porteur, voir
# REFERENTIEL.md §7) — audit A/B/G démarré le jour même. Relecture
# approfondie (hors audit formel A/B/G, à la demande du porteur "on
# décortique le module IA ensemble") le même jour : SEC-039 à SEC-043.
# Contre-vérification du porteur sur les corrections apportées, même
# jour : SEC-044 à SEC-047 (dont des erreurs factuelles dans ce même
# registre, cf. SEC-046). Nouvelle contre-vérification du porteur sur
# la traçabilité laissée par les suppressions, même jour : SEC-048 à
# SEC-052 (dont une nouvelle erreur factuelle hors 4.11, transverse —
# voir anomalies/transverse.yaml#SEC-051). Audit indépendant demandé
# explicitement par le porteur le 2026-07-31 (agent sans mémoire de la
# session, pour vérifier si le registre mentait) : SEC-053, révélant que
# la clôture de SEC-049 elle-même était prématurée. Construction de
# SEC-059 (tool calling CRM réel) le même jour : SEC-054 à SEC-059.
# Relecture externe du travail SEC-054/SEC-059, même jour : SEC-060 à
# SEC-063. Enrichissements horizon court (truncated, filtres structurés,
# AiToolCall, métriques, streaming SSE) demandés explicitement par le
# porteur le même jour, révélant SEC-064 (RGPD aggravé, non traité —
# hors des 5 items retenus).

anomalies:
  - id: SEC-064
    titre: >
      Le tool calling CRM (SEC-059) aggrave l'écart RGPD déjà signalé par
      l'audit indépendant du 2026-07-31 : gdpr.service.ts ne mentionne
      toujours ni AiConversation ni AiMessage, alors que l'historique de
      chat contient désormais des données CRM tirées par les outils
      (noms de clients, montants, deadlines) et recopiées dans les
      réponses de l'assistant — une copie secondaire de données
      personnelles, hors du chemin d'export et d'effacement RG-025.
      Quand un User est anonymisé en place plutôt que supprimé, cet
      historique enrichi survit intact. Signalé explicitement par le
      porteur, non traité dans cette session (hors des 5 items retenus)
    perimetre: 4.11-ia
    regle_violee: >
      REFERENTIEL.md RG-025 (export/effacement RGPD) affirme couvrir
      "l'intégralité des champs personnels détenus" pour User — l'ajout
      du tool calling CRM rend cette affirmation plus fausse qu'avant
      (plus de surface de données personnelles concernée), sans qu'aucun
      correctif ne l'ait suivie dans la même passe.
    classe: donnee-personnelle-hors-perimetre-rgpd
    gravite: moyenne
    statut: ouvert
    critere_de_resolution: >
      Décision explicite du porteur à demander avant tout correctif
      (cf. CLAUDE.md "Réparer n'est pas développer" — étendre RG-025 à
      AiConversation/AiMessage est une décision de portée produit, pas
      une réparation) : soit gdprService.exportUser/eraseUser couvrent
      explicitement AiConversation/AiMessage (export des messages,
      anonymisation ou suppression selon le même critère financier déjà
      appliqué au reste de User), soit REFERENTIEL.md RG-025 documente
      explicitement cette exclusion comme un choix assumé plutôt qu'un
      angle mort silencieux.
    detecte_le: "2026-07-31"
    source: >
      Signalé directement par le porteur du projet, message technique
      listant les points à traiter après la construction du tool
      calling CRM (SEC-059) — confirmé par grep de "AiConversation" et
      "AiMessage" sur gdpr.service.ts (zéro occurrence).
    confiance: haute
    note: >
      Non corrigé dans cette session — le porteur a explicitement classé
      cet item hors des 5 retenus pour la passe "horizon court"
      (truncated, filtres structurés, AiToolCall, métriques, streaming).
      Laissé ouvert pour décision produit ultérieure.

  - id: SEC-063
    titre: >
      aiTools.test.ts et llmClientToolCalling.test.ts, créés lors de la
      session SEC-054/SEC-059, n'étaient jamais importés par
      test/run-all.test.ts — jamais exécutés par npm run test:coverage
      (la vraie porte CI), seulement par une exécution manuelle ciblée
      hors de cette porte. Découvert incidemment en vérifiant l'absence
      de régression après une relecture externe du même travail
    perimetre: 4.11-ia
    regle_violee: >
      CLAUDE.md « Un critère de résolution se vérifie sur un commit » —
      un test qui n'est jamais exécuté par la porte CI réelle n'apporte
      aucune garantie sur ce que voit réellement le pipeline, quel que
      soit son contenu ; c'est la même famille de défaut que "vert
      trompeur" déjà rencontrée ailleurs dans ce dépôt (ex. SEC-100 sur
      le module CRM), mais côté câblage plutôt que côté contenu du test.
    classe: test-non-cable-dans-lagregateur
    gravite: moyenne
    statut: resolu
    critere_de_resolution: >
      test/run-all.test.ts importe aiTools.test.ts et
      llmClientToolCalling.test.ts — vérifié par l'exécution réelle de
      npx tsx --test test/run-all.test.ts confirmant que leurs suites
      apparaissent dans le compte total de tests exécutés.
    detecte_le: "2026-07-31"
    source: >
      Vérification de non-régression après une relecture externe du
      travail SEC-054/SEC-059 : npx tsx --test test/run-all.test.ts
      échouait au chargement (ERR_MODULE_NOT_FOUND sur
      llmClientEmptyResponse.test.ts, retiré par SEC-060), révélant à
      cette occasion que run-all.test.ts n'importait ni aiTools.test.ts
      ni llmClientToolCalling.test.ts non plus.
    confiance: haute
    note: >
      Corrigé dans la même session que sa découverte : les deux imports
      ajoutés à test/run-all.test.ts, à la place de l'import retiré de
      llmClientEmptyResponse.test.ts (SEC-060). Suite complète repassée
      de 702 à 714 tests (712 existants moins 1 retiré plus 13 des deux
      nouveaux fichiers), 714/714 verts.

      Commité (f68bea1), poussé sur origin/main, CI verte confirmée
      (30595688534 — premier run rouge sur un test de timing flaky sans
      rapport avec ce périmètre, taskBulkActions.test.ts, non touché
      par ce commit ; rerun ciblé confirmé 6/6 jobs) — statut corrigé à
      resolu.

  - id: SEC-062
    titre: >
      getFreelancers (aiTools.ts) réimplémentait localement la décision
      de scoping MANAGER (?? "__none__") au lieu de la déléguer au
      service comme les 4 autres tools — divergence non tracée avec
      freelancer.controller.ts (scope?.userServiceId, sans fallback), et
      commentaire d'en-tête du fichier affirmant à tort un scoping
      "exactly like the equivalent REST endpoints" pour tous les tools.
      Signalé par une relecture externe du travail SEC-054/SEC-059
    perimetre: 4.11-ia
    regle_violee: >
      CLAUDE.md « `verifie: test` exige un test qui appelle le code réel »
      et l'esprit de la chasse « provenance obligatoire » de l'audit
      4.11 original — un commentaire de code qui affirme une couverture
      uniforme ("exactly like ... never a parallel query path") alors
      qu'un site précis y déroge est le même défaut que les
      "commentaire-de-test-perime" déjà enregistrés (SEC-049/SEC-053),
      appliqué ici à un commentaire de code de production plutôt qu'à un
      commentaire de test.
    classe: scoping-reimplemente-hors-service
    gravite: mineure
    statut: resolu
    critere_de_resolution: >
      runGetFreelancers transmet ctx.userServiceId tel quel au service
      (comme runGetProjects/runGetTasks le font déjà pour leur propre
      scope), sans réintroduire de fallback local ; le commentaire
      d'en-tête de aiTools.ts ne prétend plus à une couverture uniforme
      qu'il ne peut pas garantir par construction. Vérifié par un
      nouveau test qui appelle réellement runAiTool("getFreelancers", ...)
      avec un MANAGER dont userServiceId est omis (undefined, pas null)
      et confirme l'absence de filtre, comme le fait réellement
      freelancer.controller.ts.
    detecte_le: "2026-07-31"
    source: >
      Relecture externe du travail SEC-054/SEC-059, comparaison directe
      de aiTools.ts#runGetFreelancers avec
      freelancer.controller.ts:24-25.
    confiance: haute
    note: >
      Corrigé dans la même session que sa découverte : le fallback local
      "?? \"__none__\"" retiré, ctx.userServiceId transmis tel quel.
      Précision du porteur (relecture externe) : pour un MANAGER sans
      serviceId, ceci fait que le tool est MOINS restrictif qu'avant
      (aligné sur le comportement REST réel, qui ne filtre rien dans ce
      cas précis) — la divergence corrigée allait dans le sens le plus
      sûr avant ce correctif, mais restait un chemin de requête
      partiellement réimplémenté plutôt que délégué, contraire à la
      promesse de l'en-tête du fichier. Le comportement REST lui-même
      (un MANAGER sans pôle voit tous les freelancers) reste
      potentiellement un bug distinct, non traité ici — hors périmètre
      de cette anomalie, qui porte sur la fidélité de l'outil IA au
      comportement REST existant, pas sur la correction de ce dernier.

      Commité (f68bea1), poussé sur origin/main, CI verte confirmée
      (30595688534 — 6/6 jobs après rerun ciblé, voir note SEC-063) —
      statut corrigé à resolu.

  - id: SEC-061
    titre: >
      runConversationTurn (aiConversation.service.ts) bornait le nombre
      d'aller-retours de tool calling (MAX_TOOL_ROUNDTRIPS = 4) mais pas
      le temps total — chaque appel Ollama porte son propre timeout de
      120s indépendant, donc un tour pouvait légitimement durer jusqu'à
      8 minutes, bien après l'abandon du navigateur, en gardant une
      connexion Express et un créneau Ollama occupés. Signalé par une
      relecture externe du travail SEC-054/SEC-059
    perimetre: 4.11-ia
    regle_violee: >
      Aucune règle explicite de REFERENTIEL.md ne couvre ce cas —
      constat de conception : un budget temps de requête doit être borné
      par une échéance absolue partagée par toute une boucle, pas
      seulement par la somme de bornes indépendantes par itération, sous
      peine de laisser le pire cas croître linéairement avec le nombre
      d'itérations sans qu'aucune limite explicite ne l'exprime.
      aiRateLimit (10/min) aggrave l'impact : un seul utilisateur peut
      immobiliser une part significative du débit Ollama disponible sur
      une fenêtre d'une minute.
    classe: absence-echeance-globale-boucle
    gravite: moyenne
    statut: resolu
    critere_de_resolution: >
      Un AbortSignal unique, créé une seule fois par appel à
      runConversationTurn, est transmis à chaque appel
      callOllamaWithTools de la boucle — vérifié par un test qui appelle
      réellement callOllamaWithTools avec un signal partagé et confirme
      qu'il atteint fetch tel quel (pas remplacé par un timeout par
      appel), et par un test qui confirme qu'un signal déjà expiré
      rejette immédiatement l'appel.
    detecte_le: "2026-07-31"
    source: >
      Relecture externe du travail SEC-054/SEC-059 — lecture directe de
      runConversationTurn (boucle de MAX_TOOL_ROUNDTRIPS itérations,
      chacune appelant callOllamaWithTools sans signal) et de
      llm.client.ts#postChat (AbortSignal.timeout(120000) recréé à
      chaque appel).
    confiance: haute
    note: >
      Corrigé dans la même session que sa découverte : TURN_TIMEOUT_MS
      = 180_000 (3 minutes, budget total du tour) ; turnDeadline =
      AbortSignal.timeout(TURN_TIMEOUT_MS) créé une fois en tête de
      runConversationTurn, transmis à callOllamaWithTools à chaque
      itération de la boucle. callOllamaWithTools/postChat acceptent un
      paramètre signal optionnel, retombant sur l'ancien timeout de
      120s par appel seulement si aucun signal n'est fourni (chemin
      défensif, jamais emprunté par l'appelant réel désormais).

      Commité (f68bea1), poussé sur origin/main, CI verte confirmée
      (30595688534 — 6/6 jobs après rerun ciblé, voir note SEC-063) —
      statut corrigé à resolu.

  - id: SEC-060
    titre: >
      callOllama (llm.client.ts) n'avait plus aucun appelant en
      production après l'introduction de callOllamaWithTools
      (SEC-059/runConversationTurn) — seul llmClientEmptyResponse.test.ts
      l'importait encore, testant une fonction morte plutôt que le
      chemin réellement vivant. Même classe que SEC-040/SEC-045
      (capacité/code sans appelant réel), réintroduite par cette même
      migration. Signalé par une relecture externe du travail
      SEC-054/SEC-059
    perimetre: 4.11-ia
    regle_violee: >
      Même classe que SEC-040/SEC-045 (capacite-serveur-sans-appelant-
      reel / metrique-orpheline-sans-appelant) — une fonction sans
      appelant réel en production est un résidu d'une migration, pas une
      capacité vivante, quel que soit le niveau de test qui la couvre
      encore isolément.
    classe: capacite-serveur-sans-appelant-reel
    gravite: mineure
    statut: resolu
    critere_de_resolution: >
      callOllama est retirée de llm.client.ts ; la preuve SEC-039
      (rejet explicite d'une réponse Ollama vide plutôt qu'un repli
      silencieux) reste couverte par un test qui appelle le chemin
      vivant callOllamaWithTools — vérifié par grep confirmant zéro
      référence restante à callOllama dans server/src et server/test.
    detecte_le: "2026-07-31"
    source: >
      Relecture externe du travail SEC-054/SEC-059 — grep de
      "callOllama\b" (hors callOllamaWithTools) sur server/src :
      un seul résultat, la définition elle-même, aucun appelant.
    confiance: haute
    note: >
      Corrigé dans la même session que sa découverte : callOllama
      retirée de llm.client.ts. llmClientEmptyResponse.test.ts supprimé
      (son scénario — content vide sans tool_calls — est déjà couvert
      par llmClientToolCalling.test.ts#"rejects a response with neither
      content nor tool_calls", contre le chemin vivant
      callOllamaWithTools). Import correspondant retiré de
      test/run-all.test.ts (voir SEC-063 pour le défaut de câblage
      connexe découvert à cette occasion). Commentaire de
      aiConversationOllamaFailure.test.ts corrigé (il citait callOllama
      alors qu'il exerce déjà, via aiConversationService.create, le
      chemin callOllamaWithTools — pas un bug de couverture, seulement
      un commentaire imprécis).

      Commité (f68bea1), poussé sur origin/main, CI verte confirmée
      (30595688534 — premier run rouge sur un test de timing flaky sans
      rapport avec ce périmètre, taskBulkActions.test.ts ; rerun ciblé
      confirmé 6/6 jobs) — statut corrigé à resolu.

  - id: SEC-059
    titre: >
      SYSTEM_PROMPT (aiConversation.service.ts) affirmait aider à gérer
      leads/clients/projets/tâches/freelancers sans qu'aucune requête
      Prisma, RAG ou tool calling n'existe sur ce chemin — l'assistant ne
      pouvait répondre que sur la base du texte tapé par l'utilisateur.
      Découvert lors d'un audit indépendant du module 4.11 (2026-07-31)
    perimetre: 4.11-ia
    regle_violee: >
      Aucune règle explicite de REFERENTIEL.md ne couvre ce cas — le
      SYSTEM_PROMPT affirme une capacité de gestion de données métier
      réelle que le code ne fournissait jamais, un écart entre la
      promesse faite au modèle et le comportement réel du système.
    classe: promesse-prompt-sans-realite-code
    gravite: mineure
    statut: resolu
    critere_de_resolution: >
      L'assistant IA dispose d'un accès réel (tool calling) aux entités
      Lead/Client/Project/Task/Freelancer, scopé par rôle (ADMIN
      illimité, MANAGER restreint à son serviceId, réutilisant les mêmes
      méthodes de listing/scoping que les endpoints REST existants) —
      vérifié par un test qui appelle réellement le dispatcher de tools
      avec un rôle MANAGER et confirme qu'aucune donnée hors pôle n'est
      renvoyée au modèle.
    detecte_le: "2026-07-31"
    source: >
      Audit indépendant du module 4.11 (agent sans mémoire de session),
      demandé explicitement par le porteur du projet pour vérifier le
      registre de bout en bout.
    confiance: haute
    note: >
      Décision du porteur (AskUserQuestion, 2026-07-31) : construire la
      vraie capacité plutôt que réécrire le prompt pour qu'il promette
      moins. Mécanisme choisi : tool calling Ollama, 5 tools scopés par
      rôle (getLeads, getClients, getProjects, getTasks, getFreelancers),
      réutilisant les services/repositories REST existants (lead/client/
      project/task/freelancer .service.ts) sans dupliquer leur logique de
      scoping. Voir server/src/services/aiTools.ts,
      server/src/services/llm.client.ts (boucle tool calling),
      server/test/aiTools.test.ts.

      Commité (410c736), poussé sur origin/main. Premier run CI
      (30595688534) rouge sur le job server — diagnostiqué comme un test
      de timing flaky préexistant (test/taskBulkActions.test.ts, ratio
      concurrent/séquentiel 6.0x contre une limite 10x), sans rapport
      avec ce périmètre ni ce commit (fichier non touché). Rerun ciblé
      (gh run rerun --failed) confirmé vert sur les 6 jobs (server, client,
      e2e, contrast-check, i18n-check, restore-smoke-test) — statut
      corrigé à resolu avec CI verte confirmée.

  - id: SEC-058
    titre: >
      aiConversation.repository.ts#findById appelé via prismaRead en
      pré-lecture immédiatement suivie d'une écriture dans
      addMessage/delete (service) — même défaut que SEC-037 (doctrine
      prisma/prismaRead), site de code distinct, jamais audité sous cet
      angle. Latent tant que DATABASE_READ_URL n'est pas renseigné.
      Découvert lors d'un audit indépendant du module 4.11 (2026-07-31)
    perimetre: 4.11-ia
    regle_violee: >
      CLAUDE.md « Conventions de code observées » — client d'écriture
      prisma requis pour toute pré-lecture immédiatement suivie d'une
      écriture ; prismaRead réservé aux lectures pures. Même doctrine que
      SEC-037 (transverse, gdprService), jamais appliquée au module IA.
    classe: doctrine-prisma-prismaread-violee
    gravite: moyenne
    statut: resolu
    critere_de_resolution: >
      addMessage et delete (aiConversation.service.ts) appellent
      aiConversationRepository.findById via le client d'écriture prisma,
      pas prismaRead — vérifié par lecture directe du repository
      confirmant qu'aucune pré-lecture suivie d'écriture ne passe plus
      par prismaRead sur ce chemin.
    detecte_le: "2026-07-31"
    source: >
      Audit indépendant du module 4.11 (agent sans mémoire de session),
      lecture croisée de aiConversation.repository.ts (findById,
      prismaRead) et aiConversation.service.ts (addMessage/delete,
      pré-lecture suivie d'écriture).
    confiance: haute
    note: >
      Corrigé dans la même session que sa découverte :
      aiConversationRepository.findById utilisé par addMessage/delete
      bascule sur le client prisma (écriture) — getById (lecture pure,
      pas suivie d'écriture) reste sur prismaRead, cohérent avec la
      doctrine.

      Commité (410c736), poussé sur origin/main, CI verte confirmée
      (rerun 30595688534 — 6/6 jobs, le seul échec initial était un test
      de timing flaky sans rapport, voir note SEC-059) — statut corrigé
      à resolu.

  - id: SEC-057
    titre: >
      AiConversation.findAll trie par updatedAt desc sans qu'aucun index
      Prisma ne couvre ce couple (filtre userId, tri updatedAt) — seuls
      [userId] et [userId, createdAt] existent. Découvert lors d'un audit
      indépendant du module 4.11 (2026-07-31)
    perimetre: 4.11-ia
    regle_violee: >
      Aucune règle explicite de REFERENTIEL.md ne couvre ce cas — un
      index composé doit couvrir le couple (filtre, tri) réellement
      exécuté par la requête, pas un couple voisin qui ne correspond à
      aucun appel réel.
    classe: index-manquant-sur-tri-reel
    gravite: mineure
    statut: resolu
    critere_de_resolution: >
      schema.prisma#AiConversation porte un index couvrant [userId,
      updatedAt] (ou remplace [userId, createdAt] si createdAt n'est
      trié nulle part ailleurs sur ce modèle) — vérifié par lecture
      directe du schéma et par une migration appliquée.
    detecte_le: "2026-07-31"
    source: >
      Audit indépendant du module 4.11 — comparaison directe de
      aiConversation.repository.ts#findAll (orderBy: updatedAt desc) et
      des index déclarés sur AiConversation dans schema.prisma.
    confiance: haute
    note: >
      Corrigé dans la même session que sa découverte : ajout de
      @@index([userId, updatedAt]) sur AiConversation, migration Prisma
      créée et commitée avec le dossier migration correspondant
      (règle CLAUDE.md sur prisma migrate dev).

      Commité (410c736), poussé sur origin/main, CI verte confirmée
      (rerun 30595688534 — 6/6 jobs, y compris "Schema drift check" sur
      le job server ; le seul échec initial était un test de timing
      flaky sans rapport, voir note SEC-059) — statut corrigé à resolu.

  - id: SEC-056
    titre: >
      docker-compose.prod.yml (et docker-compose.yml) attribuaient en
      commentaire de code la correction de la dérive OLLAMA_MODEL
      ($$OLLAMA_MODEL échappé) à SEC-048 — le registre attribue cette
      correction précise à SEC-052, SEC-048 portant sur un sujet disjoint
      (statuts REFERENTIEL.md citant des fichiers supprimés). Découvert
      lors d'un audit indépendant du module 4.11 (2026-07-31)
    perimetre: 4.11-ia
    regle_violee: >
      CLAUDE.md « Interdiction de reformulation » (cohérence de citation
      d'ID) — un ID cité en commentaire de code doit désigner la bonne
      anomalie du registre, pas une anomalie disjointe.
    classe: mauvaise-citation-id-en-commentaire
    gravite: mineure
    statut: resolu
    critere_de_resolution: >
      Le commentaire de docker-compose.prod.yml/docker-compose.yml cite
      SEC-052 (et non SEC-048) pour la correction de la dérive
      OLLAMA_MODEL — vérifié par grep confirmant zéro occurrence de
      "SEC-048" à proximité de ce commentaire précis.
    detecte_le: "2026-07-31"
    source: >
      Audit indépendant du module 4.11 — comparaison du commentaire de
      docker-compose.prod.yml ligne 86 avec anomalies/4.11-ia.yaml#SEC-052
      et #SEC-048.
    confiance: haute
    note: >
      Corrigé dans la même session que sa découverte : commentaire
      réécrit pour citer SEC-052.

      Commité (410c736), poussé sur origin/main, CI verte confirmée
      (rerun 30595688534 — 6/6 jobs) — statut corrigé à resolu.

  - id: SEC-055
    titre: >
      POST /ai/conversations/import (importFromLocalStorage, migration
      one-shot localStorage → backend) n'apparaît nulle part dans
      REFERENTIEL.md §4.11 ni dans perimetre_code — capacité réelle,
      appelée réellement par AIAssistantPage.tsx, mais absente de toute
      documentation du module. Découvert lors d'un audit indépendant du
      module 4.11 (2026-07-31)
    perimetre: 4.11-ia
    regle_violee: >
