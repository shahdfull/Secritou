# Registre des anomalies — Secritou
#
# Ce fichier fait partie du registre éclaté (voir CLAUDE.md § « Procédure
# d'audit obligatoire »). Schéma par anomalie : id, titre, perimetre,
# regle_violee, classe, gravite, statut, critere_de_resolution, detecte_le,
# source, confiance, note.
# Ne jamais reformuler un titre existant — citer l'ID.
#
# Périmètre : 4.11 Module IA (agent-service)
# 0 anomalie(s) — registre remis à zéro le 2026-07-27, historique réel
# archivé sur la branche locale archive/anomalies-avant-reset (commit 3c03297).
#
# Reclassé GELÉ → ACTIF le 2026-07-30 (décision explicite du porteur, voir
# REFERENTIEL.md §7) — audit A/B/G démarré le jour même. Relecture
# approfondie (hors audit formel A/B/G, à la demande du porteur "on
# décortique le module IA ensemble") le même jour : SEC-039 à SEC-043.

anomalies:
  - id: SEC-043
    titre: >
      agentOrchestratorService.executeAgent persiste son résultat via
      aiConversationService.create(userId, JSON.stringify({persona,
      context, result}), personaId) — create() appelle callOllama sur ce
      firstMessage, déclenchant un SECOND appel LLM (jusqu'à 120s de plus)
      pour chaque génération de brief/tâches, avec le JSON stringifié
      envoyé comme question utilisateur au system prompt CRM générique ;
      le titre de conversation résultant est le JSON tronqué à 60 chars
      ({"persona":"brief-generator"...) ; si ce second appel échoue,
      executeAgent lève après avoir déjà produit le vrai résultat (perdu
      pour l'appelant) alors que businessMetrics.logAgentCall a déjà
      enregistré success:true dans le finally
    perimetre: 4.11-ia
    regle_violee: >
      Aucune règle explicite de REFERENTIEL.md ne couvre ce cas — constat
      de conception : aiConversationService.create n'a jamais été un
      simple insert (elle appelle toujours callOllama), donc l'utiliser
      comme mécanisme d'archivage générique dans executeAgent double
      silencieusement le coût/la latence de chaque appel agent, et
      dissocie le résultat métier réel (déjà produit avec succès) du
      succès/échec de cet archivage.
    classe: cout-latence-doubles-effet-de-bord-persistance
    gravite: eleve
    statut: resolu
    critere_de_resolution: >
      executeAgent persiste le résultat (persona, context, result) sans
      déclencher un second appel LLM — soit via un appel direct au
      repository (aiConversationRepository.create + addMessage, sans
      passer par le service qui appelle callOllama), soit via une nouvelle
      méthode dédiée du service qui n'appelle jamais Ollama. Le titre de
      la conversation archivée doit être lisible (ex. nom du persona +
      horodatage), pas un JSON tronqué. Un échec de la persistance ne doit
      plus faire perdre le résultat déjà produit par le LLM à l'appelant.
      businessMetrics.logAgentCall doit refléter le succès réel de
      l'appel agent, pas être invalidé par un échec de persistance
      indépendant. Vérifié par un test qui appelle réellement
      executeAgent et compte le nombre d'appels à callOllama (mocké au
      niveau module ou via une requête HTTP interceptée), assérant
      exactement 1 appel par exécution.
    detecte_le: "2026-07-30"
    source: >
      Lecture croisée de agentOrchestrator.service.ts#executeAgent
      (ligne ~132-137, appel à aiConversationService.create) et
      aiConversation.service.ts#create (ligne ~25-38, qui appelle
      callOllama sur firstMessage) pendant une relecture approfondie du
      module 4.11 demandée explicitement par le porteur du projet.
    confiance: haute
    note: >
      Le fix SEC-035 (appeler callOllama avant de persister le message
      USER) n'a pas créé ce problème et ne le couvre pas : SEC-035 portait
      sur aiConversationService.create/addMessage utilisés pour un VRAI
      chat utilisateur, pas sur leur détournement comme mécanisme
      d'archivage dans executeAgent. Gravité élevée : coût/latence
      doublés sur CHAQUE appel agent (brief-generator, task-planner),
      pas un cas limite rare.

      Résolu autrement (session ultérieure, même jour 2026-07-30) :
      décision du porteur (AskUserQuestion) de retirer le code mort
      plutôt que de le corriger — cf. SEC-040. agentOrchestrator.service.ts
      (et donc ce double-appel) a été supprimé dans son intégralité, ainsi
      que ai.controller.ts#generateBrief/generateTasks et
      ai.routes.ts#POST /ai/brief,/ai/tasks. Le seul chemin IA restant
      (/ai/chat → aiConversation.service.ts, utilisé par
      AIAssistantFloat.tsx) n'a jamais eu ce défaut : create()/addMessage
      y sont le mécanisme de persistance légitime du chat, pas un
      archivage détourné. Commité (aebe1b9), CI verte confirmée (6/6
      checks GitHub Actions completed/success) — statut corrigé à resolu.

  - id: SEC-042
    titre: >
      callAgentWithRetry (agentOrchestrator.service.ts) retente sur
      n'importe quelle erreur catch — y compris un 502 Ollama réel ou un
      persona introuvable — au lieu de restreindre le retry aux erreurs de
      parsing (extractJson/JSON.parse/schema.parse), gaspillant un cycle
      complet (jusqu'à 240s) sur des erreurs qu'un retry identique ne peut
      pas corriger ; l'erreur finale (lastError) remonte brute au
      middleware d'erreur, donc une ZodError de schema.parse sort en 500
      générique au lieu d'un code lisible (422/502)
    perimetre: 4.11-ia
    regle_violee: >
      Aucune règle explicite de REFERENTIEL.md ne couvre ce cas — constat
      de robustesse/UX d'erreur : un retry doit cibler une classe
      d'erreur transitoire/corrigible par répétition (parsing JSON
      malformé), pas s'appliquer indifféremment à toute exception,
      surtout quand chaque tentative coûte jusqu'à 120s.
    classe: retry-non-borne-a-la-classe-derreur
    gravite: moyenne
    statut: resolu
    critere_de_resolution: >
      callAgentWithRetry ne retente que sur une erreur de parsing
      (extractJson, JSON.parse, schema.parse — distinguables par un type
      d'erreur dédié ou un discriminant), et propage immédiatement toute
      autre erreur (ex. HttpError d'callOllama) sans consommer de
      tentative supplémentaire. L'erreur finale remontée au client
      distingue un code lisible (422 sur échec de validation du schéma
      après épuisement des tentatives, 502 sur échec Ollama) plutôt qu'un
      500 générique. Vérifié par un test qui simule chaque type d'erreur
      séparément et assère le nombre d'appels à callOllama et le code
      HTTP final.
    detecte_le: "2026-07-30"
    source: >
      Lecture directe de agentOrchestrator.service.ts#callAgentWithRetry
      (lignes 42-80) : le seul catch (ligne 74) attrape toute erreur sans
      distinction de type avant de retenter.
    confiance: haute
    note: >
      Non bloquant pour le lancement — dégrade la latence perçue et la
      lisibilité des erreurs, pas une faille de sécurité ni un calcul
      métier faux. Backlog post-lancement.

      Résolu autrement (session ultérieure, même jour 2026-07-30) :
      agentOrchestrator.service.ts (seul emplacement de
      callAgentWithRetry) a été supprimé dans son intégralité — cf.
      SEC-040/SEC-043. Sans objet. Commité (aebe1b9), CI verte confirmée
      (6/6) — statut corrigé à resolu.

  - id: SEC-041
    titre: >
      REFERENTIEL.md §5 RG-015 (module IA auto-hébergé, Ollama) est marquée
      IMPLÉMENTÉ verifie:code_direct sur la seule base du code
      (llm.client.ts appelle bien OLLAMA_URL), mais aucun service ollama
      n'existe dans docker-compose.yml ni docker-compose.prod.yml — la
      valeur par défaut de OLLAMA_URL (http://localhost:11434) pointe, une
      fois le serveur conteneurisé, sur le conteneur serveur lui-même, pas
      sur un Ollama réel ; l'écart est entre le code et le déploiement,
      pas dans le code
    perimetre: 4.11-ia
    regle_violee: >
      CLAUDE.md « Provenance obligatoire de tout statut » : un statut
      IMPLÉMENTÉ verifie:code_direct prouve qu'un chemin existe dans le
      code, pas qu'il est réellement joignable une fois déployé — la
      vérification actuelle de RG-015 ne couvre que le premier, laissant
      le second non vérifié malgré le statut affiché.
    classe: ecart-code-deploiement
    gravite: moyenne
    statut: resolu
    critere_de_resolution: >
      Soit un service ollama est ajouté à docker-compose.yml (dev) et
      docker-compose.prod.yml (prod) avec OLLAMA_URL pointant dessus par
      défaut dans l'environnement conteneurisé, soit REFERENTIEL.md
      documente explicitement que RG-015 n'est vérifiée qu'en développement
      local hors conteneur et reste [À CONFIRMER] pour le déploiement
      conteneurisé réel — décision à trancher avec le porteur, pas à
      décider seul (cf. CLAUDE.md "Réparer n'est pas développer").
    detecte_le: "2026-07-30"
    source: >
      Lecture de docker-compose.yml et docker-compose.prod.yml (aucune
      occurrence de "ollama"), comparée à
      server/src/config/env.ts#OLLAMA_URL (default
      http://localhost:11434) et server/src/services/llm.client.ts.
    confiance: haute
    note: >
      Non bloquant pour le lancement à ce jour (0 client actif, module IA
      non encore utilisé en production réelle) — mais bloquant dès la
      première tentative réelle d'utilisation du module en environnement
      conteneurisé déployé.

      Corrigé (session ultérieure, même jour 2026-07-30, décision du
      porteur via AskUserQuestion : ajouter le service plutôt que
      documenter l'écart) : service ollama ajouté à docker-compose.yml
      (dev, port 11434 publié, healthcheck ollama list) et
      docker-compose.prod.yml (prod, non publié, server en dépend via
      depends_on/condition service_healthy). server/.env.example
      documente OLLAMA_URL pour les deux cas (localhost:11434 si le
      serveur tourne sur l'hôte, http://ollama:11434 si le serveur est
      lui-même conteneurisé). Les deux fichiers compose validés
      syntaxiquement (docker compose config). Commité (aebe1b9), CI
      verte confirmée (6/6) — statut corrigé à resolu. Note : la CI ne
      télécharge/exécute pas un vrai modèle Ollama (hors scope de ses
      checks actuels) — la preuve porte sur la syntaxe des compose et le
      typecheck/lint/tests du serveur, pas sur un test d'intégration
      Ollama de bout en bout.

  - id: SEC-040
    titre: >
      Les 3 endpoints POST /ai/brief, /ai/tasks (et par extension le
      persona task-planner) ne sont appelés par aucun code de
      client/src — grep exhaustif sur "/ai/brief", "/ai/tasks",
      "brief-generator", "task-planner" côté client : zéro résultat, seul
      ChatMessage (type) est importé depuis client/src/api/ai.api.ts par
      AIAssistantFloat.tsx ; brief-generator/task-planner sont du code
      serveur testé et audité (SEC-033/034) mais structurellement
      inatteignable par un utilisateur du produit
    perimetre: 4.11-ia
    regle_violee: >
      Aucune règle explicite de REFERENTIEL.md ne couvre ce cas — constat
      de couverture produit : une capacité serveur sans point d'entrée
      frontend ne peut générer aucune valeur pour l'utilisateur final,
      quel que soit son niveau de qualité/test côté code.
    classe: capacite-serveur-sans-point-dentree-frontend
    gravite: mineure
    statut: resolu
    critere_de_resolution: >
      Décision du porteur tranchée et actée dans REFERENTIEL.md §7 :
      soit un point d'entrée frontend réel est construit pour
      generateBrief/generateTasks (ex. bouton dans l'écran projet), soit
      ai.routes.ts (routes /ai/brief, /ai/tasks), ai.controller.ts
      (generateBrief, generateTasks) et agentOrchestrator.service.ts sont
      retirés comme code mort — dans les deux cas, ne pas laisser cette
      ambiguïté se reformuler indéfiniment comme un simple constat
      d'audit sans décision actée.
    detecte_le: "2026-07-30"
    source: >
      Grep exhaustif "/ai/brief", "/ai/tasks", "brief-generator",
      "task-planner", "generateBrief", "generateTasks" sur client/src/ :
      seul le type ChatMessage (aiConversation, chemin distinct) est
      utilisé. Lecture de client/src/api/ai.api.ts et
      client/src/components/AIAssistantFloat.tsx confirmant qu'ils ne
      couvrent que /ai/chat et /ai/conversations/*, jamais /ai/brief ni
      /ai/tasks.
    confiance: haute
    note: >
      Décision produit, pas un bug — laissé ouvert pour discussion
      explicite avec le porteur (CLAUDE.md "Réparer n'est pas
      développer" : construire un point d'entrée frontend serait un
      développement, pas une réparation).

      Tranché (session ultérieure, même jour 2026-07-30, AskUserQuestion) :
      décision du porteur de retirer le code mort plutôt que construire
      un point d'entrée frontend. ai.routes.ts (routes /ai/brief,
      /ai/tasks retirées, /ai/chat conservée), ai.controller.ts
      (generateBrief/generateTasks retirés, chat conservé),
      agentOrchestrator.service.ts et agents/personas.ts supprimés dans
      leur intégralité (aucun autre fichier ne les importait, confirmé
      par grep). ai.validator.ts réduit à chatSchema seul. Tests obsolètes
      retirés (personas.test.ts, aiValidator.test.ts) ou allégés
      (ai.endpoint.test.ts, aiExecutionAccessClient.test.ts gardent
      uniquement ce qui reste pertinent : authorize() sur /ai/chat, et la
      preuve grep RG-016/RG-017 qu'aucune primitive d'exécution n'existe).
      Suite complète (test:unit) : 702/702 verts localement. Décision
      actée ici même, reportée dans REFERENTIEL.md §7 dans la même passe
      de commit (règle CLAUDE.md sur la traçabilité des décisions du
      porteur). Commité (aebe1b9), CI verte confirmée (6/6) — statut
      corrigé à resolu.

  - id: SEC-039
    titre: >
      llm.client.ts#callOllama retombe silencieusement sur "Désolé, je
      n'ai pas pu générer de réponse." (data.message?.content ?? ...) si
      Ollama répond 200 avec un content vide/absent — ce texte de repli
      est ensuite persisté comme un vrai message ASSISTANT en base
      (aiConversationRepository.addMessage), indistinguable pour le
      client d'une réponse légitime du modèle
    perimetre: 4.11-ia
    regle_violee: >
      Aucune règle explicite de REFERENTIEL.md ne couvre ce cas — même
      classe que SEC-033 (repli silencieux sur un cas anormal plutôt
      qu'un signal explicite), sur un site de code distinct
      (llm.client.ts, pas personas.ts) — ID distinct par la règle "même
      classe, critère de résolution différent → ID distinct".
    classe: repli-silencieux-reponse-vide
    gravite: mineure
    statut: resolu
    critere_de_resolution: >
      callOllama lève une erreur explicite (ex. HttpError 502) si
      data.message?.content est vide/absent, au lieu de retomber sur un
      texte fixe indistinguable d'une vraie réponse — vérifié par un test
      qui appelle réellement callOllama contre une réponse mockée/réelle
      à content vide et assère le rejet.
    detecte_le: "2026-07-30"
    source: >
      Lecture directe de llm.client.ts#callOllama (ligne ~44-46).
    confiance: haute
    note: >
      Non bloquant pour le lancement — dégrade la détectabilité d'une
      panne du modèle (l'utilisateur voit une réponse plausible plutôt
      qu'une erreur claire), pas une faille de sécurité. Backlog
      post-lancement.

      Corrigé (session ultérieure, même jour 2026-07-30) : callOllama
      lève désormais HttpError(502, "Ollama provider returned an empty
      response") si data.message?.content est vide/absent, au lieu du
      texte de repli fixe. Nouveau server/test/llmClientEmptyResponse.test.ts :
      appelle réellement callOllama, avec mock.method sur globalThis.fetch
      (primitive Node simple, pas un délégué Prisma étendu — mockable
      directement, contrairement au piège rencontré sur SEC-009) pour
      simuler une réponse 200 à content vide, et assère le rejet 502.
      process.env.OLLAMA_URL n'a pas pu être utilisé pour ce test : env.ts
      résout et fige OLLAMA_URL au premier import du module
      (envSchema.parse(process.env)), qui se produit déjà via un fichier
      importé plus tôt dans test/run-all.test.ts avant que ce test-ci ne
      s'exécute — un override tardif de process.env n'a alors aucun effet
      (confirmé par l'échec initial de ce test en suite complète alors
      qu'il passait isolément). Suite complète (test:unit) : 702/702
      verts. Commité (aebe1b9), CI verte confirmée (6/6 checks GitHub
      Actions completed/success) — statut corrigé à resolu.

  - id: SEC-035
    titre: >
      aiConversationService.create/addMessage persistent le message USER
      (aiConversationRepository.addMessage) AVANT d'appeler callOllama —
      si l'appel échoue (timeout 120s, Ollama indisponible), l'exception
      remonte telle quelle au client (5xx) mais le message USER reste
      durablement enregistré sans réponse ASSISTANT associée ; un client
      qui renvoie le même message après l'erreur crée un second message
      USER orphelin dans l'historique de la même conversation, aucun état
      « échoué » n'est jamais écrit
    perimetre: 4.11-ia
    regle_violee: >
      Aucune règle explicite de REFERENTIEL.md ne couvre ce cas — constat
      relevé pendant l'audit B (intégrité des données) du module 4.11 :
      écriture partielle en base sans marquage d'état d'échec, exposant un
      retry naïf du client à des messages dupliqués silencieusement.
    classe: ecriture-partielle-sans-etat-echec
    gravite: mineure
    statut: resolu
    critere_de_resolution: >
      Le message USER n'est persisté qu'après succès de callOllama (ou,
      si un enregistrement immédiat est préféré pour ne pas perdre la
      saisie utilisateur, un champ de statut explicite marque l'échec de
      la génération de réponse) — vérifié par un test qui simule un échec
      de callOllama et assère l'état final de la conversation (pas de
      message USER sans réponse laissé en état ambigu, ou statut d'échec
      explicite lisible par le client).
    detecte_le: "2026-07-30"
    source: lecture_directe
    confiance: haute
    note: >
      Corrigé (session du 2026-07-30) : aiConversationService.create/
      addMessage appellent désormais callOllama AVANT toute écriture Prisma
      — aucun message n'est persisté si l'appel échoue. Nouveau
      server/test/aiConversationOllamaFailure.test.ts : appelle réellement
      aiConversationService.create contre une vraie base, avec Ollama
      injoignable dans cet environnement (OLLAMA_URL par défaut
      localhost:11434, aucun serveur Ollama local) pour déclencher le vrai
      chemin d'échec, et assère qu'aucune AiConversation n'est créée.
      Commité (f5d0b9f), CI verte confirmée (6/6 checks GitHub Actions
      completed/success : server, client, e2e, contrast-check, i18n-check,
      restore-smoke-test) — statut corrigé à resolu.

  - id: SEC-033
    titre: >
      personas.ts#getPersona retombe silencieusement sur le premier
      persona du Record (Object.values(personas)[0]) pour un id inconnu
      au lieu de retourner undefined/lever — actuellement non exploitable
      (les 2 seuls appelants, generateBrief/generateTasks, codent
      personaId en dur), mais un futur appelant passant un id utilisateur
      directement à getPersona exécuterait silencieusement le mauvais
      persona plutôt que d'échouer
    perimetre: 4.11-ia
    regle_violee: >
      Aucune règle explicite de REFERENTIEL.md ne couvre ce cas — constat
      de robustesse défensive relevé pendant l'audit A (sécurité
      applicative) du module 4.11, catégorie « repli silencieux sur entrée
      invalide » déjà rencontrée ailleurs dans le dépôt.
    classe: repli-silencieux-id-invalide
    gravite: mineure
    statut: resolu
    critere_de_resolution: >
      getPersona(id) lève une erreur explicite (ou retourne undefined
      géré par l'appelant) pour un id absent de personas, au lieu de
      retomber sur Object.values(personas)[0] — vérifié par un test qui
      appelle réellement getPersona avec un id inconnu et assère le rejet.
    detecte_le: "2026-07-30"
    source: lecture_directe
    confiance: haute
    note: >
      Corrigé (session du 2026-07-30) : getPersona retourne désormais
      Persona | undefined (personas[id], sans fallback) ; le check
      agentOrchestrator.service.ts#executeAgent (if (!persona) throw
      HttpError(404)) devient effectif au lieu d'être du code mort, et le
      même check a été ajouté dans callAgentWithRetry pour couvrir l'autre
      appelant. Nouveau server/test/personas.test.ts : appelle réellement
      getPersona avec un id inconnu (undefined attendu) et un id connu
      (persona attendu). Commité (f5d0b9f), CI verte confirmée (6/6 checks
      GitHub Actions completed/success) — statut corrigé à resolu.

  - id: SEC-034
    titre: >
      generateBriefSchema/generateTasksSchema (POST /ai/brief, POST
      /ai/tasks) valident context: z.record(z.any()) sans aucune limite de
      taille/profondeur — le payload part directement en
      JSON.stringify(contextData) vers Ollama (agentOrchestrator.service.ts),
      seul aiRateLimit (limite de fréquence) protège ce chemin, aucune
      limite de volume
    perimetre: 4.11-ia
    regle_violee: >
      Aucune règle explicite de REFERENTIEL.md ne couvre ce cas — constat
      relevé pendant l'audit A (sécurité applicative) du module 4.11 :
      validation d'entrée non bornée en taille/profondeur sur un champ
      transmis tel quel à un service externe (Ollama).
    classe: validation-entree-non-bornee
    gravite: mineure
    statut: resolu
    critere_de_resolution: >
      generateBriefSchema/generateTasksSchema imposent une limite de
      taille sérialisée (ex. JSON.stringify(context).length borné) et/ou
      de profondeur sur le champ context, rejetant explicitement un
      payload hors limite — vérifié par un test qui appelle réellement le
      validator avec un payload oversized et assère le rejet.
    detecte_le: "2026-07-30"
    source: lecture_directe
    confiance: haute
    note: >
      Corrigé (session du 2026-07-30) : ai.validator.ts#agentContext ajoute
      un .refine() rejetant tout context dont la sérialisation JSON dépasse
      20000 caractères (même borne que cvExtraction.service.ts pour un
      texte/objet qu'un agent traite). Nouveau server/test/aiValidator.test.ts :
      appelle réellement generateBriefSchema/generateTasksSchema avec un
      context normal (accepté) et un context de 21000 caractères sérialisés
      (rejeté sur les deux schémas). Commité (f5d0b9f), CI verte confirmée
      (6/6 checks GitHub Actions completed/success) — statut corrigé à
      resolu.
