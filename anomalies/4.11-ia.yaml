      pour l'appelant) alors que businessMetrics.logAgentCall a déjà
      enregistré success:true dans le finally
    perimetre: 4.11-ia
    regle_violee: >
      Aucune règle explicite de REFERENTIEL.md ne couvre ce cas — constat
      de conception : aiConversationService.create n'a jamais été un
      simple insert (elle appelle toujours callOllama), donc l'utiliser
      comme mécanisme d'archivage générique dans executeAgent double
      silencieusement le coût/la latence de chaque appel agent, et
      dissocie le résultat métier réel (déjà produit avec succès) du
