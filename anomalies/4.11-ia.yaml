  - id: SEC-042
    titre: >
      callAgentWithRetry (agentOrchestrator.service.ts) retente sur
      n'importe quelle erreur catch — y compris un 502 Ollama réel ou un
      persona introuvable — au lieu de restreindre le retry aux erreurs de
      parsing (extractJson/JSON.parse/schema.parse), gaspillant un cycle
      complet (jusqu'à 240s) sur des erreurs qu'un retry identique ne peut
      pas corriger ; l'erreur finale (lastError) remonte brute au
      middleware d'erreur, donc une ZodError de schema.parse sort en 500
      générique au lieu d'un code lisible (422/502)
    perimetre: 4.11-ia
    regle_violee: >
      Aucune règle explicite de REFERENTIEL.md ne couvre ce cas — constat
      de robustesse/UX d'erreur : un retry doit cibler une classe
      d'erreur transitoire/corrigible par répétition (parsing JSON
      malformé), pas s'appliquer indifféremment à toute exception,
      surtout quand chaque tentative coûte jusqu'à 120s.
    classe: retry-non-borne-a-la-classe-derreur
    gravite: moyenne
    statut: resolu
    critere_de_resolution: >
      callAgentWithRetry ne retente que sur une erreur de parsing
      (extractJson, JSON.parse, schema.parse — distinguables par un type
      d'erreur dédié ou un discriminant), et propage immédiatement toute
      autre erreur (ex. HttpError d'callOllama) sans consommer de
      tentative supplémentaire. L'erreur finale remontée au client
      distingue un code lisible (422 sur échec de validation du schéma
      après épuisement des tentatives, 502 sur échec Ollama) plutôt qu'un
      500 générique. Vérifié par un test qui simule chaque type d'erreur
      séparément et assère le nombre d'appels à callOllama et le code
      HTTP final.
    detecte_le: "2026-07-30"
    source: >
      Lecture directe de agentOrchestrator.service.ts#callAgentWithRetry
      (lignes 42-80) : le seul catch (ligne 74) attrape toute erreur sans
      distinction de type avant de retenter.
    confiance: haute
    note: >
      Non bloquant pour le lancement — dégrade la latence perçue et la
      lisibilité des erreurs, pas une faille de sécurité ni un calcul
      métier faux. Backlog post-lancement.

      Résolu autrement (session ultérieure, même jour 2026-07-30) :
      agentOrchestrator.service.ts (seul emplacement de
      callAgentWithRetry) a été supprimé dans son intégralité — cf.
      SEC-040/SEC-043. Sans objet. Commité (aebe1b9), CI verte confirmée
      (6/6) — statut corrigé à resolu.

