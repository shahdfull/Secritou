  - id: SEC-034
    titre: >
      generateBriefSchema/generateTasksSchema (POST /ai/brief, POST
      /ai/tasks) valident context: z.record(z.any()) sans aucune limite de
      taille/profondeur — le payload part directement en
      JSON.stringify(contextData) vers Ollama (agentOrchestrator.service.ts),
      seul aiRateLimit (limite de fréquence) protège ce chemin, aucune
      limite de volume
    perimetre: 4.11-ia
    regle_violee: >
      Aucune règle explicite de REFERENTIEL.md ne couvre ce cas — constat
      relevé pendant l'audit A (sécurité applicative) du module 4.11 :
      validation d'entrée non bornée en taille/profondeur sur un champ
      transmis tel quel à un service externe (Ollama).
    classe: validation-entree-non-bornee
    gravite: mineure
    statut: resolu
    critere_de_resolution: >
      generateBriefSchema/generateTasksSchema imposent une limite de
      taille sérialisée (ex. JSON.stringify(context).length borné) et/ou
      de profondeur sur le champ context, rejetant explicitement un
      payload hors limite — vérifié par un test qui appelle réellement le
      validator avec un payload oversized et assère le rejet.
    detecte_le: "2026-07-30"
    source: lecture_directe
    confiance: haute
    note: >
      Corrigé (session du 2026-07-30) : ai.validator.ts#agentContext ajoute
      un .refine() rejetant tout context dont la sérialisation JSON dépasse
      20000 caractères (même borne que cvExtraction.service.ts pour un
      texte/objet qu'un agent traite). Nouveau server/test/aiValidator.test.ts :
      appelle réellement generateBriefSchema/generateTasksSchema avec un
      context normal (accepté) et un context de 21000 caractères sérialisés
      (rejeté sur les deux schémas). Commité (f5d0b9f), CI verte confirmée
      (6/6 checks GitHub Actions completed/success) — statut corrigé à
      resolu.
