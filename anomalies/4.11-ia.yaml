    classe: cout-latence-doubles-effet-de-bord-persistance
    gravite: eleve
    statut: resolu
    critere_de_resolution: >
      executeAgent persiste le résultat (persona, context, result) sans
      déclencher un second appel LLM — soit via un appel direct au
      repository (aiConversationRepository.create + addMessage, sans
      passer par le service qui appelle callOllama), soit via une nouvelle
      méthode dédiée du service qui n'appelle jamais Ollama. Le titre de
      la conversation archivée doit être lisible (ex. nom du persona +
      horodatage), pas un JSON tronqué. Un échec de la persistance ne doit
      plus faire perdre le résultat déjà produit par le LLM à l'appelant.
      businessMetrics.logAgentCall doit refléter le succès réel de
      l'appel agent, pas être invalidé par un échec de persistance
      indépendant. Vérifié par un test qui appelle réellement
      executeAgent et compte le nombre d'appels à callOllama (mocké au
      niveau module ou via une requête HTTP interceptée), assérant
      exactement 1 appel par exécution.
    detecte_le: "2026-07-30"
    source: >
      Lecture croisée de agentOrchestrator.service.ts#executeAgent
