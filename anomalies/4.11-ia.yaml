      (env_file: server/.env ajouté au service ollama-pull, avec
      ${OLLAMA_MODEL:-mistral} laissé tel quel dans entrypoint) ne
      corrigeait en réalité rien : Docker Compose interpole
      ${OLLAMA_MODEL} écrit directement dans entrypoint/environment au
      moment du parsing du YAML (contre le shell hôte / un .env racine),
      AVANT que env_file ne soit jamais injecté dans le conteneur —
      confirmé par test réel (ajout de OLLAMA_MODEL=llama3 à
      server/.env seul, aucun effet sur la commande résolue par docker
      compose config). La vraie correction nécessite $$OLLAMA_MODEL
      (échappé) pour laisser le shell du conteneur lui-même résoudre la
      variable au runtime, avec la valeur réellement injectée par
      env_file
    perimetre: 4.11-ia
    regle_violee: >
      Aucune règle explicite de REFERENTIEL.md ne couvre ce cas —
      constat de conception Docker Compose : l'interpolation de
      variable dans le YAML lui-même (${VAR}) et l'injection
      d'environnement dans le conteneur (env_file) obéissent à des
      moments et des sources différents, une confusion facile à
      commettre et à ne pas détecter sans test réel.
    classe: interpolation-compose-au-mauvais-moment
    gravite: moyenne
    statut: resolu
    critere_de_resolution: >
      docker-compose.yml et docker-compose.prod.yml#ollama-pull
      utilisent $$OLLAMA_MODEL (échappé, résolu par le shell du
      conteneur au runtime) plutôt que ${OLLAMA_MODEL} (résolu par
      Compose au parsing du YAML) — vérifié par test réel : ajouter
      OLLAMA_MODEL=<valeur> à server/.env doit changer le modèle
      effectivement demandé par ollama pull, confirmé par docker compose
      run --rm --entrypoint sh ollama-pull -c 'echo $OLLAMA_MODEL'.
    detecte_le: "2026-07-30"
    source: >
      Test réel effectué en corrigeant SEC-048 (dérive OLLAMA_MODEL,
      signalée par le porteur avec une correction proposée qui s'est
      révélée insuffisante) : ajout de OLLAMA_MODEL=llama3 à
      server/.env, docker compose -f docker-compose.yml config
      ollama-pull toujours résolu à "mistral" (défaut codé en dur dans
      entrypoint) malgré env_file déclaré — preuve directe que env_file
      n'atteint jamais l'interpolation ${...} du YAML.
    confiance: haute
    note: >
      Corrigé et vérifié dans la même session que sa découverte :
      docker compose run --rm --entrypoint sh ollama-pull -c 'echo
      "resolved model: $OLLAMA_MODEL"' avec OLLAMA_MODEL=llama3 dans
      server/.env retourne bien "resolved model: llama3" ; sans cette
      ligne, retombe correctement sur "mistral". Les deux fichiers
      compose validés syntaxiquement après correction. Commité (7de7599),
      CI verte confirmée (6/6 checks GitHub Actions completed/success).

