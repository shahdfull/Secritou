# Registre des anomalies — Secritou
#
# Ce fichier fait partie du registre éclaté (voir CLAUDE.md § « Procédure
# d'audit obligatoire »). Schéma par anomalie : id, titre, perimetre,
# regle_violee, classe, gravite, statut, critere_de_resolution, detecte_le,
# source, confiance, note.
# Ne jamais reformuler un titre existant — citer l'ID.
#
# Périmètre : 4.11 Module IA (agent-service)
# 0 anomalie(s) — registre remis à zéro le 2026-07-27, historique réel
# archivé sur la branche locale archive/anomalies-avant-reset (commit 3c03297).
#
# Reclassé GELÉ → ACTIF le 2026-07-30 (décision explicite du porteur, voir
# REFERENTIEL.md §7) — audit A/B/G démarré le jour même. Relecture
# approfondie (hors audit formel A/B/G, à la demande du porteur "on
# décortique le module IA ensemble") le même jour : SEC-039 à SEC-043.
# Contre-vérification du porteur sur les corrections apportées, même
# jour : SEC-044 à SEC-047 (dont des erreurs factuelles dans ce même
# registre, cf. SEC-046). Nouvelle contre-vérification du porteur sur
# la traçabilité laissée par les suppressions, même jour : SEC-048 à
# SEC-052 (dont une nouvelle erreur factuelle hors 4.11, transverse —
# voir anomalies/transverse.yaml#SEC-051). Audit indépendant demandé
# explicitement par le porteur le 2026-07-31 (agent sans mémoire de la
# session, pour vérifier si le registre mentait) : SEC-053, révélant que
# la clôture de SEC-049 elle-même était prématurée.

anomalies:
  - id: SEC-053
    titre: >
      SEC-049 (commentaires de test périmés après suppression de
      /ai/chat) était marquée resolu alors que son propre critère de
      résolution n'était pas rempli : aiExecutionAccessClient.test.ts
      lignes 9-10 affirmait toujours "authorize() covers the one
      remaining AI route, /ai/chat" — alors que /ai/chat avait été
      supprimée le même jour (SEC-044), rendant cette ligne fausse
      exactement comme SEC-049 elle-même le dénonçait. Découvert par un
      audit indépendant (agent sans mémoire de la session précédente),
      demandé explicitement pour vérifier si le registre mentait
      quelque part
    perimetre: 4.11-ia
    regle_violee: >
      CLAUDE.md « Un critère de résolution se vérifie sur un commit » et
      « provenance obligatoire de tout statut » — un statut resolu écrit
      sans relire la preuve après l'avoir affirmée n'est vérifié qu'en
      apparence. C'est aussi une récidive directe : SEC-049 dénonçait
      exactement ce défaut (commentaire de test périmé après suppression
      de code), et sa propre clôture a reproduit le même défaut sur son
      propre commentaire de clôture.
    classe: cloture-anomalie-prematuree
    gravite: mineure
    statut: en_cours
    critere_de_resolution: >
      aiExecutionAccessClient.test.ts ne mentionne plus /ai/chat comme
      route existante nulle part dans le fichier (vérifié par grep,
      pas seulement relecture visuelle). SEC-049 elle-même reste
      cohérente : soit son statut redevient en_cours jusqu'à
      vérification CI de ce nouveau correctif, soit un nouveau commit
      la confirme resolu avec la preuve à jour.
    detecte_le: "2026-07-31"
    source: >
      Audit indépendant demandé explicitement par le porteur du projet
      ("reauditer le module IA d'une maniere independatnte") — agent
      general-purpose sans contexte de la session précédente, lecture
      directe de aiExecutionAccessClient.test.ts confirmant la présence
      de la ligne "authorize() covers the one remaining AI route,
      /ai/chat" malgré le statut resolu de SEC-049.
    confiance: haute
    note: >
      Corrigé dans la même session que sa découverte : commentaire
      réécrit (lignes 6-9) pour dire explicitement que /ai/chat a été
      supprimée avec les endpoints persona, référence à
      /ai/conversations/* comme seule route IA restante. Statut laissé
      à en_cours : correctif écrit et vérifié (typecheck/lint)
      localement mais pas encore commité/vérifié en CI. Ce constat
      illustre la limite structurelle des relectures par le même agent
      qui a produit le travail initial — un audit véritablement
      indépendant (sans mémoire de session) reste le seul moyen fiable
      de vérifier qu'une clôture affirmée correspond à l'état réel du
      code, cf. la demande du porteur qui a directement produit cette
      découverte.

  - id: SEC-052
    titre: >
      La correction initiale proposée pour la dérive OLLAMA_MODEL
      (env_file: server/.env ajouté au service ollama-pull, avec
      ${OLLAMA_MODEL:-mistral} laissé tel quel dans entrypoint) ne
      corrigeait en réalité rien : Docker Compose interpole
      ${OLLAMA_MODEL} écrit directement dans entrypoint/environment au
      moment du parsing du YAML (contre le shell hôte / un .env racine),
      AVANT que env_file ne soit jamais injecté dans le conteneur —
      confirmé par test réel (ajout de OLLAMA_MODEL=llama3 à
      server/.env seul, aucun effet sur la commande résolue par docker
      compose config). La vraie correction nécessite $$OLLAMA_MODEL
      (échappé) pour laisser le shell du conteneur lui-même résoudre la
      variable au runtime, avec la valeur réellement injectée par
      env_file
    perimetre: 4.11-ia
    regle_violee: >
      Aucune règle explicite de REFERENTIEL.md ne couvre ce cas —
      constat de conception Docker Compose : l'interpolation de
      variable dans le YAML lui-même (${VAR}) et l'injection
      d'environnement dans le conteneur (env_file) obéissent à des
      moments et des sources différents, une confusion facile à
      commettre et à ne pas détecter sans test réel.
    classe: interpolation-compose-au-mauvais-moment
    gravite: moyenne
    statut: resolu
    critere_de_resolution: >
      docker-compose.yml et docker-compose.prod.yml#ollama-pull
      utilisent $$OLLAMA_MODEL (échappé, résolu par le shell du
      conteneur au runtime) plutôt que ${OLLAMA_MODEL} (résolu par
      Compose au parsing du YAML) — vérifié par test réel : ajouter
      OLLAMA_MODEL=<valeur> à server/.env doit changer le modèle
      effectivement demandé par ollama pull, confirmé par docker compose
      run --rm --entrypoint sh ollama-pull -c 'echo $OLLAMA_MODEL'.
    detecte_le: "2026-07-30"
    source: >
      Test réel effectué en corrigeant SEC-048 (dérive OLLAMA_MODEL,
      signalée par le porteur avec une correction proposée qui s'est
      révélée insuffisante) : ajout de OLLAMA_MODEL=llama3 à
      server/.env, docker compose -f docker-compose.yml config
      ollama-pull toujours résolu à "mistral" (défaut codé en dur dans
      entrypoint) malgré env_file déclaré — preuve directe que env_file
      n'atteint jamais l'interpolation ${...} du YAML.
    confiance: haute
    note: >
      Corrigé et vérifié dans la même session que sa découverte :
      docker compose run --rm --entrypoint sh ollama-pull -c 'echo
      "resolved model: $OLLAMA_MODEL"' avec OLLAMA_MODEL=llama3 dans
      server/.env retourne bien "resolved model: llama3" ; sans cette
      ligne, retombe correctement sur "mistral". Les deux fichiers
      compose validés syntaxiquement après correction. Commité (7de7599),
      CI verte confirmée (6/6 checks GitHub Actions completed/success).

  - id: SEC-050
    titre: >
      SEC-046 (registre) contient une incohérence interne : son
      critere_de_resolution exige "titre SEC-040 aligné sur son
      périmètre réel", mais sa propre note explique explicitement que le
      titre a été laissé inchangé conformément à la règle CLAUDE.md "ne
      jamais reformuler un titre existant" — le critère n'a donc jamais
      été rempli tel qu'écrit, bien que la correction réelle effectuée
      (celle décrite par la note) soit correcte et suffisante
    perimetre: 4.11-ia
    regle_violee: >
      Le schéma du registre exige que critere_de_resolution et note
      restent cohérents — un critère qui exige explicitement une action
      que la note explique ensuite ne pas avoir été prise (à raison, sur
      une base réglementaire correcte) laisse le critère littéralement
      non rempli à la lecture, même si le fond du traitement est juste.
    classe: incoherence-interne-registre
    gravite: mineure
    statut: resolu
    critere_de_resolution: >
      Le critere_de_resolution de SEC-046 est réécrit pour ne plus
      exiger un alignement du titre de SEC-040, cohérent avec la note
      qui explique pourquoi ce titre reste inchangé (règle CLAUDE.md
      "jamais son titre").
    detecte_le: "2026-07-30"
    source: >
      Contre-vérification du porteur du projet, lecture croisée du
      critere_de_resolution et de la note de SEC-046 dans le même
      fichier.
    confiance: haute
    note: >
      Corrigé dans la même session : critere_de_resolution de SEC-046
      réécrit pour retirer l'exigence de réalignement du titre, la note
      existante étant conservée telle quelle (elle explique correctement
      pourquoi ce point n'a pas été traité comme les 3 autres). Commité
      (7de7599), CI verte confirmée (6/6) — statut corrigé à resolu.

  - id: SEC-049
    titre: >
      Deux commentaires de test devenus faux après la suppression de
      /ai/chat (SEC-044), jamais mis à jour dans cette même passe :
      aiExecutionAccessClient.test.ts ligne 10 affirme "authorize()
      covers the one remaining AI route, /ai/chat" (route supprimée le
      même jour) ; ai.endpoint.test.ts se décrit comme couvrant
      "/ai/conversations/*" mais n'importe rien de
      aiConversation.routes.ts — il exerce authorize() de façon
      totalement isolée, sans jamais appeler le vrai routeur, donc son
      commentaire affirme une couverture que le test ne prouve pas
      réellement
    perimetre: 4.11-ia
    regle_violee: >
      Même classe que SEC-046 (affirmation non revérifiée écrite dans
      un commentaire) mais sur des commentaires de code, pas le
      registre — un commentaire qui affirme une couverture de test que
      le test ne prouve pas réellement induit en erreur toute
      relecture future.
    classe: commentaire-de-test-perime
    gravite: mineure
    statut: en_cours
    critere_de_resolution: >
      aiExecutionAccessClient.test.ts ne mentionne plus /ai/chat comme
      route existante. ai.endpoint.test.ts documente honnêtement qu'il
      teste authorize() en isolation (pas le routeur réel monté) — soit
      en corrigeant le commentaire pour dire précisément cela, soit en
      important réellement aiConversation.routes.ts pour que le test
      prouve ce qu'il affirme.
    detecte_le: "2026-07-30"
    source: >
      Contre-vérification du porteur du projet, lecture directe des
      deux fichiers de test après le commit 1977a5a.
    confiance: haute
    note: >
      Corrigé par la première option (commentaire honnête sur la portée
      réelle du test, pas d'import du routeur — un test qui monterait
      tout Express juste pour vérifier authorize() serait disproportionné
      face à un test HTTP déjà existant ailleurs si besoin). Commité
      (7de7599), CI verte confirmée (6/6) — statut corrigé à resolu.

      Rouvert (2026-07-31, SEC-053) : un audit indépendant (agent sans
      mémoire de cette session, demandé explicitement par le porteur
      pour vérifier si le registre mentait) a trouvé que la correction
      ci-dessus n'avait en réalité traité que ai.endpoint.test.ts —
      aiExecutionAccessClient.test.ts lignes 9-10 mentionnait toujours
      "/ai/chat" comme "the one remaining AI route" au moment de la
      clôture, alors que /ai/chat avait déjà été supprimée le même jour
      (SEC-044). Le statut resolu avait donc été écrit sans relire la
      preuve après l'avoir affirmée — exactement le défaut que SEC-049
      elle-même dénonçait. Corrigé à nouveau (2026-07-31) : commentaire
      réécrit pour dire explicitement que /ai/chat a été supprimée,
      référence à /ai/conversations/* comme seule route restante.
      Statut laissé à en_cours : correctif écrit et vérifié
      (typecheck/lint) localement mais pas encore commité/vérifié en CI.

  - id: SEC-048
    titre: >
      Trois statuts REFERENTIEL.md marqués IMPLÉMENTÉ/verifie:code_direct
      ou verifie:test citaient des fichiers supprimés le 2026-07-30
      (SEC-040/SEC-044) sans jamais être mis à jour dans les mêmes
      commits : RG-014 (agentOrchestrator.service.ts lignes 90-92,
      ai.endpoint.test.ts) — le fichier cité n'existe plus, et l'énoncé
      "seuls Admin et Manager peuvent déclencher un persona IA" n'a plus
      d'objet (plus de persona) ; RG-017 (ai.routes.ts,
      agentOrchestratorService.executeAgent "revérifie lui-même le
      rôle") — la défense en profondeur au niveau service décrite
      n'existe plus nulle part, seul le middleware authorize() protège
      désormais aiConversation.service.ts, qui ne vérifie aucun rôle
      dans ses propres méthodes ; §3.22 AiConversation/AiMessage
      (agentOrchestrator.service.ts intégral "qui persiste ces
      entités") — doublement faux, le fichier est supprimé ET
      l'orchestrateur n'a jamais été la couche CRUD réelle
      (aiConversation.repository.ts), erreur déjà identifiée et
      corrigée dans perimetre_code le 2026-07-17 mais jamais répercutée
      au niveau entité. Découvert par contre-vérification du porteur du
      projet, session du 2026-07-30, hors périmètre de SEC-046 (qui ne
      couvrait que 4.11 et le grep de 4 emplacements, celui-ci est un
      5e cas, dans §3, passé sous le radar)
    perimetre: 4.11-ia
    regle_violee: >
      CLAUDE.md « Provenance obligatoire de tout statut » — un statut
      IMPLÉMENTÉ dont la preuve cite un fichier supprimé n'est plus
      vérifié, quel que soit le fond de la règle. RG-017 aggrave le cas :
      sa preuve affirmait une défense en profondeur à deux niveaux
      (middleware + service) qui n'existe plus qu'à un seul niveau,
      sans que le statut/la preuve ne le reflète — exactement le type
      d'erreur (déduction non revérifiée) que RG-017 elle-même avait
      déjà signalé comme piège en v0.2.0.
    classe: affirmation-factuelle-non-sourcee
    gravite: moyenne
    statut: resolu
    critere_de_resolution: >
      RG-014 reformulée sur aiConversation.routes.ts (le seul chemin
      IA réel restant) ; RG-017 documente honnêtement la perte de la
      défense en profondeur au niveau service (aiConversation.service.ts
      ne vérifie aucun rôle) tout en confirmant que le middleware seul
      suffit à empêcher CLIENT/FREELANCER ; §3.22 pointe vers
      aiConversation.repository.ts (la vraie couche CRUD). Vérifié par
      lecture directe des 3 fichiers cités pour confirmer qu'ils
      décrivent maintenant fidèlement le code réel.
    detecte_le: "2026-07-30"
    source: >
      Contre-vérification du porteur du projet sur le commit 1977a5a —
      lecture croisée de REFERENTIEL.md §5 (RG-014, RG-017), §3.22, et
      du code réel (aiConversation.routes.ts ligne 22,
      aiConversation.service.ts intégral, aiConversation.repository.ts).
    confiance: haute
    note: >
      Corrigé dans la même session que sa découverte : les 3
      emplacements réécrits avec citation du code réel et une note
      explicite sur ce qui a changé depuis SEC-040/SEC-044, plutôt que
      de simplement remplacer un nom de fichier par un autre sans
      expliquer pourquoi. Commité (7de7599), CI verte confirmée (6/6
      checks GitHub Actions completed/success) — statut corrigé à
      resolu.

  - id: SEC-047
    titre: >
      SEC-041 (Ollama ajouté aux docker-compose) est incomplète : l'image
      ollama/ollama:latest démarre avec zéro modèle téléchargé — aucun
      "ollama pull" n'existe nulle part dans le dépôt. Le healthcheck
      "ollama list" réussit sur un store de modèles vide, donc le
      conteneur est déclaré healthy et server (depends_on:
      condition: service_healthy) démarre en croyant l'IA prête ; le
      premier POST /api/chat avec model:"mistral" échoue en 404 "model
      not found"
    perimetre: 4.11-ia
    regle_violee: >
      Aucune règle explicite de REFERENTIEL.md ne couvre ce cas — un
      healthcheck qui prouve seulement qu'un processus répond, pas que le
      service qu'il porte peut réellement traiter une requête, donne une
      fausse garantie à depends_on: condition: service_healthy.
    classe: healthcheck-ne-verifie-pas-la-vraie-disponibilite
    gravite: moyenne
    statut: resolu
    critere_de_resolution: >
      Le modèle Mistral est téléchargé au démarrage (ex. service
      ollama-pull dédié avec entrypoint "ollama pull ${OLLAMA_MODEL}",
      depends_on: [ollama]) et/ou le healthcheck vérifie la présence
      réelle du modèle (ollama list | grep -q ${OLLAMA_MODEL} || exit 1),
      avec un start_period suffisant pour le téléchargement initial
      (plusieurs minutes). Vérifié en démarrant réellement la stack
      compose et en confirmant qu'un POST /api/chat contre le service
      ollama répond sans erreur "model not found" dès que server devient
      accessible.
    detecte_le: "2026-07-30"
    source: >
      Contre-vérification du porteur du projet sur le commit aebe1b9
      (correction de SEC-041) — grep de "ollama pull" sur tout le dépôt :
      aucune occurrence.
    confiance: haute
    note: >
      Point connexe non traité, signalé par le porteur : aucune contrainte
      de ressources (mem_limit/deploy.resources) sur le service ollama —
      Mistral 7B consomme ~5 Go de RAM résidente, sur la même VM que
      postgres/redis/minio/server/client en dev comme en prod. Non
      bloquant pour le lancement (0 client actif) mais à surveiller avant
      toute mise en production réelle du module IA.

      Corrigé (session ultérieure, même jour 2026-07-30, AskUserQuestion :
      « Service ollama-pull dédié (Recommandé) ») : nouveau service
      ollama-pull dans docker-compose.yml et docker-compose.prod.yml,
      depends_on: ollama (condition: service_healthy), entrypoint
      "ollama pull ${OLLAMA_MODEL:-mistral}", restart: "no" (job
      one-shot, idempotent — un ollama pull sur un modèle déjà présent
      est un no-op). server ne dépend que du healthcheck d'ollama lui-même
      (pas d'ollama-pull) pour éviter qu'un redémarrage de server
      re-attende un pull déjà terminé sur le volume partagé. Les deux
      fichiers compose validés syntaxiquement (docker compose config).
      Démarrage réel testé (docker compose up -d ollama ollama-pull) :
      l'image ollama/ollama et le modèle mistral (4.4 GB) ont mis
      plusieurs dizaines de minutes à se télécharger vu le débit réseau
      de cet environnement, mais le pull s'est terminé avec succès
      (docker logs saas-ollama-pull-1 : "success", exit code 0 confirmé
      via docker inspect). docker exec saas-ollama-1 ollama list confirme
      mistral:latest (4.4 GB) présent. Vérification finale de bout en
      bout réussie : curl -X POST http://localhost:11434/api/chat avec
      model:"mistral" répond avec un vrai contenu généré (" Ok."),
      done:true, aucune erreur "model not found". Commité (f544927), CI
      verte confirmée (6/6 checks GitHub Actions completed/success) —
      statut corrigé à resolu, cette fois avec la preuve d'intégration
      complète qui manquait à la première tentative.

  - id: SEC-046
    titre: >
      REFERENTIEL.md §4.11, SEC-040 (titre et note), SEC-043 (note) et
      EXPLORATION.md (ligne 36, périmètre 4.11) contiennent des
      affirmations factuelles inexactes écrites après la suppression du
      chemin agent : REFERENTIEL.md affirme que /ai/chat est "consommé
      par AIAssistantFloat.tsx" (faux — ce composant n'importe que le
      type ChatMessage, la vraie logique réseau vit dans
      AIAssistantPage.tsx qui appelle uniquement useCreateConversation/
      useAddMessage, jamais aiApi.chat) ; SEC-043 affirme que /ai/chat
      "utilise aiConversation.service.ts" (faux — ai.controller.ts#chat
      appelle callOllama directement, ne persiste rien) ; le titre de
      SEC-040 dit "3 endpoints" mais n'en liste que 2 (généralisation du
      constat initial jamais mise à jour) ; EXPLORATION.md liste encore
      personas.ts et agentOrchestrator.service.ts comme fichiers lus du
      périmètre 4.11 alors qu'ils sont supprimés
    perimetre: 4.11-ia
    regle_violee: >
      CLAUDE.md « Provenance obligatoire de tout statut » et « Face à un
      blocage : le dire, ne jamais l'expliquer » — une affirmation
      factuelle sur un comportement de code doit être vérifiée avant
      d'être écrite, pas déduite par extrapolation d'un constat antérieur
      resté vrai en partie. Ces 3 affirmations ont été écrites comme des
      observations directes alors qu'elles n'avaient pas été revérifiées
      au moment précis de la rédaction (après la suppression du chemin
      agent, avant que SEC-044 ne révèle que /ai/chat était mort aussi).
    classe: affirmation-factuelle-non-sourcee
    gravite: moyenne
    statut: resolu
    critere_de_resolution: >
      Les 4 emplacements cités (REFERENTIEL.md §4.11, SEC-040, SEC-043,
      EXPLORATION.md ligne 36) sont corrigés pour refléter l'état réel du
      code après SEC-044 (retrait de /ai/chat) : plus aucune mention
      d'AIAssistantFloat.tsx "consommant" un endpoint IA au présent tant
      que ce n'est pas vérifié composant par composant, plus de référence
      à aiConversation.service.ts pour /ai/chat, une note ajoutée à
      SEC-040 expliquant l'imprécision de son titre sans le réécrire
      (règle CLAUDE.md "jamais son titre" — corrigé sous SEC-050 après
      une incohérence détectée entre cette exigence et ladite règle),
      EXPLORATION.md ne liste plus de fichiers supprimés comme "lus"
      sans le signaler comme tel.
    detecte_le: "2026-07-30"
    source: >
      Contre-vérification du porteur du projet sur le commit aebe1b9,
      confirmée par lecture directe de AIAssistantFloat.tsx (import du
      seul type ChatMessage, ligne 14), AIAssistantPage.tsx (useCreateConversation/
      useAddMessage, aucun import de aiApi), et ai.controller.ts#chat
      (appelle callOllama directement, ligne 32, aucun appel à
      aiConversationService).
    confiance: haute
    note: >
      Signal pris au sérieux : ce type d'erreur (déduction écrite comme
      observation) est exactement ce qui avait piégé RG-017 en v0.2.0
      selon CLAUDE.md — la correction de ce registre doit se faire dans
      la même passe que la correction de SEC-044/SEC-045, pas
      différée.

      Corrigé (même session, même jour 2026-07-30) : REFERENTIEL.md §4.11
      réécrit pour décrire précisément la vraie chaîne (AIAssistantFloat.tsx
      délègue à AIAssistantPage.tsx, qui appelle useCreateConversation/
      useAddMessage → /ai/conversations/*, jamais /ai/chat) et pour
      documenter le retrait de /ai/chat (SEC-044) au même titre que
      SEC-040. EXPLORATION.md ligne 36 corrigée pour marquer
      personas.ts/agentOrchestrator.service.ts/ai.controller.ts/
      ai.routes.ts/ai.validator.ts comme supprimés, sans les retirer de
      l'historique (ce sont des faits sur ce qui avait été lu à l'époque,
      pas une erreur en soi — seule l'absence de mise à jour après
      suppression était le défaut). SEC-043 (note) et SEC-040 (note,
      titre laissé inchangé conformément à la règle CLAUDE.md « jamais
      son titre ») corrigés avec le même luxe de détail. Commité
      (1977a5a), CI verte confirmée (6/6 checks GitHub Actions
      completed/success) — statut corrigé à resolu.

  - id: SEC-045
    titre: >
      businessMetrics.logAgentCall (server/src/observability/businessMetrics.ts)
      n'a plus aucun appelant depuis la suppression de
