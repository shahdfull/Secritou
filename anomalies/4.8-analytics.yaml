    note: |
      Constat incident (AUDIT_GRID.md, session du 2026-07-17). Grep exhaustif sur server/src/routes/index.ts pour "executiveMetrics" et "revenueForecast" : 0 résultat pour les deux. Les 6 fichiers (executiveMetrics.service.ts/.repository.ts/.controller.ts, revenueForecast.service.ts/.repository.ts/.controller.ts) existent et sont déjà listés dans le perimetre_code de REFERENTIEL.md §4.8, mais ne sont accessibles par aucun endpoint HTTP.
