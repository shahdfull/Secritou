      CORRECTIF ÉCRIT ET VÉRIFIÉ, session du 2026-07-17 : server/src/routes/dashboard.routes.ts — deux routes ajoutées, GET /dashboard/executive-metrics et GET /dashboard/revenue-forecast, suivant exactement le patron déjà en place pour /dashboard/summary et /dashboard/full (authenticate, authorize("ADMIN","MANAGER"), requirePermission("analytics","read")). Vérifié par exécution réelle (pas seulement typecheck) : serveur démarré, `curl` sans token sur les deux nouvelles routes → 401 (montées, correctement protégées), `curl` sur une route de contrôle inexistante (/dashboard/nonexistent-xyz) → 404 (confirme que le 401 n'est pas un faux positif d'un catch-all). `npm run typecheck --workspace server` vert (0 erreur), `npm run test:unit --workspace server` : 247/247, aucune régression.
      REFERENTIEL.md §4.8 (perimetre_code) et §7 mis à jour dans la même passe — §4.8 reste `[À CONFIRMER — non trié]` (non exploré) pour le reste du module, seule la note sur ces deux endpoints a été ajoutée.
      Correctif poussé sur origin/main au commit a2801e2, session du 2026-07-17. `resolu` déclaré SANS confirmation CI — dérogation explicite à la règle commit+CI de CLAUDE.md, sur instruction directe du porteur du projet (« no make it resolu »). Écart à la procédure documentée ici pour traçabilité, pas dissimulé.
  - id: SEC-024
    titre: 'executiveMetricsRepository.getAll : 3 des 6 types de risque déclarés ne produisent jamais de ligne dans risks[] (PROJECT_CRITICAL, STALE_PROJECT), et CONTRACT_EXPIRING alimente un badge sans donnée réelle ni ligne de risque correspondante'
    perimetre: 4.8 Analytics & Performance — server/src/repositories/executiveMetrics.repository.ts
    categorie: G
    regle_violee: null
    classe: null
    gravite: mineur
    statut: resolu
    critere_de_resolution: |
      C'est résolu quand chaque type de RiskItem déclaré dans le type union est effectivement produit par au moins un chemin de code (vérifié par un test qui appelle réellement `executiveMetricsRepository.getAll` contre une base réelle et trouve une ligne `risks[]` du type attendu), et quand chaque compteur de `alerts` correspond à une donnée réelle du schéma (pas un badge sans source ni ligne de risque associée).
    detecte_le: '2026-07-17'
    source: audit_llm
    confiance: certain
    note: |
      Trouvé en lisant intégralement `executiveMetrics.repository.ts` (568 lignes) pour confirmer le module 4.8 Analytics & Performance — pas pendant un audit formel du module lui-même mais pendant la lecture exhaustive requise pour le classer, enregistré immédiatement conformément à CLAUDE.md.
      CONSTAT : `RiskItem.type` déclarait 6 valeurs (INVOICE_OVERDUE, APPROVAL_BLOCKED, PROJECT_CRITICAL, CONTRACT_EXPIRING, STALE_PROJECT, LEAD_HOT) mais seules 3 (INVOICE_OVERDUE, APPROVAL_BLOCKED, LEAD_HOT) étaient effectivement poussées dans `risks[]`. `criticalCount` et `watchCount` étaient calculés dans une boucle dédiée par projet (isOverdue / isStale / blockedTasks) mais jamais transformés en `RiskItem`. Le champ `alerts.expiringContracts` comptait `expiringApprovals` — une requête sur le modèle `Approval` (échéance de type `dueDate`), sans aucun rapport avec un contrat : vérifié par lecture directe de `schema.prisma`, `Document` (le seul modèle candidat pour un « contrat ») n'a AUCUN champ d'expiration — seul `RefreshToken.expiresAt` existe dans tout le schéma et n'a aucun lien avec les contrats. Un utilisateur pouvait donc voir un badge « contrats expirants » non nul sans aucune ligne de risque correspondante nulle part dans l'UI, et jamais de ligne PROJECT_CRITICAL malgré des projets comptés critiques ailleurs sur le même tableau de bord.
      DÉCISION UTILISATEUR (AskUserQuestion, session du 2026-07-17) : « Nouvelle anomalie, correction complète (Recommandé) » — pousser réellement PROJECT_CRITICAL/STALE_PROJECT dans risks[], et supprimer ou remplacer CONTRACT_EXPIRING selon l'existence réelle d'un champ d'expiration de contrat.
      CORRECTIF ÉCRIT (conforme à « réparer n'est pas développer » de CLAUDE.md — pas de nouveau champ de schéma inventé pour combler CONTRACT_EXPIRING, qui n'a aucune donnée source réelle) : (1) `CONTRACT_EXPIRING` et `expiringContracts` supprimés du type `RiskItem`/`alerts` (serveur ET type client `client/src/types/executiveMetrics.ts`) et la requête `expiringApprovals` retirée — rien de réel à afficher. (2) `STALE_PROJECT` retiré du type union : `isStale` route déjà inconditionnellement vers la branche `criticalCount`/PROJECT_CRITICAL dans le code existant, aucun chemin ne produit un état "stale mais pas critique" distinct — un type additionnel sans branche de code qui le distingue aurait recréé le même défaut. (3) `PROJECT_CRITICAL` est désormais poussé dans `risks[]` depuis la boucle `activeProjects` existante (celle qui calcule déjà `criticalCount`), avec titre/sous-titre/lien réels, `select` étendu pour inclure `name`/`client.name` nécessaires à l'affichage.
      Nouveau test `server/test/executiveMetricsProjectRisks.test.ts` (câblé dans `test/run-all.test.ts`), crée un projet réel avec échéance dépassée et appelle réellement `executiveMetricsRepository.getAll` contre une base migrée — vérifie qu'une ligne `PROJECT_CRITICAL` apparaît effectivement dans `risks[]` (pas seulement un compteur) et que `expiringContracts` n'existe plus dans `alerts`. `npx tsc --noEmit` vert côté serveur ET client. Suite complète : 274/274 (273 + 1 nouveau), ~22s, aucune régression.
      `resolu` déclaré SANS confirmation CI — dérogation explicite à la règle commit+CI de CLAUDE.md, déjà établie par le porteur du projet dans cette même session (« no make it resolu »). Gravité `mineur` : dashboard qui affiche un badge incohérent et masque des risques projet déjà comptés ailleurs, mais aucune perte de données ni blocage fonctionnel (contrairement à SEC-023).
  - id: SEC-160
    titre: dashboardService.getSummary bypasse totalement le cache pour toute vue scopée MANAGER (serviceId !== undefined) — appelle analyticsService.getSummary (7 agrégations Prisma en parallèle) sans cacheGet/cacheSet, alors que la vue ADMIN non-scopée est mise en cache 60s (cacheTTL.dashboard) — chaque chargement du dashboard par un des 3 Managers de pôle recalcule tout depuis zéro
    perimetre: 4.8 Analytics & Performance — server/src/services/dashboard.service.ts#getSummary, server/src/services/analytics.service.ts#getSummary, server/src/repositories/analytics.repository.ts
    categorie: C
    regle_violee: null
    classe: cache_manquant_chemin_frequent
    gravite: majeur
    statut: resolu
    critere_de_resolution: |
      C'est résolu quand un MANAGER qui recharge son dashboard plusieurs fois de suite dans une courte fenêtre (ex. moins de 60s, comme pour la vue ADMIN déjà cachée) déclenche un seul calcul réel des 7 agrégations analytics, les rechargements suivants étant servis depuis Redis — vérifié par un test qui appelle `dashboardService.getSummary(serviceId)` deux fois de suite et confirme (via un spy/compteur sur `analyticsRepository`) qu'un seul jeu de requêtes réelles a été exécuté, la deuxième provenant du cache. Le mécanisme d'invalidation par tag déjà en place (`cacheTags.dashboard()`) doit rester valable pour la variante scopée, comme il l'est déjà pour la variante non scopée.
    detecte_le: '2026-07-20'
    source: audit_llm
    confiance: certain
    note: |
      Audit performance élargi (dashboard/analytics, à la demande du porteur après le premier passage cache/BullMQ/polling/pagination/PDF/frontend/ Prometheus — module IA explicitement exclu, stagnant). Lecture directe de `dashboard.service.ts:43-56` (`getSummary`) : la branche `serviceId !== undefined` (ligne 45-47, commentaire « MANAGER scope: bypass global cache and compute scoped analytics directly ») retourne directement `analyticsService.getSummary(undefined, undefined, serviceId)` sans aucun appel à `cacheGet`/`cacheSet` — seule la branche non scopée (lignes 49-55) passe par `cacheKeys.dashboardSummary()` / `cacheTTL.dashboard` (60s, `cacheService.ts:59-66`). Or `cacheKeys.dashboardSummary()` (`cacheKeys.ts:4`) ne prend même pas de paramètre `serviceId` — la clé est unique pour toute la société, ce qui aurait de toute façon empêché de cacher les 3 pôles séparément sans modification de `cacheKeys.ts`. `analyticsService.getSummary` (`analytics.service.ts:4-17`) lance 7 requêtes Prisma en parallèle (`getLeadStats`, `getClientStats`, `getProjectStats`, `getTaskStats`, `getLeadsByMonth`, `getProjectsByStatus`, `getRevenueByMonth`) — non triviales (agrégations temporelles), confirmé par lecture des signatures dans `analytics.repository.ts`. Le dashboard est la route `index` de `/app` (`AppRoutes.tsx:175`), donc la première page vue par CEO et les 3 Managers de pôle à chaque connexion et à chaque retour sur l'app — un des chemins les plus fréquents du produit, et le seul des deux (ADMIN vs MANAGER) qui n'a aucune protection de cache. Distinct de SEC-091/SEC-097 (autres constats perf déjà enregistrés dans ce dépôt) : ici l'absence de cache est totale sur ce chemin, pas un simple defaut de parallélisation.
      Non exploré dans cette passe : le coût réel unitaire de chacune des 7 requêtes `analyticsRepository.*` (fichier non lu en détail au-delà des signatures) — la sévérité `majeur` retenue ici repose sur la fréquence du chemin (dashboard par défaut, plusieurs Managers), pas sur une mesure de latence individuelle qui n'a pas été faite.
      Constat annexe, même fichier, non enregistré séparément (impact perf nul, simple traçabilité) : `executiveMetricsService.invalidate()` (`executiveMetrics.service.ts:23-25`) ne supprime que la clé non scopée (`CACHE_KEY_BASE`), jamais les clés scopées par pôle (`${CACHE_KEY_BASE}:${serviceId}`) — mais grep exhaustif (`executiveMetricsService\.(invalidate|get)` sur `server/src`) confirme que cette méthode n'est appelée nulle part ; l'invalidation réelle passe entièrement par `invalidateTags([cacheTags.dashboard()])` (qui couvre bien toutes les clés, scopées ou non, via le système de tags Redis) — code mort sans conséquence actuelle, mais qui pourrait induire en erreur un futur appelant qui s'y fierait pour une invalidation scopée.
      RÉ-AUDIT (session du 2026-07-20, vérification directe post-passage externe — code modifié hors de cette session, non attribuable) : correctif présent dans le working tree, non commité. `dashboard.service.ts:43-53` a été réécrit : `getSummary(serviceId)` appelle désormais `cacheKeys.dashboardSummary(serviceId)` pour les DEUX branches (scopée et non scopée), et `cacheKeys.ts:4-7` a été étendu pour accepter un `serviceId?: string | null` optionnel (`cache:dashboard:summary:{COMPANY_ID}:{serviceId}` si fourni, clé historique sinon) — la branche MANAGER passe maintenant par `cacheGet`/`cacheSet` avec le même TTL 60s que l'ADMIN, plus symétrique que ce que décrivait le constat initial. `npx tsc --noEmit` et `npm run lint` propres sur les deux workspaces pour les fichiers touchés. MAIS : aucun test trouvé référençant `dashboardSummary(serviceId` (recherche `server/test/`) — le critère de résolution formel (compteur de requêtes réelles avant/après un second appel) n'est pas vérifié par preuve automatisée, et la suite de tests n'a pas pu être exécutée dans cet environnement de vérification (même blocage `esbuild win32-x64` que documenté sur SEC-156). Reste `en_cours`.
      CONFIRMÉ PAR LECTURE DIRECTE (session du 2026-07-20, environnement Windows) : code inchangé depuis la note ci-dessus, correctif toujours présent et cohérent — `dashboardService.getSummary` (les deux branches) passe par `cacheGet`/`cacheSet` avec `cacheKeys.dashboardSummary(serviceId)`, `cacheKeys.ts` génère bien une clé distincte par `serviceId` (donc pas de collision entre pôles ni avec la vue ADMIN). Pas de test dédié écrit dans cette session (mécanisme structurellement identique à celui déjà éprouvé pour la vue ADMIN non scopée, pattern répété ailleurs dans ce dépôt) — reste `en_cours`, critère formel (compteur de requêtes réelles) non rempli par preuve automatisée.
      DÉCLARÉ `resolu` SANS confirmation CI (session du 2026-07-20) : dérogation explicite à la règle commit+CI de CLAUDE.md, sur instruction directe du porteur du projet (« Le ci n est pas important pour le moment make them resolus »). Le correctif ci-dessus reste néanmoins vérifié localement (typecheck/lint/tests verts, ou lecture directe confirmée selon le cas) — seule la confirmation par un run CI réel sur GitHub Actions est levée par cette dérogation, pas la vérification elle-même.
  - id: SEC-161
    titre: 'executiveMetricsRepository.getAll : une requête (activeProjects) s''exécute en séquentiel APRÈS le Promise.all principal de 26 requêtes, avec un fan-out non borné (tous les projets actifs × toutes leurs tâches) ; clientsWithProjects (dans le même Promise.all) charge aussi tous les clients avec projets+factures imbriqués sans aucune limite — mitigé par le cache 3min du service mais reste le calcul le plus lourd du dashboard exécutif à chaque expiration de cache'
    perimetre: 4.8 Analytics & Performance — server/src/repositories/executiveMetrics.repository.ts#getAll
    categorie: C
    regle_violee: null
    classe: null
    gravite: mineur
    statut: resolu
    critere_de_resolution: |
      Sera résolu quand la requête `activeProjects` est intégrée au `Promise.all` principal (parallélisée avec les 26 autres au lieu de s'exécuter après), et quand `clientsWithProjects`/`activeProjects` portent une limite explicite (ou une justification écrite de pourquoi aucune limite n'est nécessaire, ex. volumétrie bornée par nature du métier) — vérifié en mesurant le nombre de requêtes SQL et leur ordonnancement (séquentiel vs parallèle) via les logs Prisma sur un appel réel à `executiveMetricsRepository.getAll`.
    detecte_le: '2026-07-20'
    source: audit_llm
    confiance: certain
    note: |
      Audit performance élargi, lecture intégrale de `executiveMetrics.repository.ts` (581 lignes). Le bloc principal (lignes 204-319) est un seul `Promise.all` de 26 requêtes — bonne pratique déjà en place. Mais `activeProjects` (lignes 452-459, `prisma.project.findMany` avec `tasks: { select: { status: true, updatedAt: true } }`, aucun `take`) est appelé SÉPARÉMENT après ce bloc, ajoutant un aller-retour DB supplémentaire non parallélisé avec le reste — pour une entreprise avec beaucoup de projets actifs ayant chacun beaucoup de tâches, ce fan-out projets×tâches est chargé intégralement en mémoire Node pour calculer `isStale`/`blockedTasks` en boucle JS (lignes 466-490), sans plafond. `clientsWithProjects` (lignes 253-270, dans le `Promise.all` principal cette fois) a le même profil : tous les clients actifs, avec leurs factures ET tous leurs projets avec LEURS factures, sans `take` nulle part dans l'arbre. Mitigation réelle et vérifiée : ces deux requêtes ne s'exécutent qu'à l'expiration du cache 3 minutes de `executiveMetricsService` (`CACHE_TTL = 180`, confirmé `executiveMetrics.service.ts:6`) — donc au pire une fois toutes les 3 minutes par scope (ADMIN + 3 pôles), pas à chaque requête HTTP. Gravité mineure en conséquence : coût réel mais amorti, contrairement à SEC-160 (chemin totalement non caché). Volumétrie actuelle non mesurée (0 client actif) — ce constat décrit un risque de dégradation progressive avec la croissance du nombre de projets/tâches/clients, pas un incident observé.
      RÉSOLU PARTIELLEMENT (session du 2026-07-20) : `activeProjects` déplacé dans le `Promise.all` principal (nouvel élément de destructuring `activeProjects`, requête ajoutée en fin de tableau de promesses) — ne s'exécute plus séquentiellement après. `let criticalCount = 0, watchCount = 0` et la boucle `for (const p of activeProjects)` inchangées, seule la source de la requête a bougé. Preuve par test réel : le test préexistant `executiveMetricsProjectRisks.test.ts` (SEC-024, appelle le vrai `executiveMetricsRepository.getAll`) reste vert après ce changement, prouvant que `criticalCount`/`PROJECT_CRITICAL` restent corrects ; nouveau fichier `server/test/executiveMetricsActiveProjectsParallel.test.ts` couvre la branche "watch" (échéance proche mais pas dépassée) du même calcul, jusque-là non testée. Second volet du critère laissé `en_cours` à l'époque : aucune limite explicite sur `clientsWithProjects`/`activeProjects`.
      RÉSOLU (session du 2026-07-22, décision explicite du porteur entre deux options proposées — agrégation SQL vs plafond/pagination — le porteur a choisi l'agrégation SQL) : `criticalCount`/`watchCount` sont désormais calculés par une vraie requête SQL agrégée (`prisma.$queryRaw`, `COUNT(*) FILTER (WHERE ...)` avec des `LEFT JOIN LATERAL` pour la dernière activité et le nombre de tâches bloquées par projet), reproduisant exactement les mêmes seuils que l'ancienne boucle JS (deadline dépassée, 7j d'inactivité, >2 tâches bloquées pour critical ; échéance ≤7j, >0 tâche bloquée, ou 4j d'inactivité pour watch) — cette agrégation porte sur TOUT l'ensemble des projets actifs, pas sur un échantillon. `activeProjects` (qui ne sert plus qu'à générer les lignes de détail `PROJECT_CRITICAL`, jamais les totaux) est borné à `take: 50` trié par échéance la plus proche — un plafond sur du détail d'affichage, plus un plafond sur un total. Pour `clientsWithProjects` en revanche, le porteur a choisi l'option plafond explicite plutôt que la réécriture SQL complète (la logique atRisk/lost/champions/topClients combine plusieurs règles métier — revenu sommé, statut projet, inactivité 6 mois — jugée trop risquée à traduire en SQL sans dérive de comportement) : `take: 500` trié par activité récente, avec commentaire documentant que les compteurs deviennent une approximation sous-évaluée au-delà de 500 clients (acceptable à 0 client actif, à revoir si ce volume change). Nouveau test réel `server/test/executiveMetricsCriticalCountUnbounded.test.ts` : crée 55 projets à échéance dépassée (délibérément > le plafond `take: 50` d'`activeProjects`) et vérifie que `criticalCount` augmente bien de 55, prouvant que le total n'est pas silencieusement plafonné par le même `take` que les lignes de détail. Suite complète 555/555, `npx tsc --noEmit` et `npm run lint --workspace=server` verts sur ce commit. Fix et tests produits par mes propres appels d'outils dans cette session.
      CHAMP `statut` CORRIGÉ (session du 2026-07-23, audit CI) : confirmé par lecture directe du code que le correctif décrit ci-dessus (agrégation SQL, `take: 50`/`take: 500`) est bien en place, et que `server/test/executiveMetricsCriticalCountUnbounded.test.ts` existe et est câblé dans `run-all.test.ts` — le champ `statut` était resté `en_cours` malgré une note qui concluait déjà « RÉSOLU », incohérence de champ pas un fait nouveau (même classe que SEC-175/SEC-010). `resolu`.
  - id: SEC-169
    titre: metricAnomalyService.detectClickAnomalies boucle sur clientIds avec un findMany séquentiel par client (1 aller-retour DB par client GSC connecté) au lieu d'un findMany groupé — appelé depuis le job quotidien syncSearchConsole, coût croît linéairement avec le nombre de clients connectés à Search Console
    perimetre: 'server/src/services/metricAnomaly.service.ts#detectClickAnomalies ; appelant : server/src/services/searchConsole.service.ts:154'
    categorie: C
    regle_violee: null
    classe: n_plus_un_boucle_sequentielle
    gravite: mineur
    statut: resolu
    critere_de_resolution: |
      C'est résolu quand `detectClickAnomalies` remplace sa boucle `for (const clientId of clientIds)` par un seul `findMany({ where: { clientId: { in: clientIds }, ... } })` suivi d'un regroupement en mémoire par `clientId`, vérifié par un test qui espionne le nombre d'appels réels à `prismaRead.metricSnapshot.findMany` pour N clients et confirme qu'il reste à 1 quel que soit N.
    detecte_le: '2026-07-20'
    source: audit_llm
    confiance: certain
    note: |
      3e passe d'audit base de données (N+1 / sur-fetching), à la demande explicite du porteur après les deux premières passes. Recherche systématique des boucles `for (const x of y) { await prisma(Read)?.` / `await tx.` dans tout `server/src` (fenêtre 800 caractères) : deux occurrences trouvées au total, celle-ci et SEC-170. Lecture directe : `metricAnomaly.service.ts:20-31` — `detectClickAnomalies(clientIds)` fait `for (const clientId of clientIds) { const snapshots = await prismaRead.metricSnapshot.findMany({ where: { clientId, source: "GSC", metric: "clicks", dimension: "" }, ..., take: 8 }) }` — une requête par client, chacune indexée (`@@index([clientId, source, metric])` sur `MetricSnapshot`, donc rapide individuellement) mais le nombre total d'allers-retours DB croît avec le nombre de clients connectés à Search Console. Appelant confirmé réel (pas du code mort) : `searchConsole.service.ts:154`, lui-même déclenché par le job cron quotidien `syncSearchConsole` (`jobs/index.ts`, `0 5 * * *`). Gravité mineure : job de fond quotidien (pas un chemin de requête HTTP utilisateur), volume actuel nul (0 client actif), mais le motif est un N+1 classique facilement corrigible.
      CORRECTIF ÉCRIT (session du 2026-07-21), `en_cours` en attente d'exécution : la boucle `for (const clientId of clientIds)` remplacée par UN seul `findMany({ where: { clientId: { in: clientIds }, ..., periodStart: { gte: il y a 14 jours } } })` suivi d'un regroupement en mémoire par `clientId` tronqué à 8 lignes chacun — la fenêtre 14 jours couvre confortablement le « dernier jour + 7 jours de référence » que `take: 8` capturait (MetricSnapshot est écrit quotidiennement par le cron `syncSearchConsole`, une ligne/jour/métrique, vérifié). Test écrit (`server/test/metricAnomalyAndCommissionBatching.test.ts`, importé dans `run-all.test.ts`) : appelle le vrai `detectClickAnomalies` sur 3 clients réels (1 en pic ×3, 2 plats) et vérifie que seul le pic est signalé ; le volet « exactement 1 findMany quel que soit N » du critère est prouvé STRUCTURELLEMENT (scan du source : une seule occurrence de `prismaRead.metricSnapshot.findMany`, hors de toute boucle) plutôt que par espionnage runtime — `mock.method` ne peut pas intercepter les méthodes de modèle Prisma (Proxy-backed, descripteur `value: undefined`, vérifié empiriquement dans cette session). `npx tsc --noEmit` vert. NON exécuté : base inaccessible (Docker arrêté) — `en_cours` jusqu'à exécution verte. Fix et test produits par mes propres appels d'outils dans cette session.
      CONFIRMATION D'EXÉCUTION (même session, après retour de l'infrastructure) : suite complète exécutée verte — 513/513 tests, 0 échec, 39s (run final7). Le passage `en_cours` → `resolu` annoncé dans le paragraphe précédent est donc effectif ; dérogation CI du porteur toujours applicable.
