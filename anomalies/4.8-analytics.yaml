# Registre des anomalies — Secritou
#
# Ce fichier fait partie du registre éclaté (voir CLAUDE.md § « Procédure
# d'audit obligatoire »). Schéma par anomalie : id, titre, perimetre,
# regle_violee, classe, gravite, statut, critere_de_resolution, detecte_le,
# source, confiance, note.
# Ne jamais reformuler un titre existant — citer l'ID.
#
# Périmètre : 4.8 Analytics & Performance
# 3 anomalie(s) — registre remis à zéro le 2026-07-27, historique réel
# archivé sur la branche locale archive/anomalies-avant-reset (commit 3c03297).

anomalies:
  - id: SEC-069
    titre: >
      server/test/executiveKpiSnapshotGrowth.test.ts (2e cas, SEC-031) crée
      un ExecutiveKpiSnapshot via prisma.executiveKpiSnapshot.create() (pas
      upsert) pour un serviceId réel partagé (premier Service trouvé en
      base) et un monthStart calculé sur le mois calendaire réel — si une
      ligne existe déjà pour ce (serviceId, monthStart), la contrainte
      unique échoue (Unique constraint failed sur
      COALESCE(serviceId,'__company_wide__')+monthStart). Reproduit de
      façon déterministe en isolation sur cette machine (pas un flake
      ponctuel) — le premier cas de la même suite écrit déjà une ligne
      company-wide pour le mois courant et la nettoie, mais rien ne
      garantit qu'aucune ligne pour le (service réel, mois précédent) du
      2e cas n'existe déjà (job cron réel déjà exécuté, run de test
      antérieur interrompu avant son cleanup after())
    perimetre: 4.8-analytics
    regle_violee: >
      Aucune règle métier — fiabilité de la suite de tests elle-même
      (catégorie B, intégrité des données, appliquée ici aux données de
      test). Un test qui utilise create() contre une ressource partagée
      identifiée par une clé métier réelle (service réel + mois calendaire
      réel) au lieu d'upsert() ou d'une donnée entièrement possédée par le
      test (ex. Service créé et détruit par le test lui-même) n'est pas
      idempotent : son succès dépend de l'état laissé par d'autres
      exécutions (cron réel, runs de test antérieurs), pas seulement du
      code qu'il prétend vérifier.
    classe: test-isolation-cle-unique-partagee
    gravite: mineure
    statut: resolu
    note_resolution: >
      Option (b) retenue par le porteur : le test crée et détruit
      désormais son propre Service dédié et jetable au lieu de réutiliser
      prisma.service.findFirst() — par construction, aucune ligne
      ExecutiveKpiSnapshot préexistante ne peut exister pour ce service,
      quel que soit le mois. Vérifié par 3 exécutions consécutives
      isolées (npx tsx --test test/executiveKpiSnapshotGrowth.test.ts),
      toutes vertes — exactement le critère de résolution ci-dessous.
      Commit 5ec8eb6. CI : premier push en échec sur taskBulkActions.test.ts
      (flake de timing sans rapport, fichier non touché par ce commit,
      même symptôme déjà observé et confirmé indépendant lors du push
      SEC-075/077), CI verte confirmée sur rerun --failed : run GitHub
      Actions 31001548991, tous jobs success (dont "server").
    critere_de_resolution: >
      Décision du porteur sur l'approche (ex. (a) upsert() au lieu de
      create() dans ce test, avec nettoyage explicite après ; (b) créer un
      Service dédié et jetable pour ce test au lieu de réutiliser
      prisma.service.findFirst() ; (c) autre). Vérifié par 3 exécutions
      consécutives de node --test --import tsx
      test/executiveKpiSnapshotGrowth.test.ts (isolément, pas seulement
      dans test/run-all.test.ts) sans échec de contrainte unique.
    detecte_le: "2026-08-01"
    source: >
      Découvert incidemment en lançant la suite complète server
      (npm run test:unit) après un changement sans rapport (module IA,
      docker-compose, i18n) — 758/760 tests verts, 1 skip, 1 échec sur ce
      test précis. Reproduit ensuite en isolation
      (node --test --import tsx test/executiveKpiSnapshotGrowth.test.ts) :
      même échec, même stack, confirmant que ce n'est pas un artefact du
      run complet (ex. contention DB entre suites parallèles) mais bien
      l'état réel de la base locale au moment du test.
    confiance: haute
    note: >
      Non corrigé dans cette session — hors périmètre de la tâche en cours
      (optimisation du module IA), et CLAUDE.md interdit de modifier un
      test pour le faire passer sans autorisation explicite ("un test
      rouge est une hypothèse sur le code, pas un défaut du test" — ici
      l'hypothèse la plus probable est un défaut du TEST lui-même, pas du
      code applicatif qu'il vérifie, mais trancher lequel des deux et
      choisir le correctif reste une décision du porteur, pas la mienne).
      Sans rapport avec SEC-031 (même fichier de test, mais SEC-031 est le
      bug métier déjà résolu que ce test vérifie — SEC-069 est un défaut
      du harnais de test lui-même, critère de résolution distinct).

  - id: SEC-031
    titre: >
      executiveMetricsRepository.getAll — overdueGrowthMoM/pendingGrowthMoM
      recalculent le « snapshot du mois dernier » en filtrant sur le
      status ACTUEL de la facture (status: {in:[...]}), pas sur son état
      réel fin du mois dernier — une facture en retard fin du mois
      dernier mais payée depuis (status désormais PAID) disparaît aussi
      du snapshot passé, biaisant systématiquement la croissance affichée
      vers une amélioration factice à chaque paiement d'ancienne facture
    perimetre: 4.8-analytics
    regle_violee: >
      Exactitude métier et financière (catégorie G) : un KPI de
      croissance mensuelle doit comparer deux états réellement distincts
      dans le temps — ici, la valeur "précédente" est recalculée avec les
      mêmes filtres de status que la valeur "actuelle" mais appliqués à
      des lignes qui ont pu changer de status entre-temps, ce qui n'est
      plus une reconstitution du passé mais une nouvelle lecture du
      présent restreinte par date de création/échéance.
    classe: kpi-historique-non-reconstitue
    gravite: moyenne
    statut: resolu
    critere_de_resolution: >
      Une décision du porteur du projet tranche l'approche (parmi :
      (a) un snapshot réel — table d'historique dédiée écrite chaque fin
      de mois (cron), permettant une comparaison contre un état
      effectivement figé ; (b) documenter explicitement la limite actuelle
      dans le libellé UI du KPI (ex. tooltip "approximatif, ne
      reconstitue pas l'historique de paiement") plutôt que de laisser
      croire à une vraie mesure de croissance ; (c) retirer
      overdueGrowthMoM/pendingGrowthMoM si jugés trompeurs sans solution
      simple). Ne pas trancher seul (CLAUDE.md « réparer n'est pas
      développer » — construire un vrai mécanisme de snapshot serait un
      développement, pas une correction). Décision du porteur
      (AskUserQuestion, session du 2026-07-30) : option (a).
    detecte_le: "2026-07-30"
    source: >
      Lecture intégrale de server/src/repositories/executiveMetrics.repository.ts
      (comparaison entre le calcul de cashGrowthMoM/cashGrowthYoY, basé
      sur Payment.paidAt — un fait immuable une fois enregistré — et
      overdueGrowthMoM/pendingGrowthMoM, basés sur Invoice.status — un
      champ mutable — appliqué avec dueDate/createdAt <= date passée mais
      status filtré sur sa valeur actuelle, pas sur un état historique
      réellement conservé).
    confiance: haute
    note: >
      Le commentaire du code lui-même reconnaît l'approximation
      ("doesn't try to reconstruct exact historical payment state") mais
      ne documente pas que l'effet net est un biais systématique dans UNE
      seule direction (amélioration artificielle), jamais neutre —
      dangereux précisément parce que présenté comme un vrai KPI de
      croissance sur le dashboard exécutif (executiveMetrics.controller.ts,
      consommé par les rôles ADMIN/MANAGER pour le pilotage). cashGrowthMoM/
      cashGrowthYoY et billedGrowthMoM ne sont pas concernés (basés sur
      Payment.paidAt/Invoice.createdAt, des faits immuables une fois
      posés, pas sur un status recalculable).
      Corrigé (session du 2026-07-30) : nouveau modèle
      ExecutiveKpiSnapshot (migration 20260730100000, index unique
      partiel COALESCE(serviceId, '__company_wide__') + monthStart —
      Prisma ne peut pas exprimer un index partiel dans le schéma, même
      pattern que Invoice.[projectId,invoiceType]), nouveau job
      jobNames.snapshotExecutiveKpis (cron quotidien 4h30, un
      upsert-par-find par pôle réel + une ligne company-wide, mêmes
      clauses where overdue/pending que la lecture live pour garantir la
      même définition dans le temps). executiveMetricsRepository.getAll
      lit désormais ce vrai snapshot du mois précédent au lieu de
      recalculer sur le status actuel ; retombe sur 0% (jamais +100%
      fabriqué par growthPct) si aucun snapshot n'existe encore pour un
      pôle. Nouveau server/test/executiveKpiSnapshotGrowth.test.ts (4
      cas, appelle réellement snapshotExecutiveKpis et
      executiveMetricsRepository.getAll contre une base migrée),
      enregistré dans test/run-all.test.ts. `verifie: test`.


  - id: SEC-028
    titre: >
      gscConnectionService (startConnect/getStatus/disconnect/
      completeConnect) et metricSnapshotController#getClientMetrics ne
      vérifient jamais que le clientId appartient au pôle du MANAGER
      appelant — un MANAGER peut initier/consulter/déconnecter une
      connexion Search Console et lire les métriques de n'importe quel
      client, hors de son pôle
    perimetre: 4.8-analytics
    regle_violee: >
      RG-002 (Rattachement mission → pôle → associé) par analogie — un
      Manager ne peut agir sur les ressources d'un client (ici, sa
      connexion Search Console et ses métriques) que dans son propre
      pôle, cohérent avec le filtre déjà appliqué à
      clientRepository.findById (where.projects.some.serviceId).
    classe: idor-scope-manque
    gravite: eleve
    statut: resolu
    critere_de_resolution: >
      Un test réel appelle gscConnectionService.startConnect/getStatus/
      disconnect/completeConnect et metricSnapshotRepository.getByClient
      (ou les routes correspondantes sous /gsc-connections) avec un scope
      MANAGER dont le serviceId ne correspond à aucun projet du client
      ciblé, et observe un rejet (403/404) au lieu d'un succès — pour
      chacune des méthodes.
    detecte_le: "2026-07-30"
    source: >
      Lecture intégrale de server/src/services/gscConnection.service.ts,
      server/src/controllers/gscConnection.controller.ts,
      server/src/routes/gscConnection.routes.ts,
      server/src/controllers/metricSnapshot.controller.ts (comparaison
      avec clientRepository.findById, qui applique déjà
      where.projects.some.serviceId pour MANAGER).
    confiance: haute
    note: >
      executiveMetrics.controller.ts/revenueForecast.controller.ts (même
      périmètre) sont déjà correctement scopés — buildServiceScope et
      forçage du serviceId pour MANAGER, vérifié par lecture directe.
      Le trou est isolé à la chaîne clientId directe
      (gscConnection.service.ts + metricSnapshot.controller.ts), jamais
      passée par buildServiceScope malgré authorize("ADMIN","MANAGER") en
      tête de gscConnection.routes.ts.
      Corrigé (session du 2026-07-30) : nouvelle fonction
      assertClientInScope (server/src/utils/serviceScope.ts, même pattern
      que assertProjectInScope/assertInvoiceInScope), appelée dans
      startConnect/getStatus/disconnect/completeConnect et
      getClientMetrics ; les contrôleurs construisent et transmettent le
      scope MANAGER. listAvailableSites (appelée uniquement depuis le
      callback OAuth non authentifié, clientId venant du state signé HMAC)
      non modifiée — hors de portée, modèle de confiance différent.
      Nouveau server/test/gscConnectionScopeManager.test.ts (6 cas,
      appelle réellement gscConnectionService contre une base migrée),
      enregistré dans test/run-all.test.ts. `verifie: test`.
