  - id: SEC-146
    titre: 'notifyN8n : le payload sortant ({event, payload, sentAt}) et le contrat de callback entrant n''ont aucun champ de version — docs/n8n-events.md ne documente pas de politique de compatibilité pour l''évolution du schéma'
    perimetre: server/src/utils/webhook.ts, docs/n8n-events.md
    regle_violee: null
    classe: null
    gravite: mineur
    statut: resolu
    critere_de_resolution: |
      C'est résolu quand docs/n8n-events.md documente explicitement une politique de versionnement du payload (ex. un champ `schemaVersion` dans le payload sortant de `notifyN8n`, ou une règle explicite d'additivité-seule des champs) — vérifiable par une recherche du mot "version" dans docs/n8n-events.md aboutissant à une règle concrète, pas seulement l'absence actuelle de toute mention.
    detecte_le: '2026-07-20'
    source: audit_llm
    confiance: certain
    note: |
      Vérifié par lecture directe : webhook.ts:21 (`JSON.stringify({ event, payload, sentAt: ... })`) ne porte aucun champ de version ; `verifyN8nTimestamp` (l.76-87) valide uniquement la fraîcheur (`timestamp`), pas une version de schéma. Un ajout ou renommage de champ dans `payload` (spécifique à chaque `event`) peut casser un workflow n8n existant sans qu'aucun mécanisme ne le signale côté émetteur ou récepteur. Gravité mineure : aucun incident constaté, 0 client actif, risque latent plutôt qu'actif.
      DÉCISION DU PORTEUR DU PROJET (AskUserQuestion, session du 2026-07-20) : documenter une politique d'additivité seule plutôt que d'ajouter un champ `schemaVersion` en code — aucun consommateur n8n réel n'existe encore (0 client actif) pour justifier le coût du changement de payload.
      CORRECTIF ÉCRIT (pas résolu — non commité), session du 2026-07-20 : section « Politique de compatibilité des payloads (SEC-146) » ajoutée à docs/n8n-events.md, formalisant la règle d'additivité stricte déjà respectée par l'historique des 25 événements (aucun renommage/retrait de champ constaté), et imposant un nouvel `event` (jamais une modification silencieuse) en cas de rupture future. Aucun changement de code.
      DÉCLARÉ `resolu` SANS confirmation CI (session du 2026-07-20) : dérogation explicite à la règle commit+CI de CLAUDE.md, sur instruction directe du porteur du projet (« Le ci n est pas important pour le moment make them resolus »). Le correctif ci-dessus reste néanmoins vérifié localement (typecheck/lint/tests verts, ou lecture directe confirmée selon le cas) — seule la confirmation par un run CI réel sur GitHub Actions est levée par cette dérogation, pas la vérification elle-même.
  - id: SEC-153
    titre: 'notifyN8n (webhook.ts) : après échec des 2 tentatives, l''événement est définitivement perdu — seul un logger.warn trace l''abandon, aucune trace persistée ni rejouable (proposal.accepted, invoice.paid, document.contract_signed, etc.)'
    perimetre: server/src/utils/webhook.ts
    regle_violee: null
    classe: null
    gravite: mineur
    statut: resolu
    critere_de_resolution: |
      C'est résolu quand un échec définitif de `notifyN8n` (après les 2 tentatives) persiste une trace exploitable (ex. une ligne dans une table dédiée, ou au minimum un `Sentry.captureException`/compteur Prometheus au lieu du seul `logger.warn`), permettant de détecter et rejouer manuellement un événement métier externe silencieusement perdu (ex. l'agence ne reçoit jamais l'email « proposition acceptée » sans qu'aucun signal ne le révèle).
    detecte_le: '2026-07-20'
    source: audit_llm
    confiance: certain
    note: |
      Vérifié par lecture directe : webhook.ts:44-49 — après le 2e essai raté, `logger.warn({ err, event }, "[n8n] Webhook delivery failed, giving up")` puis `return` silencieux, aucune autre action. Appelé en fire-and-forget (`void notifyN8n(...)`, sans await, ex. proposal.service.ts:546) par la quasi-totalité des 25+ événements catalogués dans docs/n8n-events.md — un n8n indisponible pendant la fenêtre des 2 tentatives (10s max, `TIMEOUT_MS * MAX_ATTEMPTS`) perd l'événement sans qu'aucun humain ni système de monitoring ne soit informé, contrairement à `enqueueDocumentGeneration` (jobs/queues.ts:197-209) qui logue ET capture Sentry ET reste dans la queue BullMQ pour un retry piloté par le worker en cas d'échec d'ENFILEMENT — mais même ce dernier mécanisme ne couvre pas `notifyN8n`, qui n'est pas enfilé du tout, juste appelé directement. Distinct d'un constat vérifié et écarté cette session : la génération de documents (SEC absent car aucun défaut trouvé) dispose déjà d'un retry durable via BullMQ + jobId déterministe (SEC-119/120) — ce n'est PAS le cas de `notifyN8n`, dont le fire-and-forget n'a aucun filet.
      Écarté après vérification (rapport tiers, non enregistré comme anomalie séparée) : (a) la formule de facture de solde (`project.service.ts:335-337`, complément à 100% de l'acompte réel) n'est PAS dupliquée de façon dangereuse — SEC-030 (résolu) a déjà confirmé par test réel que `balanceAmount` lit `depositInvoice.amountHT` (le montant réellement facturé), jamais une reconstruction indépendante à 70% ; `proposal.service.ts:466` ne calcule les 30% qu'une seule fois, à la création de l'acompte — il n'y a pas de second calcul de 30% ailleurs qui pourrait diverger. (b) l'absence de contrainte DB sur le plafond d'un avoir (`amount <= amountPaid`) est une garantie applicative documentée, pas un défaut caché — même famille de choix que les autres gardes service-only déjà actées dans ce dépôt (idempotence, cf. discussion SEC-149/session précédente) ; pas enregistré comme anomalie, à trancher par le porteur s'il souhaite une contrainte DB en plus. (c) l'absence de hash/IP/user-agent sur la signature de document (`document.service.ts#signDocument`) est réelle mais relève d'une décision produit (niveau de preuve juridique visé), pas d'un bug factuel — signalée ici pour arbitrage plutôt qu'enregistrée comme anomalie à corriger silencieusement.
      CORRECTIF ÉCRIT (pas résolu — non commité, pas de mécanisme de rejeu manuel), session du 2026-07-20 : ajout du minimum documenté dans le critère — compteur Prometheus dédié `n8nWebhookDeliveryFailures` (`observability/metrics.ts`, labellé par `event`) incrémenté à l'abandon définitif, ET `Sentry.captureException(error, { tags: { n8nEvent: event }, extra: { payload } })` sous le même garde `env.SENTRY_DSN` que le reste du dépôt (error.middleware.ts, jobs/queues.ts). Pas de table dédiée ni de rejeu automatique — ce correctif rend l'échec détectable (alerte Sentry, métrique consultable) mais ne construit pas de mécanisme de rejeu manuel, qui resterait à faire si le porteur le juge nécessaire à l'usage. `npx tsc --noEmit` propre, `npm run lint` 0 error/0 warning, suite `test:unit` complète 453/453 verte après le changement (aucune régression, aucun test n'exerçait ce chemin de code).
      DÉCLARÉ `resolu` SANS confirmation CI (session du 2026-07-20) : dérogation explicite à la règle commit+CI de CLAUDE.md, sur instruction directe du porteur du projet (« Le ci n est pas important pour le moment make them resolus »). Le correctif ci-dessus reste néanmoins vérifié localement (typecheck/lint/tests verts, ou lecture directe confirmée selon le cas) — seule la confirmation par un run CI réel sur GitHub Actions est levée par cette dérogation, pas la vérification elle-même.
  - id: SEC-158
    titre: README.md:294 décrit la génération des 7 PDFs après acceptation de proposition comme faite « using Promise.allSettled », alors que le code réel (depuis le correctif SEC-120) les enfile comme jobs BullMQ individuels (documentsQueue, jobId déterministe, concurrency:3) — la description d'architecture ne correspond plus au code
    perimetre: 'documentation — README.md ; code réel : server/src/services/proposal.service.ts#acceptWithCascadeAttempt, server/src/jobs/queues.ts#enqueueDocumentGeneration, server/src/jobs/index.ts (worker documents)'
    regle_violee: null
    classe: documentation_desynchronisee
    gravite: mineur
    statut: resolu
    critere_de_resolution: |
      C'est résolu quand README.md décrit exactement le mécanisme réel de génération des documents (jobs BullMQ individuels avec jobId déterministe et retry par job, pas un `Promise.allSettled` synchrone dans la requête HTTP) — vérifié par relecture croisée du paragraphe avec `queues.ts`/`jobs/index.ts` au moment de la correction.
    detecte_le: '2026-07-20'
    source: audit_llm
    confiance: certain
    note: |
      Audit performance (périmètre génération PDF, item 5 de la demande : évaluer le risque mémoire/CPU d'un `Promise.allSettled` de 7 PDFs et si un découplage BullMQ serait plus sûr). Lecture directe de `README.md:293-294` (« All 7 PDF types are triggered automatically after proposal acceptance using `Promise.allSettled` : failures never roll back the acceptance »). Lecture directe du code réel : `proposal.service.ts:514-521` construit un tableau `DocumentJob[]` puis appelle `enqueueDocumentGeneration(documentJobs)` (`queues.ts:197-209`), qui fait `documentsQueue.addBulk(...)` avec un `jobId` déterministe par document (`documentJobId`, correctif SEC-120, résolu) — aucun `Promise.allSettled` sur la génération de PDF nulle part dans `documentGenerator.service.ts`, `documents.processor.ts` ou `proposal.service.ts` (recherche `Promise.allSettled` dans ces fichiers : aucune occurrence). Le worker dédié (`jobs/index.ts:109-118`) tourne à `concurrency: 3` — au plus 3 PDFs générés simultanément par processus worker, pas 7. Le risque que l'item 5 de la demande demandait d'évaluer (7 générations pdfkit concurrentes dans le handler HTTP, mémoire/CPU pic synchrone) n'existe donc plus dans le code actuel — SEC-120 l'a déjà éliminé en résolvant un problème différent (idempotence des retries), avec cet effet de bord positif non documenté. Seul `README.md` décrit encore l'ancienne architecture, ce qui pourrait pousser un futur lecteur à「réparer」un problème de concurrence qui n'existe plus, ou à ne pas chercher le vrai mécanisme (jobId/retry BullMQ) là où il se trouve réellement.
      RÉSOLU (session en cours) : `README.md` (section "PDF generation") réécrit pour décrire le mécanisme réel — jobs BullMQ individuels via `documentsQueue`/`enqueueDocumentGeneration`, `jobId` déterministe par document, worker dédié à `concurrency: 3` — remplace la mention `Promise.allSettled` obsolète. Vérifié par relecture croisée avec `queues.ts:197-209`/`jobs/index.ts:109-118` au moment de la correction, comme demandé par le critère. Pas de test applicable (changement de documentation pure, aucun code) ; correction purement textuelle sur un fichier ne nécessitant pas de base de données pour être vérifiée.
  - id: SEC-186
    titre: markOverdueInvoices (cron quotidien) fait passer des factures SENT/PARTIAL à OVERDUE via updateMany sans jamais appeler auditLogService.record — seule transition de statut parmi les 4 citées par le porteur (émise/payée/en retard/annulée) absente de la table AuditLog, alors que send/addPayment/cancel y sont tous journalisés
    perimetre: 4.4 Facturation — server/src/jobs/processors/maintenance.processor.ts#markOverdueInvoices (lignes 246-265)
    regle_violee: null
    classe: trace_audit_transition_statut_manquante
    gravite: mineur
    statut: resolu
    critere_de_resolution: |
      C'est résolu quand `markOverdueInvoices` appelle `auditLogService.record` pour chaque facture qu'il fait passer à `OVERDUE` (actorId/actorRole null, système cron — le schéma `AuditLog` accepte déjà ces deux champs en nullable), au même titre que `send`/`addPayment`/`cancel` dans `invoice.service.ts`.
    detecte_le: '2026-07-21'
    source: audit_llm
    confiance: certain
    note: |
      Audit finance/RevOps (item 6, trace d'audit). Vérifié par lecture directe : `invoice.service.ts` appelle `auditLogService.record` pour `invoice.cancel` (ligne 164), `invoice.delete` (173), `invoice.send` (189), et le flux de paiement (285, dans `addPayment`) — 3 des 4 transitions citées par le porteur sont couvertes. `maintenance.processor.ts#markOverdueInvoices` (lignes 246-265) fait `prisma.invoice.updateMany({ data: { status: "OVERDUE" } } )` puis enchaîne directement sur l'envoi de notifications in-app, sans aucun appel à `auditLogService` entre les deux — confirmé par grep sur toute la fonction. La table `AuditLog` elle-même est vérifiée immuable en pratique : seul point d'écriture dans tout `server/src` est `auditLog.service.ts:21` (`prisma.auditLog.create`), aucun `.update`/`.delete` sur ce modèle trouvé nulle part — la partie « consultable indépendamment, immuable » de l'item 6 est donc satisfaite pour tout ce qui EST journalisé, seul le passage à OVERDUE manque à l'appel.
      RÉSOLU (session en cours) : `markOverdueInvoices` appelle désormais `auditLogService.record` (action `"invoice.markOverdue"`, `actorId`/`actorRole` null) pour chaque facture qu'il fait passer à `OVERDUE`, juste après le `updateMany`. Preuve par test réel (`server/test/markOverdueInvoicesAuditLog.test.ts`, nouveau fichier) : appelle `markOverdueInvoices` (code réel) sur une facture réelle avec `dueDate` dans le passé, vérifie le passage à `OVERDUE` ET la présence d'une ligne `AuditLog` avec `actorId: null`/`entityType: "Invoice"`/`action: "invoice.markOverdue"`. Suite complète verte (499 tests), `npx tsc --noEmit` et `npm run lint --workspace=server` verts. Fix et test produits par mes propres appels d'outils dans cette session. Dérogation CI déjà accordée par l'utilisateur pour cette session : `resolu` malgré l'absence de run CI vert sur ce commit précis.
  - id: SEC-191
    titre: 'userService.deleteUser appelle communicationQueue.getWaiting() SANS borne pour purger les notifications du user supprimé — hydrate chaque job en attente un par un (un HGETALL Redis par job) : avec un backlog réel (worker arrêté, ou file de dev accumulée à 42 054 jobs), la suppression d''un utilisateur gèle la requête HTTP pendant plusieurs minutes'
    perimetre: 4.0 Utilisateurs — server/src/services/user.service.ts#deleteUser ; server/src/jobs/queues.ts (communicationQueue)
    regle_violee: null
    classe: operation_non_bornee_chemin_requete
    gravite: majeur
    statut: resolu
    critere_de_resolution: |
      C'est résolu quand la purge best-effort des jobs du user supprimé dans deleteUser est bornée (plage explicite passée à getWaiting, ou mécanisme équivalent à coût constant) — vérifié par le fait qu'un DELETE /users/:id aboutit en temps normal même quand la file communication porte un backlog important, et que la suite de tests complète ne gèle plus sur les tests appelant deleteUser.
    detecte_le: '2026-07-21'
    source: manuel
    confiance: certain
    note: |
      Classée sous 4.13 Notifications & Automatisations (périmètre principal, égalité de score de classement automatique) — périmètre(s) secondaire(s) également concerné(s) : 4.14 Authentification & Compte utilisateur.

      Découvert incidemment en diagnostiquant deux gels reproductibles de la suite de tests complète (runs figés >29 min sans progression, toujours au même endroit : userDeleteFinancialHistory.test.ts, 3e cas, juste après le DELETE User du log Prisma — soit exactement la ligne suivante du code, communicationQueue. getWaiting()). Redis lui-même parfaitement sain (PONG immédiat depuis l'hôte ET le conteneur, port 6379 correctement mappé, CPU conteneurs <1%) — pas une panne de connexion, un coût O(n) avec n devenu énorme : LLEN bull:communication:wait = 42 054 jobs accumulés (chaque run de tests enfile des notifications réelles dans le Redis de dev, aucun worker ne tourne pendant les tests pour les consommer — accumulation sur des dizaines de runs, chaque run ralentissant le suivant). getWaiting() sans arguments hydrate la totalité (un aller-retour HGETALL par job via pipeline), d'où le gel apparent. En production le même code gèlerait le DELETE /users/:id de l'ADMIN pendant plusieurs minutes dès qu'un backlog existe (worker en panne une heure, par exemple) — et la purge visée est déjà best-effort par conception (try/catch, le worker tolère un user supprimé), donc un scan non borné n'a jamais été nécessaire. CORRIGÉ dans la même passe : getWaiting(0, 999) — plage bornée aux 1000 premiers jobs ; au-delà, les jobs du user supprimé sont simplement laissés au worker qui les ignorera (comportement déjà toléré). Nettoyage d'environnement effectué dans la même passe : FLUSHDB sur le Redis de dev (43 646 des 43 647 clés étaient du debris bull:* de tests ; le cache applicatif se reconstruit seul). Vérifié par la suite complète : les gels disparaissent et les tests deleteUser (SEC-165) repassent en durée normale — voir le run final vert de cette session. Distinct de SEC-119/120 (jobId déterministe, classe différente) et de SEC-165 (garde de suppression, même fonction mais critère différent). Fix produit par mes propres appels d'outils dans cette session. Dérogation CI déjà accordée par l'utilisateur pour cette session : `resolu` malgré l'absence de run CI vert sur ce commit précis.
