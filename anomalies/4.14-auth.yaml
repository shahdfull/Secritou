  - id: SEC-165
    titre: 'La suppression d''un User (DELETE /users/:id, ADMIN uniquement, route réellement câblée) cascade sur Commission, ProjectCommissionSplit et TimeEntry (onDelete: Cascade sur les trois relations) — supprimer le compte d''un des 3 associés détruit silencieusement tout son historique de commissions et de temps facturé, sans aucune garde dans userService.deleteUser'
    perimetre: 'schema.prisma#Commission, #ProjectCommissionSplit, #TimeEntry (relations vers User) ; server/src/services/user.service.ts#deleteUser ; server/src/repositories/user.repository.ts#delete'
    categorie: B
    regle_violee: null
    classe: null
    gravite: bloquant
    statut: resolu
    critere_de_resolution: |
      C'est résolu quand un ADMIN qui tente de supprimer un User ayant des `Commission`, `ProjectCommissionSplit` ou `TimeEntry` liés reçoit un refus explicite (409, comme le garde-fou déjà existant sur le dernier ADMIN) l'invitant à désactiver le compte plutôt qu'à le supprimer — ou, si la suppression doit rester possible, quand ces trois relations passent en `onDelete: Restrict` (ou `SetNull` avec un champ dédié préservant l'identité de l'ancien partenaire, ex. `partnerName` snapshot) au lieu de `Cascade` — vérifié par un test qui crée un User avec au moins une Commission réelle, tente `userService.deleteUser`, et confirme que la Commission survit (ou que la suppression est refusée), pas seulement que l'appel ne lève pas d'exception.
    detecte_le: '2026-07-20'
    source: audit_llm
    confiance: certain
    note: |
      Audit architecture base de données, item intégrité référentielle. Vérifié par lecture directe : `schema.prisma:1342` (`Commission.partner User @relation("PartnerCommissions", ..., onDelete: Cascade)`), `:1326` (`ProjectCommissionSplit.partner ..., onDelete: Cascade`), `:1603` (`TimeEntry.user ..., onDelete: Cascade`). `DELETE /users/:id` est une route réellement montée (`user.routes.ts:367`, `authorize("ADMIN")`), qui appelle `userService.deleteUser` (`user.service.ts:174-181`) — seule garde existante : bloquer la suppression du dernier ADMIN (`user.repository.ts#countByRole`), rien sur les enregistrements financiers liés. `userRepository.delete` (`user.repository.ts:155-162`) supprime explicitement les `RefreshToken` en amont puis appelle `prisma.user.delete(...)` — un vrai DELETE, pas un soft-delete (contrairement à `Client`/`Project`/`Invoice` qui ont tous un champ `deletedAt`, `User` n'en a aucun). `Commission` représente l'argent dû à un associé pour un paiement reçu (`server/src/repositories/commission.repository.ts`, confirmé par la doc du modèle dans schema.prisma:1336-1338) — REFERENTIEL.md §4.5 "Rémunération des associés" documente ce module comme le calcul de répartition entre les 3 associés + CEO. Supprimer le compte d'un associé (départ de l'agence, erreur de saisie, compte dupliqué) efface donc silencieusement, sans confirmation ni possibilité de récupération, tout l'historique de ce qui lui était dû — y compris des commissions déjà `PAID` dont la trace comptable disparaît. `TimeEntry` (temps facturé, certains `billed: true`) subit le même sort. Gravité `bloquant` (catégorie perte de données) : aucun volume actuel ne change ce constat, le risque est structurel et se déclenche au premier usage réel de "supprimer un utilisateur" sur un compte ayant déjà généré de l'activité financière — à distinguer d'un simple defaut mineur "0 client actif" comme SEC-111/112/113 : ici l'impact est catastrophique dès la première occurrence, pas graduel.
      Non exploré dans cette passe : si `deleteUser` est réellement utilisé en pratique aujourd'hui (0 client actif, probablement jamais exercé sur un compte avec activité) — n'change pas la gravité du défaut de conception, seulement la probabilité qu'il se soit déjà produit.
      RÉSOLU (session en cours) : ajout de `userRepository.hasFinancialHistory(id)` (`user.repository.ts`) qui compte `Commission`/`ProjectCommissionSplit`/`TimeEntry` liés au `partnerId`/`userId` cible, appelé dans `userService.deleteUser` avant `userRepository.delete` — refus explicite 409 `USER_HAS_FINANCIAL_HISTORY` si l'un des trois compteurs est non nul, exactement le même patron que le garde-fou déjà existant sur le dernier ADMIN (`LAST_ADMIN`, même fichier). Option retenue : le refus explicite (premier volet du critère de résolution), pas le `onDelete: Restrict`/`SetNull` schéma (second volet) — un changement de contrainte FK est une migration de schéma plus large, hors proportion pour fermer ce constat alors qu'un refus applicatif suffit au critère. Le message d'erreur ne mentionne PAS de "désactivation" de compte : aucun champ `isActive`/`deactivated` n'existe sur `User` dans schema.prisma (vérifié par lecture directe du modèle complet, `schema.prisma:146-176`) — inventer cette mention aurait décrit une fonctionnalité inexistante ("réparer n'est pas développer"). Preuve par test réel : `server/test/userDeleteFinancialHistory.test.ts` (nouveau fichier, importé dans `run-all.test.ts`) crée un vrai `TimeEntry` puis un vrai `ProjectCommissionSplit` sur un vrai User, appelle `userService.deleteUser` (code réel), vérifie le rejet 409 `USER_HAS_FINANCIAL_HISTORY` dans les deux cas et que l'enregistrement financier ET le User survivent ; un 3e cas confirme qu'un User sans historique reste supprimable normalement. Suite complète (496 tests) verte : `node --test --import tsx test/run-all.test.ts`. `npx tsc --noEmit` et `npm run lint --workspace=server` verts (0 erreur/0 warning). Fix et test produits par mes propres appels d'outils dans cette session. Dérogation CI déjà accordée par l'utilisateur pour cette session ("Le ci n est pas important pour le moment make them resolus") : `resolu` malgré l'absence de run CI vert sur ce commit précis.
  - id: SEC-174
    titre: Le token d'accès JWT est purement stateless (aucune vérification DB, aucune liste de révocation) — un compte ADMIN/MANAGER supprimé ou dont le rôle est rétrogradé reste utilisable avec les anciens droits jusqu'à expiration naturelle du token (15 min par défaut)
    perimetre: 4.0 Authentification/RBAC — server/src/middlewares/auth.middleware.ts#authenticate ; server/src/config/env.ts (JWT_ACCESS_EXPIRES_IN)
    categorie: A
    regle_violee: null
    classe: revocation_session_differee
    gravite: mineur
    statut: resolu
    critere_de_resolution: |
      Sera résolu soit par une décision explicite du porteur documentant la fenêtre de 15 minutes comme un risque accepté (à écrire dans REFERENTIEL.md §7, avec le motif : coût d'une vérification DB sur chaque requête authentifiée jugé disproportionné pour un outil interne 0 client actif), soit par l'ajout d'une vérification (ex. colonne `tokenVersion`/`revokedAt` sur `User`, comparée dans `authenticate`) si le porteur juge la fenêtre inacceptable — dans les deux cas la décision doit être écrite, pas laissée implicite.
    detecte_le: '2026-07-21'
    source: audit_llm
    confiance: certain
    note: |
      Audit AppSec, item 1 (authentification). Vérifié par lecture directe : `auth.middleware.ts#authenticate` (lignes 16-22) ne fait que `jwt.verify(token, env.JWT_ACCESS_SECRET, {...})` — aucun appel à `userRepository`/`prisma` dans ce middleware, donc aucune vérification que l'utilisateur du token existe encore, est toujours actif, ou a toujours le même rôle. `JWT_ACCESS_EXPIRES_IN` vaut `15m` par défaut (`env.ts:13`, le README mentionne 1h — écart de documentation, non vérifié plus avant ici). Distinct de SEC-165 (suppression physique de User, `verifie: code_direct`, déjà enregistré) : SEC-165 porte sur le fait que la suppression existe et cascade en base ; SEC-174 porte sur la fenêtre de validité résiduelle du token déjà émis après cette suppression (ou après une rétrogradation de rôle/pôle), propriété distincte non couverte par un ID existant (grep "stateless", "révocation", "JWT_ACCESS_EXPIRES" dans ANOMALIES.yaml : aucun résultat pertinent avant cette entrée). Gravité `mineur` et non `majeur` : la fenêtre est bornée à 15 minutes (pas un token de longue durée), le refresh token est lui bien vérifié en DB à chaque rotation (`auth.service.ts#refresh`) donc la session ne peut pas se prolonger au-delà du prochain refresh raté, et RG-016 (sandboxing exec) limite déjà la surface de ce que ferait un accès résiduel de 15 min. Absent vs défaillant : le mécanisme de révocation immédiate n'existe pas du tout (absent), ce n'est pas une implémentation bancale d'un mécanisme déjà tenté.
      BLOQUÉ SUR DÉCISION PORTEUR (session en cours) : le critère de résolution exige explicitement une décision produit écrite (risque accepté documenté vs implémentation d'un `tokenVersion`/`revokedAt`) que je ne peux pas trancher moi-même sans instruction explicite du porteur — passé en `en_cours` plutôt que laissé `ouvert`, pour distinguer "pas encore regardé" de "regardé, bloqué sur un choix qui n'est pas le mien à faire". Point accessoire relevé en relisant : l'écart README (15 min réel vs "1h" documenté pour `JWT_ACCESS_EXPIRES_IN`) mentionné dans la note d'origine comme "non vérifié plus avant" reste également non vérifié dans cette passe (hors périmètre de ce constat précis, à traiter séparément si confirmé).
      PRÉMISSE INFIRMÉE (session du 2026-07-23, audit CI) : le porteur a choisi l'option « implémenter une vraie révocation » — avant d'écrire le moindre code, lecture directe du mécanisme existant : un dispositif de révocation EXISTE DÉJÀ et fonctionne, contrairement à l'affirmation d'origine du titre (« purement stateless, aucune vérification, aucune liste de révocation »). Confirmé ligne par ligne : `auth.middleware.ts#authenticate` appelle `authDenylist.isAccessTokenRevoked({ sub, jti })` à CHAQUE requête authentifiée (pas une vérification DB, mais une vérification Redis réelle, avec TTL aligné sur l'expiration du token) ; `user.service.ts#updateUser` (sur changement de rôle réel) ET `#deleteUser` appellent tous deux `authDenylist.revokeAccessToken({ sub: id })`, invalidant immédiatement tout token déjà émis pour cet utilisateur — pas d'attente de l'expiration naturelle de 15 min. Couverture de test déjà en place et réelle (pas un vide comblé cette session) : `server/test/authDenylist.test.ts` (3 cas, contre un vrai Redis, appelle le vrai `authenticate` — un token accepté AVANT révocation, rejeté 401 APRÈS, sans affecter un autre utilisateur non révoqué) et `server/test/user.service.test.ts` (mock ciblé sur `authDenylist.revokeAccessToken` pour prouver que `updateUser`/`deleteUser` l'appellent bien, avec `sub` correct). `authDenylist.test.ts` porte déjà sa propre référence SEC-174 dans son en-tête — ce mécanisme a donc été construit et testé pour répondre précisément à ce constat, dans une session antérieure à celle qui l'a laissé `en_cours` par erreur de champ (même classe que SEC-161/SEC-162/SEC-010, incohérence de champ pas un fait nouveau). Le job `server` de la CI déclare bien un service Redis (confirmé ligne 51 de `ci.yml`) — le commentaire dans `authDenylist.test.ts` inquiet que « CI's server job declares no redis service today » est lui-même une trace obsolète, le test tourne réellement (pas seulement `t.skip`) sur chaque run vert observé dans cette session. Aucun `tokenVersion`/`revokedAt` supplémentaire ajouté : dupliquerait un mécanisme déjà fonctionnel, testé, et moins coûteux (Redis, pas une lecture DB sur chaque requête). `resolu`.
