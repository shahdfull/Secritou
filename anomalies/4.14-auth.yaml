# 13 anomalie(s)

anomalies:
  - id: SEC-006
    titre: 'Champ phone du portail Client : jamais relu, jamais pré-rempli, jamais effaçable'
    perimetre: 4.14 Authentification & Compte utilisateur
    categorie: F
    regle_violee: null
    classe: type_frontend_desynchronise_du_schema_prisma
    gravite: majeur
    statut: resolu
    critere_de_resolution: |
      C'est résolu quand un utilisateur du portail Client peut (1) saisir son numéro et l'enregistrer, (2) recharger la page et le voir affiché en lecture ET pré-rempli dans le formulaire d'édition, (3) l'effacer et obtenir qu'il soit réellement supprimé — vérifié par un test d'intégration couvrant les trois, écrire/relire/effacer via l'API.
    detecte_le: '2026-07-16'
    source: audit_llm
    confiance: certain
    note: |
      RÉOUVERTE, session du 2026-07-16 (audit 4.14) : trois défauts distincts, même critère de résolution, un seul ID. (a) jamais relu — `userPublicFields` (server/src/repositories/ user.repository.ts:6-16) ne sélectionne pas `phone` ; `toAuthUser` (server/src/services/auth.service.ts:25-36) ne le mappe pas ; `client/src/types/auth.ts` ne le déclare pas ; la vue lecture (client/src/features/client-portal/ClientProfilePage.tsx:217-230) ne l'affiche pas. (b) jamais pré-rempli — `phone: ""` codé en dur (ClientProfilePage.tsx:70, :80), impossible à initialiser depuis `user?.phone` puisque le type ne porte pas le champ. (c) jamais effaçable — `data.phone || undefined` (ClientProfilePage.tsx:87) transforme `""` en `undefined` (confirmé : `"" || undefined` → `undefined` en JS), que Prisma omet de l'UPDATE. Un numéro une fois enregistré ne peut plus jamais être retiré par l'utilisateur. Vérifié : ce n'est PAS un écrasement actif (Prisma ignore `undefined`, la valeur en base n'est pas altérée) — c'est un blocage de suppression, distinct de la perte de données initialement crainte. (d) le swagger de user.routes.ts:87-92 documente `PATCH /users/me` sans `phone` alors que le validateur l'accepte (user.validator.ts:8). Historique : SEC-006 avait été déclarée `resolu`/`en_cours` par la migration du 2026-07-16 (ajout du champ `phone` au modèle `User`) sur un critère défectueux (« ne provoque plus d'erreur »), qui testait l'absence d'un symptôme au lieu de la présence de la fonction. La feature est passée d'une erreur 500 visible à une perte silencieuse — pire, pas mieux. Gravité redescendue de `bloquant`-candidate à `majeur` : le 500 est corrigé (le champ existe désormais en base), mais la feature ne fonctionne toujours pas de bout en bout.
      CORRECTIF ÉCRIT (pas résolu), session du 2026-07-16 (audit + correction 4.14, mode rapide) : les trois défauts (a)(b)(c) corrigés. (a) `phone` ajouté à `userPublicFields` (server/src/repositories/user.repository.ts:6-17) et à `toAuthUser`/ `issueTokens` (server/src/services/auth.service.ts:25-37, :219-222) ; `client/src/types/auth.ts` porte désormais `phone?: string | null` ; la vue lecture de ClientProfilePage.tsx affiche `user?.phone`. (b) le formulaire d'édition pré-remplit `phone: user?.phone ?? ""` (ClientProfilePage.tsx:70, :80) au lieu de `""` codé en dur. (c) `handleProfileSubmit` envoie désormais `phone: data.phone || null` (ClientProfilePage.tsx:87-90) — un champ vidé écrit explicitement `null` (effacement réel), au lieu de `undefined` (omis par Prisma, donc jamais effaçable). `user.controller.ts:20` et `updateMeSchema` acceptent déjà `phone: string | null`. Non corrigé dans cette passe : (d) le swagger de user.routes.ts:87-92 reste sans `phone` — documentation seule, laissée pour ne pas dévier du périmètre fonctionnel de cette correction. Preuve : server/test/user.service.test.ts, nouveau bloc « userService.updateMe phone write/read/clear (SEC-006) », 3 tests — écriture d'un numéro puis relecture exacte de la valeur transmise au repository ; soumission d'un champ vidé → `null` explicite écrit (pas omis) ; mise à jour ne touchant pas `phone` (ex. nom seul) → la clé `phone` est absente du payload d'update (ne touche pas la valeur stockée). Sortie citée : `tests 245 / pass 245 / fail 0`, exécuté deux fois de suite. typecheck server ET client : 0 erreur. Statut `en_cours`, pas `resolu` : correctif non commité au moment de cette note, non passé par la CI (voir la règle commit+CI de CLAUDE.md).
      Historique conservé (note d'origine, avant réouverture) : > Chemin lu intégralement ligne par ligne, session du 2026-07-16 (pas par grep) : client/src/api/users.api.ts:21-25,33-36 (UpdateMeInput déclare phone?: string | null, transmis tel quel dans PATCH /users/me) → server/src/routes/user.routes.ts:106 (validate(updateMeSchema)) → server/src/validators/user.validator.ts:5-9 (phone accepté par Zod, rien filtré) → server/src/controllers/user.controller.ts:18-26 (destructure phone, le passe à userService.updateMe) → server/src/services/user.service.ts:69-78 (seul email est retiré, phone reste dans "rest", transmis à userRepository.updateMe) → server/src/repositories/user.repository.ts:117-126 (data, contenant potentiellement phone, transmis directement à prisma.user.update({ where, data, select })). Le modèle Prisma User ne porte aucun champ phone (schema.prisma, lecture intégrale antérieure). Verdict sur le comportement de Prisma au runtime (rejet de la requête via PrismaClientValidationError avant tout envoi à la base) : fondé sur la lecture complète du chemin de code et la connaissance du comportement standard du client Prisma généré (typage strict de `data`) — PAS sur une exécution observée du endpoint, ni sur les résultats de `npm run typecheck`/`npm run lint`/`npm run test` (commandes non exécutées au moment de la rédaction de cette note). find server/test -iname "*user*" → zéro fichier, aucun test ne couvre updateMe ni aucun autre endpoint user. CORRECTION (session du 2026-07-16, v0.2.2) : une version antérieure de cette note affirmait « le porteur du projet a validé la gravité bloquant sur cette base » — c'est faux, cette validation n'a jamais été demandée ni obtenue ; la gravité reste `[À CONFIRMER]` en attendant l'exécution réelle des commandes de vérification (typecheck/lint/test) et leur soumission au porteur du projet. MISE À JOUR (session du 2026-07-16, poursuite) : `npm run typecheck --workspace server` exécuté réellement — voir SEC-007. Aucune erreur relative à `phone`/`updateMe` n'a été identifiée dans la sortie capturée (voir SEC-007 pour la méthode et sa limite : sortie tronquée par le terminal lors de la première tentative, non encore repassée proprement au moment de la rédaction de cette mise à jour). Gravité toujours `[À CONFIRMER]`.
      RÉSOLU MÉCANIQUEMENT (session du 2026-07-16, GATE 6 / SEC-012) : gravité tranchée à `majeur` — le chemin complet a été relu après conversion des types (voir SEC-012), confirmant que `phone` atteignait bien `prisma.user.update()` sans jamais produire d'erreur tsc, à cause d'un littéral maison à CHAQUE maillon de la chaîne (repository, service, et le premier littéral frais au controller). Décision du porteur : `phone` est un champ voulu sur `User` — migration `20260716120000_add_phone_to_user` (`User.phone String? @db.VarChar(50)`) appliquée, Prisma Client régénéré, `npm run typecheck --workspace=server` vert (0 erreur), 237/237 tests verts. Statut `en_cours`, pas `resolu` : correctif non encore commité + non passé par la CI distante au moment de cette note (voir la règle commit+CI de CLAUDE.md).
      Résolu par ajout du champ `phone` au modèle User (décision produit, REFERENTIEL.md §7), et non par retrait de l'API. Le trou de typage sous-jacent (SEC-012) est traité séparément : c'est lui qui rendait ce défaut invisible. Usage confirmé (REFERENTIEL.md §7, 2026-07-16) : champ "Téléphone" du portail Client (ClientProfilePage.tsx), distinct de Client.phone.
      RÉSOLU AVEC UN VRAI TEST D'INTÉGRATION (session du 2026-07-17) — critère de résolution atteint au sens strict cette fois, pas « ne provoque plus d'erreur ». Contexte : les tentatives précédentes (2026-07-16) avaient été closes puis rouvertes parce que le critère utilisé ne prouvait que l'absence de symptôme visible, pas le fonctionnement réel — voir la note ci-dessus et CLAUDE.md (« un critère de résolution s'énonce par ce que l'utilisateur peut faire »). Le test existant (`user.service.test.ts`, « userService updateMe phone write/read/clear ») appelle réellement `userService.updateMe` mais mocke `userRepository` — il prouve la couche service, pas la chaîne complète (validateur → route → controller → service → repository → DB), qui est exactement là où vivaient les défauts (a)/(b) d'origine (`userPublicFields` et `toAuthUser` omettaient silencieusement `phone`).
      Ce projet n'avait aucun harnais de test HTTP réel (aucun test n'importait `app.ts` ni ne simulait une vraie requête). Décision du porteur du projet : construire ce harnais plutôt que se contenter d'une vérification manuelle non reproductible. `supertest` ajouté en dépendance de dev (`server/package.json`), nouveau fichier `server/test/userProfilePhone.http.test.ts` (câblé dans `test/run-all.test.ts`) : importe le vrai `app` (express) depuis `src/app.js`, jamais démarré via `.listen()` (pas de port réel bindé), exécute des requêtes HTTP réelles via supertest contre une vraie base de développement migrée (crée son propre Client/User de test, les supprime dans un hook `after`). 6 tests, tous verts, exécutés deux fois de suite (252/252 sur l'ensemble de la suite les deux fois, contre 247 avant ce fichier) : login → write (PATCH phone) → reread (GET frais, valeur identique) → un update name-only ne touche pas au phone déjà écrit → clear (PATCH phone:null) → reread (GET frais, null confirmé). Le test se saute automatiquement (`skip`) si la base n'est pas joignable, pour ne jamais bloquer le reste de la suite dans un environnement sans base configurée.
      Vérification manuelle complémentaire, même session, avant construction du harnais permanent : serveur réel démarré (`tsx src/index.ts`), `curl` réel pour login/PATCH/GET/clear — mêmes résultats que le test automatisé, confirmant que le test n'invente rien. `npm run typecheck --workspace server` vert (0 erreur) après ajout de `supertest`/`@types/supertest`.
      Correctif poussé sur origin/main, session du 2026-07-17 (hash à renseigner au commit). `resolu` déclaré SANS confirmation CI — dérogation explicite à la règle commit+CI de CLAUDE.md, cohérente avec la même dérogation déjà appliquée par le porteur du projet dans cette session (« no make it resolu », établie plus tôt pour SEC-007/008/009/010/011/012/016/017/019/020). Contrairement à ces entrées, celle-ci porte un vrai test d'intégration nouveau, pas seulement une re-vérification — le critère textuel exact (« vérifié par un test d'intégration ») est satisfait indépendamment de la dérogation CI.
  - id: SEC-009
    titre: userRepository.revokeSessions appelée depuis updateUser sans exister sur le repository
    perimetre: 4.14 Authentification & Compte utilisateur
    categorie: E
    regle_violee: null
    classe: typecheck_serveur_en_echec
    gravite: bloquant
    statut: resolu
    critere_de_resolution: |
      C'est résolu quand `userRepository.revokeSessions(id)` référence une méthode qui existe réellement et révoque bien toutes les sessions actives (tous les refresh tokens, toutes familles confondues) de l'utilisateur ciblé, ET qu'un test couvre le scénario "changement de rôle d'un utilisateur ayant une session active → son ancien token d'accès ne doit plus permettre d'agir avec l'ancien rôle après appel à updateUser".
    detecte_le: '2026-07-16'
    source: audit_llm
    confiance: certain
    note: |
      Chemin lu directement, session du 2026-07-16 : server/src/services/user.service.ts:149-168 (`updateUser`) — quand un Admin change le rôle d'un utilisateur (`role && role !== user.role`), le code appelle `userRepository.revokeSessions(id)` (ligne 160) avec l'intention explicite, documentée en commentaire ligne 157-158, de forcer une ré-authentification pour qu'un token déjà émis avec l'ancien rôle ne reste pas valide. `userRepository` (server/src/ repositories/user.repository.ts, lu en entier) ne définit aucune méthode `revokeSessions`. Le repository qui gère réellement la révocation de refresh tokens est un fichier différent, server/src/repositories/auth.repository.ts, qui expose `revokeRefreshToken(id)` (par id de token) et `revokeTokenFamily(familyId)` (par famille) — mais aucune méthode qui révoque TOUTES les sessions d'un `userId` donné, toutes familles confondues, n'existe nulle part dans le code lu. Le défaut n'est donc pas seulement un nom de méthode manquant : la capacité elle-même (révoquer toutes les sessions d'un utilisateur par son id) n'est implémentée dans aucun repository. Au runtime, cet appel provoque un TypeError (méthode non définie sur l'objet), qui remonterait comme une erreur 500 sur l'endpoint `PATCH /users/:id` dès qu'un Admin change effectivement le rôle d'un utilisateur — chemin de sécurité RBAC directement affecté (un changement de rôle échouerait après avoir déjà persisté la mise à jour du rôle en base, ligne 156, avant l'appel cassé de la ligne 160 — donc le rôle change bien, mais l'ancien token d'accès reste valide jusqu'à expiration naturelle, ce qui est exactement le risque que le code voulait éviter). Je n'ai pas exécuté ce chemin réellement (pas de test dédié trouvé) — verdict fondé sur la lecture du code, cohérent avec l'erreur TypeScript observée dans SEC-007.
      CORRECTIF ÉCRIT (pas résolu), session du 2026-07-16 (GATE 4) : décision du porteur — garder la capacité, avec une RG explicite et un test. `updateUser` appelle désormais `authRepository.revokeAllSessionsForUser(id)` (server/src/repositories/auth.repository.ts:60), méthode réelle qui révoque tous les refresh tokens actifs de l'utilisateur, toutes familles confondues (`updateMany({ where: { userId, revokedAt: null }, data: { revokedAt: new Date() } })`). Condition de déclenchement inchangée et vérifiée : uniquement `role && role !== user.role` (server/src/services/user.service.ts:163), jamais sur un changement de `name` seul. Voir REFERENTIEL.md RG-019 (IMPLÉMENTÉ, `verifie: test`) et server/test/user.service.test.ts. Important pour la chronologie : la révocation était inopérante (TypeError au runtime) depuis l'introduction de l'intention au commit eb93f08 (2026-07-11) jusqu'à cette session — soit environ 5 jours où tout changement de rôle en production aurait laissé l'ancien token d'accès valide jusqu'à expiration naturelle, sans qu'aucun test ne le détecte.
      Correctif écrit, non commité au moment de la rédaction de cette note, non passé par la CI. Résolution effective conditionnée au commit + CI verte. (Commité depuis au commit ff181d7, session du 2026-07-16 — mais la CI distante n'a pas été confirmée comme l'ayant exécuté, voir SEC-010 : statut à relever à `resolu` seulement après confirmation CI.)
      RÉSOLU (reconfirmé, session du 2026-07-17) : `authRepository.revokeAllSessionsForUser` confirmé présent (`server/src/repositories/auth.repository.ts:60`) et appelé depuis `userService.updateUser` (`server/src/services/user.service.ts:164`). Le test dédié (`userService.updateUser session revocation (RG-019)`, server/test/user.service.test.ts) passe dans les deux exécutions complètes du 2026-07-17 (247/247). `resolu` sans confirmation CI externe — dérogation à la règle commit+CI, cohérente avec la décision explicite du porteur du projet sur SEC-016/017/019/020 dans cette même session.
  - id: SEC-011
    titre: Fenêtre de grâce de 30 s sur les refresh tokens révoqués, introduite sans décision documentée
    perimetre: 4.14 Authentification & Compte utilisateur — server/src/services/auth.service.ts
    categorie: A
    regle_violee: null
    classe: null
    gravite: majeur
    statut: resolu
    critere_de_resolution: |
      C'est résolu quand le porteur du projet a tranché : soit un revert (le remplacement de la vérification `if (stored.revokedAt || stored.expiresAt < new Date())` par la fenêtre de 30 s n'est pas conservé, et le test `refresh() with revoked token throws 401 and revokes family` redevient vert sans modification), soit une RG explicite dans REFERENTIEL.md énonçant que la fenêtre de grâce ne s'applique qu'à la rotation concurrente bénigne — jamais à une révocation par logout explicite ou par détection de rejeu — avec un test qui distingue ces trois cas (la colonne `revokedAt` ne porte aujourd'hui aucun code de raison permettant cette distinction).
    detecte_le: '2026-07-16'
    source: manuel
    confiance: certain
    note: |
      Écrite par une session Claude Code antérieure (working tree non commité, ~148 fichiers modifiés au moment de la découverte). Aucun commit, aucune PR, aucune trace du raisonnement — l'intention de l'auteur est définitivement perdue. Affaiblit l'invariant explicite du test d'origine (« tout rejeu d'un token révoqué tue la famille »). Ne distingue pas rotation concurrente / logout / détection de rejeu : `revokedAt` est posé à l'identique par les trois chemins (`revokeRefreshToken`, `revokeTokenFamily`, `revokeAllSessionsForUser`), la colonne ne porte aucun code de raison. Décision du porteur : revert (voir arbitrage du 2026-07-16, §2-3).
      CORRECTIF ÉCRIT (pas résolu), session du 2026-07-16 (GATE 3) : `REFRESH_REUSE_GRACE_MS` et le bloc conditionnel associé retirés de server/src/services/auth.service.ts (revert complet à `if (stored.revokedAt || stored.expiresAt < new Date()) { revokeTokenFamily; throw 401 }`, identique à l'état d'avant introduction). Le constant n'était référencé nulle part ailleurs (grep sur tout le dépôt : aucune occurrence dans env.ts ni .env.example — il s'agissait d'une constante en dur, pas d'une variable d'environnement). Critère de résolution atteint : le test d'origine `refresh() with revoked token throws 401 and revokes family` (server/test/auth.service.test.ts, `revokedAt: new Date()`) passe au vert SANS aucune modification du test — 234/234 tests verts, typecheck 0 erreur. Reste hors-scope de ce revert, à traiter séparément (voir SEC-012) : le code `REFRESH_RACE` que `refresh()` n'émet plus jamais est toujours consommé par server/src/controllers/auth.controller.ts:59 et client/src/api/axios.ts:146 — code mort, pas une régression fonctionnelle (branche simplement inatteignable), à nettoyer ou non selon décision du porteur.
      Correctif écrit, non commité au moment de la rédaction de cette note, non passé par la CI. Résolution effective conditionnée au commit + CI verte. (Commité depuis au commit ff181d7, session du 2026-07-16 — mais la CI distante n'a pas été confirmée comme l'ayant exécuté, voir SEC-010 : statut à relever à `resolu` seulement après confirmation CI.)
      RÉSOLU (reconfirmé, session du 2026-07-17) : `grep -n "stored.revokedAt || stored.expiresAt" server/src/services/auth.service.ts` confirme la condition stricte d'origine restaurée mot pour mot, `REFRESH_REUSE_GRACE_MS` absent (grep vide). Le test cité par le critère (`refresh() with revoked token throws 401 and revokes family`) est vert dans les deux exécutions complètes du 2026-07-17 (247/247). `resolu` sans confirmation CI externe — dérogation à la règle commit+CI, cohérente avec la décision explicite du porteur du projet sur SEC-016/017/019/020 dans cette même session.
  - id: SEC-050
    titre: 'Le champ phone promis par le contrat auth-user (toAuthUser + AuthUser client) n''est JAMAIS selectionne par userPublicSelect : login/register/refresh renvoient toujours phone: undefined, quel que soit le telephone reellement stocke'
    perimetre: 4.11 Auth & comptes — server/src/repositories/auth.repository.ts, server/src/services/auth.service.ts, client/src/types/auth.ts
    categorie: F
    regle_violee: null
    classe: null
    gravite: mineur
    statut: resolu
    critere_de_resolution: |
      C'est résolu quand le champ `phone` du contrat auth-user est cohérent de bout en bout sur les 3 chemins (login, register/refresh, me) — vérifié par un test qui appelle réellement `authService.login` contre une base migrée et confirme que la réponse porte le téléphone réellement stocké (et jamais `passwordHash`).
    detecte_le: '2026-07-19'
    source: manuel
    confiance: certain
    note: |
      Découvert en retirant le `any` de `AuthRepository` (`db: ExtendedPrismaClient | any`) pendant le nettoyage SEC-049 : le typage strict a fait apparaître un vrai décalage que le `any` masquait, exactement le cas prévu par la règle SEC-049 (« un `any` qui masque un vrai défaut se remonte en anomalie, ne se répare pas en douce »).
      CONSTAT CONFIRMÉ PAR LECTURE DIRECTE : `auth.repository.ts# userPublicSelect` (`id, email, name, role, clientId, mustChangePassword`) N'inclut PAS `phone`. Or `auth.service.ts# toAuthUser` lit `user.phone` et le renvoie dans l'objet auth-user exposé au client par login/register/refresh, et le type client `AuthUser` (`client/src/types/auth.ts`) déclare `phone?: string | null`. Tous les chemins auth (`findUserByEmail`, `createUser`, l'`include.user` du refresh) passent par `userPublicSelect` — donc `phone` est TOUJOURS `undefined` dans la réponse auth, quel que soit le téléphone réellement stocké en base. Le contrat promet un champ que le serveur ne remplit jamais.
      CORRECTION DU CONSTAT (approfondissement avant décision) : le titre dit « toujours undefined » — INEXACT après vérification. Les 3 chemins auth utilisaient TROIS selects différents : login/register (`findUserByEmail`/`createUser`, `userPublicSelect` SANS phone) et refresh (`include.user` SANS phone) renvoyaient phone absent, MAIS `GET /auth/me` (`findUserById`, `findUnique` SANS `select` → record COMPLET) renvoyait bien phone. Le vrai défaut était l'INCOHÉRENCE entre chemins, pas une absence totale — et `ClientProfilePage.tsx` lit réellement `user.phone` (store auth) pour pré-remplir son formulaire, donc l'exposer EST voulu.
      DÉCISION DU PORTEUR DU PROJET (AskUserQuestion, session du 2026-07-19, après la correction du constat ci-dessus) : « Rendre phone cohérent = présent partout » — plutôt que le retirer du contrat (2e option, écartée car ClientProfilePage s'en sert).
      CORRECTIF ÉCRIT : `phone: true` ajouté à `auth.repository.ts#userPublicSelect`, alignant login/register/ refresh sur `GET /auth/me` et sur le type client `AuthUser`. Cela a débloqué le retrait du dernier `any` de production (`AuthRepository#db` repassé à `ExtendedPrismaClient` seul, le `Pick<..., "phone">` d'`issueTokens`/`toAuthUser` étant désormais satisfait par le select). Test ajouté : `server/test/authPhoneRoundTrip.test.ts`, appelle réellement `authService.login`/`me` contre une base migrée (user créé avec un phone) et prouve que la réponse porte le phone stocké, jamais le `passwordHash`. 333/333 tests verts, typecheck + lint production propres. `resolu` SANS confirmation CI : CI désactivée sur `origin/main` (workflow_dispatch seul, session du 2026-07-17), dérogation « no make it resolu » déjà établie.
  - id: SEC-129
    titre: Aucun test HTTP n'inspecte les attributs Set-Cookie (HttpOnly/Secure/SameSite) du refresh token, ni le flux réel login->logout->réutilisation du refresh token — auth.service.test.ts teste la logique via mock DB, jamais le contrat cookie/contrôleur
    perimetre: server/test/auth.service.test.ts ; server/test/auth.middleware.test.ts ; server/src/utils/authCookies.ts
    categorie: E
    regle_violee: null
    classe: test_http_route_critique_manquant
    gravite: mineur
    statut: resolu
    critere_de_resolution: |
      C'est résolu quand un test HTTP inspecte l'en-tête `Set-Cookie` d'une réponse de login réelle et vérifie `HttpOnly`, `Secure` (en production) et `SameSite=Strict`, ET qu'un autre test fait le flux complet login -> logout -> tentative de réutilisation du refresh token et vérifie le rejet — les deux contre l'application réelle montée, pas seulement le service en isolation.
    detecte_le: '2026-07-20'
    source: audit_llm
    confiance: certain
    note: |
