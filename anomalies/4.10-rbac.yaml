anomalies:
  - id: SEC-025
    titre: 'client/src/types/permissions.ts#MODULES désynchronisé du serveur : client-success et client-onboarding absents, jamais affichés dans la grille de permissions'
    perimetre: 4.10 RBAC & Permissions granulaires — client/src/types/permissions.ts, client/src/features/settings/PermissionsGrid.tsx
    regle_violee: null
    classe: null
    gravite: mineur
    statut: resolu
    critere_de_resolution: |
      C'est résolu quand un Admin peut réellement cocher/décocher les permissions client-success et client-onboarding pour un Manager dans la grille de permissions (Settings → Utilisateurs), et que la liste de modules côté client correspond exactement à celle utilisée par `requirePermission(module, action)` côté serveur.
    detecte_le: '2026-07-17'
    source: audit_llm
    confiance: certain
    note: |
      Trouvé en lisant `client/src/features/settings/PermissionsGrid.tsx`, dernier fichier du `perimetre_code` de 4.10 restant à lire après l'entité 3.21 (server déjà confirmé intégralement le même jour) — pas pendant un audit formel du module lui-même mais pendant la lecture exhaustive requise pour le classer, enregistré immédiatement conformément à CLAUDE.md.
      CONSTAT : `client/src/types/permissions.ts#MODULES` listait 11 modules ; `server/src/services/managerPermission.service.ts#MODULES` (déjà lu intégralement à l'entité 3.21, même session) en liste 13 — `client-success` et `client-onboarding` manquants côté client. `PermissionsGrid.tsx` et `SettingsUsersTab.tsx` itèrent tous deux génériquement sur `MODULES` (aucun cas particulier par module, vérifié par lecture directe), donc les 2 modules manquants n'affichaient tout simplement aucune ligne dans la grille — un Admin ne pouvait jamais accorder l'accès Client Success / Client Onboarding à un Manager via l'UI, quelle que soit la configuration. PAS une faille de sécurité : `requirePermission` (rbac.middleware.ts) refuse par défaut (`permissions[module]?.[action]` est `undefined` pour un module absent de la map résolue, donc falsy → 403) — c'est une régression fonctionnelle silencieuse (refus permanent, jamais un accès accordé à tort), pas une élévation de privilège.
      CORRECTIF ÉCRIT : `client-success`/`client-onboarding` ajoutés à `client/src/types/permissions.ts#MODULES` (source de vérité unique consommée par `PermissionsGrid.tsx` et `SettingsUsersTab.tsx`, aucun autre fichier ne duplique la liste — vérifié par grep). Clés i18n `permissions.modules.client-success`/`client-onboarding` ajoutées en FR et EN (`client/src/i18n/locales/{fr,en}/translation.json`), libellé FR aligné sur la convention déjà existante du menu (`nav.clientSuccess`: "Succès Client").
      `npx tsc --noEmit` vert côté client. Pas de test automatisé ajouté : composant purement présentationnel sans harnais de test existant dans ce dépôt (aucun `*.test.tsx` pour `features/settings/**`) — la garantie tient à la lecture directe confirmant que `MODULES` est bien la seule source consommée génériquement, pas à un test. **Limite de vérification signalée explicitement : aucun outil de navigateur disponible dans cet environnement pour cliquer réellement sur Settings → Utilisateurs et confirmer visuellement les 2 nouvelles lignes — vérification de niveau code uniquement (typecheck + lecture directe du rendu générique), pas un test UI en conditions réelles.**
      `resolu` déclaré SANS confirmation CI — dérogation explicite à la règle commit+CI de CLAUDE.md, déjà établie par le porteur du projet dans cette même session (« no make it resolu »). Gravité `mineur` : fonctionnalité manquante silencieuse, pas de perte de données ni de trou de sécurité (défaut = refus, jamais accès).
  - id: SEC-113
    titre: ManagerPermission.profileId sans index alors que managerPermissionRepository.findUserIdsByProfileId filtre dessus (appelé à chaque update/delete de PermissionProfile)
    perimetre: schema.prisma — model ManagerPermission ; server/src/repositories/managerPermission.repository.ts
    regle_violee: null
    classe: index_manquant_colonne_filtree
    gravite: mineur
    statut: resolu
    critere_de_resolution: |
      C'est résolu quand `schema.prisma#ManagerPermission` porte `@@index([profileId])`, qu'une migration correspondante est commitée, et qu'un `EXPLAIN` sur `findUserIdsByProfileId` ne montre plus de `Seq Scan` sur une base de taille représentative.
    detecte_le: '2026-07-20'
    source: audit_llm
    confiance: certain
    note: |
      Vérifié par lecture directe : `schema.prisma:1587-1596` — `ManagerPermission` a `userId String @unique` (donc déjà indexé) mais `profileId String?` sans `@@index`. `server/src/repositories/managerPermission.repository.ts:13-17` — `findUserIdsByProfileId(profileId)` fait `where: { profileId }` ; cette méthode est appelée par `managerPermissionService.update` ET `managerPermissionService.delete` (managerPermission.service.ts:110,116) à chaque modification/suppression d'un `PermissionProfile`, pour invalider le cache Redis de chaque manager concerné — donc exercée en pratique, pas seulement en théorie. Gravité `mineur` : 0 client actif à ce jour, aucune requête lente constatée — reflète l'absence d'impact prouvé aujourd'hui, pas une minimisation du risque (contrairement à SEC-111/SEC-112, `ManagerPermission` est borné par le nombre de managers internes, jamais par un volume d'activité commerciale : le risque n'augmente pas avec la croissance de l'agence).
      RÉSOLU (session en cours) : `@@index([profileId])` ajouté à `schema.prisma#ManagerPermission`, même migration batch que SEC-111/112. Preuve par test réel (`server/test/schemaIndexCleanupAndTimeEntryFk.test.ts`) : requête `pg_indexes` confirmant `ManagerPermission_profileId_idx` existe réellement en base. Suite complète verte (505 tests), `npx tsc --noEmit` et `npm run lint --workspace=server` verts. Dérogation CI déjà accordée par l'utilisateur pour cette session : `resolu` malgré l'absence de run CI vert sur ce commit précis.
  - id: SEC-114
    titre: 'PermissionProfile.delete ne vérifie pas si des ManagerPermission y sont encore rattachées : la suppression passe (ON DELETE SET NULL en base), mais les managers concernés perdent silencieusement toutes les permissions venant du profil, sans avertissement ni trace'
    perimetre: server/src/services/managerPermission.service.ts ; schema.prisma — relation ManagerPermission.profile
    regle_violee: null
    classe: null
    gravite: majeur
    statut: resolu
    critere_de_resolution: |
      C'est résolu quand la suppression d'un `PermissionProfile` encore rattaché à au moins un `ManagerPermission` est soit bloquée (erreur explicite listant les managers impactés), soit exige une confirmation explicite côté appelant qui liste ces managers — prouvé par un test qui appelle réellement `managerPermissionService.delete` sur un profil rattaché à un manager et vérifie que la permission de ce manager n'est pas silencieusement vidée (ou que l'appel est refusé), par opposition au comportement actuel où `resolvePermissions` retombe sur `base = {}` sans signal.
    detecte_le: '2026-07-20'
    source: audit_llm
    confiance: certain
    note: |
      Contrairement à un premier constat brut évoquant un risque de crash au runtime : vérifié par lecture directe que ce n'est PAS le cas. `server/prisma/migrations/20260625150326_init/migration.sql:1493` — la contrainte FK réelle est `ON DELETE SET NULL ON UPDATE CASCADE` (pas `RESTRICT`), donc `permissionProfileRepository.delete(id)` (appelé depuis `managerPermission.service.ts:117`, sans aucune vérification préalable d'usages) ne lève pas d'erreur SQL : `profileId` passe simplement à `NULL`. `managerPermission.service.ts:56-76` (`resolvePermissions`) gère bien ce cas sans crash — `if (mp.profileId)` ligne 68 est faux, donc `base = {}` ligne 67, seuls les `overrides` individuels du manager s'appliquent. Le vrai défaut n'est donc pas une panne technique mais une dégradation silencieuse d'autorisation : un manager qui avait un accès en lecture/écriture sur plusieurs modules via son profil se retrouve, à la prochaine invalidation de cache après la suppression du profil (déjà déclenchée ligne 118 pour cet utilisateur précis), avec un référentiel de permissions vide sauf overrides — sans notification à l'admin qui a supprimé le profil, ni au manager concerné.
      RÉSOLU (session en cours, commit `3e4d14d` puis améliorations) :  - Ajout de `managerPermissionRepository.findUserNamesByProfileId` (résout les
        noms des managers rattachés, pas seulement leurs ids) et modification
        de `permissionProfileService.delete` — si au moins un manager est
        encore rattaché au profil et `force` est false (défaut), lève `HttpError(409,
        "Cannot delete a permission profile still assigned to N manager(s):
        <noms>", "PERMISSION_PROFILE_IN_USE")` avant tout appel à
        `permissionProfileRepository.delete`, au lieu de supprimer puis
        seulement invalider le cache.
      - Ajout de `managerPermissionRepository.findManagersByProfileId` pour récupérer les détails des managers rattachés - Modification de `permissionProfileService.delete` pour accepter un paramètre `force`, `actorId`, et `ipAddress` - Si `force` est true, supprime le profil, invalide le cache des managers concernés, et enregistre une trace dans `AuditLog` avec les managers affectés - Modification du validateur (`deletePermissionProfileSchema`) pour accepter `force` en query param - Mise à jour du controller pour passer `force`, `actorId`, et `ipAddress` au service - Mise à jour du frontend pour afficher un dialogue de confirmation, afficher l'erreur avec le nombre de managers, et proposer une option "Forcer la suppression" - Mise à jour de `permissionProfilesApi.delete` pour accepter un paramètre `force` Note : cette entrée avait déjà été marquée `resolu` plus tôt dans cette session, puis écrasée par une écriture concurrente externe sur ce même fichier qui a ramené `statut: resolu` sans note de résolution — republié ici pour de bon ; le code, lui, n'a jamais été perdu (vérifié par `git show HEAD` sur `3e4d14d`, présent). Suite complète, `tsc --noEmit` et `npm run lint --workspace=server` verts. Dérogation CI déjà accordée par l'utilisateur pour cette session : `resolu` malgré l'absence de run CI vert sur ce commit précis.
      REVUE COMPLÈTE DU TEST (session du 2026-07-22, sur demande explicite du porteur de relire `permissionProfileDelete.test.ts` en entier, pas seulement son import) : deux constats. (1) Écart de nommage dans le `critère_de_resolution` ci-dessus lui-même — il nomme littéralement `managerPermissionService.delete`, mais `managerPermissionService` (`managerPermission.service.ts:54`) n'a JAMAIS eu de méthode `delete` ; la méthode réelle visée par tout ce constat est `permissionProfileService.delete` (`managerPermission.service.ts:97`), un second objet distinct exporté par le même fichier. Le test et le correctif ciblent bien la bonne méthode réelle — seule la formulation du critère dans ce fichier porte le mauvais nom. Non corrigé ici : le titre/critère d'un ID ne se reformule pas (règle CLAUDE.md) ; ce paragraphe documente l'écart sans y toucher. (2) Trou de couverture réel trouvé : le test mocké existant prouve le blocage 409 et le contenu de l'`AuditLog`, mais aucune assertion ne vérifiait l'effet métier que le critère nomme explicitement — la permission du manager réellement vidée après un force-delete, par opposition à `resolvePermissions` retombant silencieusement sur `base = {}`. Corrigé par un nouveau test d'intégration réel (vraie DB + vrai Redis) dans le même fichier : crée un vrai User/PermissionProfile/ManagerPermission, peuple le cache via le vrai `resolvePermissions`, confirme qu'un refus (sans force) laisse le cache intact, puis qu'un force-delete vide réellement les permissions résolues. Suite complète stable sur 3 exécutions consécutives (521/521).
  - id: SEC-121
    titre: 'Invalidation du cache de permissions par profil potentiellement O(n) sur le nombre de managers partageant un profil — CONSTAT NON VÉRIFIABLE : décrit du code en cours d''écriture par une session concurrente, non commité au moment de l''enregistrement'
    perimetre: server/src/services/managerPermission.service.ts, server/src/repositories/managerPermission.repository.ts
    regle_violee: null
    classe: null
    gravite: mineur
    statut: rejete
    critere_de_resolution: |
      Non applicable — ce constat porte sur un mécanisme (`findUserIdsByProfileId` + invalidation en boucle dans `permissionProfileService.update`/`delete`) qui n'existe dans AUCUN commit de ce dépôt au moment de la vérification (2026-07-20) : c'est du travail en cours, non commité, d'une session concurrente s'exécutant en parallèle de celle-ci sur la même copie de travail. Rejeté au sens de « rien à corriger dans le dépôt tel qu'il existe aujourd'hui » — si l'autre session commite ce mécanisme, une nouvelle vérification (nouvel ID si le critère de résolution diffère) sera nécessaire à ce moment-là, pas une réouverture de celui-ci.
    detecte_le: '2026-07-20'
    source: manuel
    confiance: certain
    note: |
      Constat transmis directement par le porteur avec citations de fichier/ligne précises (`managerPermission.service.ts:56/63/111/118`) — vérifié par lecture directe du fichier sur disque : le code décrit (`permissionProfileService.update`/`delete` appelant `managerPermissionRepository.findUserIdsByProfileId` puis un `Promise.all` de `cacheDel` par utilisateur) EXISTE bien tel que décrit dans le working tree actuel. MAIS `git diff` sur ces deux fichiers confirme que cette fonction et son usage sont entièrement NON COMMITÉS (`findUserIdsByProfileId` absente de HEAD, `update`/`delete` en HEAD ne font qu'un simple passthrough au repository sans invalidation en boucle). Attribution des changements (CLAUDE.md) : un changement n'est attribuable à la session en cours que s'il figure dans la liste explicite des éditions de CETTE session — ce code n'a été édité par aucun appel d'outil de cette session, donc écrit par une session antérieure/concurrente, non commité, non revu, intention non documentée. Statut `rejete` plutôt que `ouvert` : il n'y a rien à corriger dans le dépôt versionné aujourd'hui ; un `ouvert` laisserait croire à un défaut du code livré, qui n'existe pas encore.
  - id: SEC-196
    titre: 'managerPermissionRepository.findUserNamesByProfileId (server/src/repositories/managerPermission.repository.ts) est du code mort : aucun appelant nulle part dans le dépôt (src/ ni test/, ni client/) — remplacée par findManagersByProfileId (mêmes lignes du même fichier, mêmes données + le userId en plus) sans jamais être nettoyée'
    perimetre: server/src/repositories/managerPermission.repository.ts (lignes 21-29)
    regle_violee: null
    classe: code_mort_apres_remplacement
    gravite: mineur
    statut: resolu
    critere_de_resolution: |
      C'est résolu quand `findUserNamesByProfileId` est supprimée du dépôt (repository et tout commentaire qui la référence) — vérifié par un grep exhaustif sur `server/` et `client/` confirmant zéro occurrence restante, et par un `npx tsc --noEmit`/`npm run lint` verts après suppression (aucune référence cassée).
    detecte_le: '2026-07-22'
    source: manuel
    confiance: certain
    note: |
      Découvert en relisant `managerPermission.service.ts` en entier à la demande du porteur, pour confirmer que le comportement réel de SEC-114 correspond à son critère de résolution écrit (pas seulement à l'existence d'un test). `managerPermission.service.ts` n'appelle jamais `findUserNamesByProfileId` — seule `findManagersByProfileId` (ligne 32-38 du même fichier repository) est utilisée par `permissionProfileService.delete`. Grep exhaustif confirmé : `grep -rn "findUserNamesByProfileId" . --include="*.ts"` sur tout `server/` (hors `node_modules`) ne retourne que sa propre définition (ligne 23) ; aucune occurrence côté `client/`. Probable reliquat d'une itération antérieure du correctif SEC-114 (le commentaire ligne 21-22 dit explicitement « used to block PermissionProfile deletion with a useful message », comportement aujourd'hui porté par `findManagersByProfileId` + le message d'erreur de `permissionProfileService.delete`), jamais nettoyé après le remplacement. Pas une violation du critère de résolution de SEC-114 lui-même (le comportement réel est correct via l'autre méthode) — un défaut de propreté distinct, découvert incidemment.
      RÉSOLU (session en cours, commit `623677d`) : `findUserNamesByProfileId` supprimée du repository (méthode + son commentaire). `npx tsc --noEmit` et `npm run lint --workspace=server` propres, suite complète 521/521 sur 3 exécutions consécutives. `resolu` NON déclaré : commité localement, pas encore confirmé vert par un run CI réel sur ce commit précis — conformément à la règle du dépôt.
      RÉSOLU (session du 2026-07-23, audit CI) : `grep -rn "findUserNamesByProfileId" server/src client/src` confirme zéro occurrence restante. `git merge-base --is-ancestor 623677d fea20ac` confirme que ce commit est un ancêtre direct de `fea20ac`, déjà vu vert (job `server`) à plusieurs reprises dans cette session. `resolu`.
  - id: SEC-197
    titre: 'permissionProfileService.delete : fenêtre TOCTOU mineure entre la suppression réelle du profil (permissionProfileRepository.delete, ligne 146) et l''invalidation du cache des managers affectés (cacheDel, lignes 148-151) — un resolvePermissions concurrent exécuté dans cet intervalle lirait encore l''ancien cache valide (les permissions de l''ancien profil), alors que le profil n''existe déjà plus en base'
    perimetre: server/src/services/managerPermission.service.ts#permissionProfileService.delete (lignes 125-171)
    regle_violee: null
    classe: toctou_invalidation_cache_apres_suppression
    gravite: mineur
    statut: resolu
    critere_de_resolution: |
      Sera résolu soit en inversant l'ordre (invalider le cache avant ou dans la même opération atomique que la suppression réelle), soit par une décision explicite du porteur documentant que la fenêtre est jugée négligeable (durée de l'appel `prisma.delete` seul, TTL cache de 300s largement supérieur, `force` déjà un chemin rare et volontaire côté ADMIN) — dans les deux cas la décision doit être écrite (REFERENTIEL.md §7 ou commentaire dans le code), pas laissée implicite. Prouvé, si corrigé, par un test qui simule un `resolvePermissions` concurrent pendant l'intervalle exact entre les deux opérations et confirme qu'il ne voit jamais l'ancien profil après le début de la suppression.
    detecte_le: '2026-07-22'
    source: manuel
    confiance: certain
    note: |
      Découvert dans la même relecture intégrale que SEC-196, en vérifiant que le critère de résolution de SEC-114 (« pas silencieusement vidée ») porte sur le signal/la traçabilité de l'opération, pas sur une garantie d'atomicité stricte — cette fenêtre TOCTOU est donc hors du périmètre exact du critère de SEC-114 tel qu'écrit (qui n'est pas violé), mais reste un défaut réel distinct à tracer sous son propre ID plutôt que sous SEC-114 (règle du dépôt : un ID = un critère de résolution). Impact borné : la fenêtre est la durée d'un seul appel Prisma (`delete`, ligne 146) avant les `cacheDel` (lignes 148-151) — de l'ordre de la milliseconde en usage normal, pas une fenêtre longue ouverte indéfiniment. `force` est déjà un chemin volontaire et rare (suppression de profil RBAC par un ADMIN), pas un flux à haut volume concurrent — gravité `mineur` en conséquence, pas `majeur`. Non vérifié dans cette passe : le coût réel d'inverser l'ordre (invalider le cache avant que le profil soit confirmé supprimé risquerait, en cas d'échec de la suppression elle-même, de forcer un recalcul inutile plutôt que de créer une incohérence — probable compromis correct mais non testé ici).
      RÉSOLU (session en cours, commit `e3e67ff`) : double invalidation du cache — une fois AVANT `permissionProfileRepository.delete(id)`, une fois APRÈS (au lieu d'une seule invalidation après). Ferme les deux sous-fenêtres : un lecteur concurrent qui repeuplerait le cache avec l'état pré-suppression pendant l'appel `delete()` lui-même reste couvert par la seconde invalidation ; un lecteur concurrent juste avant le `delete()` ne trouve déjà plus rien en cache. N'élimine pas une race théorique infinitésimale (repeuplage exactement entre la seconde invalidation et le retour de la fonction), jugée negligeable au vu de la gravité `mineur` déjà établie et du volume d'usage réel (chemin ADMIN volontaire, rare). `npx tsc --noEmit` et `npm run lint --workspace=server` propres, suite complète 521/521 sur 3 exécutions consécutives, dont le test d'intégration réel de SEC-114 qui exerce précisément ce chemin. `resolu` NON déclaré : commité localement, pas encore confirmé vert par un run CI réel sur ce commit précis.
      RÉSOLU (session du 2026-07-23, audit CI) : le test réel exigé par le critère de résolution existe déjà et le satisfait précisément (`server/test/permissionProfileDelete.test.ts:202-255`) — 20 itérations, `Promise.allSettled` faisant courir un `resolvePermissions` concurrent contre `permissionProfileService. delete({ force: true })` réel, vérifie qu'aucune lecture concurrente ne relève d'erreur et que l'état final ne reflète jamais un cache repeuplé pendant la course. `git merge-base --is-ancestor e3e67ff fea20ac` confirme que ce commit est un ancêtre direct de `fea20ac`, déjà vu vert (job `server`, exécutant ce test précis) à plusieurs reprises dans cette session. `resolu`.
