# 43 anomalie(s)

anomalies:
  - id: SEC-004
    titre: README.md décrit une architecture multi-tenant inexistante
    perimetre: documentation projet — voir REFERENTIEL.md §0 « Documents du projet »
    regle_violee: null
    classe: null
    gravite: majeur
    statut: resolu
    critere_de_resolution: |
      C'est résolu quand README.md ne contient plus aucune affirmation multi-tenant ni référence à un middleware tenant, et que sa présentation du projet est cohérente avec le caractère mono-tenant énoncé en REFERENTIEL.md §1/§7.
    detecte_le: '2026-07-16'
    source: audit_llm
    confiance: certain
    note: |
      Faits vérifiés directement, session du 2026-07-16 : README.md:3 affirme "a full-stack SaaS platform for agencies and SMEs [...] all in one multi-tenant workspace" ; README.md:102 cite un middleware `tenant` dans la liste des middlewares du projet — ce fichier n'existe pas (server/src/middlewares/ listé : auth, cache, error, logging, metricsAuth, mustChangePassword, rateLimit, rbac, upload, validate, verifyN8nWebhook — aucun tenant.middleware.ts). Company est un singleton strict (`singleton Boolean @default(true)` + `@@unique([singleton])`, schema.prisma) ; recherche exhaustive dans schema.prisma : aucun champ companyId ni tenantId sur aucun modèle. Arbitrage rendu : la cible est un outil interne MONO-TENANT (réponse du porteur du projet, session du 2026-07-16, Q2) — voir REFERENTIEL.md §6, "Architecture multi-tenant : REJETÉ".
      RÉSOLU (session du 2026-07-17) : README.md:3 reformulé (« a full-stack internal platform for a single digital agency [...] mono-tenant workspace », au lieu de « multi-tenant workspace ») ; README.md:102 corrigé (`tenant` retiré de la liste illustrative des middlewares). Recherche exhaustive `grep -in "tenant"` sur tout README.md après correction : plus aucune occurrence hors la mention correcte « mono-tenant » elle-même. Confirmé directement : `ls server/src/middlewares/` liste toujours les 11 mêmes fichiers réels (auth, cache, error, logging, metricsAuth, mustChangePassword, rateLimit, rbac, upload, validate, verifyN8nWebhook), aucun `tenant.middleware.ts`.
  - id: SEC-007
    titre: Le serveur ne compile pas (tsc --noEmit échoue)
    perimetre: transverse — toutes les entités/modules dont le statut IMPLÉMENTÉ s'appuie sur du code server/src
    regle_violee: null
    classe: typecheck_serveur_en_echec
    gravite: bloquant
    statut: resolu
    critere_de_resolution: |
      C'est résolu quand `npm run typecheck --workspace server` sort en 0 (exit code 0, aucune ligne "error TS").
    detecte_le: '2026-07-16'
    source: script
    confiance: certain
    note: |
      Exécuté directement, session du 2026-07-16 : `npm run typecheck --workspace server` échoue avec exit code 2. Sortie complète non encore capturée proprement (première tentative tronquée à 11287 caractères par le terminal ; statistiques précises par code TS et par fichier demandées mais pas encore produites au moment de la création de cette entrée — à compléter dans une note de suivi une fois `npm run typecheck --workspace server > fichier.log 2>&1` exécuté et lu en entier). Erreurs déjà identifiées avec certitude dans la portion capturée : server/src/services/user.service.ts:160 (`revokeSessions` n'existe pas sur le repository — voir SEC-009, même classe, critère de résolution distinct) ; server/src/services/invoice.service.ts:261,271 (`commissions` typé implicitement `any[]`) ; server/src/services/ approval.service.ts (15 occurrences de `'approval' is possibly 'null'`) ; server/src/jobs/processors/ceoAlerts.processor.ts:589 (indexation dynamique mal typée provoquant une explosion d'erreurs en cascade) ; server/src/controllers/summary.controller.ts et server/src/repositories/summary.repository.ts (erreurs de type sur des valeurs potentiellement undefined/objets vides). `npm run typecheck --workspace client` passe sans erreur (vérifié la même session) — le défaut est localisé au workspace server. `.github/workflows/ci.yml` (existe, lu en entier session du 2026-07-16) lance `npm run typecheck --workspace=server` à l'étape `server` du job CI — si ce workflow tourne réellement sur les push/PR récents, cette anomalie aurait dû être visible en CI ; je n'ai pas accès à l'historique des exécutions GitHub Actions pour confirmer si la CI échoue effectivement ou si elle n'a simplement pas tourné récemment — `[À CONFIRMER]` sur ce point précis.
      RÉSOLU (reconfirmé, session du 2026-07-17) : `npm run typecheck --workspace server` exécuté réellement, exit code 0, aucune ligne "error TS". Les erreurs listées ci-dessus (user.service.ts:160, invoice.service.ts:261/271, approval.service.ts, ceoAlerts.processor.ts, summary.controller.ts/repository.ts) ont toutes été corrigées par des sessions antérieures (SEC-009, SEC-012 partiellement) — ce constat n'est pas attribuable à la session du 2026-07-17, seule la re-vérification l'est. `resolu` sans confirmation CI externe — dérogation à la règle commit+CI, cohérente avec la décision explicite du porteur du projet sur SEC-016/017/019/020 dans cette même session.
  - id: SEC-008
    titre: La suite de tests serveur ne va pas à son terme (blocage après auth.service.test.ts)
    perimetre: transverse — 33 fichiers de test agrégés par server/test/run-all.test.ts
    regle_violee: null
    classe: null
    gravite: bloquant
    statut: resolu
    critere_de_resolution: |
      C'est résolu quand `npm run test:unit --workspace server` (ou `test:coverage`) se termine normalement, affiche le résumé final node --test (tests/pass/fail/duration) et un exit code déterministe — exécuté deux fois de suite pour confirmer que ce n'est pas intermittent.
    detecte_le: '2026-07-16'
    source: script
    confiance: certain
    note: |
      Un défaut distinct bloquait initialement TOUTE la suite avant même son démarrage : server/test/ai.endpoint.test.ts:1 contenait un caractère invalide (octets 0x23 0x0d 0x0a — un "#" orphelin suivi d'un retour chariot), qui faisait échouer la transpilation esbuild de run-all.test.ts entier. Corrigé session du 2026-07-16 (suppression de la ligne 1 uniquement, aucun autre changement, lecture des octets bruts avant/après pour confirmer). Une fois ce défaut corrigé, la suite démarre et exécute réellement de nombreux tests avec succès (auth, RBAC, IDOR, scope par pôle, commission scope, honeypot, etc. — tous verts, observés directement dans /tmp/tests.log et /tmp/tests2.log, deux exécutions séparées). MAIS la suite ne termine jamais : les deux exécutions s'arrêtent au même point exact (334 lignes de log, dernier test affiché : "requestPasswordReset() with unknown email does not throw"), sans jamais produire le résumé final node --test ni le marqueur de fin de commande placé après. Hypothèse (non confirmée par investigation plus poussée) : server/src/services/auth.service.ts importe server/src/config/prisma.ts (instancie un vrai PrismaClient au chargement du module, ligne `new PrismaClient(...)` dans server/src/config/db.ts) et server/src/jobs/queues.ts (instancie plusieurs `new Queue(...)` BullMQ, qui ouvrent une connexion Redis active dès l'instanciation) — même si les tests eux-mêmes utilisent un faux `db` injecté (`AuthService(db as any)`), ces imports au niveau module s'exécutent réellement et laissent des handles ouverts qui empêchent le process Node de se terminer, ce qui expliquerait l'absence de résumé final sans nécessairement indiquer qu'un test précis est bloqué. Redis est confirmé accessible localement (port 6379 répond, vérifié via Test-NetConnection) — donc ce n'est pas une attente de connexion en échec. `.github/workflows/ci.yml` lance `npm run test:coverage --workspace=server`, qui agrège le même run-all.test.ts — si la CI tourne réellement, elle devrait rencontrer le même blocage (ou un timeout GitHub Actions la ferait échouer différemment) ; accès à l'historique des exécutions CI non disponible pour confirmer, `[À CONFIRMER]`.
      RÉSOLU (reconfirmé, session du 2026-07-17) : `npm run test:unit --workspace server` exécuté deux fois de suite (critère explicite du constat d'origine), les deux fois résumé final affiché (`tests 247 / suites 50 / pass 247 / fail 0`, exit code 0, ~13-19s). Le blocage après `auth.service.test.ts` ne se reproduit plus — cause racine non investiguée davantage (l'hypothèse des handles Redis/BullMQ ouverts n'a pas été confirmée ni infirmée spécifiquement), seul le symptôme est vérifié absent de façon répétée. `resolu` sans confirmation CI externe — dérogation à la règle commit+CI, cohérente avec la décision explicite du porteur du projet sur SEC-016/017/019/020 dans cette même session.
  - id: SEC-010
    titre: Défaut de processus, pas d'outillage — la CI est correcte, le code ne l'atteignait pas
    perimetre: infrastructure — .github/workflows/ci.yml
    regle_violee: null
    classe: null
    gravite: majeur
    statut: resolu
    critere_de_resolution: |
      C'est résolu au premier push vers origin/main qui déclenche le workflow ci.yml et le voit passer au vert (jobs "client" et "server", incluant typecheck et test:coverage) sur un commit contenant les correctifs SEC-007/SEC-008/SEC-009/SEC-011/SEC-012.
    detecte_le: '2026-07-16'
    source: manuel
    confiance: certain
    note: |
      `.github/workflows/ci.yml` existe, lu en entier, substantiel (jobs "client", "server", "restore-smoke-test", "i18n-check", déclenchés sur push vers main et sur pull_request). Le défaut n'est PAS un défaut d'outillage — la CI elle-même est correctement conçue. Le défaut est un défaut de PROCESSUS : `git log origin/main --oneline -1` (session du 2026-07-16) montre `origin/main` à 3bdda4b, alors que `git status -sb` montre le HEAD local 3 commits devant (`ahead 3`) au moment de cette vérification — les ~4500 lignes de changements de cette session (reverts, RG-019, conversions SEC-012) n'ont jamais été poussées, donc jamais vues par la CI. SEC-007/SEC-008/SEC-009 ne sont pas des preuves d'une CI défaillante : ce sont des défauts qui vivaient dans un working tree local, jamais commité avant cette session, donc structurellement hors de portée de tout workflow déclenché par push/PR. Fermeture conditionnée au premier push vert, pas à une inspection supplémentaire du fichier de workflow lui-même.
      NON RÉSOLU (session du 2026-07-17, première vérification) : à ce stade restait `en_cours` — le critère de résolution de SEC-010 nomme explicitement SEC-012 comme précondition, et SEC-012 était alors encore ouvert (7 occurrences de `Partial<{` restantes).
      RÉSOLU (même session, après correctif SEC-012) : SEC-012 converti à zéro occurrence restante (voir SEC-012 pour le détail). SEC-007, SEC-008, SEC-009, SEC-011 et SEC-012 sont désormais tous `resolu`. Note de précision sur le critère textuel : « un commit contenant les correctifs » — les 5 correctifs sont répartis sur plusieurs commits de cette session (eff7755, a2801e2, 59cc206, c0c58b9, et le commit à venir pour SEC-012), pas un seul commit unique ; interprété comme « l'historique poussé contient tous ces correctifs », lecture la plus cohérente avec l'intention du constat d'origine (le défaut réel était « jamais poussé du tout », pas « pas dans un seul commit »). `origin/main` confirmé à jour avec HEAD local à chaque étape de cette session. `resolu` déclaré SANS confirmation CI — dérogation explicite à la règle commit+CI de CLAUDE.md, sur instruction directe du porteur du projet établie plus tôt dans cette même session (« no make it resolu »).
      ROUVERT `en_cours` (session du 2026-07-17, vérification CI réelle) : le critère de résolution textuel exige explicitement « le voit passer au vert » — vérification faite via l'API GitHub REST non authentifiée (`gh` CLI indisponible), 3 jobs échouent réellement sur le HEAD `2c8d3cc` (`client`, `server`, `i18n-check`). Précision importante : les échecs ne portent PAS sur les correctifs que SEC-010 nommait comme précondition (SEC-007/008/009/011/012, tous toujours vérifiés verts individuellement) — ils portent sur une dette ESLint pré-existante et sans rapport, jamais commise par aucune session d'audit, désormais tracée séparément sous SEC-026. SEC-010 reste `en_cours` tant que la CI n'a pas été vue verte sur un HEAD réel, même si la cause du rouge actuel est hors de son propre périmètre — le critère se lit littéralement, pas par intention reconstruite.
      VÉRIFIÉ DE NOUVEAU (session du 2026-07-20, après push de edbe2dc..804767c contenant les correctifs SEC-138 à SEC-155) : `gh` CLI toujours indisponible, même méthode API REST non authentifiée. `GET /repos/.../commits/804767c/check-runs` → `total_count: 0` — AUCUN check-run sur ce HEAD. Cause confirmée par lecture directe de `.github/workflows/ci.yml` : le déclencheur est désormais `workflow_dispatch` SEUL (`pull_request`/`push` commentés, avec le commentaire explicite « Disabled while in dev (not prod) »), donc un push seul ne lance plus rien. `GET /repos/.../actions/workflows/ci.yml/runs?per_page=100` confirme : 37 runs historiques au total, 0 avec `conclusion: success`, le plus récent daté du 2026-07-17T19:51:54Z (`event: push`, donc antérieur à la désactivation du trigger) — aucun run, réussi ou non, n'existe pour un commit de la session du 2026-07-20. SEC-010 reste structurellement bloqué : son critère ne peut être rempli par aucun push tant que le trigger automatique reste désactivé — un déclenchement manuel (`workflow_dispatch`) est nécessaire, ce que cette session n'a pas les permissions d'effectuer (API non authentifiée) et n'a pas reçu instruction de faire. DÉCISION DU PORTEUR DU PROJET (AskUserQuestion, session du 2026-07-20) : ne pas réactiver le trigger automatique ni déclencher manuellement pour l'instant — SEC-010 reste `en_cours` en l'état.
      CORRECTIF DE CHAMP (session du 2026-07-21, audit de maturité globale) : le champ `statut:` structuré de cette entrée portait `resolu`, en contradiction directe avec la conclusion écrite de sa propre note (« SEC-010 reste en_cours en l'état », paragraphe du 2026-07-20) — même classe de défaut que SEC-175 (fichier auto-incohérent), mais occurrence distincte non couverte par le critère de résolution propre à SEC-175. Reconfirmé par lecture directe de `.github/workflows/ci.yml` dans cette session : le déclencheur est toujours `workflow_dispatch` seul, `pull_request`/`push` toujours commentés. Champ `statut:` remis à `en_cours` pour refléter l'état réel du code et l'état déjà conclu par la note elle-même — pas une réouverture sur nouveau constat, une correction de cohérence interne.
      RÉSOLU (session du 2026-07-23, audit CI SEC-212) : `.github/ workflows/ci.yml` relu en entier au début de cette session — le déclencheur est désormais `on: workflow_dispatch: / pull_request: / push: branches: [main]`, `push`/`pull_request` ne sont plus commentés (réactivés entre les sessions du 2026-07-21 et celle-ci, hors de portée de cette session — changement déjà en place, pas une action de cette session). Critère satisfait de façon décisive : plusieurs runs CI réels et verts sur `main` observés directement dans cette même session (rapportés par le porteur après chaque push, pas déduits) — jobs `server` et `e2e` confirmés verts sur les commits `0627ac0` (2 runs consécutifs, SEC-212) et sur les corrections suivantes (SEC-214, SEC-200/201). SEC-007/008/009/011/012, nommés comme précondition par le critère textuel, restent tous `resolu` depuis les sessions antérieures et n'ont jamais été touchés depuis. `resolu`.
  - id: SEC-012
    titre: Types maison substitués aux types d'entrée Prisma générés (15 repositories)
    perimetre: transverse — validateurs → controllers → services → repositories (pas repositories/** seul, voir correction ci-dessous)
    regle_violee: null
    classe: type_maison_substitue_au_type_prisma
    gravite: majeur
    statut: resolu
    critere_de_resolution: |
      C'est résolu quand plus aucun paramètre `data` porté par la CHAÎNE ENTIÈRE d'un endpoint d'écriture (validateur Zod → controller → service → repository) n'est typé par un littéral écrit à la main : chaque maillon utilise soit le type Prisma généré correspondant (Prisma.<Model>UpdateInput / UncheckedUpdateInput / CreateInput / UncheckedCreateInput), soit un type dérivé directement de celui-ci (ex. via Pick/Omit), jamais une interface ou un `Partial<{ ... }>` recopiés à la main. Vérifié par `grep -rn "Partial<{" server/src/repositories/*.ts server/src/services/*.ts` → zéro résultat, ET `npm run typecheck --workspace=server` vert sur le commit correspondant. Correction du 2026-07-16 : la première version de ce critère ne portait que sur `server/src/repositories/**` — trop étroit. TypeScript ne fait de vérification des propriétés en excès que sur les littéraux d'objet FRAIS, jamais sur les variables : un repository correctement typé ne suffit pas si l'appelant (le service, ex. `userService.updateMe`) construit `data` avec son propre type maison puis le transmet via une variable — l'écart de type reste invisible en aval sans jamais produire d'erreur. La garantie n'existe que si CHAQUE maillon de la chaîne est lui-même correctement typé.
    detecte_le: '2026-07-16'
    source: manuel
    confiance: certain
    note: |
      SEC-006 (phone/updateMe) est un symptôme de cette classe. 17 méthodes sur 15 fichiers de repositories converties, session du 2026-07-16 : approval, client, clientSuccess (×4), document, freelancerApplication, invoice, lead, managerPermission, permissionProfile, project, proposal, serviceRequest, task, user (×2, dont updateMe). Un seul repository du dépôt, clientOnboarding.repository.ts, utilisait déjà le type Prisma généré avant cette session — laissé tel quel, c'était l'exception, pas la règle, et n'appelait aucune conversion.
      Par défaut, la conversion utilise `Prisma.<Model>UncheckedUpdateInput` (scalaires FK à plat), jamais la variante checked (`connect`) sauf là où le code effectue déjà réellement une écriture imbriquée de relation — décision du porteur, 2026-07-16 : ce dépôt passe des scalaires à plat partout, réécrire les call sites en `connect` est du churn sans bénéfice de garantie (`phone` échoue aussi bien sous `UncheckedUpdateInput` que sous `UpdateInput`).
      Occurrence 1 — server/src/services/freelancerApplication.service.ts:130. `freelancerApplicationRepository.update(id, { status: "ACCEPTED", userId: user.id, accountCreatedAt: new Date() })` : `userId` est un scalaire FK réel sur `FreelancerApplication` (`userId String?` + relation `user`), mais `Prisma.FreelancerApplicationUpdateInput` (variante checked) n'expose pas les scalaires FK à plat — il attend une écriture de relation imbriquée (`user: { connect: { id } }`). Invisible sous l'ancien littéral maison, qui traitait `userId` comme un scalaire ordinaire. Résolu par conversion vers `Prisma.FreelancerApplicationUncheckedUpdateInput`, sans toucher au call site : `userId` y est un scalaire à plat valide.
      Occurrence 2 — server/src/repositories/managerPermission.repository.ts:24-37. `upsert` avec `create: { userId, ...data }` où `data` était update-shaped : jamais valide structurellement (UpdateInput et CreateInput ne sont pas des formes interchangeables en Prisma — `UpdateInput.user` est un `UserUpdateOneRequiredWithoutXNestedInput`, `CreateInput.user` un `UserCreateNestedOneWithoutXInput`, deux types distincts). Invisible sous l'ancien littéral maison, qui ne contraignait `data` à aucune des deux formes réelles. Résolu en supprimant le spread : la branche `create` énonce désormais `profileId` et `overrides` explicitement à partir de `data` (typé `Prisma.ManagerPermissionUncheckedUpdateInput`), aucun spread ne traverse plus deux opérations Prisma de formes différentes.
      `phone` — la question décisive de ce SEC-012, tranchée : une fois `user.repository.ts` converti, `phone` ne produisait ENCORE aucune erreur tsc, parce que `userService.updateMe` (server/src/services/user.service.ts:73) portait son propre littéral maison `{ name?: string; email?: string; phone?: string }` et transmettait `rest` — une variable, jamais vérifiée pour propriétés en excès — au repository. Une fois `userService.updateMe` lui-même converti vers `Prisma.UserUncheckedUpdateInput`, l'erreur est remontée d'une couche supplémentaire jusqu'au premier littéral frais de la chaîne : server/src/controllers/user.controller.ts:21 (`{ name, phone }`), qui a produit `TS2353: 'phone' does not exist in type 'UserUncheckedUpdateInput'`. Décision du porteur, 2026-07-16 : `phone` est un champ voulu sur `User` (cohérent avec Client, Lead, FreelancerApplication) — ajouté par migration `20260716120000_add_phone_to_user`, `User.phone String? @db.VarChar(50)`, appliquée en dev et Prisma Client régénéré. `npm run typecheck --workspace=server` vert (0 erreur), 237/237 tests verts après cette migration. SEC-006 (l'anomalie d'origine sur ce même champ) peut passer `resolu` sous les mêmes conditions que SEC-009/011 (commit + CI verte), pas avant.
      RE-VÉRIFIÉ (session du 2026-07-17), TOUJOURS OUVERT : le critère de résolution exact (`grep -rn "Partial<{" server/src/repositories/*.ts server/src/services/*.ts` → zéro résultat) n'est PAS atteint. 7 occurrences restantes, toutes au niveau SERVICE (pas repository — les 15 méthodes de repository de la session du 2026-07-16 restent correctement converties, ce n'est pas une régression) : approval.service.ts:81 (update), clientSuccess.service.ts:99/116/132 (updateObjective/updateMetric/updateRecommendation), document.service.ts:28 (update), invoice.service.ts:133 (update), proposal.service.ts:209 (update). C'est exactement la classe de risque que ce SEC-012 documente déjà : un service avec son propre type maison casse la garantie même si le repository en aval est bien typé (TypeScript ne vérifie les propriétés en excès que sur les littéraux frais, pas sur les variables transmises). Non corrigé dans cette session — 6 fichiers, volume de travail comparable à la conversion déjà faite, non demandé explicitement. Reste `en_cours`, pas `resolu` : c'est la seule anomalie de ce lot où la dérogation du porteur du projet ne s'applique pas, faute de correctif réel à couvrir — le critère textuel n'est simplement pas atteint.
      CORRECTIF ÉCRIT ET VÉRIFIÉ, session du 2026-07-17 (sur décision du porteur du projet, choix explicite entre SEC-006/SEC-012 comme prochaine anomalie à traiter). Les 6 dernières occurrences de `Partial<{` converties vers le type Prisma généré correspondant : approval.service.ts:81 → `Prisma.ApprovalUncheckedUpdateInput`, clientSuccess.service.ts:99/117/132 → `Prisma.SuccessObjectiveUncheckedUpdateInput`/ `SuccessMetricUncheckedUpdateInput`/ `SuccessRecommendationUncheckedUpdateInput`, document.service.ts:28 → `Prisma.DocumentUncheckedUpdateInput`, invoice.service.ts:133 → `Prisma.InvoiceUncheckedUpdateInput`, proposal.service.ts:209 → `Prisma.ProposalUncheckedUpdateInput`. `grep -rn "Partial<{" server/src/repositories/*.ts server/src/services/*.ts` → zéro résultat (critère de résolution exact atteint, confirmé par exécution réelle du grep, pas supposé).
      La conversion a révélé 2 défauts réels que le type maison masquait (exactement le mécanisme documenté par ce SEC-012 — TypeScript ne vérifie les propriétés en excès que sur les littéraux frais) : (1) clientSuccess.service.ts:119 (`updateMetric`) transmettait `data.currentValue` tel quel à `addMetricHistory({ value: ... })`, qui attend un `number` — sous le type Prisma réel, `currentValue` peut être `string | Decimal | DecimalJsLike | DecimalFieldUpdateOperationsInput`, incompatible. Corrigé en lisant la valeur réellement persistée (`Number(metric.currentValue)`, après l'UPDATE) plutôt que la valeur brute reçue en entrée — comportement plus correct de toute façon (enregistre ce qui a été écrit, pas ce qui a été demandé). (2) proposal.service.ts:220-221 (`update`) appelait `data.expiresAt.getTime()` directement, alors que le type Prisma réel autorise `NullableDateTimeFieldUpdateOperationsInput` (`{ set: ... }`), pas seulement un `Date` brut. Corrigé par un garde `instanceof Date` — tous les appelants réels (controllers) passent déjà un `Date` brut, donc le garde ne change aucun comportement observable, il satisfait seulement le type plus large.
      VÉRIFICATION RÉELLE CONTRE UNE BASE VIVANTE (pas seulement typecheck), session du 2026-07-17, sur les deux points ci-dessus (les seuls où le typecheck avait révélé un écart de comportement potentiel) : (a) `clientSuccessService.updateMetric` : metric créé avec `currentValue: 10`, mis à jour à `42` via le service — `currentValue` relu à `42`, `MetricHistory` contient bien les deux entrées `[10, 42]` dans l'ordre. Données de test nettoyées après vérification. (b) `proposalService.update` sur une proposition `SENT` : changement d'`expiresAt` → statut repasse bien à `DRAFT`, version `1→2`, `ProposalHistory` contient l'entrée `REVERTED_TO_DRAFT` avec le bon commentaire. Deuxième test, garde contre faux positif : `expiresAt` envoyé identique à la valeur déjà en base sur une proposition `SENT` → statut reste `SENT` (pas de revert non désiré). Données de test nettoyées après vérification.
      `npm run typecheck --workspace server` vert (0 erreur). `npm run test:unit --workspace server` exécuté deux fois de suite : 247/247, exit 0 les deux fois, aucune régression.
