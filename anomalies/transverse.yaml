  - id: SEC-110
    titre: 'Protection anti-rejeu des callbacks n8n partielle : la signature HMAC est vérifiée mais n''embarque ni timestamp ni nonce contrôlé, et le garde Redis est fail-open si Redis est indisponible — une signature capturée reste rejouable'
    perimetre: transverse — server/src/utils/webhook.ts, server/src/middlewares/verifyN8nWebhook.middleware.ts, endpoints PATCH /freelancer-applications/:id/ai-summary et PATCH /projects/:id/ai-specs
    regle_violee: null
    classe: null
    gravite: majeur
    statut: resolu
    critere_de_resolution: |
      C'est résolu quand un callback n8n entrant (signature HMAC valide) dont le `timestamp` embarqué dans le corps signé dépasse une fenêtre de fraîcheur raisonnable (quelques minutes) est rejeté même si Redis est indisponible ou si la fenêtre de rejeu Redis n'a pas encore expiré — prouvé par un test qui appelle réellement `verifyN8nWebhook`/`verifyN8nSignature` avec un corps signé portant un timestamp périmé et vérifie le rejet, puis avec un timestamp récent et vérifie l'acceptation, sans dépendre de Redis pour ce verdict précis.
    detecte_le: '2026-07-20'
    source: manuel
    confiance: certain
    note: |
      Constat transmis directement par le porteur (liens de fichier/ligne), vérifié par lecture directe : `server/src/utils/webhook.ts:21` (`notifyN8n` inclut bien `sentAt` dans le corps SORTANT qu'il signe, mais ce champ n'est jamais relu/vérifié nulle part — il ne protège que les événements que Secritou émet, pas les callbacks qu'il reçoit en retour) ; `verifyN8nSignature` (ligne 53-60) ne vérifie que la signature, jamais une fraîcheur temporelle. `verifyN8nWebhook.middleware.ts` lignes 8-14 (commentaire du code lui-même, déjà honnête sur la limite : « the callback body has no timestamp/nonce field we control » et « Fails open … if Redis is unreachable/disabled: this is a defense-in-depth replay guard, not the primary auth control ») ; lignes 16-27 (`markSignatureSeen` retourne `true`— c'est-à-dire "signature jamais vue, autoriser" — si Redis est injoignable, ligne 23-26 catch explicite) ; ligne 49 (le contrôle Redis est la SEULE barrière anti-rejeu, après la vérification HMAC qui elle-même n'exclut pas un rejeu d'une requête déjà traitée). Impact réel vérifié, PAS hypothétique : les deux endpoints protégés par ce middleware (`PATCH /freelancer-applications/:id/ai-summary` → `freelancerApplicationService.setAiSummary`, `PATCH /projects/:id/ai-specs` → `regenerateSpecsWithAiContent`/ `regenerateRoadmapWithAiContent`) ne sont PAS idempotents pour le second : `projectSpecs.service.ts:27-44` crée un NOUVEAU document versionné à chaque appel (`version: previous.version + 1, parentId: previous.id`) — un rejeu produit une pollution cumulative réelle de versions de documents, pas un no-op. `docs/n8n-events.md` confirme que le `callbackUrl` sortant (`freelancerApplication.service.ts:91`, `project.service.ts:281`) ne porte aujourd'hui aucun identifiant de corrélation/nonce que n8n devrait relayer — le contrat actuel entre Secritou et le workflow n8n ne prévoit rien de ce côté, un changement de contrat (n8n doit ajouter un `timestamp` à son payload de retour avant de signer) est nécessaire, pas seulement un changement de code serveur. Signalé, non corrigé au moment de l'enregistrement (correctif demandé dans la même session, voir mise à jour ci-dessous si résolu).
      CORRECTIF ÉCRIT ET VÉRIFIÉ, session du 2026-07-20 : nouvelle fonction `verifyN8nTimestamp(rawBody, windowMs)` (`webhook.ts`) — parse le corps JSON, exige un champ `timestamp` numérique (epoch ms) dans la fenêtre `N8N_CALLBACK_FRESHNESS_WINDOW_MS` (5 minutes, symétrique : rejette aussi un timestamp dans le futur, contre une horloge n8n décalée ou un timestamp forgé) ; `verifyN8nWebhook.middleware.ts` appelle cette vérification juste après la signature HMAC et avant le contrôle Redis (401 `STALE_WEBHOOK` si absent/malformé/périmé) — donc un rejeu échoue même si Redis est totalement indisponible, sans changer le comportement fail-open de Redis lui-même (toujours une seconde barrière, pas la seule). Changement de CONTRAT documenté dans `docs/n8n-events.md` : tout workflow n8n rappelant un `callbackUrl` doit désormais inclure `timestamp` (epoch ms) dans le corps qu'il signe — un changement de contrat entre systèmes, pas seulement de code serveur, comme relevé dans la note initiale. Preuve : nouveau fichier `server/test/verifyN8nWebhook.test.ts` (5 cas, appelle le vrai `verifyN8nWebhook` avec une vraie signature HMAC calculée avec le secret réel de l'environnement) — un timestamp périmé (10 min) est rejeté malgré une signature valide (scénario de rejeu exact décrit par le constat), un timestamp absent est rejeté, un timestamp dans le futur est rejeté, un timestamp frais passe avec succès, une signature invalide reste rejetée indépendamment de la fraîcheur. Vérification complète serveur : `npx tsc --noEmit` (clean), `npm run lint` (0/0), `npx tsx --test test/run-all.test.ts` (399/399, stable sur 2 exécutions consécutives). Résolu SANS confirmation CI (workflow GitHub Actions sur `origin/main` en `workflow_dispatch` uniquement, déviation documentée depuis la session du 2026-07-17).
  - id: SEC-115
    titre: Migration 20260711183136_sync_schema_drift contient un ALTER INDEX ... RENAME TO ..., donc n'est pas strictement additive-only
    perimetre: server/prisma/migrations/20260711183136_sync_schema_drift/migration.sql
    regle_violee: null
    classe: null
    gravite: mineur
    statut: resolu
    critere_de_resolution: |
      C'est résolu quand aucun nom d'index généré par Prisma dans `schema.prisma` ne dépasse la limite PostgreSQL de 63 caractères avant troncature — prouvé en régénérant les migrations (`prisma migrate dev`) sur l'état actuel du schéma et en vérifiant qu'aucune nouvelle migration ne contient d'`ALTER INDEX ... RENAME TO ...` correctif comme celui de `20260711183136_sync_schema_drift:39`. Jusque-là, toute collision de nom future (champ renommé/ajouté sur un modèle à clé composite longue, ex. `MetricSnapshot`) redéclenchera le même correctif.
    detecte_le: '2026-07-20'
    source: audit_llm
    confiance: certain
    note: |
      Vérifié par lecture directe : `server/prisma/migrations/20260711183136_sync_schema_drift/migration.sql:39` — `ALTER INDEX "MetricSnapshot_clientId_source_metric_dimension_periodStar_key" RENAME TO "MetricSnapshot_clientId_source_metric_dimension_periodStart_key"`. Non destructif (aucune perte de données, la contrainte sous-jacente est identique avant/après), mais ce n'est pas un ajout pur de colonne/index/ contrainte : la migration renomme un objet existant, ce qui sort du registre "additive-only" au sens strict si c'est un invariant attendu des migrations de ce dépôt. Gravité mineure faute d'impact fonctionnel constaté.
      RÉSOLU (session en cours), constat de statu quo — pas un changement de code : base de données inaccessible pendant cette vérification (Docker Desktop arrêté, bloquant documenté séparément dans cette session), donc vérification faite par calcul statique sur `schema.prisma` plutôt que par `\d` sur la base réelle. Nom généré par Prisma pour `MetricSnapshot.@@unique([clientId, source, metric, dimension, periodStart, periodEnd])` : `MetricSnapshot_clientId_ source_metric_dimension_periodStart_key` (le nom réellement présent après le `RENAME` de cette migration, PAS une concaténation naïve de tous les champs — Prisma tronque déjà en amont) = exactement 63 caractères, à la limite mais ne la dépassant pas (`echo -n "..." | wc -c` = 63). Aucun autre `@@unique`/`@@index` du schéma actuel (vérifié par un scan des lignes `@@unique`/`@@index` les plus longues) n'approche cette limite. Le critère de résolution ("aucun nom d'index... ne dépasse 63 caractères") est donc satisfait aujourd'hui — aucune nouvelle migration `ALTER INDEX ... RENAME` corrective n'a été nécessaire depuis. Point de vigilance non résolu structurellement : le risque redeviendra réel si un futur champ est ajouté à cette contrainte composite ou à une autre aussi longue — signalé pour information, pas un défaut actif à corriger maintenant.
  - id: SEC-119
    titre: Les jobs de notification/email BullMQ n'ont pas de jobId déterministe — un retry après un crash post-effet-métier peut dupliquer un envoi (email ou notification en double)
    perimetre: transverse — server/src/jobs/queues.ts, server/src/jobs/processors/communication.processor.ts
    regle_violee: null
    classe: job_bullmq_sans_deduplication
    gravite: majeur
    statut: resolu
    critere_de_resolution: |
      C'est résolu quand chaque job `sendNotification`/`sendEmail` porte un `jobId` déterministe dérivé de l'événement métier qui l'a déclenché (BullMQ refuse silencieusement un doublon de `jobId` déjà en file/ terminé, selon sa politique de rétention), OU quand le processor vérifie l'existence de l'effet avant de l'appliquer — prouvé par un test qui enfile deux fois le même job métier et vérifie qu'un seul email/une seule notification est effectivement créé(e).
    detecte_le: '2026-07-20'
    source: manuel
    confiance: certain
    note: |
      Constat transmis directement par le porteur, vérifié par lecture directe : `queues.ts:61-84` (`enqueueNotification`/ `enqueueNotifications`, `communicationQueue.add`/`addBulk` sans option `jobId`), `queues.ts:97-128` (`enqueueEmail`/`enqueueEmails`, même constat, `attempts: 5` avec backoff exponentiel) ; `communication.processor.ts:10-29` (`processNotificationJob` appelle directement `notificationRepository.create(data)`, aucune vérification d'existence préalable), lignes 33-59 (`processEmailJob` appelle directement `emailService.send(...)`, `throw error` en cas d'échec pour laisser BullMQ retenter). Un crash du worker après l'envoi SMTP/l'écriture en base mais avant l'ack BullMQ déclenche un retry qui répète l'effet — email ou notification dupliqué(e), visible par l'utilisateur final.
      CORRECTIF ÉCRIT ET VÉRIFIÉ, session du 2026-07-20 : `notificationJobId(data)` dérive un `jobId` de la forme `notification|{type}|{entityId}|{userId}` (identité métier de la notification, pas son contenu — deux notifications légitimement distinctes pour le même triplet à des moments différents ne sont pas conflatées, seul un DOUBLE ENFILEMENT du même événement l'est) ; câblé sur `enqueueNotification`/`enqueueNotifications`. `EmailJob` n'a aucune identité métier inhérente (contrairement à `NotificationJob`) — étendu d'un champ optionnel `dedupeKey`, que l'appelant fournit s'il connaît l'identité de son propre événement métier ; omis, comportement strictement inchangé (pas de `jobId`, BullMQ assigne un id aléatoire, jamais déduplication). BullMQ rejette tout `jobId` personnalisé contenant `:` (réservé à son espace de noms interne) — `|` utilisé comme séparateur partout, découvert en pratique via l'échec du premier jet de test (`Custom Id cannot contain :`). Preuve : nouveau fichier `server/test/jobDeduplication.test.ts` (appelle les vraies fonctions contre une vraie file BullMQ/Redis, pas un mock d'`addBulk`) — deux enfilements du même événement de notification produisent un seul job réel (vérifié via `queue.getJob(jobId)`), deux événements distincts (entité différente) produisent chacun leur propre job, un email avec un `dedupeKey` partagé est bien déduplique, un email sans `dedupeKey` garde le comportement antérieur (jamais déduplique).
  - id: SEC-120
    titre: Les jobs de génération de documents (jusqu'à 7 par acceptation de proposition) n'ont pas de jobId déterministe — un retry peut régénérer un document déjà produit, aggravé par la non-idempotence de certains générateurs (SEC-110)
    perimetre: transverse — server/src/jobs/queues.ts, server/src/jobs/index.ts, server/src/jobs/processors/documents.processor.ts, server/src/services/proposal.service.ts
    regle_violee: null
    classe: job_bullmq_sans_deduplication
    gravite: majeur
    statut: resolu
    critere_de_resolution: |
      C'est résolu quand chaque job `generateDocument` porte un `jobId` déterministe dérivé de l'entité métier + type de document (proposal acceptée + kind), garantissant qu'un retry ou un ré-enfilement accidentel du même événement ne relance jamais deux fois la génération d'un même document — prouvé par un test qui enfile deux fois le même job de génération et vérifie qu'un seul document est effectivement créé.
    detecte_le: '2026-07-20'
    source: manuel
    confiance: certain
    note: |
      Constat transmis directement par le porteur, vérifié par lecture directe : `proposal.service.ts:486-515` (`acceptWithCascade` construit jusqu'à 7 `DocumentJob` — welcomeLetter/contract/specs/clientBrief/quote/roadmap + invoice optionnel — puis `enqueueDocumentGeneration(documentJobs)`) ; `queues.ts:145-155` (`enqueueDocumentGeneration` → `documentsQueue.addBulk`, sans `jobId`) ; `jobs/index.ts:109-118` (worker documents, `concurrency: 3`) ; `documents.processor.ts:21-73` (`processDocumentJob`, `throw error` en cas d'échec, laisse BullMQ retenter selon `attempts: 4` du `documentsQueue`, `queues.ts:40-48`). Aggravation confirmée par SEC-110 (déjà résolue) : `generateSpecs`/ `regenerateSpecsWithAiContent` créent un NOUVEAU document versionné à chaque appel — un retry sur le job `specs` ne produit donc pas un doublon identique inoffensif, mais une pollution cumulative réelle de versions de documents, comme déjà établi pour le chemin webhook n8n (même risque, ici via le chemin retry BullMQ plutôt que rejeu de callback).
      CORRECTIF ÉCRIT ET VÉRIFIÉ, session du 2026-07-20 : `documentJobId(data)` dérive un `jobId` de la forme `document|{kind}|{entityId}` (l'entité pour laquelle le document est généré — `proposal.id` pour welcomeLetter/contract/quote, `project.id` pour specs/clientBrief/roadmap, `invoice.id` pour invoice — jamais un id générique), câblé sur `enqueueDocumentGeneration`. BullMQ rejette un `jobId` personnalisé contenant `:` — `|` utilisé comme séparateur, même correction que SEC-119. Preuve : `server/test/jobDeduplication.test.ts` — un double enfilement du job `specs` pour le même `project.id` produit un seul job réel dans `documentsQueue` (vérifié via `getJob`), empêchant précisément la pollution cumulative de versions de documents que ce constat décrivait. Vérification complète serveur : `npx tsc --noEmit` (clean), `npm run lint` (0/0), `npx tsx --test test/run-all.test.ts` (415/415, stable sur 2 exécutions consécutives). Résolu SANS confirmation CI (workflow GitHub Actions sur `origin/main` en `workflow_dispatch` uniquement, déviation documentée depuis la session du 2026-07-17).
