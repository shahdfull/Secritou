  - id: SEC-030
    titre: >
      server/tsconfig.json n'inclut que "src/**/*.ts" — npm run typecheck
      (tsc --noEmit) ne vérifie jamais server/test/**, qui peut donc
      accumuler des erreurs de type réelles (constaté : deux appels
      obsolètes de clientOnboardingService.createPayment avec un shape
      retiré du type PaymentInput, jamais détectés) sans jamais faire
      échouer la porte CI typecheck ; les tests continuent de s'exécuter
      via tsx (qui strip les types sans les vérifier), masquant le défaut
    perimetre: transverse
    regle_violee: >
      Zéro warning/erreur lint est une porte obligatoire documentée dans
      CLAUDE.md ; par analogie directe, une porte typecheck qui n'examine
      jamais tout le code réellement exécuté (les tests le sont, via tsx)
      ne peut pas garantir ce qu'elle prétend garantir. client/tsconfig.json
      n'a pas ce trou : ses tests vivent sous src/**, donc déjà couverts.
    classe: typecheck-perimetre-incomplet
    gravite: moyenne
    statut: resolu
    critere_de_resolution: >
      server/tsconfig.json inclut server/test/**/*.ts (ou un tsconfig
      dédié aux tests avec les mêmes compilerOptions), npm run typecheck
      --workspace=server échoue si un fichier de test contient une
      véritable erreur de type, et un commit avec 0 erreur passe la CI.
    detecte_le: "2026-07-30"
    source: >
      Découvert incidemment (CLAUDE.md « Enregistrement immédiat de tout
      écart constaté ») en corrigeant SEC-029 : après avoir retiré
      amount/amountPaid/status de PaymentInput
      (clientOnboarding.validator.ts), `npx tsc --noEmit` sur tout le
      workspace server restait à 0 erreur alors que
      test/clientOnboardingWriteScopeManager.test.ts appelait encore
      createPayment/updatePayment avec ces champs — confirmé en exécutant
      `npx tsc --noEmit --strict test/clientOnboardingWriteScopeManager.test.ts`
      directement (TS2353 sur les deux appels). server/tsconfig.json:
      "include": ["src/**/*.ts"] exclut structurellement tout server/test/.
    confiance: haute
    note: >
      N'affecte pas la fiabilité des tests eux-mêmes (ils s'exécutent
      normalement, ce ne sont pas des faux positifs de succès) — le risque
      est que le typecheck CI ne protège jamais contre une dérive de type
      dans les fichiers de test, qui peuvent donc silencieusement diverger
      du code réel qu'ils prétendent appeler (risque similaire, en plus
      subtil, à la classe de défaut décrite dans CLAUDE.md « verifie: test
      exige un test qui appelle le code réel »).
      Corrigé (session du 2026-07-30) : nouveau
      server/tsconfig.typecheck.json (extends tsconfig.json,
      rootDir: ".", include src/**/*.ts + test/**/*.ts — laisse
      tsconfig.json/npm run build intacts, aucun risque sur l'émission de
      dist/). `npm run typecheck` pointe désormais sur ce fichier. Les ~19
      fichiers de test révélés (erreurs préexistantes, sans rapport avec
      cette session : ListQueryOptions.orderDir manquant,
      Decimal vs string|number, req.user JwtPayload incomplet, valeurs
      possibly null, un fake Prisma client sous-typé dans
      booking.service.test.ts, assigneeId: null non exprimable par
      Partial<CreateTaskDTO> — nouveau type UpdateTaskDTO introduit dans
      server/src/types/entities.ts pour ce dernier cas) corrigés un par un
      dans la même session — décision du porteur (AskUserQuestion) de ne
      pas se contenter d'enregistrer l'écart. 695/695 tests server verts,
      lint 0/0, build (tsc -p tsconfig.json) toujours vert séparément.
      `verifie: test` (le typecheck lui-même est la porte).

  - id: SEC-010
    titre: >
      gdprErasure.test.ts — l'anonymisation d'un Client avec facture
      s'exécute (mode "anonymized" confirmé) mais l'assertion sur
      Invoice.amount.toString() attend "100.000" et obtient "100"
    perimetre: transverse
    regle_violee: >
      RG-025 (export et effacement RGPD, verifie:test) : le test attendu
      comme preuve que l'anonymisation ne touche pas la facture échoue sur
      une assertion de formatage, pas sur le comportement métier lui-même
      (le mode "anonymized" et la survie de la facture sont confirmés par
      les lignes précédentes du même test, elles passent).
    classe: assertion-format-decimal
    gravite: mineure
    statut: resolu
    critere_de_resolution: >
      server/test/gdprErasure.test.ts, cas "a client with an invoice is
      anonymized, not deleted — the invoice survives untouched" doit passer
      au vert. Deux réparations possibles, à trancher (pas déduit du seul
      typecheck, cf. CLAUDE.md « réparer n'est pas développer ») : (a)
      l'assertion attend un format Decimal.js à 3 décimales fixes
      (".000") qui ne correspond pas à ce que Prisma renvoie réellement
      pour ce champ Decimal(14,3) — corriger l'assertion pour matcher le
      format réel ; ou (b) un comportement réel de troncature/formatage
      existe quelque part sur ce chemin et l'assertion a raison de
      l'attendre — à investiguer avant de choisir.
    detecte_le: "2026-07-28"
    source: >
      npm run test:unit --workspace server, session du 2026-07-28 (RG-025,
      demande explicite du porteur de faire tourner typecheck/lint/tests).
      AssertionError strictEqual : actual '100', expected '100.000',
      server/test/gdprErasure.test.ts:72
      (`assert.equal(invoiceStillThere?.amount.toString(), "100.000")`).
      Invoice.amount est Decimal(14,3) en base (schema.prisma) — écrit avec
      la valeur JS 100 à la création du fixture de test (ligne 58, `amount: 100`).
      Pas d'investigation plus poussée dans cette session sur le
      comportement exact de Prisma.Decimal#toString() pour ce champ.
    confiance: moyenne
    note: >
      Hypothèse sur le code, pas tranchée : ni le test ni le code n'ont été
      modifiés dans cette session sur ce point — seul le symptôme exact est
      enregistré, conformément à CLAUDE.md (« un test rouge est une
      hypothèse sur le code, pas un défaut du test »).
    correctif: >
      Option (a) tranchée (AskUserQuestion, session du 2026-07-29) : aucune
      troncature de données réelles n'existe sur ce chemin —
      Prisma.Decimal#toString() ne préserve pas les zéros de fin d'un
      Decimal(14,3) pour la valeur 100, "100" est le format réel et correct.
      L'assertion attendait un format qui n'a jamais correspondu au
      comportement réel de Prisma. Corrigée : `assert.equal(Number(
      invoiceStillThere?.amount), 100)` au lieu de comparer une chaîne
      formatée. Suite complète server (650 tests, 650 pass, 0 fail, 0 skip)
      exécutée sans régression. Commité (954a191) et confirmé vu vert en
      CI sur le commit fdc1363 (run GitHub Actions 30457571233, 6/6 jobs
      verts) — critère de résolution rempli (CLAUDE.md « Un critère de
      résolution se vérifie sur un commit »).

