  - id: SEC-023
    titre: >
      .github/workflows/ci.yml et backup.yml référencent actions/checkout@v4,
      actions/setup-node@v4, actions/upload-artifact@v4 par tag mutable,
      jamais par SHA de commit — écart explicitement documenté par le
      commentaire MED-1 dans ci.yml mais jamais corrigé ; dependabot.yml
      maintiendrait des SHA épinglés à jour s'ils existaient, mais ne les
      crée pas rétroactivement
    perimetre: transverse
    regle_violee: >
      Bonne pratique de sécurité de la chaîne d'approvisionnement CI
      (supply-chain) : un tag `@v4` est mutable (peut être repointé vers un
      commit différent par le mainteneur de l'action ou un compte compromis),
      contrairement à un SHA de commit qui garantit un contenu figé.
    classe: ci-action-non-epinglee
    gravite: moyenne
    statut: resolu
    critere_de_resolution: >
      Toutes les occurrences de `uses: actions/*@v*` dans
      .github/workflows/*.yml sont remplacées par `uses: actions/*@<sha>`
      (avec le tag en commentaire pour lisibilité, convention GitHub
      standard), et un push déclenche une CI verte sur ce commit.
    detecte_le: "2026-07-30"
    source: >
      Lecture intégrale de .github/workflows/ci.yml (comparaison du
      commentaire MED-1 en tête de fichier avec les `uses:` réels des 6
      jobs) et .github/workflows/backup.yml, plus .github/dependabot.yml
      (confirme que le mécanisme de maintien à jour existe mais ne peut
      pas créer un épinglage qui n'existe pas encore).
    confiance: haute
    note: >
      Risque théorique tant qu'aucun secret de production sensible ne
      transite par ces workflows (SEC-217 : pas de serveur de production
      à ce jour) — mais backup.yml, lui, manipule déjà des secrets SSH
      réels (SSH_PRIVATE_KEY) dans le même fichier non épinglé, ce qui
      élève la gravité au-delà d'un simple TODO cosmétique.
      Corrigé (session du 2026-07-30) : les 3 actions réellement utilisées
      (actions/checkout, actions/setup-node, actions/upload-artifact)
      épinglées par SHA de commit (tag en commentaire) dans ci.yml et
      backup.yml ; commentaire MED-1 en tête de ci.yml remplacé par une
      référence à SEC-023. Commit 0a26794, CI verte confirmée (9/9 checks
      GitHub Actions completed/success — les 6 jobs applicatifs habituels
      + 3 checks Dependabot déclenchés par la modification de
      dependabot.yml/des workflows).

  - id: SEC-024
    titre: >
      backup.yml se connecte en SSH à l'hôte de production avec
      -o StrictHostKeyChecking=no, désactivant toute vérification de la
      clé d'hôte — expose la connexion à une attaque MITM sur le chemin
      SSH vers le serveur de sauvegarde
    perimetre: transverse
    regle_violee: >
      Bonne pratique de sécurité SSH : StrictHostKeyChecking=no accepte
      silencieusement n'importe quelle clé d'hôte présentée à la connexion,
      annulant la protection normale contre un serveur usurpé (MITM) — sans
      vérification, ce runner GitHub Actions éphémère n'a aucun moyen de
      détecter un changement d'hôte malveillant.
    classe: ssh-host-key-non-verifiee
    gravite: moyenne
    statut: ouvert
    critere_de_resolution: >
      L'option -o StrictHostKeyChecking=no est retirée de backup.yml, et la
      clé d'hôte réelle du serveur de production est épinglée (ex. via un
