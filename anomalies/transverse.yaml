    detecte_le: '2026-07-20'
    source: audit_llm
    confiance: certain
    note: |
      Audit performance élargi, item frontend (re-renders/grosses listes). Recherche exhaustive (`Grep "EntityTable"` sur `client/src`) : la seule occurrence hors définition est dans le fichier `EntityTable.tsx` lui-même (sa propre interface/fonction) — aucun import ailleurs dans le dépôt. `useVirtualTable` (`hooks/shared/useVirtualTable.ts`) n'est utilisé que par `EntityTable.tsx` — donc également sans consommateur réel. Recherche complémentaire (`Grep` sur le motif `<TableRow key=` dans `client/src/features`) : 14 fichiers implémentent leur propre rendu de table par `.map()` direct sur `TableRow`, sans virtualisation ni passage par un composant partagé — contrairement au Kanban (TasksKanban/LeadsKanban), où la virtualisation via `@tanstack/react-virtual` est appliquée de façon cohérente au-delà de 40 items (SEC-157 traite d'une lacune de mémoïsation dans ce même patron, pas de son absence). Non mesuré dans cette passe : le nombre de lignes réellement affichées par chacune de ces 14 pages (dépend du pageSize effectif de chacune, déjà couvert en partie par les constats SEC-053/SEC-088/SEC-118/SEC-156 sur les plafonds de pagination) — la gravité `mineur` retenue reflète qu'aucune de ces pages n'a de plafond au-delà de quelques centaines de lignes au pire cas connu à ce jour, donc le coût DOM réel par page reste modéré, mais l'infrastructure de virtualisation existe et n'est simplement jamais utilisée là où elle aurait le plus de valeur.
      BLOQUÉ SUR DÉCISION PORTEUR (session en cours) : reconfirmé par re-lecture — `EntityTable.tsx`/`useVirtualTable.ts` restent sans aucun consommateur, les 14 pages listées restent sur `.map()` direct non virtualisé. Le critère de résolution exige explicitement une décision produit (migrer vs supprimer) que je ne peux pas trancher moi-même sans instruction explicite du porteur (interdiction CLAUDE.md sur les décisions inférées) — passé en `en_cours` plutôt que laissé `ouvert` par défaut d'investigation, pour distinguer "pas encore regardé" de "regardé, bloqué sur un choix qui n'est pas le mien à faire".
      RÉSOLU (session du 2026-07-22) : le porteur a d'abord choisi de migrer DocumentsPage/InvoicesPage/LeadsPage vers `EntityTable`. Avant d'implémenter, vérification du prémisse : les 3 pages utilisent toutes `useListParams(10)` + `DataTablePagination` — pagination SERVEUR à 10 lignes par page, jamais de liste non bornée rendue côté client. La virtualisation résout un problème (des milliers de nœuds DOM simultanés) qui ne se pose sur aucune des 3 pages proposées : migrer aurait remplacé du code simple et fonctionnel par une abstraction plus complexe sans gain de performance réel. Remonté au porteur, qui a alors choisi l'option suppression plutôt que de forcer une migration sans bénéfice. `EntityTable.tsx` et `useVirtualTable.ts` supprimés ; par la même occasion, `EmptyState.tsx`/`LoadingState.tsx` (dans le même dossier `crud/`) n'avaient eux-mêmes plus aucun consommateur une fois `EntityTable.tsx` retiré (vérifié par grep sur tout `client/src` avant suppression) — supprimés aussi plutôt que de laisser un nouveau petit îlot de code mort à côté. `@tanstack/react-virtual` (la dépendance elle-même) reste utilisée ailleurs (TasksKanban, LeadsKanban, TasksListView) — non touchée. `npx tsc --noEmit`, `npm run lint --workspace=client` (12 warnings, tous déjà dans l'exception documentée du même fichier — aucun nouveau) et la suite de tests client (117/117) restent verts après suppression. Les 14 pages listées dans le titre restent donc sur leur propre `.map()` direct — confirmé non problématique tant qu'elles restent paginées côté serveur à un plafond raisonnable (couvert par SEC-053/SEC-088/SEC-118/SEC-156).
      CHAMP `statut` CORRIGÉ (session du 2026-07-23, audit CI) : confirmé par recherche directe (`EntityTable.tsx`/ `useVirtualTable.ts` introuvables dans `client/src`) que la suppression décrite ci-dessus est bien effective — le champ `statut` était resté `en_cours` malgré une note qui concluait déjà « RÉSOLU », incohérence de champ. `resolu`.
