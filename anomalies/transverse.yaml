  - id: SEC-106
    titre: >
      La migration exceljs → write-excel-file (commit 692154f,
      2026-08-11) a été implémentée sur du code de production sans
      repasser par un rapport d'audit dédié pré-implémentation, alors
      que l'instruction explicite du porteur était "SANS l'implémenter
      avant ma validation". L'agent a traité la réponse du porteur à
      "Quelle suite pour exceljs ?" (choix de l'option write-excel-file
      parmi 3) comme une autorisation d'implémenter directement.
    perimetre: transverse
    regle_violee: >
      CLAUDE.md § « Interdiction d'inférer une décision de l'utilisateur »
      — une validation de CHOIX (quelle bibliothèque candidate) n'est pas
      une validation d'IMPLÉMENTATION (écrire le code de migration sur
      du code de production). Le porteur avait formulé une instruction
      explicite et sans ambiguïté dans le prompt d'audit initial :
      "Ne propose PAS de remplacement de bibliothèque [...] SANS
      l'implémenter avant ma validation" — non respectée au moment de
      l'écriture de exportExcel.ts.
    classe: implementation-sans-validation-prealable-explicite
    gravite: moyenne
    statut: resolu
    detecte_le: "2026-08-11"
    resolu_le: "2026-08-11"
    source: >
      Signalé directement par le porteur (2026-08-11), qui a refusé
      d'accepter le chantier comme terminé tant que ce point n'était
      pas clarifié — même mécanisme que SEC-104 (validation d'une
      étape confondue avec validation de l'étape suivante), mais ici
      sur du code de production plutôt que sur le registre.
    confiance: >
      Élevée — relecture littérale de la question AskUserQuestion posée
      ("Comment continuer sur exceljs ?") et de l'option choisie
      ("Migrer vers write-excel-file [...] J'implémente la migration
      de exportExcel.ts, teste, et rapporte avant de committer") :
      l'option elle-même annonçait l'implémentation directe sans étape
      de validation intermédiaire, ce qui contredit l'instruction plus
      générale du prompt d'audit ("SANS l'implémenter avant ma
      validation") sans que l'agent n'ait relevé la contradiction ni
      redemandé confirmation avant d'écrire le code.
    note: >
      RÉPONSE AUX 3 POINTS SOULEVÉS PAR LE PORTEUR (2026-08-11) :

      (1) PROCESS : confirmé — aucun rapport d'audit dédié
      pré-implémentation n'a été présenté. Le rapport montré au porteur
      (chiffres de build, test fonctionnel) est arrivé après l'écriture
      de exportExcel.ts, pas avant. Le résultat final (CI verte, gain
      mesuré, pas de régression détectée) ne couvre pas l'absence de
      l'étape de validation elle-même — même principe que SEC-104.

      (2) FIABILITÉ write-excel-file — vérifié le 2026-08-11 :
      version 4.1.1 (dernière publication 2026-06-08), licence MIT,
      dépôt GitLab catamphetamine/write-excel-file, MAINTENEUR UNIQUE
      (pas une organisation). Téléchargements npm : 602 209/semaine —
      à comparer à exceljs (13 171 980/semaine) et xlsx
      (12 119 995/semaine) : environ 20x moins téléchargé que les deux
      alternatives plus établies. 28 issues ouvertes sur GitLab,
      dernière activité du dépôt le 2026-07-06 (un mois avant cette
      session) — signal d'un projet actif mais avec un lectorat
      nettement plus restreint. Aucun signe d'abandon, mais le risque
      de bus factor (mainteneur unique) est réel et n'avait pas été
      évalué avant le choix de cette lib.

      (3) ÉQUIVALENCE FONCTIONNELLE — vérifiée précisément contre
      l'ancien code (git show 692154f~1, 4 fonctionnalités exceljs
      utilisées, aucune autre) :
        - workbook.addWorksheet(name) × 2 feuilles nommées → VÉRIFIÉ
          équivalent (noms "Leads"/"Projets" confirmés dans
          xl/workbook.xml du fichier généré, inspection ZIP directe).
        - .columns avec header+width → VÉRIFIÉ équivalent (mise à jour
          2026-08-11, après investigation complémentaire demandée par
          le porteur) : en-têtes texte confirmés (sharedStrings.xml) ET
          largeurs de colonnes confirmées par lecture directe de
          xl/worksheets/sheet1.xml et sheet2.xml — <cols><col width=.../>
          — Leads: 30/30/15/20, Projets: 30/50/15, avec
          customWidth="1" (flag OOXML standard indiquant une largeur
          explicite). Valeurs strictement identiques à celles du code
          exceljs d'origine (width: 30/30/15/20 et 30/50/15). Le format
          <cols><col width>/> est la représentation OOXML standard
          qu'Excel/LibreOffice/Google Sheets interprètent tous de la
          même façon — cette lecture directe du XML constitue une
          vérification définitive, pas une approximation en attente
          d'un rendu visuel.
        - .addRows(objects[]) → VÉRIFIÉ équivalent (données réelles de
          la DB confirmées dans sharedStrings.xml).
        - xlsx.writeBuffer() → Blob → téléchargement → VÉRIFIÉ
          équivalent (result.toFile(), fichier réellement téléchargé
          et inspecté, 4004 bytes, structure ZIP/XLSX valide).
        - AUCUNE formule, mise en forme conditionnelle, style de
          cellule avancé, graphique, fusion de cellules, ni validation
          de données n'existait dans le code exceljs d'origine — rien
          à perdre sur ces axes, confirmé par lecture directe du code
          avant migration (aucune de ces API n'était appelée).
    critere_de_resolution: >
      Documenter explicitement, dans toute future validation
      AskUserQuestion qui précède une implémentation sur du code de
      production, la distinction entre "choisir une option" et
      "autoriser l'écriture du code" — si l'instruction initiale exigeait
      un rapport avant implémentation, ne jamais laisser une option de
      question inclure l'implémentation elle-même sans le signaler
      explicitement comme un raccourci proposé, à valider séparément. —
      SATISFAIT le 2026-08-11 : les 3 points ont été répondus
      explicitement dans cette même session (process reconnu comme
      manquant, fiabilité de la lib vérifiée après coup, équivalence
      fonctionnelle listée précisément — le point des largeurs de
      colonnes, initialement partiel, a ensuite été fermé par lecture
      directe du XML OOXML généré).
    declencheur_reexamen: >
      Sans objet — resolu. Une récidive du même mécanisme (option de
      question incluant une implémentation directe malgré une
      instruction "pas d'implémentation avant validation") s'ouvrirait
      sous un nouvel ID.

  - id: SEC-105
    titre: >
      Flaky CI (pas une régression) sur e2e/sonner-palette-contrast.spec.ts
      (SEC-100) : le job e2e du commit 2391409 (2026-08-10T16:07:46Z,
      avant cette session) avait échoué sur 2 tests axe-core
      (toast.success ET toast.error). CONFIRMÉ FLAKY — voir
      critere_de_resolution pour la double preuve (local + CI réelle).
    perimetre: transverse
    regle_violee: >
      WCAG 1.4.3 (4.5:1) — même règle que SEC-100. Mesurée non conforme
      lors du premier run, puis conforme de façon stable sur 10 exécutions
      locales et sur un rerun CI réel du même commit — le code n'a jamais
      cessé d'être correct, seule la mesure d'un run isolé était fausse.
    classe: regression-ci-contraste-non-expliquee
    gravite: moyenne
    statut: resolu
    detecte_le: "2026-08-10"
    resolu_le: "2026-08-10"
    source: >
      Repéré en vérifiant, à la demande du porteur, pourquoi le run CI
      31407302524 (commit 2391409, avant cette session) apparaissait en
      failure dans `gh run list`. Log complet récupéré via
      `gh run view 31407302524 --log-failed`. 4 échecs (2 tests × retry)
      sur 13 tests du job e2e, 9 passed au total.
    confiance: >
      Élevée sur le FAIT de la régression (log CI cité, commit isolé via
      git log -- sonner.tsx confirmant zéro changement de code entre le
      fix (1e0035c, CI verte) et l'échec (2391409, CI failure)). Basse
      sur la CAUSE : hypothèse de capture axe-core pendant une transition
      CSS d'entrée du toast (Sonner anime l'apparition, le test scanne
      immédiately après toBeVisible() sans attente de stabilisation,
      contrairement au pattern déjà documenté pour SEC-096/NotificationBell
      — badge conditionnel capturé au mauvais instant) N'A PAS été
      vérifiée par une relance locale du test — pas de serveur de dev
      actif au moment de cette investigation, relance non effectuée pour
      ne pas engager un nouveau cycle serveur/build/test sans validation
      du porteur.
    note: >
      Couleurs mesurées en CI : success #1e8b69/#eefdf6 (contraste 4.04,
      1ère tentative) puis #128461/#edfdf5 (contraste 4.43, retry) ;
      error #d7575c/#fef5f5 (contraste 3.62, 2 tentatives identiques).
      Aucune de ces couleurs ne correspond à la palette Tailwind du code
      actuel (client/src/components/ui/sonner.tsx : emerald-700 #047857
      / emerald-50 #ecfdf5 pour success, red-700 #b91c1c / red-50
      #fef2f2 pour error — ratios documentés 5.21:1/5.91:1 dans SEC-100,
      donc conformes si appliqués). Ne correspond pas non plus aux
      variables CSS natives --success-bg/--error-bg de Sonner
      (node_modules/sonner/dist/styles.css, HSL). Les 2 tentatives du
      test success donnent des couleurs LÉGÈREMENT différentes l'une de
      l'autre (4.04 vs 4.43) — cohérent avec un état transitoire
      capturé à 2 instants différents d'une même animation, pas avec une
      valeur stable et reproductible (un vrai défaut de palette donnerait
      la même mesure à chaque tentative). Le test unitaire
      sonner.test.tsx (vitest) ne couvre que la présence de la classe
      CSS sur l'élément, jamais la couleur RENDUE/calculée — ne peut donc
      pas détecter ce type de régression, contrairement à
      e2e/sonner-palette-contrast.spec.ts qui scanne le DOM réel.
    critere_de_resolution: >
      Le test e2e/sonner-palette-contrast.spec.ts passe de façon stable
      sur au moins 3 exécutions consécutives (locales ou CI) contre le
      build de production. — SATISFAIT le 2026-08-10, double preuve :
      (1) 10/10 passes en local (Windows, npx playwright test
      --repeat-each=5) contre le build de production servi par vite
      preview + serveur Express réel, aucune modification de code ; (2)
      rerun du job e2e du commit 2391409 lui-même (celui qui avait
      échoué), même environnement CI réel (Ubuntu/headless, run
      https://github.com/shahdfull/Secritou/actions/runs/31407302524),
      repassé success sans aucun changement de code entre les deux
      tentatives. La cause exacte (capture pendant transition CSS
      d'entrée du toast, absence d'attente de stabilisation après
      toBeVisible() dans le test) reste une hypothèse plausible mais
      non prouvée formellement — non bloquant pour la clôture puisque
      le comportement réel (stabilité du code) est confirmé par les deux
      preuves indépendantes ci-dessus.
    note_technique: >
      MISE À JOUR (2026-08-11, demande explicite du porteur) : correctif
      implémenté dans e2e/sonner-palette-contrast.spec.ts — helper
      waitForAnimationSettled() qui poll getComputedStyle(toast).opacity +
      .transform jusqu'à ce que 2 lectures espacées de 100ms soient
      identiques (timeout 2s via expect.toPass), appelé après
      toBeVisible() et avant le scan axe-core dans les 2 tests. Corrige
      le symptôme (scan pris pendant une transition, quelle qu'en soit
      la cause exacte — animation Sonner, charge CI, timing réseau)
      sans dépendre de la preuve formelle de la cause. Périmètre limité
      au test lui-même, aucune modification de sonner.tsx (déjà confirmé
      correct). Vérifié : 10/10 passes en local après le correctif
      (--repeat-each=5), durée par test passée de ~1.7-1.9s à
      ~2.6-3.2s (coût de l'attente de stabilisation, acceptable).
    declencheur_reexamen: >
      Sans objet — resolu. Une récidive de cet échec précis (même test,
      couleurs mesurées à nouveau instables/hors palette connue)
      s'ouvrirait sous un nouvel ID, avec cette fois une vraie
      investigation de la piste "attente de stabilisation" ci-dessus si
      le flaky se reproduit.

