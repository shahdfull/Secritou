      14 champs distincts à travers Lead/Client/Document/Invoice/
      CreditNote/Project/Proposal/Task/User.
    confiance: haute
    note: >
      Aucun risque de sécurité direct (pas d'injection, Prisma paramétrise
      systématiquement — confirmé par un test séparé avec un nom contenant
      un payload SQL littéral, stocké tel quel sans effet). Impact
      purement fonctionnel/UX : des enregistrements "vides" mais valides
      selon le serveur, qui cassent silencieusement l'affichage et la
      recherche côté utilisateur final. Le cas Project.name n'a pas pu
