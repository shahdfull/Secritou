    detecte_le: '2026-07-22'
    source: manuel
    confiance: certain
    note: |
      Découvert en investiguant l'échec du job "server" sur le premier run CI déclenché après réactivation des triggers push/pull_request (commit 998af57, SEC-010). Reproduit localement avec une vraie shadow database (`postgresql://secritou:secritou@localhost:5434/ secritou_shadow_test`, créée puis supprimée pour ce test) : le diff rapporte `[+] Added unique index on columns (projectId, invoiceType)` sur `Invoice` et `[+] Added unique index on columns (leadId)` sur `Proposal`, alors que les deux existent réellement en base. Cause confirmée par lecture directe des migrations : `20260713120000_invoice_partial_unique/migration.sql` documente explicitement « Partial indexes cannot be expressed in the Prisma schema language, so this index is intentionally declared only here » (l'ancien index total de `20260711183136_sync_schema_drift` a été remplacé par un partiel excluant `invoiceType = 'STANDARD'`, pour ne pas plafonner les factures STANDARD à une seule par projet) ; `20260625160000_add_lead_id_to_proposal/migration.sql` crée `Proposal_leadId_key` en `CREATE UNIQUE INDEX ... WHERE "leadId" IS NOT NULL`, confirmé par un commentaire similaire dans `20260711183136_sync_schema_drift/migration.sql:35`. Aucun des deux contextes n'est visible depuis `schema.prisma` seul — seul le commentaire du fichier de migration l'explique, jamais lu par quelqu'un qui audite uniquement le schéma. Non causé par cette session : les deux migrations datent du 2026-06-25 et du 2026-07-13, bien avant la réactivation du trigger CI qui a permis de le découvrir — SEC-010 (CI restée en `workflow_dispatch` seul depuis le 2026-07-17 jusqu'à cette session) explique pourquoi ce défaut de pipeline n'avait jamais été vu vert ou rouge par une exécution automatique jusqu'ici. Décision explicite du porteur (AskUserQuestion, session du 2026-07-22) : enregistrer sans toucher à `ci.yml` ni au schéma pour l'instant — le job "server" reste donc rouge sur cette étape précise tant qu'une décision de traitement n'est pas prise séparément.
      CORRECTIF ÉCRIT (même session, second passage sur le job "server" en échec) : le premier symptôme observé n'était pas SEC-193 directement — le step "Schema drift check" échouait AVANT d'atteindre le vrai diff (« You must pass the --shadow-database-url » : le job "server" ne déclarait aucun service Postgres ni shadow database, malgré `DATABASE_URL` déjà défini comme si un service existait — bug de configuration CI distinct, corrigé séparément). Une fois ce bug de config corrigé (service `postgres` ajouté au job, étape "Apply migrations", base `secritou_shadow` dédiée créée avant le diff), le job retombe bien sur le vrai SEC-193. Décision du porteur (AskUserQuestion, second passage, même session) : documenter les 2 index dans `schema.prisma` (commentaire explicite sur `Invoice.@@unique([projectId, invoiceType])` et `Proposal.leadId`) et adapter le step CI pour tolérer SPÉCIFIQUEMENT ces 2 lignes de diff connues (capture texte filtrée, pas `--exit-code` brut) — toute autre ligne de diff continue de faire échouer l'étape. Vérifié localement dans les deux sens avant de committer : le filtre laisse passer les 2 index partiels connus ET détecte un drift injecté artificiellement sur un champ sans rapport (`Task.fakeDriftTestField`, ajouté puis retiré pour ce seul test, jamais commité). `resolu` NON déclaré : le correctif est commité localement mais pas encore vu vert par la CI elle-même sur ce commit précis. Reste `en_cours` jusqu'à confirmation du run CI réel.
      RÉSOLU (session du 2026-07-23, audit CI SEC-212) : confirmé par lecture directe que `ci.yml` (lignes 133-151) et `schema.prisma` (commentaires SEC-193 sur `Invoice`/`Proposal`) portent toujours exactement le correctif décrit ci-dessus. Commits `4a068bf`/ `9a41073` (le correctif) sont des ancêtres directs de `fea20ac`, confirmé vert (job `server`, qui exécute cette étape "Schema drift check" avant `test:coverage` dans le même job — donc déjà passée avec succès) à de nombreuses reprises dans cette même session. `resolu`.
  - id: SEC-194
    titre: 'npm run test:coverage --workspace=server (job "server" de ci.yml) n''a probablement jamais pu réussir depuis son introduction : (1) le binaire c8 qu''il appelle en dur n''était déclaré nulle part dans server/package.json (ni dependencies ni devDependencies), échec immédiat "c8: not found" sur toute installation fraîche (npm ci) ; (2) une fois c8 installé, la couverture réelle mesurée (64.46% lignes/statements, 72.59% branches, 42.91% fonctions) est très en dessous des seuils exigés par le script (85/80/85/85), jamais atteints'
    perimetre: server/package.json (script test:coverage, devDependencies) ; .github/workflows/ci.yml (job server)
    regle_violee: null
    classe: null
    gravite: majeur
    statut: resolu
    critere_de_resolution: |
      C'est résolu quand `npm run test:coverage --workspace=server` sort avec le code 0 sur une installation fraîche (`npm ci` puis la commande, sans installation manuelle préalable de `c8`) — vérifié localement puis confirmé par un run CI vert sur le job "server".
    detecte_le: '2026-07-22'
    source: manuel
    confiance: certain
    note: |
      Découvert en poursuivant l'investigation du job "server" après la correction du "Schema drift check" (SEC-193) : le step suivant du pipeline (`npm run test:coverage --workspace=server`) échouait avec `sh: 1: c8: not found`, exit code 127. Confirmé par lecture directe : `grep -n '"c8"' server/package.json` ne retourne rien avant cette session — le script `test:coverage` (`server/package.json:15`) appelle `c8` directement (pas `npx c8`), donc rien ne l'installe automatiquement sur un `npm ci` frais, contrairement à l'exécution locale habituelle où `npx` masque l'absence en téléchargeant le binaire à la volée à chaque appel (confirmé : `which c8` ne retrouve rien non plus sur la machine de développement). `git log -p -- package.json` ne montre qu'un seul commit d'introduction de ce script, jamais modifié depuis — cohérent avec le fait que SEC-010 (CI restée en `workflow_dispatch` seul depuis le 2026-07-17) a empêché toute exécution automatique de ce step avant cette session.
      RÉSOLU (session en cours), en deux volets, décision explicite du porteur (AskUserQuestion) pour chacun : 1) `npm install --save-dev c8` exécuté dans `server/` — `c8` ajouté à `server/package.json#devDependencies` (`package-lock.json` régénéré en conséquence). Débloque l'échec immédiat. 2) Une fois `c8` installé, la couverture réelle mesurée (`npx c8 --reporter=text-summary node --test --import tsx test/run-all.test.ts`, 520/520 tests verts) : Statements 64.46% (18584/28830), Branches 72.59% (1187/1635), Functions 42.91% (427/995), Lines 64.46% (18584/28830) — très en dessous des seuils exigés (85/80/85/85), jamais configurés avec un `.c8rc.json` pour exclure les fichiers non pertinents (ex. point d'entrée, certains contrôleurs jamais exercés par les tests unitaires) — non investigué plus avant dans cette session si une exclusion aurait pu relever ces chiffres sans écrire de nouveaux tests. Décision du porteur (AskUserQuestion) : baisser les seuils au niveau réel mesuré, avec marge de sécurité (`--statements 60 --branches 70 --functions 40 --lines 60`, chacun arrondi sous la valeur mesurée pour absorber la variance normale entre runs) plutôt que d'exiger une remontée de couverture non demandée. Vérifié : `npm run test:coverage --workspace=server` sort désormais avec le code 0 en local. Ne PAS relever ces seuils sans nouvelle instruction — ce ne sont pas des seuils de qualité arbitrés, seulement un plancher reflétant l'état réel du dépôt au 2026-07-22, choisis pour ne plus jamais faire échouer silencieusement `test:coverage` sur un défaut de configuration plutôt que sur une vraie régression de couverture. `en_cours` (pas `resolu`) : le critère local passe, mais la CI n'a pas encore confirmé ce commit précis — conformément à la règle du dépôt.
      RÉSOLU (session du 2026-07-23, audit CI SEC-212) : `c8` et les seuils `60/70/40/60` toujours en place (`server/package.json`, relu directement), inchangés depuis. Job `server` de la CI observé vert à plusieurs reprises dans cette même session (commits `fea20ac`, `2d1c4eb`, `0627ac0` — rapportés directement par le porteur après chaque push), chacun exécutant précisément `npm run test:coverage --workspace=server` sur une installation `npm ci` fraîche du runner GitHub Actions. Critère satisfait. `resolu`.
  - id: SEC-204
    titre: '3 lacunes d''accessibilité sur des composants transverses à fort réemploi : SortableTableHead.tsx (colonne triable de toutes les listes, LeadsPage + TasksListView) rendait le tri sur un <div onClick> sans role/tabIndex/gestionnaire clavier ni nom accessible ; SearchInput.tsx (5 réemplois) et le champ de recherche globale GlobalSearch.tsx (présent sur chaque page via le header) n''exposaient qu''un placeholder comme seul indice, jamais lu de façon fiable par tous les lecteurs d''écran et disparaissant dès qu''une valeur est saisie'
    perimetre: client/src/components/common/SortableTableHead.tsx ; client/src/components/shared/crud/SearchInput.tsx ; client/src/components/common/GlobalSearch.tsx
    regle_violee: null
    classe: composant_transverse_accessibilite_manquante
    gravite: mineur
    statut: resolu
    critere_de_resolution: |
      C'est résolu quand un utilisateur clavier seul peut activer le tri d'une colonne (Tab puis Entrée/Espace) et entendre son état (triée/non triée, ordre) via un lecteur d'écran, et quand chaque champ de recherche transverse porte un nom accessible qui survit à la saisie — vérifié par un test qui interroge réellement le DOM rendu par ces composants partagés (role="button"/aria-sort sur l'en-tête triable, aria-label sur les champs de recherche), pas par une relecture visuelle seule.
    detecte_le: '2026-07-22'
    source: manuel
    confiance: certain
    note: |
      Demande explicite du porteur : ajouter des `aria-label` sur les composants transverses à fort réemploi plutôt que fichier par fichier, pour que le gain se propage à toutes les pages consommatrices. Revue ciblée des composants partagés à plus haut réemploi (`client/src/components/ui/`, `client/src/components/ common/`, `client/src/components/shared/crud/`) : `Button`, `Dialog`, `ConfirmDeleteDialog` (9 réemplois), `DetailDrawer` (4 réemplois), `DataTablePagination`, `NotificationBell`, le menu compte/paramètres d'`AdminLayout` étaient déjà correctement labellisés (texte visible sur les boutons, ou `aria-label`/ `DialogTitle`+`DialogDescription` déjà en place) — vérifiés sans constat. `EntityToolbar.tsx`, `EntityDialog.tsx`, `FilterBar.tsx`, `PageHeader.tsx` : 0 réemploi réel (code mort, non traité ici, hors périmètre de la demande qui porte sur des composants réellement consommés).
      3 lacunes réelles corrigées : (1) `SortableTableHead.tsx` — le contrôle de tri était un `<div onClick>` sans aucune sémantique interactive ; remplacé par un vrai `<button type="button">` avec `aria-label` décrivant la colonne et l'état de tri courant, et `aria-sort` posé sur le `<TableHead>` parent (`ascending`/ `descending`/`none`) — corrige à la fois le clavier (Tab/Entrée fonctionnent nativement sur un `<button>`) et le lecteur d'écran pour LeadsPage ET TasksListView simultanément, un seul fichier touché. (2) `SearchInput.tsx` — ajout de `aria-label={placeholder}` en repli, actif pour ses 5 réemplois sans qu'aucun appelant n'ait à changer son code. (3) `GlobalSearch.tsx` (recherche globale du header, présente sur toutes les pages authentifiées) — même correctif, `aria-label={t("search.placeholder")}` sur le champ. `Table`/`TableHead` génériques (`ui/table.tsx`) volontairement NON modifiés : un `<table>` sans `aria-label` mais avec de vrais `<th scope="col">` textuels reste navigable de façon significative par un lecteur d'écran (lacune mineure, pas cassée) ; comme le composant sert des données différentes sur 14+ pages, lui imposer un `aria-label` générique (« tableau de données ») aurait été moins utile qu'un attribut natif déjà transmis via `...props` pour l'appelant qui veut en poser un — pas de changement nécessaire, la capacité existe déjà. `npx tsc --noEmit` (client) et `npm run lint --workspace=client` (12 warnings, tous déjà dans l'exception documentée du même fichier — aucun nouveau) verts ; suite de tests client 117/117 après le changement de structure DOM de `SortableTableHead` (div -> button).
      Étendu (même session, demande explicite du porteur) : revue systématique du même motif clavier (`role="button"`/`onKeyDown`/ `tabIndex` manquants sur un élément non nativement interactif) sur TOUT `client/src/components/ui/`, `client/src/components/ common/` et `client/src/components/shared/crud/` — pas seulement les composants déjà touchés pour l'`aria-label`. Repéré tout `onClick` posé sur un élément non-`<button>` dans ces trois dossiers (`SkillTagInput.tsx`, `password-input.tsx`, `GlobalSearch.tsx`, `sidebar.tsx` `SidebarTrigger`/`SidebarRail`, `DataTablePagination.tsx`, `FileUploadField.tsx`, `GlobalErrorBoundary.tsx`, `RouteBoundary.tsx`, `SortableTableHead.tsx`) et vérifié chacun individuellement : `SortableTableHead.tsx` était la SEULE occurrence réelle du défaut dans cet ensemble (déjà corrigée ci-dessus). Tous les autres `onClick` recensés sont soit déjà posés sur un vrai `<button>` nativement accessible au clavier (`password-input.tsx`, `DataTablePagination.tsx`, `FileUploadField.tsx`, `GlobalErrorBoundary.tsx`, `RouteBoundary.tsx`, `SidebarTrigger`), soit un wrapper `<div onClick>` autour d'un `<input>` déjà focusable nativement où le clic ne fait que reporter le focus sur l'élément déjà interactif (`GlobalSearch.tsx` ligne 101, `SkillTagInput.tsx` ligne 61-64 — Tab atteint directement le vrai champ, le div n'est pas un contrôle indépendant), soit un composant Radix (`accordion`, `select`, `tabs`, `radio-group`, `switch`, `checkbox`, `navigation-menu`) dont le primitive garantit déjà `role`/`tabIndex`/gestion clavier complète en interne — vérifiés sans constat. `SidebarRail` pose délibérément `tabIndex={-1}` (affichage souris-seul de redimensionnement, `SidebarTrigger` sert d'équivalent clavier) — comportement voulu, pas un oubli. Aucun changement de code supplémentaire nécessaire pour ce volet : la lacune identifiée par le porteur n'avait qu'une seule occurrence réelle dans les composants transverses, déjà traitée.
      TESTS AJOUTÉS, CORRECTIF POUSSÉ EN ATTENTE DE CI (2026-07-23) : le correctif de code (commit 2884074, déjà sur main) n'avait aucune preuve `verifie: test` — le critère de résolution exige explicitement un test qui interroge le DOM réel. Ajouté : `client/src/components/ common/SortableTableHead.test.tsx` (rend le composant réel dans un `<table>`, vérifie `getByRole("button", { name })`, `aria-sort` sur le `<th>` parent dans les deux états triée/non-triée, et l'activation clavier Tab+Entrée réelle via `@testing-library/ user-event`) ; `client/src/components/shared/crud/ SearchInput.test.tsx` (vérifie `getByRole("searchbox", { name })` avant ET après saisie d'une valeur, pour couvrir précisément le défaut d'origine — un placeholder qui disparaît à la saisie) ; `client/src/components/common/GlobalSearch.test.tsx` (même vérification sur le composant réel, réseau mocké via `@/api/search.api`, pas la logique du composant). Les 3 fichiers importent et rendent les composants réels (`render` de `@testing-library/react`), pas une réimplémentation. `npx vitest run` sur les 3 fichiers : 6/6 verts en local. Suite complète client (`npm run test --workspace=client`) : 125/125 vertes en local (vs 117/118 avant, +7/8 issus de cette session — SEC-171/SEC-176 et SEC-204 combinés). `npm run typecheck`/`npm run lint --workspace= client` verts (12 warnings, tous déjà dans l'exception documentée, aucun nouveau).
      RÉSOLU (2026-07-23) : run CI confirmé vert par l'utilisateur (« its green ») sur le commit `f51e7a0`. `git merge-base --is-ancestor fd0dc84 f51e7a0` confirme que le commit portant ces tests (`fd0dc84`) est bien un ancêtre de ce commit vert.
  - id: SEC-206
    titre: '3 tokens du design system échouaient WCAG AA une fois réellement mesurés (conversion oklch -> sRGB puis ratio de contraste) : --border/--input quasi invisibles (~1.2-1.3:1 au lieu de 3:1 requis pour une limite non-texte, clair ET sombre) sur les champs de formulaire ; --accent-foreground réutilisé tel quel sur le badge bg-accent-soft en mode sombre alors qu''il est conçu pour du texte sombre sur --accent (encore clair en mode sombre), donnant 1.28:1 au lieu de 4.5:1 sur 8 fichiers de badges de statut'
    perimetre: client/src/styles.css (--border, --input, --accent-foreground/--accent-soft) ; 8 fichiers consommateurs du badge accent-soft (ApprovalsPage.tsx, ProposalsClientPage.tsx, CommissionsPage.tsx, DashboardCharts.tsx, DashboardPage.tsx, InvoicesPage.tsx ×2, ProposalsPage.tsx, ProductDashboard.tsx)
    regle_violee: null
    classe: null
    gravite: majeur
    statut: resolu
    critere_de_resolution: |
      C'est résolu quand tous les tokens de couleur du design system (client/src/styles.css, modes clair ET sombre) satisfont WCAG 2.1 AA (4.5:1 texte normal, 3:1 texte large/UI non-texte) sur chaque paire fond/premier-plan réellement consommée par un composant du dépôt — vérifié par un script qui convertit chaque token oklch() en sRGB, calcule le ratio de contraste réel (pas une estimation visuelle), et échoue si une seule paire est sous le seuil requis ; ce script tourne en CI sur chaque push/PR (aucune régression future ne peut être mergée sans être détectée).
    detecte_le: '2026-07-22'
    source: manuel
    confiance: certain
    note: |
      Demande explicite du porteur : passer les tokens du design system dans un vérificateur de contraste WCAG AA, faisable en dev sans donnée de production. Nouveau script autonome `scripts/check-contrast.mjs` (sans nouvelle dépendance npm, décision explicite du porteur) : parse `:root`/`html.dark` dans styles.css, convertit chaque `oklch(L C H)` en sRGB via les matrices standard OKLab -> linear-sRGB (formules CSS Color 4 / Björn Ottosson), calcule la luminance relative et le ratio WCAG réels — conversion vérifiée par sanity-check (oklch(1 0 0) -> blanc pur, oklch(0 0 0) -> noir pur). 18 paires par mode (36 au total) construites à partir des combinaisons fond/premier-plan RÉELLEMENT utilisées par les composants (grep sur `client/src/components/ui` et `client/src/ features`), pas un produit cartésien de tous les tokens.
      3 échecs réels confirmés (valeurs hex calculées pour élimination du doute) : (1) `--border`/`--input` clair (`#e3ddd8`/`#eae3de` sur fond `#fdfbfa`) et sombre : ~1.2-1.3:1, un liseré de champ de formulaire quasi invisible, très en dessous du minimum non-texte 3:1 (WCAG 1.4.11) — corrigé en assombrissant `--border`/`--input` clair de L=0.9/0.92 à L=0.66, et en éclaircissant leurs équivalents sombres de L=0.22/0.2 à L=0.47, jusqu'à 3.0:1 exact dans les deux modes. (2) `primary` sur `primary-soft` (paire testée initialement) : 3.72:1 en texte — mais vérification des consommateurs réels (`grep` sur `text-primary.*bg-primary-soft`) montre que TOUS les badges de statut utilisent déjà `primary-strong` (créé lors d'un audit a11y antérieur, cf. commentaire déjà présent dans styles.css) ; seul un icône décoratif (ContactPage.tsx:332) utilise `text-primary`/`bg-primary-soft`, contenu non-texte sous le seuil 3:1 qu'il satisfait déjà — pas un constat réel, le script corrigé pour tester `primary-strong` (la vraie paire texte) au lieu de `primary`. (3) `--accent-foreground` sombre (`#050302`) sur `--accent-soft` sombre (`#2f1c19`) : 1.28:1 — bug de réutilisation croisée claire/sombre du même token : `--accent-foreground` est conçu comme texte sombre pour `--accent` (qui reste clair en mode sombre, `oklch(0.75 0.06 30)`) et fonctionne très bien pour cet usage (grep confirme des dizaines d'usages réels dans les menus/ dropdowns/calendrier), mais les 8 fichiers de badges de statut l'utilisaient AUSSI sur `--accent-soft`, qui lui devient une teinte sombre en mode sombre — la même paire qui marche en mode clair s'effondre en mode sombre. Corrigé en créant un nouveau token `--accent-strong` (miroir exact de `--primary-strong`, même convention déjà établie dans ce dépôt), calculé séparément pour chaque mode (clair : `oklch(0.5 0.048 30)`, 4.95:1 ; sombre : `oklch(0.88 0.06 30)`, 11.02:1), et migré les 8 fichiers consommant la paire `bg-accent-soft`+`text-accent-foreground` vers `text-accent-strong` — `--accent-foreground` lui-même non modifié (aurait cassé ses dizaines d'usages réels et corrects sur `--accent`).
      Script câblé en CI (`.github/workflows/ci.yml`, nouveau job `contrast-check`, même structure que `i18n-check`) — non contournable pour une future régression de token. `npx tsc --noEmit`, `npm run lint --workspace=client` (12 warnings, exception déjà documentée, aucun nouveau) et la suite de tests client complète (119/119) verts après les changements de tokens et de classes Tailwind. Statut `en_cours` : correctifs non encore committés.
      RÉSOLU (session du 2026-07-23, audit CI) : correctifs déjà committés (`7b3d120`), fichiers propres. Revérifié directement : `node scripts/check-contrast.mjs` exécuté localement (aucune dépendance DB/Docker pour ce script) — 36/36 paires passent WCAG AA dans les deux modes (valeurs mesurées identiques à celles documentées : `border`/`input` à 3.00-3.03:1, `accent-strong` sur `accent-soft` à 4.95:1 clair / 11.02:1 sombre). Grep confirmé : zéro occurrence restante de `text-accent-foreground` combiné à `bg-accent-soft` dans `client/src` ; `text-accent-strong` utilisé dans exactement les 8 fichiers nommés par le périmètre. `npm run typecheck`/`npm run lint --workspace=client` (12 warnings, exception documentée, 0 erreur) revérifiés propres. Suite de tests client relancée : 1 échec en premier passage (`ContactPage.test.tsx`, timeout 5000ms) — reproduit hors du run complet, en isolation : 5/5 verts — confirmé flake de charge machine (nombreuses exécutions concurrentes dans cette session), sans rapport avec SEC-206, pas une régression réelle. Job `contrast-check` de la CI observé vert dans les runs récents de cette session (aucune dépendance DB, ne peut échouer que sur le script lui-même, déjà revérifié vert en local). `resolu`.
