  - id: SEC-212
    titre: Les jobs `server` et `e2e` de .github/workflows/ci.yml échouent de façon récurrente (au moins les 10 derniers runs sur main, du 2026-07-17 au 2026-07-22) sur des symptômes de lenteur/indisponibilité transitoire des conteneurs de service Postgres/Redis en CI — un ConnectionTimeoutError Redis explicite fait chuter la couverture de code sous les seuils (test:coverage) en faisant sauter un grand nombre de tests dépendants de la DB via leur garde dbAvailable ; côté e2e, les 2 tests de login.spec.ts échouent en restant bloqués sur /login malgré des identifiants seedés corrects — reproduit localement (build+preview identique à la CI) SANS échec (3/3 verts), ce qui exclut un défaut du code applicatif et pointe vers l'environnement CI lui-même (runner sous contention CPU/réseau au démarrage des conteneurs de service)
    perimetre: .github/workflows/ci.yml (jobs server et e2e, services postgres/redis) — infrastructure CI, pas le code applicatif
    regle_violee: null
    classe: ci_infra_lenteur_services_docker
    gravite: majeur
    statut: resolu
    critere_de_resolution: |
      C'est résolu quand un run CI sur `main` est vert sur les jobs `server` ET `e2e` sans qu'aucun des deux ne dépende d'un relance manuelle — vérifié en observant au moins 2 runs CI consécutifs verts sur des commits distincts (pas un seul run vert isolé, qui pourrait n'être qu'une coïncidence de charge du runner à cet instant précis).
    detecte_le: '2026-07-22'
    source: manuel
    confiance: certain
    note: |
      Découvert en vérifiant deux runs CI consécutifs après SEC-195 (commit `e7f7ecb`) et SEC-211 (commit `0f7673b`) : le job `server` échoue les deux fois avec le même `ConnectionTimeoutError` Redis au tout premier test (`authorize allows matching role`, qui prend 6.6-6.8s au lieu de <1ms) suivi d'une chute de couverture sous les seuils (statements 57.51% < 60%, branches 69.84% < 70%) — chute causée par le grand nombre de tests qui s'auto-sautent légitimement via `t.skip("no reachable database")` une fois que `before()` n'a pas pu se connecter à temps (mécanisme correct, cf. SEC-195 : c'est le SYMPTÔME d'une DB/Redis indisponible qui est visible ici, pas un défaut du garde de skip lui-même). Le job `e2e` échoue sur les mêmes deux runs avec 4 tests bloqués sur `/login` malgré des identifiants corrects (vérifiés œil nu contre `server/prisma/ seed.ts` : admin@secritou.tn/admin123, client3@example.tn/ client123, correspondance exacte) — un test avec un MAUVAIS mot de passe passe pourtant normalement (montre une erreur, ne navigue pas), ce qui prouve que le pipeline réseau/CORS/formulaire fonctionne : seul le cas nominal échoue à naviguer après un login qui devrait réussir. Reproduit directement en local (`npm run prisma:seed`, `npm run build --workspace=client`, `npm run preview --workspace=client`, `PLAYWRIGHT_SKIP_WEB_SERVER=true npx playwright test e2e/login.spec.ts`) : les 3 tests passent (2.7s, 2.0s, 1.6s), aucun échec — élimine un défaut du code applicatif (seed, build, LoginPage.tsx, auth.service.ts) comme cause, et pointe vers l'environnement d'exécution CI lui-même (runner GitHub Actions sous contention au moment du démarrage des conteneurs `services:` postgres/redis, malgré des health-checks configurés à 5 tentatives/10s qui a priori garantissent que le conteneur répond avant le début du job). Historique confirmé via l'API GitHub Actions : les 10 derniers runs sur `main` (du 2026-07-17 19:33 au 2026-07-22 21:17) sont TOUS en échec, dont 3 runs antérieurs à toute modification de cette session — exclut formellement SEC-195/SEC-211 comme cause. Hors périmètre de remédiation dans cette session : une correction fiable nécessite soit d'augmenter les seuils de health-check/retry des services CI, soit de wrapper les avant-avant (`before()`) applicatifs d'un retry avec backoff, soit de changer de runner — décision d'infrastructure qui dépasse un simple correctif de code et mérite sa propre session dédiée avec accès aux logs complets de démarrage des conteneurs (non consultables depuis cette session : 403 sur l'API de téléchargement des logs GitHub Actions).
      Session de remédiation (2026-07-22) : option "wrapper les before() applicatifs d'un retry" écartée après vérification empirique — un before() placé en tête de server/test/run-all.test.ts (point d'entrée unique de `npm run test:coverage`) ne peut PAS gater les 77 fichiers de test individuels : reproduit avec un repro minimal (node --test sur 2 fichiers), les before() de node:test s'exécutent par fichier, en parallèle, sans garantie d'ordre par rapport aux imports statiques du fichier d'entrée — contrairement à l'hypothèse initiale d'ordre séquentiel garanti par les imports ESM. Corriger ainsi aurait nécessité de toucher les 77 fichiers de test individuellement (un helper de retry importé partout), écarté comme disproportionné pour un défaut d'infrastructure CI (décision du porteur, question posée explicitement).
      Correctif appliqué à la place, scope infra pur (.github/workflows/ ci.yml, playwright.config.ts, aucun fichier de test touché) : 1) jobs `server` et `e2e` : nouvelle étape "Wait for Postgres and Redis to accept real queries" juste après actions/setup-node, avant `npm ci` — boucle jusqu'à 30 tentatives (2s d'intervalle, donc jusqu'à 60s) d'un `SELECT 1` réel via psql et d'un `PING` réel via redis-cli, distincte des health-checks `services:` existants qui prouvent seulement que le process a démarré, pas qu'il répond de façon fiable sous contention runner ; 2) playwright.config.ts : `expect.timeout` porté à 15s en CI uniquement (`process.env.CI`, inchangé en local où le défaut 5s convient) — absorbe une première requête (login) lente pendant que Postgres/Redis finissent de chauffer, sans masquer un vrai défaut applicatif (le timeout reste fini et le test échoue toujours si /login ne répond jamais). `npm run lint`/`npm run typecheck` --workspace=server vérifiés propres après ces changements (aucun fichier server/src ou server/test modifié). Statut laissé `en_cours` : critère de résolution exige un commit poussé ET 2 runs CI consécutifs verts sur `main`, aucun des deux n'existe encore à la fin de cette session — voir CLAUDE.md « Un critère de résolution se vérifie sur un commit ».
      Correction post-push (2026-07-22, même session) : le premier push (commit `7f08dd5`) a fait échouer le job `server` — log CI observé directement : `Postgres ready after 1 attempt(s).` puis `Redis did not respond to PING after 30 attempts.` Cause : `psql` est préinstallé sur l'image `ubuntu-latest`, mais `redis-cli` ne l'est PAS (seulement à l'intérieur du conteneur `redis:7-alpine` via `services:`, où tourne le health-check natif) — l'étape ajoutée appelait un binaire absent de l'hôte runner, `2>/dev/null` masquant silencieusement le `command not found` en échec de PING. Remplacé par une sonde PING RESP brute via socket TCP Node (`node -e ...`, net.createConnection sur le port 6379, écrit `PING\r\n`, vérifie `+PONG` dans la réponse) — Node est déjà disponible à cette étape (`actions/setup-node` tourne juste avant), aucune dépendance binaire externe. Vérifié en local : le script sort en code 0 contre un vrai serveur Redis répondant PONG, et en code 1 contre un port fermé — les deux branches de la boucle testées avant de pousser. YAML revalidé (`js-yaml`) après l'édition. Statut toujours `en_cours` : ce correctif n'a pas encore été observé vert en CI au moment de cette note.
      Diagnostic révisé après un run réel du job `server` (commit `df1641a`, log CI collé et lu en entier dans cette session) : le job échoue encore, avec EXACTEMENT le même symptôme que la découverte initiale (test `authorize allows matching role` à 5739ms, 40 tests sur 16 fichiers/blocs distincts sautés via `# no reachable database`/`# no database available`, couverture sous les seuils : lines 57.51%, functions 33.06%, branches 69.81%, statements 57.51%). Ceci PROUVE que l'étape "Wait for Postgres and Redis" (ajoutée dans ce même correctif, avant `npm ci`) ne suffit pas : le log confirme des logins HTTP réels et des transactions Prisma réelles réussissant tout au long du run (ex. `POST /api/v1/auth/login 200`, un vrai rollback de transaction sur une contrainte unique) — Postgres/Redis sont donc prouvés up et utilisés avec succès PENDANT le run, mais 16 fichiers sur 77 échouent quand même leur unique `$queryRaw SELECT 1` non retried, de façon dispersée sur tout le run (pas concentrée au démarrage). Une étape qui attend AVANT que le process Node ne démarre ne peut structurellement pas empêcher un échec ponctuel qui se produit APRÈS, en plein milieu d'un run où le service répond déjà par ailleurs.
      Hypothèse de concurrence testée et écartée : reproduit localement (2 fichiers de test statiquement importés dans un fichier d'entrée, comme `run-all.test.ts` importe ses 77 fichiers) que `node --test` exécute les tests strictement séquentiellement ici (deux tests de 300ms chacun mesurés à ~310ms d'écart, pas en parallèle) — élimine un épuisement de pool par accès concurrent comme cause, la requête `SELECT 1` d'un fichier ne peut pas être en compétition avec celle d'un autre fichier au même instant.
      Correctif tenté à la place (même session, ci.yml uniquement, aucun fichier de test touché) : `connect_timeout=30&pool_timeout= 30` ajoutés à `DATABASE_URL` dans les jobs `server` et `e2e` (au lieu des valeurs par défaut de Prisma : connect_timeout 5s, pool_timeout 10s) — durcit directement la connexion Prisma elle- même contre un blip réseau transitoire côté runner, plutôt que de tenter (à tort) de garantir que le service est « prêt » avant que le process ne démarre. L'étape "Wait for Postgres and Redis" ajoutée précédemment est laissée en place (elle reste correcte pour son objectif réduit : éviter un échec précoce et total si les conteneurs mettent réellement plus de 50s health-check à démarrer — un scénario distinct de celui observé ici) mais n'est plus présentée comme LE correctif de SEC-212 : elle ne l'était pas. Aucune couverture équivalente ajoutée côté Redis/ioredis (le client BullMQ/cache a son propre mécanisme de retry par défaut, non modifié ici, hors périmètre de cette tentative). YAML revalidé (`js-yaml`) après l'édition. Statut toujours `en_cours` : non observé vert en CI au moment de cette note — nouvelle incertitude non résolue : `connect_timeout`/`pool_timeout` ciblent un délai de connexion, pas une coupure/erreur réseau franche ; si le symptôme réel est une erreur (pas un timeout), ce correctif pourrait lui aussi s'avérer insuffisant et nécessiterait alors un vrai retry applicatif (donc de revenir à l'option écartée plus tôt : modifier les 77 fichiers, ou introduire un helper partagé), décision à reprendre avec le porteur si ce run échoue aussi.
      CAUSE RÉELLE TROUVÉE (2026-07-22, même session) : le run déclenché par `1449484` a échoué avec EXACTEMENT les mêmes 4 pourcentages de couverture que le tout premier run échoué (lines 57.51%, functions 33.06%, branches 69.81%, statements 57.51% — identiques à la décimale près sur 3 runs consécutifs, sur 2 correctifs différents). Des pourcentages identiques au bit près sur plusieurs runs excluent une cause transitoire/réseau — un vrai blip aléatoire ne produirait pas la même empreinte à chaque fois. Reproduit directement en local dans cette session, hors CI, contre des conteneurs Docker `postgres:16`/`redis:7-alpine` frais et sains (`docker run`, migrations appliquées avec succès, `pg_isready`/ `redis-cli ping` verts au 1er essai) : le même symptôme apparaît (`# no reachable database` sur des dizaines de tests), alors même que d'autres tests du même run exécutent avec succès de vraies requêtes Prisma et de vrais logins HTTP juste à côté — élimine formellement toute cause d'infrastructure CI/réseau/contention.
      Cause identifiée en lisant le code réel : `.github/workflows/ ci.yml`, le job `server` applique les migrations (`prisma migrate deploy`) mais n'exécute JAMAIS `npm run prisma:seed` — seul le job `e2e` le fait (ligne 321, préexistant). Au moins 18 fichiers de test (recensés par grep : `checkInvoiceFollowup`, `clientApproveEmailPortalUrl`, `clientCompletedTasks`, `commissionCreationExclusivity`, `commissionService`, `creditNoteApply`, `depositRateSingleSource`, `documentCreateHttp`, `documentSignContract`, `executiveMetricsActiveProjectsParallel`, `executiveMetricsCriticalCountUnbounded`, `executiveMetricsProjectRisks`, `freelancerSeesOwnDeliverable`, `invoiceNumberingGapless`, `portalActivationOnPayment`, `projectClientApproveBalanceInvoice`, `projectClientApproveConcurrency`, `projectDetailIncludesTasks`, `projectStatusInFilter`) ont un `before()` qui, en plus du `$queryRaw SELECT 1` de connectivité, exige une ligne de donnée de référence semée par `seed.ts` — preuve directe dans `commissionService.test.ts` lignes 26-32 : `await prisma.$queryRaw\`SELECT 1\`; const service = await prisma.service.findFirst(); if (!service) throw new Error("no Service seeded");` — capturé par le même `catch { dbAvailable = false; }` que l'échec de connexion, donc indiscernable dans les logs d'un vrai problème réseau. Sur une base migrée mais jamais semée (l'état exact du job `server` à chaque run, de façon déterministe), ces 18 fichiers échouent TOUJOURS, alors que les 59 autres fichiers (connectivité seule, sans dépendance de seed) passent normalement — confirmé en local : `Auth cookie attributes + logout/reuse` (connectivité pure, pas de dépendance seed) passe avec de vraies requêtes HTTP (630ms), tandis que `commissionService.setSplits` (dépendance seed) se saute entièrement dans le même run.
      Correctif appliqué (ci.yml, job `server` uniquement) : nouvelle étape "Seed database" (`npm run prisma:seed --workspace=server`), insérée après "Schema drift check" (qui diffe contre `secritou_shadow`, une base séparée, donc non affectée par le seed de `secritou_test`) et avant `npm run test:coverage` — même commande, même pattern déjà en production dans le job `e2e`. `seed.ts` vérifié idempotent (upsert / `skipIf` sur count() partout pour les tables concernées) : aucun risque de collision avec les données que les tests créent eux-mêmes ensuite, puisque le seed s'exécute une seule fois, avant le tout premier test. `npm run lint`/`npm run typecheck` --workspace=server vérifiés propres. YAML revalidé (`js-yaml`). Le wait-step et le `connect_timeout`/`pool_timeout` des 2 tentatives précédentes sont laissés en place (décision du porteur : défense en profondeur, pas de retrait) même s'ils ne sont plus considérés comme LE correctif — ils ne ciblaient pas la vraie cause, qui est l'absence de seed, pas un problème réseau/timing.
      Confirmation post-push (2026-07-22, même session) : le job `server` du run déclenché par `fea20ac` est passé vert — confirme la cause « absence de seed » ci-dessus. Le job `e2e` a échoué sur un symptôme DIFFÉRENT cette fois (login qui reste sur `/login` malgré des identifiants corrects, plus un 429 sur un retry) — pas le même que les runs précédents, donc pas expliqué par l'absence de seed (e2e seed déjà correctement, ligne 321 préexistante). Diagnostiqué en reproduisant tout le flux e2e en local (Docker Postgres/Redis frais, build+preview réel, vrai serveur, Playwright réel — même méthode que pour la cause `server`) : `curl` direct sur `/auth/login` prouve que le serveur fonctionne parfaitement (200, tokens valides) — élimine tout défaut serveur/DB. La trace Playwright capture la cause exacte dans la console du navigateur : `"Connecting to 'http://localhost:5000/api/v1/auth/login' violates the following Content Security Policy directive: \"connect-src 'self' https:\". The action has been blocked."` — `client/vite.config.ts` sert en mode preview/production une CSP qui n'autorise que `'self'` et `https:` sur `connect-src` (pas de `http://` en clair), alors que le serveur e2e tourne en `http://localhost:5000` — bloqué au niveau du navigateur, avant même d'atteindre le réseau, ce qui explique l'absence de toute erreur réseau visible côté serveur/logs CI. Un run initial en local avait faussement semblé passer (process `vite preview` resté d'une session antérieure avec l'ancienne CSP dev en mémoire) — corrigé en relançant `preview` proprement avant de confirmer la reproduction.
      Correctif ajouté (2e commit, même session) : nouvelle variable `VITE_E2E` — `playwright.config.ts` la passe à la commande `preview` du job e2e ; `client/vite.config.ts` l'utilise pour garder la CSP permissive de développement (`http://localhost:*` autorisé sur `connect-src`) uniquement dans ce cas, sans toucher à la CSP réellement servie à un déploiement de production réel (`'self' https:` reste la valeur par défaut du build). Vérifié en local : `curl -I` sur le preview confirme la CSP permissive seulement quand `VITE_E2E=true` est positionné ; les 3 tests de `login.spec.ts` et celui de `proposal-cascade.spec.ts` passent tous, à froid, après ce correctif (`client-approval.spec.ts` échoue encore mais sur une cause distincte, sans rapport avec CSP/login/seed — voir SEC-213, ouvert séparément, hors périmètre de SEC-212). Statut toujours `en_cours` : critère de résolution (2 runs CI consécutifs verts sur `main`, server ET e2e) non encore observé — ce correctif CSP n'a pas encore été poussé au moment de cette note.
      Correction du correctif (2026-07-22, même session) : le run déclenché par `206d8ad` a échoué à l'IDENTIQUE des runs précédents (mêmes 4 tests, même symptôme `/login`, même 429 sur un retry) — le correctif `VITE_E2E` n'avait aucun effet. Cause : `VITE_E2E=true` avait été ajouté au bloc `webServer` de `playwright.config.ts`, mais le job `e2e` de `ci.yml` positionne `PLAYWRIGHT_SKIP_WEB_SERVER: "true"` — ce qui désactive entièrement ce bloc `webServer` et son usage de `VITE_E2E`. Le vrai process preview utilisé par CI est démarré manuellement par une étape distincte, `- name: "Start client preview" / run: npm run preview --workspace=client > client-preview.log 2>&1 &` (ligne ~339 avant ce correctif), totalement indépendante de `playwright.config.ts`. Le premier correctif ciblait donc un chemin d'invocation qui n'est jamais emprunté par la CI — confirmé par un premier repro local erroné : lancé via le `webServer` intégré de Playwright (`npx playwright test` sans `PLAYWRIGHT_SKIP_WEB_SERVER`), donc pas représentatif du vrai pipeline CI, ce qui a fait paraître le correctif efficace alors qu'il ne l'était pas sur le chemin réel.
      Correctif ajouté (`VITE_E2E=true` préfixé directement sur la commande de l'étape "Start client preview" dans `ci.yml`, pas dans `playwright.config.ts`). Revérifié en local avec le chemin D'INVOCATION EXACT de la CI cette fois (containers Docker frais, migration + seed, serveur démarré, client buildé, PUIS `VITE_E2E= true npm run preview --workspace=client &` en arrière-plan comme le fait la CI — pas le `webServer` de Playwright — et `npx playwright test` lancé avec `PLAYWRIGHT_SKIP_WEB_SERVER=true`, identique au job) : `curl -sI` confirme la CSP permissive servie ; `login.spec.ts` (3/3) et `proposal-cascade.spec.ts` passent tous les 4, à froid (9.2s). YAML revalidé (`js-yaml`). Statut toujours `en_cours` : ce correctif n'a pas encore été poussé/observé en CI au moment de cette note — leçon retenue : un repro local doit emprunter le même chemin d'invocation que la CI (variables d'env, étapes manuelles vs config par défaut de l'outil), pas seulement reproduire le symptôme final.
      Confirmation `server` (2026-07-23, même session, commit `428c059`) : run CI lu en entier — la couverture passe désormais les 4 seuils (statements 65.06% ≥ 60%, branches 73.69% ≥ 70%, functions 44.86% ≥ 40%, lines 65.06% ≥ 60%), confirmant que le seed corrige bien la vraie cause. Un seul test restait rouge (`SEC-077`, `taskChecklist.test.ts`) — investigué et corrigé séparément sous un nouvel ID, `SEC-214` (retry insuffisant sous contention réelle, distinct de l'infra CI Postgres/Redis/seed couverte par SEC-212 lui-même). Le job `e2e` reste à confirmer vert sur le prochain run avec le correctif `VITE_E2E` ci-dessus.
      `e2e` : sur le run suivant (commit `428c059`), `login.spec.ts` passe 3/3 (confirme le correctif CSP), mais 2 autres tests échouent pour des causes distinctes et sans rapport avec SEC-212 : `client-approval.spec.ts` sur SEC-213 (voir sa note — cause réelle : SEC-215, recherche clients cassée côté serveur) et `proposal-cascade.spec.ts` sur un 429 en cascade causé par le volume d'écritures de `client-approval.spec.ts` épuisant `sensitiveWriteRateLimit` (10/min, un vrai contrôle de sécurité prod) avant même que le test suivant ne démarre son propre appel dans la même fenêtre de 60s. Corrigé sans affaiblir la limite de prod : nouvelle variable `E2E_RELAXED_RATE_LIMITS` (validée dans `config/env.ts`, avec un garde-fou qui lève une exception si `NODE_ENV=production`), positionnée uniquement par l'étape "Start server" du job `e2e` dans `ci.yml` — porte `sensitiveWriteRateLimit` à 200/min pour ce process serveur précis, jamais en production ni en `npm run dev` local. Vérifié directement (header `RateLimit-Limit` à 200 après activation, contre 10 sans).
      Une fois SEC-215/SEC-216 corrigés (voir leurs notes), suite e2e complète revérifiée en local à 2 reprises consécutives, sans re-seed entre les deux : 5/5 verts les deux fois (13.4-14.3s chacune). Statut toujours `en_cours` pour SEC-212 lui-même : le critère de résolution exige 2 runs CI (pas locaux) consécutifs verts sur `main`, non encore observés au moment de cette note — les correctifs (rate-limit, SEC-215, SEC-216) n'ont pas encore été poussés.
      CLÔTURE (2026-07-23, même session, commit `0627ac0`) : les correctifs ci-dessus poussés, puis 2 runs CI confirmés verts sur les jobs `server` ET `e2e` (rapporté directement par le porteur, pas déduit). Nuance à noter explicitement sur le respect du critère : les 2 runs verts portent sur le MÊME commit (`0627ac0`) — le second obtenu via une relance manuelle ("Re-run all jobs") du run qui venait de passer, pas sur un second commit distinct. Le texte du critère dit littéralement « commits distincts », formulé pour exclure un run vert isolé qui ne serait qu'une coïncidence de charge runner à un instant précis — l'objectif réel (prouver que le vert n'est pas une fluke, via une 2e observation indépendante) est atteint par un rerun manuel du même commit tout autant que par un commit différent, puisque chaque run provisionne des conteneurs `services:` Postgres/Redis frais et indépendants. Accepté comme satisfaisant le critère sur cette base — décision explicite du porteur, pas une extension silencieuse de la lettre du texte.
  - id: SEC-217
    titre: '.github/workflows/backup.yml ("Daily DB Backup") échoue systématiquement (cron quotidien 01:00 UTC) : `SSH_HOST`/`SSH_USER`/`SSH_PRIVATE_KEY`/`BACKUP_ENV_PATH` sont vides à l''exécution (`ssh "@"` littéral dans le log, `usage: ssh...`, exit code 255) — aucun secret n''est configuré dans l''environnement GitHub "production" du dépôt, et REFERENTIEL.md §7 (décision datée 2026-07-16) confirme qu''aucun serveur de production n''existe pour l''instant : ce n''est pas une config manquante à corriger, c''est un workflow prématuré vu l''état réel du projet'
    perimetre: .github/workflows/backup.yml — infrastructure CI/déploiement, pas le code applicatif
    regle_violee: null
    classe: ci_workflow_infra_inexistante
    gravite: mineur
    statut: resolu
    critere_de_resolution: |
      C'est résolu quand le job ne s'exécute plus automatiquement sans pouvoir jamais réussir (cron désactivé tant qu'aucun serveur de production n'existe), tout en restant déclenchable manuellement (`workflow_dispatch` conservé) pour le jour où un serveur de production existera et où les secrets `SSH_HOST`/`SSH_USER`/ `SSH_PRIVATE_KEY`/`BACKUP_ENV_PATH` seront réellement configurés dans l'environnement GitHub "production" du dépôt.
    detecte_le: '2026-07-23'
    source: manuel
    confiance: certain
    note: |
      Log CI collé directement par le porteur : chaque interpolation de secret (`${{ secrets.SSH_PRIVATE_KEY }}`, `${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}`, `${{ secrets.BACKUP_ENV_PATH }}`) résout en chaîne vide dans la commande exécutée (`ssh -i /tmp/deploy_key "@" "source  && ..."`), confirmant qu'aucun des 4 secrets requis n'est défini dans l'environnement GitHub "production" référencé par `environment: production` (ligne 12 du workflow) — pas un bug du script `backup-db.sh` lui-même, jamais atteint. Avant de proposer un correctif de configuration, REFERENTIEL.md §7 relu : entrée datée 2026-07-16 déjà présente, citant une vérification directe demandée par le porteur (« Confirmé : aucun workflow de déploiement... n'existe... Un push vers `origin/main` ne déclenche donc aucun déploiement ») — confirme qu'il n'y a jamais eu de serveur de production configuré pour ce projet (cohérent avec CLAUDE.md : agence en lancement, 0 client actif). Le porteur, interrogé directement, a confirmé ne pas savoir avec certitude si un serveur existe — traité par prudence comme absent plutôt que de deviner des identifiants SSH inexistants.
      Corrigé : le déclencheur `schedule` (cron quotidien) retiré de `backup.yml`, `workflow_dispatch` conservé — le job ne peut plus échouer silencieusement chaque jour sans espoir de succès, mais reste disponible en un clic le jour où un vrai serveur de production et ses secrets existeront. Aucun secret créé ni deviné (contraire à CLAUDE.md « aucune clé API en dur… toujours via variables d'environnement » et à l'interdiction d'inférer une décision du porteur) : la configuration des 4 secrets manquants reste une action manuelle du porteur sur GitHub (Settings > Environments > production), hors de portée de cette session. YAML de `backup.yml` revalidé après édition (`js-yaml`).
  - id: SEC-219
    titre: monitoring/alerts.yml#CacheHitRateLow référence les métriques cache_hits_total/cache_misses_total, qui n'existent nulle part dans le code — les vraies métriques sont redis_cache_hits_total/redis_cache_misses_total (server/src/observability/metrics.ts) — l'alerte ne peut jamais évaluer de données réelles et ne se déclenchera donc jamais, silencieusement
    perimetre: monitoring/alerts.yml (règle CacheHitRateLow, ligne 15) ; server/src/observability/metrics.ts (lignes 117/124, noms réels des métriques)
    regle_violee: null
