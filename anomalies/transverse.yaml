# Registre des anomalies — Secritou
#
# Ce fichier fait partie du registre éclaté (voir CLAUDE.md § « Procédure
# d'audit obligatoire »). Schéma par anomalie : id, titre, perimetre,
# regle_violee, classe, gravite, statut, critere_de_resolution, detecte_le,
# source, confiance, note.
# Ne jamais reformuler un titre existant — citer l'ID.
#
# Périmètre : Transverse (hors modules §4 — CI/infra, docs, RGPD, i18n global, design system, observabilité)
# 5 anomalie(s) — registre remis à zéro le 2026-07-27, historique réel
# archivé sur la branche locale archive/anomalies-avant-reset (commit 3c03297).

anomalies:
  - id: SEC-030
    titre: >
      server/tsconfig.json n'inclut que "src/**/*.ts" — npm run typecheck
      (tsc --noEmit) ne vérifie jamais server/test/**, qui peut donc
      accumuler des erreurs de type réelles (constaté : deux appels
      obsolètes de clientOnboardingService.createPayment avec un shape
      retiré du type PaymentInput, jamais détectés) sans jamais faire
      échouer la porte CI typecheck ; les tests continuent de s'exécuter
      via tsx (qui strip les types sans les vérifier), masquant le défaut
    perimetre: transverse
    regle_violee: >
      Zéro warning/erreur lint est une porte obligatoire documentée dans
      CLAUDE.md ; par analogie directe, une porte typecheck qui n'examine
      jamais tout le code réellement exécuté (les tests le sont, via tsx)
      ne peut pas garantir ce qu'elle prétend garantir. client/tsconfig.json
      n'a pas ce trou : ses tests vivent sous src/**, donc déjà couverts.
    classe: typecheck-perimetre-incomplet
    gravite: moyenne
    statut: resolu
    critere_de_resolution: >
      server/tsconfig.json inclut server/test/**/*.ts (ou un tsconfig
      dédié aux tests avec les mêmes compilerOptions), npm run typecheck
      --workspace=server échoue si un fichier de test contient une
      véritable erreur de type, et un commit avec 0 erreur passe la CI.
    detecte_le: "2026-07-30"
    source: >
      Découvert incidemment (CLAUDE.md « Enregistrement immédiat de tout
      écart constaté ») en corrigeant SEC-029 : après avoir retiré
      amount/amountPaid/status de PaymentInput
      (clientOnboarding.validator.ts), `npx tsc --noEmit` sur tout le
      workspace server restait à 0 erreur alors que
      test/clientOnboardingWriteScopeManager.test.ts appelait encore
      createPayment/updatePayment avec ces champs — confirmé en exécutant
      `npx tsc --noEmit --strict test/clientOnboardingWriteScopeManager.test.ts`
      directement (TS2353 sur les deux appels). server/tsconfig.json:
      "include": ["src/**/*.ts"] exclut structurellement tout server/test/.
    confiance: haute
    note: >
      N'affecte pas la fiabilité des tests eux-mêmes (ils s'exécutent
      normalement, ce ne sont pas des faux positifs de succès) — le risque
      est que le typecheck CI ne protège jamais contre une dérive de type
      dans les fichiers de test, qui peuvent donc silencieusement diverger
      du code réel qu'ils prétendent appeler (risque similaire, en plus
      subtil, à la classe de défaut décrite dans CLAUDE.md « verifie: test
      exige un test qui appelle le code réel »).
      Corrigé (session du 2026-07-30) : nouveau
      server/tsconfig.typecheck.json (extends tsconfig.json,
      rootDir: ".", include src/**/*.ts + test/**/*.ts — laisse
      tsconfig.json/npm run build intacts, aucun risque sur l'émission de
      dist/). `npm run typecheck` pointe désormais sur ce fichier. Les ~19
      fichiers de test révélés (erreurs préexistantes, sans rapport avec
      cette session : ListQueryOptions.orderDir manquant,
      Decimal vs string|number, req.user JwtPayload incomplet, valeurs
      possibly null, un fake Prisma client sous-typé dans
      booking.service.test.ts, assigneeId: null non exprimable par
      Partial<CreateTaskDTO> — nouveau type UpdateTaskDTO introduit dans
      server/src/types/entities.ts pour ce dernier cas) corrigés un par un
      dans la même session — décision du porteur (AskUserQuestion) de ne
      pas se contenter d'enregistrer l'écart. 695/695 tests server verts,
      lint 0/0, build (tsc -p tsconfig.json) toujours vert séparément.
      `verifie: test` (le typecheck lui-même est la porte).

  - id: SEC-010
    titre: >
      gdprErasure.test.ts — l'anonymisation d'un Client avec facture
      s'exécute (mode "anonymized" confirmé) mais l'assertion sur
      Invoice.amount.toString() attend "100.000" et obtient "100"
    perimetre: transverse
    regle_violee: >
      RG-025 (export et effacement RGPD, verifie:test) : le test attendu
      comme preuve que l'anonymisation ne touche pas la facture échoue sur
      une assertion de formatage, pas sur le comportement métier lui-même
      (le mode "anonymized" et la survie de la facture sont confirmés par
      les lignes précédentes du même test, elles passent).
    classe: assertion-format-decimal
    gravite: mineure
    statut: resolu
    critere_de_resolution: >
      server/test/gdprErasure.test.ts, cas "a client with an invoice is
      anonymized, not deleted — the invoice survives untouched" doit passer
      au vert. Deux réparations possibles, à trancher (pas déduit du seul
      typecheck, cf. CLAUDE.md « réparer n'est pas développer ») : (a)
      l'assertion attend un format Decimal.js à 3 décimales fixes
      (".000") qui ne correspond pas à ce que Prisma renvoie réellement
      pour ce champ Decimal(14,3) — corriger l'assertion pour matcher le
      format réel ; ou (b) un comportement réel de troncature/formatage
      existe quelque part sur ce chemin et l'assertion a raison de
      l'attendre — à investiguer avant de choisir.
    detecte_le: "2026-07-28"
    source: >
      npm run test:unit --workspace server, session du 2026-07-28 (RG-025,
      demande explicite du porteur de faire tourner typecheck/lint/tests).
      AssertionError strictEqual : actual '100', expected '100.000',
      server/test/gdprErasure.test.ts:72
      (`assert.equal(invoiceStillThere?.amount.toString(), "100.000")`).
      Invoice.amount est Decimal(14,3) en base (schema.prisma) — écrit avec
      la valeur JS 100 à la création du fixture de test (ligne 58, `amount: 100`).
      Pas d'investigation plus poussée dans cette session sur le
      comportement exact de Prisma.Decimal#toString() pour ce champ.
    confiance: moyenne
    note: >
      Hypothèse sur le code, pas tranchée : ni le test ni le code n'ont été
      modifiés dans cette session sur ce point — seul le symptôme exact est
      enregistré, conformément à CLAUDE.md (« un test rouge est une
      hypothèse sur le code, pas un défaut du test »).
    correctif: >
      Option (a) tranchée (AskUserQuestion, session du 2026-07-29) : aucune
      troncature de données réelles n'existe sur ce chemin —
      Prisma.Decimal#toString() ne préserve pas les zéros de fin d'un
      Decimal(14,3) pour la valeur 100, "100" est le format réel et correct.
      L'assertion attendait un format qui n'a jamais correspondu au
      comportement réel de Prisma. Corrigée : `assert.equal(Number(
      invoiceStillThere?.amount), 100)` au lieu de comparer une chaîne
      formatée. Suite complète server (650 tests, 650 pass, 0 fail, 0 skip)
      exécutée sans régression. Commité (954a191) et confirmé vu vert en
      CI sur le commit fdc1363 (run GitHub Actions 30457571233, 6/6 jobs
      verts) — critère de résolution rempli (CLAUDE.md « Un critère de
      résolution se vérifie sur un commit »).

  - id: SEC-017
    titre: >
      Dépendance circulaire creditNote.service.ts <-> invoice.service.ts
      (madge --circular, porte CI "Circular dependency check") — invoice.service.ts
      importe creditNoteService pour la cascade de trop-perçu, creditNote.service.ts
      importait assertInvoiceInScope depuis invoice.service.ts
    perimetre: transverse
    regle_violee: >
      Porte de build CI "Circular dependency check" (`npx madge --circular
      --extensions ts src/`, server/.github/workflows/ci.yml), présente et
      verte 5 jours avant cette session (run 30051176133), rouge sur les 3
      runs suivant le premier commit de cette session — régression réelle
      introduite par un des 15 commits pré-existants poussés en une fois au
      début de cette session, jamais relus individuellement.
    classe: dependance-circulaire
    gravite: moyenne
    statut: resolu
    critere_de_resolution: >
      `npx madge --circular --extensions ts src/` (depuis server/) ne
      rapporte aucun cycle, et la porte CI "Circular dependency check"
      passe au vert sur un commit réel.
    detecte_le: "2026-07-29"
    source: >
      CI run 30456780465 (job server, étape "Circular dependency check") :
      « Found 1 circular dependency! 1) services/creditNote.service.ts >
      services/invoice.service.ts ». Confirmé par lecture directe des deux
      fichiers : invoice.service.ts:11 importe creditNoteService (utilisé
      ligne 280, cascade de trop-perçu automatique) ; creditNote.service.ts:14
      importait assertInvoiceInScope depuis invoice.service.ts (utilisé
      ligne 95, scope MANAGER sur la facture liée à l'avoir).
    confiance: haute
    correctif: >
      assertInvoiceInScope (fonction pure de scope, ne dépendait déjà que de
      ServiceScope et de prismaRead — aucune dépendance réelle au reste
      d'invoice.service.ts) extraite vers server/src/utils/serviceScope.ts,
      même précédent que assertProjectInScope (SEC-041). Les deux services
      importent désormais cette fonction depuis serviceScope.ts, plus aucune
      dépendance mutuelle entre eux. Vérifié : `npx madge --circular`
      propre, typecheck/lint serveur propres, 650/650 tests (0 skip).
      Commité (fdc1363) et confirmé vu vert en CI (run GitHub Actions
      30457571233, 6/6 jobs verts) — critère de résolution rempli.

  - id: SEC-023
    titre: >
      .github/workflows/ci.yml et backup.yml référencent actions/checkout@v4,
      actions/setup-node@v4, actions/upload-artifact@v4 par tag mutable,
      jamais par SHA de commit — écart explicitement documenté par le
      commentaire MED-1 dans ci.yml mais jamais corrigé ; dependabot.yml
      maintiendrait des SHA épinglés à jour s'ils existaient, mais ne les
      crée pas rétroactivement
    perimetre: transverse
    regle_violee: >
      Bonne pratique de sécurité de la chaîne d'approvisionnement CI
      (supply-chain) : un tag `@v4` est mutable (peut être repointé vers un
      commit différent par le mainteneur de l'action ou un compte compromis),
      contrairement à un SHA de commit qui garantit un contenu figé.
    classe: ci-action-non-epinglee
    gravite: moyenne
    statut: resolu
    critere_de_resolution: >
      Toutes les occurrences de `uses: actions/*@v*` dans
      .github/workflows/*.yml sont remplacées par `uses: actions/*@<sha>`
      (avec le tag en commentaire pour lisibilité, convention GitHub
      standard), et un push déclenche une CI verte sur ce commit.
    detecte_le: "2026-07-30"
    source: >
      Lecture intégrale de .github/workflows/ci.yml (comparaison du
      commentaire MED-1 en tête de fichier avec les `uses:` réels des 6
      jobs) et .github/workflows/backup.yml, plus .github/dependabot.yml
      (confirme que le mécanisme de maintien à jour existe mais ne peut
      pas créer un épinglage qui n'existe pas encore).
    confiance: haute
    note: >
      Risque théorique tant qu'aucun secret de production sensible ne
      transite par ces workflows (SEC-217 : pas de serveur de production
      à ce jour) — mais backup.yml, lui, manipule déjà des secrets SSH
      réels (SSH_PRIVATE_KEY) dans le même fichier non épinglé, ce qui
      élève la gravité au-delà d'un simple TODO cosmétique.
      Corrigé (session du 2026-07-30) : les 3 actions réellement utilisées
      (actions/checkout, actions/setup-node, actions/upload-artifact)
      épinglées par SHA de commit (tag en commentaire) dans ci.yml et
      backup.yml ; commentaire MED-1 en tête de ci.yml remplacé par une
      référence à SEC-023. Commit 0a26794, CI verte confirmée (9/9 checks
      GitHub Actions completed/success — les 6 jobs applicatifs habituels
      + 3 checks Dependabot déclenchés par la modification de
      dependabot.yml/des workflows).

  - id: SEC-024
    titre: >
      backup.yml se connecte en SSH à l'hôte de production avec
      -o StrictHostKeyChecking=no, désactivant toute vérification de la
      clé d'hôte — expose la connexion à une attaque MITM sur le chemin
      SSH vers le serveur de sauvegarde
    perimetre: transverse
    regle_violee: >
      Bonne pratique de sécurité SSH : StrictHostKeyChecking=no accepte
      silencieusement n'importe quelle clé d'hôte présentée à la connexion,
      annulant la protection normale contre un serveur usurpé (MITM) — sans
      vérification, ce runner GitHub Actions éphémère n'a aucun moyen de
      détecter un changement d'hôte malveillant.
    classe: ssh-host-key-non-verifiee
    gravite: moyenne
    statut: ouvert
    critere_de_resolution: >
      L'option -o StrictHostKeyChecking=no est retirée de backup.yml, et la
      clé d'hôte réelle du serveur de production est épinglée (ex. via un
      secret GitHub SSH_KNOWN_HOSTS ajouté à ~/.ssh/known_hosts avant la
      connexion, ou ssh-keyscan suivi d'une vérification manuelle une fois).
      Vérifiable seulement une fois qu'un vrai serveur de production existe
      (SEC-217) — jusque-là, aucun run réel de ce step ne peut confirmer la
      correction en pratique, seule la lecture du YAML le peut.
    detecte_le: "2026-07-30"
    source: >
      Lecture intégrale de .github/workflows/backup.yml.
    confiance: haute
    note: >
      Le workflow entier est actuellement inerte (cron désactivé, secrets
      SSH_HOST/SSH_USER/SSH_PRIVATE_KEY/BACKUP_ENV_PATH non définis dans
      l'environnement "production" GitHub — voir le commentaire SEC-217 en
      tête de fichier), donc aucun risque d'exploitation réel tant qu'un
      serveur de production n'existe pas. Enregistré maintenant pour ne pas
      redécouvrir ce même défaut au moment de l'activation du workflow, sans
      bloquer le lancement (pas de production = pas de chemin de l'argent
      concerné aujourd'hui).
      Correctif écrit (session du 2026-07-30) : StrictHostKeyChecking=no
      remplacé par UserKnownHostsFile=/tmp/ssh/known_hosts alimenté par un
      nouveau secret GitHub SSH_KNOWN_HOSTS (documenté en commentaire dans
      backup.yml, à renseigner par le porteur via `ssh-keyscan -H <host>`
      vérifié hors bande une fois le serveur de production existant).
      `statut` volontairement laissé `ouvert` malgré le code déjà corrigé
      et poussé (commit 0a26794, CI verte) : le critère de résolution de
      cette anomalie précise exige une vérification de bout en bout contre
      un vrai hôte SSH, impossible tant que SEC-217 reste vraie (aucun
      serveur de production). Ne pas repasser `resolu` sur la seule lecture
      du YAML — attendre l'activation réelle du workflow.
