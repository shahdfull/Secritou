  - id: SEC-037
    titre: >
      gdprService.eraseClient/eraseUser/eraseLead/eraseContactRequest
      exécutent chacune plusieurs écritures Prisma séquentielles (delete
      des leads liés puis delete du client ; ou update client puis update
      leads puis update portalUsers) sans les envelopper dans
      prisma.$transaction — un échec à mi-séquence (crash serveur, erreur
      réseau DB) laisse l'effacement RGPD partiellement appliqué (ex.
      leads supprimés mais Client encore présent, ou Client anonymisé
      mais comptes portail non révoqués/anonymisés)
    perimetre: transverse
    regle_violee: >
      RG-025 (RGPD, export/effacement) présuppose que l'effacement d'un
      sujet atteint un état terminal cohérent (effacé ou anonymisé), pas un
      état intermédiaire indéfini. Aucune règle explicite de
      REFERENTIEL.md ne mentionne l'atomicité de cette opération, mais un
      effacement RGPD partiellement appliqué laisse subsister des PII
      censées être effacées (ex. portalUsers non anonymisés) — contraire à
      l'intention de RG-025.
    classe: ecriture-multi-etapes-sans-transaction
    gravite: moyenne
    statut: resolu
    critere_de_resolution: >
      Chaque fonction eraseClient/eraseUser/eraseLead/eraseContactRequest
      atteint un état terminal cohérent même en cas d'échec à mi-séquence
      — soit via prisma.$transaction (transactions interactives) autour
      des seules écritures DB (les appels non-Prisma comme
      authDenylist.revokeAccessToken restent hors transaction mais
      idempotents/rejouables après un retry complet de la fonction), soit
      via une preuve documentée que chaque étape individuelle est déjà
      idempotente et donc rejouable sans effet de bord en cas de retry
      complet. Vérifié par un test qui simule un échec Prisma à
      mi-séquence (ex. mock rejetant le 2e appel) et assère que l'état
      final reste cohérent (pas de ligne à moitié effacée).
    detecte_le: "2026-07-30"
    source: >
      Lecture intégrale de server/src/services/gdpr.service.ts pendant
      l'audit B transverse — grep "\$transaction" sur ce fichier : zéro
      résultat, confirmant qu'aucune des 4 fonctions d'effacement n'utilise
      de transaction malgré des séquences de plusieurs écritures Prisma
      chacune.
    confiance: haute
    note: >
      Corrigé (session du 2026-07-30) : eraseClient/eraseUser groupent
      désormais chaque séquence de write (delete/anonymize) dans un
      prisma.$transaction interactif ; authDenylist.revokeAccessToken
      déplacé après le commit, jamais dans la transaction. eraseLead/
      eraseContactRequest n'avaient qu'une seule écriture DB par branche
      (delete OU update, jamais les deux) — déjà atomiques, aucun
      changement nécessaire là. Nouveau
      server/test/gdprEraseClientAtomicity.test.ts : appelle réellement
      gdprService.eraseClient contre une vraie base, avec un second portal
      User pré-anonymisé à l'email cible du premier (via l'export
      anonymizedEmail() réel, pas une réimplémentation) pour forcer une
      vraie violation @@unique([email]) à mi-transaction — assère que le
      Client lui-même n'a PAS été anonymisé malgré que sa propre écriture
      soit exécutée en premier dans la transaction, preuve du rollback
      atomique (pas seulement que l'étape suivante échoue). Suite complète
      (test:unit, 709 tests) : 709/709 verts localement. Commité
      (9de5f12), CI verte confirmée (6/6 checks GitHub Actions
      completed/success : server, client, e2e, contrast-check, i18n-check,
      restore-smoke-test) — statut corrigé à resolu.

