    gravite: mineur
    statut: en_cours
    critere_de_resolution: |
      C'est résolu quand l'expression PromQL de la règle `CacheHitRateLow` référence les noms de métriques réellement exposés par l'application (`redis_cache_hits_total`/`redis_cache_misses_total`), prouvé par une requête de cette expression exécutée contre un Prometheus réel (ou le endpoint `/metrics` de l'application) qui retourne des séries non vides — pas seulement une relecture textuelle des deux fichiers.
    detecte_le: '2026-07-24'
    source: audit_llm
    confiance: certain
    note: |
      Découvert lors d'un balayage frais de la catégorie D (Fiabilité opérationnelle) demandé explicitement par l'utilisateur avant d'accepter un score. Vérifié par grep direct : `grep -rn "cache_hits_total\|cache_misses_total" server/src` ne retourne que les déclarations `redis_cache_hits_total`/`redis_cache_misses_total` dans `metrics.ts` — aucune métrique nommée exactement `cache_hits_total`/`cache_misses_total` n'existe dans le code. Distinct de SEC-159 (même fichier de métriques, mais SEC-159 porte sur l'absence de label par préfixe de clé sur les vraies métriques `redis_cache_*`, pas sur un nom de métrique inexistant référencé par une règle d'alerte) — classe différente, critère de résolution différent. Non exécuté contre un Prometheus réel dans cette session (aucune instance disponible) ; la non-existence du nom de métrique dans le code source est cependant suffisante pour établir que la règle ne peut structurellement jamais matcher de série réelle.
      CORRECTIF ÉCRIT (session du 2026-07-24) : `monitoring/alerts.yml` ligne 15 renommé en `redis_cache_hits_total`/`redis_cache_misses_total`. Reste `en_cours`, pas `resolu` : le correctif n'est pas commité, et n'a pas été vérifié contre un Prometheus réel (aucune instance disponible dans cette session) — seule la cohérence textuelle avec les noms déclarés dans `metrics.ts` a été confirmée.
