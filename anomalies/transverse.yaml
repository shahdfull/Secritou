    detecte_le: '2026-07-20'
    source: audit_llm
    confiance: certain
    note: |
      Vérifié par lecture directe, error.middleware.ts : la branche P2002 (l.14-20), Multer (l.42-48), le générique `statusCode` (l.64-70), HttpError (l.85-93) et le 500 générique (l.100-106) renvoient toutes `{ error: { code, message, ... }, message, ... }`. Seule la branche ZodError (l.76-79) déroge : `{ message: "Validation failed", issues: error.flatten() }` — pas de clé `error.code`, pas de clé `details`. Un client qui parse uniformément `body.error.code` sur toute réponse d'erreur (au lieu de brancher sur la présence/absence de la clé) obtient `undefined` spécifiquement sur les 422 de validation, le cas d'erreur le plus fréquent en pratique (saisie utilisateur invalide).
