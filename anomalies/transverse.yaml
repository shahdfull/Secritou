      dans SEC-095 — dans les deux cas SEC-103 passe resolu une fois le
      texte de SEC-095 mis en cohérence avec la conclusion retenue. —
      SATISFAIT le 2026-08-10 (seconde branche) : aucune preuve du run du
      2026-08-03 n'a été retrouvée, mais la question est devenue sans
      objet pratique — un nouveau run Lighthouse complet réel a été
