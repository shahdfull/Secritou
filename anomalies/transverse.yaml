    critere_de_resolution: >
      Un run Lighthouse réel exécuté sur les routes principales
      (production build, pas dev server), résultats consignés, toute
      anomalie de score critique enregistrée sous son propre ID. —
      SATISFAIT le 2026-08-10.
    source: >
      Run Lighthouse 13.4.1 exécuté le 2026-08-10 contre le build de
      production réel (npm run build, client/dist servi par vite preview
      port 5173) et le serveur Express réel (port 5000, DB Postgres
      réelle, comptes de test seedés admin@secritou.tn/manager@secritou.tn/
      client3@example.tn). Pilotage programmatique via Puppeteer 25.3.0 +
      module lighthouse en mode module (pas le CLI seul — le CLI avec
      --user-data-dir s'est révélé peu fiable pour réutiliser un profil
      Chrome authentifié, cf. note technique ci-dessous). Rapports JSON
      complets conservés (hors dépôt, scratchpad de session) pour chacune
      des 8 pages.
    confiance: >
      Élevée — mesures réelles sur build de production, authentification
      confirmée par finalDisplayedUrl correspondant à la page cible (pas
      de redirection /login) pour les 5 pages protégées, vérifié
      individuellement pour chacune.
    note: >
      RÉSULTATS — scores (throttlingMethod simulate, mobile, profil
      standard) : login 50/94/100/69 (perf/a11y/best-practices/seo),
      dashboard-admin 16/100/100/66, dashboard-manager 26/100/96/66, crm
      27/100/100/66, module-ia 36/100/100/66, portail-client 35/96/100/66,
      contact 21/99/100/100, join-us 38/98/100/100. Scores Performance
      uniformément bas (16-50) et LCP simulé uniformément élevé (46.8s à
      68.2s) sur les 8 pages — signal caractéristique d'un artefact de
      méthode plutôt que d'un problème de performance réel par page.

      ÉCART LCP SIMULÉ VS RÉEL — confirmé et mesuré (pas hérité d'une
      estimation antérieure) : sur login, throttlingMethod=simulate donne
      LCP 46.8-50.1s (score perf 45-50) contre throttlingMethod=provided
      (mesure réelle, sans modèle réseau simulé) qui donne LCP 1.2s
      (score perf 100). Confirmé indépendamment par l'audit
      lcp-breakdown-insight (existe réellement dans Lighthouse 13.4.1,
      vérifié via --list-all-audits avant utilisation) : login = TTFB
      306ms + element render delay 957ms ≈ 1.26s réel ; dashboard-admin
      = TTFB 5.7ms + element render delay 1410ms ≈ 1.4s réel — cohérent
      avec le mode provided, très loin des 46-68s en mode simulate. Cause
      probable : le modèle de simulation réseau de Lighthouse suppose une
      latence réseau réaliste (mobile 4G typique) inexistante sur
      localhost. Consistant avec l'observation déjà notée dans l'artifact
      "Clôture Phase 2 QA" (2026-08-01) sur le blocage d'environnement
      Chromium de l'époque, mais mesuré ici pour la première fois avec
      des chiffres réels et sourcés.

      BUNDLE — mesures réelles sur le build actuel (client/dist, npm run
      build) : bundle initial 334 kB brut / 107 kB gzip
      (index-C-GOF40f.js) + vendor 231 kB / 74 kB gzip
      (vendor-gds-jnxs.js), 2 chunks séparés du bundle initial. Chunks
      lourds hors bundle initial (dynamic import, déjà lazy) : AG Grid
      (index.esm-DyEwnT83.js) 1084 kB / 303 kB gzip — le plus lourd du
      projet ; TextLayer (pdf.js, lecture de PDF) 422 kB / 125 kB gzip ;
      jspdf+jspdf-autotable (jspdf.es.min-43wZwb7W.js) 386 kB / 126 kB
      gzip, usage confirmé par lecture directe de
      client/src/features/reports/exportPdf.ts : 2 tableaux simples
      (leads, projets) via autoTable, aucune image/manipulation PDF
      avancée ; exceljs (exceljs.min-61eo3SJe.js) 936 kB / 270 kB gzip,
      usage confirmé par lecture directe de
      client/src/features/reports/exportExcel.ts : écriture seule
      (jamais de lecture), export XLSX 2 feuilles à colonnes textuelles
      simples, aucun style/formule avancé. Les deux (jspdf, exceljs) sont
      déjà en import() dynamique — confirmés absents de index.html et du
      bundle initial par grep direct.

      CORRECTION D'UNE CONFUSION ANTÉRIEURE (session du 2026-08-10, avant
      ce run) : un chiffre de ~1084 kB/303 kB gzip avait été
      provisoirement attribué à jspdf dans la conversation ayant motivé
      ce dégel — vérification directe du contenu du chunk (grep de
      marqueurs "AG Grid"/"ag-grid"/"agGrid") a confirmé qu'il s'agit en
      réalité d'AG Grid (ag-grid-community, utilisé par 19 fichiers
      applicatifs), pas de jspdf. jspdf est en réalité le plus léger des
      chunks lourds mesurés (386 kB/126 kB gzip).

      NOTE TECHNIQUE (pour un futur run) : Lighthouse CLI avec
      --chrome-flags="--user-data-dir=..." s'est révélé peu fiable pour
      réutiliser un profil Chrome pré-authentifié (2 tentatives
      échouées, redirection systématique vers /login malgré cookie +
      marqueur localStorage hasSession correctement posés et vérifiés
      persistants via Puppeteer seul). Cause probable : chrome-launcher
      (dépendance interne de Lighthouse CLI) ne relance pas le profil de
      façon strictement identique à un lancement Puppeteer direct.
      Contournement qui a fonctionné : piloter Puppeteer soi-même
      (browser.launch() sans userDataDir, cookie posé en mémoire via
      context.setCookie() juste avant chaque run) et connecter Lighthouse
      en mode module (pas CLI) au port de debug de cette instance déjà
      ouverte. Point additionnel découvert : le refresh token
      (secritou_refresh) tourne avec détection de réutilisation
      (auth.service.ts) — poser le même token pour 2 pages successives
      du même rôle échoue (le premier run le consomme/rotate), un login
      frais est nécessaire par page.
  - id: SEC-094
    titre: >
      redisConnection.ts#getBullRedisConnection instancie un client
      ioredis (new Redis(...)) avec maxRetriesPerRequest:null et aucun
      retryStrategy borné, appelé au niveau module par queues.ts:19
      (const connection = getBullRedisConnection() — pas paresseux,
      s'exécute à l'import du fichier). Reproduit réellement : pointer
      REDIS_HOST/REDIS_PORT vers un hôte injoignable puis importer
      app.js (donc queues.ts transitivement) fait rester le process
      Node ouvert indéfiniment (connexions ioredis en retry perpétuel
      dans l'event loop) — un simple import, avant toute requête HTTP,
      a mesuré 10.3s avant de résoudre, puis empêché le process de test
      de se terminer proprement des dizaines de minutes après malgré
      des assertions déjà passées
    perimetre: transverse
    regle_violee: >
      Même principe que SEC-084 (une dépendance externe dont
      l'indisponibilité ne doit jamais bloquer indéfiniment), appliqué
      ici à un second client Redis distinct (ioredis via BullMQ) que
      SEC-083/084/085 n'avaient pas couvert — ces trois-là ne
      documentaient que redis.ts#getRedisClient (le package `redis`),
      pas redisConnection.ts#getBullRedisConnection (le package
      `ioredis`, utilisé uniquement par BullMQ).
    classe: ioredis-retry-non-borne-bloque-terminaison-process
    gravite: mineure
    statut: resolu
    critere_de_resolution: >
      getBullRedisConnection borne ses tentatives de connexion (ex.
      retryStrategy avec un nombre maximal de tentatives, ou
      connectTimeout explicite sur les options ioredis) au lieu de
      laisser maxRetriesPerRequest:null retenter indéfiniment sans
      jamais abandonner. Un test réel doit importer app.js (donc
      queues.ts) avec REDIS_HOST/REDIS_PORT pointant vers un hôte
      injoignable et vérifier que le process se termine proprement
      dans un délai borné, sans rester ouvert indéfiniment.
    correctif: >
      getBullRedisConnection passe désormais retryStrategy:
      boundedRetryStrategy (5 tentatives maximum, backoff jusqu'à 2s,
      puis abandon — return null) sur les deux branches (REDIS_URL et
      REDIS_HOST/PORT). maxRetriesPerRequest reste null délibérément
      (exigence réelle de BullMQ pour ses commandes bloquantes, non
      liée à ce défaut). Vérifié réellement : server/test/
      redisUnreachableEndToEnd.test.ts importe app.js (donc queues.ts)
      avec REDIS_HOST/REDIS_PORT/REDIS_URL pointés vers un vrai port
      fermé — le process se termine désormais proprement (exit 0,
      13.3s au total pour les 2 tests), contre un blocage de plusieurs
      dizaines de minutes avant ce correctif. En attente de CI verte
      sur ce commit avant passage à resolu.
    detecte_le: "2026-08-02"
    source: >
      Découverte incidente en écrivant un test end-to-end réel pour
      SEC-083 (GET /health/ready sous Redis injoignable) — le test
      lui-même bloquait des dizaines de minutes après que ses
      assertions avaient déjà réussi ; diagnostic par un fichier de
      test minimal isolant le seul import de app.js (sans aucune
      requête HTTP), confirmant 10.3s avant résolution de l'import puis
      un process qui ne se termine jamais. Lecture de
      redisConnection.ts et queues.ts confirmant l'appel non paresseux
      à getBullRedisConnection() au niveau module et
      maxRetriesPerRequest:null sans aucun retryStrategy.
    confiance: haute
    note: >
      Distinct de SEC-073 (déjà connue : les fichiers de test qui
      importent des services passant par jobs/queues.ts ne se
      terminent pas proprement en isolation) — SEC-073 documente le
      symptôme observable (le process de test ne se termine pas) sans
      identifier sa cause racine exacte ; SEC-094 documente cette cause
      racine précise (ioredis sans retry borné). Les deux seront
      probablement résolues par le même correctif.
  - id: SEC-093
    titre: >
      GlobalSearch.tsx (barre de recherche globale du header AdminLayout)
      utilise une largeur fixe insuffisante sur mobile — sur un viewport
      iPhone 12 (390px), le champ mesure réellement 214px (bounding box
      Playwright confirmée) pour afficher le placeholder FR "Rechercher
      les leads, clients, projets..." (37 caractères), qui déborde
      visuellement et se retrouve coupé net par les icônes
      notification/avatar juste à droite (aucun gap, aucune troncature
      CSS propre type text-overflow:ellipsis visible sur la capture),
      rendant le champ illisible sur mobile
    perimetre: transverse
    regle_violee: >
      Aucune règle métier écrite — attente UX du mandat QA (Phase 2
      point 5, responsive desktop+mobile) : un champ de saisie visible
      doit rester lisible à toute largeur d'écran supportée, pas
      seulement ne pas provoquer de débordement horizontal de page (ce
      dernier point est confirmé sain par ailleurs).
    classe: responsive-champ-trop-etroit-pour-placeholder
    gravite: mineure
    statut: resolu
    critere_de_resolution: >
      Sur un viewport de 390px (iPhone 12), le champ de recherche
      globale affiche son placeholder sans troncature visuelle brutale
      — soit via une largeur relative plus généreuse (moins de contrainte
      max-w sur mobile), soit via un placeholder raccourci sur petit
      écran, soit via un vrai text-overflow:ellipsis. Un test réel doit
      mesurer la bounding box du champ sur ce viewport et vérifier
      qu'elle laisse la place au texte du placeholder réel (pas un texte
      de test raccourci).
    correctif: >
      Diagnostic affiné avant correction : 214px n'était pas une
      contrainte de max-w injustifiée mais l'espace réellement
      disponible dans le header à ce viewport (390px - padding - gap -
      bouton menu - icônes droite = 214px, confirmé par mesure DOM
      réelle des enfants du header) — agrandir le conteneur était donc
      impossible sans réduire les autres éléments. Le vrai correctif :
      placeholder raccourci ("Rechercher..." / "Search...") dans les
      deux locales, qui tient dans l'espace réel disponible même au
      viewport le plus étroit testé (320px). AdminLayout.tsx's wrapper
      passé de max-w-sm fixe à min-w-0 sm:max-w-sm (n'a plus d'effet sur
      mobile mais évite un futur overflow si le header change).
      Confirmé réellement via Playwright : measureText du placeholder
      réel vs espace disponible (canvas 2D), textFits:true sur 320px/
      390px/1440px. Test unitaire GlobalSearch.test.tsx déjà existant
      (accessible-name via i18n.t dynamique) reste vert sans
      modification, confirmant qu'il ne recopiait pas le texte en dur.
    detecte_le: "2026-08-01"
    source: >
      Phase 2 point 5 du mandat QA (responsive desktop+mobile) —
      Playwright réinstallé proprement dans cette session (cache
      ms-playwright supprimé et retéléchargé, résolvant un blocage
      antérieur "Invalid file descriptor to ICU data received").
      Contexte réel iPhone 12 (devices Playwright), login admin réel,
      capture d'écran + mesure programmatique de la bounding box du
      champ de recherche (x:64, width:214, viewport width:390) sur
      /app (dashboard).
    confiance: haute
    note: >
      Distinct de tout défaut de débordement de page — document.
      documentElement.scrollWidth <= clientWidth est confirmé vrai (pas
      de scroll horizontal) sur toutes les pages testées ; c'est un
      défaut interne à un seul composant, pas un défaut de layout
      global.
  - id: SEC-091
    titre: >
      /app/booking (BookingAdminPage.tsx) n'a aucune garde de route par
      rôle — accessible en render direct par URL à un MANAGER connecté
      malgré adminOnly:true sur l'item de menu correspondant
      (AdminLayout.tsx:63, qui masque seulement le lien, pas la route
      elle-même). Reproduit réellement : GET /booking/admin/slots avec un
      token MANAGER réel retourne 403 (Insufficient permissions) côté
      backend — aucune fuite de données — mais BookingAdminPage.tsx
      n'inspecte jamais le rôle ni la réponse 403 pour rediriger ou
      bloquer l'affichage, se contentant d'un toast d'erreur générique
      ("Impossible de charger les réservations.") sur chaque requête
      échouée, laissant la coquille de page (layout, formulaires vides)
      visible à un rôle qui n'a jamais accès aux données réelles
    perimetre: transverse
    regle_violee: >
      Cohérence UI/backend attendue par le mandat QA (Phase 2 point 7) :
      aucune page accessible ne doit exposer une coquille vide/en erreur
      à un rôle qui n'a jamais accès aux données réelles — soit la route
      est gardée (redirection), soit la page distingue "vide" de "accès
      refusé" et agit en conséquence.
    classe: garde-route-frontend-absente-menu-seul-filtre
    gravite: mineure
    statut: resolu
    critere_de_resolution: >
      Un MANAGER connecté qui navigue directement vers /app/booking (URL
      tapée à la main, pas via le menu) est soit redirigé (comme le fait
      déjà ProtectedRoute pour les routes FREELANCER hors allowlist),
      soit voit une page d'accès refusé explicite — jamais la coquille
      de formulaire avec un toast d'erreur générique. Un test réel doit
      naviguer directement vers cette URL avec un compte MANAGER et
      vérifier l'absence de la coquille de formulaire.
    correctif: >
      ProtectedRoute.tsx étendu avec un bloc MANAGER symétrique au bloc
      FREELANCER déjà existant : une liste adminOnlyRoutes (["/app/
      booking"]) redirige vers /app si le MANAGER tente d'y accéder.
      Vérifié réellement via Playwright (login MANAGER réel, navigation
      directe vers /app/booking, URL finale confirmée /app) et via 2
      nouveaux tests Vitest dans ProtectedRoute.test.tsx (redirection
      MANAGER sur booking + non-régression sur commissions, non
      concerné). En attente de commit + CI verte avant passage à resolu
      (doctrine du registre : un correctif non commité reste en_cours).
    detecte_le: "2026-08-01"
    source: >
      Phase 2 point 2 du mandat QA ("accès direct par URL testé, pas
      seulement via le menu") — reproduction réelle : login MANAGER réel
      (manager@secritou.tn), GET /booking/admin/slots avec le token
      obtenu confirme 403 réel côté backend ; lecture de
      BookingAdminPage.tsx confirme l'absence de toute vérification de
      rôle ou de gestion spécifique d'une réponse 403 (seul un toast
      générique existe pour chaque mutation/lecture en échec).
    confiance: haute
    note: >
      Distinct de tout défaut RBAC backend (qui, lui, fonctionne
      correctement — 403 réel confirmé) : c'est un défaut de cohérence
      UI, la seule route de tout le menu marquée adminOnly:true sans
      qu'aucune garde de route ou logique de rôle interne à la page ne
      la double, contrairement à CommissionsPage.tsx qui, elle, adapte
      correctement sa requête selon isManager.
  - id: SEC-089
    titre: >
      Au moins 14 champs texte à travers shared/src/schemas/*.ts (Lead.name,
      Client.name, Document.name/title, Invoice.description/number/title,
      CreditNote.reason, Project.name, Proposal.title, Task.title/content,
      User.name, entre autres) valident via z.string().min(1) sans
      .trim() — une chaîne composée uniquement d'espaces passe la
      validation de longueur (min(1) compte les caractères bruts, pas le
      contenu après trim). Reproduit réellement sur 2 modules distincts
      via l'API réelle : POST /leads {"name":"   "} → 201, POST /clients
      {"name":"   "} → 201 — deux enregistrements visuellement vides
      créés avec succès, invisibles dans toute liste/recherche basée sur
      le nom
    perimetre: transverse
    regle_violee: >
      Aucune règle métier — défaut de robustesse de validation. L'esprit
      de min(1) ("un nom ne peut pas être vide") n'est pas respecté par
      son implémentation, qui ne rejette que la chaîne vide au sens
      strict, pas son équivalent visuel.
    classe: validation-min-sans-trim-contournement-espaces
    gravite: mineure
    statut: resolu
    critere_de_resolution: >
      Les champs concernés utilisent z.string().trim().min(1) (Zod
      trim() transforme la valeur avant validation de longueur, donc
      "   " devient "" et échoue min(1)) — pas seulement Lead.name et
      Client.name testés ici, mais l'ensemble des ~14 champs identifiés
      par grep sur shared/src/schemas/*.ts. Un test réel doit couvrir au
      moins 3 modules distincts (pas seulement les 2 déjà confirmés) et
      vérifier qu'un nom "   " est bien rejeté 422, jamais accepté 201.
    correctif: >
      .trim() ajouté avant .min(1) sur les 14 champs texte libre
      identifiés (client.schema.ts, document.schema.ts,
      invoice.schema.ts, lead.schema.ts, project.schema.ts,
      proposal.schema.ts, task.schema.ts, user.schema.ts,
      clientOnboarding.schema.ts) — task.projectId et user.serviceId
      délibérément exclus (identifiants, pas du texte affiché, un espace
      autour les invaliderait déjà comme UUID). Vérifié réellement,
      re-testant les 2 cas exacts de la découverte : POST /leads
      {"name":"   "} et POST /clients {"name":"   "} répondent désormais
      422 (Validation failed, "String must contain at least 1
      character(s)") au lieu de 201. 783/785 tests server verts (seul
      échec : SEC-069, pré-existant, sans rapport). En attente de
      commit + CI verte avant passage à resolu.
    detecte_le: "2026-08-01"
    source: >
      Phase 1, point 6 du mandat QA (validation Zod cas limites) —
      reproduit réellement contre un serveur réel : POST /leads avec
      name:"   " → 201 (enregistrement créé, confirmé par relecture
      directe en base), POST /clients avec name:"   " → 201 (idem). Grep
      sur shared/src/schemas/*.ts confirmant le motif répété sur au moins
      14 champs distincts à travers Lead/Client/Document/Invoice/
      CreditNote/Project/Proposal/Task/User.
    confiance: haute
    note: >
      Aucun risque de sécurité direct (pas d'injection, Prisma paramétrise
      systématiquement — confirmé par un test séparé avec un nom contenant
      un payload SQL littéral, stocké tel quel sans effet). Impact
      purement fonctionnel/UX : des enregistrements "vides" mais valides
      selon le serveur, qui cassent silencieusement l'affichage et la
      recherche côté utilisateur final. Le cas Project.name n'a pas pu
      être confirmé dans cette session (createProjectSchema exige aussi
      proposalId, absent du payload de test, donc le rejet 422 observé
      là ne prouve ni n'infirme le même défaut sur ce champ précis — à
      retester avec un payload complet si le porteur veut confirmation
      module par module).

  - id: SEC-087
    titre: >
      Les 4 fonctions de server/src/cache/cacheService.ts (cacheGet,
      cacheSet, cacheDel, invalidateTags) catchent silencieusement toute
      erreur (échec Redis, timeout, exception) sans jamais appeler
      logger.warn/logger.error — contrairement à getRedisClient
      lui-même (src/cache/redis.ts:31, qui journalise via
      .on("error", ...)), une panne DANS un appel de commande Redis
      (redis.get/set/del/sMembers échouant après une connexion déjà
      établie, ou toute exception levée avant que le listener d'erreur
      ne s'applique) ne laisse absolument aucune trace exploitable —
      aggrave directement le diagnostic de SEC-084/SEC-085 : un opérateur
      qui verrait des requêtes lentes/bloquées ou des rejets
      d'authentification n'aurait aucune ligne de log pointant vers "les
      appels de cache échouent silencieusement" comme cause
    perimetre: transverse
    regle_violee: >
      Cohérence avec le reste du dépôt : tout autre point d'échec Redis
      déjà audité journalise via logger (getRedisClient#on("error"),
      jobs/queues.ts#enqueueNotification/enqueueEmail avec
      logger.error). cacheService.ts est la seule couche d'accès Redis
      qui n'en fait rien.
    classe: erreur-cache-avalee-sans-log
    gravite: mineure
    statut: resolu
    note_resolution: >
      Correctif commité (df96117) : logger.warn ajouté aux 4 fonctions,
      contexte clé/tags inclus, comportement fonctionnel inchangé
      (best-effort préservé, jamais de throw). Test réel dans
      redisUnreachableEndToEnd.test.ts (même méthode que SEC-083/084/085
      — Redis réellement injoignable via port fermé, pas un mock ; seul
      logger.warn est mocké pour observer l'émission) : GET
      /dashboard/full déclenche cacheGet+cacheSet contre Redis
      indisponible, vérifie l'émission réelle du warning avec l'erreur
      en contexte. 3/3 tests verts en isolation. CI verte confirmée :
      run GitHub Actions 31184201796, tous jobs success (dont "server").
    critere_de_resolution: >
      Chaque catch de cacheGet/cacheSet/cacheDel/invalidateTags appelle
      logger.warn({ err, key/tags }, "[cache] <opération> failed") avant
      de retomber sur son comportement dégradé actuel (return
      null/undefined) — le comportement fonctionnel ne change pas
      (dégradation silencieuse pour l'utilisateur final reste
      intentionnelle), seule l'observabilité opérateur est ajoutée. Un
      test réel doit simuler un échec Redis (mock ou arrêt réel) et
      vérifier qu'un logger.warn/error est bien appelé pour chacune des 4
      fonctions.
    detecte_le: "2026-08-01"
    source: >
      Phase 1, item 13 du mandat QA (tests des logs, erreurs
      significatives bien journalisées) — lecture directe de
      server/src/cache/cacheService.ts pendant l'audit transverse,
      comparaison avec getRedisClient/jobs/queues.ts qui journalisent
      systématiquement leurs propres échecs Redis.
    confiance: haute
    note: >
      Découvert en creusant la même zone de code que SEC-083/084/085
      (résilience Redis) — pas un doublon : ces 3-là décrivent des
      défaillances fonctionnelles réelles (crash, hang, faux 401),
      celui-ci décrit l'absence de log qui aurait permis de diagnostiquer
      plus vite n'importe laquelle des trois en conditions réelles.

  - id: SEC-086
    titre: >
      looksLikePlainText (server/src/services/upload.service.ts:47-54),
      seule vérification appliquée aux types déclarés sans signature
      magique (NO_MAGIC_BYTES_MIME, dont text/plain), ne détecte que des
      octets binaires (nul, contrôle) — n'importe quel contenu HTML/JS
      valide en texte imprimable la passe trivialement. Reproduit
      réellement contre un serveur réel : upload d'un fichier HTML
      contenant un script, déclaré Content-Type: text/plain, filename
      notes.txt — accepté (201), stocké et re-servi tel quel par MinIO.
      Sévérité limitée par 2 mitigations déjà en place : le fichier est
      reservi avec Content-Type: text/plain réel (pas text/html, donc
      pas d'exécution du script par un navigateur qui le charge
      directement), et le frontend (ex. DocumentsClientPage.tsx) utilise
      a.download/target=_blank pour forcer un téléchargement plutôt
      qu'un rendu inline
    perimetre: transverse
    regle_violee: >
      L'intention explicite du code (commentaire "Verify actual file
      content matches declared type (defense against spoofed
      Content-Type)", upload.service.ts:181) est de vérifier le contenu
      réel, pas seulement l'absence d'octets binaires — le garde-fou
      couvre l'objectif "ce n'est pas un fichier binaire déguisé" mais
      pas "ce n'est pas un fichier HTML/script déguisé en texte", qui
      est le vecteur XSS réel visé par l'item 9 du mandat QA.
    classe: upload-bypass-verification-contenu-texte-libre
    gravite: mineure
    statut: resolu
    note_resolution: >
      Correctif commité (199c23e) : looksLikeHtmlOrScript ajoutée
      (détection ciblée <script>, <iframe>, gestionnaires on*= inline —
      pas de dépendance de sanitization HTML complète), branchée sur le
      chemin text/plain, HttpError 415. Test HTTP réel
      (uploadRejectsHtmlDisguisedAsText.http.test.ts, contre l'app
      Express + MinIO réels) : <script> → 415, onerror= → 415, texte
      légitime → 201 non-régression. 3/3 tests verts en isolation. CI
      verte confirmée : run GitHub Actions 31184201796, tous jobs
      success (dont "server").
    critere_de_resolution: >
      looksLikePlainText (ou une vérification additionnelle appliquée
      spécifiquement à text/plain) rejette un contenu qui ressemble à du
      HTML/script exécutable (présence de balises &lt;script&gt;,
      &lt;iframe&gt;, gestionnaires d'évènements inline on*=, ou utilise
      une bibliothèque de détection dédiée) — pas seulement l'absence
      d'octets de contrôle. Un test réel doit uploader un contenu HTML
      avec un &lt;script&gt; déclaré text/plain et vérifier un rejet 415,
      pas un 201.
    detecte_le: "2026-08-01"
    source: >
      Phase 1, item 9 du mandat QA (upload malveillant, extension
      déguisée) — reproduit sur un vrai serveur npm run dev réel + MinIO
      réel : POST /upload/document avec un fichier
      "&lt;html&gt;&lt;body&gt;&lt;script&gt;alert('stored XSS via upload')&lt;/script&gt;&lt;/body&gt;&lt;/html&gt;"
      déclaré Content-Type: text/plain, filename notes.txt — 201 réel,
      fichier confirmé accessible en lecture avec Content-Type: text/plain
      (vérifié via curl -I sur l'URL MinIO signée retournée), supprimé
      après vérification.
    confiance: haute
    note: >
      Testé et confirmé AVANT ce cas : une tentative de contournement
      plus directe (fichier HTML déclaré Content-Type: application/pdf)
      a été correctement rejetée (415 "Could not verify file content for
      declared type") — fileTypeFromBuffer (magic bytes) fonctionne
      comme conçu pour tous les types signés (PDF, images, Office, zip).
      Le contournement ne fonctionne que sur l'exception NO_MAGIC_BYTES_MIME
      (text/plain), qui n'a par construction aucune signature à vérifier
      — gravité mineure précisément parce que les deux mitigations
      décrites ci-dessus (Content-Type réel au service, téléchargement
      forcé côté client) neutralisent l'exploitation directe par
      navigateur dans l'état actuel du frontend.

  - id: SEC-085
    titre: >
      authDenylist.isAccessTokenRevoked (server/src/cache/authDenylist.ts:51-56)
      appelle getRedisClient() sans try/catch — si Redis est simplement
      injoignable (conteneur arrêté, ECONNREFUSED immédiat, pas
      seulement le cas mid-connexion de SEC-084), getRedisClient()
      rejette (aucun try/catch autour de next.connect() dans
      redis.ts#getRedisClient), la rejection remonte jusqu'au catch générique
      de authenticate (auth.middleware.ts:32-34), qui la transforme en
      HttpError(401, "Invalid or expired token") — indiscernable pour
      l'utilisateur d'un vrai token expiré/invalide. Reproduit réellement :
      conteneur Redis arrêté proprement (pas en cours de redémarrage),
      token JWT fraîchement émis et valide, requête authentifiée rejetée
      401 en ~5s (ECONNREFUSED, pas un hang) — CHAQUE requête
      authentifiée de l'application échoue de la même façon tant que
      Redis reste indisponible, pas seulement les écritures passant par
      invalidateTags
    perimetre: transverse
    regle_violee: >
      Le denylist Redis est une protection défensive additionnelle
      (revocation immédiate avant expiration naturelle du JWT), pas le
      mécanisme d'authentification principal (la signature/expiration du
      JWT le sont) — son indisponibilité ne doit jamais empêcher un JWT
      par ailleurs valide d'être accepté. Le code actuel inverse cette
      priorité : une panne d'une protection secondaire bloque le
      mécanisme principal.
    classe: authentification-faussement-rejetee-si-redis-indisponible
    gravite: eleve
    statut: resolu
    critere_de_resolution: >
      isAccessTokenRevoked catche l'échec de getRedisClient()/next.connect()
      et retombe sur son comportement déjà existant pour "pas de client"
      (return false — cf. la ligne if (!redis) return false juste après)
      plutôt que de laisser l'exception se propager. Un JWT valide doit
      continuer à être accepté quand Redis est injoignable (dégradation
      : la révocation immédiate cesse de fonctionner tant que Redis est
      down, mais l'authentification normale continue). Un test réel doit
      arrêter Redis, présenter un token JWT valide et non révoqué, et
      vérifier un 200 sur une route protégée, pas un 401.
    correctif: >
      isAccessTokenRevoked (authDenylist.ts) enveloppe désormais l'appel
      à getRedisClient() dans un try/catch, retombant sur return false
      (même comportement que le cas "pas de client" déjà existant) si
      l'appel rejette. Vérifié réellement dans les 2 scénarios les plus
      difficiles : (1) conteneur Redis jamais joignable dès le départ —
      GET /leads avec un JWT valide répond 200 en 74ms ; (2) conteneur
      arrêté PENDANT qu'une connexion Redis était déjà établie (le
      client partagé avait isOpen:true, socket coupée après coup) — même
      requête répond 200 en 5.05s (le socketTimeout ajouté sous SEC-084,
      dont ce fix dépend). 783/785 tests server verts (seul échec :
      SEC-069, pré-existant, sans rapport).

      Test permanent ajouté : server/test/redisUnreachableEndToEnd.test.ts
      (step CI dédié) — GET /leads avec un vrai JWT valide contre le
      vrai app.js répond réellement 200 en 371ms malgré Redis
      réellement injoignable (port fermé). En attente de CI verte sur
      ce commit avant passage à resolu.
    detecte_le: "2026-08-01"
    source: >
      Phase 1, item 12 du mandat QA (résilience Redis/BullMQ) — reproduit
      sur un vrai serveur npm run dev réel : docker stop saas-redis-1
      (arrêt propre, pas en cours de redémarrage), login réussi (JWT
      valide émis), requête authentifiée sur une route protégée
      (POST /invoices/:id/send) rejetée 401 "Invalid or expired token"
      en ~5s — log serveur confirmant ECONNREFUSED sur 127.0.0.1:6379
      remontée jusqu'au catch de authenticate.
    confiance: haute
    note: >
      Découvert en creusant pourquoi une requête utilisant un token
      fraîchement émis échouait pendant un test de résilience BullMQ —
      pas le symptôme initialement recherché (résilience de
      l'enfilement de jobs), mais un défaut plus large et plus grave
      trouvé en chemin : Redis down = authentification cassée pour
      TOUTE l'application, pas seulement les écritures avec cache. Impact
      pratique bien plus large que SEC-084 (qui exige un timing précis de
      redémarrage) : une simple panne Redis ordinaire, sans aucune
      subtilité de timing, suffit à déclencher celui-ci.

  - id: SEC-084
    titre: >
      getRedisClient (server/src/cache/redis.ts:24-39) n'a aucun timeout
      sur next.connect() ni sur le reconnectStrategy par défaut du client
      redis v4 — si l'appel de connexion est en cours au moment où Redis
      devient injoignable (conteneur arrêté), la promesse
      connecting/next.connect() ne se résout ni ne rejette jamais.
      Reproduit réellement : POST /clients déclenche
      invalidateTags -> getRedisClient() pendant un redémarrage réel du
      conteneur Redis — la requête HTTP reste bloquée indéfiniment
      (aucune réponse après plus d'une minute, y compris après le retour
      de Redis à un état sain), alors que TOUTE requête suivante sur le
      même process réussit normalement en millisecondes (un nouvel appel
      crée une nouvelle promesse connecting, la précédente reste orpheline
      pour toujours). Écriture DB déjà commitée (le Client est bien créé
      en base) mais le client HTTP n'obtient jamais de réponse
    perimetre: transverse
    regle_violee: >
      Toute dépendance externe optionnelle (le cache Redis n'est pas
      requis pour la correction fonctionnelle — getRedisClient() renvoie
      déjà null proprement si CACHE_ENABLED est faux) doit échouer vite,
      jamais bloquer indéfiniment une requête dont l'effet métier
      principal (l'écriture DB) a déjà réussi.
    classe: redis-connect-sans-timeout-requete-orpheline
    gravite: eleve
    statut: resolu
    critere_de_resolution: >
      getRedisClient borne next.connect() par un timeout explicite (ex.
      Promise.race avec un délai de quelques secondes, ou
      socket.connectTimeout du client redis) — au-delà, la promesse
      connecting rejette, invalidateTags/cacheGet/cacheSet catchent déjà
      cette rejection (try/catch existant) et la requête HTTP répond
      normalement sans le cache. Un test réel doit : arrêter le
      conteneur Redis pendant qu'une requête déclenchant invalidateTags
      est en cours d'envoi, et vérifier que cette requête reçoit une
      réponse HTTP dans un délai borné (quelques secondes), pas un hang
      indéfini.
    correctif: >
      3 changements dans redis.ts, découverts nécessaires par
      itération sur des reproductions réelles (le premier essai,
      connectTimeout seul, ne suffisait pas) : (1) socket.connectTimeout
      (5s) sur buildClient — borne la première tentative de connexion ;
      (2) socket.reconnectStrategy: false — sans ce réglage, le
      reconnectStrategy par défaut du client redis v6 retry indéfiniment
      en arrière-plan après un échec, empêchant connect() de jamais
      rejeter malgré le connectTimeout (confirmé : sans ce réglage, un
      appel contre un conteneur arrêté ne s'est ni résolu ni rejeté
      après plusieurs minutes d'observation réelle) ; (3) le bloc
      connecting = (async () => {...})() enveloppe désormais son corps
      dans try/finally { connecting = null } — sans ça, une promesse
      rejetée restait la valeur de connecting pour toujours, chaque
      appel suivant re-attendant (et re-rejetant depuis) cette même
      tentative périmée au lieu d'en retenter une nouvelle une fois
      Redis redevenu joignable. Un 4e ajout, socket.socketTimeout (5s),
      couvre un second scénario distinct découvert en testant : un
      client déjà connecté (isOpen resté true) dont la socket meurt
      après coup (conteneur arrêté PENDANT l'usage, pas avant) — sans
      lui, une commande envoyée à cette socket morte restait bloquée
      indéfiniment malgré connectTimeout/reconnectStrategy (qui ne
      s'appliquent qu'à connect(), jamais aux commandes). Vérifié
      réellement dans les 2 scénarios : requête HTTP réelle répond en
      ~5s (503/dégradé) dans les deux cas au lieu de ne jamais répondre,
      confirmé stable sur plusieurs appels consécutifs, process jamais
      tombé. 783/785 tests server verts (seul échec : SEC-069,
      pré-existant, sans rapport — les 6 échecs commissionService/
      taskService observés en cours de route étaient une pollution de
      données de test antérieure — 3 comptes ADMIN de test jamais
      nettoyés d'une session précédente rendant SEC-038 réel — pas une
      régression de ce correctif ; confirmé en supprimant ces comptes
      et en re-exécutant).

      2 tests permanents ajoutés : server/test/redisClientResilienceConfig.test.ts
      (câblé dans run-all.test.ts — un vrai client redis avec exactement
      la config buildClient() contre un vrai port fermé, connect()
      rejette en 43ms) et server/test/redisUnreachableEndToEnd.test.ts
      (step CI dédié — la vraie route HTTP /health/ready via un vrai
      app.js contre Redis réellement injoignable, 503 en 33ms). En
      attente de CI verte sur ce commit avant passage à resolu.
    detecte_le: "2026-08-01"
    source: >
      Phase 1, item 12 du mandat QA (résilience Redis/BullMQ, arrêt réel
      du conteneur) — reproduit sur un vrai serveur npm run dev réel :
      POST /api/v1/clients (Content-Type JSON, token ADMIN réel) envoyé
      pendant que le conteneur saas-redis-1 était en cours de
      redémarrage (docker stop puis docker start entre l'envoi de la
      requête et sa résolution) — confirmé par grep sur l'id de requête
      exact dans les logs serveur (aucune ligne de complétion morgan
      jamais apparue pour cette requête précise), alors qu'une requête
      identique envoyée après stabilisation complète a répondu en 18ms
      avec un vrai 201.
    confiance: haute
    note: >
      Distinct de SEC-083 (même racine défensive absente — aucun timeout
      de connexion Redis — mais site de code et mécanisme de défaillance
      différents) : SEC-083 fait planter tout le process (createClient
      ad hoc sans listener d'erreur dans /health/ready), SEC-084 fait
      pendre une seule requête indéfiniment sans jamais planter le
      process ni affecter les autres requêtes (getRedisClient partagé,
      avec listener d'erreur, mais sans timeout de connexion). Les deux
      partagent la même cause de fond (aucun code de ce dépôt ne borne
      jamais un appel de connexion Redis dans le temps) et pourraient
      être corrigés par le même mécanisme central si le porteur le
      souhaite — laissé comme deux constats séparés ici, décision de
      correctif groupé ou non à trancher par le porteur.

  - id: SEC-083
    titre: >
      GET /health/ready (server/src/routes/index.ts:109-138) crée un
      NOUVEAU client Redis ad hoc (createClient) à CHAQUE appel, sans
      jamais attacher de listener .on("error", ...) — contrairement au
      client Redis partagé (src/cache/redis.ts:31) qui en a un. Un
      EventEmitter Node qui émet "error" sans listener attaché lève une
      exception non catchée qui fait planter tout le process — reproduit
      réellement : conteneur Redis arrêté puis redémarré pendant qu'un
      appel à /health/ready était en cours de connexion → ECONNRESET sur
      le socket Redis ad hoc → process Node entier terminé, plus aucune
      route ne répond, y compris pour tous les autres utilisateurs
      connectés au même moment. Aggravé par l'absence de tout timeout de
      connexion (aucun socket.connectTimeout ni reconnectStrategy:false)
      — un Redis injoignable fait aussi rester GET /health/ready bloqué
      indéfiniment (pas de réponse rapide 503) avant même d'atteindre le
      cas de crash
    perimetre: transverse
    regle_violee: >
      Le point même d'un healthcheck de disponibilité est de ne jamais
      lui-même devenir un point de défaillance — un GET /health/ready
      qui peut faire tomber tout le serveur pour tout le monde est
      l'inverse exact de sa fonction. Cohérence attendue avec le client
      Redis partagé (src/cache/redis.ts), qui attache déjà un listener
      d'erreur pour cette raison précise.
    classe: healthcheck-crash-process-entier
    gravite: bloquant
    statut: resolu
    critere_de_resolution: >
      GET /health/ready n'utilise plus un createClient ad hoc par appel
      — soit il réutilise getRedisClient() (le client partagé, déjà
      protégé par .on("error", ...) et par le no-op sur CACHE_ENABLED
      absent), soit tout createClient ad hoc restant attache
      explicitement .on("error", () => {}) avant tout .connect(), ET un
      socket.connectTimeout borné (quelques secondes) pour ne jamais
      bloquer indéfiniment. Un test réel doit : (1) arrêter le conteneur
      Redis, appeler GET /health/ready, vérifier une réponse rapide
      (quelques secondes max) avec checks.redis:"error", status "degraded"
      — jamais un timeout HTTP ni un crash process ; (2) confirmer par un
      arrêt du conteneur PENDANT une connexion en cours (scénario exact de
      cette anomalie) que le process survit.
    correctif: >
      Option retenue : GET /health/ready réutilise désormais
      getRedisClient() (le client partagé de redis.ts, déjà doté d'un
      .on("error", ...) et, depuis le correctif SEC-084 ci-dessus, d'un
      connectTimeout+reconnectStrategy:false+socketTimeout) au lieu de
      créer un createClient ad hoc par appel — plus jamais de client
      sans listener d'erreur, et .quit() n'est plus appelé (le client
      partagé reste vivant pour le reste de l'app). Vérifié réellement
      dans les 2 scénarios exigés par le critère de résolution : (1)
      conteneur arrêté puis appels répétés (×3) — chacun répond en ~5s
      exactement, 503 degraded, checks.redis:"error", process confirmé
      vivant après chaque appel (GET /health répond toujours) ; (2)
      conteneur arrêté PENDANT qu'une connexion était déjà établie
      (scénario exact de la découverte originale) — même résultat, 5s,
      503, process vivant, plus aucun ECONNRESET non catché. 783/785
      tests server verts (seul échec : SEC-069, pré-existant, sans
      rapport).

      Test permanent ajouté : server/test/redisUnreachableEndToEnd.test.ts,
      exécuté par un step CI dédié (pas run-all.test.ts — REDIS_HOST/
      REDIS_PORT/REDIS_URL sont un singleton partagé process-wide,
      pointer un port fermé dans l'agrégateur casserait tous les autres
      tests Redis). Ce fichier appelle réellement app.js (pas une
      réimplémentation) avec REDIS_URL/REDIS_HOST/REDIS_PORT pointés
      vers un vrai port fermé (bind+close d'un port éphémère, pas un
      port fixe — un port fixe bas comme 1 s'est révélé bloqué de façon
      non déterministe par le pare-feu Windows en local) : confirme
      réellement GET /health/ready -> 503 en 33ms et GET /leads avec un
      JWT valide -> 200 malgré Redis injoignable, sans exception ni
      hang. A d'abord échoué à cause de SEC-094 (découverte en écrivant
      ce test), corrigée avant de pouvoir le faire passer. En attente
      de CI verte sur ce commit avant passage à resolu.
    detecte_le: "2026-08-01"
    source: >
      Phase 1, item 12 du mandat QA explicitement demandé par le porteur
      (tests de résilience Redis/BullMQ, arrêt réel du conteneur) —
      reproduit sur un vrai serveur npm run dev réel (pas un mock) :
      docker stop saas-redis-1 pendant que le process tournait,
      GET /health/ready resté bloqué (pas de réponse), docker start
      saas-redis-1 pendant que la connexion ad hoc précédente tentait
      encore de se connecter → ECONNRESET non catché dans le log serveur
      → process terminé, confirmé par `tasklist` (PID disparu) et par
      GET /health (liveness, aucune dépendance Redis) devenu lui aussi
      inaccessible juste après.
    confiance: haute
    note: >
      Découvert en testant la résilience — a réellement fait tomber un
      serveur de développement local pendant cette session (process sur
      le port 5000, relancé par obligation après incident signalé au
      porteur). Gravité "bloquant" : ce n'est pas un endpoint secondaire,
      c'est littéralement le healthcheck qu'un orchestrateur (Docker
      healthcheck, load balancer) interroge en boucle pour décider si le
      service est sain — un Redis qui a un hoquet momentané (redémarrage,
      failover) peut donc faire planter le serveur applicatif entier au
      moment précis où on voudrait qu'il survive et signale juste
      "degraded".

  - id: SEC-074
    titre: >
      npm run test:coverage --workspace=server échoue de façon non
      déterministe sur cette machine de dev locale (6 à 8 tests différents
      à chaque exécution, jamais les mêmes) avec l'erreur "Timed out
      fetching a new connection from the connection pool" / "Prisma
      Accelerate has built-in connection pooling to prevent such errors"
      — un épuisement du pool de connexions Postgres local (limite par
      défaut num_cpus*2+1, aucun connection_limit explicite dans
      DATABASE_URL), pas une régression du code testé. Confirmé
      pré-existant : le même épuisement se reproduit à l'identique sur le
      commit précédant toute la session du 2026-08-01 (avant le câblage
      SEC-071 et la réécriture SEC-072), donc n'est causé par aucun
      changement de cette session
    perimetre: transverse
    regle_violee: >
      Aucune règle métier — fiabilité de l'environnement de test local.
      Une porte CI dont le résultat dépend de la charge concurrente
      instantanée plutôt que du code testé produit des faux rouges
      (perte de confiance dans "rouge = régression réelle") et des faux
      verts (une exécution chanceuse masque un vrai défaut si l'un des
      tests concernés couvrait justement un cas réel).
    classe: fiabilite-suite-test-locale-pool-connexions
    gravite: mineure
    statut: resolu
    note_resolution: >
      connect_timeout=30&pool_timeout=30 ajouté à DATABASE_URL, même
      correctif déjà appliqué côté CI. Documenté dans server/.env.example
