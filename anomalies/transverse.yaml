# Registre des anomalies — Secritou
#
# Ce fichier fait partie du registre éclaté (voir CLAUDE.md § « Procédure
# d'audit obligatoire »). Schéma par anomalie : id, titre, perimetre,
# regle_violee, classe, gravite, statut, critere_de_resolution, detecte_le,
# source, confiance, note.
# Ne jamais reformuler un titre existant — citer l'ID.
#
# Périmètre : Transverse (hors modules §4 — CI/infra, docs, RGPD, i18n global, design system, observabilité)
# 6 anomalie(s) — registre remis à zéro le 2026-07-27, historique réel
# archivé sur la branche locale archive/anomalies-avant-reset (commit 3c03297).
# +1 le 2026-07-30 (audit B). +1 le 2026-07-30 (découverte incidente en
# corrigeant SEC-032). +1 le 2026-07-30 (découverte incidente en
# contre-vérifiant le nettoyage du module 4.11). +1 le 2026-07-31
# (comparaison search.service.ts vs aiTools.ts demandée par le porteur).
# +2 le 2026-08-01 (Phase 0 de l'audit QA complet — audit de la porte CI
# réelle server/test/run-all.test.ts contre les fichiers *.test.ts
# existant réellement sur disque sous server/test/). +1 le 2026-08-01
# (découverte incidente en exécutant isolément les 5 fichiers de
# SEC-071 avant câblage, sur demande explicite du porteur). +1 le
# 2026-08-01 (découverte incidente en relançant npm run test:coverage
# après câblage SEC-071/réécriture SEC-072, pour confirmer la CI verte
# avant commit). +3 le 2026-08-01 (test de résilience Redis/BullMQ,
# item 12 du mandat QA, arrêt réel du conteneur Redis). +1 le 2026-08-01
# (item 9 du mandat QA, upload malveillant/extension déguisée). +1 le
# 2026-08-01 (item 13 du mandat QA, audit des logs). +1 le 2026-08-01
# (item 6 du mandat QA, cas limites de validation Zod). +1 le
# 2026-08-01 (Phase 2 point 2 du mandat QA, accès direct par URL testé
# au-delà du seul menu). +1 le 2026-08-01 (Phase 2 point 5, responsive
# mobile réel via Playwright une fois le navigateur réinstallé). +1 le
# 2026-08-02 (découverte incidente en écrivant un test end-to-end
# pour SEC-083, demande explicite du porteur d'écrire les tests
# manquants avant de clore le registre). +3 le 2026-08-03 (formalisation
# du backlog post-lancement en dette technique tracée, demande explicite
# du porteur avant validation du GO définitif — Lighthouse, WCAG formel,
# catégorie H — statut gelé avec déclencheur de réexamen écrit, même
# doctrine que SEC-070). +1 le 2026-08-03 (découverte incidente en
# vérifiant par axe-core les 4 corrections SEC-095/096 autorisées par le
# porteur — badge de notification non lue manqué au premier scan car
# conditionnel à unreadCount > 0, jamais forcé pendant l'audit initial).

anomalies:
  - id: SEC-098
    titre: >
      Le badge compteur de notifications non lues
      (NotificationBell.tsx:137-142, Badge variant="destructive", visible
      sur toutes les pages authentifiées via le header) et les icônes
      d'alerte de la liste déroulante (XCircle/AlertTriangle, classe
      text-red-500, NotificationBell.tsx:28/52/56, pour
      APPROVAL_REJECTED/PROJECT_STALE/PROJECT_DEADLINE_SOON/TASK_OVERDUE)
      mesurent un contraste sous le seuil WCAG 1.4.3 (4.5:1). Confirmé
      réellement via axe-core (@axe-core/playwright) sur build de
      production : badge compteur 4.07:1 (dashboard-admin), 3.77:1 (crm),
      2.77:1 (ai-assistant), 3.24:1 (dashboard-manager) ; icône d'alerte
      3.69:1 (#fb2c36 sur #fdfbfa). Variabilité du badge compteur
      expliquée par animate-pulse (NotificationBell.tsx:139, actif
      seulement quand hasCritical est vrai — au moins une notification
      non lue d'un type critique) : la pulsation CSS fait osciller
      l'opacité réelle de l'élément dans le temps, donc le ratio mesuré
      dépend de l'instant exact de la capture, avec un pire cas sous
      2.8:1 en creux de pulsation.
    perimetre: transverse
    regle_violee: >
      WCAG 1.4.3 (contraste minimum 4.5:1 pour du texte normal) — le
      badge affiche un nombre (texte), pas un simple indicateur visuel
      sans contenu textuel, donc le seuil texte s'applique bien, pas le
      seuil 3:1 réservé aux éléments non-textuels.
    classe: contraste-badge-alerte-anime-sous-seuil
    gravite: moyenne
    statut: ouvert
    detecte_le: "2026-08-03"
    source: >
      Découverte incidente en vérifiant par axe-core les 4 corrections
      SEC-095/096 autorisées par le porteur (2026-08-03) — un scan
      complémentaire sur dashboard-admin/crm/dashboard-manager/
      ai-assistant a révélé cette violation résiduelle, absente du
      premier rapport d'audit SEC-095/096 du même jour.
    confiance: >
      Élevée — ratio mesuré directement par axe-core (moteur WCAG
      standard) sur un build de production réel, à 4 reprises sur 4
      pages distinctes, cause de la variabilité (animate-pulse)
      identifiée par lecture directe du code (NotificationBell.tsx:139).
    note: >
      Fonction réelle du composant confirmée par lecture directe (pas
      une supposition) : Badge variant="destructive" ne s'affiche que
      lorsque unreadCount > 0 (NotificationBell.tsx:136), affiche le
      nombre de notifications non lues, et devient animate-pulse
      lorsqu'au moins une notification non lue est de type critique
      (hasCritical, ligne 95, testé contre CRITICAL_TYPES) — ce n'est pas
      un élément décoratif mais un indicateur d'alerte fonctionnel lu par
      l'utilisateur pour décider s'il doit consulter ses notifications.
      Un ratio illisible sur ce badge précis dégrade directement
      l'accessibilité d'un signal d'urgence, ce qui justifie une gravité
      moyenne (pas mineure) : contrairement à un badge purement
      décoratif, l'impact ici est qu'un utilisateur malvoyant peut ne pas
      percevoir qu'une notification critique (ex. TASK_OVERDUE,
      PROJECT_DEADLINE_SOON) est en attente.

      Angle mort de méthode du premier audit SEC-096 (2026-08-03) à
      documenter explicitement pour éviter la même omission sur un futur
      audit : le protocole de scan appliqué (scroll vers le bas + retour
      en haut, attente réseau) ne force jamais l'état applicatif
      "au moins une notification non lue" ni l'ouverture du popover de
      notifications — un badge conditionnellement rendu (ici sur
      unreadCount > 0) est structurellement invisible à un scan qui ne
      déclenche pas explicitement les conditions de son rendu, quel que
      soit le nombre de fois où la page est scrollée. Un futur audit
      d'accessibilité sur un composant à rendu conditionnel doit forcer
      l'état (ici : au moins une notification non lue en base pour le
      compte scanné) avant de scanner, pas seulement attendre le réseau
      et scroller.
    critere_de_resolution: >
      Le badge compteur et les icônes d'alerte atteignent 4.5:1 quel que
      soit l'instant de la pulsation (animate-pulse ne doit jamais faire
      descendre l'opacité réelle sous le seuil qui garantit 4.5:1, pas
      seulement au repos) — vérifié par un test réel qui force
      unreadCount > 0 et hasCritical à true, scanne à plusieurs instants
      du cycle de pulsation (ou désactive temporairement l'animation pour
      la mesure), confirme 0 violation axe-core color-contrast sur ces
      deux éléments.
  - id: SEC-097
    titre: >
      Dette technique — Catégorie H (UX/UI et accessibilité) jamais
      ouverte comme audit dédié dans COUVERTURE.yaml, sur aucun des 15
      périmètres (colonne H à null partout, sans exception). Backlog
      post-lancement formalisé le 2026-08-03 (clôture Phase 3 du mandat
      QA) : ne bloque pas le GO au sens du critère de clôture CLAUDE.md
      (seules A/B/G conditionnent la clôture), mais reste un angle mort
      d'audit réel tant qu'aucune session ne balaie H sur un périmètre
      donné.
    perimetre: transverse
    regle_violee: >
      Aucune règle de REFERENTIEL.md n'exige un audit H avant lancement
      (seules A/B/G conditionnent la clôture) — ceci n'est donc pas un
      manquement à une règle existante, seulement un backlog explicite
      pour éviter que "jamais audité" ne se confonde avec "audité et
      sain".
    classe: dette-technique
    gravite: mineure
    statut: actif
    note_degel: >
      Dégelé le 2026-08-03, demande explicite du porteur — cf. mission QA
      close, déclencheur de réexamen rempli (option 2 : demande explicite
      du porteur d'ouvrir un audit catégorie H).
    declencheur_reexamen: >
      Premier des deux : (1) un incident réel d'accessibilité remonté
      par un utilisateur/testeur après lancement, ou (2) toute demande
      explicite du porteur d'ouvrir un audit catégorie H sur un
      périmètre nommé — jamais par défaut ni pour "compléter la
      matrice".
    critere_de_resolution: >
      Un audit H réel est mené sur au moins un périmètre nommé (navigation
      clavier, contraste au-delà du contrôle couleur existant, ARIA sur
      les composants interactifs testés directement), avec anomalies
      trouvées enregistrées sous leurs propres IDs et la cellule
      (périmètre, H) de COUVERTURE.yaml mise à jour avec une date réelle.
  - id: SEC-096
    titre: >
      Dette technique — Aucune mesure formelle de contraste WCAG via un
      outil dédié (axe-core ou équivalent). scripts/check-contrast.mjs
      (étape CI contrast-check) vérifie un contrôle de contraste couleur
      ciblé, pas un audit WCAG complet (ne couvre pas navigation clavier,
      ARIA, focus visible, lecteurs d'écran). Backlog post-lancement
      formalisé le 2026-08-03 (clôture Phase 3 du mandat QA).
    perimetre: transverse
    regle_violee: >
      Aucune règle de REFERENTIEL.md n'exige une certification WCAG
      formelle avant lancement — backlog explicite, pas un manquement.
    classe: dette-technique
    gravite: mineure
    statut: actif
    note_degel: >
      Dégelé le 2026-08-03, demande explicite du porteur — cf. mission QA
      close, déclencheur de réexamen rempli (option 2 : demande explicite
      du porteur d'intégrer axe-core à la CI).
    declencheur_reexamen: >
      Premier des deux : (1) un incident réel d'accessibilité remonté
      après lancement, ou (2) demande explicite du porteur d'intégrer
      axe-core (ou équivalent) à la CI — jamais par défaut.
    critere_de_resolution: >
      axe-core (ou équivalent) intégré à la CI sur les écrans principaux,
      0 violation de niveau critique/sérieux non justifiée par une
      exception documentée (même doctrine que l'exception
      react-refresh/only-export-components de CLAUDE.md).
  - id: SEC-095
    titre: >
      Dette technique — Aucun audit Lighthouse (performance/
      accessibilité/bonnes pratiques) jamais exécuté sur le frontend, à
      aucun stade du projet. Aucune trace dans le dépôt (scripts, CI,
      config) d'un run Lighthouse, historique ou programmé. Backlog
      post-lancement formalisé le 2026-08-03 (clôture Phase 3 du mandat
      QA) — 0 client actif au moment du lancement rend la mesure de
      performance réelle sous charge non représentative de toute façon
      tant qu'il n'y a pas de trafic réel à observer.
    perimetre: transverse
    regle_violee: >
      Aucune règle de REFERENTIEL.md n'exige un audit Lighthouse avant
      lancement — backlog explicite, pas un manquement.
    classe: dette-technique
    gravite: mineure
    statut: actif
    note_degel: >
      Dégelé le 2026-08-03, demande explicite du porteur — cf. mission QA
      close, déclencheur de réexamen rempli (option 2 : demande explicite
      du porteur d'intégrer un run Lighthouse à la CI).
    declencheur_reexamen: >
      Premier des deux : (1) un signal de performance réel remonté après
      lancement (temps de chargement perçu comme lent par un
      utilisateur/testeur), ou (2) demande explicite du porteur
      d'intégrer un run Lighthouse à la CI — jamais par défaut.
    critere_de_resolution: >
      Un run Lighthouse réel exécuté sur les routes principales
      (production build, pas dev server), résultats consignés, toute
      anomalie de score critique enregistrée sous son propre ID.
  - id: SEC-094
    titre: >
      redisConnection.ts#getBullRedisConnection instancie un client
      ioredis (new Redis(...)) avec maxRetriesPerRequest:null et aucun
      retryStrategy borné, appelé au niveau module par queues.ts:19
      (const connection = getBullRedisConnection() — pas paresseux,
      s'exécute à l'import du fichier). Reproduit réellement : pointer
      REDIS_HOST/REDIS_PORT vers un hôte injoignable puis importer
      app.js (donc queues.ts transitivement) fait rester le process
      Node ouvert indéfiniment (connexions ioredis en retry perpétuel
      dans l'event loop) — un simple import, avant toute requête HTTP,
      a mesuré 10.3s avant de résoudre, puis empêché le process de test
      de se terminer proprement des dizaines de minutes après malgré
      des assertions déjà passées
    perimetre: transverse
    regle_violee: >
      Même principe que SEC-084 (une dépendance externe dont
      l'indisponibilité ne doit jamais bloquer indéfiniment), appliqué
      ici à un second client Redis distinct (ioredis via BullMQ) que
      SEC-083/084/085 n'avaient pas couvert — ces trois-là ne
      documentaient que redis.ts#getRedisClient (le package `redis`),
      pas redisConnection.ts#getBullRedisConnection (le package
      `ioredis`, utilisé uniquement par BullMQ).
    classe: ioredis-retry-non-borne-bloque-terminaison-process
    gravite: mineure
    statut: resolu
    critere_de_resolution: >
      getBullRedisConnection borne ses tentatives de connexion (ex.
      retryStrategy avec un nombre maximal de tentatives, ou
      connectTimeout explicite sur les options ioredis) au lieu de
      laisser maxRetriesPerRequest:null retenter indéfiniment sans
      jamais abandonner. Un test réel doit importer app.js (donc
      queues.ts) avec REDIS_HOST/REDIS_PORT pointant vers un hôte
      injoignable et vérifier que le process se termine proprement
      dans un délai borné, sans rester ouvert indéfiniment.
    correctif: >
      getBullRedisConnection passe désormais retryStrategy:
      boundedRetryStrategy (5 tentatives maximum, backoff jusqu'à 2s,
      puis abandon — return null) sur les deux branches (REDIS_URL et
      REDIS_HOST/PORT). maxRetriesPerRequest reste null délibérément
      (exigence réelle de BullMQ pour ses commandes bloquantes, non
      liée à ce défaut). Vérifié réellement : server/test/
      redisUnreachableEndToEnd.test.ts importe app.js (donc queues.ts)
      avec REDIS_HOST/REDIS_PORT/REDIS_URL pointés vers un vrai port
      fermé — le process se termine désormais proprement (exit 0,
      13.3s au total pour les 2 tests), contre un blocage de plusieurs
      dizaines de minutes avant ce correctif. En attente de CI verte
      sur ce commit avant passage à resolu.
    detecte_le: "2026-08-02"
    source: >
      Découverte incidente en écrivant un test end-to-end réel pour
      SEC-083 (GET /health/ready sous Redis injoignable) — le test
      lui-même bloquait des dizaines de minutes après que ses
      assertions avaient déjà réussi ; diagnostic par un fichier de
      test minimal isolant le seul import de app.js (sans aucune
      requête HTTP), confirmant 10.3s avant résolution de l'import puis
      un process qui ne se termine jamais. Lecture de
      redisConnection.ts et queues.ts confirmant l'appel non paresseux
      à getBullRedisConnection() au niveau module et
      maxRetriesPerRequest:null sans aucun retryStrategy.
    confiance: haute
    note: >
      Distinct de SEC-073 (déjà connue : les fichiers de test qui
      importent des services passant par jobs/queues.ts ne se
      terminent pas proprement en isolation) — SEC-073 documente le
      symptôme observable (le process de test ne se termine pas) sans
      identifier sa cause racine exacte ; SEC-094 documente cette cause
      racine précise (ioredis sans retry borné). Les deux seront
      probablement résolues par le même correctif.
  - id: SEC-093
    titre: >
      GlobalSearch.tsx (barre de recherche globale du header AdminLayout)
      utilise une largeur fixe insuffisante sur mobile — sur un viewport
      iPhone 12 (390px), le champ mesure réellement 214px (bounding box
      Playwright confirmée) pour afficher le placeholder FR "Rechercher
      les leads, clients, projets..." (37 caractères), qui déborde
      visuellement et se retrouve coupé net par les icônes
      notification/avatar juste à droite (aucun gap, aucune troncature
      CSS propre type text-overflow:ellipsis visible sur la capture),
      rendant le champ illisible sur mobile
    perimetre: transverse
    regle_violee: >
      Aucune règle métier écrite — attente UX du mandat QA (Phase 2
      point 5, responsive desktop+mobile) : un champ de saisie visible
      doit rester lisible à toute largeur d'écran supportée, pas
      seulement ne pas provoquer de débordement horizontal de page (ce
      dernier point est confirmé sain par ailleurs).
    classe: responsive-champ-trop-etroit-pour-placeholder
    gravite: mineure
    statut: resolu
    critere_de_resolution: >
      Sur un viewport de 390px (iPhone 12), le champ de recherche
      globale affiche son placeholder sans troncature visuelle brutale
      — soit via une largeur relative plus généreuse (moins de contrainte
      max-w sur mobile), soit via un placeholder raccourci sur petit
      écran, soit via un vrai text-overflow:ellipsis. Un test réel doit
      mesurer la bounding box du champ sur ce viewport et vérifier
      qu'elle laisse la place au texte du placeholder réel (pas un texte
      de test raccourci).
    correctif: >
      Diagnostic affiné avant correction : 214px n'était pas une
      contrainte de max-w injustifiée mais l'espace réellement
      disponible dans le header à ce viewport (390px - padding - gap -
      bouton menu - icônes droite = 214px, confirmé par mesure DOM
      réelle des enfants du header) — agrandir le conteneur était donc
      impossible sans réduire les autres éléments. Le vrai correctif :
      placeholder raccourci ("Rechercher..." / "Search...") dans les
      deux locales, qui tient dans l'espace réel disponible même au
      viewport le plus étroit testé (320px). AdminLayout.tsx's wrapper
      passé de max-w-sm fixe à min-w-0 sm:max-w-sm (n'a plus d'effet sur
      mobile mais évite un futur overflow si le header change).
      Confirmé réellement via Playwright : measureText du placeholder
      réel vs espace disponible (canvas 2D), textFits:true sur 320px/
      390px/1440px. Test unitaire GlobalSearch.test.tsx déjà existant
      (accessible-name via i18n.t dynamique) reste vert sans
      modification, confirmant qu'il ne recopiait pas le texte en dur.
    detecte_le: "2026-08-01"
    source: >
      Phase 2 point 5 du mandat QA (responsive desktop+mobile) —
      Playwright réinstallé proprement dans cette session (cache
      ms-playwright supprimé et retéléchargé, résolvant un blocage
      antérieur "Invalid file descriptor to ICU data received").
      Contexte réel iPhone 12 (devices Playwright), login admin réel,
      capture d'écran + mesure programmatique de la bounding box du
      champ de recherche (x:64, width:214, viewport width:390) sur
      /app (dashboard).
    confiance: haute
    note: >
      Distinct de tout défaut de débordement de page — document.
      documentElement.scrollWidth <= clientWidth est confirmé vrai (pas
      de scroll horizontal) sur toutes les pages testées ; c'est un
      défaut interne à un seul composant, pas un défaut de layout
      global.
  - id: SEC-091
    titre: >
      /app/booking (BookingAdminPage.tsx) n'a aucune garde de route par
      rôle — accessible en render direct par URL à un MANAGER connecté
      malgré adminOnly:true sur l'item de menu correspondant
      (AdminLayout.tsx:63, qui masque seulement le lien, pas la route
      elle-même). Reproduit réellement : GET /booking/admin/slots avec un
      token MANAGER réel retourne 403 (Insufficient permissions) côté
      backend — aucune fuite de données — mais BookingAdminPage.tsx
      n'inspecte jamais le rôle ni la réponse 403 pour rediriger ou
      bloquer l'affichage, se contentant d'un toast d'erreur générique
      ("Impossible de charger les réservations.") sur chaque requête
      échouée, laissant la coquille de page (layout, formulaires vides)
      visible à un rôle qui n'a jamais accès aux données réelles
    perimetre: transverse
    regle_violee: >
      Cohérence UI/backend attendue par le mandat QA (Phase 2 point 7) :
      aucune page accessible ne doit exposer une coquille vide/en erreur
      à un rôle qui n'a jamais accès aux données réelles — soit la route
      est gardée (redirection), soit la page distingue "vide" de "accès
      refusé" et agit en conséquence.
    classe: garde-route-frontend-absente-menu-seul-filtre
    gravite: mineure
    statut: resolu
    critere_de_resolution: >
      Un MANAGER connecté qui navigue directement vers /app/booking (URL
      tapée à la main, pas via le menu) est soit redirigé (comme le fait
      déjà ProtectedRoute pour les routes FREELANCER hors allowlist),
      soit voit une page d'accès refusé explicite — jamais la coquille
      de formulaire avec un toast d'erreur générique. Un test réel doit
      naviguer directement vers cette URL avec un compte MANAGER et
      vérifier l'absence de la coquille de formulaire.
    correctif: >
      ProtectedRoute.tsx étendu avec un bloc MANAGER symétrique au bloc
      FREELANCER déjà existant : une liste adminOnlyRoutes (["/app/
      booking"]) redirige vers /app si le MANAGER tente d'y accéder.
      Vérifié réellement via Playwright (login MANAGER réel, navigation
      directe vers /app/booking, URL finale confirmée /app) et via 2
      nouveaux tests Vitest dans ProtectedRoute.test.tsx (redirection
      MANAGER sur booking + non-régression sur commissions, non
      concerné). En attente de commit + CI verte avant passage à resolu
      (doctrine du registre : un correctif non commité reste en_cours).
    detecte_le: "2026-08-01"
    source: >
      Phase 2 point 2 du mandat QA ("accès direct par URL testé, pas
      seulement via le menu") — reproduction réelle : login MANAGER réel
      (manager@secritou.tn), GET /booking/admin/slots avec le token
      obtenu confirme 403 réel côté backend ; lecture de
      BookingAdminPage.tsx confirme l'absence de toute vérification de
      rôle ou de gestion spécifique d'une réponse 403 (seul un toast
      générique existe pour chaque mutation/lecture en échec).
    confiance: haute
    note: >
      Distinct de tout défaut RBAC backend (qui, lui, fonctionne
      correctement — 403 réel confirmé) : c'est un défaut de cohérence
      UI, la seule route de tout le menu marquée adminOnly:true sans
      qu'aucune garde de route ou logique de rôle interne à la page ne
      la double, contrairement à CommissionsPage.tsx qui, elle, adapte
      correctement sa requête selon isManager.
  - id: SEC-089
    titre: >
      Au moins 14 champs texte à travers shared/src/schemas/*.ts (Lead.name,
      Client.name, Document.name/title, Invoice.description/number/title,
      CreditNote.reason, Project.name, Proposal.title, Task.title/content,
      User.name, entre autres) valident via z.string().min(1) sans
      .trim() — une chaîne composée uniquement d'espaces passe la
      validation de longueur (min(1) compte les caractères bruts, pas le
      contenu après trim). Reproduit réellement sur 2 modules distincts
      via l'API réelle : POST /leads {"name":"   "} → 201, POST /clients
      {"name":"   "} → 201 — deux enregistrements visuellement vides
      créés avec succès, invisibles dans toute liste/recherche basée sur
      le nom
    perimetre: transverse
    regle_violee: >
      Aucune règle métier — défaut de robustesse de validation. L'esprit
      de min(1) ("un nom ne peut pas être vide") n'est pas respecté par
      son implémentation, qui ne rejette que la chaîne vide au sens
      strict, pas son équivalent visuel.
    classe: validation-min-sans-trim-contournement-espaces
    gravite: mineure
    statut: resolu
    critere_de_resolution: >
      Les champs concernés utilisent z.string().trim().min(1) (Zod
      trim() transforme la valeur avant validation de longueur, donc
      "   " devient "" et échoue min(1)) — pas seulement Lead.name et
      Client.name testés ici, mais l'ensemble des ~14 champs identifiés
      par grep sur shared/src/schemas/*.ts. Un test réel doit couvrir au
      moins 3 modules distincts (pas seulement les 2 déjà confirmés) et
      vérifier qu'un nom "   " est bien rejeté 422, jamais accepté 201.
    correctif: >
      .trim() ajouté avant .min(1) sur les 14 champs texte libre
      identifiés (client.schema.ts, document.schema.ts,
      invoice.schema.ts, lead.schema.ts, project.schema.ts,
      proposal.schema.ts, task.schema.ts, user.schema.ts,
      clientOnboarding.schema.ts) — task.projectId et user.serviceId
      délibérément exclus (identifiants, pas du texte affiché, un espace
      autour les invaliderait déjà comme UUID). Vérifié réellement,
      re-testant les 2 cas exacts de la découverte : POST /leads
      {"name":"   "} et POST /clients {"name":"   "} répondent désormais
      422 (Validation failed, "String must contain at least 1
      character(s)") au lieu de 201. 783/785 tests server verts (seul
      échec : SEC-069, pré-existant, sans rapport). En attente de
      commit + CI verte avant passage à resolu.
    detecte_le: "2026-08-01"
    source: >
      Phase 1, point 6 du mandat QA (validation Zod cas limites) —
      reproduit réellement contre un serveur réel : POST /leads avec
      name:"   " → 201 (enregistrement créé, confirmé par relecture
