    statut: resolu
    critere_de_resolution: |
      C'est résolu quand tous les champs `z.string()`/`z.string().optional()` de contenu libre (hors identifiants, enums, emails, URLs déjà bornés) dans `shared/src/schemas/*.ts` portent un `.max(n)` cohérent avec les bornes déjà en place ailleurs dans le dépôt (ex. `document.schema.ts`, `invoice.schema.ts`, `proposal.schema.ts`) — vérifié champ par champ, fichier par fichier, pas seulement sur `lead.schema.ts`.
    detecte_le: '2026-07-20'
    source: audit_llm
    confiance: certain
    note: |
      CONSTAT REFORMULÉ AVANT ENREGISTREMENT (vérification demandée explicitement par la procédure d'audit, session 2026-07-20) : le rapport source affirmait que `leadBaseSchema` était « incohérent avec le reste du dépôt » sur ce point précis — vérifié par lecture directe de `shared/src/schemas/client.schema.ts` (`name`/`email`/`phone` sans aucune borne, exactement le même défaut que Lead) et par grep sur les 10 fichiers de `shared/src/schemas/` : le même motif (`z.string()` libre sans `.max()`) apparaît aussi dans `clientOnboarding.schema.ts`, `freelancer.schema.ts`, `project.schema.ts`, `task.schema.ts`. Le motif n'est donc PAS isolé au module Lead — c'est un défaut partagé par plusieurs schémas de base du dépôt, pas une incohérence locale. Gravité laissée `mineur` (aucun de ces champs texte libre ne cause de dépassement de colonne Postgres observé — Prisma/PG tronquerait ou rejetterait selon le type de colonne réel, non vérifié ici) ; portée corrigée pour refléter l'ampleur réelle avant toute correction.
