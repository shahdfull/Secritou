# Registre des anomalies — Secritou
#
# Ce fichier fait partie du registre éclaté (voir CLAUDE.md § « Procédure
# d'audit obligatoire »). Schéma par anomalie : id, titre, perimetre,
# regle_violee, classe, gravite, statut, critere_de_resolution, detecte_le,
# source, confiance, note.
# Ne jamais reformuler un titre existant — citer l'ID.
#
# Périmètre : Transverse (hors modules §4 — CI/infra, docs, RGPD, i18n global, design system, observabilité)
# 1 anomalie(s) — registre remis à zéro le 2026-07-27, historique réel
# archivé sur la branche locale archive/anomalies-avant-reset (commit 3c03297).

anomalies:
  - id: SEC-010
    titre: >
      gdprErasure.test.ts — l'anonymisation d'un Client avec facture
      s'exécute (mode "anonymized" confirmé) mais l'assertion sur
      Invoice.amount.toString() attend "100.000" et obtient "100"
    perimetre: transverse
    regle_violee: >
      RG-025 (export et effacement RGPD, verifie:test) : le test attendu
      comme preuve que l'anonymisation ne touche pas la facture échoue sur
      une assertion de formatage, pas sur le comportement métier lui-même
      (le mode "anonymized" et la survie de la facture sont confirmés par
      les lignes précédentes du même test, elles passent).
    classe: assertion-format-decimal
    gravite: mineure
    statut: resolu
    critere_de_resolution: >
      server/test/gdprErasure.test.ts, cas "a client with an invoice is
      anonymized, not deleted — the invoice survives untouched" doit passer
      au vert. Deux réparations possibles, à trancher (pas déduit du seul
      typecheck, cf. CLAUDE.md « réparer n'est pas développer ») : (a)
      l'assertion attend un format Decimal.js à 3 décimales fixes
      (".000") qui ne correspond pas à ce que Prisma renvoie réellement
      pour ce champ Decimal(14,3) — corriger l'assertion pour matcher le
      format réel ; ou (b) un comportement réel de troncature/formatage
      existe quelque part sur ce chemin et l'assertion a raison de
      l'attendre — à investiguer avant de choisir.
    detecte_le: "2026-07-28"
    source: >
      npm run test:unit --workspace server, session du 2026-07-28 (RG-025,
      demande explicite du porteur de faire tourner typecheck/lint/tests).
      AssertionError strictEqual : actual '100', expected '100.000',
      server/test/gdprErasure.test.ts:72
      (`assert.equal(invoiceStillThere?.amount.toString(), "100.000")`).
      Invoice.amount est Decimal(14,3) en base (schema.prisma) — écrit avec
      la valeur JS 100 à la création du fixture de test (ligne 58, `amount: 100`).
      Pas d'investigation plus poussée dans cette session sur le
      comportement exact de Prisma.Decimal#toString() pour ce champ.
    confiance: moyenne
    note: >
      Hypothèse sur le code, pas tranchée : ni le test ni le code n'ont été
      modifiés dans cette session sur ce point — seul le symptôme exact est
      enregistré, conformément à CLAUDE.md (« un test rouge est une
      hypothèse sur le code, pas un défaut du test »).
    correctif: >
      Option (a) tranchée (AskUserQuestion, session du 2026-07-29) : aucune
      troncature de données réelles n'existe sur ce chemin —
      Prisma.Decimal#toString() ne préserve pas les zéros de fin d'un
      Decimal(14,3) pour la valeur 100, "100" est le format réel et correct.
      L'assertion attendait un format qui n'a jamais correspondu au
      comportement réel de Prisma. Corrigée : `assert.equal(Number(
      invoiceStillThere?.amount), 100)` au lieu de comparer une chaîne
      formatée. Suite complète server (650 tests, 650 pass, 0 fail, 0 skip)
      exécutée sans régression. Commité (954a191) et confirmé vu vert en
      CI sur le commit fdc1363 (run GitHub Actions 30457571233, 6/6 jobs
      verts) — critère de résolution rempli (CLAUDE.md « Un critère de
      résolution se vérifie sur un commit »).

  - id: SEC-017
    titre: >
      Dépendance circulaire creditNote.service.ts <-> invoice.service.ts
      (madge --circular, porte CI "Circular dependency check") — invoice.service.ts
      importe creditNoteService pour la cascade de trop-perçu, creditNote.service.ts
      importait assertInvoiceInScope depuis invoice.service.ts
    perimetre: transverse
    regle_violee: >
      Porte de build CI "Circular dependency check" (`npx madge --circular
      --extensions ts src/`, server/.github/workflows/ci.yml), présente et
      verte 5 jours avant cette session (run 30051176133), rouge sur les 3
      runs suivant le premier commit de cette session — régression réelle
      introduite par un des 15 commits pré-existants poussés en une fois au
      début de cette session, jamais relus individuellement.
    classe: dependance-circulaire
    gravite: moyenne
    statut: resolu
    critere_de_resolution: >
      `npx madge --circular --extensions ts src/` (depuis server/) ne
      rapporte aucun cycle, et la porte CI "Circular dependency check"
      passe au vert sur un commit réel.
    detecte_le: "2026-07-29"
    source: >
      CI run 30456780465 (job server, étape "Circular dependency check") :
      « Found 1 circular dependency! 1) services/creditNote.service.ts >
      services/invoice.service.ts ». Confirmé par lecture directe des deux
      fichiers : invoice.service.ts:11 importe creditNoteService (utilisé
      ligne 280, cascade de trop-perçu automatique) ; creditNote.service.ts:14
      importait assertInvoiceInScope depuis invoice.service.ts (utilisé
      ligne 95, scope MANAGER sur la facture liée à l'avoir).
    confiance: haute
    correctif: >
      assertInvoiceInScope (fonction pure de scope, ne dépendait déjà que de
      ServiceScope et de prismaRead — aucune dépendance réelle au reste
      d'invoice.service.ts) extraite vers server/src/utils/serviceScope.ts,
      même précédent que assertProjectInScope (SEC-041). Les deux services
      importent désormais cette fonction depuis serviceScope.ts, plus aucune
      dépendance mutuelle entre eux. Vérifié : `npx madge --circular`
      propre, typecheck/lint serveur propres, 650/650 tests (0 skip).
      Commité (fdc1363) et confirmé vu vert en CI (run GitHub Actions
      30457571233, 6/6 jobs verts) — critère de résolution rempli.
