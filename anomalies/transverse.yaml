      TEST RÉÉCRIT ET ÉTENDU (constaté déjà réécrit pour appeler le vrai code à la relecture, puis étendu dans cette session, 2026-07-21) : le fichier committé appelait déjà réellement `searchRepository.search` pour 5/9 catégories (leads, clients, tasks, freelancers, proposals). Ajout d'un test couvrant les 4 catégories restantes (`projects`/`invoices`/`serviceRequests`/`approvals`, toutes scopées via `viaProject`/`client.projects.some.serviceId` dans `search.repository.ts:74-90`) — un MANAGER de pôle A ne trouve que ses propres ressources sur les 9 catégories au total désormais. (Note : le titre historique cite « documents » comme 9e catégorie, mais la déstructuration réelle de `searchForStaff` n'en comporte que 9 sans `documents` — le champ n'existe pas dans `SearchResults` pour ce rôle ; écart de titre, pas de code, non corrigé pour ne pas reformuler un titre existant.) Suite complète : 491 tests, 491 pass, 0 fail. `npx tsc --noEmit` propre. Résolu SANS confirmation CI — dérogation explicite du porteur du projet établie plus tôt dans cette session.
