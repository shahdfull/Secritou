# Registre des anomalies — Secritou
#
# Ce fichier fait partie du registre éclaté (voir CLAUDE.md § « Procédure
# d'audit obligatoire »). Schéma par anomalie : id, titre, perimetre,
# regle_violee, classe, gravite, statut, critere_de_resolution, detecte_le,
# source, confiance, note.
# Ne jamais reformuler un titre existant — citer l'ID.
#
# Périmètre : Transverse (hors modules §4 — CI/infra, docs, RGPD, i18n global, design system, observabilité)
# 7 anomalie(s) — registre remis à zéro le 2026-07-27, historique réel
# archivé sur la branche locale archive/anomalies-avant-reset (commit 3c03297).
# +1 le 2026-07-30 (audit B). +1 le 2026-07-30 (découverte incidente en
# corrigeant SEC-032). +1 le 2026-07-30 (découverte incidente en
# contre-vérifiant le nettoyage du module 4.11). +1 le 2026-07-31
# (comparaison search.service.ts vs aiTools.ts demandée par le porteur).
# +2 le 2026-08-01 (Phase 0 de l'audit QA complet — audit de la porte CI
# réelle server/test/run-all.test.ts contre les fichiers *.test.ts
# existant réellement sur disque sous server/test/). +1 le 2026-08-01
# (découverte incidente en exécutant isolément les 5 fichiers de
# SEC-071 avant câblage, sur demande explicite du porteur). +1 le
# 2026-08-01 (découverte incidente en relançant npm run test:coverage
# après câblage SEC-071/réécriture SEC-072, pour confirmer la CI verte
# avant commit). +3 le 2026-08-01 (test de résilience Redis/BullMQ,
# item 12 du mandat QA, arrêt réel du conteneur Redis). +1 le 2026-08-01
# (item 9 du mandat QA, upload malveillant/extension déguisée). +1 le
# 2026-08-01 (item 13 du mandat QA, audit des logs). +1 le 2026-08-01
# (item 6 du mandat QA, cas limites de validation Zod). +1 le
# 2026-08-01 (Phase 2 point 2 du mandat QA, accès direct par URL testé
# au-delà du seul menu). +1 le 2026-08-01 (Phase 2 point 5, responsive
# mobile réel via Playwright une fois le navigateur réinstallé). +1 le
# 2026-08-02 (découverte incidente en écrivant un test end-to-end
# pour SEC-083, demande explicite du porteur d'écrire les tests
# manquants avant de clore le registre). +3 le 2026-08-03 (formalisation
# du backlog post-lancement en dette technique tracée, demande explicite
# du porteur avant validation du GO définitif — Lighthouse, WCAG formel,
# catégorie H — statut gelé avec déclencheur de réexamen écrit, même
# doctrine que SEC-070). +1 le 2026-08-03 (découverte incidente en
# vérifiant par axe-core les 4 corrections SEC-095/096 autorisées par le
# porteur — badge de notification non lue manqué au premier scan car
# conditionnel à unreadCount > 0, jamais forcé pendant l'audit initial ;
# SEC-098 resolu le même jour, commit d249f93, CI verte run 30853761388).
# +2 le 2026-08-03 (deux nouvelles découvertes incidentes en investiguant
# SEC-098 : SEC-099 GrowthBadge du dashboard exécutif, confondu au départ
# avec NotificationBell.tsx par classe CSS identique ; SEC-100 palette
# par défaut du wrapper Sonner, portée élargie confirmée sur 115 appels
# toast.* du projet). +1 le 2026-08-04 (constat de process demandé
# explicitement par le porteur après la 3e occurrence du même défaut de
# traçabilité dans cette mission — SEC-101, statut "resolu" écrit dans
# un fichier de détail sans jamais être répercuté dans _index.yaml).
# +1 le 2026-08-04 (échec CI réel découvert en poussant le correctif
# SEC-075/077 — SEC-102, authRateLimit partagé sans échappatoire test,
# résolu le même jour par un flag distinct E2E_RELAXED_AUTH_RATE_LIMIT).

anomalies:
  - id: SEC-102
    titre: >
      authRateLimit (server/src/middlewares/rateLimit.middleware.ts, 30
      requêtes/15min, compteur en mémoire partagé par IP, sans exception
      pour l'environnement de test) est partagé par TOUS les fichiers
      server/test/*.http.test.ts d'une même exécution
      npm run test:coverage --workspace=server — 24+ appels réels à
      POST /auth/login cumulés dans server/test/run-all.test.ts avant
      même l'ajout du fichier SEC-075/077, chaque nouveau fichier de
      test HTTP rapproche silencieusement la suite du seuil de 30.
    perimetre: transverse
    regle_violee: >
      Un test de non-régression réel ne doit jamais échouer par
      accumulation d'un état global partagé entre fichiers indépendants
      — le rate-limit de sécurité (légitime en production) n'a aucune
      échappatoire dédiée à la suite de tests CI, contrairement à
      sensitiveWriteRateLimit/frequentInteractionRateLimit qui en ont
      déjà une (E2E_RELAXED_RATE_LIMITS, SEC-212).
    classe: rate-limit-partage-sans-echappatoire-test
    gravite: moyenne
    statut: resolu
    critere_de_resolution: >
      authRateLimit dispose d'un opt-in explicite et étroit (jamais actif
      en production, jamais élargi au-delà de sa propre limite) activable
      pour la suite de tests CI, sans élargir aucune autre limite déjà
      couverte par un mécanisme distinct testé (taskUpdateRateLimit.test.ts
      vérifie que sensitiveWriteRateLimit/frequentInteractionRateLimit
      restent à leur valeur réelle dans ce même job — un correctif qui
      les élargirait aussi casserait cette preuve).
    detecte_le: "2026-08-04"
    source: >
      Découvert en poussant le commit SEC-075/077 (44b4573, whitelist
      orderBy + validation FK clientId sur invoice) : le run CI
      30947979863 (job "server") a échoué avec conclusion failure,
      relancé une fois (gh run rerun --failed, run identique) — le
      premier échec (taskBulkActions.test.ts, timing) a disparu au
      rerun, confirmant un flake indépendant ; le second
      (aiConversationStreamCancellation.test.ts,
      "Cannot read properties of undefined (reading 'tokens')") a
      persisté à l'identique sur les deux runs. Diagnostic temporaire
      (console.error inséré puis retiré après capture) sur le corps de
      réponse du login de ce test : "429 Too many authentication
      attempts, please try again later". Cause confirmée par un test de
      contrôle strict : `git checkout 1ed4366 -- server/test/run-all.test.ts
      server/src/repositories/invoice.repository.ts
      server/src/services/invoice.service.ts` (retour à l'état
      immédiatement avant le commit SEC-075/077) puis
      `npx tsx --test test/run-all.test.ts` en local fait repasser
      aiConversationStreamCancellation.test.ts au vert, seul SEC-069
      (pré-existant, sans rapport) subsistant en échec — confirmant que
      le nouveau fichier invoiceFkAndOrderByGuards.http.test.ts
      (un login de plus, 24e+ dans la séquence cumulée) est bien la
      cause du dépassement du seuil de 30/15min, pas mon code
      applicatif lui-même (les 2 suites SEC-075/SEC-077 elles-mêmes
      étaient vertes dans le run CI en échec).
    confiance: haute
    note: >
      E2E_RELAXED_RATE_LIMITS (SEC-212) existait déjà comme mécanisme
      d'opt-in pour la CI, mais élargit aussi
      sensitiveWriteRateLimit/frequentInteractionRateLimit — l'activer
      globalement sur le job "server" a été testé et rejeté (fait
      échouer taskUpdateRateLimit.test.ts, qui asserte explicitement que
      ces deux limites restent à leur valeur réelle 10/min et 60/min
      dans ce même job — un des tests que ce correctif aurait
      silencieusement rendu incapable de détecter une vraie régression
      de sécurité sur ces routes).

      Nouveau flag E2E_RELAXED_AUTH_RATE_LIMIT introduit spécifiquement
      pour authRateLimit seul (server/src/config/env.ts, garde de
      production ajoutée symétriquement à celle de
      E2E_RELAXED_RATE_LIMITS), activé uniquement dans le bloc `env:` du
      job "server" de .github/workflows/ci.yml (pas "e2e", pas de portée
      globale, pas au niveau d'une étape isolée). Corrige au passage un
      message d'erreur de garde en production (env.ts:154) qui
      mentionnait à tort "authRateLimit" comme couvert par
      E2E_RELAXED_RATE_LIMITS, alors que le code ne l'a jamais
      réellement lu sous ce flag avant ce correctif — écart entre
      commentaire et code déjà présent avant cette session, corrigé en
      cohérence avec le nouveau flag distinct plutôt que laissé tel
      quel.

      Preuve locale avant commit : `E2E_RELAXED_AUTH_RATE_LIMIT=true
      npx tsx --test test/run-all.test.ts` → 787 pass, 1 fail (SEC-069
      uniquement), taskUpdateRateLimit.test.ts toujours vert (`ratelimit-limit`
      confirmé à 10/60 selon la route, pas 200). CI verte confirmée : run
      GitHub Actions 30953695348 sur 2af0a82c11c1e85b34b9bf87196b0ebaa9af857d,
      tous les jobs success (dont "server", celui où l'échec s'était
      produit).

  - id: SEC-101
    titre: >
      Le registre n'avait aucune vérification automatique qui rapproche
      un statut "resolu" déclaré d'une preuve réelle (commit cité, CI
      verte associée) au moment où le statut change — la seule garantie
      était la discipline manuelle de l'agent qui fait l'édition YAML,
      dans les deux fichiers (anomalies/_index.yaml et le fichier de
      détail par périmètre) qui doivent pourtant se livrer ensemble
      selon CLAUDE.md. Rien dans le dépôt (CI, script, hook) ne
      détectait une divergence entre les deux, ni ne vérifiait qu'un
      commit_id cité comme preuve existait réellement dans l'historique
      git avant d'accepter un statut "resolu". CORRIGÉ (2026-08-13,
      commit 62b8bb4) — voir critere_de_resolution ci-dessous.
    perimetre: transverse
    regle_violee: >
      CLAUDE.md « Cohérence obligatoire REFERENTIEL.md ↔ anomalies/*.yaml »
      et « Un critère de résolution se vérifie sur un commit » énoncent
      la règle mais ne sont vérifiées par aucun outil — seulement relues
      manuellement par l'agent au moment de l'édition, donc aussi
      fiables que la vigilance de la session qui édite le fichier ce
      jour-là.
    classe: registre-statut-resolu-sans-verification-automatique
    gravite: moyenne
    statut: resolu
    critere_de_resolution: >
      Un mécanisme (script CI ou hook) existe qui, pour toute anomalie
      passée à `resolu` dans un commit, vérifie automatiquement que (a)
      `_index.yaml` et le fichier de détail du périmètre portent le même
      statut pour cet ID (pas de divergence), et (b) tout commit cité
      comme preuve dans le texte de l'anomalie existe réellement dans
      l'historique git (`git cat-file -e <sha>` ou équivalent) — sans
      vérifier le contenu du commit ni la substance de la preuve,
      seulement son existence matérielle. — SATISFAIT le 2026-08-13 :
      job CI `anomaly-registry-check` (option "job CI dédié" choisie par
      le porteur, plutôt que le hook pre-commit local envisagé comme
      alternative en `note`), `scripts/check-anomaly-registry.mjs`.
      Testé localement contre les 2 régressions ciblées avant de
      committer (divergence de statut créée puis restaurée, SHA
      halluciné puis restauré, ID manquant dans chaque sens puis
      restauré — 3 scénarios, tous détectés). Commit `62b8bb4`, CI verte
      confirmée (run
      https://github.com/shahdfull/Secritou/actions/runs/31650058307,
      job `anomaly-registry-check: success` explicitement vérifié, pas
      seulement le run global).
    detecte_le: "2026-08-04"
    resolu_le: "2026-08-13"
    source: >
      Demande explicite du porteur après la vérification SEC-066 (session
      du 2026-08-04, avant le traitement du lot des 17 anomalies
      restantes) : le porteur a noté qu'il s'agissait de la 3e
      occurrence du même mécanisme de défaut dans cette mission
      (SEC-095/SEC-096 le 2026-08-03, puis SEC-066/SEC-071/SEC-072 le
      2026-08-04 — 5 anomalies distinctes touchées au total), demandant
      l'ouverture d'une anomalie sur le mécanisme lui-même plutôt que de
      continuer à corriger les symptômes un par un sans jamais adresser
      la cause commune.
    confiance: haute
    note: >
      Proposition de mécanisme (non implémentée, à valider par le
      porteur avant tout correctif — cette anomalie est un rapport,
      pas une décision d'implémentation) :

      Un script `scripts/check-anomaly-registry.mjs` (ou équivalent),
      exécuté comme étape CI dédiée (nouveau job dans
      .github/workflows/ci.yml, à côté de contrast-check et
      restore-smoke-test qui suivent déjà ce modèle de vérification
      ciblée), qui :

      1. Parse anomalies/_index.yaml et chaque anomalies/<perimetre>.yaml
      référencé, et échoue si un même ID porte un `statut` différent
      entre les deux fichiers — aurait détecté SEC-066/071/072
      immédiatement au moment du commit 7c0ab6e (2026-08-01) plutôt que
      3 jours plus tard sur une relecture manuelle demandée par le
      porteur.

      2. Pour toute anomalie `statut: resolu` dont le texte (titre, note,
      note_resolution, critere_de_resolution) contient un motif
      ressemblant à un SHA de commit (regex sur hex 7-40 caractères
      précédé d'un mot-clé "commit"), vérifie que ce SHA existe dans
      l'historique git du dépôt (`git cat-file -e` ou
      `git merge-base --is-ancestor <sha> HEAD`) — pas plus. N'évalue
      pas si le commit contient réellement le correctif décrit, ni si
      la CI a réellement tourné verte dessus (ça resterait à la
      discipline de l'agent au moment de la rédaction) : seulement que
      la preuve citée n'est pas un SHA halluciné ou une faute de frappe.

      3. Volontairement PAS de vérification de contenu/sémantique (trop
      coûteux à maintenir, hors de portée d'un script de garde simple)
      — seulement l'existence matérielle de la preuve citée et la
      cohérence inter-fichiers du statut, les deux points qui ont
      concrètement fait défaut sur les 5 occurrences de cette mission.

      Alternative plus légère envisageable si le porteur juge un nouveau
      job CI disproportionné à ce stade (0 client actif, backlog
      post-lancement) : un hook `pre-commit` local plutôt qu'une porte
      CI bloquante — détecte le même défaut avant qu'il n'entre dans
      l'historique, mais ne protège pas contre un commit qui contourne
      le hook. Arbitrage à faire avec le porteur, pas tranché ici.

      Observation additionnelle (2026-08-10, SEC-070 Phase A, pas une
      nouvelle anomalie — même pattern de fond, notée ici pour référence
      si ce chantier de garde est un jour repris) : le changement
      d'image `postgres` pour pgvector n'a été appliqué qu'à
      `docker-compose.yml`/`docker-compose.prod.yml` dans un premier
      temps — `.github/workflows/ci.yml` déclare son propre service
      Postgres pour 3 jobs (`server`, `restore-smoke-test`, `e2e`),
      totalement indépendant de ces deux fichiers compose, et n'a été
      découvert en divergence que par l'échec réel du run CI ("extension
      \"vector\" is not available"), pas anticipé au moment du plan.
      Même défaut structurel que le registre d'anomalies : une
      configuration dupliquée dans plusieurs fichiers sans garde qui
      détecte automatiquement une divergence entre eux — ici entre
      fichiers d'infrastructure plutôt qu'entre fichiers du registre.
  - id: SEC-100
    titre: >
      Le wrapper Toaster (client/src/components/ui/sonner.tsx) active
      richColors (App.tsx:45) sans définir de classNames pour les
      couleurs sémantiques success/error/info dans toastOptions —
      toastOptions.classNames ne couvre que toast/description/
      actionButton/cancelButton génériques, jamais les variantes
      data-type='success'|'error'|'info' que richColors introduit.
      Sonner applique donc ses propres couleurs par défaut (palette HSL
      intégrée à la librairie, jamais dérivée des tokens --* du projet)
      à tout appel toast.success/error/info.
    perimetre: transverse
    regle_violee: >
      WCAG 1.4.3 — le titre ET la description du toast (data-description
      hérite de la couleur du titre sous richColors via color: inherit,
      confirmé en lisant node_modules/sonner/dist/styles.css) sont du
      texte informatif, pas un ornement.
    classe: contraste-composant-tiers-non-stylise-large-portee
    gravite: elevee
    statut: resolu
    detecte_le: "2026-08-03"
    source: >
      Découverte incidente en investiguant SEC-098 (2026-08-03) — un scan
      axe-core complémentaire sur la page de login (juste après un
      login réussi, avant la navigation complète vers /app) a révélé ce
      toast de succès sous le seuil, en dehors du périmètre de
      NotificationBell.tsx alors en cours de correction.
    confiance: >
      Élevée — les 3 palettes HSL (success/info/error) lues directement
      dans node_modules/sonner/dist/styles.css, ratios calculés via
      Playwright (canvas 2D, conversion HSL->RGB réelle du navigateur)
      contre les couleurs de fond de la même palette, pas une estimation.
      Portée (115 appels, répartition par type) confirmée par grep exact
      sur client/src, pas une extrapolation.
    note: >
      PORTÉE — distinct des anomalies de contraste précédentes (SEC-095
      à SEC-099), qui portaient chacune sur un composant applicatif
      isolé : celle-ci est un défaut À LA SOURCE, dans la configuration
      du wrapper partagé (sonner.tsx), qui affecte potentiellement les
      115 appels toast.* recensés dans client/src (grep exact :
      80 toast.error, 33 toast.success, 2 toast.info — aucun usage de
      toast.warning/loading/promise dans ce projet). Ce n'est pas 115
      défauts isolés à corriger un par un : c'est un seul point de
      configuration non stylisé, ce qui change la stratégie de
      correction (probablement un correctif centralisé dans
      toastOptions.classNames de sonner.tsx, à confirmer séparément —
      aucune proposition de correctif dans ce rapport, demande explicite
      du porteur d'attendre le constat complet avant de discuter
      stratégie).

      Ratios mesurés pour les 3 types réellement utilisés, tous sous le
      seuil mais à un écart faible et cohérent entre eux (ce qui suggère
      une origine commune — la palette par défaut de la librairie — plutôt
      que 3 défauts indépendants) :
        - success : #008a2e sur #ecfdf3 (rgb(0,138,46) sur rgb(236,253,243))
          -> 4.26:1
        - info    : #0973dc sur #f0f8ff (rgb(9,115,220) sur rgb(240,248,255))
          -> 4.35:1
        - error   : #e60000 sur #fff0f0 (rgb(230,0,0) sur rgb(255,240,240))
          -> 4.35:1
      (warning non mesuré : aucun usage toast.warning trouvé dans le
      projet, donc sans objet à ce stade — à mesurer seulement si un
      futur usage l'introduit.)

      Gravité élevée (pas moyenne comme SEC-098/SEC-099) : la largeur de
      l'impact (3 couleurs sémantiques sur un composant partagé par 115
      points d'appel, potentiellement toute action de l'application qui
      notifie l'utilisateur d'un succès ou d'un échec) justifie un cran
      au-dessus d'un défaut de composant isolé — c'est la portée qui
      motive le cran de gravité, pas la sévérité individuelle de chaque
      ratio (tous à moins de 0.25 point du seuil, un écart faible pris
      composant par composant).
    critere_de_resolution: >
      Rempli. Palette validée par le porteur avant implémentation
      (red-700/red-50, emerald-700/emerald-50, blue-600/blue-50 inchangé),
      dérivée de la convention -600/-700-sur--50 déjà utilisée ailleurs
      dans le projet plutôt que de couleurs inventées. Correctif
      centralisé dans sonner.tsx (toastOptions.classNames.success/error/
      info), un seul point de configuration plutôt que les 115 sites
      d'appel. Ratios vérifiés après implémentation (pas seulement en
      théorie) : error 3.65:1 -> 5.91:1, success 3.58:1 -> 5.21:1
      (jamais mesuré avant ce correctif), info déjà conforme (4.75:1,
      inchangé). Grep préalable confirmé : aucun des 115 sites d'appel
      ne passe de className custom en conflit avec ce changement
      centralisé. Héritage data-description -> couleur du titre confirmé
      par test réel après le changement (pas seulement supposé de la
      lecture du CSS de la librairie). 3 types testés réellement :
      success/error via e2e (login réussi/échoué, axe-core sur le DOM
      réel) — info via test unitaire (sonner.test.tsx, vrai import du
      module sonner, pas un mock) car ses 2 seuls sites d'appel réels
      (ClientOnboardingPage.tsx/ClientBriefPage.tsx) dépendent d'une
      étape questionnaire/brief en cours, trop profonde à monter pour un
      test de contraste isolé — décision prise en autonomie pendant le
      correctif, confirmée a posteriori par le porteur. warning/loading/
      promise non stylisés (aucun usage réel dans le projet, confirmé
      par grep — pas de code mort anticipé). Commit de preuve : 1e0035c,
      CI verte confirmée (run 30938645198, 6/6 jobs, 11/11 tests e2e
      dont les 2 nouveaux sonner-palette-contrast.spec.ts).
  - id: SEC-099
    titre: >
      GrowthBadge (client/src/features/dashboard/DashboardPage.tsx:78-87)
      — indicateur de croissance/décroissance affiché sur les KPI du
      tableau de bord exécutif (HeroStat lignes 244/251/257, sur fond
      --card blanc ; CompactStat lignes 310/316/322/327, sur fond
      --background) — utilise text-red-500 pour une valeur négative,
      mesuré sous le seuil WCAG 1.4.3 (4.5:1) : 3.76:1 sur --card, 3.65:1
      sur --background, cohérent avec le 3.69:1 mesuré par axe-core lors
      de l'investigation SEC-098 (le composant avait d'abord été confondu
      avec NotificationBell.tsx à cause de la classe CSS identique
      text-red-500, avant vérification du HTML réel remonté par axe qui
      a révélé qu'il s'agissait de ce composant distinct sur
      DashboardPage.tsx).
    perimetre: transverse
    regle_violee: >
      WCAG 1.4.3 — la valeur de croissance affichée (ex. "-12%") est un
      texte numérique informatif, pas un simple ornement, le seuil texte
      4.5:1 s'applique.
    classe: contraste-kpi-financier-sous-seuil
    gravite: moyenne
    statut: resolu
    detecte_le: "2026-08-03"
    source: >
      Découverte incidente en vérifiant par axe-core le correctif
      SEC-098 (2026-08-03).
    confiance: >
      Élevée — ratio calculé depuis les valeurs hex réelles de Tailwind
      (red-500 #ef4444) contre les tokens --card/--background du projet,
      cohérent avec le ratio mesuré par axe-core sur le HTML réel.
    note: >
      Fonction réelle confirmée par lecture directe : GrowthBadge affiche
      un pourcentage de variation (calculateGrowth, DashboardPage.tsx:89-96)
      pour un KPI financier de premier plan — le premier des 3 "hero
      stats" du tableau de bord exécutif est la trésorerie du mois en
      cours (HeroStat label={t("exec.cashMTD")}, ligne 245). Pas un
      indicateur décoratif : un utilisateur malvoyant ne percevrait pas
      qu'un KPI financier est en baisse. Même famille de défaut que
      SEC-098 (composant fonctionnel d'alerte/statut, pas cosmétique),
      gravité alignée en conséquence (moyenne, pas élevée — contrairement
      à SEC-100, ce défaut touche un seul composant à 2 sites d'usage,
      pas 115 points d'appel partageant une source commune).
    critere_de_resolution: >
      Rempli. text-red-500 -> text-red-600, même correctif que les icônes
      d'alerte de SEC-098 (cohérence de palette). Vérifié réellement sur
      les deux fonds où le composant apparaît (pas seulement l'un des
      deux) : 3.76:1 -> 4.83:1 sur --card, 3.65:1 -> 4.68:1 sur
      --background. Test e2e dédié (growth-badge-contrast.spec.ts) force
      une valeur de croissance négative réelle (-12%) via mock de
      GET /analytics/executive, scanne via axe-core. Commit de preuve :
      570f949, CI verte confirmée (run 30938645198, 6/6 jobs).
  - id: SEC-098
    titre: >
      Le badge compteur de notifications non lues
      (NotificationBell.tsx:137-142, Badge variant="destructive", visible
      sur toutes les pages authentifiées via le header) et les icônes
      d'alerte de la liste déroulante (XCircle/AlertTriangle, classe
      text-red-500, NotificationBell.tsx:28/52/56, pour
      APPROVAL_REJECTED/PROJECT_STALE/PROJECT_DEADLINE_SOON/TASK_OVERDUE)
      mesuraient un contraste sous le seuil WCAG 1.4.3 (4.5:1). Confirmé
      réellement via axe-core (@axe-core/playwright) sur build de
      production : badge compteur 4.07:1 (dashboard-admin), 3.77:1 (crm),
      2.77:1 (ai-assistant), 3.24:1 (dashboard-manager) ; icône d'alerte
      3.69:1 (#fb2c36 sur #fdfbfa). Variabilité du badge compteur
      expliquée par animate-pulse (NotificationBell.tsx:139, actif
      seulement quand hasCritical est vrai — au moins une notification
      non lue d'un type critique) : la pulsation CSS faisait osciller
      l'opacité réelle de l'élément dans le temps, donc le ratio mesuré
      dépendait de l'instant exact de la capture, avec un pire cas sous
      2.8:1 en creux de pulsation.
    perimetre: transverse
    regle_violee: >
      WCAG 1.4.3 (contraste minimum 4.5:1 pour du texte normal) — le
      badge affiche un nombre (texte), pas un simple indicateur visuel
      sans contenu textuel, donc le seuil texte s'applique bien, pas le
      seuil 3:1 réservé aux éléments non-textuels.
    classe: contraste-badge-alerte-anime-sous-seuil
    gravite: moyenne
    statut: resolu
    detecte_le: "2026-08-03"
    source: >
      Découverte incidente en vérifiant par axe-core les 4 corrections
      SEC-095/096 autorisées par le porteur (2026-08-03) — un scan
      complémentaire sur dashboard-admin/crm/dashboard-manager/
      ai-assistant a révélé cette violation résiduelle, absente du
      premier rapport d'audit SEC-095/096 du même jour.
    confiance: >
      Élevée — ratio mesuré directement par axe-core (moteur WCAG
      standard) sur un build de production réel, à 4 reprises sur 4
      pages distinctes, cause de la variabilité (animate-pulse)
      identifiée par lecture directe du code (NotificationBell.tsx:139).
    note: >
      Fonction réelle du composant confirmée par lecture directe (pas
      une supposition) : Badge variant="destructive" ne s'affiche que
      lorsque unreadCount > 0 (NotificationBell.tsx:136), affiche le
      nombre de notifications non lues, et devient animate-pulse
      lorsqu'au moins une notification non lue est de type critique
      (hasCritical, ligne 95, testé contre CRITICAL_TYPES) — ce n'est pas
      un élément décoratif mais un indicateur d'alerte fonctionnel lu par
      l'utilisateur pour décider s'il doit consulter ses notifications.
      Un ratio illisible sur ce badge précis dégrade directement
      l'accessibilité d'un signal d'urgence, ce qui justifie une gravité
      moyenne (pas mineure) : contrairement à un badge purement
      décoratif, l'impact ici est qu'un utilisateur malvoyant peut ne pas
      percevoir qu'une notification critique (ex. TASK_OVERDUE,
      PROJECT_DEADLINE_SOON) est en attente.

      Angle mort de méthode du premier audit SEC-096 (2026-08-03) à
      documenter explicitement pour éviter la même omission sur un futur
      audit : le protocole de scan appliqué (scroll vers le bas + retour
      en haut, attente réseau) ne force jamais l'état applicatif
      "au moins une notification non lue" ni l'ouverture du popover de
      notifications — un badge conditionnellement rendu (ici sur
      unreadCount > 0) est structurellement invisible à un scan qui ne
      déclenche pas explicitement les conditions de son rendu, quel que
      soit le nombre de fois où la page est scrollée. Un futur audit
      d'accessibilité sur un composant à rendu conditionnel doit forcer
      l'état (ici : au moins une notification non lue en base pour le
      compte scanné) avant de scanner, pas seulement attendre le réseau
      et scroller.
    critere_de_resolution: >
      Rempli. Icônes d'alerte : text-red-500 -> text-red-600 (4.68:1)
      sur les 3 occurrences (APPROVAL_REJECTED/PROJECT_STALE/
      PROJECT_DEADLINE_SOON/TASK_OVERDUE). Badge : remplacé
      animate-pulse (opacity) par une nouvelle animation dédiée
      animate-alert-pulse qui pulse box-shadow/scale au lieu de
      l'opacité — le texte reste à sa couleur pleine (déjà conforme,
      4.63:1) tout le cycle, donc le ratio ne varie plus jamais dans le
      temps. Ajoutée à la règle prefers-reduced-motion existante. Test
      e2e dédié (e2e/notification-bell-contrast.spec.ts) force
      unreadCount>0 + TASK_OVERDUE non lue via mock API, scanne à 2
      instants du cycle d'animation (0s et +1s) et avec le popover
      ouvert (icônes) : 0 violation color-contrast confirmée à chaque
      fois. @axe-core/playwright ajouté comme vraie devDependency (pas
      seulement copié pour vérification manuelle) pour que ce test
      tourne réellement en CI. Commits de preuve : 01cbc1e (correctif),
      d249f93 (correction de la régression GlobalSearch.test.tsx
      introduite par le commit précédent SEC-095/096) — CI verte
      confirmée sur d249f93 (run 30853761388, 6/6 jobs).
  - id: SEC-097
    titre: >
      Dette technique — Catégorie H (UX/UI et accessibilité), PÉRIMÈTRE
      RESTREINT après le dégel du 2026-08-03. À l'origine (créée le
      2026-08-03) : "colonne H à null partout, sans exception" sur les
      15 périmètres. Le dégel du même jour (demande explicite du
      porteur) a produit un audit axe-core/Lighthouse réel qui a trouvé
      et résolu 3 anomalies concrètes — SEC-098 (badge notification +
      icônes d'alerte, commits 01cbc1e/d249f93), SEC-099 (GrowthBadge
      dashboard, commit 570f949), SEC-100 (palette Sonner success/error/
      info, portée 115 sites d'appel, commit 1e0035c) — toutes CI verte
      confirmée. Ce n'était donc pas un audit resté sans suite : le
      contraste couleur, une bonne part du contenu réel de la catégorie
      H, a été audité et corrigé. Seuls 3 sous-points n'ont jamais été
      traités et restent dans le périmètre de cette entrée après son
      regel : Tests Offline (comportement de l'app en perte de
      connexion, notamment pendant un stream SSE IA — lien direct avec
      SEC-082/SEC-090 déjà résolues sur un autre angle), Tests PWA
      (installabilité — manifest.json/service worker jamais vérifiés,
      ni confirmés absents ni confirmés présents), Tests des
      notifications Toast/Alert au-delà du contraste (role="alert"/
      aria-live sur les toasts réellement déclenchés — SEC-100 a
      couvert la couleur, pas la sémantique ARIA du composant).
    perimetre: transverse
    regle_violee: >
      Aucune règle de REFERENTIEL.md n'exige un audit H complet avant
      lancement (seules A/B/G conditionnent la clôture) — ceci reste un
      backlog explicite, pas un manquement à une règle existante. Le
      dégel du 2026-08-03 a montré que le sous-ensemble contraste de H
      contenait des défauts réels (SEC-098/099/100), donc "jamais
      audité" aurait été un vrai risque s'il n'avait pas été vérifié —
      mais ce risque est maintenant traité pour le contraste, pas pour
      les 3 sous-points restants.
    classe: dette-technique
    gravite: mineure
    statut: resolu
    note_degel: >
      Dégelé le 2026-08-03 (demande explicite du porteur), a produit
      3 correctifs réels (SEC-098/099/100, tous resolu avec CI verte
      confirmée sur chaque commit). Regelé le 2026-08-04 (demande
      explicite du porteur) : le périmètre qui avait motivé le dégel
      (impact réel, mesurable, corrigeable) est traité. Le regel portait
      sur les 3 sous-points jamais audités listés dans le titre — pas
      sur la catégorie H entière ni sur les 14 autres périmètres §4.
      Dégelé une seconde fois le 2026-08-10 (demande explicite du
      porteur) spécifiquement pour traiter ces 3 sous-points.
    declencheur_reexamen: >
      N/A — résolu. Un futur signal fort (incident réel post-lancement
      sur offline/PWA/notifications) rouvrirait un nouvel ID, pas
      celui-ci (cf. interdiction de reformulation, CLAUDE.md).
    critere_de_resolution: >
      Pour chacun des 3 sous-points restants : un test réel (pas une
      lecture de code statique) tranchant la question factuelle avant
      tout jugement — PWA : manifest/service worker présents ou non,
      documenté explicitement comme "non applicable" si absents plutôt
      que "non testé" ; Offline : coupure réseau simulée pendant un tour
      SSE IA en cours, vérifie qu'aucun état incohérent n'est persisté ;
      Notifications : scan role="alert"/aria-live sur un toast
      réellement déclenché, pas une lecture statique du composant.
      Anomalies trouvées enregistrées sous leurs propres IDs, cellule
      (transverse, H) de COUVERTURE.yaml mise à jour avec la date réelle
      du jour où ces 3 sous-points auront été effectivement testés.
    resultat_par_sous_point: >
      Testé réellement le 2026-08-13 (session dégel du 2026-08-10) :
      (1) PWA — aucun manifest.json/manifest.webmanifest,
      aucun navigator.serviceWorker.register, aucune dépendance
      vite-plugin-pwa/workbox, aucun objectif produit documenté dans
      REFERENTIEL.md. Fait : PWA non implémentée, jamais un objectif —
      pas une anomalie, aucun ID ouvert. (2) Notifications — toast.error
      réellement déclenché (échec de connexion) et inspecté en DOM live :
      le toast lui-même n'a ni role ni aria-live propre, mais Sonner
      l'encapsule dans <section aria-live="polite" aria-atomic="false"
      aria-relevant="additions text" aria-label="Notifications alt+T">
      confirmée contenant le texte réel de l'erreur — le message EST
      annoncé à un lecteur d'écran. Nuance WCAG non retenue comme
      anomalie (décision du porteur, 2026-08-13) : la politesse est
      "polite" et non "assertive" pour les erreurs, mais aucune prop
      ToasterProps ne permet de la configurer (câblé en dur dans
      node_modules/sonner/dist/index.mjs) — patcher une librairie tierce
      pour ce gain marginal jugé disproportionné, documenté ici comme
      limite connue, aucun ID ouvert. (3) Offline pendant un stream SSE
      IA — testé avec coupure réseau réelle (proxy TCP local +
      socket.destroy() sur la connexion déjà établie, méthode plus
      fiable que context.setOffline(true) de Playwright, qui ne coupe
      PAS une connexion HTTP déjà établie vers localhost — seulement le
      trafic sortant futur du navigateur ; limite de méthode de test à
      connaître pour quiconque relira cette anomalie et voudrait
      reproduire un test offline similaire avec cet outil) pendant un
      tour IA en cours : aucune corruption de donnée constatée
      (persistance atomique et tardive, cf. SEC-035/SEC-082), mais le
      tour Ollama continue jusqu'à sa fin naturelle et se persiste
      malgré la coupure — res.on("close") ne se déclenche pas sur ce
      type de coupure précis, contrairement au cas déjà couvert par
      SEC-082 (abandon propre via fetch AbortController.abort()).
      Anomalie distincte ouverte sous SEC-110 (gravité moyenne, même
      classe que SEC-082, critère de résolution propre) — décision du
      porteur (2026-08-13) : documenter la limite de méthode ici, pas de
      test supplémentaire dans l'immédiat (SEC-110 reste le porteur du
      suivi technique). Comportement hors contexte IA (navigation
      générale pendant une coupure) : non vérifiable, aucun signal
      existant dans le code (pas d'indicateur de connexion global) — non
      documenté comme anomalie faute de preuve.
    statut_par_sous_point: >
      Décision du porteur (2026-08-13), les 3 sous-points ne se
      referment pas au même statut : (1) PWA — clos, fait documenté,
      aucun suivi. (2) Notifications — statut SURVEILLANCE (même modèle
      que SEC-107, pas "clos silencieusement") : patcher Sonner pour
      passer les toasts d'erreur en aria-live="assertive" jugé
      disproportionné pour ce gain (le message est déjà annoncé en
      "polite"), mais le sujet reste suivi. Déclencheur de réexamen :
      une future version de Sonner expose nativement une prop de
      configuration du niveau aria-live par toast (à vérifier au
      changelog lors d'un futur upgrade de la dépendance) — jamais par
      date automatique ni par simple doute. (3) Offline SSE IA — clos
      pour SEC-097 (aucune corruption de donnée, le risque métier
      couvert par ce sous-point est écarté), mais le constat technique
      distinct vit sous SEC-110, qui reste ouvert. Cellule (transverse,
      H) de COUVERTURE.yaml mise à jour avec la date du jour.
  - id: SEC-096
