# Matrice de couverture d'audit — Secritou
#
# Lignes : les 14 modules de REFERENTIEL.md §4 (+ une ligne "transverse" pour
# ce qui n'appartient à aucun module, cohérent avec anomalies/transverse.yaml).
# Colonnes : les 10 catégories d'audit A-J (voir liste ci-dessous).
# Chaque cellule : date ISO du dernier balayage ACTIF de cette catégorie sur
# ce périmètre, ou null si jamais balayé.
#
# Matrice remise à zéro le 2026-07-27 (décision explicite du porteur du
# projet) : on repart avec un système d'audit vierge, aucun périmètre n'est
# considéré comme déjà balayé dans ce nouveau système. L'historique réel
# (dates reconstituées depuis AUDIT_GRID.md / AUDIT_MATURITE_SECRITOU.md) est
# archivé sur la branche locale archive/anomalies-avant-reset (commit
# 3c03297), pas perdu — seulement retiré de ce fichier.
#
# Catégories A-J (poids, à confirmer/ajuster avec le porteur du projet si un
# futur document de maturité les redéfinit) :
#   A. Sécurité applicative — 18%
#   B. Intégrité des données — 15%
#   C. Performance et scalabilité — 10%
#   D. Fiabilité opérationnelle / DevOps — 10%
#   E. Couverture et qualité des tests — 10%
#   F. Conception API et cohérence des contrats — 6%
#   G. Exactitude métier et financière — 15%
#   H. UX/UI et accessibilité — 8%
#   I. Qualité et fiabilité de la documentation — 3%
#   J. Maturité du processus de release / CI-CD — 5%
#
# Règle de mise à jour (voir aussi CLAUDE.md) : avant de choisir un périmètre
# à auditer, lire cette matrice et prioriser la combinaison (perimetre,
# categorie) jamais balayée ou la plus ancienne — sauf signal plus fort
# (commit récent touchant ce périmètre, anomalie critique connue). Chaque
# audit doit mettre à jour la cellule (perimetre, categorie) réellement
# balayée avec la date du jour, à la fin de la session — jamais une autre
# cellule par supposition.

