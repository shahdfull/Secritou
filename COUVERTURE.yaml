# Matrice de couverture d'audit — Secritou
#
# Lignes : les 14 modules de REFERENTIEL.md §4 (+ une ligne "transverse" pour
# ce qui n'appartient à aucun module, cohérent avec anomalies/transverse.yaml).
# Colonnes : les 10 catégories d'audit A-J de AUDIT_MATURITE_SECRITOU.md.
# Chaque cellule : date ISO du dernier balayage ACTIF de cette catégorie sur
# ce périmètre, ou null si jamais balayé (ou si seule une source
# "historique" au sens de REFERENTIEL.md §0 — audit/*.md, rounds 1-9 —
# en parle, ce qui ne compte pas comme balayage actif, décision du porteur
# du projet, session du 2026-07-27).
#
# Sources retenues comme faisant foi (verifie: session, pas de simple
# citation) :
#   - AUDIT_GRID.md (2026-07-17, mise à jour Lead 2026-07-22) : grille CRUD
#     exhaustive des 24 entités §3, lecture directe. Couvre surtout la
#     catégorie B (Intégrité des données) et partiellement G (Exactitude
#     métier) module par module — pas de couverture par module pour les
#     8 autres catégories dans ce document.
#   - AUDIT_MATURITE_SECRITOU.md v5 (git: 2026-07-25) : balayage actif des
#     catégories A (Sécurité applicative) et D (Fiabilité opérationnelle/
#     DevOps), mais de façon GLOBALE/transverse (routes, secrets, alertes
#     monitoring) — jamais périmètre par périmètre. Faute d'un grain plus
#     fin, cette date est appliquée à TOUTES les lignes pour A et D
#     (décision du porteur, session du 2026-07-27) : traiter comme un
#     balayage valable pour chaque périmètre, pas comme une preuve ciblée.
#   - anomalies/ (git: 2026-07-27) : date de la migration de structure du
#     registre, PAS un balayage — n'alimente aucune cellule de cette matrice.
#
# Catégories A-J (poids, AUDIT_MATURITE_SECRITOU.md §2) :
#   A. Sécurité applicative — 18%
#   B. Intégrité des données — 15%
#   C. Performance et scalabilité — 10%
#   D. Fiabilité opérationnelle / DevOps — 10%
#   E. Couverture et qualité des tests — 10%
#   F. Conception API et cohérence des contrats — 6%
#   G. Exactitude métier et financière — 15%
#   H. UX/UI et accessibilité — 8%
#   I. Qualité et fiabilité de la documentation — 3%
#   J. Maturité du processus de release / CI-CD — 5%
#
# Règle de mise à jour (voir aussi CLAUDE.md) : chaque audit doit mettre à
# jour la cellule (perimetre, categorie) réellement balayée avec la date du
# jour, à la fin de la session — jamais une autre cellule par supposition.

